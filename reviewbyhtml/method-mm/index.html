<script id="initial-board" type="application/json">{"id": "weibull-method-mm-20261102", "title": "矩估计 MM · 原文与实现", "document": true, "revision": 1, "require_confirmation": true, "archive_plan": "依据最终确认的逐项决定修改 D:/weibull/python/methods/mm.py 及实际共用辅助函数，同步方法说明、流程引用和测试；保留同一方法入口，不新建原文/工程分支。先展示具体修改与核对结果，再完成本方法审定记录 D:/weibull/docs/method-reviews/mm.md。未决定的算法问题保持现状；历史数据不重算，不推送或部署。", "units": [{"id": "identity", "title": "1 三个Weibull矩与显式解", "mode": "content", "options": [{"id": "identity-content", "label": "1 三个Weibull矩与显式解", "blocks": [{"id": "identity-body", "kind": "text", "html": "\u003cp\u003eCran的矩是\u003cmark\u003e生存函数幂的积分矩\u003c/mark\u003e，不是普通样本幂矩。当前k=1、2、4的矩计算与显式反解有对应。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L79\" target=\"_blank\" rel=\"noopener\"\u003e182-102 原文 L79–128 · 式(1)–(3)\u003c/a\u003e\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmunderover\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/munderover\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"1em\"/\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-1\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/mm.py · L44–52\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e  44      d12 = m1 - m2\n  45      d24 = m2 - m4\n  46      if d24 \u0026lt;= 0 or d12 \u0026lt;= d24:\n  47          return None\n  48      shape = math.log(2.0) / (math.log(d12) - math.log(d24))\n  49      location = (m1 * m4 - m2 * m2) / (m1 + m4 - 2.0 * m2)\n  50      scale = (m1 - location) / gamma_fn(1.0 + 1.0 / shape)\n  51      return shape, location, scale\n  52  \u003c/code\u003e\u003c/pre\u003e\u003cp\u003e主要待讨论处在显式解之后的位置和尺度处理。\u003c/p\u003e", "hash": "043ebbae3784918a0b5e2ac4a862387f3210a6afdd6447fab5b68904d7256cc2"}]}], "content_hash": "47427e606670b8f5675735303f17a0f259ee62ee911c6c84b2e817c82d64396f"}, {"id": "scale", "title": "2 位置调整后是否重算尺度", "mode": "content", "options": [{"id": "scale-content", "label": "2 位置调整后是否重算尺度", "blocks": [{"id": "scale-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px\"\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e原文依据\u003c/p\u003e\u003cp\u003e式(2c)给b=(m₁−a)/Γ(1+1/c)；负位置时建议用0估计a。该段没有明确交代是只替换位置，还是把新a再次代回尺度公式。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L89\" target=\"_blank\" rel=\"noopener\"\u003e182-102 原文 L89–128 · 参数公式及可采纳性\u003c/a\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e当前实现\u003c/p\u003e\u003cp\u003e若原始位置\u0026lt;0，先取γ=0，再以原形状重算η=m₁/Γ(1+1/β)。记录中保留原始三元组及位置调整。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-2\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/mm.py · L122–126\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 122          if location \u0026lt; 0.0:\n 123              location = 0.0\n 124              scale = m1 / gamma_fn(1.0 + 1.0 / shape)\n 125              location_adjustment = \u0026quot;clamped_to_zero\u0026quot;\n 126          elif location \u0026gt;= x_min:\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e核对判断：\u003c/strong\u003e尺度重算是当前作出的解释；原文未明确说“必须重算”，也未明确说“禁止重算”。不能把解释分歧直接写成确定的公式错误。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可能修改：\u003c/strong\u003e需共同确定输出规则：维持矩关系而重算尺度，或只按原文明确的位置替换、保留初次尺度。选择后直接修改mm.py并补边界算例。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e影响：\u003c/strong\u003e会改变被截零样本的尺度估计，以及Monte Carlo偏差和均方误差；正常未调整样本不受这项规则影响。\u003c/p\u003e", "hash": "2f67753ae6db5475aff834eb1bc1b828375cf56bd38232e1d5bfe23f9aa52cd3"}]}], "content_hash": "0706b37a23f0fe1b211f07a13893cfc0e2bcad78ca38089615a25d9041c42b88"}, {"id": "scale-choice", "title": "2.1 位置截零后的尺度约定", "mode": "choices", "inline": true, "selection_mode": "single", "selected_ids": [], "options": [{"id": "mm-recompute", "label": "保留当前尺度重算", "blocks": [{"id": "mm-recompute-text", "kind": "text", "html": "\u003cp\u003e保持第一矩关系，明确这是对原文边界建议的项目解释。\u003c/p\u003e", "hash": "aef6667fdf1d7b3ed00565002f9351dcefc1f9ae457e9fa0641cac93476b8ada"}]}, {"id": "mm-keep-scale", "label": "只替换位置，保留初次尺度", "blocks": [{"id": "mm-keep-scale-text", "kind": "text", "html": "\u003cp\u003e减少额外更新；明确新三元组不再同时满足原先的全部矩关系，独立验证影响。\u003c/p\u003e", "hash": "e740cb4f4a88c42eda6c631d3c20945649cdcbdf19d122528a95adb9f249824a"}]}], "content_hash": "0403bef67475296a3184339222b44ff670535cf2d29e565a55cf38c5a07226eb"}, {"id": "alternative", "title": "3 超过最小观测时的替代位置", "mode": "content", "options": [{"id": "alternative-content", "label": "3 超过最小观测时的替代位置", "blocks": [{"id": "alternative-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px\"\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e原文依据\u003c/p\u003e\u003cp\u003e作者给出一种可能的替代位置a**，并非唯一强制规则。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L123\" target=\"_blank\" rel=\"noopener\"\u003e182-102 原文 L123–128 · a**\u003c/a\u003e\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e∗\u003c/mo\u003e\u003cmo\u003e∗\u003c/mo\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmo\u003e∗\u003c/mo\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003eΓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmsup\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmo\u003e∗\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmsup\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmsup\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmo\u003e∗\u003c/mo\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mfrac\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e当前实现\u003c/p\u003e\u003cp\u003e计算a**后再次max(0,a**)，并重算尺度；这是在原替代式上又加了一层截断和更新。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-3\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/mm.py · L127–132\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 127              alt = x_min - scale * gamma_fn(1.0 + 1.0 / shape) / (n ** (1.0 / shape))\n 128              location = max(0.0, float(alt))\n 129              scale = (m1 - location) / gamma_fn(1.0 + 1.0 / shape)\n 130              location_adjustment = \u0026quot;alternative_a_star_star\u0026quot;\n 131              if location \u0026gt;= x_min or scale \u0026lt;= 0:\n 132                  self.last_solution_info = {\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e核对判断：\u003c/strong\u003e非负位置是论文明确要求，但a**自身又负时怎样处理，该段未给完整规则。二次截零是补足，不能冒称原式直接推出。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可能修改：\u003c/strong\u003e可保留现补足并标记，或在替代位置不可采纳时明确失败。不能为了保持成功率无声增加其他方法回退。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e影响：\u003c/strong\u003e影响边界样本的估计与成功率；要同时记录原始位置、a**及最后采用的三元组。\u003c/p\u003e", "hash": "76fa6a931e8a7295ccec0480e5c16f9249f8e076aadefa85268df5c2da6c06fd"}]}], "content_hash": "1fe07ad4961313551eaaabf3d7c28c954e309588e5cec275e9e376c7c1e2defe"}, {"id": "alternative-choice", "title": "3.1 替代位置再次不可采纳时", "mode": "choices", "inline": true, "selection_mode": "single", "selected_ids": [], "options": [{"id": "mm-alt-clamp", "label": "保留二次截零并记录", "blocks": [{"id": "mm-alt-clamp-text", "kind": "text", "html": "\u003cp\u003e维持当前返回口径；尺度是否重算依前一项决定。\u003c/p\u003e", "hash": "efb236f381fe4667921c7adc11b85c57e8e7add2a74f182b753640bd86329089"}]}, {"id": "mm-alt-fail", "label": "明确返回不可采纳", "blocks": [{"id": "mm-alt-fail-text", "kind": "text", "html": "\u003cp\u003e不继续修造位置值；保留原始与替代值作为失败诊断。\u003c/p\u003e", "hash": "684665a73b6d81aa94bbf5f37eddfd12a96ca70d366b8c4c506599f3cdad7bd4"}]}], "content_hash": "405f9750226b8fa1367e9baa9f9ae7359e740ea17ed155b31a4d2ff251588e37"}, {"id": "admissibility", "title": "4 不可采纳矩与二参对照", "mode": "content", "options": [{"id": "admissibility-content", "label": "4 不可采纳矩与二参对照", "blocks": [{"id": "admissibility-body", "kind": "text", "html": "\u003cp\u003e当前判据m₁−m₂\u0026gt;m₂−m₄\u0026gt;0与显式正形状/尺度相容，失败时不改用别的方法。原文说可采用其他估计方法，不等于允许本程序静默回退。\u003c/p\u003e\u003cp\u003e原文还建议比较二参与三参的b、c，但没有给“足够接近”的数值阈值。代码记录二参对照、没有自动选模，这一点可保留。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L174\" target=\"_blank\" rel=\"noopener\"\u003e182-102 原文 L174–186 · 二参与三参比较\u003c/a\u003e\u003cp\u003e原论文两例所引原始样本本次未核得完整输入，当前测试主要验证矩恒等式、手算、等变性和边界行为；不称两例已经逐值复现。\u003c/p\u003e", "hash": "e40923b34700259d2c9b1cf255ecef809e8dab48fe420a86ac82c6e676f46255"}]}], "content_hash": "c877135f9fbc69c4d8535847bbe17fc9983bbafc8d6ee974d8fa93cc93677963"}, {"id": "verification", "title": "5 当前数值核对与测试能证明什么", "mode": "content", "options": [{"id": "verification-content", "label": "5 当前数值核对与测试能证明什么", "blocks": [{"id": "verification-body", "kind": "visual", "html": "\u003cdiv style=\"overflow:auto\"\u003e\u003ctable style=\"font-size:16px\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e核对输入\u003c/th\u003e\u003cth\u003eβ\u003c/th\u003e\u003cth\u003eη\u003c/th\u003e\u003cth\u003eγ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e现有边界测试中的固定样本\u003c/td\u003e\u003ctd\u003e2.3071148\u003c/td\u003e\u003ctd\u003e119.61232\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e这组不是原论文算例，用来显出位置修正及尺度重算的影响。\u003c/p\u003e\u003cp\u003e该固定样本的初次公式三元组为{\u0026quot;beta\u0026quot;: 2.307114827026101, \u0026quot;eta\u0026quot;: 125.4213579022478, \u0026quot;gamma\u0026quot;: -5.146498284334936}。其中原始位置不可采纳，不能把这组三元组当作建议直接返回的合法估计。\u003c/p\u003e\u003cp\u003e本轮重新执行七个方法的既有原文/公式套件，共80项通过。通过的是已覆盖的公式、若干算例和边界；不是原文所有算法步骤、数据及蒙特卡洛表已复现。上表为少量确定性核对，不是新蒙特卡洛性能结论。\u003c/p\u003e", "hash": "5e9797840f28300983a7ebd6cf24b9218531936c99b040c1edcf2444dbfebde7"}]}], "content_hash": "4e60fda6e9cf96ffdf2ae909445b253e05b429961ffbe6ae65ea93df7b9dafed"}, {"id": "sources", "title": "6 论文、源码与核对快照", "mode": "content", "options": [{"id": "sources-content", "label": "6 论文、源码与核对快照", "blocks": [{"id": "sources-body", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003eG. W. Cran，1988\u003c/strong\u003e · Moment Estimators for the 3-Parameter Weibull Distribution\u003c/p\u003e\u003cp\u003e当前方法入口：\u003ccode\u003epython/methods/mm.py\u003c/code\u003e。核对时间 2026-11-02T12:51:05+08:00；Git基线 2b3d01383c，工作区含未提交改动，以下哈希标识本轮实际文件。\u003c/p\u003e\u003cp style=\"font:14px/1.8 Consolas,monospace;overflow-wrap:anywhere\"\u003e入口SHA-256 8ea778cb9f7ad33ddccde03cdc8ca16696e1427a37ef1c582271183f42cc690e\u003c/p\u003e\u003cp\u003e\u003ca href=\"assets/evidence.html\" target=\"_blank\" rel=\"noopener\"\u003e查看逐项原文与源码摘录\u003c/a\u003e · \u003ca href=\"assets/provenance.json\" target=\"_blank\" rel=\"noopener\"\u003e查看来源与哈希\u003c/a\u003e · \u003ca href=\"assets/methods.html\" target=\"_blan <script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;
try{sidebarVisible=(localStorage.getItem(sidebarKey())??localStorage.getItem(`review-html:${board.id}:sidebar-pinned`))==='true'}catch{}
function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}
function jumpToOutline(entry){entry.target.scrollIntoView({block:'start',behavior:'smooth'})}
function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit)){const headings=[...node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')],base=Math.min(...headings.map(h=>Number(h.tagName.slice(1))));for(const heading of headings){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+1+Number(heading.tagName.slice(1))-base)})}}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}
$('sidebar-toggle').onclick=toggleSidebar;
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function deliveryMessage(){
 if(!online)return '离线预览；反馈只能导出';
 const delivery=board.delivery;
 if(board.review_complete)return '当前版本已接受并存档';
 if(board.archive_pending)return '存档请求已应用，文件操作待完成';
 if(board.processing)return '反馈已应用，内容正在更新';
 if(board.submitted){
  if(delivery?.feedback_stage==='read_by_wait')return 'wait 已读取反馈，等待 Agent 处理';
  if(delivery?.wait_active)return '反馈已落盘，等待活动 wait 读取';
  return '反馈已落盘；当前没有活动 wait，请回到聊天恢复审阅';
 }
 if(!delivery)return '等待进程状态尚未确认';
 return delivery.wait_active?'当前有活动 wait 正在等待反馈':'页面可用；当前没有活动 wait';
}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250);updateOutlineStatus()}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'||editor.kind==='section-note'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}if(structuredNote(editor)){const unit=board.units.find(u=>u.id===editor.unit_id),option=unit?.options.find(o=>o.id===editor.option_id),block=option?.blocks.find(b=>b.id===editor.block_id);if(editor.kind==='option-note'?option:block&&(editor.kind!=='image-note'||block.images?.some(i=>i.id===editor.image_id)))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
const structuredNote=anchor=>['section-note','option-note','block-note','image-note'].includes(anchor.kind);
function noteValue(anchor){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note')return state.section_note||'';if(anchor.kind==='option-note')return state.notes[anchor.option_id]||'';const notes=anchor.kind==='image-note'?state.image_notes:state.block_notes;return notes?.find(n=>n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(anchor.kind!=='image-note'||n.image_id===anchor.image_id))?.comment||''}
function storeNote(anchor,comment){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note'){state.section_note=comment;return}if(anchor.kind==='option-note'){if(comment)state.notes[anchor.option_id]=comment;else delete state.notes[anchor.option_id];return}const key=anchor.kind==='image-note'?'image_notes':'block_notes';state[key]=(state[key]||[]).filter(n=>!(n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(key!=='image_notes'||n.image_id===anchor.image_id)));if(comment)state[key].push({option_id:anchor.option_id,block_id:anchor.block_id,...(key==='image_notes'?{image_id:anchor.image_id}:{}),comment})}
function storedNote(anchor){if(!anchor||anchor.kind==='divergence')return '';return structuredNote(anchor)?noteValue(anchor):draft.units[anchor.unit_id].annotations.find(n=>n.id===anchor.id)?.comment||''}
function sameNote(left,right){if(!left||!right||left.unit_id!==right.unit_id||left.kind!==right.kind)return false;if(!structuredNote(left))return left.id===right.id;return left.option_id===right.option_id&&left.block_id===right.block_id&&left.image_id===right.image_id}
function deleteNote(anchor){if(!anchor||anchor.kind==='divergence')return false;if(structuredNote(anchor))storeNote(anchor,'');else draft.units[anchor.unit_id].annotations=draft.units[anchor.unit_id].annotations.filter(n=>n.id!==anchor.id);if(sameNote(pending,anchor))closeEditor(false);draft.submission_id=null;persist();window.getSelection()?.removeAllRanges();renderComments();return true}
function editNote(anchor,rect){if(pending)saveNote();openEditor({...anchor,comment:storedNote(anchor)},rect)}
function noteIcon(anchorFor){const button=el('button','note-icon');button.type='button';button.title='添加、修改或删除备注';button.setAttribute('aria-label','添加、修改或删除备注');button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a7 7 0 0 1-7 7H7l-4 3V11a7 7 0 0 1 7-7h3a7 7 0 0 1 7 7Z"/><path d="M8 10h7M8 13h4"/></svg>';button.onclick=()=>{if(board.submitted||board.processing||board.review_complete)return;editNote(anchorFor(),button.getBoundingClientRect())};return button}
function blockNoteAnchor(unit,option,block){const base={unit_id:unit.id,option_id:option.id,block_id:block.id};if(block.kind==='gallery'){const slide=block.images[gallerySelection(unit,option,block)];return {...base,kind:'image-note',image_id:slide.id,quote:slide.label}}return {...base,kind:'block-note',quote:block.alt||(block.kind==='visual'?'表格或图表':'图片')}}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline&&!content?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));if(!content&&isMultiple(unit))head.append(el('span','next','可多选'));
 const diverge=el('button','diverge');diverge.type='button';diverge.dataset.diverge='true';diverge.setAttribute('aria-label','继续发散');diverge.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7L5 7m7 7 7-7M5 12V7h5m4 0h5v5"/></svg>';const actions=el('div','unit-actions');actions.append(noteIcon(()=>({kind:'section-note',unit_id:unit.id,quote:unit.title})),diverge);head.append(actions);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content||unit.options.length>1){const heading=el('div','option-head');heading.append(el('h3',content?'content-part-title':'',option.label),noteIcon(()=>({kind:'option-note',unit_id:unit.id,option_id:option.id,quote:option.label})));card.append(heading)}const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}if(block.kind!=='text'){content.classList.add('has-note-control');content.append(noteIcon(()=>blockNoteAnchor(unit,option,block)))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),input=el('input');input.type=isMultiple(unit)?'checkbox':'radio';input.className='choice-input';input.name=`choice-${unit.id}`;input.value=option.id;input.setAttribute('aria-label',`选择${option.label}`);label.append(input);row.append(label);card.append(row)}
  grid.append(card)
 }
