3e\u003cdiv class=\"eyebrow\"\u003e参数估计方法 / MM\u003c/div\u003e\u003ch2\u003e矩估计 MM\u003c/h2\u003e\u003cp class=\"subtitle\"\u003e由经验生存函数的面积形成三个Weibull矩；检查这些矩能否给出可采纳解，再用显式公式求参数，并说明位置处理前后的变化。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"tabs\"\u003e\u003ca class=\"tab active\" data-tab=\"program\" href=\"assets/proposed-page.html#program\" target=\"_blank\" rel=\"noopener\"\u003e程序流程\u003c/a\u003e\u003ca class=\"tab \" data-tab=\"calculation\" href=\"assets/proposed-page.html#calculation\" target=\"_blank\" rel=\"noopener\"\u003e计算过程\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"body\"\u003e\u003cp class=\"lead\"\u003e经验生存函数 → 三个 Weibull 矩 → 可采纳性检查 → 显式求参与位置处理。\u003c/p\u003e\u003cdiv class=\"cols\"\u003e\u003cnav class=\"card steps\" aria-label=\"计算步骤\"\u003e\u003ca class=\"step \" data-step=\"0\" href=\"assets/proposed-page.html?step=0#program\" target=\"_blank\" rel=\"noopener\"\u003e1　数据预处理\u003c/a\u003e\u003ca class=\"step active\" data-step=\"1\" href=\"assets/proposed-page.html?step=1#program\" target=\"_blank\" rel=\"noopener\"\u003e2　计算样本 Weibull 矩\u003c/a\u003e\u003ca class=\"step \" data-step=\"2\" href=\"assets/proposed-page.html?step=2#program\" target=\"_blank\" rel=\"noopener\"\u003e3　检查矩组合并解参数\u003c/a\u003e\u003ca class=\"step \" data-step=\"3\" href=\"assets/proposed-page.html?step=3#program\" target=\"_blank\" rel=\"noopener\"\u003e4　修正位置与尺度\u003c/a\u003e\u003ca class=\"step \" data-step=\"4\" href=\"assets/proposed-page.html?step=4#program\" target=\"_blank\" rel=\"noopener\"\u003e5　计算两参数对照\u003c/a\u003e\u003ca class=\"step \" data-step=\"5\" href=\"assets/proposed-page.html?step=5#program\" target=\"_blank\" rel=\"noopener\"\u003e6　计算拟合优度并返回\u003c/a\u003e\u003c/nav\u003e\u003csection class=\"card code-panel\" data-panel=\"1\"\u003e\u003ch3\u003e计算样本 Weibull 矩\u003c/h3\u003e\u003cp\u003e用生存函数阶梯估计计算 k=1,2,4 阶样本矩（论文式(3)）\u003c/p\u003e\u003cp class=\"muted\"\u003epython/methods/mm.py · L77–89\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e  77          # @step: 2 | 计算样本 Weibull 矩 | 用生存函数阶梯估计计算 k=1,2,4 阶样本矩（论文式(3)）\n  78          # @formula: \\bar{m}_k = \\sum_{r=0}^{n-1}\\left(1-\\frac{r}{n}\\right)^k (x_{(r+1)} - x_{(r)}), \\quad x_{(0)}=0\n  79          # @symbols: \\bar{m}_k|\\bar{m}_k|k 阶样本 Weibull 矩\n  80          # @inputs: x|x|排序后数组, n|n|样本数量\n  81          # @outputs: m1|\\bar{m}_1|一阶矩（等于样本均值）, m2|\\bar{m}_2|二阶矩, m4|\\bar{m}_4|四阶矩\n  82          terms = {k: [] for k in (1, 2, 4)}\n  83          m1 = sample_weibull_moment(x, 1, terms[1] if trace else None)\n  84          m2 = sample_weibull_moment(x, 2, terms[2] if trace else None)\n  85          m4 = sample_weibull_moment(x, 4, terms[4] if trace else None)\n  86\n  87          if trace:\n  88              self.log_step({\u0026quot;phase\u0026quot;: \u0026quot;moments\u0026quot;, \u0026quot;m1\u0026quot;: m1, \u0026quot;m2\u0026quot;: m2, \u0026quot;m4\u0026quot;: m4})\n  89\u003c/code\u003e\u003c/pre\u003e\u003cp class=\"muted\"\u003epython/methods/mm.py · L28–36\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e  28  def sample_weibull_moment(sorted_x, k, trace_terms=None):\n  29      \u0026quot;\u0026quot;\u0026quot;论文式(3)：样本 Weibull 矩 m̄_k = Σ (1 - r/n)^k (x_(r+1) - x_(r))，x_(0)=0。\u0026quot;\u0026quot;\u0026quot;\n  30      n = len(sorted_x)\n  31      x_prev = np.concatenate(([0.0], sorted_x[:-1]))\n  32      weights = (1.0 - np.arange(n) / n) ** k\n  33      terms = weights * (sorted_x - x_prev)\n  34      if trace_terms is not None:\n  35          trace_terms.extend(float(v) for v in terms)\n  36      return float(np.sum(terms))\u003c/code\u003e\u003c/pre\u003e\u003c/section\u003e\u003caside class=\"card explain\" data-panel=\"1\"\u003e\u003ch3\u003e公式与变量\u003c/h3\u003e\u003cdiv class=\"formula\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmunderover\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/munderover\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"1em\"/\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/div\u003e\u003ch4\u003e输入\u003c/h4\u003e\u003cdiv class=\"mapping\"\u003e\u003ccode\u003ex\u003c/code\u003e · 排序后数组\u003c/div\u003e\u003cdiv class=\"mapping\"\u003e\u003ccode\u003en\u003c/code\u003e · 样本数量\u003c/div\u003e\u003ch4\u003e输出\u003c/h4\u003e\u003cdiv class=\"mapping\"\u003e\u003ccode\u003em1\u003c/code\u003e · 一阶矩（等于样本均值）\u003c/div\u003e\u003cdiv class=\"mapping\"\u003e\u003ccode\u003em2\u003c/code\u003e · 二阶矩\u003c/div\u003e\u003cdiv class=\"mapping\"\u003e\u003ccode\u003em4\u003c/code\u003e · 四阶矩\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003e依据与边界\u003c/summary\u003e\u003cp\u003eCran (1988) Weibull矩构造；m₂、m₄不是样本普通二阶和四阶幂矩。\u003c/p\u003e\u003cp\u003em₁等于均值；m₂、m₄由阶梯生存函数加权间距得到。\u003c/p\u003e\u003c/details\u003e\u003c/aside\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e", "hash": "6354b9c407c9c16116262ab2426042e5b8254a243e9d382c82126dca20eea589"}, {"id": "program-order", "kind": "text", "html": "\u003cdetails\u003e\u003csummary\u003e查看原页面与完整核查依据\u003c/summary\u003e\u003cp\u003e\u003ca href=\"assets/current-process.png\" target=\"_blank\"\u003e原页面截图\u003c/a\u003e · \u003ca href=\"assets/process-evidence.html\" target=\"_blank\"\u003e完整步骤、源码、公式\u003c/a\u003e\u003c/p\u003e\u003c/details\u003e", "hash": "219edacd55160539de3312f43ccb50a32acfd4e18d3eae1ba400851890e17e3d"}]}], "content_hash": "6e2ffcede05be8760af43ffdf82c9a5a62bf5af04348172e3dea2388d85fb781"}, {"id": "calculation-presentation", "title": "4 编排变化与原页面", "mode": "content", "options": [{"id": "calculation-presentation-content", "label": "4 计算过程与图的主次", "blocks": [{"id": "calculation-layout", "kind": "text", "html": "\u003cp\u003e现有生存函数图和矩差图已能说明输入量；但若没有把面积、矩和最终参数连起来，读者仍不知道图与估计有什么关系。位置修正前后也需要直接可见。\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003e查看修改前的计算页面\u003c/summary\u003e\u003cp\u003e\u003ca href=\"assets/current-calculation.png\" target=\"_blank\"\u003e打开原网站截图\u003c/a\u003e（保留上一轮截图供对照。）\u003c/p\u003e\u003c/details\u003e", "hash": "796efdba5fddc024e2f1a5d482eb4e2f7e574e49dfa2b25f5f0d48d4f9656d08"}]}], "content_hash": "a883a13239ce4bfaca8fa64feb205d5d9bb5fc21912c71ff23158d2eb136bc33"}, {"id": "figure-weibull-moments", "title": "4.1 样本怎样形成矩", "mode": "content", "options": [{"id": "figure-weibull-moments-content", "label": "4.1 样本怎样形成矩", "blocks": [{"id": "chart-weibull-moments-assessment", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e样本怎样形成矩：\u003c/strong\u003e保留阶梯函数，显示S、S²、S⁴及面积对应的三个矩。\u003c/p\u003e\u003cp\u003e台阶与面积是关键，不画平滑拟合线来替代经验生存函数。\u003c/p\u003e", "hash": "53c8232d77a8e750846d885dc9388cabaf27d71312dd8e01785630425bbfd139"}]}], "content_hash": "20bba5272dc48b88312525acb6480185400d974f338a3eb860eb6d28dda19ca1"}, {"id": "figure-moment-admissibility", "title": "4.2 这些矩能否求参", "mode": "content", "options": [{"id": "figure-moment-admissibility-content", "label": "4.2 这些矩能否求参", "blocks": [{"id": "chart-moment-admissibility-assessment", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e这些矩能否求参：\u003c/strong\u003e以简短关系图或数值比较展示两组矩差均为正且有序。\u003c/p\u003e\u003cp\u003e两点散点图的信息较少；建议与矩数值及求参公式放在一起。\u003c/p\u003e", "hash": "3dfbc1ea41bf8ecd572358be5c6682ad3d5a03a2e32ebe44f23eca73c1707b43"}]}], "content_hash": "d32a1d5e050242529800c3eca51bdea3a6718926b7c851d24ef263006b98df61"}, {"id": "result-link", "title": "5 图怎样连到最终结果", "mode": "content", "options": [{"id": "result-link-content", "label": "5 图怎样连到最终结果", "blocks": [{"id": "result-link-body", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e样本矩与形状显式解\u003c/strong\u003e：m̄₁=105.9701, m̄₂=77.13461, m̄₄=55.78209, β̂=2.307115\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e位置显式解与当前处理\u003c/strong\u003e：γ*（原始）=-5.146498, γ̂（返回）=0\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e尺度恢复\u003c/strong\u003e：η*（原始）=125.4214, η̂（返回）=119.6123\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e呈现要求：\u003c/strong\u003e图中选中点、公式中的量、最终三参数要来自同一次计算。更改输入后明确更新状态；无可采纳结果时，图与结果一起说明原因。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e我的处理范围：\u003c/strong\u003e源码对应、数值记录、坐标、单位及边界标记由我核对；只有会改变估计规则或成功口径的改动，另行讨论。\u003c/p\u003e", "hash": "fc51e277e3bdf397b682faec702e42d68504c204180881621800e3faa57b9834"}]}], "content_hash": "4ad7b535ea2b5454ea4f69f885038eb270a5906326f8f1cf5313b73786f32812"}, {"id": "sources", "title": "核查依据", "mode": "content", "options": [{"id": "sources-content", "label": "核查依据", "blocks": [{"id": "sources-body", "kind": "text", "html": "\u003cdetails\u003e\u003csummary\u003e样本、来源与核查材料\u003c/summary\u003e\u003cp\u003e固定运行记录读取时间：2026-11-03T00:21:38+08:00。2026-11-04 已核对相关源码 SHA-256 全部一致；未重新运行批量实验。\u003c/p\u003e\u003cp\u003e\u003ca href=\"assets/process-run.json\"\u003e完整输入与运行记录\u003c/a\u003e · \u003ca href=\"assets/process-evidence.html\"\u003e源码与公式\u003c/a\u003e · \u003ca href=\"assets/prior-algorithm-review.html\"\u003e此前原文核对\u003c/a\u003e · \u003ca href=\"assets/presentation-before-20261104.json\"\u003e上一版汇报\u003c/a\u003e\u003c/p\u003e\u003c/details\u003e", "hash": "c322406fb916a03b567264200fb9b65cbeb7fa1622406373b340b582997205ad"}]}], "content_hash": "52a31f05538521a528c8e17f7b8738f89eec7e1f599437d973f177eb9b6fcd10"}], "presentation_refresh": "2026-11-04"}</script>

function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return deleteNote(pending);if(structuredNote(pending)){storeNote(pending,comment);draft.submission_id=null;closeEditor(false);persist();renderComments();return true}const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;$('delete-note').onclick=()=>deleteNote(pending);
function editorKeydown(event){if(event.isComposing||event.keyCode===229)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!saveNote())$('editor-input').focus();updateOutlineStatus()}if(event.key==='Escape')closeEditor()}
$('editor-input').addEventListener('keydown',editorKeydown);
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function sidebarNote(anchor,comment){const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',comment));const tools=el('div','annotation-tools'),edit=el('button','quiet','修改'),remove=el('button','quiet','删除');edit.type=remove.type='button';edit.onclick=()=>editNote(anchor,card.getBoundingClientRect());remove.onclick=()=>deleteNote(anchor);quote.onclick=()=>{const target=anchor.block_id?blockNode(anchor.unit_id,anchor.option_id,anchor.block_id):unitNode({id:anchor.unit_id});target?.scrollIntoView({block:'center',behavior:'smooth'})};tools.append(edit,remove);card.append(tools);$('comments').append(card)}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>editNote({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>deleteNote({...anchor,unit_id:unit.id});tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
