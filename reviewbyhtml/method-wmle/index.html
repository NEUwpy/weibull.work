<script id="initial-board" type="application/json">{"id": "weibull-method-wmle-20261102", "title": "加权极大似然估计 WMLE · 原文与实现", "document": true, "revision": 1, "require_confirmation": true, "archive_plan": "依据最终确认的逐项决定修改 D:/weibull/python/methods/wmle.py 及实际共用辅助函数，同步方法说明、流程引用和测试；保留同一方法入口，不新建原文/工程分支。先展示具体修改与核对结果，再完成本方法审定记录 D:/weibull/docs/method-reviews/wmle.md。未决定的算法问题保持现状；历史数据不重算，不推送或部署。", "units": [{"id": "identity", "title": "1 已对应的加权方程", "mode": "content", "options": [{"id": "identity-content", "label": "1 已对应的加权方程", "blocks": [{"id": "identity-body", "kind": "text", "html": "\u003cp\u003e现行WMLE使用J₁、J₂、J₃中位数权重，形状/位置加权方程与尺度闭式解有对应。原文符号为γ=形状、β=尺度、α=位置；下文统一映射为β、η、γ。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L88\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L88–104 · 式(3)\u003c/a\u003e；\u003ca href=\"assets/evidence.html#paper-L178\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L178–192 · 式(4)及插值\u003c/a\u003e\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmsub\u003e\u003cmi\u003eJ\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmrow\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/mrow\u003e\u003cmo stretchy=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmunder\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/munder\u003e\u003cmsubsup\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmunder\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/munder\u003e\u003cmsubsup\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"1em\"/\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmsup\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo stretchy=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmunder\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/munder\u003e\u003cmsubsup\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmunder\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/munder\u003e\u003cmsubsup\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eJ\u003c/mi\u003e\u003cmn\u003e3\u003c/mn\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"1em\"/\u003e\u003cmsub\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e求解器怎样找到零点与这些方程是否正确，是两个问题；更换未被作者指定的优化器，本身不必然改变统计构造。\u003c/p\u003e", "hash": "761c7932a53d521d99769ddcf2e0718efa040822937c6634a1779c0dccbf70e3"}]}], "content_hash": "5258538c98be6ea0aa0776467a3b9ed542a6631f8f4c0b60d524a615e1035bac"}, {"id": "weights", "title": "2 权重覆盖：表内插值与表外替代", "mode": "content", "options": [{"id": "weights-content", "label": "2 权重覆盖：表内插值与表外替代", "blocks": [{"id": "weights-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px\"\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e原文依据\u003c/p\u003e\u003cp\u003eJ₃随候选形状变化；作者明确使用查表和线性插值。n\u0026gt;16时，文中建议按标准指数样本构造估计权重。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L144\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L144–150 · 校准\u003c/a\u003e；\u003ca href=\"assets/evidence.html#paper-L186\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L186–194 · 插值与大n\u003c/a\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e当前实现\u003c/p\u003e\u003cp\u003eJ₃表覆盖至n=100、形状约0.1–5；查询把形状截至表端，但候选形状可接近9.99。n\u0026gt;100时使用渐近近似，形状≤1时返回2。J₁则有精确Gamma中位数计算，不应与J₃混为同一种表外规则。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-1\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/wmle.py · L214–222\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 214      gamma_clamped = max(0.1, min(5.0, gamma))\n 215  \n 216      # Calculate asymptotic value for very large n\n 217      if gamma_clamped \u0026gt; 1:\n 218          asymp_val = gamma_clamped / (gamma_clamped - 1)\n 219      else:\n 220          asymp_val = float(\u0026#x27;inf\u0026#x27;)\n 221  \n 222      # Helper function for gamma interpolation\u003c/code\u003e\u003c/pre\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-2\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/wmle.py · L258–264\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 258      if n \u0026gt; available_ns[-1]:\n 259          # Use asymptotic value for very large n\n 260          if gamma_clamped \u0026gt; 1:\n 261              return asymp_val\n 262          else:\n 263              return 2.0\n 264  \u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e核对判断：\u003c/strong\u003e表内线性插值是作者明确采用的；表外固定端点或常数是当前的补充近似，不能自动归给论文。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可能修改：\u003c/strong\u003e先决定保留近似并明确范围，还是表外拒绝；若要扩表，应按原构造校准、保存种子和误差，再更新同一权重文件及wmle.py。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e影响：\u003c/strong\u003e拒绝表外会缩小可用范围；扩表会改变权重和估计，需单独的校准验证，本轮不运行新的大规模权重模拟。\u003c/p\u003e", "hash": "6962c5b123b56937d13fffa5b9e206ba057c82c640864e1cafae5e80688e8d74"}]}], "content_hash": "3c933479303d780c8e340ec7acc55220199bb2bb46dcb02a34cb23b313fffbc1"}, {"id": "weights-choice", "title": "2.1 表外权重的处理", "mode": "choices", "inline": true, "selection_mode": "single", "selected_ids": [], "options": [{"id": "weights-keep", "label": "保留近似，结果明确标记", "blocks": [{"id": "weights-keep-text", "kind": "text", "html": "\u003cp\u003e保持可用范围，返回权重是否截断、表外规则及实际权重；统计区分表内与表外。\u003c/p\u003e", "hash": "6203f93620e0351a542659d9b3194fbc808c59af93a2fb0de064634b3d2af67c"}]}, {"id": "weights-reject", "label": "表外明确返回不可用", "blocks": [{"id": "weights-reject-text", "kind": "text", "html": "\u003cp\u003e仅在已有有效权重覆盖内求解；同一wmle.py明确报告超界原因。\u003c/p\u003e", "hash": "1be3658cb7eb333ca2c4128c4db39ad8c862839e95cad751e568384f23c7b536"}]}, {"id": "weights-extend", "label": "先校准权重，再扩展同一实现", "blocks": [{"id": "weights-extend-text", "kind": "text", "html": "\u003cp\u003e先讨论n与β范围和校准精度，完成独立权重验证后再改程序。\u003c/p\u003e", "hash": "a911519fc3a13ffaafcb506919746b127eaa1d9890171672e0fc79e96538022a"}]}], "content_hash": "dea3578da7829c3ff174bec7c3d5a125e4c7a8e6bb2d14f1111a3f871f7dafe5"}, {"id": "domain", "title": "3 位置参数是否允许为负", "mode": "content", "options": [{"id": "domain-content", "label": "3 位置参数是否允许为负", "blocks": [{"id": "domain-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px\"\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e原文依据\u003c/p\u003e\u003cp\u003e位置α属于实数且小于min(X)，并未要求非负。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L42\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L42–48 · §2参数域\u003c/a\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e当前实现\u003c/p\u003e\u003cp\u003e距离函数、残差函数和最终候选都限定γ≥0，扫描域也是[0,min(t))。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-3\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/conditional_profiles.py · L80–83\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e  80              or np.any(~np.isfinite(b)) or np.any(b \u0026lt;= 0)\n  81              or np.any(~np.isfinite(g)) or np.any(g \u0026lt; 0) or np.any(d \u0026lt;= 0)):\n  82          raise ValueError(\u0026quot;Invalid WMLE residual sample or parameter\u0026quot;)\n  83      t = np.log(d)\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e核对判断：\u003c/strong\u003e当前解的是带非负约束的加权方程问题；它是有意义的寿命场景限制，但范围比原文窄。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可能修改：\u003c/strong\u003e若确定扩展，须同时改公共距离检查、残差检查、位置网格和选根规则，并核对公共函数对MLE的影响。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e影响：\u003c/strong\u003e负位置候选可能改变最终解；有限负域搜索失败不等于证明原方程无根。\u003c/p\u003e", "hash": "77f1ce50da11858bc8ab02e09e0893de967204cfb6f1ad9671daa3d41dceb80e"}]}], "content_hash": "9373ae22707450ce25cdebff085d1f2410f6407931ae97de72d25222fbbd00f8"}, {"id": "domain-choice", "title": "3.1 位置域的处理", "mode": "choices", "inline": true, "selection_mode": "single", "selected_ids": [], "options": [{"id": "domain-nonnegative", "label": "保留γ≥0的应用限制", "blocks": [{"id": "domain-nonnegative-text", "kind": "text", "html": "\u003cp\u003e保持当前行为，文档与结果中明确“非负位置约束”。\u003c/p\u003e", "hash": "87f0d45dd4d801d57aed83e1b36fb1e9f63950309d6ba05e1a7f6e78f9c8c762"}]}, {"id": "domain-real", "label": "在同一WMLE中允许负位置", "blocks": [{"id": "domain-real-text", "kind": "text", "html": "\u003cp\u003e先确定搜索扩展及停止规则，补负位置例和等变性核对，不另建原文版本。\u003c/p\u003e", "hash": "5a2b762ad139dc6a1a9c42b534b4e1bf30fd6e1eb319d1f888382a21d4dbea6e"}]}], "content_hash": "fb61511b0602c16ab52f0573d7fb966229a1a36d77ef72690fd2ccd4ccf6d130"}, {"id": "acceptance", "title": "4 零点、边界近似与多根选择", "mode": "content", "options": [{"id": "acceptance-content", "label": "4 零点、边界近似与多根选择", "blocks": [{"id": "acceptance-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px\"\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e原文依据\u003c/p\u003e\u003cp\u003e原文式(4)寻求平方残差目标的零点，没有规定当前的非负边界特许或多根距离排序。\u003c/p\u003e\u003ca href=\"assets/evidence.html#paper-L178\" target=\"_blank\" rel=\"noopener\"\u003e182-088 原文 L178–190 · §4\u003c/a\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"color:#526d64;font-weight:650\"\u003e当前实现\u003c/p\u003e\u003cp\u003e候选接受T₁²+T₂²≤10⁻⁸；若无候选，可接受γ=0处的残差容差近似。近最小残差候选再按距β=2、γ=.9min(t)的规则选根。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-4\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/profile_solvers.py · L195–205\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 195      if not candidates:\n 196          boundary = wmle_objective_profile(z, 0., weights)\n 197          if boundary[\u0026#x27;objective\u0026#x27;] \u0026lt;= 1e-8:\n 198              add(0., boundary, kind=\u0026#x27;boundary_residual_tolerance\u0026#x27;)\n 199  \n 200      def proximity(p):\n 201          return (np.log(p[\u0026#x27;beta\u0026#x27;] / 2.) ** 2\n 202                  + ((p[\u0026#x27;gamma\u0026#x27;] - .9 * unit) / max(unit, 1.)) ** 2)\n 203  \n 204      minimum = min((p[\u0026#x27;objective\u0026#x27;] for p in candidates), default=np.inf)\n 205      near_best = [p for p in candidates if p[\u0026#x27;objective\u0026#x27;] \u0026lt;= minimum + 1e-12]\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e核对判断：\u003c/strong\u003e数值求根需要容差，容差本身不是错误。需讨论的是未达条件交点的边界近似是否与方程根同算成功，以及多根依据。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可能修改：\u003c/strong\u003e保留实际残差和近似标记；可考虑近似单独统计或拒绝。多根排序若保留，应明示是项目规则，不能按真值选根。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e影响：\u003c/strong\u003e可能改变成功率及最终根；不同残差量的尺度和容差要做敏感性核对，不把更小阈值自动当作更正确。\u003c/p\u003e", "hash": "7cb0f922165276b2490c75a06325c7b7e7ab4fff8b3c46d43e95564a45bcb2db"}]}], "content_hash": "f9d1f93cedf6f20c4704784afb71a4633bf2092dfa4734988de7184d8d39d597"}, {"id": "acceptance-choice", "title": "4.1 近似边界结果的口径", "mode": "choices", "inline": true, "selection_mode": "single", "selected_ids": [], "options": [{"id": "accept-keep", "label": "保留成功口径并明示近似", "blocks": [{"id": "accept-keep-text", "kind": "text", "html": "\u003cp\u003e维持现有行为，保留approximate_boundary_root和残差。\u003c/p\u003e", "hash": "9ddbff4aad2baf327a60dd142f843090dbc85b889ee21ebfb83c83b9a51896d8"}]}, {"id": "accept-separate", "label": "近似结果单独列为一种状态", "blocks": [{"id": "accept-separate-text", "kind": "text", "html": "\u003cp\u003e保留参数，但和已求得条件方程交点的结果分开汇总。\u003c/p\u003e", "hash": "321af7e8cf25b7814c2ba60ca0d3d4fb22040d48b9e0376a43b1fd86289c393f"}]}, {"id": "accept-reject", "label": "取消边界近似特许", "blocks": [{"id": "accept-reject-text", "kind": "text", "html": "\u003cp\u003e未通过所约定根判据时返回失败，保留诊断。\u003c/p\u003e", "hash": "6dd792462083837b947efdf911e67c4536056fc118c3946bfb9a4db8a2116060"}]}], "content_hash": "015849596df5e6cef50f7cb3bb68eff0cb82964ee3ebb48edd9be6972ba02c46"}, {"id": "solver", "title": "5 条件求根与原文目标：保留什么", "mode": "content", "options": [{"id": "solver-content", "label": "5 条件求根与原文目标：保留什么", "blocks": [{"id": "solver-body", "kind": "text", "html": "\u003cp\u003e先求T₁=0、沿条件轨迹求T₂=0，是求同一联立零点的一种数值策略。原文没有要求某个特定SciPy求解器；前端旧Nelder–Mead说法不能作为作者算法依据。当前有限扫描仍可能漏掉根，需要用独立求根与方程残差验证，而非为了外观换算法。\u003c/p\u003e\u003cp style=\"font-size:14px;color:#52645d\"\u003e\u003ca href=\"assets/evidence.html#code-5\" target=\"_blank\" rel=\"noopener\"\u003epython/methods/conditional_profiles.py · L105–114\u003c/a\u003e\u003c/p\u003e\u003cpre style=\"overflow:auto;background:#132723;color:#e9f0ec;padding:16px;border-radius:8px;font:14px/1.7 Consolas,monospace\"\u003e\u003ccode\u003e 105      j1, j2 = weights.get_weight_j1(n), weights.get_weight_j2(n)\n 106      t = np.log(d)\n 107      solution = _shape(t, weight=j2, upper=weights.SHAPE_UPPER)\n 108      if solution is None:\n 109          return None\n 110      beta, _, _ = solution\n 111      log_eta = t.mean() + (logsumexp(beta * (t - t.mean())) - np.log(n * j1)) / beta\n 112      t1, t2 = wmle_residuals(data, beta, gamma, weights)\n 113      j3 = float(weights.get_weight_j3(n, beta))\n 114      return dict(beta=beta, eta=float(np.exp(log_eta)), t1=t1, t2=t2,\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e权重表在代码中自述来自作者仓库。本次核对了本地权重文件与原文若干表值，不把代码注释当作对整个上游仓库的独立来源验证。\u003c/p\u003e", "hash": "9b42cf8f6768432215b0381820e3bb5a7844dab0466238405ff14143b334e54d"}]}], "content_hash": "4f8ec46c63740093d8b964c5b50c4a9613c8ea5551e0fa10c8e31fb0fed63af3"}, {"id": "verification", "title": "6 当前数值核对与测试能证明什么", "mode": "content", "options": [{"id": "verification-content", "label": "6 当前数值核对与测试能证明什么", "blocks": [{"id": "verification-body", "kind": "visual", "html": "\u003cdiv style=\"overflow:auto\"\u003e\u003ctable style=\"font-size:16px\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e核对输入\u003c/th\u003e\u003cth\u003eβ\u003c/th\u003e\u003cth\u003eη\u003c/th\u003e\u003cth\u003eγ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eCousineau §4 十点算例\u003c/td\u003e\u003ctd\u003e2.3276509\u003c/td\u003e\u003ctd\u003e117.54759\u003c/td\u003e\u003ctd\u003e282.33857\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e原文约 β=2.29，η=116.0，γ=283.7；当前权重表与印表分辨率不同。\u003c/p\u003e\u003cp\u003e本轮重新执行七个方法的既有原文/公式套件，共80项通过。通过的是已覆盖的公式、若干算例和边界；不是原文所有算法步骤、数据及蒙特卡洛表已复现。上表为少量确定性核对，不是新蒙特卡洛性能结论。\u003c/p\u003e", "hash": "12fa04bb97c2f577ef6e658f827c814d67eea967ce0556e747e9373126122fa5"}]}], "content_hash": "f57b03065cd25f5669336c3e120fcd03bfe4167475b82646f6a92a48b71289ec"}, {"id": "sources", "title": "7 论文、源码与核对快照", "mode": "content", "options": [{"id": "sources-content", "label": "7 论文、源码与核对快照", "blocks": [{"id": "sources-body", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003eDenis Cousineau，2009\u003c/strong\u003e · Nearly unbiased estimators for the three-parameter Weibull distribution with greater efficiency than the iterative likelihood method\u003c/p\u003e\u003cp\u003e当前方法入口：\u003ccode\u003epython/methods/wmle.py\u003c/code\u003e。核对时间 2026-11-02T12:51:05+08:00；Git基线 2b3d01383c，工作区含未提交改动，以下哈希标识本轮实际文件。\u003c/p\u003e\u003cp style=\"font:14px/1.8 Consolas,monospace;overflow-wrap:anywhere\"\u003e入口SHA-256 0e63af8a0d17ea6426cc973142b176d827068a952f07abed6850fc30eddbc33b\u003c/p\u003e\u003cp\u003e\u003ca href=\"assets/evidence.html\" target=\"_blank\" rel=\"noopener\"\u003e查看逐项原文与源码摘录\u003c/a\u003e · \u003ca href=\"assets/provenance.json\" target=\"_blank\" rel=\"noopener\"\u003e查看来源与哈希\u003c/a\u003e · \u003ca href=\"assets/methods.html\" target=\"_blank\" rel=\"noopener\"\u003e其他方法\u003c/a\u003e\u003c/p\u003e\u003cp\u003e摘录用于本轮讨论，不是另一份可编辑的算法实现。源文件变化后应重新核对；审阅期间不修改估计器或原论文。\u003c/p\u003e", "hash": "d3b0aff97986d6fcc833d800ed3e7d691e42902fef497c14fc0f1f37794e63f5"}]}], "content_hash": "9c221c0c6f5ac9ddbc9d0cc8e6515515c06e917ce38c5e0490ecf75ce476a810"}]}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;
try{sidebarVisible=(localStorage.getItem(sidebarKey())??localStorage.getItem(`review-html:${board.id}:sidebar-pinned`))==='true'}catch{}
function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}
function jumpToOutline(entry){entry.target.scrollIntoView({block:'start',behavior:'smooth'})}
function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit)){const headings=[...node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')],base=Math.min(...headings.map(h=>Number(h.tagName.slice(1))));for(const heading of headings){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+1+Number(heading.tagName.slice(1))-base)})}}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}
$('sidebar-toggle').onclick=toggleSidebar;
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function deliveryMessage(){
 if(!online)return '离线预览；反馈只能导出';
 const delivery=board.delivery;
 if(board.review_complete)return '当前版本已接受并存档';
 if(board.archive_pending)return '存档请求已应用，文件操作待完成';
 if(board.processing)return '反馈已应用，内容正在更新';
 if(board.submitted){
  if(delivery?.feedback_stage==='read_by_wait')return 'wait 已读取反馈，等待 Agent 处理';
  if(delivery?.wait_active)return '反馈已落盘，等待活动 wait 读取';
  return '反馈已落盘；当前没有活动 wait，请回到聊天恢复审阅';
 }
 if(!delivery)return '等待进程状态尚未确认';
 return delivery.wait_active?'当前有活动 wait 正在等待反馈':'页面可用；当前没有活动 wait';
}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250);updateOutlineStatus()}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'||editor.kind==='section-note'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}if(structuredNote(editor)){const unit=board.units.find(u=>u.id===editor.unit_id),option=unit?.options.find(o=>o.id===editor.option_id),block=option?.blocks.find(b=>b.id===editor.block_id);if(editor.kind==='option-note'?option:block&&(editor.kind!=='image-note'||block.images?.some(i=>i.id===editor.image_id)))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
const structuredNote=anchor=>['section-note','option-note','block-note','image-note'].includes(anchor.kind);
function noteValue(anchor){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note')return state.section_note||'';if(anchor.kind==='option-note')return state.notes[anchor.option_id]||'';const notes=anchor.kind==='image-note'?state.image_notes:state.block_notes;return notes?.find(n=>n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(anchor.kind!=='image-note'||n.image_id===anchor.image_id))?.comment||''}
function storeNote(anchor,comment){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note'){state.section_note=comment;return}if(anchor.kind==='option-note'){if(comment)state.notes[anchor.option_id]=comment;else delete state.notes[anchor.option_id];return}const key=anchor.kind==='image-note'?'image_notes':'block_notes';state[key]=(state[key]||[]).filter(n=>!(n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(key!=='image_notes'||n.image_id===anchor.image_id)));if(comment)state[key].push({option_id:anchor.option_id,block_id:anchor.block_id,...(key==='image_notes'?{image_id:anchor.image_id}:{}),comment})}
function storedNote(anchor){if(!anchor||anchor.kind==='divergence')return '';return structuredNote(anchor)?noteValue(anchor):draft.units[anchor.unit_id].annotations.find(n=>n.id===anchor.id)?.comment||''}
function sameNote(left,right){if(!left||!right||left.unit_id!==right.unit_id||left.kind!==right.kind)return false;if(!structuredNote(left))return left.id===right.id;return left.option_id===right.option_id&&left.block_id===right.block_id&&left.image_id===right.image_id}

 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
</body>
