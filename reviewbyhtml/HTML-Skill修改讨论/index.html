font-size:13px}.history summary{width:max-content}.history-round{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.history-round p{margin:5px 0}.history-round ul{padding-left:20px;margin:5px 0}.history-round li{white-space:pre-wrap;overflow-wrap:anywhere}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}.footer-inner{max-width:1240px;margin:auto;padding:14px 32px;display:flex;align-items:center;justify-content:flex-end;gap:20px}#status{font-size:13px;color:var(--muted);margin-right:auto}#status.error{color:var(--warn)}#submit{background:var(--accent);color:#fff;border-radius:8px;min-width:106px;padding:10px 22px;font-weight:600}#submit:disabled{opacity:.55;cursor:default}::selection{background:#f5df9d}::highlight(review-notes){background:#f5e8bb;text-decoration:underline;text-decoration-color:#b69a45}

<script id="initial-board" type="application/json">{"id": "review-html-structure-discussion", "title": "HTML Skill修改讨论：整体问题怎样进入审阅", "document": true, "revision": 1, "review_complete": false, "units": [{"id": "purpose", "title": "这一轮要解决什么", "mode": "content", "options": [{"id": "purpose-current", "label": "当前建议", "blocks": [{"id": "purpose-current-text", "kind": "text", "html": "\u003cp\u003e审阅细节时，可能发现几个部分的关系、整体结构，甚至原先的目标需要调整。\u003cstrong\u003e已确定的结构应当允许重开讨论，HTML不能只接受现有段落内部的修改。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e下面是刚才建议中的两个实际取舍；其他建议直接批注。这一页先确定工作流改法，尚不修改Skill程序。\u003c/p\u003e", "hash": "d9f02ef8bb884c9bd33daaffacfd2ee73b5f4fa6bd07732e02cd3f5123ba4bee"}]}], "content_hash": "3269135c670bce63c57335217ebfe039b4d2a50c9f9cb5a1cdd4401bc759a9c6"}, {"id": "overall-entry", "title": "整体意见放在哪里？", "mode": "choices", "inline": true, "selected": null, "context": "局部批注继续使用；需要决定的是跨章节、涉及全文的意见怎样提出。", "options": [{"id": "entry-in-page", "label": "页面增加“整体意见”（建议）", "blocks": [{"id": "entry-in-page-text", "kind": "text", "html": "\u003cp\u003e在标题附近提供一个轻量入口，展开后写自由意见，\u003cmark\u003e不用挂在某段文字上，也不用先选择问题类别\u003c/mark\u003e，与本轮其他反馈一起提交。\u003c/p\u003e\u003cp\u003e能让整体意见与局部批注留在同一份审阅记录里；页面多一个入口。\u003c/p\u003e", "hash": "de7158dd61e7ee2e1c09dcdfce62d743be89dc029b1d22309a83983561b3740a"}]}, {"id": "entry-chat", "label": "整体问题继续在聊天里说", "blocks": [{"id": "entry-chat-text", "kind": "text", "html": "\u003cp\u003eHTML保留局部批注，\u003cmark\u003e跨部分、全文和目标层面的问题在聊天里讨论\u003c/mark\u003e，由Agent整理出决定后更新页面。\u003c/p\u003e\u003cp\u003e页面保持现状；整体讨论与局部记录分在两个地方。\u003c/p\u003e", "hash": "b4e35b007b54967cc6fc314f4922a053846067c3e41cbddf9f882f3f9800694c"}]}], "content_hash": "a559210d760c1bbac6773ac36e10c83ea570d115c40ac04be137195e79b2d455"}, {"id": "structure-response", "title": "发现结构问题后，先给什么？", "mode": "choices", "inline": true, "selected": null, "context": "Agent先识别影响范围：一句话的小修直接处理；牵动结构时按这里确定的方式推进。", "options": [{"id": "response-outline", "label": "先讨论简明骨架（建议）", "blocks": [{"id": "response-outline-text", "kind": "text", "html": "\u003cp\u003e先说明\u003cmark\u003e哪里不顺 → 为什么要动 → 建议怎样组织\u003c/mark\u003e，给一份短骨架和必要的改动对照；方向确定后，再调整正文和图。\u003c/p\u003e\u003cp\u003e适合结构方向尚未明确的时候，能先判断组织逻辑。\u003c/p\u003e", "hash": "d48b973cb3525dc7b583c978b08182553d2ac7543849fb3b24a345fc850e5b66"}]}, {"id": "response-rewrite", "label": "直接给一版重组稿", "blocks": [{"id": "response-rewrite-text", "kind": "text", "html": "\u003cp\u003e先按判断\u003cmark\u003e重组当前内容，直接展示完整改稿\u003c/mark\u003e，同时说明重要结构变化，再根据反馈调整。\u003c/p\u003e\u003cp\u003e适合希望看完整效果再判断的时候；方向改变会带来更多返工。\u003c/p\u003e", "hash": "a558d01ad18c6c697050f3f516fd24167df59611b3c4538e1a0b4018953a209e"}]}], "content_hash": "1a2ee144e06c6b8f5f4ef0d153c4d82afe2a6035ed3d8a2bd60574b39b5e2e4b"}, {"id": "preservation", "title": "调整结构时，已有内容怎样处理", "mode": "content", "options": [{"id": "preservation-current", "label": "当前建议", "blocks": [{"id": "preservation-current-text", "kind": "text", "html": "\u003cp\u003e原先确认的结构是当前依据，后续发现问题可以重新讨论；不必把工作固定成只能向前走的阶段。\u003c/p\u003e\u003cp\u003e移动章节尽量复用原文字、图和批注。拆分、合并时说明对应关系；旧批注不能无声贴到已经改写的内容上。沿用同一任务目录，用Git保留修订。\u003c/p\u003e\u003cp\u003e你不需要先判断问题属于“目的、结构还是细节”。Agent应先说明影响范围，并遵从“先讨论”或“直接改”的具体要求。\u003c/p\u003e", "hash": "935a85247a430e6f588c86c8858f71003cd64ebc6ee3361855b21d3bc4b02af1"}]}], "content_hash": "3a5d82564be92b4d55e5bad19df300b6516478eb4b5f7e029e4d57222d30dfbf"}, {"id": "result", "title": "怎样形成最终改法", "mode": "content", "options": [{"id": "result-current", "label": "当前建议", "blocks": [{"id": "result-current-text", "kind": "text", "html": "\u003cp\u003e提交取舍和批注后，我把采纳的建议整理成\u003cstrong\u003e一版连贯的工作流改法\u003c/strong\u003e，将未确定之处留在对应位置继续讨论。\u003c/p\u003e\u003cp\u003e本页的“落地存档”表示接受并保存这份改法；功能实现随后再开展。两个任务各自保存：这份Skill讨论不会覆盖Study04上半部分的审阅内容。\u003c/p\u003e", "hash": "98880e8b57cc198de5dab4b80174ffe99e789520f4759ffc91b13ec5ec26b996"}]}], "content_hash": "449998b02e14a120abdf3cac940000fd4c7b6aa0c44ae381622041e27c6ee614"}]}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});

}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const diverge=el('button','diverge');diverge.type='button';diverge.dataset.diverge='true';diverge.setAttribute('aria-label','继续发散');diverge.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7L5 7m7 7 7-7M5 12V7h5m4 0h5v5"/></svg>';head.append(diverge);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)

function syncControls(unit,node){const state=draft.units[unit.id],button=node.querySelector('.diverge'),active=state.action==='extend';button.setAttribute('aria-pressed',String(active));button.title=active?'已标记继续发散，点击取消':'继续发散';for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||'';for(const option of unit.options)for(const block of option.blocks)if(block.kind==='gallery'){const gallery=blockNode(unit.id,option.id,block.id)?.querySelector('.gallery');if(gallery)syncGallery(gallery,unit,option,block)}}
function render(nextBoard){
 const newRound=nextBoard.id!==board.id||nextBoard.revision!==board.revision;board=nextBoard;
 if(!draft||newRound){closeEditor(false);loadDraft()}
 $('title').textContent=board.title;document.title=board.title;$('round').textContent=`第 ${board.revision} 轮`;document.body.classList.toggle('document-board',!!board.document||board.units.some(isContent));
 const keep=new Set();
 for(const [index,unit] of board.units.entries()){keep.add(unit.id);let node=unitNode(unit);const unitSignature=JSON.stringify({id:unit.id,title:unit.title,mode:unit.mode,inline:unit.inline,context:unit.context,options:unit.options});if(!node||node.dataset.signature!==unitSignature){const replacement=createUnit(unit);replacement.dataset.signature=unitSignature;if(node)node.replaceWith(replacement);node=replacement}if($('units').children[index]!==node)$('units').insertBefore(node,$('units').children[index]||null);syncControls(unit,node);node.inert=false;for(const control of node.querySelectorAll('input,textarea,.diverge'))control.disabled=!!board.processing||!!board.submitted||!!board.review_complete}
 for(const node of [...$('units').children])if(!keep.has(node.dataset.unit))node.remove();
 $('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete||busy;$('submit').textContent=board.submitted&&!board.review_complete?'已提交':'提交';$('archive').hidden=board.allow_finish===false;$('archive').disabled=$('submit').disabled;$('archive').textContent=board.review_complete?'已落地存档':'落地存档';
 if(board.processing)status('正在更新');else if(board.review_complete)status('当前版本已接受并存档');else if(board.submitted)status(draft.intent==='archive'?'已送达，正在存档':'已提交，正在等待 Agent 处理');else status('');renderComments();
 const stable={...board};delete stable.submitted;signature=JSON.stringify(stable)
 if(newRound){hydrateDraft().then(restoreEditor)}
}
$('units').addEventListener('change',event=>{const unit=event.target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(event.target.type==='radio'){state.selected=event.target.value;for(const card of unit.querySelectorAll('.option'))card.classList.toggle('chosen',card.dataset.option===state.selected)}draft.submission_id=null;persist()});
$('units').addEventListener('click',event=>{const button=event.target.closest('button[data-diverge]');if(!button||button.disabled)return;const node=button.closest('[data-unit]'),unit=board.units.find(u=>u.id===node.dataset.unit),state=draft.units[unit.id];state.action=state.action==='extend'?'auto':'extend';draft.submission_id=null;syncControls(unit,node);persist()});
$('units').addEventListener('input',event=>{const target=event.target,unit=target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(target.dataset.note)state.notes[target.dataset.note]=target.value;else if(target.dataset.galleryNote){state.image_notes=state.image_notes.filter(n=>!(n.option_id===target.dataset.optionId&&n.block_id===target.dataset.galleryNote&&n.image_id===target.dataset.imageId));if(target.value.trim())state.image_notes.push({option_id:target.dataset.optionId,block_id:target.dataset.galleryNote,image_id:target.dataset.imageId,comment:target.value});target.closest('details').querySelector('summary').textContent=target.value?'本图备注（已填写）':'本图备注'}else return;draft.submission_id=null;persist()});
let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}
function fitImage(){const img=$('image-large'),stage=$('image-stage'),style=getComputedStyle(stage),width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);if(img.naturalWidth&&img.naturalHeight)sizeImage(Math.min(img.naturalWidth,width,height*img.naturalWidth/img.naturalHeight))}
function openImage(img){imageBlankPressed=false;imageSource=img;$('image-large').alt=img.alt||'放大的图像';$('image-large').onload=fitImage;$('image-large').src=img.currentSrc||img.src;$('image-viewer').showModal();document.body.classList.add('image-open');$('image-stage').scrollTo(0,0);if($('image-large').complete)fitImage();$('image-plus').focus({preventScroll:true})}
function closeImage(){$('image-viewer').close()}
$('image-viewer').addEventListener('close',()=>{document.body.classList.remove('image-open');if(imageSource?.isConnected)imageSource.focus({preventScroll:true})});
$('image-minus').onclick=()=>sizeImage(imageWidth/1.3);$('image-plus').onclick=()=>sizeImage(imageWidth*1.3);
let imageBlankPressed=false;
$('image-viewer').addEventListener('pointerdown',event=>{imageBlankPressed=event.target===$('image-viewer')||event.target===$('image-stage')});
$('image-viewer').addEventListener('click',event=>{if(imageBlankPressed&&(event.target===$('image-viewer')||event.target===$('image-stage')))closeImage();imageBlankPressed=false});
$('units').addEventListener('click',event=>{if(event.target.matches('.block img'))openImage(event.target)});
$('units').addEventListener('keydown',event=>{if(event.target.matches('.block img')&&['Enter',' '].includes(event.key)){event.preventDefault();openImage(event.target)}});
function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;$('editor-quote').textContent=anchor.quote;$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),first=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,last=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement,block=first.closest('[data-kind=text]');
 if(!block||last.closest('[data-kind=text]')!==block||!selection.toString().trim())return;
 const unit=block.closest('[data-unit]'),before=range.cloneRange();before.selectNodeContents(block);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length,end=start+range.toString().length,source=block.textContent;
 openEditor({id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())
}
document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});
$('editor-input').addEventListener('input',persist);
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function payload(){return {submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent:draft.intent||'submit',units:board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action==='extend'?'extend':'auto',notes:d.notes,annotations:d.annotations,image_notes:d.image_notes||[]}})}}
async function submit(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if($('editor-input').value.trim())saveNote();else closeEditor()}
 if(draft.intent!==intent){draft.submission_id=null;draft.intent=intent}const body=payload();persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');board.submitted=true;render(board);await loadHistory()}
 catch(error){status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>submit('submit');
$('archive').onclick=()=>submit('archive');
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
