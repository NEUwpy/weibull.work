*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,textarea,select{font:inherit}button,select,summary{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none;color:inherit}header{max-width:1240px;margin:auto;padding:42px 32px 16px;display:flex;align-items:baseline;gap:16px}h1{font-size:27px;font-weight:650;letter-spacing:-.5px;margin:0}#round{color:var(--muted);font-size:13px}.layout{max-width:1240px;margin:auto;padding:0 32px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}.has-comments .layout{max-width:1530px;grid-template-columns:minmax(0,1fr) 280px}.has-comments header{max-width:1530px}.unit{margin:26px 0 36px;scroll-margin-top:20px}.unit-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}h2{font-size:18px;font-weight:650;margin:0}.next{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}select{border:1px solid var(--line);border-radius:7px;padding:5px 25px 5px 10px;color:var(--ink);background:var(--paper)}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:16px;align-items:start}.option{background:var(--paper);border:1px solid var(--line);border-radius:11px;overflow:hidden;transition:border-color .15s}.option.chosen{border-color:var(--accent)}.option h3{margin:0;padding:17px 20px 9px;font-size:14px;font-weight:600}.preview{padding:5px 20px 8px}.block{overflow-wrap:anywhere}.block p{margin:8px 0 16px}.block[data-kind=text]{font-size:16px;line-height:1.9}.block img{display:block;max-width:100%;height:auto;margin:4px auto 12px}.block svg{display:block;width:100%;height:auto}.block table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.block th,.block td{text-align:left;border-bottom:1px solid var(--line);padding:10px 6px;vertical-align:top}.block th{font-weight:600;color:var(--muted)}.choice-row{min-height:48px;border-top:1px solid #f0f2ef;display:flex;align-items:center;justify-content:center;position:relative}.dot{display:grid;place-items:center;width:48px;height:46px;cursor:pointer}.dot input{appearance:none;width:19px;height:19px;border:1.5px solid #a6b2a9;border-radius:50%;margin:0;cursor:pointer;display:grid;place-content:center}.dot input:checked{border-color:var(--accent)}.dot input:checked:after{content:"";width:9px;height:9px;background:var(--accent);border-radius:50%}.note{padding:0 16px 8px}.note summary{font-size:12px;color:var(--muted);list-style:none;text-align:right}.note summary::-webkit-details-marker{display:none}.note textarea{margin-top:8px}.note:has(textarea:not(:placeholder-shown)) summary{color:var(--accent)}textarea{width:100%;resize:vertical;min-height:86px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:#fff;color:var(--ink);line-height:1.6}.comment-rail{display:none;padding-top:32px}.has-comments .comment-rail{display:block}.annotation{background:#fff;border:1px solid var(--line);border-radius:9px;margin:0 0 12px;padding:13px 14px;font-size:13px}.quote{border-left:2px solid #b5caba;padding-left:9px;color:var(--muted);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:74px;overflow:auto}.annotation p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.annotation-tools{display:flex;justify-content:flex-end;gap:9px}.quiet{font-size:12px;color:var(--muted);padding:2px 0}.quiet:hover{color:var(--accent)}#editor{position:fixed;z-index:10;width:285px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px #243d2824;padding:15px;right:24px}#editor[hidden]{display:none}#editor textarea{margin-top:12px}.editor-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:9px}.save{color:var(--accent);font-weight:600}.history{margin:26px 0;color:var(--muted);font-size:13px}.history summary{width:max-content}.history-round{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.history-round p{margin:5px 0}.history-round ul{padding-left:20px;margin:5px 0}.history-round li{white-space:pre-wrap;overflow-wrap:anywhere}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}.footer-inner{max-width:1240px;margin:auto;padding:14px 32px;display:flex;align-items:center;justify-content:flex-end;gap:20px}#status{font-size:13px;color:var(--muted);margin-right:auto}#status.error{color:var(--warn)}#submit{background:var(--accent);color:#fff;border-radius:8px;min-width:106px;padding:10px 22px;font-weight:600}#submit:disabled{opacity:.55;cursor:default}::selection{background:#f5df9d}::highlight(review-notes){background:#f5e8bb;text-decoration:underline;text-decoration-color:#b69a45}

<script id="initial-board" type="application/json">{"id": "study04-comparison-v04", "title": "方法对比：当前表达与批注", "document": true, "revision": 9, "source": "../表达方式发散.md", "source_fingerprint": "80b20550d2fa68f8ecf1299cebc77c931f06639aa7c90c45468fc313abef9b0c", "content_fingerprint": "39ff9b0549d9d3c387ec6b1d827d6a59071514105edac06662dd4d3f2be6a09b", "units": [{"id": "text-b002", "title": "当前表达：沿骨架继续审阅", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e骨架保留为\u003cstrong\u003e整体差异 → 条件变化 → 误差与代价 → 典型解释 → 选择启示\u003c/strong\u003e。下面只展示当前选定的方向，继续讨论图怎样讲清问题，尚未扩写成完整讲稿；可直接在文字和图下批注。\u003c/p\u003e", "hash": "a391638edf26cb9c4ecdc8a6b94fac46bef2223f6139ecc5fadfe1b35f907908"}]}], "content_hash": "04a0f63962bff2d07fb5fefd5dd5e96c064e0a67a95884e262739e70ae40e19f"}, {"id": "evidence-base", "title": "共用素材与口径", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e已有七种方法、8个β×5个n、每条件1200次的结果。预览主要复用这些数据；形状、尺度、位置分开。主要精度预览用七法共同有效样本，返回率用全部尝试；单个条件图只演示表达结构，不代替全域证据。\u003c/p\u003e", "hash": "d4d00bfd26c13c15ec826c34fe6030e4fb119e7dd4672bca93e8bfd21e41c5c6"}]}], "content_hash": "f04e04802537a8324c132f1084e6f91c88b430b0b44d5dd2a8e70773abb1f246"}, {"id": "text-b003", "title": "1　整体差异在哪些地方值得看", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e本处要讲清：\u003c/strong\u003e七种方法在相同条件下究竟相差多少；是大多数方法分开，还是某个极端方法拉开了量程？\u003cbr\u003e这里先辨认整体格局，变化规律放到下一处。\u003c/p\u003e", "hash": "6f052ed436c7c11d5ec0d4ca2c2b91db2be8a005884259fbf8ce1b57375fc84e"}]}], "content_hash": "d2d86700687132b79e1bfcfa91ec90b5beda695e3c73d430d44e50beebdb74ed"}, {"id": "figure-global", "title": "整体差距：直接读百分比", "mode": "content", "state": "converged", "selected": "A", "options": [{"id": "A", "label": "A · 主体差距：直接读多出百分之多少", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_整体差距百分比.png", "alt": "主体差距：直接读多出百分之多少", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e按“一眼能看出差异”的要求，缩为三个面板；每格为七法RMSE中位数相对本条件最小值多出的百分比。三列共用同一分档色标，数字可直接读；极端差距留到风险部分。\u003c/p\u003e", "hash": "e86e89c35ad3d54943d2216c9ffa9bf767002e1a99e7d6c6a94617258fcf9319"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e哪些n、β区域的方法差距更明显，以及三个参数的差距是否相同；七种方法中至少四种的RMSE达到该格中位水平。\u003c/p\u003e", "hash": "2cbf3aebdde67e5ce9866f7850c8699b66cf0e1ed1f2eea7ad332b4fc6092b74"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003e中位数仍压缩了具体方法身份；颜色只帮助辨认幅度，不是优劣门槛。若仍需解释很久才能读懂，应继续换表达。\u003c/p\u003e", "hash": "9ee31d66f0689c6ed06702da4f5bbe3f97ce8946e1a018d3f566f4fa09ccb86c"}]}], "content_hash": "63da6ac09c9d08eb018049c81560d50ed0542414078ff7def4149e2173c57a57"}, {"id": "text-b013", "title": "2　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e本处要讲清：\u003c/strong\u003e同样减少样本，各方法的相对距离怎样变化；不同β下，这种变化是否一致？\u003cbr\u003e保留全部七法作为比较底座，下面尝试不同的信息展开顺序。\u003c/p\u003e", "hash": "8fdf7b75b5770f88d2ba24c04d3f188e03f452cc0dc06d7edeebc709842d01fb"}]}], "content_hash": "9d39c1b4b01eb19dc0dede58c02387b69a3e57ad617c11ac7b7bd16ef55ea3ed"}, {"id": "figure-change", "title": "差距变化：六法线性玫瑰图与MM数值", "mode": "content", "state": "converged", "selected": "C", "options": [{"id": "C", "label": "C · 六法线性玫瑰图＋MM数值带", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_六法线性玫瑰图与MM数值带.png", "alt": "六法线性玫瑰图与MM数值带", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003eβ=5，n=50→20→15→10→7。上方六法恢复原有线性半径，五图同一量程；下方三行是MM的实际标准化RMSE，分别与五档n对齐。仍是七法共同有效口径；形状除以5，尺度与位置除以1000。\u003c/p\u003e", "hash": "4e9179c83eda4cca1c8274441cf1b74b99ab656311ad8875258efd31e8ff60ce"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e六法的误差轮廓及差距怎样随n变化，同时保留MM的完整数值；不让MM的量级决定主图半径。\u003c/p\u003e", "hash": "3178ad8f8eca9e9598e9c00ee0b90de71ac254af46f2ef6b5e6b3bf502e1c20c"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003eMM改用数值呈现，其极端形状估计放到风险部分解释。这里只展示β=5，其他β仍需核对。\u003c/p\u003e", "hash": "833bd0b86e124b2ea4873cf7fc41a67615c7de417dbcda09d65e78327659125d"}]}], "content_hash": "31585d73c29744f6a68371ae55d8a9e66f4648d22e16b884bd703740da6fcc0e"}, {"id": "text-b023", "title": "3　差距体现为怎样的误差和代价", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e本处要讲清：\u003c/strong\u003e前面看到的差距，究竟对应持续偏移、重复波动、极端输出，还是没有返回有效估计？\u003cbr\u003e用分布图看偏移与波动，用频率图看明显异常与返回情况。\u003c/p\u003e", "hash": "2b70f66fe8f8c89000aa9698c29b519c56c97b922b0ea1fe791970ac271ff5be"}]}], "content_hash": "f8fe425dd9e91dca541c0874187a0ada4487b1c717e5185077ff6bacf31659fc"}, {"id": "figure-error", "title": "偏移与波动：两档n的估计值分布", "mode": "content", "state": "converged", "selected": "C", "options": [{"id": "C", "label": "C · 估计值分布：减为两档n", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_估计值分布_两档n.png", "alt": "估计值分布：减为两档n", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e保留β=5及七法，n纵向、三参数横向；只显示n=50和7两行。移除逐样本散点及中位数符号，仅留密度形状、均值、25%—75%区间和真值。沿用各方法自身有效结果与原显示窗口；密度显示窗口内的主体形状，均值及区间使用全部有效值，风险在3b另看。\u003c/p\u003e", "hash": "716c07b69559ab404e44d7ebb053f3b625915192a5d1d99d6c75bcef700ab385"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e均值是否偏离真值，以及分布是否变宽；保留原分布图的读法，减少面板与叠加标记。\u003c/p\u003e", "hash": "98bae8f5bcf342cb9d9c36b89e96620625ae7b2551561967faee3a850f12edb7"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003e这里看不到中间三档n，也不能从显示窗口判断全部极端输出。精度主图用共同有效集合，本图用自身有效集合，二者数值不直接对照。\u003c/p\u003e", "hash": "f5038e204b771f554a91546d892a7daea7bc26a35a9038189ab9241f1714a544"}]}], "content_hash": "5166886bdac41bc3498e930f3e454cf0d92746f7ed417cc4b6c3b4a7efe9801d"}, {"id": "figure-tail", "title": "异常与返回：全条件发生频率与有效率", "mode": "content", "state": "converged", "selected": "B", "options": [{"id": "B", "label": "B · 全条件发生频率与有效率", "blocks": [{"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e两张图分开表达：有效但形状明显偏离，以及是否返回有效估计。异常阈值沿用β̂≤β/3或β̂≥3β，异常率以有效数为分母，有效率以1200次为分母。\u003c/p\u003e", "hash": "c4109d863616e5962cd4464977615ec6dad25315c767d9067274261f83a727d8"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e能看问题在哪些条件反复出现，而不是只被一条极端记录吸引。\u003c/p\u003e", "hash": "d8a2fb8fadebab99123a2beef54d58b10f3eac5275398a07b45bc9bb616bc10d"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003e频率不说明损失有多大；阈值要能说明，0次发生也仍是本批观察。\u003c/p\u003e", "hash": "048aff18f9f1ee6d90c4de2a6ef1df55c9e3c9d96303dd1ff9ca42e1f3d30a38"}]}], "content_hash": "931d5c08201609fea706d541292adb583fcda24753e4f654ee3da9d6660c4f9f"}, {"id": "text-b035", "title": "4　典型解释怎样接回方法构造", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e本处要讲清：\u003c/strong\u003e前面看到的偏移与异常，已有研究怎样解释？\u003cbr\u003e复用Research00报告1、2：先用起点信息不足与参数补偿说明小n、大β的共同背景，再沿定位、形状确定、尺度恢复三个环节，展示系统偏移与明显异常怎样形成。\u003c/p\u003e", "hash": "a4d9c2f243d4ef6f3f9fbae8bea87eea8aee27ad95787dd6485e27bc94cfc81c"}]}], "content_hash": "2f76d48fcf0faffc82efd958d1164ba4a88dfbe4b08eb16cf1b1c97020e91412"}, {"id": "figure-mechanism", "title": "解释：共同背景与方法过程", "mode": "content", "state": "converged", "selected": "A", "options": [{"id": "A", "label": "A · 方法过程与偏差传递：系统偏移及明显异常", "blocks": [{"id": "background-heading", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e共同背景：小n、大β\u003c/strong\u003e\u003c/p\u003e", "hash": "e664d52e9b65bd5b524cf94561ff0dfdbc3e97575b4a65f57d6f43a9e841cce5"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "background-sample-caption", "kind": "text", "html": "\u003cp\u003e来源：报告1第2章、图2，β=2与5，n=7、15、30，每格50组；下排为样本最小值的理论密度。先让人看到：高β、样本较少时，最小观测往往仍离真实起点较远。\u003c/p\u003e", "hash": "2152d0f1e6092456afb25e09ad7fd81b26ec05e1e50f1e333b4e04c63fbc527d"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "background-scope", "kind": "text", "html": "\u003cp\u003e接原报告图3：W(5,1000,500)与W(2,500,1000)参数相差明显，在这组观测覆盖的中部区间却有相近曲线。这是为说明局部相容性设置的两个分布，并非两种方法的估计对比；黑点来自原β=5、n=7第31组。\u003c/p\u003e", "hash": "6eb838c1109b7896f5b756ca6409ac11e9805e97de5e23dd61b0ae534e71570c"}, {"id": "process-heading", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e沿方法过程追踪偏差传递\u003c/strong\u003e\u003c/p\u003e", "hash": "98358db538826b57d29a2a8fb3433682e7696583444dbe1dac83061f29e38c37"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e先保留报告1第2.6节、图15，作为系统偏移的过程例：K–R由最小值定位，再拟合保留距离；高β例呈现位置偏高、形状和尺度偏低。这幅50组历史图展示有规律的偏移。\u003c/p\u003e", "hash": "0074d3f59baa94e25319f664e015820fb67afc4b8e120017964372fe42ea88c8"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "abnormal-caption", "kind": "text", "html": "\u003cp\u003e同一过程形式再看明显异常：复用报告2图19，W(5,100,500)、n=7，上排正常第10组，下排异常第11组。异常样本先以575.95定位，保留距离更分散，形状峰落在1.54，低于5/3；尺度随之得到28.69。三列依次读“怎样定位—形状怎样确定—尺度怎样恢复”。\u003c/p\u003e", "hash": "fa631ac8407b6d61063eea43c70654db36b8899b982bc7086e8a4fa1563925f9"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e沿方法实际步骤追踪，看到位置选择怎样带动形状和尺度；用同一形式分别讲系统偏移与明显异常。正式讲述可只展开其中一例。\u003c/p\u003e", "hash": "663aadd068e1faae23d2c36069aa93d33ca3c6a09b7e62ab1f61077e62af5c08"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003e两幅都是Research00原案例，不并入本轮频率。报告1图15用于有规律的偏移，报告2图19中的第11组达到明显异常判据；选定后再精简面板。\u003c/p\u003e", "hash": "005796a0c4acfc285010b7da7b23be1430bfc494622dc68e43eacbedcc90df0f"}]}], "content_hash": "b41da5f18f63df3be195d326062e3944cc0cc6a1450c8a954e1c032c4a672c48"}, {"id": "text-b044", "title": "5　比较怎样转为选择启示", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e本处要讲清：\u003c/strong\u003e方法差异对什么选择有用，需要知道哪些信息，以及参数目标换成寿命目标后应怎样重新判断？\u003cbr\u003e这里先试表达形式，尚不写推荐规则或自动选法结论。\u003c/p\u003e", "hash": "ec950589a1261fcf2cb92779786ded33ea20a70b8a08857c0c3c99f984143324"}]}], "content_hash": "2387c976b1e5af69ca834d9bafa5074c7c57c75e6a435fed8b138746d65ed99d"}, {"id": "figure-life", "title": "选择启示：候选方法与差距的条件表", "mode": "content", "state": "converged", "selected": "A", "options": [{"id": "A", "label": "A · 条件表：候选名称与差距一起看", "blocks": [{"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e统一使用七法共同有效样本。格内为最低RMSE方法；下行百分数为第二低RMSE比最低值高多少。颜色只区分方法。B10对应可靠度0.90，B1对应0.99，微小差距按点估计呈现。\u003c/p\u003e", "hash": "d508bde56da3334ec614b292e39c0badefff4cf14f58b97cf35a3e78e6be15c7"}, {"id": "what", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e能讲清：\u003c/strong\u003e保留你觉得有意思的n×β表格形式，同时显示第一、第二候选相差多少。\u003c/p\u003e", "hash": "aae634928881c10da34e9110a51f7ddfb38759fa02d5fc4ab5ee81320e5e2c39"}, {"id": "tradeoff", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e会省略／还要补：\u003c/strong\u003e真β在实际使用时未知；微小差距仍须核对不确定性，不能把地图直接当可用选择器。\u003c/p\u003e", "hash": "826b837fb09d624063594091c0a0dd4ca0d274ac9bde74568e9678943cfd59bd"}]}], "content_hash": "264f48c801741c6bb7d8736070e2130b9ef44aa32f32ad73cf990ba069ae61dd"}, {"id": "closing-slot", "title": "收尾位置先保留", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "骨架与问题", "blocks": [{"id": "skeleton", "kind": "text", "html": "\u003cp\u003eAI辅助选法与weibull.work仍放在结尾。当前只保留\u003cstrong\u003e已有比较 → 利用具体样本信息的下一步研究 → 网站方法入口\u003c/strong\u003e这条衔接，不预写寒暄或完整口述。\u003c/p\u003e", "hash": "1a9f3201b1b06c3623a824ceebbf5912e5c7e09411ec5ce9d7fd7c950858bc86"}]}], "content_hash": "dbdabf28242b7538ea896a71dd44170e85db3bd8b2d1a898f17cbc65616223f7"}], "stage": "selected-presentation", "review_complete": false, "last_applied_submission_id": "31623669-9373-400f-8478-17efae9172dd"}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'按反馈处理',defer:'待定',converge:'收敛',extend:'扩展',modify:'修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,finish_review:false}}
function fillDraft(){for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const next=el('details','handling');next.append(el('summary','','处理'));const select=el('select');select.setAttribute('aria-label',`${unit.title}下一步`);select.dataset.action='true';
 for(const [value,label] of Object.entries(actionLabels)){const option=el('option','',label);option.value=value;select.append(option)}next.append(select);head.append(next);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)
 }
 section.append(grid);return section
}
function syncControls(unit,node){const state=draft.units[unit.id];node.querySelector('select').value=state.action;for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||''}
function render(nextBoard){
 const newRound=nextBoard.id!==board.id||nextBoard.revision!==board.revision;board=nextBoard;
 if(!draft||newRound){closeEditor(false);loadDraft()}
 $('title').textContent=board.title;document.title=board.title;$('round').textContent=`第 ${board.revision} 轮`;document.body.classList.toggle('document-board',!!board.document||board.units.some(isContent));
 const keep=new Set();
 for(const [index,unit] of board.units.entries()){keep.add(unit.id);let node=unitNode(unit);const unitSignature=JSON.stringify({id:unit.id,title:unit.title,mode:unit.mode,inline:unit.inline,context:unit.context,options:unit.options});if(!node||node.dataset.signature!==unitSignature){const replacement=createUnit(unit);replacement.dataset.signature=unitSignature;if(node)node.replaceWith(replacement);node=replacement}if($('units').children[index]!==node)$('units').insertBefore(node,$('units').children[index]||null);syncControls(unit,node);node.inert=false;for(const control of node.querySelectorAll('input,select,textarea'))control.disabled=!!board.processing||!!board.submitted||!!board.review_complete}
 for(const node of [...$('units').children])if(!keep.has(node.dataset.unit))node.remove();
 $('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete||busy;$('submit').textContent=board.review_complete?'已完成':board.submitted?'已提交':'提交';$('finish-control').hidden=!!board.review_complete||board.allow_finish===false;$('finish-review').checked=!!draft.finish_review;$('finish-review').disabled=!!board.submitted||!!board.processing;
 if(board.processing)status('正在更新');else if(board.review_complete)status('本轮已完成');else if(board.submitted)status('已提交，正在等待 Agent 处理');else status('');renderComments();
 const stable={...board};delete stable.submitted;signature=JSON.stringify(stable)
 if(newRound){hydrateDraft().then(restoreEditor)}
}
$('units').addEventListener('change',event=>{const unit=event.target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(event.target.type==='radio'){state.selected=event.target.value;for(const card of unit.querySelectorAll('.option'))card.classList.toggle('chosen',card.dataset.option===state.selected)}if(event.target.dataset.action)state.action=event.target.value;draft.submission_id=null;persist()});
$('units').addEventListener('input',event=>{if(event.target.dataset.note){const unit=event.target.closest('[data-unit]');draft.units[unit.dataset.unit].notes[event.target.dataset.note]=event.target.value;draft.submission_id=null;persist()}});
let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}
function fitImage(){const img=$('image-large'),stage=$('image-stage'),style=getComputedStyle(stage),width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);if(img.naturalWidth&&img.naturalHeight)sizeImage(Math.min(img.naturalWidth,width,height*img.naturalWidth/img.naturalHeight))}
function openImage(img){imageBlankPressed=false;imageSource=img;$('image-large').alt=img.alt||'放大的图像';$('image-large').onload=fitImage;$('image-large').src=img.currentSrc||img.src;$('image-viewer').showModal();document.body.classList.add('image-open');$('image-stage').scrollTo(0,0);if($('image-large').complete)fitImage();$('image-plus').focus({preventScroll:true})}
function closeImage(){$('image-viewer').close()}
$('image-viewer').addEventListener('close',()=>{document.body.classList.remove('image-open');if(imageSource?.isConnected)imageSource.focus({preventScroll:true})});
$('image-minus').onclick=()=>sizeImage(imageWidth/1.3);$('image-plus').onclick=()=>sizeImage(imageWidth*1.3);
let imageBlankPressed=false;
$('image-viewer').addEventListener('pointerdown',event=>{imageBlankPressed=event.target===$('image-viewer')||event.target===$('image-stage')});
$('image-viewer').addEventListener('click',event=>{if(imageBlankPressed&&(event.target===$('image-viewer')||event.target===$('image-stage')))closeImage();imageBlankPressed=false});
$('units').addEventListener('click',event=>{if(event.target.matches('.block img'))openImage(event.target)});
$('units').addEventListener('keydown',event=>{if(event.target.matches('.block img')&&['Enter',' '].includes(event.key)){event.preventDefault();openImage(event.target)}});
function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;$('editor-quote').textContent=anchor.quote;$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),first=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,last=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement,block=first.closest('[data-kind=text]');
 if(!block||last.closest('[data-kind=text]')!==block||!selection.toString().trim())return;
 const unit=block.closest('[data-unit]'),before=range.cloneRange();before.selectNodeContents(block);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length,end=start+range.toString().length,source=block.textContent;
 openEditor({id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())
}
document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});
$('editor-input').addEventListener('input',persist);
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function payload(){return {submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,finish_review:!!draft.finish_review,units:board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action,notes:d.notes,annotations:d.annotations}})}}
async function submit(){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if($('editor-input').value.trim())saveNote();else closeEditor()}
 for(const unit of board.units){const state=draft.units[unit.id],feedback=state.annotations.length||Object.values(state.notes).some(v=>v.trim());if(!isContent(unit)&&!['auto','defer'].includes(state.action)&&!state.selected&&!(state.action==='modify'&&feedback)){status(`${unit.title}：请先选择方案`,true);unitNode(unit).scrollIntoView({behavior:'smooth',block:'center'});return}}
 const body=payload();persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;status('正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');board.submitted=true;render(board);await loadHistory()}
 catch(error){status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete}
}
$('submit').onclick=submit;
$('finish-review').onchange=()=>{draft.finish_review=$('finish-review').checked;draft.submission_id=null;persist()};
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}`));for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
