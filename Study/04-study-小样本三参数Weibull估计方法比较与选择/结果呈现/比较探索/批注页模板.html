<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Study04 · 方法对比讨论稿 v0.4</title>
<style>
:root{color-scheme:light;--ink:#222e31;--muted:#647376;--line:#dce3df;--accent:#255e52;--paper:#f1f4f2;--note:#fff0b5}*{box-sizing:border-box}body{margin:0;font:16px/1.9 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #becbc3;border-radius:6px;background:white;padding:6px 12px;color:var(--ink)}button:hover{background:#edf5ef}button.primary{background:var(--accent);color:white;border-color:var(--accent)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 25px;position:sticky;top:0;z-index:10}.head{max-width:1410px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:650;margin-right:auto}.status{font-size:12px;color:var(--muted);width:100%;line-height:1.5}nav{max-width:1410px;margin:16px auto 0;padding:0 20px;display:flex;gap:7px;flex-wrap:wrap}nav a{font-size:12px;color:var(--accent);text-decoration:none;padding:3px 9px;border-radius:4px;background:#e5ede7}.layout{max-width:1450px;margin:18px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}article{padding:32px 42px 45px;background:white;border:1px solid var(--line);border-radius:8px;min-width:0}h1{font-size:27px;line-height:1.5;margin:0 0 16px}h2{font-size:23px;line-height:1.55;margin:39px 0 15px;padding-top:10px;border-top:1px solid var(--line);scroll-margin-top:135px}p{margin:15px 0}blockquote{margin:15px 0;padding:9px 14px;background:#f4f7f5;color:var(--muted);font-size:13px;border-left:3px solid #d5e0d8}code{font:15px/1.7 "Cambria Math","Segoe UI",sans-serif;color:#26473a;overflow-wrap:anywhere}.table-wrap{overflow:auto;margin:23px 0}table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.75}th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:right;min-width:62px}th:first-child,td:first-child{text-align:left}th{background:#eff4f1;font-weight:600}figure{margin:26px 0 30px;padding:14px 0 15px;border-block:1px solid #e5ebe7}.data-image{display:block;width:100%;height:auto;cursor:zoom-in}figcaption{color:var(--muted);font-size:12px;line-height:1.8;margin:12px 0}.switch{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 5px}.switch button{font-size:12px;text-align:left;border-radius:5px}.switch [aria-selected="true"]{background:var(--accent);color:white;border-color:var(--accent)}.choice-status{font-size:11px;color:var(--muted)}.figure-note{font-size:11px;padding:2px 8px;margin-top:8px}aside{position:sticky;top:132px;padding:18px;background:white;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 155px);overflow:auto;font-size:13px;line-height:1.75}aside h3{font-size:15px;margin:0 0 8px}aside p{margin:6px 0 12px;color:var(--muted);font-size:12px}textarea{width:100%;min-height:100px;resize:vertical;border:1px solid #bdcac2;border-radius:5px;padding:9px;color:var(--ink);background:#fcfdfc;font-size:13px;line-height:1.8}.note-editor{margin:16px 0;border-block:1px solid var(--line);padding:13px 0}.quote{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f6f2;color:#52675b;padding:8px;margin-bottom:8px;font-size:12px;max-height:170px;overflow:auto}.editor-actions{display:flex;gap:6px;margin-top:7px}.note{padding:12px 0;border-top:1px solid var(--line)}.note textarea{min-height:75px}.note button{font-size:11px;padding:2px 7px;margin-top:5px}.note-count{font-size:12px;color:var(--muted);margin:15px 0 7px}.annotation-mark{background:var(--note);border-bottom:1px solid #d8b12c;cursor:pointer}#selection-bar{position:fixed;z-index:20;bottom:22px;left:calc(50% - 95px);box-shadow:0 4px 20px #0002;background:white;padding:7px;border:1px solid var(--line);border-radius:8px}.zoom{position:fixed;inset:0;background:#18241ee8;z-index:40;overflow:auto;padding:48px 20px 25px}.zoom img{display:block;width:min(1800px,100%);height:auto;margin:0 auto;background:white}.zoom button{position:fixed;right:18px;top:10px}.hidden,[hidden]{display:none!important}a{color:var(--accent)}.footer{font-size:12px;color:var(--muted);margin-top:25px}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 260px;gap:13px}article{padding:25px}aside{top:150px}h1{font-size:24px}h2{font-size:21px}}
@media(max-width:800px){header{position:static;padding:14px}.layout{display:block;padding:0 12px}article{padding:21px}aside{position:static;max-height:none;margin-top:18px}.brand{width:100%}nav{padding:0 12px}nav a{font-size:11px}.zoom img{width:1400px;max-width:none}.zoom{padding:48px 5px}h2{scroll-margin-top:15px}}
@media print{header,nav,aside,.switch,.choice-status,.figure-note,#selection-bar{display:none!important}.layout{display:block;margin:0;padding:0}article{border:0;padding:0}.annotation-mark{background:transparent}body{background:white}}
</style></head><body>
<header><div class="head"><span class="brand">Study04 · 方法对比讨论稿 v0.4</span><button class="primary" id="export">导出反馈表单</button><button id="import">载入反馈表单</button><button id="export-md">导出当前Markdown</button><input type="file" id="feedback-file" accept=".json,application/json" hidden><div class="status" id="status" aria-live="polite">图下切换A／B方案；划选正文或表格文字后点“批注所选文字”。完成后导出JSON交回，继续修改文章。</div></div></header>
<nav aria-label="文章目录">__NAV__</nav><div class="layout"><article id="article">__ARTICLE__</article>
<aside aria-label="文章批注"><h3>阅读与批注</h3><p>正文是一条连续论证。图下的方案提供不同表达，点击即记录你的选择；图像可放大。</p><label for="overall">全文意见</label><textarea id="overall" placeholder="哪些问题讲清了，哪里还缺依据，哪些内容需要删改？"></textarea>
<section id="editor" class="note-editor" hidden><h3>新增定位批注</h3><div class="quote" id="selected-quote"></div><textarea id="note-text" aria-label="定位批注意见" placeholder="写下对这段文字、表格或图像的意见"></textarea><div class="editor-actions"><button class="primary" id="save-note">保存批注</button><button id="cancel-note">取消</button></div></section>
<div class="note-count" id="note-count">尚无定位批注</div><div id="notes"></div><p class="footer">反馈保存在此浏览器。请导出表单保留；表单包含方案选择、原文位置和批注，不含原始样本数据。</p></aside></div>
<div id="selection-bar" hidden><button class="primary" id="annotate-selection">批注所选文字</button></div><div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="放大图像" hidden><button id="close-zoom">关闭 · Esc</button><img id="zoom-image" alt="放大的图像"></div>
<script id="model" type="application/json">__MODEL__</script>
<script>
'use strict';
const MODEL=JSON.parse(document.getElementById('model').textContent);
const article=document.getElementById('article');
const KEY=MODEL.version+'-'+MODEL.source_fingerprint.slice(0,10)+'-'+MODEL.content_fingerprint.slice(0,10);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(){return {version:MODEL.version,source_fingerprint:MODEL.source_fingerprint,content_fingerprint:MODEL.content_fingerprint,choices:{},notes:[],overall:''};}
function validate(input){
 for(const k of ['version','source_fingerprint','content_fingerprint'])if(input?.[k]!==MODEL[k])throw new Error('表单版本、稿件内容或数据来源不匹配。');
 const out=empty();out.overall=String(input.overall||'');
 for(const [group,value] of Object.entries(input.choices||{})){if(!MODEL.figures[group]||!MODEL.figures[group][value.charCodeAt(0)-65])throw new Error('表单中有未知方案。');out.choices[group]=value;}
 for(const note of input.notes||[]){if(!Array.isArray(note.anchors)||!note.anchors.length)throw new Error('定位批注缺少原文位置。');for(const a of note.anchors){const el=article.querySelector('[data-anchor="'+CSS.escape(a.block)+'"]');if(!el||el.textContent.slice(a.start,a.end)!==a.quote)throw new Error('批注对应的原文已经变化。');}out.notes.push({id:String(note.id),quote:String(note.quote||''),text:String(note.text||''),anchors:note.anchors,created_at:note.created_at});}
 return out;
}
let state=empty();try{const saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){document.getElementById('status').textContent='原反馈未自动载入：'+e.message+' 可用导出的JSON重新载入。';}
let pending=null;let selected=null;
function status(message){document.getElementById('status').textContent=message;}
function save(){state.updated_at=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));status('已保存在此浏览器 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'。完成后导出反馈表单交回。');}catch(e){status('浏览器暂不能保存，请导出反馈表单保留。');}}
function showChoices(){for(const figure of article.querySelectorAll('[data-group]')){const group=figure.dataset.group;const choice=state.choices[group]||'A';for(const panel of figure.querySelectorAll('[data-panel]'))panel.hidden=panel.dataset.panel!==choice;for(const button of figure.querySelectorAll('[data-choice]'))button.setAttribute('aria-selected',String(button.dataset.choice===choice));const label=figure.querySelector('.choice-status');if(label)label.textContent=state.choices[group]?'已选方案'+choice+'，已记入反馈表单。':'当前预览A，尚未确定采用。';}}
function position(el,container,offset){const r=document.createRange();r.selectNodeContents(el);r.setEnd(container,offset);return r.toString().length;}
function captureSelection(){
 const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount){document.getElementById('selection-bar').hidden=true;return;}
 const range=s.getRangeAt(0);if(!article.contains(range.startContainer)||!article.contains(range.endContainer))return;
 const anchors=[];
 for(const el of article.querySelectorAll('[data-anchor]')){
  if(el.closest('[hidden]')||!range.intersectsNode(el))continue;
  let start=0,end=el.textContent.length;
  if(el.contains(range.startContainer))start=position(el,range.startContainer,range.startOffset);
  if(el.contains(range.endContainer))end=position(el,range.endContainer,range.endOffset);
  if(end>start)anchors.push({block:el.dataset.anchor,start,end,quote:el.textContent.slice(start,end),before:el.textContent.slice(Math.max(0,start-30),start),after:el.textContent.slice(end,end+30)});
 }
 if(!anchors.length)return;
 selected={quote:s.toString().trim(),anchors};document.getElementById('selection-bar').hidden=false;
}
article.addEventListener('mouseup',captureSelection);article.addEventListener('keyup',captureSelection);
function openEditor(item){pending=item;document.getElementById('selected-quote').textContent=item.quote;document.getElementById('note-text').value='';document.getElementById('editor').hidden=false;document.getElementById('selection-bar').hidden=true;document.getElementById('note-text').focus();}
document.getElementById('annotate-selection').addEventListener('mousedown',e=>e.preventDefault());
document.getElementById('annotate-selection').addEventListener('click',()=>{if(selected)openEditor(selected);});
document.getElementById('cancel-note').addEventListener('click',()=>{pending=null;document.getElementById('editor').hidden=true;});
function paint(){
 for(const mark of article.querySelectorAll('mark.annotation-mark')){mark.replaceWith(...mark.childNodes);}article.normalize();
 const pieces=state.notes.flatMap(n=>n.anchors.map(a=>({...a,id:n.id})));
 for(const piece of pieces){const el=article.querySelector('[data-anchor="'+CSS.escape(piece.block)+'"]');if(!el)continue;const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node,offset=0,startNode,endNode,startOff,endOff;
  while((node=walker.nextNode())){const next=offset+node.textContent.length;if(!startNode&&piece.start<next){startNode=node;startOff=piece.start-offset;}if(piece.end<=next){endNode=node;endOff=piece.end-offset;break;}offset=next;}
  if(!startNode||!endNode)continue;const range=document.createRange();range.setStart(startNode,startOff);range.setEnd(endNode,endOff);const mark=document.createElement('mark');mark.className='annotation-mark';mark.dataset.noteId=piece.id;mark.append(range.extractContents());range.insertNode(mark);
 }
}
function renderNotes(){document.getElementById('note-count').textContent=state.notes.length?'定位批注 · '+state.notes.length+'条':'尚无定位批注';document.getElementById('notes').innerHTML=state.notes.map(n=>'<div class="note" id="note-'+esc(n.id)+'"><div class="quote">'+esc(n.quote)+'</div><textarea aria-label="已保存批注" data-note-text="'+esc(n.id)+'">'+esc(n.text)+'</textarea><button data-jump="'+esc(n.id)+'">定位原文</button> <button data-remove="'+esc(n.id)+'">移除</button></div>').join('');paint();}
document.getElementById('save-note').addEventListener('click',()=>{const text=document.getElementById('note-text').value.trim();if(!pending||!text){status('请填写批注意见。');return;}state.notes.push({...pending,text,id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),created_at:new Date().toISOString()});pending=null;document.getElementById('editor').hidden=true;window.getSelection()?.removeAllRanges();renderNotes();save();});
document.getElementById('notes').addEventListener('input',e=>{const id=e.target.dataset.noteText;if(!id)return;state.notes.find(n=>n.id===id).text=e.target.value;save();});
document.getElementById('notes').addEventListener('click',e=>{if(e.target.dataset.remove){state.notes=state.notes.filter(n=>n.id!==e.target.dataset.remove);renderNotes();save();}if(e.target.dataset.jump){const n=state.notes.find(n=>n.id===e.target.dataset.jump);article.querySelector('[data-anchor="'+CSS.escape(n.anchors[0].block)+'"]')?.scrollIntoView({block:'center',behavior:'smooth'});}});
article.addEventListener('click',e=>{
 const button=e.target.closest('[data-choice]');if(button){state.choices[button.closest('[data-group]').dataset.group]=button.dataset.choice;showChoices();save();}
 if(e.target.matches('.data-image')){document.getElementById('zoom-image').src=e.target.src;document.getElementById('zoom-image').alt=e.target.alt;document.getElementById('zoom').hidden=false;}
 const note=e.target.closest('[data-figure-note]');if(note){const group=note.dataset.figureNote,letter=state.choices[group]||'A';const el=article.querySelector('[data-anchor="fig-'+group+'-'+letter+'"]');openEditor({quote:'图表方案'+letter+'：'+el.textContent,anchors:[{block:el.dataset.anchor,start:0,end:el.textContent.length,quote:el.textContent}]});}
 if(e.target.matches('.annotation-mark'))document.getElementById('note-'+e.target.dataset.noteId)?.scrollIntoView({block:'nearest'});
});
document.getElementById('overall').value=state.overall;document.getElementById('overall').addEventListener('input',e=>{state.overall=e.target.value;save();});
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function markdown(){const out=[];for(const b of MODEL.blocks){if(b.kind==='heading')out.push('#'.repeat(b.level)+' '+b.text);else if(['paragraph','quote'].includes(b.kind))out.push((b.kind==='quote'?'> ':'')+b.text);else if(b.kind==='table'){out.push('| '+b.rows[0].join(' | ')+' |','| '+b.rows[0].map(()=>'---').join(' | ')+' |',...b.rows.slice(1).map(r=>'| '+r.join(' | ')+' |'));}else{const v=MODEL.figures[b.key][(state.choices[b.key]||'A').charCodeAt(0)-65];out.push('!['+v.label+']('+v.absolute_path+')','',v.caption);}for(const n of state.notes){const last=n.anchors.at(-1).block;if(last.startsWith(b.id)||(b.kind==='figure'&&last.startsWith('fig-'+b.key+'-')))out.push('','> 批注对象：'+n.quote,'',n.text);}out.push('');}if(state.overall)out.push('## 全文意见','',state.overall,'');return out.join('\n').trim()+'\n';}
document.getElementById('export').addEventListener('click',()=>{save();download(JSON.stringify(state,null,2),'Study04-方法对比-v0.4-反馈表单.json','application/json;charset=utf-8');status('反馈表单已导出，包含方案选择与定位批注。把JSON交回即可继续改文。');});
document.getElementById('export-md').addEventListener('click',()=>{save();download(markdown(),'Study04-方法对比-v0.4-含批注.md','text/markdown;charset=utf-8');status('已导出当前图表选择、正文和定位批注。');});
document.getElementById('import').addEventListener('click',()=>document.getElementById('feedback-file').click());
document.getElementById('feedback-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{for(const mark of article.querySelectorAll('mark.annotation-mark'))mark.replaceWith(...mark.childNodes);article.normalize();const incoming=validate(JSON.parse(await file.text()));state=incoming;document.getElementById('overall').value=state.overall;showChoices();renderNotes();save();status('反馈表单已载入。');}catch(error){paint();status('载入失败：'+error.message);}e.target.value='';});
function closeZoom(){document.getElementById('zoom').hidden=true;}document.getElementById('close-zoom').addEventListener('click',closeZoom);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();});document.getElementById('zoom').addEventListener('click',e=>{if(e.target.id==='zoom')closeZoom();});
showChoices();renderNotes();
</script></body></html>
