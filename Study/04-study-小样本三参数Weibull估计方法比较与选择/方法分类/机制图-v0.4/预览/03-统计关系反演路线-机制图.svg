<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="03-统计关系反演路线-机制图"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker><marker id="arrow-block" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="context-stroke" stroke="context-stroke"/></marker></defs><line x1="220.0" y1="255.0" x2="655.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="655.0" y1="255.0" x2="1090.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="1090.0" y1="255.0" x2="1525.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="1090.0" y1="255.0" x2="320.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="865.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="1410.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="320.0" y2="591.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="865.0" y2="591.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="252.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="657.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="1062.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="1467.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="252.5" y2="861.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="657.5" y2="861.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><rect x="40.0" y="385.0" width="1665.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#63758A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="419.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#263238" text-anchor="start">主要构造与方法分支</text><rect x="40.0" y="725.0" width="1665.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#7F6B93" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="758.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#57436B" text-anchor="start">实现与改进标签（横向，不另立一级类别）</text><rect x="40.0" y="945.0" width="1665.0" height="90.0" rx="10" fill="#FFFBEA" stroke="#B18B2C" stroke-width="1.6"/><text x="50.0" y="985.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">解释边界</text><text x="50.0" y="1007.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">统计量相近不等于估计准则相同；已知参数条件、迭代代入和整体三参数性质需要逐篇区分。</text><rect x="40.0" y="24.0" width="1720.0" height="48.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="59.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32.0" fill="#263238" text-anchor="start" font-weight="700">机制图 03｜统计关系反演路线</text><rect x="40.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="50.0" y="236.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">① 样本 D</text><text x="50.0" y="262.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">排序寿命样本</text><text x="50.0" y="288.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">完整样本或指定观测条件</text><rect x="475.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="485.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">② 信息利用</text><text x="485.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">样本矩、PWM／L矩、分位数、次序统</text><text x="485.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">计量、枢轴量、位置—尺度不变统计量及</text><text x="485.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">其期望／协方差。</text><rect x="910.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="920.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">③ 参数确定原则</text><text x="920.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">建立理论等式、匹配关系或枢轴反演关系</text><text x="920.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">，再求解三个参数；条件线性估计通过协</text><text x="920.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">方差选择权重。</text><rect x="1345.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#EEF8F2" stroke="#548A74" stroke-width="1.6"/><text x="1355.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">④ 三参数估计</text><text x="1355.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">β̂、η̂、γ̂</text><text x="1355.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">以及方程残差、矩差、枢轴区间或条件方</text><text x="1355.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">差</text><rect x="40.0" y="78.0" width="1720.0" height="32.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="100.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19.0" fill="#63758A" text-anchor="start">核心问题：样本统计特征与总体参数之间有什么理论关系？</text><rect x="40.0" y="112.0" width="1720.0" height="28.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="132.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#63758A" text-anchor="start">蓝灰：共同信息与主流程　珊瑚：本路线的决定性原则　绿色：参数输出　紫灰：实现、改进与边界</text><rect x="70.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">MM／Weibull moments</text><text x="80.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">用样本矩或Weibull矩显式恢复参数；近奇异的矩差会放</text><text x="80.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">大波动。</text><rect x="615.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="481.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">PWM／L矩／TL矩</text><text x="625.0" y="503.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">改变统计量权重或端部使用方式，保留矩关系反演的主线。</text><rect x="1160.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="1170.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">分位数／次序统计量</text><text x="1170.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">用理论分位数、次序统计量分布或枢轴关系确定位置和其他参数</text><text x="1170.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">。</text><rect x="70.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">不变统计量 LSPF／LPF</text><text x="80.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">先消除位置或尺度的一部分影响，再用统计量似然或恢复方程估</text><text x="80.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">计。</text><rect x="615.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">条件线性最小方差</text><text x="625.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">在给定参数或估计条件下，用期望与协方差选线性组合权重；性</text><text x="625.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">质不能无条件外推。</text><rect x="70.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">矩／权重</text><rect x="475.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">消元</text><rect x="880.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="890.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">枢轴反演</text><rect x="1285.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="1295.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">次序统计量</text><rect x="70.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">协方差权重</text><rect x="475.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">参数恢复</text></svg>