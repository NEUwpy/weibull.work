<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="05-学习映射路线-机制图"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker><marker id="arrow-block" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="context-stroke" stroke="context-stroke"/></marker></defs><line x1="220.0" y1="255.0" x2="655.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="655.0" y1="255.0" x2="1090.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="1090.0" y1="255.0" x2="1525.0" y2="255.0" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-block)"/><line x1="1090.0" y1="255.0" x2="320.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="865.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="1410.0" y2="486.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="320.0" y2="591.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="865.0" y2="591.0" stroke="#B44948" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="252.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="657.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="1062.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="1467.5" y2="806.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="655.0" y1="255.0" x2="252.5" y2="861.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><line x1="1090.0" y1="255.0" x2="657.5" y2="861.0" stroke="#7F6B93" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrow-open)"/><rect x="40.0" y="385.0" width="1665.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#63758A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="419.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#263238" text-anchor="start">主要构造与方法分支</text><rect x="40.0" y="725.0" width="1665.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#7F6B93" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="758.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#57436B" text-anchor="start">实现与改进标签（横向，不另立一级类别）</text><rect x="40.0" y="945.0" width="1665.0" height="90.0" rx="10" fill="#FFFBEA" stroke="#B18B2C" stroke-width="1.6"/><text x="50.0" y="985.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">解释边界</text><text x="50.0" y="1007.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">训练集上的误差不能替代新样本泛化证据；学习路线的先验范围、输入表示和损失共同定义方法边界。</text><rect x="40.0" y="24.0" width="1720.0" height="48.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="59.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32.0" fill="#263238" text-anchor="start" font-weight="700">机制图 05｜学习映射路线</text><rect x="40.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="50.0" y="236.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">① 样本 D</text><text x="50.0" y="262.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">排序寿命样本</text><text x="50.0" y="288.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">完整样本或指定观测条件</text><rect x="475.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="485.0" y="237.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">② 信息利用</text><text x="485.0" y="262.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">模拟样本或历史样本、可观测特征、真参</text><text x="485.0" y="287.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">数标签、训练域和损失函数。</text><rect x="910.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="920.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">③ 参数确定原则</text><text x="920.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">训练 hφ(D) 或 hφ(feat</text><text x="920.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">ures) 使预测参数在预设损失下表</text><text x="920.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">现良好，使用时直接输出参数估计。</text><rect x="1345.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#EEF8F2" stroke="#548A74" stroke-width="1.6"/><text x="1355.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">④ 三参数估计</text><text x="1355.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">β̂、η̂、γ̂</text><text x="1355.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">并伴随训练域、外推、校准、回退与不确</text><text x="1355.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">定性边界</text><rect x="40.0" y="78.0" width="1720.0" height="32.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="100.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19.0" fill="#63758A" text-anchor="start">核心问题：能否从训练样本中学习样本到参数的估计函数？</text><rect x="40.0" y="112.0" width="1720.0" height="28.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="132.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#63758A" text-anchor="start">蓝灰：共同信息与主流程　珊瑚：本路线的决定性原则　绿色：参数输出　紫灰：实现、改进与边界</text><rect x="70.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">直接参数映射</text><text x="80.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">ANN／BPNN等从样本特征直接预测三个参数；训练数据和</text><text x="80.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">特征属于方法本身。</text><rect x="615.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="481.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">目标与损失</text><text x="625.0" y="503.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">参数损失、寿命点损失或联合约束会改变估计函数的取向。</text><rect x="1160.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="1170.0" y="481.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">训练域与泛化</text><text x="1170.0" y="503.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">参数范围、样本量、尺度处理和外推位置决定可声明边界。</text><rect x="70.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">混合学习</text><text x="80.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">网络可学习似然过程量、权重或修正量；主归属按它最终改变的</text><text x="80.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">环节判断。</text><rect x="615.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">工具区分</text><text x="625.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">PSO、SA等搜索既定目标不等于学习映射；直接学习才形成</text><text x="625.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">独立估计范式。</text><rect x="70.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">训练数据</text><rect x="475.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">特征表示</text><rect x="880.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="890.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">损失／约束</text><rect x="1285.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="1295.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">训练域</text><rect x="70.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">外推与校准</text><rect x="475.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">回退／拒绝</text></svg>