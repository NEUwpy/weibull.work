<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="先分类总览，再放大局部关系"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#83968a" stroke-width="1.4"/></marker></defs><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#20342d"><text x="30" y="40" font-size="25" fill="#20342d" text-anchor="start" font-weight="600">总览只管归类，放大图再讲原理和沿袭</text><rect x="30" y="75" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="140.0" y="110.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">似然／修正方程</text><rect x="272" y="75" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="382.0" y="110.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">概率区间</text><rect x="514" y="75" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="624.0" y="110.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">分布关系拟合</text><rect x="756" y="75" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="866.0" y="110.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">矩／统计关系</text><rect x="30" y="155" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="140.0" y="190.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">线性最小方差</text><rect x="272" y="155" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="382.0" y="190.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">后验推断</text><rect x="514" y="155" width="220" height="57" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="624.0" y="190.5" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">直接学习</text><line x1="500" y1="235" x2="500" y2="295" stroke="#83968a" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="530" y="272" font-size="18" fill="#83968a" text-anchor="start" font-weight="400">选一条关系放大</text><rect x="30" y="310" width="940" height="290" rx="7" fill="#fafcfb" stroke="#d4e0d7"/><rect x="65" y="355" width="245" height="70" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="187.5" y="397.0" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">Jacquelin二参数推导</text><rect x="377" y="355" width="245" height="70" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="499.5" y="397.0" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">Cousineau三参数WMLE</text><rect x="690" y="355" width="245" height="70" rx="7" fill="#f0f6f2" stroke="#d4e0d7"/><text x="812.5" y="397.0" font-size="22" fill="#20342d" text-anchor="middle" font-weight="600">后续形状修正</text><line x1="310" y1="390" x2="377" y2="390" stroke="#83968a" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="622" y1="390" x2="690" y2="390" stroke="#83968a" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="185" y="485" font-size="20" fill="#0072b2" text-anchor="middle" font-weight="400">原有估计关系</text><text x="500" y="485" font-size="20" fill="#cc672c" text-anchor="middle" font-weight="400">三个权重进入方程</text><text x="805" y="485" font-size="20" fill="#cc672c" text-anchor="middle" font-weight="400">估计后再作偏差修正</text><text x="65" y="558" font-size="20" fill="#20342d" text-anchor="start" font-weight="400">原理的变化与历史关系，在同一局部图中对齐。</text></g></svg>