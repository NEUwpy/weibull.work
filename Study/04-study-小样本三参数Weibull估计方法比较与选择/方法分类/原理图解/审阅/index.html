font-size:13px}.history summary{width:max-content}.history-round{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.history-round p{margin:5px 0}.history-round ul{padding-left:20px;margin:5px 0}.history-round li{white-space:pre-wrap;overflow-wrap:anywhere}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}.footer-inner{max-width:1240px;margin:auto;padding:14px 32px;display:flex;align-items:center;justify-content:flex-end;gap:20px}#status{font-size:13px;color:var(--muted);margin-right:auto}#status.error{color:var(--warn)}#submit{background:var(--accent);color:#fff;border-radius:8px;min-width:106px;padding:10px 22px;font-weight:600}#submit:disabled{opacity:.55;cursor:default}::selection{background:#f5df9d}::highlight(review-notes){background:#f5e8bb;text-decoration:underline;text-decoration-color:#b69a45}

<script id="initial-board" type="application/json">{"id": "study04-upper-expression", "title": "Study04上半部分：内容与表达探索", "document": true, "revision": 7, "units": [{"id": "research-opening", "title": "研究问题与上半部分的任务", "mode": "content", "selected": null, "options": [{"id": "research-opening-current", "label": "当前内容", "blocks": [{"id": "central-question", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e小样本条件下，不同三参数Weibull估计方法表现出怎样的性能差异，这些差异如何受到样本量与参数条件的共同影响？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e上半部分先回答：目前有哪些方法，为什么形成这么多方法，怎样通过分类与沿袭等关系将它们归拢，再确定几种代表方法进入统一比较。\u003c/p\u003e", "hash": "43af04899c08154696a7a64464a4650e2c3cee5f5331c686bc99475888cb4b24"}, {"id": "scope", "kind": "text", "html": "\u003cp\u003e以下沿用“分类 → 沿袭与关联 → 共同困难 → 七种实现定位”的内容顺序。既有内容直接阅读和批注；图示形式仍未定的地方，放出不同表达供比较。\u003c/p\u003e", "hash": "74f870a661217cdef63257d13901bd998ea8956c695708e1a159c6089b47faf3"}]}], "content_hash": "dfc47a3163298297dd8d4568150ad5c814b6468a292091568d4c0670dbf247f8"}, {"id": "principle-classification", "title": "1　按估计依据归拢方法", "mode": "content", "selected": null, "options": [{"id": "principle-classification-current", "label": "当前内容", "blocks": [{"id": "classification-meaning", "kind": "text", "html": "\u003cp\u003e方法名称中混合着估计准则、修正步骤和计算工具。分类先看\u003cstrong\u003e依据什么确定参数\u003c/strong\u003e，方法关系再说明它改变或借用了哪个环节。\u003c/p\u003e", "hash": "b2c6d057eeb3f804f819f574911d02688cee9841e0cde568b892285ff8193b6a"}, {"id": "seven-principles", "kind": "visual", "html": "\u003ctable\u003e\u003ctr\u003e\u003cth\u003e估计依据\u003c/th\u003e\u003cth\u003e怎样确定参数\u003c/th\u003e\u003cth\u003e例子\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e似然与修正估计方程\u003c/td\u003e\u003ctd\u003e联合密度或修改后的得分关系\u003c/td\u003e\u003ctd\u003eMLE、CH-MMLE、WMLE、K–R、LSPF／LPF\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e概率区间\u003c/td\u003e\u003ctd\u003e相邻观测／分组边界的CDF增量\u003c/td\u003e\u003ctd\u003eMPS、QML／QMP\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e分布关系与拟合\u003c/td\u003e\u003ctd\u003e概率图、CDF、密度或伪尺度的偏离\u003c/td\u003e\u003ctd\u003eWhite／Soman、Park、MDM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e矩与统计关系\u003c/td\u003e\u003ctd\u003e匹配或反演理论统计关系\u003c/td\u003e\u003ctd\u003eCran、PWM、L／TL矩、W均值匹配\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e线性最小方差\u003c/td\u003e\u003ctd\u003e在给定条件与估计类中确定组合权重\u003c/td\u003e\u003ctd\u003e条件MVLUE及扩展\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e后验推断\u003c/td\u003e\u003ctd\u003e先验与似然合成后验，按指定规则估计\u003c/td\u003e\u003ctd\u003eBayes\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e直接学习\u003c/td\u003e\u003ctd\u003e训练样本／特征到参数的映射\u003c/td\u003e\u003ctd\u003eANN／BPNN\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e", "hash": "97a9c0fd763427eab0d85faff7139a6a4b042d5990c10073f1562dd4f629bd66"}]}], "content_hash": "796c9c36d7a6164a7f2c33b50d510f3fa647f34adf5d49b360b05a8948b33b9f"}, {"id": "overview-form", "title": "总览图怎样同时承载分类和关系？", "mode": "choices", "inline": true, "context": "两种组织都保留七条主干；区别在于沿袭关系是放进总图，还是在讲述时局部放大。", "selected": "overview-form-integrated", "options": [{"id": "overview-form-integrated", "label": "把关系放进一张综合图", "blocks": [{"id": "integrated-meaning", "kind": "text", "html": "\u003cp\u003e\u003cmark\u003e分类与承接放在同一视野\u003c/mark\u003e，直接看到每类中如何发展；信息密度较高，需要沿线讲述。\u003c/p\u003e", "hash": "349ca55db09a46ed040ecc0d12867153327a81637725cc7823d8c08a3e01a123"}, {"id": "integrated-figure", "kind": "image", "src": "assets/01-map-integrated.svg", "alt": "把关系放进一张综合图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}]}, {"id": "overview-form-layered", "label": "分类总览，再放大局部关系", "blocks": [{"id": "layered-meaning", "kind": "text", "html": "\u003cp\u003e总览先归拢名称；\u003cmark\u003e每讲一组改动，再展开原理和沿袭\u003c/mark\u003e。听众一次接收的关系较少，但需要在总览和局部之间切换。\u003c/p\u003e", "hash": "3f0f4b06dd28e06ea92b7df170cbee956d3fafffbead29af7555d2ca8e99e8f6"}, {"id": "layered-figure", "kind": "image", "src": "assets/02-map-layered.svg", "alt": "分类总览，再放大局部关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}]}], "content_hash": "5717d1abc74d06cc449a3595120a1f56b9634009468c1a087c13e38c076ab98d"}, {"id": "likelihood-content", "title": "2　先认识MLE的内核与原型流程", "mode": "content", "selected": null, "options": [{"id": "likelihood-content-current", "label": "当前内容", "blocks": [{"id": "likelihood-core", "kind": "text", "html": "\u003cp\u003e给定同一份样本，先尝试一组候选参数 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。这组参数规定了一条密度曲线，每个观测在曲线上对应一个密度值。MLE将这些值相乘得到似然，或取对数相加得到 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eℓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，据此比较候选参数。\u003c/p\u003e\u003cp\u003e为了求解，可以从似然导出得分关系，并结合参数域与边界条件寻找候选解。先讲清这一套\u003cstrong\u003e样本 → 密度 → 似然 → 求解关系 → 参数输出\u003c/strong\u003e，后续改动才有明确的参照物。\u003c/p\u003e", "hash": "e7f3a8ca0e74063ff38b74bfd106777dd8b230715d5ee8b29d21268f17b99958"}, {"id": "likelihood-prototype-image", "kind": "image", "src": "assets/09-mle-prototype.svg", "alt": "MLE内核与原型流程：在观测处计算密度，汇总对数似然，再形成求解关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "likelihood-evidence", "kind": "text", "html": "\u003cp\u003e图中的三个候选只用于解释似然怎样构成，不代表已经求得最优参数。原始三参数似然的无界路径、有限局部解与数值失败仍需区分；本轮先把统计内核讲清，求解器细节不展开。\u003c/p\u003e", "hash": "39ddb81b51930a568a8e9758682ed0c1e788958e93f13a96f1ba573ae93b0bce"}]}], "state": "modify", "content_hash": "1ae7ed26f8b7b1cde8d8ada69215ca79fc780518e4e84ca02b648384c9011095"}, {"id": "likelihood-form", "title": "回到同一个原型：后续方法究竟改动哪里？", "mode": "content", "selected": null, "options": [{"id": "likelihood-form-components", "label": "原型流程上的局部改动", "blocks": [{"id": "components-meaning", "kind": "text", "html": "\u003cp\u003e保留共同似然骨架，分别展示删最小值、替换位置关系、嵌入权重三种改动。有限似然峰和WMLE方程交点嵌入对应环节，DMMLE在下方接回两种来源。\u003c/p\u003e", "hash": "b1c5467942d34487cfac19279e4cc62da3b3206479e646dc41a642c7a9d7fa38"}, {"id": "components-figure", "kind": "image", "src": "assets/机制图/似然方法-原型与改动.svg", "alt": "同一似然骨架的三种构造改动：删点、替换位置关系、方程加权；关键节点内有有限似然峰和WMLE两条零值曲线的共同交点", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "likelihood-patch-provenance", "kind": "text", "html": "\u003cp\u003e历史来源单独接回这些改动：Jacquelin→Cousineau WMLE；Smith→Kundu–Raqab；K–R＋Firth→DMMLE。图中“插入哪里”说明构造，箭头是否表示沿袭仍由原文证据决定。\u003c/p\u003e", "hash": "f0f8a9f76887cc40caf5ed15f218af8cf1b37cd2dbe80549b47214dadbf38e4f"}, {"id": "components-editable-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/似然方法-原型与改动.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/似然方法-原型与改动.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "45675da4226293bb77bea1d3c108317c6a5295dd717941ff5639d5fcbe451932"}]}], "state": "modify", "content_hash": "88cdf52548a08d84eac3c39dad761682d1bbd3ddfb186b6e19287e367095114d"}, {"id": "interval-mechanism", "title": "概率区间：把密度项改成怎样的概率量？", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "interval-mechanism-current", "label": "当前机制表达", "blocks": [{"id": "interval-meaning", "kind": "text", "html": "\u003cp\u003e从观测处的密度转向区间概率。MPS用两组候选参数展示CDF间距和评分怎样改变；QMP保留组内计数，CMLE只改最小观测项。\u003c/p\u003e", "hash": "2b477ad7e7fbc6db3a88ac42cdc7999ed7062d22cfa9dbce4a89fa4fdd8b4de0"}, {"id": "interval-figure", "kind": "image", "src": "assets/机制图/概率区间-MPS与分组.svg", "alt": "概率区间结构图：MPS候选参数改变间距与评分，QMP保留组计数，CMLE替换最小观测项", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "interval-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/概率区间-MPS与分组.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/概率区间-MPS与分组.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "d0ca7292df3d4a2414f7020f8133b6c14a6f279883d534c948fc2967a206cb52"}]}], "content_hash": "8314c8b33799085b7ca4566c4e962356f2c39bc4f7829f61363e83efaf4b11f2"}, {"id": "regression-content", "title": "3　概率图方法：相同分布关系中的不同选择", "mode": "content", "selected": null, "options": [{"id": "regression-content-current", "label": "当前内容", "blocks": [{"id": "regression-shared", "kind": "text", "html": "\u003cp\u003e给定候选位置后，令 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，概率图关系是 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。具体方法还取决于\u003cstrong\u003e分数怎样取、位置怎样定、沿哪个方向回归、参数怎样恢复\u003c/strong\u003e。\u003c/p\u003e", "hash": "d2072c1c70097a52a0cb3084630a1b9fff3668dc2883dd68f3487cc463d27865"}, {"id": "regression-relations", "kind": "text", "html": "\u003cp\u003eWhite→Soman是二参数回归向未知位置的扩展；Park沿相关性定位思路构造方法，2018年补充条件下的存在性论证。Yang迭代法借用LSPF的位置修正，再接回概率图回归。Soman与Park之间暂不画历史继承箭头。\u003c/p\u003e", "hash": "ed7c83a514e3a38129794d90f851015bc2a09a3a484f0b204773f9f53f779359"}]}], "content_hash": "42b6f9a3e57b592030ef8fcdf659419c4b3cb01a1f400eb6534654b25592db27"}, {"id": "regression-form", "title": "沿同一骨架，对照概率图方法的不同构造", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "regression-form-sequence", "label": "当前机制表达", "blocks": [{"id": "sequence-meaning", "kind": "text", "html": "\u003cp\u003e把分数、回归、位置判据和参数恢复放在相同位置，直接对照Soman与Park的不同选择；曲线只解释关键判据。\u003c/p\u003e", "hash": "d5833ef270b158a2d73ec030fee020a9973c6496e14766b0d7364e171094eef5"}, {"id": "sequence-figure", "kind": "image", "src": "assets/机制图/概率图-原型与改动.svg", "alt": "Soman与Park并列结构图：参考分数、回归关系、定位判据、参数恢复；曲线嵌入关键节点", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "sequence-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/概率图-原型与改动.drawio\"\u003edraw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/概率图-原型与改动.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "849b06388d4f8af0a91df9e21d6eb7f4cab235d0cbf55e4b59dc636423579807"}]}], "content_hash": "b73e0402fe70906e59db41fcaaf22491f67d58ecb0259afe2da7ab29c88f13a9"}, {"id": "mdm-content", "title": "MDM：先按差异定形状，再按梯度定位置", "mode": "content", "selected": null, "options": [{"id": "mdm-content-current", "label": "当前内容", "blocks": [{"id": "mdm-meaning", "kind": "text", "html": "\u003cp\u003e结构图保留三个关键节点：固定γ求条件最低点，改变γ形成差异曲线，再按梯度阈值定位。参数恢复用一条关系收束。\u003c/p\u003e", "hash": "6c78c281cc502e60723e07c4da8b4c1e153d7646cd8ff96d0ea9e89db57ad2f6"}, {"id": "mdm-mechanism", "kind": "image", "src": "assets/机制图/MDM-伪尺度与条件定位.svg", "alt": "MDM结构图：三个相连的判据节点嵌入标准差曲线、条件差异曲线和梯度阈值曲线；小框恢复参数", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "mdm-mechanism-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/MDM-伪尺度与条件定位.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/MDM-伪尺度与条件定位.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "41951f0fefe775fe13983c5e2793fc09558ccace846f50c9d52391c93d9e3dc0"}]}], "content_hash": "fd9d74049f24f4a3a27246da26c461fc083a4f4cbe4d1a1383abefd3ad403f71"}, {"id": "statistics-content", "title": "4　矩与统计量：共享材料，可以采用不同准则", "mode": "content", "selected": null, "options": [{"id": "statistics-content-current", "label": "当前内容", "blocks": [{"id": "moment-shared", "kind": "text", "html": "\u003cp\u003eCran式MM把寿命间隔按不同权重加总，得到1、2、4阶Weibull矩，再显式恢复参数。形状关系为 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmn\u003e4\u003c/mn\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。矩差之比接近1时，恢复分母会接近零。\u003c/p\u003e\u003cp\u003eCran的Weibull矩与PWM有总体泛函联系，PWM与L矩有条件下的线性转换，L矩到TL矩则是减少端部影响的推广。数学联系与历史承接分别表示。\u003c/p\u003e", "hash": "d9a04e4e07c107c9fefe64e701109ea2caea7dda6b02438ad909c16696e0339b"}, {"id": "invariance-shared", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eW\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e消去位置和尺度；2003年的方法匹配W均值，2013 LSPF则利用W的联合密度。2015 LPF改用 \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，只消去位置、保留尺度。2003与2013共享构造，直接历史承接未确认；LSPF→LPF有作者明示改进证据。\u003c/p\u003e", "hash": "5242dd6f541940a874f66626746b9fb0a018dcb6177d606bacbaac838bd3400f"}]}], "content_hash": "26f98cd65ff07857301993019072d55f00eb4b69f8da26e6116beadf8e4610d6"}, {"id": "statistics-form", "title": "同一矩匹配骨架：哪些是汇总，哪些改变统计关系？", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "statistics-form-operations", "label": "当前机制表达", "blocks": [{"id": "operations-meaning", "kind": "text", "html": "\u003cp\u003eCran从生存阶梯面积得到样本矩，借理论矩差之比消去位置和尺度，再恢复形状；旁边对照PWM到L矩的线性重组、L矩到TL矩的概念次序量改变。\u003c/p\u003e", "hash": "1151ed37be691dc2bcf1603575a95754f0b92f3067989004c70f433a22381c3c"}, {"id": "operations-figure", "kind": "image", "src": "assets/机制图/矩方法-加权汇总与变体.svg", "alt": "矩方法结构对照：Cran阶梯面积与矩差消元、PWM到L矩的重组、TL矩概念样本的扩展", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "operations-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/矩方法-加权汇总与变体.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/矩方法-加权汇总与变体.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "5d73aa10af830b74c7ac14588e6b7095fc286346775ab2fa0bf13b778fb6b94c"}]}], "content_hash": "3fe35c9b7d4d036b7b40cf0eccdcd5e688742b84b006726087cf3813a31eddff"}, {"id": "invariance-mechanism", "title": "W与V：先看消去什么，再看用什么准则估计", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "invariance-mechanism-current", "label": "当前机制表达", "blocks": [{"id": "invariance-meaning", "kind": "text", "html": "\u003cp\u003e在同一坐标下比较原样本、平移和缩放：W保持不变，V保留尺度变化。接到估计准则后，共同统计量还会形成不同方法。\u003c/p\u003e", "hash": "1caf50b02c18470c8cc73a61fc900a519aa0fee2472daf5c4d44a83e91a55db5"}, {"id": "invariance-figure", "kind": "image", "src": "assets/机制图/不变统计量-W与V.svg", "alt": "W与V结构图：三行共用坐标，W在平移缩放后不变，V平移不变而随尺度放大；分别连接均值匹配与联合密度准则", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "invariance-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/不变统计量-W与V.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/不变统计量-W与V.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "3396171a731d3b9f0dc1976a8835ba8bb113bce28d02e6fe549e67a21d19e4fb"}]}], "content_hash": "3ef3f9419f4d4276c20971555913d881e340eb6dd4928be05d35a5833422f7fd"}, {"id": "linear-mechanism", "title": "线性最小方差：已知条件与组合权重怎样起作用？", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "linear-mechanism-current", "label": "当前机制表达", "blocks": [{"id": "linear-meaning", "kind": "text", "html": "\u003cp\u003e条件位置估计先按理论期望校正次序统计量，再按协方差确定组合权重。原文权重算例嵌入该节点，旁边保留三参数迭代和倒数形状估计的分支。\u003c/p\u003e", "hash": "07e10902a4d508554b58467b2363ff98bd387dd5a6f4fd028bd0d8485cf8e198"}, {"id": "linear-figure", "kind": "image", "src": "assets/机制图/线性估计-条件权重与迭代.svg", "alt": "条件线性估计的共同骨架与分支；关键权重节点内嵌原文n等于5且形状尺度已知时的权重图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "linear-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/线性估计-条件权重与迭代.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/线性估计-条件权重与迭代.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "77308354340c882f46e486f99010476d38434dce1c0c7efbd6c8ea46ff435bc6"}]}], "content_hash": "414e8b7bea580751effd25cde651ebe594e1bbf83874161df9d4267e7a176335"}, {"id": "bayes-mechanism", "title": "后验推断：模型、估计规则与计算改动分开看", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "bayes-mechanism-current", "label": "当前机制表达", "blocks": [{"id": "bayes-meaning", "kind": "text", "html": "\u003cp\u003e先由先验与似然形成后验，再说明按什么规则给出点估计。Gibbs、MH、Laplace连接到后验计算环节；Hall–Wang的经验因子则进入修正目标并取最大值，另保留这一判据差别。\u003c/p\u003e", "hash": "16cac886e69392c5176b786c16f6427e21b65dc6e87a79ad3f9aaeed10ff327c"}, {"id": "bayes-figure", "kind": "image", "src": "assets/机制图/后验方法-统计模型与计算改动.svg", "alt": "后验方法机制图：先验与似然合成后验，抽样更新和罚似然分别改变什么", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "bayes-figure-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/后验方法-统计模型与计算改动.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/后验方法-统计模型与计算改动.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "8d06cd2d8f8f7b45deff07642df5b867203e24ac5ec6abd9eb5b76bf2e245fcc"}]}], "content_hash": "f36b6c00e15b8876bfac6aa0ecb07e61cbfd2b9f23d137dcf434a1c2275796f6"}, {"id": "tools-content", "title": "5　组合与计算工具放回实际参与的环节", "mode": "content", "selected": null, "options": [{"id": "tools-content-current", "label": "当前内容", "blocks": [{"id": "tool-role", "kind": "text", "html": "\u003cp\u003ePSO、模拟退火可以用于搜索似然；SVR可以拟合当前样本的变换关系；网络还可以调节中间量，或直接学习从样本到参数的映射。先说明\u003cstrong\u003e优化或拟合的对象\u003c/strong\u003e，再说明采用什么工具。\u003c/p\u003e\u003cp\u003e组合方法也按部件理解：如先估形状，再用矩恢复位置和尺度；Yang概率图迭代借用LSPF位置修正。局部借用、跨路线组合与共享数学构造，用不同关系表示。\u003c/p\u003e", "hash": "82fb896442ab74e5a2453e964efaebc1edbd4314abfc69b6186c45cfe44cae4d"}, {"id": "tools-mechanism", "kind": "image", "src": "assets/机制图/工具与组合-作用位置.svg", "alt": "工具与组合机制图：优化器、当前样本SVR、跨样本直接学习与Mixed参数恢复各作用于不同位置", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "tools-mechanism-source", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"assets/机制图/工具与组合-作用位置.drawio\"\u003e可编辑的draw.io源图\u003c/a\u003e · \u003ca href=\"assets/机制图/工具与组合-作用位置.pdf\"\u003ePDF图稿\u003c/a\u003e\u003c/p\u003e", "hash": "d05f074495ddc526881616b36a7a688a4347e6012a270e1021549bdb65d1140c"}]}], "content_hash": "2f6393db0f52005014287d01676cf1ee66e0afeff99b04ee2ac456dc8eae37cd"}, {"id": "synthesis-content", "title": "6　从关系中归纳共同困难与主要改进路线", "mode": "content", "selected": null, "options": [{"id": "synthesis-content-current", "label": "当前内容", "blocks": [{"id": "synthesis", "kind": "text", "html": "\u003cp\u003e前面的改动反复围绕几类困难展开：未知位置及支撑边界、小样本偏差、有限信息的利用，以及方程和目标的可靠求解。\u003c/p\u003e\u003cp\u003e希望听众带走三点认识：\u003cstrong\u003e名称虽多，可以按基本依据和改动环节归拢；同类方法可能在位置处理或恢复上分开，不同类又可以共享或借用步骤；这些构造差别需要放到统一条件下评价其性能。\u003c/strong\u003e\u003c/p\u003e", "hash": "971615609c1472b75fd060b4f61c3c91be5758eb5b9193216d2d542e631d4593"}]}], "content_hash": "0ef9e5a6413526361aa1b68c3d0990a824a21d65278a3ed10b2e04deb96b7a39"}, {"id": "representatives", "title": "7　七种实现的位置与比较作用", "mode": "content", "selected": null, "options": [{"id": "representatives-current", "label": "当前内容", "blocks": [{"id": "seven-methods", "kind": "visual", "html": "\u003ctable\u003e\u003ctr\u003e\u003cth\u003e当前实现\u003c/th\u003e\u003cth\u003e所属主干\u003c/th\u003e\u003cth\u003e比较作用／具体版本\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e似然\u003c/td\u003e\u003ctd\u003e原始密度准则的基线，有限局部候选与边界另列\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE（Cousineau）\u003c/td\u003e\u003ctd\u003e似然／修正方程\u003c/td\u003e\u003ctd\u003e考察方程加权后的表现\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE（K–R单样本形式）\u003c/td\u003e\u003ctd\u003e似然／修改数据\u003c/td\u003e\u003ctd\u003e考察最小值定位及其传递\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE（Soman主分支）\u003c/td\u003e\u003ctd\u003e概率图拟合\u003c/td\u003e\u003ctd\u003eWhite分数，u对z回归\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE（Park Proposed+Plot）\u003c/td\u003e\u003ctd\u003e概率图拟合\u003c/td\u003e\u003ctd\u003e相关性定位，z对u回归\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM-0.1\u003c/td\u003e\u003ctd\u003e尺度伪估计差异\u003c/td\u003e\u003ctd\u003e条件形状与固定偏移定位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMM（Cran式）\u003c/td\u003e\u003ctd\u003e矩／统计关系\u003c/td\u003e\u003ctd\u003e显式矩恢复及近奇异输出\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e", "hash": "1c37f72f2d527e64bcc4018ded89eb508b73749f818397738ad973810a2e055a"}, {"id": "bridge", "kind": "text", "html": "\u003cp\u003e本批七种实现覆盖三条主要路线，并非七条主干各选一种。先明确构造差别，再在共同样本上观察：这些差别怎样随n与β共同变化，表现为怎样的偏移、波动和异常风险。\u003c/p\u003e", "hash": "7d3ca7a3fe08dabe9e15ba1904e13c33a41583b3f696ebb942f0ae4884976ba4"}]}], "content_hash": "01f3f84fc929d9b31da13104349006ab46788db346f7d329b821e7256d2456d4"}], "last_applied_submission_id": "afc03551-cf39-4c28-92e5-059414b1369e", "review_complete": false}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'按反馈处理',defer:'待定',converge:'收敛',extend:'扩展',modify:'修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,finish_review:false}}
function fillDraft(){for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const next=el('details','handling');next.append(el('summary','','处理'));const select=el('select');select.setAttribute('aria-label',`${unit.title}下一步`);select.dataset.action='true';
 for(const [value,label] of Object.entries(actionLabels)){const option=el('option','',label);option.value=value;select.append(option)}next.append(select);head.append(next);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)
 }
 section.append(grid);return section
}
function syncControls(unit,node){const state=draft.units[unit.id];node.querySelector('select').value=state.action;for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||'';for(const option of unit.options)for(const block of option.blocks)if(block.kind==='gallery'){const gallery=blockNode(unit.id,option.id,block.id)?.querySelector('.gallery');if(gallery)syncGallery(gallery,unit,option,block)}}
function render(nextBoard){
 const newRound=nextBoard.id!==board.id||nextBoard.revision!==board.revision;board=nextBoard;
 if(!draft||newRound){closeEditor(false);loadDraft()}
 $('title').textContent=board.title;document.title=board.title;$('round').textContent=`第 ${board.revision} 轮`;document.body.classList.toggle('document-board',!!board.document||board.units.some(isContent));
 const keep=new Set();
 for(const [index,unit] of board.units.entries()){keep.add(unit.id);let node=unitNode(unit);const unitSignature=JSON.stringify({id:unit.id,title:unit.title,mode:unit.mode,inline:unit.inline,context:unit.context,options:unit.options});if(!node||node.dataset.signature!==unitSignature){const replacement=createUnit(unit);replacement.dataset.signature=unitSignature;if(node)node.replaceWith(replacement);node=replacement}if($('units').children[index]!==node)$('units').insertBefore(node,$('units').children[index]||null);syncControls(unit,node);node.inert=false;for(const control of node.querySelectorAll('input,select,textarea'))control.disabled=!!board.processing||!!board.submitted||!!board.review_complete}
 for(const node of [...$('units').children])if(!keep.has(node.dataset.unit))node.remove();
 $('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete||busy;$('submit').textContent=board.review_complete?'已完成':board.submitted?'已提交':'提交';$('finish-control').hidden=!!board.review_complete||board.allow_finish===false;$('finish-review').checked=!!draft.finish_review;$('finish-review').disabled=!!board.submitted||!!board.processing;
 if(board.processing)status('正在更新');else if(board.review_complete)status('本轮已完成');else if(board.submitted)status('已提交，正在等待 Agent 处理');else status('');renderComments();
 const stable={...board};delete stable.submitted;signature=JSON.stringify(stable)
 if(newRound){hydrateDraft().then(restoreEditor)}
}
$('units').addEventListener('change',event=>{const unit=event.target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(event.target.type==='radio'){state.selected=event.target.value;for(const card of unit.querySelectorAll('.option'))card.classList.toggle('chosen',card.dataset.option===state.selected)}if(event.target.dataset.action)state.action=event.target.value;draft.submission_id=null;persist()});
$('units').addEventListener('input',event=>{const target=event.target,unit=target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(target.dataset.note)state.notes[target.dataset.note]=target.value;else if(target.dataset.galleryNote){state.image_notes=state.image_notes.filter(n=>!(n.option_id===target.dataset.optionId&&n.block_id===target.dataset.galleryNote&&n.image_id===target.dataset.imageId));if(target.value.trim())state.image_notes.push({option_id:target.dataset.optionId,block_id:target.dataset.galleryNote,image_id:target.dataset.imageId,comment:target.value});target.closest('details').querySelector('summary').textContent=target.value?'本图备注（已填写）':'本图备注'}else return;draft.submission_id=null;persist()});
let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}
function fitImage(){const img=$('image-large'),stage=$('image-stage'),style=getComputedStyle(stage),width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);if(img.naturalWidth&&img.naturalHeight)sizeImage(Math.min(img.naturalWidth,width,height*img.naturalWidth/img.naturalHeight))}
function openImage(img){imageBlankPressed=false;imageSource=img;$('image-large').alt=img.alt||'放大的图像';$('image-large').onload=fitImage;$('image-large').src=img.currentSrc||img.src;$('image-viewer').showModal();document.body.classList.add('image-open');$('image-stage').scrollTo(0,0);if($('image-large').complete)fitImage();$('image-plus').focus({preventScroll:true})}
function closeImage(){$('image-viewer').close()}
$('image-viewer').addEventListener('close',()=>{document.body.classList.remove('image-open');if(imageSource?.isConnected)imageSource.focus({preventScroll:true})});
$('image-minus').onclick=()=>sizeImage(imageWidth/1.3);$('image-plus').onclick=()=>sizeImage(imageWidth*1.3);
let imageBlankPressed=false;
$('image-viewer').addEventListener('pointerdown',event=>{imageBlankPressed=event.target===$('image-viewer')||event.target===$('image-stage')});
$('image-viewer').addEventListener('click',event=>{if(imageBlankPressed&&(event.target===$('image-viewer')||event.target===$('image-stage')))closeImage();imageBlankPressed=false});
$('units').addEventListener('click',event=>{if(event.target.matches('.block img'))openImage(event.target)});
$('units').addEventListener('keydown',event=>{if(event.target.matches('.block img')&&['Enter',' '].includes(event.key)){event.preventDefault();openImage(event.target)}});
function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;$('editor-quote').textContent=anchor.quote;$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),first=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,last=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement,block=first.closest('[data-kind=text]');
 if(!block||last.closest('[data-kind=text]')!==block||!selection.toString().trim())return;
 const unit=block.closest('[data-unit]'),before=range.cloneRange();before.selectNodeContents(block);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length,end=start+range.toString().length,source=block.textContent;
 openEditor({id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())
}
document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});
$('editor-input').addEventListener('input',persist);
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function payload(){return {submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,finish_review:!!draft.finish_review,units:board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action,notes:d.notes,annotations:d.annotations,image_notes:d.image_notes||[]}})}}
async function submit(){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if($('editor-input').value.trim())saveNote();else closeEditor()}
 for(const unit of board.units){const state=draft.units[unit.id],feedback=state.annotations.length||state.image_notes?.length||Object.values(state.notes).some(v=>v.trim());if(!isContent(unit)&&!['auto','defer'].includes(state.action)&&!state.selected&&!(state.action==='modify'&&feedback)){status(`${unit.title}：请先选择方案`,true);unitNode(unit).scrollIntoView({behavior:'smooth',block:'center'});return}}
 const body=payload();persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;status('正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');board.submitted=true;render(board);await loadHistory()}
 catch(error){status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete}
}
$('submit').onclick=submit;
$('finish-review').onchange=()=>{draft.finish_review=$('finish-review').checked;draft.submission_id=null;persist()};
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}`));for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
