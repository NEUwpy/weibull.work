ll="#57436B" text-anchor="start">实现与改进标签（横向，不另立一级类别）</text><polyline points="400.0,255.0 475.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="835.0,255.0 910.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="1270.0,255.0 1345.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="910.0,309.0 456.7,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1007.2,340.0 904.9,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1207.7,340.0 1353.2,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="910.0,333.5 414.0,550.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1033.1,340.0 892.5,550.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="592.9,340.0 267.8,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1023.3,340.0 674.0,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="717.9,340.0 1047.0,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1148.2,340.0 1453.1,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="598.5,340.0 266.4,840.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><rect x="40.0" y="24.0" width="1720.0" height="48.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="59.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32.0" fill="#263238" text-anchor="start" font-weight="700">机制图 01｜似然估计路线</text><rect x="40.0" y="78.0" width="1720.0" height="32.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="100.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19.0" fill="#63758A" text-anchor="start">核心问题：样本在候选参数下有多“可能”？</text><rect x="40.0" y="112.0" width="1720.0" height="28.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="132.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#63758A" text-anchor="start">蓝灰：共同信息与主流程　珊瑚：本路线的决定性原则　绿色：参数输出　紫灰：实现、改进与边界</text><rect x="40.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="50.0" y="236.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">① 样本 D</text><text x="50.0" y="262.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">排序寿命样本</text><text x="50.0" y="288.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">完整样本或指定观测条件</text><rect x="475.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="485.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">② 信息利用</text><text x="485.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">观测处密度 f(tᵢ;β,η,γ)；位置参数</text><text x="485.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">决定支持边界，联合密度同时携带三参</text><text x="485.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">数信息。</text><rect x="910.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="920.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">③ 参数确定原则</text><text x="920.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">构造 L(θ|D) 或得分方程，最大化联</text><text x="920.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">合似然，或对其位置方程、权重和偏差</text><text x="920.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">项作明确修正。</text><rect x="1345.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#EEF8F2" stroke="#548A74" stroke-width="1.6"/><text x="1355.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">④ 三参数估计</text><text x="1355.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">β̂、η̂、γ̂</text><text x="1355.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">并伴随边界、局部极大、失败与求解诊</text><text x="1355.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">断</text><rect x="70.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">原始 MLE</text><text x="80.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">保留原始密度准则；区分局部候选、边界响应与全局存在性</text><text x="80.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">。</text><rect x="615.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="481.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">WMLE</text><text x="625.0" y="503.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">在估计方程中加入样本量相关权重，仍以似然方程为骨架。</text><rect x="1160.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="1170.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">MMLE 分支</text><text x="1170.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">以最小值、均值、方差或中位数关系替换部分位置方程；同</text><text x="1170.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">名分支需分开。</text><rect x="70.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">K–R／DMMLE</text><text x="80.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">最小值定位、删点与偏差修正组合；来源和作用环节分别记</text><text x="80.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">录。</text><rect x="615.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">CMLE／罚似然</text><text x="625.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">替换边界处密度项或加入经验因子，改变边界处理而非简单</text><text x="625.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">换求解器。</text><rect x="70.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">方程加权</text><rect x="475.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">位置／支持边界</text><rect x="880.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="890.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">偏差修正</text><rect x="1285.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="1295.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">初值与搜索</text><rect x="70.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">PSO／SA／DE求解既定目标</text><rect x="40.0" y="945.0" width="1665.0" height="90.0" rx="10" fill="#FFFBEA" stroke="#B18B2C" stroke-width="1.6"/><text x="50.0" y="985.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">解释边界</text><text x="50.0" y="1007.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">采用智能优化器搜索同一似然目标时，仍属于似然路线；有限搜索不自动证明全局MLE存在。</text></svg>