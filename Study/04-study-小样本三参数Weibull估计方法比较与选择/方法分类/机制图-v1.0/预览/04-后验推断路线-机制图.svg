<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="04-后验推断路线-机制图"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-263238" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#263238" stroke="#263238" stroke-width="1.3"/></marker><marker id="arrow-open-263238" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#263238" stroke-width="1.3"/></marker><marker id="arrow-block-7F6B93" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#7F6B93" stroke="#7F6B93" stroke-width="1.3"/></marker><marker id="arrow-open-7F6B93" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#7F6B93" stroke-width="1.3"/></marker><marker id="arrow-block-B44948" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#B44948" stroke="#B44948" stroke-width="1.3"/></marker><marker id="arrow-open-B44948" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#B44948" stroke-width="1.3"/></marker></defs><rect x="40.0" y="385.0" width="1665.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#63758A" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="419.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#263238" text-anchor="start">主要构造与方法分支</text><rect x="40.0" y="725.0" width="1665.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#7F6B93" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="758.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#57436B" text-anchor="start">实现与改进标签（横向，不另立一级类别）</text><polyline points="400.0,255.0 475.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="835.0,255.0 910.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="1270.0,255.0 1345.0,255.0" fill="none" stroke="#263238" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-block-263238)"/><polyline points="910.0,309.0 456.7,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1007.2,340.0 904.9,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1207.7,340.0 1353.2,445.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="910.0,333.5 414.0,550.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="1033.1,340.0 892.5,550.0" fill="none" stroke="#B44948" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-B44948)"/><polyline points="592.9,340.0 267.8,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1023.3,340.0 674.0,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="717.9,340.0 1047.0,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1148.2,340.0 1453.1,785.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="598.5,340.0 266.4,840.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1029.3,340.0 672.5,840.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><rect x="40.0" y="24.0" width="1720.0" height="48.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="59.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32.0" fill="#263238" text-anchor="start" font-weight="700">机制图 04｜后验推断路线</text><rect x="40.0" y="78.0" width="1720.0" height="32.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="100.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19.0" fill="#63758A" text-anchor="start">核心问题：如何把样本证据与参数先验合成为估计？</text><rect x="40.0" y="112.0" width="1720.0" height="28.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="132.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#63758A" text-anchor="start">蓝灰：共同信息与主流程　珊瑚：本路线的决定性原则　绿色：参数输出　紫灰：实现、改进与边界</text><rect x="40.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="50.0" y="236.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">① 样本 D</text><text x="50.0" y="262.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">排序寿命样本</text><text x="50.0" y="288.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">完整样本或指定观测条件</text><rect x="475.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="485.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">② 信息利用</text><text x="485.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">样本似然 L(θ|D) 与先验 p(θ)，以</text><text x="485.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">及参数化、支持域和后验计算所需的条</text><text x="485.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">件分布。</text><rect x="910.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="920.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">③ 参数确定原则</text><text x="920.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">形成 p(θ|D) ∝ L(θ|D)p(θ)，再按</text><text x="920.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">平方损失、绝对损失或其他规则取后验</text><text x="920.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">均值、众数或中位数。</text><rect x="1345.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#EEF8F2" stroke="#548A74" stroke-width="1.6"/><text x="1355.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">④ 三参数估计</text><text x="1355.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">点估计或后验区间</text><text x="1355.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">并伴随先验敏感性、支持域与链混合诊</text><text x="1355.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">断</text><rect x="70.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">后验模型</text><text x="80.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">先验、似然和参数支持域共同决定推断对象；贝叶斯与MLE</text><text x="80.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">可共享似然。</text><rect x="615.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">点估计规则</text><text x="625.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">后验均值、后验中位数、MAP等是不同输出规则，不能只按</text><text x="625.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">计算算法分类。</text><rect x="1160.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="1170.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">后验计算</text><text x="1170.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">Gibbs、Laplace、MH、ARS等负责计算后验量，属于实现</text><text x="1170.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">标签。</text><rect x="70.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">经验先验组合</text><text x="80.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">灰色拟合、参数自助或外部知识可提供先验，但独立信息与</text><text x="80.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">同样本重抽样需区分。</text><rect x="615.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">关系线</text><text x="625.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">MAP与似然最大化存在数学联系；先验、损失和支持域仍改</text><text x="625.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">变完整推断机制。</text><rect x="70.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">先验支持域</text><rect x="475.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">参数化</text><rect x="880.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="890.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">后验规则</text><rect x="1285.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="1295.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">Gibbs／MH／Laplace</text><rect x="70.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">先验敏感性</text><rect x="475.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">链混合</text><rect x="40.0" y="945.0" width="1665.0" height="90.0" rx="10" fill="#FFFBEA" stroke="#B18B2C" stroke-width="1.6"/><text x="50.0" y="985.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">解释边界</text><text x="50.0" y="1007.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">共享似然不意味着后验推断等同于MLE；计算链运行成功也不自动证明先验和支持域设定合理。</text></svg>