<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2500" viewBox="0 0 2000 2500" role="img" aria-label="03-统计关系反演路线-机制图"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-26745A" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#26745A" stroke="#26745A" stroke-width="1.3"/></marker><marker id="arrow-open-26745A" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#26745A" stroke-width="1.3"/></marker><marker id="arrow-block-D5E4DB" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#D5E4DB" stroke="#D5E4DB" stroke-width="1.3"/></marker><marker id="arrow-open-D5E4DB" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#D5E4DB" stroke-width="1.3"/></marker></defs><rect x="45.0" y="1375.0" width="1910.0" height="680.0" rx="10" fill="#F2F8F4" stroke="#DFE6EB" stroke-width="1.8"/><rect x="45.0" y="175.0" width="1910.0" height="470.0" rx="10" fill="#F2F8F4" stroke="#DFE6EB" stroke-width="1.8"/><rect x="45.0" y="685.0" width="935.0" height="650.0" rx="10" fill="#F8FAFC" stroke="#DFE6EB" stroke-width="1.8"/><rect x="1020.0" y="685.0" width="935.0" height="650.0" rx="10" fill="#F8FAFC" stroke="#DFE6EB" stroke-width="1.8"/><rect x="45.0" y="2095.0" width="1910.0" height="310.0" rx="10" fill="#F8FAFC" stroke="#DFE6EB" stroke-width="1.8"/><polyline points="540.0,395.0 620.0,395.0" fill="none" stroke="#26745A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><polyline points="1260.0,395.0 1340.0,395.0" fill="none" stroke="#26745A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><polyline points="1000.0,1465.0 1000.0,2010.0" fill="none" stroke="#D5E4DB" stroke-width="2" stroke-linejoin="round"/><polyline points="520.0,1655.0 505.0,1678.0" fill="none" stroke="#26745A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><polyline points="505.0,1763.0 520.0,1800.0" fill="none" stroke="#26745A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><polyline points="1465.0,1655.0 1460.0,1678.0" fill="none" stroke="#26745A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><polyline points="1460.0,1763.0 1465.0,1795.0" fill="none" stroke="#26745A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-block-26745A)"/><rect x="45.0" y="25.0" width="1920.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">统计关系反演：先提取可计算的量，再由理论关系拆开三个参数</text><rect x="45.0" y="88.0" width="1910.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="125.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="start">模型依赖：X = γ + ηY，Y 的分布只由 β 决定。差值消去 γ，标准化比值进一步消去 η。</text><rect x="65.0" y="190.0" width="1870.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="227.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">A　常规矩法原型：偏度只留形状，再由方差、均值恢复尺度和位置</text><rect x="80.0" y="285.0" width="460.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#26745A" stroke-width="1.8"/><text x="310.0" y="339.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">从样本提取</text><text x="310.0" y="371.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">x̄ = mean(xᵢ)</text><text x="310.0" y="404.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">m₂ = mean[(xᵢ−x̄)²]</text><text x="310.0" y="436.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">m₃ = mean[(xᵢ−x̄)³]</text><text x="310.0" y="469.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">样本偏度 g₁=m₃/m₂^(3/2)</text><rect x="620.0" y="285.0" width="640.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#26745A" stroke-width="1.8"/><text x="940.0" y="339.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">总体关系消去 γ、η</text><text x="940.0" y="371.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">Gₖ(β)=Γ(1+k/β)</text><text x="940.0" y="404.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">A₂=G₂−G₁²</text><text x="940.0" y="436.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">A₃=G₃−3G₁G₂+2G₁³</text><text x="940.0" y="469.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">解 g₁=A₃/A₂^(3/2) 得 β̂</text><rect x="1340.0" y="285.0" width="540.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#26745A" stroke-width="1.8"/><text x="1610.0" y="336.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">参数恢复</text><text x="1610.0" y="370.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">η̂ = √[m₂/A₂(β̂)]</text><text x="1610.0" y="404.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">γ̂ = x̄−η̂G₁(β̂)</text><text x="1610.0" y="438.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle"></text><text x="1610.0" y="471.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">先 β，再 η，再 γ</text><rect x="75.0" y="552.0" width="1830.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="593.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">中心化去掉位置；三阶中心矩与方差的 3/2 次方相除，尺度 η³ 抵消；最后用未标准化的量恢复 η、γ。</text><rect x="65.0" y="700.0" width="895.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="737.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">B1　Cran：把幂矩改成生存曲线的积分</text><rect x="75.0" y="770.0" width="870.0" height="135.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="813.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="start">非负位置 γ≥0 时</text><text x="87.0" y="847.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="start">μ̄ₖ=∫₀∞[1−F(x)]ᵏdx</text><text x="87.0" y="880.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="start">　 = γ+ηΓ(1+1/β)k^(−1/β)</text><rect x="75.0" y="925.0" width="870.0" height="130.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="966.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">样本阶梯积分（x₍₀₎=0）</text><text x="87.0" y="999.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">m̄ₖ=Σᵣ₌₀ⁿ⁻¹(1−r/n)ᵏ[x₍ᵣ₊₁₎−x₍ᵣ₎]</text><text x="87.0" y="1031.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">提取 k=1、2、4；m̄₁=x̄</text><rect x="80.0" y="1080.0" width="835.0" height="112.0" rx="10" fill="#F2F8F4" stroke="#26745A" stroke-width="1.8"/><text x="497.5" y="1113.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">d₁₂=m̄₁−m̄₂，d₂₄=m̄₂−m̄₄</text><text x="497.5" y="1144.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">总体 d₁₂/d₂₄=2^(1/β)</text><text x="497.5" y="1176.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">差值消 γ，再作比值消 η</text><rect x="75.0" y="1210.0" width="875.0" height="105.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="1240.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">β̂ = ln2 / ln(d₁₂/d₂₄)</text><text x="87.0" y="1271.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">γ̂ = (m̄₁m̄₄−m̄₂²)/(m̄₁+m̄₄−2m̄₂)</text><text x="87.0" y="1302.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">η̂ = (m̄₁−γ̂)/Γ(1+1/β̂)</text><rect x="1040.0" y="700.0" width="895.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1052.0" y="737.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">B2　PWM → L矩 → TL矩：改造样本权重</text><rect x="1040.0" y="770.0" width="880.0" height="130.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1052.0" y="798.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">PWM：bᵣ=E[X F(X)ʳ]</text><text x="1052.0" y="828.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">b̂ᵣ=(1/n)Σᵢ[C(i−1,r)/C(n−1,r)]x₍ᵢ₎</text><text x="1052.0" y="858.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">秩权重将样本排序信息压缩成若干个量</text><text x="1052.0" y="888.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">μ̄ₖ=k E{X[1−F(X)]ᵏ⁻¹}：与 Cran 有泛函联系</text><rect x="1055.0" y="915.0" width="850.0" height="170.0" rx="10" fill="#F2F8F4" stroke="#26745A" stroke-width="1.8"/><text x="1480.0" y="960.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">L矩由同组 PWM 线性转换</text><text x="1480.0" y="992.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">λ₁=b₀</text><text x="1480.0" y="1025.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">λ₂=2b₁−b₀</text><text x="1480.0" y="1057.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">λ₃=6b₂−6b₁+b₀</text><rect x="1040.0" y="1100.0" width="880.0" height="85.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1052.0" y="1135.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">λ₁=γ+ηa₁(β)，λᵣ=ηaᵣ(β)（r≥2）</text><text x="1052.0" y="1166.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">λ₃/λ₂ 定 β → λ₂ 定 η → λ₁ 定 γ</text><rect x="1040.0" y="1190.0" width="880.0" height="130.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1052.0" y="1218.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">TL矩：改用概念样本内部次序量</text><text x="1052.0" y="1248.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">例如 λ₁⁽¹,¹⁾=E[X₍₂:₃₎]</text><text x="1052.0" y="1278.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">λ₂⁽¹,¹⁾=½E[X₍₃:₄₎−X₍₂:₄₎]</text><text x="1052.0" y="1308.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">端部处理改变权重与理论关系，再作样本—总体匹配。</text><rect x="65.0" y="1390.0" width="1870.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="1427.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">C　W 与 V：先消去哪些未知量，再对保留下来的信息建立联合密度</text><rect x="1000.0" y="1465.0" width="0.0" height="0.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><rect x="1000.0" y="2010.0" width="0.0" height="0.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><rect x="75.0" y="1465.0" width="885.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="1502.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">LSPF：W 同时消去位置与尺度</text><rect x="80.0" y="1530.0" width="880.0" height="125.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="92.0" y="1569.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">Wᵢ=(X₍ᵢ₎−X₍₁₎)/(X₍ₙ₎−X₍₁₎)</text><text x="92.0" y="1601.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">　 =(Y₍ᵢ₎−Y₍₁₎)/(Y₍ₙ₎−Y₍₁₎)</text><text x="92.0" y="1634.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">W₁=0、Wₙ=1；内部 n−2 个量只依赖 β</text><rect x="80.0" y="1678.0" width="850.0" height="85.0" rx="10" fill="#FFFFFF" stroke="#26745A" stroke-width="1.8"/><text x="505.0" y="1713.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">β̂W = arg maxβ fW(w₂,…,wₙ₋₁;β)</text><text x="505.0" y="1745.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">这里使用统计量联合密度</text><rect x="80.0" y="1800.0" width="880.0" height="160.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="92.0" y="1841.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">代入 β̂W，记 b=β̂W</text><text x="92.0" y="1873.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">ηinit={mean[(xᵢ−x₍₁₎)ᵇ]}^(1/b)</text><text x="92.0" y="1904.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">γ̂W=x₍₁₎−ηinitΓ(1+1/b)n^(−1/b)</text><text x="92.0" y="1935.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">η̂W={mean[(xᵢ−γ̂W)ᵇ]}^(1/b)</text><rect x="80.0" y="1975.0" width="880.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="92.0" y="2001.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#243449" text-anchor="start">同一 W 也可匹配 Eβ(W 的均值) 来估 β；</text><text x="92.0" y="2029.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#243449" text-anchor="start">换成联合密度，改变的是确定参数的原则。</text><rect x="1020.0" y="1465.0" width="895.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1032.0" y="1502.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">LPF：V 只消去位置，尺度仍在</text><rect x="1025.0" y="1530.0" width="880.0" height="125.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1037.0" y="1569.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">Vᵢ=X₍ᵢ₎−X₍₁₎=η(Y₍ᵢ₎−Y₍₁₎)</text><text x="1037.0" y="1601.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">V₁=0；其余 n−1 个量仍依赖 η、β</text><text x="1037.0" y="1634.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">少一个恒定分量，并保留绝对间距大小</text><rect x="1025.0" y="1678.0" width="870.0" height="85.0" rx="10" fill="#FFFFFF" stroke="#26745A" stroke-width="1.8"/><text x="1460.0" y="1713.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">(η̂V0,β̂V)=arg maxη,β fV(v₂,…,vₙ;η,β)</text><text x="1460.0" y="1745.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">下一阶段保留 β̂V，重新恢复 η、γ</text><rect x="1025.0" y="1795.0" width="880.0" height="145.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1037.0" y="1845.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">固定 b=β̂V，令 yᵢ=xᵢ−γ；解原文恢复方程</text><text x="1037.0" y="1876.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">Σyᵢᵇ ln yᵢ / Σyᵢᵇ − mean(ln yᵢ)=1/b</text><text x="1037.0" y="1907.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">得到 γ̂V 后：η̂V={mean[(xᵢ−γ̂V)ᵇ]}^(1/b)</text><rect x="1025.0" y="1965.0" width="880.0" height="75.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="1037.0" y="1996.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#243449" text-anchor="start">数据间距的联合密度保留相关结构；</text><text x="1037.0" y="2024.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#243449" text-anchor="start">图中的消元与恢复，是两次有不同对象的估计。</text><rect x="65.0" y="2110.0" width="1860.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="2147.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">D　条件位置 MVLUE：已知 β、η 时，把无偏位置估计按协方差组合</text><rect x="75.0" y="2180.0" width="1030.0" height="140.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="2226.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">Tᵢ=X₍ᵢ₎−ηEβ(Y₍ᵢ₎)，E(Tᵢ)=γ</text><text x="87.0" y="2259.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">尤其 T₁=X₍₁₎−ηΓ(1+1/β)n^(−1/β)</text><text x="87.0" y="2291.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="start">取 S=Cov(T)，在 1ᵀc=1 下最小化 cᵀSc</text><rect x="1200.0" y="2185.0" width="680.0" height="115.0" rx="10" fill="#F2F8F4" stroke="#26745A" stroke-width="1.8"/><text x="1540.0" y="2234.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="middle">c = S⁻¹1 / (1ᵀS⁻¹1)</text><text x="1540.0" y="2270.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="middle">γ̂ = ΣcᵢTᵢ</text><rect x="75.0" y="2330.0" width="1810.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="2366.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">与二参数估计组合时：临时 β̃、η̃ → 代入 Tᵢ 与 S 的理论系数 → 更新 γ → 平移样本并重估 β、η。</text><rect x="55.0" y="2425.0" width="1890.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="2460.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23.0" fill="#243449" text-anchor="start">公式依据：Newby 矩构造；Cran（1988）；Hosking（1990）、Elamir–Seheult（2003）；LPF 原文 §2.1–2.2；位置 MVLUE 原文式(7)–(18)。</text></svg>