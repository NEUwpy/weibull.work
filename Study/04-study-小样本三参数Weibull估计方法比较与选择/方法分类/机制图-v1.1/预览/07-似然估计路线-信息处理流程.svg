<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1060" viewBox="0 0 2000 1060" role="img" aria-label="07-似然估计路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-A94F40" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#A94F40" stroke="#A94F40" stroke-width="1.3"/></marker><marker id="arrow-open-A94F40" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#A94F40" stroke-width="1.3"/></marker></defs><polyline points="590.0,377.5 730.0,377.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1270.0,377.5 1410.0,377.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1680.0,495.0 1680.0,585.0 545.0,585.0 545.0,690.0" fill="none" stroke="#A94F40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1680.0,495.0 1680.0,625.0 1455.0,625.0 1455.0,690.0" fill="none" stroke="#A94F40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="545.0,860.0 545.0,940.0 30.0,940.0 30.0,377.5 50.0,377.5" fill="none" stroke="#A94F40" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-A94F40)"/><rect x="45.0" y="20.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="64.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">似然估计｜从观测处的密度构造联合似然，再以整体贡献定参数</text><rect x="45.0" y="100.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="141.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">固定已经观测到的寿命；不同候选参数改变各观测处的密度，所有观测的贡献共同进入准则。</text><rect x="50.0" y="190.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="224.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">怎样构造似然函数？</text><rect x="50.0" y="260.0" width="540.0" height="235.0" rx="10" fill="#F7F9FC" stroke="#A94F40" stroke-width="1.8"/><text x="320.0" y="323.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">① 将观测代入Weibull密度</text><text x="320.0" y="355.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">yᵢ=xᵢ−γ&gt;0</text><text x="320.0" y="386.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">fθ(xᵢ)=(β/η)(yᵢ/η)^(β−1)</text><text x="320.0" y="417.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">×exp[−(yᵢ/η)^β]</text><text x="320.0" y="448.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">每个观测对应一个密度贡献</text><rect x="730.0" y="260.0" width="540.0" height="235.0" rx="10" fill="#F7F9FC" stroke="#A94F40" stroke-width="1.8"/><text x="1000.0" y="323.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">② 利用独立性组合观测贡献</text><text x="1000.0" y="355.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">L(θ)=fθ(x₁)×…×fθ(xₙ)</text><text x="1000.0" y="386.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">=∏ᵢ fθ(xᵢ)</text><text x="1000.0" y="417.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">把整组样本在候选θ下的</text><text x="1000.0" y="448.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">联合密度作为参数函数</text><rect x="1410.0" y="260.0" width="540.0" height="235.0" rx="10" fill="#EDF5EF" stroke="#A94F40" stroke-width="1.8"/><text x="1680.0" y="323.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">③ 取对数，把乘积变成求和</text><text x="1680.0" y="355.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">ℓ(θ)=Σᵢ ln fθ(xᵢ)</text><text x="1680.0" y="386.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">=n lnβ−nβ lnη+(β−1)Σᵢ ln yᵢ</text><text x="1680.0" y="417.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">−Σᵢ(yᵢ/η)^β</text><text x="1680.0" y="448.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">取对数保持最大点不变</text><rect x="150.0" y="690.0" width="790.0" height="170.0" rx="10" fill="#FFF3ED" stroke="#A94F40" stroke-width="1.8"/><text x="545.0" y="749.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">④ 原始MLE：选择联合贡献最大的候选</text><text x="545.0" y="784.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">θ̂=argmaxθ ℓ(θ)</text><text x="545.0" y="819.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">哪组参数使整组已观测寿命的联合密度最大，就选哪组</text><rect x="1060.0" y="690.0" width="790.0" height="170.0" rx="10" fill="#FFF8F4" stroke="#A94F40" stroke-width="1.8"/><text x="1455.0" y="751.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">由同一ℓ导出方程式构造</text><text x="1455.0" y="784.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">内点候选满足 ∂ℓ/∂β=∂ℓ/∂η=∂ℓ/∂γ=0</text><text x="1455.0" y="816.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">方程修正方法在这些关系中加权或替换部分方程，再联立求解</text><rect x="50.0" y="980.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="1013.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">最大化或求解均在所选模型支持域内进行；具体的数据修改、方程替换与最小值项处理见下方机制细图。</text><text x="380.0" y="946.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#A94F40" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">数值搜索更新候选θ，重新计算密度贡献</text></svg>