<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650" role="img" aria-label="07-似然估计路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-A94F40" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#A94F40" stroke="#A94F40" stroke-width="1.3"/></marker><marker id="arrow-open-A94F40" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#A94F40" stroke-width="1.3"/></marker></defs><polyline points="325.0,302.5 395.0,302.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="695.0,302.5 765.0,302.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1065.0,302.5 1135.0,302.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1435.0,302.5 1505.0,302.5" fill="none" stroke="#A94F40" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-A94F40)"/><polyline points="1285.0,380.0 1285.0,490.0 545.0,490.0 545.0,380.0" fill="none" stroke="#A94F40" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-A94F40)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">似然估计｜固定样本，比较不同参数下的联合贡献</text><rect x="45.0" y="95.0" width="1710.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="131.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">观测先变为密度贡献，再组成似然；确定参数的依据是似然目标或由其导出的方程。</text><rect x="55.0" y="225.0" width="270.0" height="155.0" rx="10" fill="#FFF7F3" stroke="#A94F40" stroke-width="1.8"/><text x="190.0" y="295.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">输入寿命样本 D</text><text x="190.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">保留各观测 xᵢ</text><rect x="395.0" y="225.0" width="300.0" height="155.0" rx="10" fill="#FFF7F3" stroke="#A94F40" stroke-width="1.8"/><text x="545.0" y="280.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">给定候选 θ=(β,η,γ)</text><text x="545.0" y="311.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">计算观测处的 fθ(xᵢ)</text><text x="545.0" y="342.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">并落实模型支持域</text><rect x="765.0" y="225.0" width="300.0" height="155.0" rx="10" fill="#FFF7F3" stroke="#A94F40" stroke-width="1.8"/><text x="915.0" y="280.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">组合全部观测贡献</text><text x="915.0" y="311.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">L(θ)=∏ᵢ fθ(xᵢ)</text><text x="915.0" y="342.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">取对数得到 ℓ(θ)</text><rect x="1135.0" y="225.0" width="300.0" height="155.0" rx="10" fill="#FFF7F3" stroke="#A94F40" stroke-width="1.8"/><text x="1285.0" y="280.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">据似然确定参数</text><text x="1285.0" y="311.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">最大化 ℓ(θ)</text><text x="1285.0" y="342.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">或求解、修正得分方程</text><rect x="1505.0" y="225.0" width="240.0" height="155.0" rx="10" fill="#F4E8E2" stroke="#A94F40" stroke-width="1.8"/><text x="1625.0" y="295.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">输出估计</text><text x="1625.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">β̂、η̂、γ̂</text><rect x="60.0" y="560.0" width="1680.0" height="45.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="72.0" y="591.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">数据、密度项、目标或方程发生修改时，变化进入对应的计算环节。</text><text x="915.0" y="496.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#A94F40" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">需要数值求解时：更新候选参数，再计算相应贡献</text></svg>