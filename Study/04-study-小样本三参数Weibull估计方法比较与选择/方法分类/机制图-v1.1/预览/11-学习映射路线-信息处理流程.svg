<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="11-学习映射路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#AE6C25" stroke="#AE6C25" stroke-width="1.3"/></marker><marker id="arrow-open-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#AE6C25" stroke-width="1.3"/></marker></defs><polyline points="590.0,382.5 730.0,382.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1270.0,382.5 1410.0,382.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1680.0,505.0 1680.0,580.0 320.0,580.0 320.0,505.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1950.0,382.5 1970.0,382.5 1970.0,800.0 1610.0,800.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><rect x="45.0" y="20.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="64.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">学习映射｜把多组参数预测误差写成训练目标，再选择估计函数</text><rect x="45.0" y="100.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="141.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">参数标签提供训练判据；要确定的是共享映射的权重φ，训练结束后再用于当前新样本。</text><rect x="50.0" y="190.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="224.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">训练目标怎样由样本及其真值形成？</text><rect x="50.0" y="260.0" width="540.0" height="245.0" rx="10" fill="#F7F9FC" stroke="#AE6C25" stroke-width="1.8"/><text x="320.0" y="344.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">把每组样本变成统一特征</text><text x="320.0" y="375.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">tⱼ=T(Dⱼ)</text><text x="320.0" y="406.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">如排序值、分位数或统计量</text><text x="320.0" y="438.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">用当前映射预测θ̂ⱼ=hφ(tⱼ)</text><rect x="730.0" y="260.0" width="540.0" height="245.0" rx="10" fill="#F7F9FC" stroke="#AE6C25" stroke-width="1.8"/><text x="1000.0" y="328.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">逐组对照参数真值，形成损失</text><text x="1000.0" y="360.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">将θ̂ⱼ与对应标签θⱼ比较</text><text x="1000.0" y="391.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">ℒ(φ)=(1/m)Σⱼℓ(θ̂ⱼ,θⱼ)</text><text x="1000.0" y="422.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">例：ℓ=Σₖ(θ̂ⱼₖ−θⱼₖ)²</text><text x="1000.0" y="453.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">多组预测误差合成一个训练目标</text><rect x="1410.0" y="260.0" width="540.0" height="245.0" rx="10" fill="#EDF5EF" stroke="#AE6C25" stroke-width="1.8"/><text x="1680.0" y="344.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">按预测误差选择映射权重</text><text x="1680.0" y="375.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">φ*=argminφ ℒ(φ)</text><text x="1680.0" y="406.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">按梯度等方法更新φ并重新预测</text><text x="1680.0" y="438.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">使训练样本上的规定损失更小</text><rect x="390.0" y="715.0" width="1220.0" height="170.0" rx="10" fill="#F0F8F3" stroke="#347B68" stroke-width="1.8"/><text x="1000.0" y="774.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">训练完成后固定φ*</text><text x="1000.0" y="809.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">新样本仍按同一T提取特征，再计算hφ*(T(D))</text><text x="1000.0" y="844.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">参数估计来自已经确定的映射</text><text x="1000.0" y="586.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">更新φ→重算各组预测与损失→继续减小训练目标</text></svg>