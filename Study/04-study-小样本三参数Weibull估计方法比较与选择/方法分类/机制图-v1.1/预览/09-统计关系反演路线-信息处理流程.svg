<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 2000 1700" role="img" aria-label="09-统计关系反演路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#347B68" stroke="#347B68" stroke-width="1.3"/></marker><marker id="arrow-open-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#347B68" stroke-width="1.3"/></marker></defs><polyline points="590.0,365.0 730.0,365.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1270.0,365.0 1410.0,365.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="590.0,725.0 730.0,725.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1270.0,725.0 1410.0,725.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="590.0,1085.0 730.0,1085.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1270.0,1085.0 1410.0,1085.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="590.0,1445.0 730.0,1445.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1270.0,1445.0 1410.0,1445.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><rect x="45.0" y="20.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="64.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">统计关系反演｜写出统计量如何依赖参数，再用消元或条件关系定参数</text><rect x="45.0" y="100.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="141.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">各行给出具体的统计量、模型关系与确定原则，展示不同的反演路径。</text><rect x="50.0" y="190.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="224.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">常规矩：先用偏度消去位置与尺度</text><rect x="50.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="320.0" y="311.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">由观测计算样本矩</text><text x="320.0" y="342.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">x̄=mean(xᵢ)</text><text x="320.0" y="373.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">m₂=mean[(xᵢ−x̄)²]</text><text x="320.0" y="405.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">m₃=mean[(xᵢ−x̄)³]</text><text x="320.0" y="436.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">样本偏度ĝ=m₃/m₂^(3/2)</text><rect x="730.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="1000.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">用模型消去γ、η</text><text x="1000.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">理论偏度g(β)只依赖β</text><text x="1000.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">理论方差=η²A₂(β)</text><text x="1000.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">A₂(β)=Γ(1+2/β)−Γ²(1+1/β)</text><rect x="1410.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#347B68" stroke-width="1.8"/><text x="1680.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">令样本与理论关系相等</text><text x="1680.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">解g(β)=ĝ确定β</text><text x="1680.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">η̂=√[m₂/A₂(β̂)]</text><text x="1680.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">γ̂=x̄−η̂Γ(1+1/β̂)</text><rect x="50.0" y="550.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="584.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">Cran：改用生存曲线积分矩，以矩差比显式消元</text><rect x="50.0" y="620.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="320.0" y="686.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">对经验生存曲线求积分</text><text x="320.0" y="718.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">μ̂ₖ=∫₀∞[1−Fₙ(x)]ᵏdx</text><text x="320.0" y="749.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">取k=1、2、4</text><text x="320.0" y="780.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">形成三个样本积分矩</text><rect x="730.0" y="620.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="1000.0" y="686.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">理论矩差消去位置和尺度</text><text x="1000.0" y="718.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">γ≥0时：μₖ=γ+c·k^(−1/β)</text><text x="1000.0" y="749.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">c=ηΓ(1+1/β)</text><text x="1000.0" y="780.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">R=(μ₁−μ₂)/(μ₂−μ₄)=2^(1/β)</text><rect x="1410.0" y="620.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#347B68" stroke-width="1.8"/><text x="1680.0" y="686.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">以样本矩差比反解参数</text><text x="1680.0" y="718.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">R̂=(μ̂₁−μ̂₂)/(μ̂₂−μ̂₄)</text><text x="1680.0" y="749.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">β̂=ln2/ln R̂</text><text x="1680.0" y="780.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">再由任意两条μₖ关系解γ、η</text><rect x="50.0" y="910.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="944.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">W／V：先移除干扰参数，再评价剩余信息的联合密度</text><rect x="50.0" y="980.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="320.0" y="1046.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">由次序观测构造差与比</text><text x="320.0" y="1078.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Wᵢ=(X₍ᵢ₎−X₍₁₎)/(X₍ₙ₎−X₍₁₎)</text><text x="320.0" y="1109.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Vᵢ=X₍ᵢ₎−X₍₁₎</text><text x="320.0" y="1140.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">差消γ；标准化比值再消η</text><rect x="730.0" y="980.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="1000.0" y="1046.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">写出变换统计量的联合密度</text><text x="1000.0" y="1078.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">W内部非退化分量：fW(w;β)</text><text x="1000.0" y="1109.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">V非退化分量：fV(v;η,β)</text><text x="1000.0" y="1140.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">保留各分量之间的相关结构</text><rect x="1410.0" y="980.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#347B68" stroke-width="1.8"/><text x="1680.0" y="1046.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">以联合密度最大点确定</text><text x="1680.0" y="1078.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">W：最大化fW估β，再恢复η、γ</text><text x="1680.0" y="1109.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">V：先联合最大化fV估η、β</text><text x="1680.0" y="1140.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">下一阶段保留β，再恢复η、γ</text><rect x="50.0" y="1270.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="1304.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">条件位置估计：构造共同期望为γ的量，再以最小方差选权</text><rect x="50.0" y="1340.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="320.0" y="1406.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">给定真实β、η时消去理论偏移</text><text x="320.0" y="1438.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Tᵢ=X₍ᵢ₎−ηEβ[Y₍ᵢ₎]</text><text x="320.0" y="1469.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">E(Tᵢ)=γ，S=Cov(T)</text><text x="320.0" y="1500.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">形成一组无偏位置量</text><rect x="730.0" y="1340.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#347B68" stroke-width="1.8"/><text x="1000.0" y="1406.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">把线性组合的方差写成目标</text><text x="1000.0" y="1438.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">γ̂=cᵀT</text><text x="1000.0" y="1469.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">在1ᵀc=1下最小化cᵀSc</text><text x="1000.0" y="1500.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">约束保持无偏，目标压低方差</text><rect x="1410.0" y="1340.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#347B68" stroke-width="1.8"/><text x="1680.0" y="1391.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">由协方差决定组合系数</text><text x="1680.0" y="1422.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">c=S⁻¹1/(1ᵀS⁻¹1)</text><text x="1680.0" y="1453.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">再计算γ̂=cᵀT</text><text x="1680.0" y="1485.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">参数未知时另以临时估计代入</text><text x="1680.0" y="1516.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">并可接入参数恢复迭代</text></svg>