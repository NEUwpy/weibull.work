\n\u003cp\u003e前面介绍了方法的原理分类以及文献之间的联系。接下来把七种具体实现放到相同样本上：先看方法之间究竟有多大差距，再观察差距怎样随样本量和形状条件改变，最后讨论这些差异对实际使用意味着什么。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 前面介绍了方法的原理分类以及文献之间的联系。接下来把七种具体实现放到相同样本上：先看方法之间究竟有多大差距，再观察差距怎样随样本量和形状条件改变，最后讨论这些差异对实际使用意味着什么。", "hash": "77fa9195634d3dc043f3c94e7c01009e0eb8b4cc6adc35224197d67491b09f77"}, {"id": "report-b9b445a8b97b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e项目\u003c/th\u003e\u003cth\u003e本轮设置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e方法版本与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。精度主图使用每个条件内七法均有效的共同样本；分布图使用各方法自身有效结果。异常与失败另行统计，不把失败填成参数误差。形状RMSE除以真实β，尺度与位置RMSE均除以1000，以便在同图中观察三个参数。\u003c/p\u003e", "markdown": "方法版本与求解约定见[实验设置](实验设置.md)。精度主图使用每个条件内七法均有效的共同样本；分布图使用各方法自身有效结果。异常与失败另行统计，不把失败填成参数误差。形状RMSE除以真实β，尺度与位置RMSE均除以1000，以便在同图中观察三个参数。", "hash": "7ed5c5e225a564929d32953b880fc3e628aa99e1d4b1aa78e4322b2a1b3cebb2"}]}], "content_hash": "3e671540241300db9e46e5679a0b97e53f1541ec2ec6909381b12117d969db05"}, {"id": "figure-global", "title": "2　方法之间究竟相差多少", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-11717c912d99", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003e先从全体条件看差距在哪些地方明显。如果只看一个方法的极端值，其他方法可能被挤在一起；因此先看多数方法与当前最小RMSE之间的距离，具体是谁、差距怎样改变，再由下一组图展开。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 先从全体条件看差距在哪些地方明显。如果只看一个方法的极端值，其他方法可能被挤在一起；因此先看多数方法与当前最小RMSE之间的距离，具体是谁、差距怎样改变，再由下一组图展开。", "hash": "e6624e3e9a0eafb9b37c8e364203d817efd8531ce7dc602f9f8246544a00e438"}, {"id": "preview", "kind": "image", "src": "assets/修订_整体差距百分比.png", "alt": "主体差距：直接读多出百分之多少", "markdown": "![主体差距：直接读多出百分之多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_整体差距百分比.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-7dd6a876cc3f", "kind": "text", "html": "\u003cp\u003e每格为七法RMSE中位数相对该条件最小值多出的百分比。三列分别对应形状、尺度、位置参数，共用同一分档色标；数字直接给出差距幅度。中位数意味着七种方法中至少四种的RMSE达到该水平。\u003c/p\u003e", "markdown": "每格为七法RMSE中位数相对该条件最小值多出的百分比。三列分别对应形状、尺度、位置参数，共用同一分档色标；数字直接给出差距幅度。中位数意味着七种方法中至少四种的RMSE达到该水平。", "hash": "38458d7d8f74fdabf4d4aec470300bec9136f4bd37d5db147bb91d09916d43a3"}, {"id": "report-d2537b2040c8", "kind": "text", "html": "\u003cp\u003e这张图定位值得继续观察的条件区域，不单独承担方法推荐。中位数压缩了方法身份，具体方法的误差轮廓由下一组玫瑰图补充。\u003c/p\u003e", "markdown": "这张图定位值得继续观察的条件区域，不单独承担方法推荐。中位数压缩了方法身份，具体方法的误差轮廓由下一组玫瑰图补充。", "hash": "f2272540efe1600d4148bf9096515cb3339c6589b837ef64000c6fa4a4fb840c"}]}], "content_hash": "768c3176e3ebe65d8eb89696c8c806f8e0057b2bb0e086c07d7ce1d7ab763f56"}, {"id": "figure-change", "title": "3　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": " 0.792。差距并非按同一个倍数扩大，变化还依赖β。图中保留了全部中间样本量，可逐档检查具体变化。\u003c/p\u003e", "markdown": "例如，β=1.5时，六法形状标准化RMSE在n=50下为0.118～0.179，到n=7为0.500～1.293；β=5时，相应区间由0.266～0.457变为0.485～0.792。差距并非按同一个倍数扩大，变化还依赖β。图中保留了全部中间样本量，可逐档检查具体变化。", "hash": "d2b8c8ae5b8ccb889cee53f9c74a8416f0b958cdd25d3bffd1f58f3f181df371"}, {"id": "report-3ebc00fc3ddf", "kind": "text", "html": "\u003cp\u003e这些是各条件共同有效样本上的点估计。共同有效数随条件而变，为348～1199组；它用于对齐同一条件的方法比较，返回情况在第4节另看。\u003c/p\u003e", "markdown": "这些是各条件共同有效样本上的点估计。共同有效数随条件而变，为348～1199组；它用于对齐同一条件的方法比较，返回情况在第4节另看。", "hash": "6947c4372696c697de2667e2a454a1d4bd8219bb30cf529b81037ca88e100683"}]}], "content_hash": "7ff62b567868fcae3e79f5b3947049d7a15c27f6af848022f2b2bbe17d3ff0a4"}, {"id": "figure-error", "title": "4　误差差距表现成什么样", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-0b978bfbf3c5", "kind": "text", "html": "\u003ch3\u003e4.1　分开看系统偏移与重复波动\u003c/h3\u003e", "markdown": "### 4.1　分开看系统偏移与重复波动", "hash": "f573e5721e78348c30a540fc94ff7faa1349850392572b48140ae6b5a3b57c96"}, {"id": "report-e2010d609aec", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003eRMSE告诉我们误差大小，还需要看看估计结果本身。有的方法集中却偏离真值，有的方法平均位置较接近真值，但重复抽样波动更大。把分布位置和宽度分开看，才能理解前面的差距。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e RMSE告诉我们误差大小，还需要看看估计结果本身。有的方法集中却偏离真值，有的方法平均位置较接近真值，但重复抽样波动更大。把分布位置和宽度分开看，才能理解前面的差距。", "hash": "ebc7a88cef09c8d7d9aedc4fc30f5ec1732c148543bdd011a43ca76cbd2e5f9a"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e以下按β=1.5～5顺序展示。每张均以n=50、7纵向排列，形状、尺度、位置横向排列，七法顺序不变。虚线是真值，红点为均值，深色横线为25%～75%区间；三列显示范围固定为0～10、0～2000、0～1500。\u003c/p\u003e", "markdown": "以下按β=1.5～5顺序展示。每张均以n=50、7纵向排列，形状、尺度、位置横向排列，七法顺序不变。虚线是真值，红点为均值，深色横线为25%～75%区间；三列显示范围固定为0～10、0～2000、0～1500。", "hash": "1e23a89a6a00bf031c6fd78f2f76fde218d17238a48d5674de0bcbb75a435da5"}, {"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=5的视图可用于说明“集中”与“准确”的区别：部分方法的主体分布在形状、尺度上偏低，在位置上偏高；与之相比，有些方法的形状分布更宽。切换β后继续观察这些方向和宽度是否保持。密度仅展示窗口内主体，均值及四分位区间使用全部有效值；窗外结果并未从统计中删除。\u003c/p\u003e", "markdown": "β=5的视图可用于说明“集中”与“准确”的区别：部分方法的主体分布在形状、尺度上偏低，在位置上偏高；与之相比，有些方法的形状分布更宽。切换β后继续观察这些方向和宽度是否保持。密度仅展示窗口内主体，均值及四分位区间使用全部有效值；窗外结果并未从统计中删除。", "hash": "5f5d3f95e0cdce1df70f86e770d86e5aaf985298d19b05696981f90c6f8c3006"}]}], "content_hash": "e8a753c4ba121d9b52ca4e15a9723ff299f0dae74bff7c1aa1f513b181b6f057"}, {"id": "figure-tail", "title": "4.2　明显异常与没有返回有效估计分别展示", "mode": "content", "state": "open", "selected": "B", "options": [{"id": "B", "label": "当前正文", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003e有些问题在总体RMSE里容易被淹没：少数极端输出可能明显改变平均误差，而失败根本没有可用于计算误差的估计值。因此，除了看精度和分布，还要单独说明异常发生的频率，以及方法是否能返回有效结果。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 有些问题在总体RMSE里容易被淹没：少数极端输出可能明显改变平均误差，而失败根本没有可用于计算误差的估计值。因此，除了看精度和分布，还要单独说明异常发生的频率，以及方法是否能返回有效结果。", "hash": "c0e0ce3ae69cc35c31c24d8be5ed47fa19fa2aa3c69220d5eb28ad847bb8f9ab"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e形状明显异常沿用β̂≤β/3或β̂≥3β，异常率以有效结果数为分母；有效率以每条件1200次尝试为分母。两图覆盖全部n、β条件，分别回答“有效输出中明显偏离的情况是否反复发生”与“有多少次未返回有效估计”。\u003c/p\u003e", "markdown": "形状明显异常沿用β̂≤β/3或β̂≥3β，异常率以有效结果数为分母；有效率以每条件1200次尝试为分母。两图覆盖全部n、β条件，分别回答“有效输出中明显偏离的情况是否反复发生”与“有多少次未返回有效估计”。", "hash": "0076e79a8176b65e60db9974de22b3925a25ea1796d0e9fdfbb3c716a44fdc8d"}, {"id": "report-a438b7a83e00", "kind": "text", "html": "\u003cp\u003e异常频率不直接表示损失大小，0次发生也仅表示本批未观察到。判断方法表现时，需要将频率与前面的误差轮廓、分布位置和波动一起看。\u003c/p\u003e", "markdown": "异常频率不直接表示损失大小，0次发生也仅表示本批未观察到。判断方法表现时，需要将频率与前面的误差轮廓、分布位置和波动一起看。", "hash": "802502e5defa79c4aac69c7b0516ce45f56e6bf87daaaf224602ccd9eac4738b"}]}], "content_hash": "f439fcecec12475501ce5b1c7b818b730faab471ea824d290fa94f14a39013c5"}, {"id": "figure-mechanism", "title": "5　用典型案例简要解释偏移与异常", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-959c9a87cfe9", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003e这里不展开全部技术机制。先说明小样本为什么可能不足以约束起点，再沿一个具体方法的步骤，看看位置选择怎样带动形状和尺度。系统偏移与明显异常可以用同一条过程线来解释。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 这里不展开全部技术机制。先说明小样本为什么可能不足以约束起点，再沿一个具体方法的步骤，看看位置选择怎样带动形状和尺度。系统偏移与明显异常可以用同一条过程线来解释。", "hash": "91ae7824a3107f98a61301261fa48ddfee5349f574cbc6339c80b48acaed9b65"}, {"id": "report-7f1bc5162ac0", "kind": "text", "html": "\u003ch3\u003e5.1　共同背景：起点信息有限与参数补偿\u003c/h3\u003e", "markdown": "### 5.1　共同背景：起点信息有限与参数补偿", "hash": "60e1e11bba5b06b138994b872cad62d80cf4236b3287d2855f865bfd2c64c14b"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-bb6029e56ce6", "kind": "text", "html": "\u003cp\u003e复用Research00报告1图2：β=2与5，n=7、15、30，每格50组，下排给出样本最小值的理论密度。高β、样本较少时，最小观测往往仍离真实起点较远，位置参数缺少直接约束。\u003c/p\u003e", "markdown": "复用Research00报告1图2：β=2与5，n=7、15、30，每格50组，下排给出样本最小值的理论密度。高β、样本较少时，最小观测往往仍离真实起点较远，位置参数缺少直接约束。", "hash": "fa4c249010cb241b5c63116376235592bf80e6a389d732d6b8eca95f19e61f0f"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "markdown": "![Research00报告1图3：不同参数组合在观测区间内相近](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与分布相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e3ab0dd3b754", "kind": "text", "html": "\u003cp\u003e报告1图3进一步展示W(5,1000,500)与W(2,500,1000)：参数相差明显，在这组观测覆盖的中部区间却有相近曲线。两个分布用于解释局部相容性，并非两种方法的估计比较；黑点来自原β=5、n=7第31组。\u003c/p\u003e", "markdown": "报告1图3进一步展示W(5,1000,500)与W(2,500,1000)：参数相差明显，在这组观测覆盖的中部区间却有相近曲线。两个分布用于解释局部相容性，并非两种方法的估计比较；黑点来自原β=5、n=7第31组。", "hash": "db122b715e2af1eb8277b5f63c2152360935244aae1eccfce1fa45f98284e311"}, {"id": "report-ba11b2ee5b91", "kind": "text", "html": "\u003ch3\u003e5.2　沿K–R的定位、形状确定与尺度恢复追踪\u003c/h3\u003e", "markdown": "### 5.2　沿K–R的定位、形状确定与尺度恢复追踪", "hash": "91e49065ad23f22c9164e6ec36889ba6a282b01d21192ec517313a37161e76d1"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "markdown": "![Research00报告1图15：MMLE定位与形状尺度](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图15_MMLE定位与形状尺度.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-6329b563b1c4", "kind": "text", "html": "\u003cp\u003e报告1第2.6节、图15展示50组历史样本中的规律性偏移：K–R由最小值定位，再拟合保留距离；高β例呈现位置偏高、形状与尺度偏低。位置改变了后续拟合所用的距离，影响会传递到其他参数。\u003c/p\u003e", "markdown": "报告1第2.6节、图15展示50组历史样本中的规律性偏移：K–R由最小值定位，再拟合保留距离；高β例呈现位置偏高、形状与尺度偏低。位置改变了后续拟合所用的距离，影响会传递到其他参数。", "hash": "5521fd810fff68154cdeff6075fd4e60e98989c29345f320cc3e3042052b5afd"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "markdown": "![Research00报告2图19：K–R正常与明显异常的参数估计过程](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_配对情形_MMLE_low.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e9a79a03f6bf", "kind": "text", "html": "\u003cp\u003e再看报告2图19的明显异常例：W(5,100,500)、n=7，上排正常第10组，下排异常第11组。异常样本先以575.95定位，保留距离更分散，形状峰落在1.54，低于5/3，尺度随之得到28.69。三列依次读“怎样定位—形状怎样确定—尺度怎样恢复”。\u003c/p\u003e", "markdown": "再看报告2图19的明显异常例：W(5,100,500)、n=7，上排正常第10组，下排异常第11组。异常样本先以575.95定位，保留距离更分散，形状峰落在1.54，低于5/3，尺度随之得到28.69。三列依次读“怎样定位—形状怎样确定—尺度怎样恢复”。", "hash": "43efc52cca6affbeaf973dc811379b49eb12526bed1d30d488968f327cd3c439"}, {"id": "report-20890ec101de", "kind": "text", "html": "\u003cp\u003e历史案例用于解释形成过程，不并入本轮1200次统计。正式讲述可只展开其中一例。来源：\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A1%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E9%AB%98%E5%BD%A2%E7%8A%B6%E5%8F%82%E6%95%B0%E7%9A%84%E4%BC%B0%E8%AE%A1%E5%81%8F%E7%A7%BB.md\"\u003eResearch00报告1\u003c/a\u003e、\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A2%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E7%9A%84%E6%98%8E%E6%98%BE%E5%BC%82%E5%B8%B8%E4%BC%B0%E8%AE%A1.md\"\u003e报告2\u003c/a\u003e。\u003c/p\u003e", "markdown": "历史案例用于解释形成过程，不并入本轮1200次统计。正式讲述可只展开其中一例。来源：[Research00报告1](../../Research/00-方法对比/报告1：小样本情况下高形状参数的估计偏移.md)、[报告2](../../Research/00-方法对比/报告2：小样本情况下的明显异常估计.md)。", "hash": "b3baa26c8256c9ad7b6989eab2fb2664156d6c60bf5ac099395ff3785a2b0946"}]}], "content_hash": "21d68ecd22de6875e2b4f7145f05adb7f7dd353afd1dc696fbbe1f270890424b"}, {"id": "figure-life", "title": "6　将差异转为条件性选择依据", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003e前面的比较最后可以形成一个按n和β查看的候选表。但实际使用时，真实β通常未知，评价目标也可能不同。表格提供参考，选择仍需要结合已经掌握的信息、关心的参数或寿命指标，以及可以接受的风险。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 前面的比较最后可以形成一个按n和β查看的候选表。但实际使用时，真实β通常未知，评价目标也可能不同。表格提供参考，选择仍需要结合已经掌握的信息、关心的参数或寿命指标，以及可以接受的风险。", "hash": "ec0be61656ebe2ff9b71142131d06b2caa9a7ec6de8dbf1b2f5b8166760b6c82"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e表内方法为该条件共同有效样本上RMSE最小者；下行百分数为第二低RMSE比最低值高多少。颜色只区分方法。B10对应可靠度0.90，B1对应0.99；参数误差较小，不保证寿命目标上的排序相同。细小差距仍须核对不确定性，真β条件表不能直接当作可用的自动选择器。\u003c/p\u003e", "markdown": "表内方法为该条件共同有效样本上RMSE最小者；下行百分数为第二低RMSE比最低值高多少。颜色只区分方法。B10对应可靠度0.90，B1对应0.99；参数误差较小，不保证寿命目标上的排序相同。细小差距仍须核对不确定性，真β条件表不能直接当作可用的自动选择器。", "hash": "d1ef6d2065bf14c5f6b86d2057bbd1bedae3e77cc3ab6028b60704cf2de505d4"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e只知道n时，需要在明确的β参考范围中比较候选，并说明采用什么精度与风险规则；若还知道β的大致范围，可以缩小检查区域，再结合目标参数或寿命指标判断。当前表展示条件差异，尚未验证一套实际选法的收益。\u003c/p\u003e", "markdown": "只知道n时，需要在明确的β参考范围中比较候选，并说明采用什么精度与风险规则；若还知道β的大致范围，可以缩小检查区域，再结合目标参数或寿命指标判断。当前表展示条件差异，尚未验证一套实际选法的收益。", "hash": "bbb9d07f257b0c1092e622c39e60c71a7794973b37acb766b88cc80862acd7cb"}]}], "content_hash": "e8011259cc4bf035876dcaa256abbfc1531bc9ea67a5cc01d1259bcd7a01af6d"}, {"id": "closing-slot", "title": "7　下一步：利用具体样本信息辅助选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前正文", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cblockquote\u003e\n\u003cp\u003e即使n与总体参数相同，具体样本仍有差异。后续希望利用样本可观察到的特征和使用目标，辅助选择估计方法，并继续优化方法的过程量与求解过程。比较表提供前期依据，真正的选择规则及其收益还需要另外验证。\u003c/p\u003e\n\u003c/blockquote\u003e", "markdown": "\u003e 即使n与总体参数相同，具体样本仍有差异。后续希望利用样本可观察到的特征和使用目标，辅助选择估计方法，并继续优化方法的过程量与求解过程。比较表提供前期依据，真正的选择规则及其收益还需要另外验证。", "hash": "58a93f6ece71b319155538b3104ba76a1e251abb2ba4a0f692c757e0b95641a0"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e最后简要介绍\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e，作为方法计算和研究成果展示的入口，邀请同行试用。平台仍在建设，具体开放方法和实现版本以\u003ca href=\"file:///D:/weibull/README.md#%E5%BD%93%E5%89%8D%E7%8A%B6%E6%80%81%E5%BF%AB%E7%85%A7\"\u003e项目当前状态\u003c/a\u003e为准；本 <script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const diverge=el('button','diverge');diverge.type='button';diverge.dataset.diverge='true';diverge.setAttribute('aria-label','继续发散');diverge.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7L5 7m7 7 7-7M5 12V7h5m4 0h5v5"/></svg>';head.append(diverge);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)
 }
 section.append(grid);return section
}
function syncControls(unit,node){const state=draft.units[unit.id],button=node.querySelector('.diverge'),active=state.action==='extend';button.setAttribute('aria-pressed',String(active));button.title=active?'已标记继续发散，点击撤销':'继续发散';for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||'';for(const option of unit.options)for(const block of option.blocks)if(block.kind==='gallery'){const gallery=blockNode(unit.id,option.id,block.id)?.querySelector('.gallery');if(gallery)syncGallery(gallery,unit,option,block)}}
function render(nextBoard){
 const newRound=nextBoard.id!==board.id||nextBoard.revision!==board.revision;board=nextBoard;
 if(!draft||newRound){if($('confirmation').open)$('confirmation').close();closeEditor(false);loadDraft()}
 $('title').textContent=board.title;document.title=board.title;$('round').textContent=`第 ${board.revision} 轮`;document.body.classList.toggle('document-board',!!board.document||board.units.some(isContent));
 const keep=new Set();

let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}

function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;const divergence=anchor.kind==='divergence';$('editor').setAttribute('aria-label',divergence?'发散启发':'添加批注');$('editor-quote').textContent=anchor.quote;$('editor-input').setAttribute('aria-label',divergence?'发散启发':'批注意见');$('editor-input').placeholder=divergence?'补充探索方向、例子或启发（可留空）':'批注';$('save-note').textContent=divergence?'发散':'保存';$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;

document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});

function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);

function decisions(){return board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,image_notes:d.image_notes||[]}})}

function composePreview(intent){

function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if(pending.kind==='divergence'||$('editor-input').value.trim())saveNote();else closeEditor()}

async function submitConfirmed(){

async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
