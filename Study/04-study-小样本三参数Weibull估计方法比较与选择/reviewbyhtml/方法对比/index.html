<script id="initial-board" type="application/json">{"id": "study04-comparison-v04", "title": "方法对比：章节编排讨论", "document": true, "revision": 21, "source": "../../报告下（方法对比）-v0.4.md", "source_fingerprint": "7b568817a11ceb0c425edeef284e6d4be03145b825380cf2c89766660a250539", "content_fingerprint": "bdce79568aa964b7d5ada51867e1fd0d69a27f86d754e54ab4a20b692a9b12ac", "units": [{"id": "layout-diagnosis", "title": "章节编排：当前判断", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前讨论", "blocks": [{"id": "layout-diagnosis-1", "kind": "text", "markdown": "本轮只讨论编排与需要补充的分析。[报告下v0.4](../../报告下（方法对比）-v0.4.md)及其图文保持原样，以下均为待讨论的建议。", "html": "\u003cp\u003e本轮只讨论编排与需要补充的分析。\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E6%8A%A5%E5%91%8A%E4%B8%8B%EF%BC%88%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94%EF%BC%89-v0.4.md\"\u003e报告下v0.4\u003c/a\u003e及其图文保持原样，以下均为待讨论的建议。\u003c/p\u003e", "hash": "cbbbbf78925e501923a42d95dfac100adb48c1ce501efb8cdf8357da8d097b1b"}, {"id": "layout-diagnosis-2", "kind": "text", "markdown": "第2节可以承担展示差距的任务，不必在这里解释机理。它要让听众先看到：方法之间确实存在差别，差别的量级也不同。第3节再说明这些差别怎样随n和β改变。", "html": "\u003cp\u003e第2节可以承担展示差距的任务，不必在这里解释机理。它要让听众先看到：方法之间确实存在差别，差别的量级也不同。第3节再说明这些差别怎样随n和β改变。\u003c/p\u003e", "hash": "81af85e7f7e15efa3827065c29f03ea08579a1af8a82d742e094c7939617e307"}, {"id": "layout-diagnosis-3", "kind": "text", "markdown": "现在需要补上的，是第3节与后续解释之间的联系。第3节强调低β时，不同方法的形状误差对n减小的反应不同；第4、5节的主要发现和解释却集中在高β下的尺度双峰、位置偏移。两部分各自有内容，但回答的还不是同一个问题。", "html": "\u003cp\u003e现在需要补上的，是第3节与后续解释之间的联系。第3节强调低β时，不同方法的形状误差对n减小的反应不同；第4、5节的主要发现和解释却集中在高β下的尺度双峰、位置偏移。两部分各自有内容，但回答的还不是同一个问题。\u003c/p\u003e", "hash": "42d8c0c350495ab7be2ad5502500cf5d196be147696aabaf9f865ea8fd2316cb"}, {"id": "layout-diagnosis-4", "kind": "text", "markdown": "并非所有n效应都没有解释。K–R的位置偏差公式同时包含n和β，LSE/LRE的边界与内部解也在两档n下进行了核对；这些能解释具体构造下的部分变化，尚不能解释第3节所述的全部方法差异。", "html": "\u003cp\u003e并非所有n效应都没有解释。K–R的位置偏差公式同时包含n和β，LSE/LRE的边界与内部解也在两档n下进行了核对；这些能解释具体构造下的部分变化，尚不能解释第3节所述的全部方法差异。\u003c/p\u003e", "hash": "c6291af38c74112a09bb59509c20b227b1d4233d7c10fafe05baa75b5c99833b"}, {"id": "layout-diagnosis-5", "kind": "text", "markdown": "**我的建议是：先交代整体规律，再围绕少数关键现象，将证据和解释放在一起。** 不把所有曲线逐条解释，也不把前面提出的问题全部留到很后面。", "html": "\u003cp\u003e\u003cstrong\u003e我的建议是：先交代整体规律，再围绕少数关键现象，将证据和解释放在一起。\u003c/strong\u003e 不把所有曲线逐条解释，也不把前面提出的问题全部留到很后面。\u003c/p\u003e", "hash": "554c9c36fe1bec02415bf3da1f524211cb648069c33585b73f5466285b1f165d"}]}], "content_hash": "4cf88c75e8d9d16eff525b96590a048a21f27021c193f67c32d24bc7bbf0c5c6"}, {"id": "layout-evidence-map", "title": "现象与解释，目前对应到哪里", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前讨论", "blocks": [{"id": "layout-evidence-map-1", "kind": "visual", "markdown": "| 需要说明的问题 | 已有材料能够说明什么 | 还缺什么 |\n|---|---|---|\n| n减小时，为什么不同方法的误差增幅不同？ | 玫瑰图展示增幅与相对表现；已有n–β分析还发现，有些条件下波动下降而偏差增加。K–R的最小值规则能够解释其位置偏差随n变化。 | 低β下LSE、LRE、MLE等方法的形状误差增长，尚未与偏移、波动及极端结果逐一对应，更没有完整的构造解释。 |\n| β变化时，为什么出现尺度双峰、位置与尺度反向偏移？ | 分布图显示形态变化；参数配对、边界分组和目标函数廓线支持LSE/LRE的解释；最小值定位解释K–R的位置正偏差。 | MDM、WMLE的方向性偏移仍须分别检查。不能把LSE/LRE的边界机制作为所有方法的共同解释。 |\n| 少数异常与求解失败，会怎样改变比较判断？ | 异常率、有效率及已有极端记录可分别显示：成功子集的精度、极端结果的影响与未返回风险。 | 当前K–R案例不能替代MM极端形状估计或MLE失败的原因分析；如不深入这些机理，就把这一部分收在“对评价的影响”。 |", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e需要说明的问题\u003c/th\u003e\u003cth\u003e已有材料能够说明什么\u003c/th\u003e\u003cth\u003e还缺什么\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003en减小时，为什么不同方法的误差增幅不同？\u003c/td\u003e\u003ctd\u003e玫瑰图展示增幅与相对表现；已有n–β分析还发现，有些条件下波动下降而偏差增加。K–R的最小值规则能够解释其位置偏差随n变化。\u003c/td\u003e\u003ctd\u003e低β下LSE、LRE、MLE等方法的形状误差增长，尚未与偏移、波动及极端结果逐一对应，更没有完整的构造解释。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eβ变化时，为什么出现尺度双峰、位置与尺度反向偏移？\u003c/td\u003e\u003ctd\u003e分布图显示形态变化；参数配对、边界分组和目标函数廓线支持LSE/LRE的解释；最小值定位解释K–R的位置正偏差。\u003c/td\u003e\u003ctd\u003eMDM、WMLE的方向性偏移仍须分别检查。不能把LSE/LRE的边界机制作为所有方法的共同解释。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e少数异常与求解失败，会怎样改变比较判断？\u003c/td\u003e\u003ctd\u003e异常率、有效率及已有极端记录可分别显示：成功子集的精度、极端结果的影响与未返回风险。\u003c/td\u003e\u003ctd\u003e当前K–R案例不能替代MM极端形状估计或MLE失败的原因分析；如不深入这些机理，就把这一部分收在“对评价的影响”。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "2b08bec8a0fbc7019b4ca7f442b631649100d1ef777260f9863be1e3bb5ba4da"}, {"id": "layout-evidence-map-2", "kind": "text", "markdown": "n=50和7适合显示现象对照；若要区分“已有问题加重”与“出现新的分布形态”，还应回看n=20、15、10的已有结果。两档对照本身不能确定变化发生的条件。", "html": "\u003cp\u003en=50和7适合显示现象对照；若要区分“已有问题加重”与“出现新的分布形态”，还应回看n=20、15、10的已有结果。两档对照本身不能确定变化发生的条件。\u003c/p\u003e", "hash": "a0b6b257f72047e27e58a9e3bbc46d0b0db2514905542f06c8a30f04547c83d4"}]}], "content_hash": "22d12939fe79b5f773d7ed99a2bfd4998c030288d9be2e701731cad1156e493b"}, {"id": "layout-common", "title": "三种方案共同保留的部分", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前讨论", "blocks": [{"id": "layout-common-1", "kind": "text", "markdown": "**开头保留：比较设置 → 方法之间相差多少。** 第2节只建立整体印象，条件变化集中到后面展开，避免第2、3节重复解释同一规律。", "html": "\u003cp\u003e\u003cstrong\u003e开头保留：比较设置 → 方法之间相差多少。\u003c/strong\u003e 第2节只建立整体印象，条件变化集中到后面展开，避免第2、3节重复解释同一规律。\u003c/p\u003e", "hash": "09be1ad138154a95ef7583b4912916a357aae49c21a934d6b2e236abecc3d645"}, {"id": "layout-common-2", "kind": "text", "markdown": "**结尾保留：评价目标与条件性选择 → 后续研究与网站。** 前面辨明差异后，再简要讨论怎样使用这些认识；方法选择不另扩成研究主线。", "html": "\u003cp\u003e\u003cstrong\u003e结尾保留：评价目标与条件性选择 → 后续研究与网站。\u003c/strong\u003e 前面辨明差异后，再简要讨论怎样使用这些认识；方法选择不另扩成研究主线。\u003c/p\u003e", "hash": "0d584a9a0c6e89d722b98fc9cc983f46ccbb82535b134a96e9987d3e1eaffcc9"}, {"id": "layout-common-3", "kind": "text", "markdown": "下面只比较中间部分的组织方式，未替你预选。", "html": "\u003cp\u003e下面只比较中间部分的组织方式，未替你预选。\u003c/p\u003e", "hash": "579e94c0a66d23343bc0d3fe5a2dd0698589143f3592b5ffdc30816b4f3616ff"}]}], "content_hash": "20ad378466f1f19641533cb0ecd8aaeb8458b863f1282732d4cf721ea1b64805"}, {"id": "layout-order", "title": "中间部分怎样编排", "mode": "choices", "state": "open", "selected": null, "inline": true, "context": "三种方案只改变中间部分的组织方式。可以选择，也可以直接批注；目前未选定。", "options": [{"id": "A", "label": "方案A：集中展示问题，再集中解释", "blocks": [{"id": "layout-A-1", "kind": "text", "markdown": "**顺序：整体差距 → n、β变化下的主要现象 → 形成原因 → 评价与选择。**", "html": "\u003cp\u003e\u003cstrong\u003e顺序：整体差距 → n、β变化下的主要现象 → 形成原因 → 评价与选择。\u003c/strong\u003e\u003c/p\u003e", "hash": "d0c0f1cc6a6707591ee2cf8d571c8291c1a9a9a8296976646c8cdca67693fa1b"}, {"id": "layout-A-2", "kind": "visual", "markdown": "| 中间章节 | 具体内容 |\n|---|---|\n| 3　n和β变化时，估计表现发生什么变化 | 先看RMSE增幅与方法差距，再看分布分化、系统偏移，最后交代异常与返回情况。把待解释的问题集中提出。 |\n| 4　这些变化怎样形成 | 按上一节的问题顺序回答：样本量变化对应何种误差变化；双峰与边界选解；最小值定位与位置偏差；异常怎样影响统计量。 |", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e中间章节\u003c/th\u003e\u003cth\u003e具体内容\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e3　n和β变化时，估计表现发生什么变化\u003c/td\u003e\u003ctd\u003e先看RMSE增幅与方法差距，再看分布分化、系统偏移，最后交代异常与返回情况。把待解释的问题集中提出。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4　这些变化怎样形成\u003c/td\u003e\u003ctd\u003e按上一节的问题顺序回答：样本量变化对应何种误差变化；双峰与边界选解；最小值定位与位置偏差；异常怎样影响统计量。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "f144e5cac8026b8c66e1872c9fca996f48079aa401289bf16544797053db9241"}, {"id": "layout-A-3", "kind": "text", "markdown": "现有第3、4节并成现象部分，第5节成为对应的解释部分。每项解释回指一个具体发现。", "html": "\u003cp\u003e现有第3、4节并成现象部分，第5节成为对应的解释部分。每项解释回指一个具体发现。\u003c/p\u003e", "hash": "b4765d6fdc1cb79bf3ea28785a649db243018fd11bdcb000f799e98a30ffcf41"}, {"id": "layout-A-4", "kind": "text", "markdown": "**适合之处：** 先有完整观察，再讲机理，层次清楚；共同的参数补偿背景只需解释一次。", "html": "\u003cp\u003e\u003cstrong\u003e适合之处：\u003c/strong\u003e 先有完整观察，再讲机理，层次清楚；共同的参数补偿背景只需解释一次。\u003c/p\u003e", "hash": "e0a88decbec4abdc84a2d7746349de5ff88f71f54cfbd3c1992767d7a1afe3ab"}, {"id": "layout-A-5", "kind": "text", "markdown": "**需要注意：** 听众要记住几个问题，较晚才能听到回答。现象若列得太多，容易回到“先堆图、再解释”的状态。目前缺失的样本量解释仍需补充，重排本身不能补上它。", "html": "\u003cp\u003e\u003cstrong\u003e需要注意：\u003c/strong\u003e 听众要记住几个问题，较晚才能听到回答。现象若列得太多，容易回到“先堆图、再解释”的状态。目前缺失的样本量解释仍需补充，重排本身不能补上它。\u003c/p\u003e", "hash": "db51648febf533e5020d8e3de4ecc6a283d32ec7891d30ce76f3188e79750e53"}]}, {"id": "B", "label": "方案B：按问题分节，每节展示后立即解释", "blocks": [{"id": "layout-B-1", "kind": "text", "markdown": "**顺序：整体差距 → 误差为何随样本减少而变化 → 分布为何分化 → 异常怎样影响判断。**", "html": "\u003cp\u003e\u003cstrong\u003e顺序：整体差距 → 误差为何随样本减少而变化 → 分布为何分化 → 异常怎样影响判断。\u003c/strong\u003e\u003c/p\u003e", "hash": "14a17bf16c422c0f0e755813a674d328a93906d761ceb125fd0c035f42e50c8f"}, {"id": "layout-B-2", "kind": "visual", "markdown": "| 中间章节 | 具体内容 |\n|---|---|\n| 3　样本减少时，误差以什么方式增大 | 将玫瑰图的样本量变化，与相应条件下的偏移、波动和尾部结果放在一起，再联系具体方法规则解释。各β作为同一问题下的比较条件。 |\n| 4　位置和尺度为什么出现分化 | 分布图提出双峰与反向偏移；紧接LSE/LRE的边界图、参数补偿和K–R定位例，分别解释。 |\n| 5　异常与未返回怎样改变评价 | 展示风险与有效率，接一个影响RMSE的典型记录；把对评价的影响讲清，是否深入成因另作取舍。 |", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e中间章节\u003c/th\u003e\u003cth\u003e具体内容\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e3　样本减少时，误差以什么方式增大\u003c/td\u003e\u003ctd\u003e将玫瑰图的样本量变化，与相应条件下的偏移、波动和尾部结果放在一起，再联系具体方法规则解释。各β作为同一问题下的比较条件。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4　位置和尺度为什么出现分化\u003c/td\u003e\u003ctd\u003e分布图提出双峰与反向偏移；紧接LSE/LRE的边界图、参数补偿和K–R定位例，分别解释。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5　异常与未返回怎样改变评价\u003c/td\u003e\u003ctd\u003e展示风险与有效率，接一个影响RMSE的典型记录；把对评价的影响讲清，是否深入成因另作取舍。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "492fe7b2d6d01545dbd7058a00a44e9cc9ab55096de4b33ab2f2195705fb78d3"}, {"id": "layout-B-3", "kind": "text", "markdown": "现有第3—5节按问题拆开重组，不再单设一个集中讲机理的章节。", "html": "\u003cp\u003e现有第3—5节按问题拆开重组，不再单设一个集中讲机理的章节。\u003c/p\u003e", "hash": "071c0fd4a95068938bb13dd9ea981797e8cf7cf00c09c4bcce1d3d87e58bb11d"}, {"id": "layout-B-4", "kind": "text", "markdown": "**适合之处：** 每个问题在本节内得到回应，听众容易跟上；观察和解释距离最短。", "html": "\u003cp\u003e\u003cstrong\u003e适合之处：\u003c/strong\u003e 每个问题在本节内得到回应，听众容易跟上；观察和解释距离最短。\u003c/p\u003e", "hash": "497ec7565381acac51fb520d31bbad9b3b1f73fa50901bb354075a48dccc6d44"}, {"id": "layout-B-5", "kind": "text", "markdown": "**需要注意：** n、β的整体变化分散在几个问题里，宏观条件规律不如集中呈现鲜明；参数补偿等共同背景也容易重复。第3节仍须先完成针对样本量的分析，才能形成完整的一节。", "html": "\u003cp\u003e\u003cstrong\u003e需要注意：\u003c/strong\u003e n、β的整体变化分散在几个问题里，宏观条件规律不如集中呈现鲜明；参数补偿等共同背景也容易重复。第3节仍须先完成针对样本量的分析，才能形成完整的一节。\u003c/p\u003e", "hash": "12a6fba887a5136bab1d04cdf106c8c416ce3aa399d14003be8e9a5fc25a4aba"}]}, {"id": "C", "label": "方案C：整体规律先行，关键问题分别闭合", "blocks": [{"id": "layout-C-1", "kind": "text", "markdown": "**顺序：整体差距 → n、β共同改变差距的规律 → 两组关键现象及解释 → 评价中的异常与失败。**", "html": "\u003cp\u003e\u003cstrong\u003e顺序：整体差距 → n、β共同改变差距的规律 → 两组关键现象及解释 → 评价中的异常与失败。\u003c/strong\u003e\u003c/p\u003e", "hash": "02a60c8c86c87cabca5cec4645af5d2bba9fea32be146631408b088e88a8f654"}, {"id": "layout-C-2", "kind": "visual", "markdown": "| 中间章节 | 具体内容 |\n|---|---|\n| 3　差距怎样随n和β改变 | 保留玫瑰图，集中提炼条件规律：误差增幅不同、相对表现可能改变。这里不展开各法机理，也不列出所有异常。 |\n| 4.1　样本减少，增加的误差来自哪里 | 接第3节最有代表性的样本量变化，查看分布是变宽、整体偏移，还是受少数极端结果影响；再对其中有依据的具体原因作解释。此处需要补分析。 |\n| 4.2　位置与尺度为什么出现双峰和偏移 | 将现有分布图与边界、参数补偿、最小值定位的解释相邻放置；同时指出这些现象在两档n下是已经存在，还是更突出。 |\n| 5　异常与求解失败怎样影响比较 | 简要交代极端值与成功筛选对评价的影响，配一个必要案例；不要求解释全部异常和失败的成因。 |", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e中间章节\u003c/th\u003e\u003cth\u003e具体内容\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e3　差距怎样随n和β改变\u003c/td\u003e\u003ctd\u003e保留玫瑰图，集中提炼条件规律：误差增幅不同、相对表现可能改变。这里不展开各法机理，也不列出所有异常。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4.1　样本减少，增加的误差来自哪里\u003c/td\u003e\u003ctd\u003e接第3节最有代表性的样本量变化，查看分布是变宽、整体偏移，还是受少数极端结果影响；再对其中有依据的具体原因作解释。此处需要补分析。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4.2　位置与尺度为什么出现双峰和偏移\u003c/td\u003e\u003ctd\u003e将现有分布图与边界、参数补偿、最小值定位的解释相邻放置；同时指出这些现象在两档n下是已经存在，还是更突出。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5　异常与求解失败怎样影响比较\u003c/td\u003e\u003ctd\u003e简要交代极端值与成功筛选对评价的影响，配一个必要案例；不要求解释全部异常和失败的成因。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "d196908d6f67c32a0b97df562bd2c8f72ff06967946b27fcd5b56c18f14e120e"}, {"id": "layout-C-3", "kind": "text", "markdown": "现有第3节保留宏观作用，第4、5节的分布现象和对应机理重新配对；风险部分作为评价提醒收束，随后进入目标指标与条件性选择。", "html": "\u003cp\u003e现有第3节保留宏观作用，第4、5节的分布现象和对应机理重新配对；风险部分作为评价提醒收束，随后进入目标指标与条件性选择。\u003c/p\u003e", "hash": "36ed9e0604a65399699b28908f31c8c2c25f47a5f82d5c59299c76e09e4c1412"}, {"id": "layout-C-4", "kind": "text", "markdown": "**适合之处：** 先保留n、β的共同变化，再用具体问题展开；听众既能看到整体规律，也不必等待很久才听到每个现象的解释。", "html": "\u003cp\u003e\u003cstrong\u003e适合之处：\u003c/strong\u003e 先保留n、β的共同变化，再用具体问题展开；听众既能看到整体规律，也不必等待很久才听到每个现象的解释。\u003c/p\u003e", "hash": "40e6bcf238e657866bf8b198e6eb1b6947794559ca31b8faed757a0cc4256c72"}, {"id": "layout-C-5", "kind": "text", "markdown": "**需要注意：** 第3节只说整体规律，第4节只深入关键现象，避免再次重复展示同一组结论。样本量部分不能只补一句“样本少、信息少”，还要指出具体是哪种误差变化，以及它与方法规则的关系。", "html": "\u003cp\u003e\u003cstrong\u003e需要注意：\u003c/strong\u003e 第3节只说整体规律，第4节只深入关键现象，避免再次重复展示同一组结论。样本量部分不能只补一句“样本少、信息少”，还要指出具体是哪种误差变化，以及它与方法规则的关系。\u003c/p\u003e", "hash": "3cc557ed7163d1f0582263b95d8bbed75fa0974ed0cf919037da352333b30510"}]}], "content_hash": "d14ea1abdd65398ad51266ea8ca100971f61fc3d5fada0443921cfb81aeb7514"}, {"id": "layout-analysis-gap", "title": "建议与需要补充的分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前讨论", "blocks": [{"id": "layout-analysis-gap-1", "kind": "text", "markdown": "当前已有的整体比较和机理材料都能保留，但各自的任务更明确：第2节建立差距印象，第3节归纳条件规律，第4节把关键问题讲透，第5节说明异常与失败如何影响判断。", "html": "\u003cp\u003e当前已有的整体比较和机理材料都能保留，但各自的任务更明确：第2节建立差距印象，第3节归纳条件规律，第4节把关键问题讲透，第5节说明异常与失败如何影响判断。\u003c/p\u003e", "hash": "104f383e449047ca9580e1a8f4ab90d39cb68bb061b1548ebf0da4a89b1fb020"}, {"id": "layout-analysis-gap-2", "kind": "text", "markdown": "需要优先补的是一条与第3节直接对应的分析，而不是再增加一批图：", "html": "\u003cp\u003e需要优先补的是一条与第3节直接对应的分析，而不是再增加一批图：\u003c/p\u003e", "hash": "3021ec68242c39f06d370e0bd73e7cd90583186dfce9d1d433f1fc52611ef170"}, {"id": "layout-analysis-gap-3", "kind": "text", "markdown": "1. **先定位变化。** 复用40个条件，检查方法误差增幅的差别主要对应偏移、波动还是尾部贡献，保持自身有效与共同有效口径分开。不预先指定谁应当更好。\n2. **再追踪过程。** 对最有解释价值的现象，使用五档n的已有结果，辨别变化是连续加重，还是出现分组、边界集中等结构变化。n=50和7用于展示对照，中间三档用于检查过程。\n3. **最后核对原因。** 对准备在台上解释的具体方法，回到位置处理、估计判据或约束，用原样本作针对性诊断。已有K–R理论与LSE/LRE边界核验可直接复用；低β形状误差的原因仍需继续找依据。", "html": "\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e先定位变化。\u003c/strong\u003e 复用40个条件，检查方法误差增幅的差别主要对应偏移、波动还是尾部贡献，保持自身有效与共同有效口径分开。不预先指定谁应当更好。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e再追踪过程。\u003c/strong\u003e 对最有解释价值的现象，使用五档n的已有结果，辨别变化是连续加重，还是出现分组、边界集中等结构变化。n=50和7用于展示对照，中间三档用于检查过程。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e最后核对原因。\u003c/strong\u003e 对准备在台上解释的具体方法，回到位置处理、估计判据或约束，用原样本作针对性诊断。已有K–R理论与LSE/LRE边界核验可直接复用；低β形状误差的原因仍需继续找依据。\u003c/li\u003e\n\u003c/ol\u003e", "hash": "30a2582e1dd0270fe810aacbd1783e1a1eb7ba90eba0a93d4d85475c4ca01e99"}, {"id": "layout-analysis-gap-4", "kind": "text", "markdown": "偏移、波动和尾部的统计区分回答“误差怎样增加”，还不等于回答“这种方法为什么会这样”。两层要衔接，但不能互相替代。", "html": "\u003cp\u003e偏移、波动和尾部的统计区分回答“误差怎样增加”，还不等于回答“这种方法为什么会这样”。两层要衔接，但不能互相替代。\u003c/p\u003e", "hash": "91cdb6f8ef8925b543b5859d364cafd59893281903866d9e55cfc3f4f1eb1c4d"}, {"id": "layout-analysis-gap-5", "kind": "text", "markdown": "这一阶段不新增参数网格、不预定结论，也不要求给每种方法找到一套完整机理。先把一两个能够闭合的问题讲清，再决定其余现象保留为规律、补充分析，还是从主讲内容中移出。", "html": "\u003cp\u003e这一阶段不新增参数网格、不预定结论，也不要求给每种方法找到一套完整机理。先把一两个能够闭合的问题讲清，再决定其余现象保留为规律、补充分析，还是从主讲内容中移出。\u003c/p\u003e", "hash": "0f85c1e658d81c4fd7ae6acb2f95e2e8da016ab4c49bd2daf75e515a9c7d81ae"}, {"id": "layout-analysis-gap-6", "kind": "text", "markdown": "### 依据", "html": "\u003ch3\u003e依据\u003c/h3\u003e", "hash": "70808fbf26002f2bcaf456d72fd2ff6db92186135d4383eaf174e86e1767b2d3"}, {"id": "layout-analysis-gap-7", "kind": "text", "markdown": "- [当前报告下v0.4](../../报告下（方法对比）-v0.4.md)：现有章节、图文和讲述顺序。\n- [n与β变化及交互影响分析](../n与β变化及交互影响分析-v0.1.md)：全条件的误差、偏移、波动与风险变化。\n- [分布现象与形成机制](分布现象与形成机制.md)：边界分组、参数补偿、K–R定位以及核验范围。", "html": "\u003cul\u003e\n\u003cli\u003e\u003ca href=\"file:///D:/weibull/Study/04-study-%E5% ": [{"id": "report-f2c54054d842", "kind": "text", "html": "\u003cp\u003e魏鹏宇｜东北大学机械工程与自动化学院\u003c/p\u003e", "markdown": "魏鹏宇｜东北大学机械工程与自动化学院", "hash": "e34d5dccdbc5fe6a2e6aa79fb914f40af7b3ab5975dc9b777f6f83715e5b947f"}, {"id": "report-69d8981026f6", "kind": "text", "html": "\u003cp\u003e分会场3：装备寿命与可靠性评估\u003c/p\u003e", "markdown": "分会场3：装备寿命与可靠性评估", "hash": "d12fe63a3a4df579b1d210797bf2dba7c8acfe56005a0d2730e90413ea0d0986"}]}], "content_hash": "16cf093f636570caaad164f796de5d202d6bf7f4bc1e58b403fa3c089ff6c68b"}, {"id": "evidence-base", "title": "1　比较对象与共同条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前正文", "blocks": [{"id": "report-4a927afb22ea", "kind": "text", "html": "\u003cp\u003e本轮比较七种方法在相同样本下的估计误差、重复抽样波动、明显异常和有效返回情况。\u003c/p\u003e", "markdown": "本轮比较七种方法在相同样本下的估计误差、重复抽样波动、明显异常和有效返回情况。", "hash": "3223cbd4f5ac71dcdea2f1d4b2297a697fd6289f8f60b0c34b2bd855b6e585b0"}, {"id": "report-b9b445a8b97b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e项目\u003c/th\u003e\u003cth\u003e本轮设置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "9d3178592e2e71c7166d23588071c1bc5684d4d5214655273024ec9e5e228f18"}, {"id": "figure-global", "title": "2　方法之间究竟相差多少", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_整体差距百分比.png", "alt": "主体差距：直接读多出百分之多少", "markdown": "![主体差距：直接读多出百分之多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_整体差距百分比.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "global-insight", "kind": "text", "markdown": "方法间差距在形状参数上更突出。n较小时，低至中等β区域的形状RMSE相对差距较大；高β区域的尺度和位置相对差距总体随n减小而缩小。差距的变化同时受n、β和目标参数影响。\n\n这里反映的是相对差距，其缩小不等于各方法的绝对误差减小。", "html": "\u003cp\u003e方法间差距在形状参数上更突出。n较小时，低至中等β区域的形状RMSE相对差距较大；高β区域的尺度和位置相对差距总体随n减小而缩小。差距的变化同时受n、β和目标参数影响。\u003c/p\u003e\n\u003cp\u003e这里反映的是相对差距，其缩小不等于各方法的绝对误差减小。\u003c/p\u003e", "hash": "d719c9251818a4d642ce1e6f127aa7d22c75be2d4e2d1b3e7de1c27dcc5f12bd"}, {"id": "report-7dd6a876cc3f", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。*", "hash": "f4f1559a8ee0cead835ba0fd00467e4917e8caf8ba1340ba1ba5be63efb0ac32"}]}], "content_hash": "3bb19feac11e2978e6545fe7372657ce10701e67facba379338b9b3d7365bc1e"}, {"id": "figure-change", "title": "3　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003en=50时，主图六种方法的形状误差差距相对有限；n较小时，低β区域的差距明显增大。LSE、LRE和MLE的形状RMSE增幅大于MDM、WMLE，反映出不同方法对样本量变化的敏感性不同。\u003c/p\u003e\n\u003cp\u003e方法排序也会改变。β=1.5时，形状RMSE最低的方法由n=50时的K–R变为n=7时的WMLE。即使β相同，样本量变化也会影响方法的相对表现。\u003c/p\u003e\n\u003cp\u003eMM在部分条件下的形状RMSE明显高于其余方法，需要结合估计分布检查极端值的影响。\u003c/p\u003e", "markdown": "n=50时，主图六种方法的形状误差差距相对有限；n较小时，低β区域的差距明显增大。LSE、LRE和MLE的形状RMSE增幅大于MDM、WMLE，反映出不同方法对样本量变化的敏感性不同。\n\n方法排序也会改变。β=1.5时，形状RMSE最低的方法由n=50时的K–R变为n=7时的WMLE。即使β相同，样本量变化也会影响方法的相对表现。\n\nMM在部分条件下的形状RMSE明显高于其余方法，需要结合估计分布检查极端值的影响。", "hash": "a918be444f6ca72f6b81068dce984e551f859ef4def8c94bb898acb82467aba3"}]}], "content_hash": "39da073c29883d4fd77e73f9e7d9b9a81fc02186498d462be811799f7a75dd40"}, {"id": "figure-error", "title": "4　误差差距表现成什么样", "mode": "content", "state": "modify", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-0b978bfbf3c5", "kind": "text", "html": "\u003ch3\u003e4.1　随β变化的分布分化与参数偏移\u003c/h3\u003e", "markdown": "### 4.1　随β变化的分布分化与参数偏移", "hash": "d382f8cdf432e519170f9447b7c77b3ec7ba5cc89a48491770d00641d7accfa7"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003e随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。β改变的不只是误差幅度，还包括估计结果的分布形态。\u003c/p\u003e\n\u003cp\u003e与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。位置与尺度呈现出相反方向的变化。\u003c/p\u003e\n\u003cp\u003eβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。两组结果的正负误差在平均时相互抵消，均值因而没有反映出分布的分化。\u003c/p\u003e", "markdown": "随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。β改变的不只是误差幅度，还包括估计结果的分布形态。\n\n与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。位置与尺度呈现出相反方向的变化。\n\nβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。两组结果的正负误差在平均时相互抵消，均值因而没有反映出分布的分化。", "hash": "5c04f6e21e06903d6676136cc328f804a50e182e678e7b265476aba10adef123"}]}], "content_hash": "d3aaa7ba31fb2d4ed0f7a48b9bd55b451aa2c0b018b3b758c11c3b7772ae2176"}, {"id": "figure-tail", "title": "4.2　明显异常与求解失败", "mode": "content", "state": "open", "selected": "B", "options": [{"id": "B", "label": "当前正文", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e少数极端结果可能明显抬高RMSE，求解失败则不进入有效结果的误差统计。因此，异常风险和有效率需要单独评价。\u003c/p\u003e", "markdown": "少数极端结果可能明显抬高RMSE，求解失败则不进入有效结果的误差统计。因此，异常风险和有效率需要单独评价。", "hash": "9989ac437aa44303e88e626928cd2497c73aae17844d4c4887b5c762ec2577f7"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-insight", "kind": "text", "markdown": "MDM、LSE、LRE和WMLE在小n、高β条件下的形状异常率较高；MLE在低β、小n条件下也出现较高异常率。不同方法的异常风险区域并不相同。", "html": "\u003cp\u003eMDM、LSE、LRE和WMLE在小n、高β条件下的形状异常率较高；MLE在低β、小n条件下也出现较高异常率。不同方法的异常风险区域并不相同。\u003c/p\u003e", "hash": "654059997591cd10d0563dfe4fdfa80604f97e384e9a2aa408406c51f40081ee"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显。成功结果的精度与有效率应分别评价。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显。成功结果的精度与有效率应分别评价。\u003c/p\u003e", "hash": "57f22f96fa04dff23b6c0d75bf2355c1ed8d6be05ae44226a302ed00000c9393"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。*", "hash": "4a575a1f296bb18010f5b66810f9e25ffe1e2154df18b3c34a7ed1d43ee1c84f"}]}], "content_hash": "7c702102034c3486b1b7e88ddfd0affa8e6baf32448a74f2c1b1f5950d883ee3"}, {"id": "figure-mechanism", "title": "5　偏移与异常怎样形成", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-7f1bc5162ac0", "kind": "text", "html": "\u003ch3\u003e5.1　共同背景：起点信息有限与参数补偿\u003c/h3\u003e", "markdown": "### 5.1　共同背景：起点信息有限与参数补偿", "hash": "60e1e11bba5b06b138994b872cad62d80cf4236b3287d2855f865bfd2c64c14b"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-bb6029e56ce6", "kind": "text", "html": "\u003cp\u003e高β、小n时，样本最小值与真实位置参数之间通常存在较大距离，位置参数缺少接近起点的观测约束。\u003c/p\u003e", "markdown": "高β、小n时，样本最小值与真实位置参数之间通常存在较大距离，位置参数缺少接近起点的观测约束。", "hash": "583294775cafc8818226be6f7fdede5e279edc5176db69b79711102ab0e5e89d"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "markdown": "![Research00报告1图3：不同参数组合在观测区间内相近](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与分布相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e3ab0dd3b754", "kind": "text", "html": "\u003cp\u003e两组参数差异较大，但分布函数在样本覆盖的区间内接近，表明不同参数组合可以在局部区间产生相近分布。样本区间内的拟合程度，不能单独说明三项参数的估计精度。\u003c/p\u003e", "markdown": "两组参数差异较大，但分布函数在样本覆盖的区间内接近，表明不同参数组合可以在局部区间产生相近分布。样本区间内的拟合程度，不能单独说明三项参数的估计精度。", "hash": "0f08730d6f236e4ade7287c9e799904f6f81016e58085ce6410ba68382a891c3"}, {"id": "local-combinations", "kind": "text", "markdown": "在分布中部作近似展开，高β时的寿命水平主要受γ+η控制，离散程度与η/β有关。不同的三参数组合可以保持相近的局部分布，位置、尺度与形状因而存在相互补偿。", "html": "\u003cp\u003e在分布中部作近似展开，高β时的寿命水平主要受γ+η控制，离散程度与η/β有关。不同的三参数组合可以保持相近的局部分布，位置、尺度与形状因而存在相互补偿。\u003c/p\u003e", "hash": "c79924bd6c8d5f98d69f2e372b1f291fa103b401874ef75756e5d4c25600c6dd"}, {"id": "boundary-heading", "kind": "text", "markdown": "### 5.2　位置边界怎样形成尺度双峰", "html": "\u003ch3\u003e5.2　位置边界怎样形成尺度双峰\u003c/h3\u003e", "hash": "cebee8fee00ff87abea169fc1b5cb6dc40bd42d5acf5f620a7dafb7b4bfc2788"}, {"id": "boundary-objective", "kind": "text", "markdown": "LSE最大化F比，LRE最大化相关系数；两种定位准则在数学上均随概率图相关性增大而增大，因此都倾向选择使概率图接近线性的位置。对部分样本，非负位置范围内的最优解位于γ=0；其他样本选择内部位置，两类位置结果对应不同尺度区间。\n\n随β增大，零边界对应的高尺度结果更集中，内部解对应的尺度向低值移动，两组分离形成双峰。β较小时，两组分布仍有较多重叠，存在零边界结果也未必呈现双峰。", "html": "\u003cp\u003eLSE最大化F比，LRE最大化相关系数；两种定位准则在数学上均随概率图相关性增大而增大，因此都倾向选择使概率图接近线性的位置。对部分样本，非负位置范围内的最优解位于γ=0；其他样本选择内部位置，两类位置结果对应不同尺度区间。\u003c/p\u003e\n\u003cp\u003e随β增大，零边界对应的高尺度结果更集中，内部解对应的尺度向低值移动，两组分离形成双峰。β较小时，两组分布仍有较多重叠，存在零边界结果也未必呈现双峰。\u003c/p\u003e", "hash": "68c0a318964ad83fb66b6ecda0d103ce70e834edcc76cb7fa1dda2fa2826556b"}, {"id": "boundary-profiles", "kind": "gallery", "aspect_ratio": 1.5, "images": [{"id": "n-50", "label": "β = 5，n = 50", "src": "assets/尺度双峰_边界与参数补偿_n50.png", "alt": "β=5、n=50，LSE与LRE的位置尺度配对及位置准则廓线"}, {"id": "n-7", "label": "β = 5，n = 7", "src": "assets/尺度双峰_边界与参数补偿_n7.png", "alt": "β=5、n=7，LSE与LRE的位置尺度配对及位置准则廓线"}], "markdown": "#### β = 5，n = 50\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n50.png)\n\n#### β = 5，n = 7\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n7.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "boundary-caption", "kind": "text", "markdown": "*图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。*", "html": "\u003cp\u003e\u003cem\u003e图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。\u003c/em\u003e\u003c/p\u003e", "hash": "edceb5fee3de3d22242ad7b3fd546d21efec9c3c848d7331cf933dbd32aa0a1f"}, {"id": "boundary-verification", "kind": "text", "markdown": "在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。", "html": "\u003cp\u003e在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。\u003c/p\u003e", "hash": "6f43ffe6994120aaba14388bd7507fc803b9a7c8e8989c5ae8b7489f081bfe44"}, {"id": "compensated-life", "kind": "text", "markdown": "上排的估计点主要沿η+γ近似不变的方向分布。γ取零的一组对应较大的η，γ偏大的一组对应较小的η，两类解保持了相近的寿命水平。η+γ恰好是63.2%失效分位寿命；在图示β=5、n=50和7条件下，该组合量的误差小于两个参数各自的误差。这也解释了参数估计分化与部分寿命指标相对稳定可以同时出现。", "html": "\u003cp\u003e上排的估计点主要沿η+γ近似不变的方向分布。γ取零的一组对应较大的η，γ偏大的一组对应较小的η，两类解保持了相近的寿命水平。η+γ恰好是63.2%失效分位寿命；在图示β=5、n=50和7条件下，该组合量的误差小于两个参数各自的误差。这也解释了参数估计分化与部分寿命指标相对稳定可以同时出现。\u003c/p\u003e", "hash": "0952ca373d6810259c859db7b429302df413d2ae14d8eed88b16d5420df7a57b"}, {"id": "report-ba11b2ee5b91", "kind": "text", "html": "\u003ch3\u003e5.3　最小值定位引入的位置偏差\u003c/h3\u003e", "markdown": "### 5.3　最小值定位引入的位置偏差", "hash": "901ac205eb78e8fae4c0c7bf61bcbf846812e70c17f6919018008209d2584821"}, {"id": "kr-minimum-theory", "kind": "text", "markdown": "K–R直接以样本最小值估计位置参数。样本最小值通常高于真实起点；在本轮β范围内，n减小或β增大，二者的期望距离增大，位置正偏差随之加重。本轮40个条件中，K–R的位置估计均等于样本最小值，经验偏差与最小值分布给出的理论趋势一致。", "html": "\u003cp\u003eK–R直接以样本最小值估计位置参数。样本最小值通常高于真实起点；在本轮β范围内，n减小或β增大，二者的期望距离增大，位置正偏差随之加重。本轮40个条件中，K–R的位置估计均等于样本最小值，经验偏差与最小值分布给出的理论趋势一致。\u003c/p\u003e", "hash": "357b3f3c4587192df34f942b06c91b6295f30b11cdae1aeb29c05f06eeabad45"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "markdown": "![Research00报告1图15：MMLE定位与形状尺度](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图15_MMLE定位与形状尺度.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-6329b563b1c4", "kind": "text", "html": "\u003cp\u003eK–R以样本最小值估计位置参数，再根据剩余距离估计形状和尺度。图中的高β案例呈现位置偏高、形状和尺度偏低的组合，反映出定位偏差对后续估计的影响。\u003c/p\u003e\n\u003cp\u003e形状似然函数存在明确峰值，但峰值偏离真值，说明系统偏差也可能出现在正常完成求解的结果中。\u003c/p\u003e", "markdown": "K–R以样本最小值估计位置参数，再根据剩余距离估计形状和尺度。图中的高β案例呈现位置偏高、形状和尺度偏低的组合，反映出定位偏差对后续估计的影响。\n\n形状似然函数存在明确峰值，但峰值偏离真值，说明系统偏差也可能出现在正常完成求解的结果中。", "hash": "ecb27e084386c8ab0cb106d1c0b94c7e33815e4d1ad13859b4cf8b6c1c243798"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "markdown": "![Research00报告2图19：K–R正常与明显异常的参数估计过程](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_配对情形_MMLE_low.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e9a79a03f6bf", "kind": "text", "html": "\u003cp\u003e与上排样本相比，下排样本的最小值偏高，部分观测更集中。以最小值定位后，剩余距离的相对结构发生变化，对应的形状似然峰向较小β移动，尺度估计随之降低。该案例显示，样本结构与方法的定位规则共同影响后续估计。\u003c/p\u003e\n\u003cp\u003e分析异常时，需要区分方法构造、样本特征与数值求解设置的影响。\u003c/p\u003e", "markdown": "与上排样本相比，下排样本的最小值偏高，部分观测更集中。以最小值定位后，剩余距离的相对结构发生变化，对应的形状似然峰向较小β移动，尺度估计随之降低。该案例显示，样本结构与方法的定位规则共同影响后续估计。\n\n分析异常时，需要区分方法构造、样本特征与数值求解设置的影响。", "hash": "9be47aeea8fa4f313e80e2437297cb61034628725605b713f27717b125cf295e"}, {"id": "abnormal-case-conditions", "kind": "text", "markdown": "*图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。*", "html": "\u003cp\u003e\u003cem\u003e图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。\u003c/em\u003e\u003c/p\u003e", "hash": "626962204c3f223d1682fa1653f9b972c4dd62fd61a6ad7b2fec1991f1a26bf9"}, {"id": "report-20890ec101de", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e案例来源：\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A1%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E9%AB%98%E5%BD%A2%E7%8A%B6%E5%8F%82%E6%95%B0%E7%9A%84%E4%BC%B0%E8%AE%A1%E5%81%8F%E7%A7%BB.md\"\u003eResearch00报告1\u003c/a\u003e、\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A2%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E7%9A%84%E6%98%8E%E6%98%BE%E5%BC%82%E5%B8%B8%E4%BC%B0%E8%AE%A1.md\"\u003e报告2\u003c/a\u003e。图中实验条件与本轮比较分开。 原样本廓线核验与推导见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/%E5%88%86%E5%B8%83%E7%8E%B0%E8%B1%A1%E4%B8%8E%E5%BD%A2%E6%88%90%E6%9C%BA%E5%88%B6.md\"\u003e机理记录\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*案例来源：[Research00报告1](../../Research/00-方法对比/报告1：小样本情况下高形状参数的估计偏移.md)、[报告2](../../Research/00-方法对比/报告2：小样本情况下的明显异常估计.md)。图中实验条件与本轮比较分开。 原样本廓线核验与推导见[机理记录](结果呈现/比较探索/分布现象与形成机制.md)。*", "hash": "bd00947c11bf5b92e25b46135839ac3a04f2b5130eb4a51136ce660fb61c31b2"}]}], "content_hash": "c064f07c02feef705491660f208d1fa66a0f2919fd33bd33e7a68e52ea87fe8b"}, {"id": "figure-life", "title": "6　将差异转为条件性选择依据", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "35c2095fc79663771cb71101f5d147fbe6ea828f9477483c0488fbf24cd4ee94"}, {"id": "closing-slot", "title": "7　下一步：利用具体样本信息辅助选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前正文", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "293eeaaeee057c40ba6194a1d54b89b449e30c2fbb3d6ba59a22e4a30523ff0c"}], "stage": "chapter-layout-discussion", "review_complete": false, "last_applied_submission_id": "73a1780f-3bb9-46fb-b419-74e4609b6ed3", "require_confirmation": true, "archive_plan": "本轮仅确认章节编排，不直接重写讲稿：\n1. 将确认后的方案及需要补充的分析保存到 D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/结果呈现/比较探索/章节编排讨论.md。\n2. 当前正式报告下（方法对比）-v0.4.md及其正文镜像保持原样；后续重组依据进一步要求进行。v0.3及旧尝试保留原处。\n3. 保留同一任务目录内的HTML、board、23张现稿图片及已提交的批注和历史；未提交草稿及运行状态留在本地。\n4. 核验后用Git记录本轮编排讨论及审阅记录，不自动推送。", "planning_source": "../../结果呈现/比较探索/章节编排讨论.md", "planning_source_fingerprint": "bcd37b3bf0b15f00acfca863dc1f69cd4b92ff224d94cd5af7daf4e9b8822781"}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const diverge=el('button','diverge');diverge.type='button';diverge.dataset.diverge='true';diverge.setAttribute('aria-label','继续发散');diverge.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7L5 7m7 7 7-7M5 12V7h5m4 0h5v5"/></svg>';head.append(diverge);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)
 }
 section.append(grid);return section
}
function syncControls(unit,node){const state=draft.units[unit.id],button=node.querySelector('.diverge'),active=state.action==='extend';button.setAttribute('aria-pressed',String(active));button.title=active?'已标记继续发散，点击撤销':'继续发散';for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||'';for(const option of unit.options)for(const block of option.blocks)if(block.kind==='gallery'){const gallery=blockNode(unit.id,option.id,block.id)?.querySelector('.gallery');if(gallery)syncGallery(gallery,unit,option,block)}}
function render(nextBoard){

 if(!draft||newRound){if($('confirmation').open)$('confirmation').close();closeEditor(false);loadDraft()}

$('units').addEventListener('change',event=>{const unit=event.target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(event.target.type==='radio'){state.selected=event.target.value;for(const card of unit.querySelectorAll('.option'))card.classList.toggle('chosen',card.dataset.option===state.selected)}draft.submission_id=null;persist()});

$('units').addEventListener('input',event=>{const target=event.target,unit=target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(target.dataset.note)state.notes[target.dataset.note]=target.value;else if(target.dataset.galleryNote){state.image_notes=state.image_notes.filter(n=>!(n.option_id===target.dataset.optionId&&n.block_id===target.dataset.galleryNote&&n.image_id===target.dataset.imageId));if(target.value.trim())state.image_notes.push({option_id:target.dataset.optionId,block_id:target.dataset.galleryNote,image_id:target.dataset.imageId,comment:target.value});target.closest('details').querySelector('summary').textContent=target.value?'本图备注（已填写）':'本图备注'}else return;draft.submission_id=null;persist()});
let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}

let imageBlankPressed=false;

function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;const divergence=anchor.kind==='divergence';$('editor').setAttribute('aria-label',divergence?'发散启发':'添加批注');$('editor-quote').textContent=anchor.quote;$('editor-input').setAttribute('aria-label',divergence?'发散启发':'批注意见');$('editor-input').placeholder=divergence?'补充探索方向、例子或启发（可留空）':'批注';$('save-note').textContent=divergence?'发散':'保存';$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;

 openEditor({id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())

document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);

function decisions(){return board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,image_notes:d.image_notes||[]}})}

function composePreview(intent){

  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_id||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length;if(!hasChange)continue;

function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if(pending.kind==='divergence'||$('editor-input').value.trim())saveNote();else closeEditor()}

}

$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){

 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();

$('submit').onclick=()=>preview('submit');

async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
