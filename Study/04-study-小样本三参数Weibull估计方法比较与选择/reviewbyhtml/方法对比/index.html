3e方法间差距在形状参数上更突出。n较小时，低至中等β区域的形状RMSE相对差距较大；高β区域的尺度和位置相对差距总体随n减小而缩小。差距的变化同时受n、β和目标参数影响。\u003c/p\u003e\n\u003cp\u003e这里反映的是相对差距，其缩小不等于各方法的绝对误差减小。\u003c/p\u003e", "hash": "d719c9251818a4d642ce1e6f127aa7d22c75be2d4e2d1b3e7de1c27dcc5f12bd"}, {"id": "report-7dd6a876cc3f", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。*", "hash": "f4f1559a8ee0cead835ba0fd00467e4917e8caf8ba1340ba1ba5be63efb0ac32"}]}], "content_hash": "3bb19feac11e2978e6545fe7372657ce10701e67facba379338b9b3d7365bc1e"}, {"id": "figure-change", "title": "3　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003en=50时，主图六种方法的形状误差差距相对有限；n较小时，低β区域的差距明显增大。LSE、LRE和MLE的形状RMSE增幅大于MDM、WMLE，反映出不同方法对样本量变化的敏感性不同。\u003c/p\u003e\n\u003cp\u003e方法排序也会改变。β=1.5时，形状RMSE最低的方法由n=50时的K–R变为n=7时的WMLE。即使β相同，样本量变化也会影响方法的相对表现。\u003c/p\u003e\n\u003cp\u003eMM在部分条件下的形状RMSE明显高于其余方法，需要结合估计分布检查极端值的影响。\u003c/p\u003e", "markdown": "n=50时，主图六种方法的形状误差差距相对有限；n较小时，低β区域的差距明显增大。LSE、LRE和MLE的形状RMSE增幅大于MDM、WMLE，反映出不同方法对样本量变化的敏感性不同。\n\n方法排序也会改变。β=1.5时，形状RMSE最低的方法由n=50时的K–R变为n=7时的WMLE。即使β相同，样本量变化也会影响方法的相对表现。\n\nMM在部分条件下的形状RMSE明显高于其余方法，需要结合估计分布检查极端值的影响。", "hash": "a918be444f6ca72f6b81068dce984e551f859ef4def8c94bb898acb82467aba3"}]}], "content_hash": "39da073c29883d4fd77e73f9e7d9b9a81fc02186498d462be811799f7a75dd40"}, {"id": "figure-error", "title": "4　误差差距表现成什么样", "mode": "content", "state": "modify", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-0b978bfbf3c5", "kind": "text", "html": "\u003ch3\u003e4.1　随β变化的分布分化与参数偏移\u003c/h3\u003e", "markdown": "### 4.1　随β变化的分布分化与参数偏移", "hash": "d382f8cdf432e519170f9447b7c77b3ec7ba5cc89a48491770d00641d7accfa7"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5" 427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003e随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。β改变的不只是误差幅度，还包括估计结果的分布形态。\u003c/p\u003e\n\u003cp\u003e与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。位置与尺度呈现出相反方向的变化。\u003c/p\u003e\n\u003cp\u003e对LSE和LRE逐次结果配对核对发现，高尺度估计的一组包含大量位置估计落在零边界的结果；较低尺度估计的一组对应偏大的位置估计。尺度分布的双峰与位置参数的边界响应有关。\u003c/p\u003e\n\u003cp\u003eβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。两组结果的正负误差在平均时相互抵消，均值因而没有反映出分布的分化。\u003c/p\u003e", "markdown": "随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。β改变的不只是误差幅度，还包括估计结果的分布形态。\n\n与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。位置与尺度呈现出相反方向的变化。\n\n对LSE和LRE逐次结果配对核对发现，高尺度估计的一组包含大量位置估计落在零边界的结果；较低尺度估计的一组对应偏大的位置估计。尺度分布的双峰与位置参数的边界响应有关。\n\nβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。两组结果的正负误差在平均时相互抵消，均值因而没有反映出分布的分化。", "hash": "14386cd6cac44ce2eb09983028c2ce9ef8f3938ee07e9ec4667b7be358bf883d"}]}], "content_hash": "4be2f092f0687a3c47af94a9fbc42a70ce0e9e1c69050d147a9b3d422edeacfc"}, {"id": "figure-tail", "title": "4.2　明显异常与求解失败", "mode": "content", "state": "open", "selected": "B", "options": [{"id": "B", "label": "当前正文", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e少数极端结果可能明显抬高RMSE，求解失败则不进入有效结果的误差统计。因此，异常风险和有效率需要单独评价。\u003c/p\u003e", "markdown": "少数极端结果可能明显抬高RMSE，求解失败则不进入有效结果的误差统计。因此，异常风险和有效率需要单独评价。", "hash": "9989ac437aa44303e88e626928cd2497c73aae17844d4c4887b5c762ec2577f7"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-insight", "kind": "text", "markdown": "MDM、LSE、LRE和WMLE在小n、高β条件下的形状异常率较高；MLE在低β、小n条件下也出现较高异常率。不同方法的异常风险区域并不相同。", "html": "\u003cp\u003eMDM、LSE、LRE和WMLE在小n、高β条件下的形状异常率较高；MLE在低β、小n条件下也出现较高异常率。不同方法的异常风险区域并不相同。\u003c/p\u003e", "hash": "654059997591cd10d0563dfe4fdfa80604f97e384e9a2aa408406c51f40081ee"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显。成功结果的精度与有效率应分别评价。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显。成功结果的精度与有效率应分别评价。\u003c/p\u003e", "hash": "57f22f96fa04dff23b6c0d75bf2355c1ed8d6be05ae44226a302ed00000c9393"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。*", "hash": "4a575a1f296bb18010f5b66810f9e25ffe1e2154df18b3c34a7ed1d43ee1c84f"}]}], "content_hash": "7c702102034c3486b1b7e88ddfd0affa8e6baf32448a74f2c1b1f5950d883ee3"}, {"id": "figure-mechanism", "title": "5　偏移与异常怎样形成", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-7f1bc5162ac0", "kind": "text", "html": "\u003ch3\u003e5.1　共同背景：起点信息有限与参数补偿\u003c/h3\u003e", "markdown": "### 5.1　共同背景：起点信息有限与参数补偿", "hash": "60e1e11bba5b06b138994b872cad62d80cf4236b3287d2855f865bfd2c64c14b"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-bb6029e56ce6", "kind": "text", "html": "\u003cp\u003e高β、小n时，样本最小值与真实位置参数之间通常存在较大距离，位置参数缺少接近起点的观测约束。\u003c/p\u003e", "markdown": "高β、小n时，样本最小值与真实位置参数之间通常存在较大距离，位置参数缺少接近起点的观测约束。", "hash": "583294775cafc8818226be6f7fdede5e279edc5176db69b79711102ab0e5e89d"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "markdown": "![Research00报告1图3：不同参数组合在观测区间内相近](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与分布相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e3ab0dd3b754", "kind": "text", "html": "\u003cp\u003e两组参数差异较大，但分布函数在样本覆盖的区间内接近，表明不同参数组合可以在局部区间产生相近分布。样本区间内的拟合程度，不能单独说明三项参数的估计精度。\u003c/p\u003e", "markdown": "两组参数差异较大，但分布函数在样本覆盖的区间内接近，表明不同参数组合可以在局部区间产生相近分布。样本区间内的拟合程度，不能单独说明三项参数的估计精度。", "hash": "0f08730d6f236e4ade7287c9e799904f6f81016e58085ce6410ba68382a891c3"}, {"id": "report-ba11b2ee5b91", "kind": "text", "html": "\u003ch3\u003e5.2　沿K–R的定位、形状确定与尺度恢复追踪\u003c/h3\u003e", "markdown": "### 5.2　沿K–R的定位、形状确定与尺度恢复追踪", "hash": "91e49065ad23f22c9164e6ec36889ba6a282b01d21192ec517313a37161e76d1"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "markdown": "![Research00报告1图15：MMLE定位与形状尺度](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图15_MMLE定位与形状尺度.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-6329b563b1c4", "kind": "text", "html": "\u003cp\u003eK–R以样本最小值估计位置参数，再根据剩余距离估计形状和尺度。图中的高β案例呈现位置偏高、形状和尺度偏低的组合，反映出定位偏差对后续估计的影响。\u003c/p\u003e\n\u003cp\u003e形状似然函数存在明确峰值，但峰值偏离真值，说明系统偏差也可能出现在正常完成求解的结果中。\u003c/p\u003e", "markdown": "K–R以样本最小值估计位置参数，再根据剩余距离估计形状和尺度。图中的高β案例呈现位置偏高、形状和尺度偏低的组合，反映出定位偏差对后续估计的影响。\n\n形状似然函数存在明确峰值，但峰值偏离真值，说明系统偏差也可能出现在正常完成求解的结果中。", "hash": "ecb27e084386c8ab0cb106d1c0b94c7e33815e4d1ad13859b4cf8b6c1c243798"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "markdown": "![Research00报告2图19：K–R正常与明显异常的参数估计过程](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_配对情形_MMLE_low.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e9a79a03f6bf", "kind": "text", "html": "\u003cp\u003e与上排样本相比，下排样本的最小值偏高，部分观测更集中。以最小值定位后，剩余距离的相对结构发生变化，对应的形状似然峰向较小β移动，尺度估计随之降低。该案例显示，样本结构与方法的定位规则共同影响后续估计。\u003c/p\u003e\n\u003cp\u003e分析异常时，需要区分方法构造、样本特征与数值求解设置的影响。\u003c/p\u003e", "markdown": "与上排样本相比，下排样本的最小值偏高，部分观测更集中。以最小值定位后，剩余距离的相对结构发生变化，对应的形状似然峰向较小β移动，尺度估计随之降低。该案例显示，样本结构与方法的定位规则共同影响后续估计。\n\n分析异常时，需要区分方法构造、样本特征与数值求解设置的影响。", "hash": "9be47aeea8fa4f313e80e2437297cb61034628725605b713f27717b125cf295e"}, {"id": "abnormal-case-conditions", "kind": "text", "markdown": "*图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。*", "html": "\u003cp\u003e\u003cem\u003e图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。\u003c/em\u003e\u003c/p\u003e", "hash": "626962204c3f223d1682fa1653f9b972c4dd62fd61a6ad7b2fec1991f1a26bf9"}, {"id": "report-20890ec101de", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e案例来源：\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A1%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E9%AB%98%E5%BD%A2%E7%8A%B6%E5%8F%82%E6%95%B0%E7%9A%84%E4%BC%B0%E8%AE%A1%E5%81%8F%E7%A7%BB.md\"\u003eResearch00报告1\u003c/a\u003e、\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A2%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E7%9A%84%E6%98%8E%E6%98%BE%E5%BC%82%E5%B8%B8%E4%BC%B0%E8%AE%A1.md\"\u003e报告2\u003c/a\u003e。图中实验条件与本轮比较分开。\u003c/em\u003e\u003c/p\u003e", "markdown": "*案例来源：[Research00报告1](../../Research/00-方法对比/报告1：小样本情况下高形状参数的估计偏移.md)、[报告2](../../Research/00-方法对比/报告2：小样本情况下的明显异常估计.md)。图中实验条件与本轮比较分开。*", "hash": "606991a18d05ff112dd2383356b045fd5702b3ff112e6d7731617cdb851f9106"}]}], "content_hash": "d9e5170ce8d532af1ed8950854db14f43ab681fa508579015704f2b58e55efbe"}, {"id": "figure-life", "title": "6　将差异转为条件性选择依据", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "35c2095fc79663771cb71101f5d147fbe6ea828f9477483c0488fbf24cd4ee94"}, {"id": "closing-slot", "title": "7　下一步：利用具体样本信息辅助选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前正文", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "293eeaaeee057c40ba6194a1d54b89b449e30c2fbb3d6ba59a22e4a30523ff0c"}], "stage": "report-revision", "review_complete": false, "last_applied_submission_id": "73a1780f-3bb9-46fb-b419-74e4609b6ed3", "require_confirmation": true, "archive_plan": "将本轮确认的修改写回当前正式报告：\n1. 更新 D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v0.4.md，沿用v0.4；此前内容通过Git保留。\n2. 已归档的v0.3及“其他/历史尝试”中的旧稿保留原处。\n3. 同步必要的README和引用，保留当前任务HTML、图片、批注及历史记录；审阅镜像不替代正式报告。\n4. 核验正文、图片与链接后提交本轮相关Git修改；草稿、会话和日志继续留在本地。"}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);

async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
