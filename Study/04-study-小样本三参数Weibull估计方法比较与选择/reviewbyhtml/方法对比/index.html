数，共用同一色标。七种方法中至少四种的RMSE达到该格中位水平。\u003c/p\u003e", "markdown": "每格为七法RMSE中位数相对该条件最小值多出的百分比。三列对应形状、尺度和位置参数，共用同一色标。七种方法中至少四种的RMSE达到该格中位水平。", "hash": "d87a87dde915add00c7c944eeac98f622d26c6395fb62520f7e85bb54c52c063"}]}], "content_hash": "0177a4b008f9e5894fa115cc97b0726861c6b7e5a4374f57aa3705e107e5f2da"}, {"id": "figure-change", "title": "3　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e各图共用0～1.5的线性半径，半径长度表示标准化RMSE。MM的数值单列于各β图下方。\u003c/p\u003e", "markdown": "各图共用0～1.5的线性半径，半径长度表示标准化RMSE。MM的数值单列于各β图下方。", "hash": "5db1b5a115bebc88ae2da8c4549ecf5b8210104f8921364a6eeec17550495952"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003eβ=1.5时，除MM外的六种方法，形状标准化RMSE在n=50下为0.118～0.179，到n=7为0.500～1.293；β=5时，相应区间由0.266～0.457变为0.485～0.792。同样从50个样本减少到7个样本，β=1.5时的方法差距扩大得更明显。样本量减少对不同方法的影响不同，这种差异还与β有关。\u003c/p\u003e", "markdown": "β=1.5时，除MM外的六种方法，形状标准化RMSE在n=50下为0.118～0.179，到n=7为0.500～1.293；β=5时，相应区间由0.266～0.457变为0.485～0.792。同样从50个样本减少到7个样本，β=1.5时的方法差距扩大得更明显。样本量减少对不同方法的影响不同，这种差异还与β有关。", "hash": "04f79cf160b1b7f0dd1c712f423d770789b7bb3bc28ece28e2ceb55362d4984f"}]}], "content_hash": "bc7415fcc22d23dd003162426f5f399b8826d3cd3f40df50776d4fa77d9194a6"}, {"id": "figure-error", "title": "4　误差差距表现成什么样", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-0b978bfbf3c5", "kind": "text", "html": "\u003ch3\u003e4.1　分开看系统偏移与重复波动\u003c/h3\u003e", "markdown": "### 4.1　分开看系统偏移与重复波动", "hash": "f573e5721e78348c30a540fc94ff7faa1349850392572b48140ae6b5a3b57c96"}, {"id": "report-e2010d609aec", "kind": "text", "html": "\u003cp\u003eRMSE同时包含系统偏移和重复抽样波动。有的方法估计值集中，却整体偏离真值；有的方法中心位置较接近真值，但波动更大。只看RMSE，还不能区分这两种情形。\u003c/p\u003e", "markdown": "RMSE同时包含系统偏移和重复抽样波动。有的方法估计值集中，却整体偏离真值；有的方法中心位置较接近真值，但波动更大。只看RMSE，还不能区分这两种情形。", "hash": "21336162688f36f0a1ffc558b4fb591ff49dadd60edf77b16560d9386953647c"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e图中行对应n=50、7，列对应形状、尺度和位置参数。虚线是真值，红点为均值，深色横线为25%～75%区间。三列显示范围分别固定为0～10、0～2000、0～1500。\u003c/p\u003e", "markdown": "图中行对应n=50、7，列对应形状、尺度和位置参数。虚线是真值，红点为均值，深色横线为25%～75%区间。三列显示范围分别固定为0～10、0～2000、0～1500。", "hash": "270cd60598c71cddf327d286ec96e4b7d393db265e4bd74071aab4bdf3ab44c2"}, {"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=5时，部分方法的估计主体在形状、尺度上偏低，在位置上偏高；有些方法的形状估计则更分散。分布集中不等于估计准确，偏移和波动需要分别判断。\u003c/p\u003e\n\u003cp\u003e密度图显示窗口内的主体分布；均值和四分位区间使用全部有效结果。\u003c/p\u003e", "markdown": "β=5时，部分方法的估计主体在形状、尺度上偏低，在位置上偏高；有些方法的形状估计则更分散。分布集中不等于估计准确，偏移和波动需要分别判断。\n\n密度图显示窗口内的主体分布；均值和四分位区间使用全部有效结果。", "hash": "3b34225205f3c72f054d1365c94a8f8ee3f6dcb9db6fe228950f09d06671fe63"}]}], "content_hash": "b70bf6d8ff5da339a7ef3b0378df402f9c44106337a66280c492faf94a838c9f"}, {"id": "figure-tail", "title": "4.2　明显异常与求解失败", "mode": "content", "state": "open", "selected": "B", "options": [{"id": "B", "label": "当前正文", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e少数极端输出可能明显抬高RMSE；求解失败则没有可用的估计值。因此，明显异常和有效返回比例也需要单独统计。\u003c/p\u003e", "markdown": "少数极端输出可能明显抬高RMSE；求解失败则没有可用的估计值。因此，明显异常和有效返回比例也需要单独统计。", "hash": "59f2704e24c1f880f80416806c48ef64189296692d618bbadae8502da78cedd6"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e形状明显异常定义为β̂≤β/3或β̂≥3β，异常率以有效结果数为分母；有效率以每条件1200次尝试为分母。\u003c/p\u003e", "markdown": "形状明显异常定义为β̂≤β/3或β̂≥3β，异常率以有效结果数为分母；有效率以每条件1200次尝试为分母。", "hash": "94f7543046b39d454934cc64fa791853502f7edaada71b9d2ea8e12a318aaeac"}, {"id": "report-a438b7a83e00", "kind": "text", "html": "\u003cp\u003e异常率反映发生频率，RMSE反映综合误差。少量极端结果也可能产生很大的误差，因此，异常频率和误差大小需要结合判断。\u003c/p\u003e", "markdown": "异常率反映发生频率，RMSE反映综合误差。少量极端结果也可能产生很大的误差，因此，异常频率和误差大小需要结合判断。", "hash": "377851c3368ccdba64786edf6ad69299123c58c3723bd800da15563bfb40d5d1"}]}], "content_hash": "8edb1a359bd59776f7911842f50fdf856d75fecf3441a5ab1549f8c30c65640d"}, {"id": "figure-mechanism", "title": "5　偏移与异常怎样形成", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-7f1bc5162ac0", "kind": "text", "html": "\u003ch3\u003e5.1　共同背景：起点信息有限与参数补偿\u003c/h3\u003e", "markdown": "### 5.1　共同背景：起点信息有限与参数补偿", "hash": "60e1e11bba5b06b138994b872cad62d80cf4236b3287d2855f865bfd2c64c14b"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-bb6029e56ce6", "kind": "text", "html": "\u003cp\u003e图中比较β=2与5、n=7、15、30的样本，每格50组，下排为样本最小值的理论密度。高β、样本较少时，最小观测往往仍离真实起点较远，位置参数缺少直接约束。\u003c/p\u003e", "markdown": "图中比较β=2与5、n=7、15、30的样本，每格50组，下排为样本最小值的理论密度。高β、样本较少时，最小观测往往仍离真实起点较远，位置参数缺少直接约束。", "hash": "ba93fc3133634f14f665f394a51db9764fd771c9055964e2d72e6f254bdbd456"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "markdown": "![Research00报告1图3：不同参数组合在观测区间内相近](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与分布相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e3ab0dd3b754", "kind": "text", "html": "\u003cp\u003eW(5,1000,500)与W(2,500,1000)的参数相差明显，在这组观测覆盖的中部区间却有相近曲线。这说明，有限样本覆盖的区间内，不同的参数组合也可能与观测相容。黑点来自β=5、n=7的一组样本。\u003c/p\u003e", "markdown": "W(5,1000,500)与W(2,500,1000)的参数相差明显，在这组观测覆盖的中部区间却有相近曲线。这说明，有限样本覆盖的区间内，不同的参数组合也可能与观测相容。黑点来自β=5、n=7的一组样本。", "hash": "91d81799556974f6e7ccca77d26f0423369f81b04342f542741cbe4c6ec2feef"}, {"id": "report-ba11b2ee5b91", "kind": "text", "html": "\u003ch3\u003e5.2　沿K–R的定位、形状确定与尺度恢复追踪\u003c/h3\u003e", "markdown": "### 5.2　沿K–R的定位、形状确定与尺度恢复追踪", "hash": "91e49065ad23f22c9164e6ec36889ba6a282b01d21192ec517313a37161e76d1"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "markdown": "![Research00报告1图15：MMLE定位与形状尺度](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图15_MMLE定位与形状尺度.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-6329b563b1c4", "kind": "text", "html": "\u003cp\u003eK–R由样本最小值定位，再拟合保留距离。图中50组历史样本的高β情形，整体呈现位置偏高、形状与尺度偏低的规律。位置改变了后续拟合所用的距离，影响随之传递到其他参数。\u003c/p\u003e", "markdown": "K–R由样本最小值定位，再拟合保留距离。图中50组历史样本的高β情形，整体呈现位置偏高、形状与尺度偏低的规律。位置改变了后续拟合所用的距离，影响随之传递到其他参数。", "hash": "ad191524bf21d8d9910906bc85b9f731886bea7d4929d75a9d4d6c5a735221ce"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "markdown": "![Research00报告2图19：K–R正常与明显异常的参数估计过程](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_配对情形_MMLE_low.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e9a79a03f6bf", "kind": "text", "html": "\u003cp\u003e这一例的真实分布为W(5,100,500)，n=7，上排为正常第10组，下排为异常第11组。异常样本先以575.95定位，保留距离更分散，形状峰落在1.54，低于明显异常阈值5/3；尺度随之得到28.69。位置选择的影响沿后续求解传递，使三项估计共同偏离真值。\u003c/p\u003e", "markdown": "这一例的真实分布为W(5,100,500)，n=7，上排为正常第10组，下排为异常第11组。异常样本先以575.95定位，保留距离更分散，形状峰落在1.54，低于明显异常阈值5/3；尺度随之得到28.69。位置选择的影响沿后续求解传递，使三项估计共同偏离真值。", "hash": "e54105ab4e1415f20dbfbe9e2abdf899cdd9ccd3696102e719627fee3e42eb1b"}, {"id": "report-20890ec101de", "kind": "text", "html": "\u003cp\u003e案例来源：\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A1%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E9%AB%98%E5%BD%A2%E7%8A%B6%E5%8F%82%E6%95%B0%E7%9A%84%E4%BC%B0%E8%AE%A1%E5%81%8F%E7%A7%BB.md\"\u003eResearch00报告1\u003c/a\u003e、\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A2%EF%BC%9A%E5%B0%8F <script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}

 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
