c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "0192673c691dc0684f4db0b7b5077d14076f9caf45726f40a424cc5db6631327"}, {"id": "figure-global", "title": "2　方法之间究竟相差多少", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_整体差距百分比.png", "alt": "主体差距：直接读多出百分之多少", "markdown": "![主体差距：直接读多出百分之多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_整体差距百分比.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "global-insight", "kind": "text", "markdown": "形状参数这一列的差距最醒目。随着样本量减小，较低到中等β的区域明显加深；尺度和位置没有出现同样的变化，高β区域的相对差距反而有所缩小。方法之间的差异，既取决于样本量和β，也取决于我们关心哪个参数。\n\n这里比较的是方法之间的相对距离。几种方法的误差可以一起增大，而彼此的相对差距反而缩小。", "html": "\u003cp\u003e形状参数这一列的差距最醒目。随着样本量减小，较低到中等β的区域明显加深；尺度和位置没有出现同样的变化，高β区域的相对差距反而有所缩小。方法之间的差异，既取决于样本量和β，也取决于我们关心哪个参数。\u003c/p\u003e\n\u003cp\u003e这里比较的是方法之间的相对距离。几种方法的误差可以一起增大，而彼此的相对差距反而缩小。\u003c/p\u003e", "hash": "1b7450c407e64e0da2e1c2cc0116a02671b1f4f9db496246fd75dad768a1284b"}, {"id": "report-7dd6a876cc3f", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。*", "hash": "f4f1559a8ee0cead835ba0fd00467e4917e8caf8ba1340ba1ba5be63efb0ac32"}]}], "content_hash": "2804126f5dbfb95fa0e572e8372fccf5cff62edb0fa0dac572f82e6c539eba79"}, {"id": "figure-change", "title": "3　差距怎样随n和β一起改变", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003en=50时，主图中六种方法已有差异，但轮廓整体还比较收拢。样本逐渐减少后，形状参数的扇区以不同幅度向外伸展，方法之间开始明显分开。尤其在较低β的几幅图里，LSE、LRE和MLE的形状误差增长更突出，MDM和WMLE相对缓一些。小样本下的方法差距，来自它们对样本减少的不同反应。\u003c/p\u003e\n\u003cp\u003e优劣顺序也会改变。例如β=1.5时，K–R在n=50的形状估计中表现较好，到了n=7，WMLE的误差更小。同一个β，只改变样本量，也会改变方法之间的关系。\u003c/p\u003e\n\u003cp\u003e换到较高β，尺度和位置的轮廓又更接近一些。样本减少带来的精度损失，与方法之间的差距变化，是两个需要分开看的问题。\u003c/p\u003e\n\u003cp\u003eMM在部分条件下的形状RMSE远高于其余方法，也需要单独检查极端输出的影响。\u003c/p\u003e", "markdown": "n=50时，主图中六种方法已有差异，但轮廓整体还比较收拢。样本逐渐减少后，形状参数的扇区以不同幅度向外伸展，方法之间开始明显分开。尤其在较低β的几幅图里，LSE、LRE和MLE的形状误差增长更突出，MDM和WMLE相对缓一些。小样本下的方法差距，来自它们对样本减少的不同反应。\n\n优劣顺序也会改变。例如β=1.5时，K–R在n=50的形状估计中表现较好，到了n=7，WMLE的误差更小。同一个β，只改变样本量，也会改变方法之间的关系。\n\n换到较高β，尺度和位置的轮廓又更接近一些。样本减少带来的精度损失，与方法之间的差距变化，是两个需要分开看的问题。\n\nMM在部分条件下的形状RMSE远高于其余方法，也需要单独检查极端输出的影响。", "hash": "78b58c4161a56e176003a9cb36861c52cf23a84578cb91c7e52d80a3319eb57e"}]}], "content_hash": "03e0aa39b617dd4eec053b37ae83d62a2988e5d07607cd70b811c8a4b94b24ab"}, {"id": "figure-error", "title": "4　误差差距表现成什么样", "mode": "content", "state": "open", "selected": "C", "options": [{"id": "C", "label": "当前正文", "blocks": [{"id": "report-0b978bfbf3c5", "kind": "text", "html": "\u003ch3\u003e4.1　分开看系统偏移与重复波动\u003c/h3\u003e", "markdown": "### 4.1　分开看系统偏移与重复波动", "hash": "f573e5721e78348c30a540fc94ff7faa1349850392572b48140ae6b5a3b57c96"}, {"id": "report-e2010d609aec", "kind": "text", "html": "\u003cp\u003eRMSE同时包含系统偏移和重复抽样波动。有的方法估计值集中，却整体偏离真值；有的方法中心位置较接近真值，但波动更大。只看RMSE，还不能区分这两种情形。\u003c/p\u003e", "markdown": "RMSE同时包含系统偏移和重复抽样波动。有的方法估计值集中，却整体偏离真值；有的方法中心位置较接近真值，但波动更大。只看RMSE，还不能区分这两种情形。", "hash": "21336162688f36f0a1ffc558b4fb591ff49dadd60edf77b16560d9386953647c"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=5这张图里，K–R的尺度和位置估计很集中，但整个分布明显偏离真值；LSE、LRE的分布更宽，中心却更靠近真值。前一种主要表现为系统偏移，后一种有更大的重复抽样波动。结果集中，和结果准确，是两回事。\u003c/p\u003e\n\u003cp\u003e从上排到下排，MDM、WMLE的形状和尺度主体进一步向真值左侧移动，位置向右侧移动；LSE、LRE的分布则更分散。小样本造成的误差增大，可以通过不同方式表现出来，单看一个RMSE无法说明这些区别。\u003c/p\u003e", "markdown": "β=5这张图里，K–R的尺度和位置估计很集中，但整个分布明显偏离真值；LSE、LRE的分布更宽，中心却更靠近真值。前一种主要表现为系统偏移，后一种有更大的重复抽样波动。结果集中，和结果准确，是两回事。\n\n从上排到下排，MDM、WMLE的形状和尺度主体进一步向真值左侧移动，位置向右侧移动；LSE、LRE的分布则更分散。小样本造成的误差增大，可以通过不同方式表现出来，单看一个RMSE无法说明这些区别。", "hash": "6ef145e96ac638fc69cc68c9bbcdc73137d29173f85daa860f6a14ada3e1abe8"}]}], "content_hash": "65abf1c82657ca9bdbc48aa922e2d57fd2363b26b2824d48be20692b6955660f"}, {"id": "figure-tail", "title": "4.2　明显异常与求解失败", "mode": "content", "state": "open", "selected": "B", "options": [{"id": "B", "label": "当前正文", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e少数极端输出可能明显抬高RMSE；求解失败则没有可用的估计值。这两种情况都会影响实际使用，但在前面的误差图里表现不完整。\u003c/p\u003e", "markdown": "少数极端输出可能明显抬高RMSE；求解失败则没有可用的估计值。这两种情况都会影响实际使用，但在前面的误差图里表现不完整。", "hash": "05a2676ae73ab473fe3d733ad723b61619fda72aacf5054709435a04e71787a1"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-insight", "kind": "text", "markdown": "MDM、LSE、LRE和WMLE的异常颜色，主要在样本量较小、β较高的区域加深。异常在这些条件下反复出现，已经成为方法表现的一部分。MLE的风险分布又有所不同，说明异常也有各自的条件特点。", "html": "\u003cp\u003eMDM、LSE、LRE和WMLE的异常颜色，主要在样本量较小、β较高的区域加深。异常在这些条件下反复出现，已经成为方法表现的一部分。MLE的风险分布又有所不同，说明异常也有各自的条件特点。\u003c/p\u003e", "hash": "4940962bb882eab0ff7064d2217baa335065580c83a8199cef525f991825ce86"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "有效返回图呈现的是另一种差别。MDM、LSE、LRE和K–R在本轮全部样本中都能返回有效估计；MLE的有效返回比例随样本量减少明显下降，低β时尤为突出。只比较成功后的误差，会漏掉这种使用代价。\n\n因此，评价一个方法需要同时看三件事：通常估得怎样、会不会出现明显偏离，以及能否返回有效结果。三者各有含义，不能用一个误差排名全部代替。", "html": "\u003cp\u003e有效返回图呈现的是另一种差别。MDM、LSE、LRE和K–R在本轮全部样本中都能返回有效估计；MLE的有效返回比例随样本量减少明显下降，低β时尤为突出。只比较成功后的误差，会漏掉这种使用代价。\u003c/p\u003e\n\u003cp\u003e因此，评价一个方法需要同时看三件事：通常估得怎样、会不会出现明显偏离，以及能否返回有效结果。三者各有含义，不能用一个误差排名全部代替。\u003c/p\u003e", "hash": "9281e9cf3dc1d2001d5d4da84d8359e5191db6ae98eed29cdcce933696670597"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。*", "hash": "4a575a1f296bb18010f5b66810f9e25ffe1e2154df18b3c34a7ed1d43ee1c84f"}]}], "content_hash": "31228582630b3cd29a571f27d9baee2da0ca1de6710b9ec56763d6f7d85b9658"}, {"id": "figure-mechanism", "title": "5　偏移与异常怎样形成", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-7f1bc5162ac0", "kind": "text", "html": "\u003ch3\u003e5.1　共同背景：起点信息有限与参数补偿\u003c/h3\u003e", "markdown": "### 5.1　共同背景：起点信息有限与参数补偿", "hash": "60e1e11bba5b06b138994b872cad62d80cf4236b3287d2855f865bfd2c64c14b"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-bb6029e56ce6", "kind": "text", "html": "\u003cp\u003e真实起点在左边，最小观测却可能已经离它很远。这段空白在高β、样本较少时更明显。样本没有覆盖到寿命分布的起始部分，位置参数因此缺少直接的信息约束。\u003c/p\u003e", "markdown": "真实起点在左边，最小观测却可能已经离它很远。这段空白在高β、样本较少时更明显。样本没有覆盖到寿命分布的起始部分，位置参数因此缺少直接的信息约束。", "hash": "0f2bb2c6b79fafec138a51462b61cf50e1a15228f04a3832c248644b002c49fe"}, {"id": "background-compensation", "kind": "image", "src": "assets/R00_图2_样本与分布相容.png", "alt": "Research00报告1图3：不同参数组合在观测区间内相近", "markdown": "![Research00报告1图3：不同参数组合在观测区间内相近](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与分布相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e3ab0dd3b754", "kind": "text", "html": "\u003cp\u003e这两条曲线在样本点附近很接近，背后的三项参数却相差很大。这说明，小样本覆盖的局部区间可以容纳不同的参数组合。几个参数之间能够相互补偿，因而样本点附近拟合得接近，也未必意味着每个参数都估得准确。\u003c/p\u003e", "markdown": "这两条曲线在样本点附近很接近，背后的三项参数却相差很大。这说明，小样本覆盖的局部区间可以容纳不同的参数组合。几个参数之间能够相互补偿，因而样本点附近拟合得接近，也未必意味着每个参数都估得准确。", "hash": "fa446cca68a3a6b516d9270e1ad295e48167330943212ce8f26222c3ed680aac"}, {"id": "report-ba11b2ee5b91", "kind": "text", "html": "\u003ch3\u003e5.2　沿K–R的定位、形状确定与尺度恢复追踪\u003c/h3\u003e", "markdown": "### 5.2　沿K–R的定位、形状确定与尺度恢复追踪", "hash": "91e49065ad23f22c9164e6ec36889ba6a282b01d21192ec517313a37161e76d1"}, {"id": "preview", "kind": "image", "src": "assets/R00_图15_MMLE定位与形状尺度.png", "alt": "Research00报告1图15：MMLE定位与形状尺度", "markdown": "![Research00报告1图15：MMLE定位与形状尺度](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图15_MMLE定位与形状尺度.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-6329b563b1c4", "kind": "text", "html": "\u003cp\u003eK–R先用样本最小值定位，再利用剩余距离估计形状和尺度。图中的高β情形，位置估计整体被抬高；在此基础上，形状和尺度又出现向下的偏移。三个参数的误差是联系在一起的，前一步怎样定位，会改变后续拟合所面对的距离。\u003c/p\u003e\n\u003cp\u003e形状似然曲线仍有清楚的峰值，只是峰值偏离了真值。这个案例说明，按方法规定完成求解，本身也可能产生有方向的偏移。\u003c/p\u003e", "markdown": "K–R先用样本最小值定位，再利用剩余距离估计形状和尺度。图中的高β情形，位置估计整体被抬高；在此基础上，形状和尺度又出现向下的偏移。三个参数的误差是联系在一起的，前一步怎样定位，会改变后续拟合所面对的距离。\n\n形状似然曲线仍有清楚的峰值，只是峰值偏离了真值。这个案例说明，按方法规定完成求解，本身也可能产生有方向的偏移。", "hash": "10193a361c103fbb1f5699ccc06853198f6af2fac1e89efb5c3cb76407d71b78"}, {"id": "abnormal-process", "kind": "image", "src": "assets/R00_配对情形_MMLE_low.png", "alt": "Research00报告2图19：K–R正常与明显异常的参数估计过程", "markdown": "![Research00报告2图19：K–R正常与明显异常的参数估计过程](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_配对情形_MMLE_low.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-e9a79a03f6bf", "kind": "text", "html": "\u003cp\u003e下面这组样本的最小值更靠右，后面又有几个观测挤得很近。以最小值定位以后，剩余距离呈现出更不均匀的结构，形状似然峰明显向左移动，尺度也随之压低。异常沿着定位、形状估计和尺度恢复的过程传递，最终形成三项参数共同偏离的结果。\u003c/p\u003e\n\u003cp\u003e因此，异常结果需要回到具体步骤检查：偏差从哪里开始，又怎样传递。这样才能判断应当改进方法构造，还是检查求解设置。\u003c/p\u003e", "markdown": "下面这组样本的最小值更靠右，后面又有几个观测挤得很近。以最小值定位以后，剩余距离呈现出更不均匀的结构，形状似然峰明显向左移动，尺度也随之压低。异常沿着定位、形状估计和尺度恢复的过程传递，最终形成三项参数共同偏离的结果。\n\n因此，异常结果需要回到具体步骤检查：偏差从哪里开始，又怎样传递。这样才能判断应当改进方法构造，还是检查求解设置。", "hash": "09f8d23f28ff8e0deb842147e31f3c0fdd5e0ee1593d04599a63d09d0d0c21f4"}, {"id": "abnormal-case-conditions", "kind": "text", "markdown": "*图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。*", "html": "\u003cp\u003e\u003cem\u003e图注：本例为W(5,100,500)、n=7；上排为正常样本，下排为异常样本。\u003c/em\u003e\u003c/p\u003e", "hash": "626962204c3f223d1682fa1653f9b972c4dd62fd61a6ad7b2fec1991f1a26bf9"}, {"id": "report-20890ec101de", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e案例来源：\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A1%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E9%AB%98%E5%BD%A2%E7%8A%B6%E5%8F%82%E6%95%B0%E7%9A%84%E4%BC%B0%E8%AE%A1%E5%81%8F%E7%A7%BB.md\"\u003eResearch00报告1\u003c/a\u003e、\u003ca href=\"file:///D:/weibull/Research/00-%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94/%E6%8A%A5%E5%91%8A2%EF%BC%9A%E5%B0%8F%E6%A0%B7%E6%9C%AC%E6%83%85%E5%86%B5%E4%B8%8B%E7%9A%84%E6%98%8E%E6%98%BE%E5%BC%82%E5%B8%B8%E4%BC%B0%E8%AE%A1.md\"\u003e报告2\u003c/a\u003e。图中实验条件与本轮比较分开。\u003c/em\u003e\u003c/p\u003e", "markdown": "*案例来源：[Research00报告1](../../Research/00-方法对比/报告1：小样本情况下高形状参数的估计偏移.md)、[报告2](../../Research/00-方法对比/报告2：小样本情况下的明显异常估计.md)。图中实验条件与本轮比较分开。*", "hash": "606991a18d05ff112dd2383356b045fd5702b3ff112e6d7731617cdb851f9106"}]}], "content_hash": "b360b202e47bff87b6f5e8de4eece3deeda85d1609832040dc67696c5bf091e0"}, {"id": "figure-life", "title": "6　将差异转为条件性选择依据", "mode": "content", "state": "open", "selected": "A", "options": [{"id": "A", "label": "当前正文", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e实际选择方法，还需要明确关心的是参数本身，还是某个寿命指标。评价目标改变后，方法的排序也可能改变。\u003c/p\u003e", "markdown": "实际选择方法，还需要明确关心的是参数本身，还是某个寿命指标。评价目标改变后，方法的排序也可能改变。", "hash": "9b70721be17aba1bda93b7b334fa14d2a71c4d28aed4dfdfbd94e85d2fe9cb4a"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10这张表的候选方法随n和β变化，B1这张表则大部分区域由MDM取得较低RMSE。同一批样本，只是把关心的寿命指标换了一下，候选方法的格局就发生了变化。参数估计上的优势，也不能直接照搬到寿命指标上。\n\n同时，表里不少条件的第一、第二名很接近。颜色分出了第一名，却未必意味着两种方法存在明显的实用差别。选择时还要把差距大小、稳定性和异常风险一起考虑。", "html": "\u003cp\u003eB10这张表的候选方法随n和β变化，B1这张表则大部分区域由MDM取得较低RMSE。同一批样本，只是把关心的寿命指标换了一下，候选方法的格局就发生了变化。参数估计上的优势，也不能直接照搬到寿命指标上。\u003c/p\u003e\n\u003cp\u003e同时，表里不少条件的第一、第二名很接近。颜色分出了第一名，却未必意味着两种方法存在明显的实用差别。选择时还要把差距大小、稳定性和异常风险一起考虑。\u003c/p\u003e", "hash": "e8a3817b6af0047e2441b4d5c65159c7b34c9fe5383ff863f133025ada7244a3"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e这些表利用了模拟中已知的真实β。实际使用时，我们至少知道n；若还知道β的大致范围，就能缩小需要比较的区域。最终选择也应围绕具体使用目标：需要解释参数，还是预测某个寿命点，以及能接受多大的波动和异常风险。当前比较提供了这些判断的依据，利用未知样本进行选法还需要继续研究。\u003c/p\u003e", "markdown": "这些表利用了模拟中已知的真实β。实际使用时，我们至少知道n；若还知道β的大致范围，就能缩小需要比较的区域。最终选择也应围绕具体使用目标：需要解释参数，还是预测某个寿命点，以及能接受多大的波动和异常风险。当前比较提供了这些判断的依据，利用未知样本进行选法还需要继续研究。", "hash": "b3115d2515cae1439b5d153c02f5b27f0d691c0e196a9448365f7ca11f9c478f"}]}], "content_hash": "648a6961c499acc14c05b352aeacb271fbe46cb70b585401548af50232616958"}, {"id": "closing-slot", "title": "7　下一步：利用具体样本信息辅助选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "current", "label": "当前正文", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e即使n与总体参数相同，具体样本仍有差异。后续希望利用人工智能方法，根据样本可观察到的特征和使用目标，辅助选择适宜的估计方法，并进一步优化方法内部的过程量和求解过程。选择规则能带来多大收益，还需要在新的样本上验证。\u003c/p\u003e", "markdown": "即使n与总体参数相同，具体样本仍有差异。后续希望利用人工智能方法，根据样本可观察到的特征和使用目标，辅助选择适宜的估计方法，并进一步优化方法内部的过程量和求解过程。选择规则能带来多大收益，还需要在新的样本上验证。", "hash": "f62b1930904cd1c1479fc9527a4b14de241ffea30e439e1de620db1d7460784a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "99fbfe9f24cea64be5a22ddbbd862a0ccc08cb375ee5585cd944220fe46244e7"}], "stage": "r $('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
</body>
</html>
