eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计结果通常更分散，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e随着β增大，LSE、LRE的位置估计还进一步向γ=0聚集；n=50时已可见，n=7时边界结果更多。\u003c/p\u003e", "hash": "0f90ce7cd26fca6ea3916268f94bd05d16da9de42a7c378933a4ef598d09c0e0"}]}], "selected_ids": [], "content_hash": "712deb08325fc44234cfe375e02b4c9097ea24154e952662c0aaef5ffd671c85"}, {"id": "law-anomalies", "title": "2.3　明显异常估计与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}, {"id": "effective-return-heading", "kind": "text", "html": "\u003ch4\u003e有效返回情况\u003c/h4\u003e", "hash": "ffedb2e281aeb41eefd42c3fbfb72fb0310af206bf31aa26ce937b2107a8db6e"}, {"id": "effective-return-definition", "kind": "text", "html": "\u003cp\u003e明显异常属于已经有效返回的结果；求解失败指当前方法没有得到符合预设约束、支持与接受标准的返回结果。两者分别统计。\u003c/p\u003e", "hash": "a4dc5afbabe33326f2994d77216202ba85db6198cbbdbe228e4cc579bf61bc42"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "return-insight", "kind": "text", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其成功结果的精度与全部尝试的返回情况对应不同的统计对象。\u003c/p\u003e", "hash": "4340ac83332112f06ead0b52cf689fbd1137878012a2e5500d856520ee40850f"}]}], "selected_ids": [], "content_hash": "2c4f2be18ce17d7b933077120e22dd2cb5cfd18dc27978d9e0b325267afe2d09"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "open", "selected": null, "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e小样本下，需要分别考察明显异常与有效返回。\u003c/strong\u003e八档β、七种方法的n=7形状异常频率均高于n=50，但增多程度与偏移方向不同；MLE的有效率也随n减小而下降，低β时更明显。异常输出与求解失败是不同的结果。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "869511b088ea80f6c0f1cea540ef27126ccf1afe6c763ae4d39c14779d0381f0"}]}], "selection_mode": "single", "selected_ids": [], "content_hash": "e4bfc7c121da3d8ee7b746797babec895089df571fa16cc9db8847eab3aecbd4"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "common-4da126bc6533", "kind": "text", "html": "\u003ch3\u003e共同解释基础\u003c/h3\u003e", "markdown": "### 共同解释基础", "hash": "a6c16428afa35f33dded733615ec8754d145c4d3e7ffbf1c02306c4e507c36d3"}, {"id": "common-01b752309b9f", "kind": "text", "html": "\u003cp\u003e在追踪各方法的响应前，先考察两个共同问题：样本量n和形状参数β怎样影响最小观测与真实起点之间的距离；有限观测为什么仍可能与差别较大的参数组合相容。\u003c/p\u003e", "markdown": "在追踪各方法的响应前，先考察两个共同问题：样本量n和形状参数β怎样影响最小观测与真实起点之间的距离；有限观测为什么仍可能与差别较大的参数组合相容。", "hash": "24f60a6fd76b171723e621cadef8378bd1b30a9afdd0edc00d3180af7b7a3784"}, {"id": "common-34099d9efeca", "kind": "text", "html": "\u003ch4\u003en、β与最小观测值\u003c/h4\u003e", "markdown": "#### n、β与最小观测值", "hash": "607b2413cf7308c29a750cc305ea5421e8d35a1e8dcf1c32e987280bfeca6552"}, {"id": "common-beef8a6c76ac", "kind": "text", "html": "\u003cp\u003e记一组样本的最小观测为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，真实起点为γ。两者之间的距离\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e反映起点附近没有被观测覆盖的范围。最小观测给出了数据的左端，真实起点则仍需由样本和估计规则推断。\u003c/p\u003e", "markdown": "记一组样本的最小观测为$x_{(1)}$，真实起点为γ。两者之间的距离$x_{(1)}-\\gamma$反映起点附近没有被观测覆盖的范围。最小观测给出了数据的左端，真实起点则仍需由样本和估计规则推断。", "hash": "0f1e1a8e9710c1f8eab9ebbcf6c0a2edf4cfdc71bf04daeb5fda07e67a70c4b8"}, {"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "固定尺度和位置时，n、β对最小观测及下端覆盖的影响", "markdown": "![固定尺度和位置时，n、β对最小观测及下端覆盖的影响](../../reviewbyhtml/方法对比-v1.0/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "common-9bb75137a978", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eη=1000、γ=500；两列为β=2与5，三行为n=7、15、30。蓝点为观测，橙点为每组最小观测，灰线连接真实起点与最小观测。下排为最小观测的理论密度。图复用Research00报告1的存档样本。\u003c/em\u003e\u003c/p\u003e", "markdown": "*η=1000、γ=500；两列为β=2与5，三行为n=7、15、30。蓝点为观测，橙点为每组最小观测，灰线连接真实起点与最小观测。下排为最小观测的理论密度。图复用Research00报告1的存档样本。*", "hash": "290de7dd68391ac9fdc825d328b64782e877768f4e4bbbce3e7596590c24e64e"}, {"id": "common-12f8c783f037", "kind": "text", "html": "\u003cp\u003e固定β时，n减小使抽到低寿命观测的机会减少，最小观测的分布向右移动，起点到最小观测之间更容易留下较大空白。固定n时，图中β=5的最小观测比β=2更远离真实起点；此时观测更集中于分布中部，起点附近的覆盖更少。\u003c/p\u003e", "markdown": "固定β时，n减小使抽到低寿命观测的机会减少，最小观测的分布向右移动，起点到最小观测之间更容易留下较大空白。固定n时，图中β=5的最小观测比β=2更远离真实起点；此时观测更集中于分布中部，起点附近的覆盖更少。", "hash": "52db62c9080fe7cd1dd1b2773670aaf098ad0a023f80ecc443c8d4265a374ec3"}, {"id": "common-f1cd790e1972", "kind": "text", "html": "\u003cp\u003e这一关系可由最小次序统计量直接说明。对独立同分布的三参数Weibull样本，起点之后长度为d的区间内没有观测的概率为：\u003c/p\u003e", "markdown": "这一关系可由最小次序统计量直接说明。对独立同分布的三参数Weibull样本，起点之后长度为d的区间内没有观测的概率为：", "hash": "523b60d052168550bd831a0e523a3b9923fbe9d70eaf12db62d88bf1bc944969"}, {"id": "common-6273fe10261b", "kind": "visual", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ePr\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eexp\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e[\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msup\u003e\u003cmo fence=\"true\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0.\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\Pr\\left(x_{(1)}\u003e\\gamma+d\\right)=[1-F(\\gamma+d)]^n=\\exp\\left[-n\\left(\\frac{d}{\\eta}\\right)^\\beta\\right],\\qquad d\u003e0.\n$$", "hash": "7af15ad2d62719ccdc6e801fded576e6c7853e8c513e2686164cef196dc705e4"}, {"id": "common-fdfa2c6bd286", "kind": "text", "html": "\u003cp\u003e固定d和β，n越小，这一概率越大；在起点附近\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e的区间内，β增大也会提高这一概率。例如，γ=500、η=1000时，n=7的样本完全没有观测落在500—1000内的理论概率，β=2时约为17%，β=5时约为80%。因此，n与β共同影响下端观测覆盖，进而影响位置参数可利用的信息。\u003c/p\u003e", "markdown": "固定d和β，n越小，这一概率越大；在起点附近$0\u003cd\u003c\\eta$的区间内，β增大也会提高这一概率。例如，γ=500、η=1000时，n=7的样本完全没有观测落在500—1000内的理论概率，β=2时约为17%，β=5时约为80%。因此，n与β共同影响下端观测覆盖，进而影响位置参数可利用的信息。", "hash": "b17b25935362560d123b287b87df9b4737f67dc1a6d568446a982f75f14be963"}, {"id": "common-037a3d6017ce", "kind": "text", "html": "\u003ch4\u003e有限观测下的参数区分困难\u003c/h4\u003e", "markdown": "#### 有限观测下的参数区分困难", "hash": "193e1cfd4ac21a3c122d6a4376d66cc388f02c19a5b8c5aa22b2d32b192de6c9"}, {"id": "common-cf62f12b60ea", "kind": "text", "html": "\u003cp\u003e下端空白使候选起点受到的直接限制变弱。对需要覆盖全部观测的候选分布，其起点不能高于最小观测；最小观测右移后，部分原先会被观测排除的较高起点便进入了候选范围。位置改变时，形状和尺度又可以共同调整，使候选分布在已有观测覆盖的区间内仍然接近。\u003c/p\u003e", "markdown": "下端空白使候选起点受到的直接限制变弱。对需要覆盖全部观测的候选分布，其起点不能高于最小观测；最小观测右移后，部分原先会被观测排除的较高起点便进入了候选范围。位置改变时，形状和尺度又可以共同调整，使候选分布在已有观测覆盖的区间内仍然接近。", "hash": "0e4b9dfd3d990a33a788d5d0540b3a0fd1c665bc8b4c0df308e79de7f5ba091d"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "不同参数组合在样本覆盖区间内具有接近的CDF", "markdown": "![不同参数组合在样本覆盖区间内具有接近的CDF](../../reviewbyhtml/方法对比-v1.0/assets/R00_图3_参数组合与样本相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "common-0c7f53a9553c", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eW(β,η,γ)分别为W(5,1000,500)与W(2,500,1000)。黑点为第一组分布下n=7第31组样本，累计概率由排序近似。图复用Research00报告1的存档示例。\u003c/em\u003e\u003c/p\u003e", "markdown": "*W(β,η,γ)分别为W(5,1000,500)与W(2,500,1000)。黑点为第一组分布下n=7第31组样本，累计概率由排序近似。图复用Research00报告1的存档示例。*", "hash": "1c128862081e0cd7ca7505ba70495c3cb7fc3408f8180b259bfbcf4b83d8f854"}, {"id": "common-83bbd86703ae", "kind": "text", "html": "\u003cp\u003e图中位置由500变为1000、尺度由1000变为500、形状由5变为2，三参数均明显改变，两条CDF在观测集中的区间内却仍较接近。两种分布具有不同的起点和下端形态，而这组样本缺少相应观测。因此，仅凭这些有限观测，难以清楚区分这两种参数解释。\u003c/p\u003e", "markdown": "图中位置由500变为1000、尺度由1000变为500、形状由5变为2，三参数均明显改变，两条CDF在观测集中的区间内却仍较接近。两种分布具有不同的起点和下端形态，而这组样本缺少相应观测。因此，仅凭这些有限观测，难以清楚区分这两种参数解释。", "hash": "8da79c123f7478ab95a8017f389d08160bf505ee212018ba0f9678e1c8232526"}, {"id": "c3-d6090ef1cf71", "kind": "text", "html": "\u003cp\u003e这建立了后续分析的共同基础：样本提供什么信息，候选参数组合有多容易区分，各方法又怎样依据判据、定位和参数恢复规则作出选择。下面分别追踪误差增长的组成、规律性参数偏移，以及明显异常与有效返回的形成条件。\u003c/p\u003e", "markdown": "这建立了后续分析的共同基础：样本提供什么信息，候选参数组合有多容易区分，各方法又怎样依据判据、定位和参数恢复规则作出选择。下面分别追踪误差增长的组成、规律性参数偏移，以及明显异常与有效返回的形成条件。", "hash": "2019dbcc27e143ddbfdd322f3de08a60d553e83bcb15a47a1690dd77329760e4"}]}], "content_hash": "bef74547c288006a6f1a14f9539c59633d07328b2e41a367e750180d00d7738f"}, {"id": "mechanism-high-beta", "title": "3.1　样本量减少下的误差增长机制", "mode": "content", "state": "open", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "当前正文", "blocks": [{"id": "c3-ee536367d1e4", "kind": "text", "html": "\u003cp\u003e2.1发现，各方法的误差随n减少而增长的幅度不同。本节先区分增长来自偏差还是重复估计的波动，再考察定位与参数恢复怎样参与这两类变化。\u003c/p\u003e", "markdown": "2.1发现，各方法的误差随n减少而增长的幅度不同。本节先区分增长来自偏差还是重复估计的波动，再考察定位与参数恢复怎样参与这两类变化。", "hash": "8716f6bd6a1156400ba24f91beec069fb60b0793af6de0400e4f64d2cb83a31a"}, {"id": "c3-a35d6ac8c197", "kind": "text", "html": "\u003ch4\u003e误差增长的组成\u003c/h4\u003e", "markdown": "#### 误差增长的组成", "hash": "16cad6ef2ee300a2340c1ff625b2c1dca334d14b6c25c5ff070c3a2183217d8b"}, {"id": "n56-d80e862505a8", "kind": "image", "src": "assets/31S_误差平方组成_β5.png", "alt": "固定β=5时六法的误差平方组成", "markdown": "![固定β=5时六法的误差平方组成](../../reviewbyhtml/方法对比-v1.0/assets/31S_误差平方组成_β5.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-9c4764fa2242", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化，采用各n七法共同有效集合。\u003c/em\u003e\u003c/p\u003e", "markdown": "*三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化，采用各n七法共同有效集合。*", "hash": "40e2bfe75fad0d3a29fc514394101de0bd7b1abe9633a50492d3f91335f45fd8"}, {"id": "n55-1ef6b19655c2", "kind": "visual", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mfrac\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eSD\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\operatorname{RMSE}^2=\\operatorname{Bias}^2+V_R,\\qquad V_R=\\frac{R-1}{R}\\operatorname{SD}^2.\n$$", "hash": "30e1666b46b33b3b141ab897d605e6763a964af7b0085f97039f1a352eb00962"}, {"id": "c3-b61c6c6a4608", "kind": "text", "html": "\u003cp\u003eR为有效重复次数，SD采用样本标准差。n=7减n=50的误差平方增量，可以对应拆成偏差平方增量与方差增量：\u003c/p\u003e", "markdown": "R为有效重复次数，SD采用样本标准差。n=7减n=50的误差平方增量，可以对应拆成偏差平方增量与方差增量：", "hash": "dc450555669b9bd6defb35985da794f81445dce6ec6f95f230042f28a57579e8"}, {"id": "n55-093cad5a9e83", "kind": "visual", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\Delta\\operatorname{RMSE}^2=\\Delta\\operatorname{Bias}^2+\\Delta V_R.\n$$", "hash": "f76523fa011f7d995898b17fd26eba1b47cabb9878100d1222604492ce20464b"}, {"id": "n55-69ddaf3abee4", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法（β=5，形状估计）\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔRMSE²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔBias²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔ方差\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMDM(0.1)\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1357\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1461\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0103\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2315\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0005\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2320\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0000\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2228\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2399\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0171\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4687\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0160\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4527\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0267\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0216\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0051\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法（β=5，形状估计） | ΔRMSE² | ΔBias² | Δ方差 |\n| --- | ---: | ---: | ---: |\n| MDM(0.1) | +0.1357 | +0.1461 | -0.0103 |\n| LSE | +0.2315 | -0.0005 | +0.2320 |\n| LRE | +0.1958 | +0.0000 | +0.1958 |\n| WMLE | +0.2228 | +0.2399 | -0.0171 |\n| MLE | +0.4687 | +0.0160 | +0.4527 |\n| MMLE | +0.0267 | +0.0216 | +0.0051 |", "hash": "e996135ea7de57acc98b07d2276c21e43930384f99a35dd3c67942db6ba0f59d"}, {"id": "c3-08d3afef55e1", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e标准化误差平方单位。n=50、20、15、10、7的七法共同有效集合分别为1182、1100、1025、880、644组，各n集合不同；负项抵消增长。尺度、位置和含MM的完整表见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E8%AF%AF%E5%B7%AE%E5%A2%9E%E9%95%BF%E5%88%86%E8%A7%A3.md\"\u003e误差增长分解\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*标准化误差平方单位。n=50、20、15、10、7的七法共同有效集合分别为1182、1100、1025、880、644组，各n集合不同；负项抵消增长。尺度、位置和含MM的完整表见[误差增长分解](3.1误差增长分解.md)。*", "hash": "bacb452b3dc3a8c5598af74c12bc10a28f9a969709ad4fd4e02ad7f48a8cf129"}, {"id": "c3-af4f05e1459f", "kind": "text", "html": "\u003cp\u003e在这一比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差，MDM(0.1)和WMLE主要来自偏差平方，MMLE的增量较小、也以偏差平方为主。需要解释的因而是：相同的样本信息变化，为什么经过不同规则后，会表现为选参分散或方向性偏移？\u003c/p\u003e", "markdown": "在这一比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差，MDM(0.1)和WMLE主要来自偏差平方，MMLE的增量较小、也以偏差平方为主。需要解释的因而是：相同的样本信息变化，为什么经过不同规则后，会表现为选参分散或方向性偏移？", "hash": "5a11bb3692d7f81fe8cd4a5decfb983dd5a1446dd3b49067b888d64c7ac30e52"}, {"id": "c3-b8110740675f", "kind": "text", "html": "\u003ch4\u003e从观测覆盖到选参响应\u003c/h4\u003e", "markdown": "#### 从观测覆盖到选参响应", "hash": "560f6537717905057154b9df24a5a43ee9c329bbe371c2747e2d68d81a425927"}, {"id": "c3-fcfa83d15edc", "kind": "text", "html": "\u003cp\u003e章首已经说明n、β怎样改变下端观测覆盖。这里在相同观测上，直接比较不同规则怎样响应样本减少。\u003c/p\u003e", "markdown": "章首已经说明n、β怎样改变下端观测覆盖。这里在相同观测上，直接比较不同规则怎样响应样本减少。", "hash": "bdb5576f780107c8124c32263384e308a7135db54c4ed4ea981b027917a0d9ef"}, {"id": "ten-gamma-paths-anchor", "kind": "text", "html": "\u003ca id=\"ten-gamma-paths\"\u003e\u003c/a\u003e", "hash": "083593d9f983ae4ba49bcf92af6f43ae05e93f971585b5dbc4a05eb3908e5d1a"}, {"id": "n57-e07ad89511cf", "kind": "image", "src": "assets/31T_十组叠加定位判据.svg", "alt": "五档n下十组共同样本的定位判据与选点", "markdown": "![五档n下十组共同样本的定位判据与选点](../../reviewbyhtml/方法对比-v1.0/assets/31T_十组叠加定位判据.svg)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-764c31ea6a0c", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e从正式50点样本预先每10个编号取一份，共120条嵌套路径，按固定随机排列依次保留50、20、15、10、7点。图中展示十条代表路径；行对应n，列对应MLE、MMLE、MDM(0)、MDM(0.1)，颜色与线型标识同一条路径。MLE展示相对每观测负对数似然，MMLE只标最小观测，MDM展示梯度及目标交点。选例与120条核对见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E5%81%8F%E7%A7%BB%E9%87%8F%E4%B8%8E%E5%BB%93%E7%BA%BF%E7%BE%A4%E4%BD%93-%E7%BB%93%E6%9E%9C.md\"\u003e群体诊断\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*从正式50点样本预先每10个编号取一份，共120条嵌套路径，按固定随机排列依次保留50、20、15、10、7点。图中展示十条代表路径；行对应n，列对应MLE、MMLE、MDM(0)、MDM(0.1)，颜色与线型标识同一条路径。MLE展示相对每观测负对数似然，MMLE只标最小观测，MDM展示梯度及目标交点。选例与120条核对见[群体诊断](3.1偏移量与廓线群体-结果.md)。*", "hash": "91fb3f75331aac955481409e6a5e2682b987f34313bb66f3c16f89214c26f5a0"}, {"id": "c3-cfbcf97d58e4", "kind": "text", "html": "\u003cp\u003eMLE的位置来自候选似然的比较。删点改变候选组合的相对评价，图中优选位置可移向不同内部区域，也可转至零边界。LSE、LRE则由线性匹配或相关性选择位置，再从回归恢复参数；局部间距变化会同时影响定位和回归关系。这些步骤允许位置在不同样本间分散，并把变化传给形状和尺度；3.2与3.3进一步给出具体选参对照。\u003c/p\u003e", "markdown": "MLE的位置来自候选似然的比较。删点改变候选组合的相对评价，图中优选位置可移向不同内部区域，也可转至零边界。LSE、LRE则由线性匹配或相关性选择位置，再从回归恢复参数；局部间距变化会同时影响定位和回归关系。这些步骤允许位置在不同样本间分散，并把变化传给形状和尺度；3.2与3.3进一步给出具体选参对照。", "hash": "ee4d8935a426660c01c51060d2f2c15d7d444ac8511e691e5fb498063e65c695"}, {"id": "c3-dfb08ddbd9f7", "kind": "text", "html": "\u003cp\u003eMMLE采用\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，最小观测的右移直接成为位置偏移。MDM(0.1)则按固定正梯度阈值定位，所选位置改变条件形状和伪尺度均值。两种规则都可能反复选中偏高的位置，形成方向性偏差；波动大小还由各自的定位与恢复步骤决定。\u003c/p\u003e", "markdown": "MMLE采用$\\hat\\gamma=x_{(1)}$，最小观测的右移直接成为位置偏移。MDM(0.1)则按固定正梯度阈值定位，所选位置改变条件形状和伪尺度均值。两种规则都可能反复选中偏高的位置，形成方向性偏差；波动大小还由各自的定位与恢复步骤决定。", "hash": "2c804fa19b9a85da29e2b2fce7b0b799c6e64c6217e98c0bb9deccd8feac9862"}, {"id": "c3-b6684ce1eb87", "kind": "text", "html": "\u003cp\u003e这里的关键是候选优劣、定位目标与恢复关系怎样变化。配对路径中可见不同方向的判据和选点变化，群体核对也未显示各方法随减点普遍变平。\u003c/p\u003e", "markdown": "这里的关键是候选优劣、定位目标与恢复关系怎样变化。配对路径中可见不同方向的判据和选点变化，群体核对也未显示各方法随减点普遍变平。", "hash": "85c19e834bd77d4d0bd80aa3ae947aa83351c98b9129ad6734150c1fb84dd25c"}, {"id": "c3-c992e53c7542", "kind": "text", "html": "\u003ch4\u003e小偏移如何改善小样本估计\u003c/h4\u003e", "markdown": "#### 小偏移如何改善小样本估计", "hash": "94a32770c276f01c53f302b27c8b3a51845653fe9519b0829324faa3a5da4559"}, {"id": "c3-5006c1ba2df3", "kind": "text", "html": "\u003cp\u003eMDM(0)在条件最小标准差的梯度为零处定位；MDM(0.1)把目标改为正梯度0.1。交点移向较陡的上升段时，相同梯度扰动对应的位置变化较小。这种调整也改变选参偏差，需要看降低波动的收益能否超过偏差的代价。\u003c/p\u003e", "markdown": "MDM(0)在条件最小标准差的梯度为零处定位；MDM(0.1)把目标改为正梯度0.1。交点移向较陡的上升段时，相同梯度扰动对应的位置变化较小。这种调整也改变选参偏差，需要看降低波动的收益能否超过偏差的代价。", "hash": "46a420f9d3a50c8195f04a84fb358324ea5f437fbea5dfc368999c573f1534c0"}, {"id": "n61-47c228c4e07c", "kind": "image", "src": "assets/31N_MDM两偏移量估计分布_beta3.png", "alt": "β=3时MDM两种偏移量的共同样本估计分布", "markdown": "![β=3时MDM两种偏移量的共同样本估计分布](../../reviewbyhtml/方法对比-v1.0/assets/31N_MDM两偏移量估计分布_beta3.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-d9771d0d71ec", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(3,1000,500)，上排n=50，下排n=7；每档两方案共用1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。与前面β=5的定位图分别解释。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(3,1000,500)，上排n=50，下排n=7；每档两方案共用1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。与前面β=5的定位图分别解释。*", "hash": "014bbe57601ea9e8a05898f42f17c6c4290df1e89059de0fcca378be023b7dbf"}, {"id": "c3-6e4a5828c813", "kind": "text", "html": "\u003cp\u003en=7时，形状偏差的绝对值由0.51增至0.89，SD由2.09降至1.03，RMSE由2.16降至1.36。位置偏差的绝对值由100.7增至226.1，SD由450.5降至292.7，RMSE由461.5降至369.7；尺度RMSE也由504.3降至411.5。小偏移带来的方向性偏差，被更大幅度的波动降低所抵消，最终改善了这档小样本下的三参数估计。\u003c/p\u003e", "markdown": "n=7时，形状偏差的绝对值由0.51增至0.89，SD由2.09降至1.03，RMSE由2.16降至1.36。位置偏差的绝对值由100.7增至226.1，SD由450.5降至292.7，RMSE由461.5降至369.7；尺度RMSE也由504.3降至411.5。小偏移带来的方向性偏差，被更大幅度的波动降低所抵消，最终改善了这档小样本下的三参数估计。", "hash": "1033c609fd74a0305da1cd358a4c56cf1eb96356d6c52bf3ae7de2c3e91ec359"}, {"id": "c3-e09a32e8b4bd", "kind": "text", "html": "\u003cp\u003e按形状RMSE的绝对增量衡量，小偏移也减轻了n减少的影响：n从50减至7，δ=0时RMSE由1.147增至2.155，增长1.008；δ=0.1时由0.626增至1.359，增长0.733。位置和尺度的收益则体现为两档n下均有较低的RMSE水平。完整指标见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1-MDM%E5%81%8F%E7%A7%BB%E9%87%8F-beta3%E7%BB%93%E6%9E%9C.md\"\u003e两偏移量核对\u003c/a\u003e。\u003c/p\u003e", "markdown": "按形状RMSE的绝对增量衡量，小偏移也减轻了n减少的影响：n从50减至7，δ=0时RMSE由1.147增至2.155，增长1.008；δ=0.1时由0.626增至1.359，增长0.733。位置和尺度的收益则体现为两档n下均有较低的RMSE水平。完整指标见[两偏移量核对](3.1-MDM偏移量-beta3结果.md)。", "hash": "a71311c712d0fe9591b29ef20b411d3df1b2d433f781061f1cbacdda1ff532b5"}, {"id": "c3-8598fdb3cddd", "kind": "text", "html": "\u003cp\u003e因此，适当偏移通过增加一定偏差、明显降低重复波动，改善当前小样本条件下的估计误差，并减小形状RMSE随n减少的绝对增幅。这为MDM(0.1)的小样本表现提供了具体解释，也说明评价样本量敏感性需要同时看偏差、波动与RMSE的变化。\u003c/p\u003e", "markdown": "因此，适当偏移通过增加一定偏差、明显降低重复波动，改善当前小样本条件下的估计误差，并减小形状RMSE随n减少的绝对增幅。这为MDM(0.1)的小样本表现提供了具体解释，也说明评价样本量敏感性需要同时看偏差、波动与RMSE的变化。", "hash": "cf781528e2da5c72f6d961e79417c63c560cb9e6ba5446997380a78f8d1af9de"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "d6039116f151665c986de51f9feaa9bdd52e686267c428f1e3cf5d483f2f1276"}, {"id": "mechanism-n-background", "title": "3.2　参数耦合、判据选择与规律性估计偏移", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "c3-d949620a1573", "kind": "text", "html": "\u003cp\u003e2.2显示，β增大时，一些方法反复出现形状偏低、尺度偏低、位置偏高，另一些方法的分布展宽并在零位置聚集。本节考察规则为什么选择特定方向，以及位置变化怎样传给另两参。\u003c/p\u003e", "markdown": "2.2显示，β增大时，一些方法反复出现形状偏低、尺度偏低、位置偏高，另一些方法的分布展宽并在零位置聚集。本节考察规则为什么选择特定方向，以及位置变化怎样传给另两参。", "hash": "f2d5a1dbe53bd3789250ad859e76b64886276aff383666c06fa96122002ff582"}, {"id": "c3-61fad35eb215", "kind": "text", "html": "\u003ch4\u003e直接定位怎样产生位置偏移\u003c/h4\u003e", "markdown": "#### 直接定位怎样产生位置偏移", "hash": "337077bcea26b9bb8baa03064e65db35f8982f9df6839fcc4408902e86ebbb05"}, {"id": "c3-56c1e2fac0e4", "kind": "text", "html": "\u003cp\u003eMMLE以最小观测定位，再删除该点、用剩余正距离估计形状和尺度。由章首最小观测分布，其位置偏差的期望为：\u003c/p\u003e", "markdown": "MMLE以最小观测定位，再删除该点、用剩余正距离估计形状和尺度。由章首最小观测分布，其位置偏差的期望为：", "hash": "51e28123400b6a114067ad7e16870865bfca3b8eb77f8144a134212e465f9f5d"}, {"id": "c3-f11d4fc6a596", "kind": "visual", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmi mathvariant=\"normal\"\u003eΓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmsup\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\operatorname{E}(\\hat{\\gamma}-\\gamma)=\\eta\\,\\Gamma(1+1/\\beta)\\,n^{-1/\\beta}.\n$$", "hash": "5f6703a658d94771735e3b12fad04f65496544ac45e19059592e17c187c940ce"}, {"id": "c3-c5702792a7f9", "kind": "text", "html": "\u003cp\u003eη=1000、n=7时，β由2增至5，理论平均位置偏差约由335.0增至622.2。β=5的正式1200组中，位置Bias为+618.6，与这一直接定位关系相符。这里可以从构造直接追溯位置偏高；形状和尺度还需沿删除最小值后的条件估计继续分析。\u003c/p\u003e", "markdown": "η=1000、n=7时，β由2增至5，理论平均位置偏差约由335.0增至622.2。β=5的正式1200组中，位置Bias为+618.6，与这一直接定位关系相符。这里可以从构造直接追溯位置偏高；形状和尺度还需沿删除最小值后的条件估计继续分析。", "hash": "389f3395e08979a44749328f746846e9200c8b8561d58b1c3307fd60f5edb39a"}, {"id": "c3-2b023b224618", "kind": "text", "html": "\u003ch4\u003e梯度定位怎样确定联动偏移的方向\u003c/h4\u003e", "markdown": "#### 梯度定位怎样确定联动偏移的方向", "hash": "fb6840908e42be4338e7147b6494f389190555662b31c905603492b53ecdd10b"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "MDM梯度交点、条件形状与条件尺度的对应关系", "markdown": "![MDM梯度交点、条件形状与条件尺度的对应关系](../../reviewbyhtml/方法对比-v1.0/assets/R00_MDM_位置形状尺度传递.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-516d25073841", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eResearch00报告1存档示例：η=1000、γ=500，β=2与5，n=7第48组配对样本，δ=0.1；三行依次为梯度、条件形状、伪尺度均值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*Research00报告1存档示例：η=1000、γ=500，β=2与5，n=7第48组配对样本，δ=0.1；三行依次为梯度、条件形状、伪尺度均值。*", "hash": "f8870a224ffdaaf5e790553fc867b875894e9f91eebfe5303b396dbd42bf115e"}, {"id": "c3-e00f7ea1afd6", "kind": "text", "html": "\u003cp\u003eMDM按固定梯度阈值选择位置。图中的高β样本在较高位置才达到阈值，条件形状和伪尺度均值随后在同一位置读取：位置提高，使较小观测到起点的距离按更大比例缩短；条件标准差最低点移向较低形状，恢复的尺度也较小。\u003c/p\u003e", "markdown": "MDM按固定梯度阈值选择位置。图中的高β样本在较高位置才达到阈值，条件形状和伪尺度均值随后在同一位置读取：位置提高，使较小观测到起点的距离按更大比例缩短；条件标准差最低点移向较低形状，恢复的尺度也较小。", "hash": "dcda2c81e8795d343f29ce759d2a75f15f94992e33d4df885ca23da49dcc389b"}, {"id": "c3-5b801fe8bd28", "kind": "text", "html": "\u003cp\u003e这一过程补上了从参数相容到实际选参的环节：阈值交点确定位置，条件最小化确定形状，均值关系确定尺度。图中沿同一所选位置读取三个过程量，直接显示这一样本的联动方向。\u003c/p\u003e", "markdown": "这一过程补上了从参数相容到实际选参的环节：阈值交点确定位置，条件最小化确定形状，均值关系确定尺度。图中沿同一所选位置读取三个过程量，直接显示这一样本的联动方向。", "hash": "1da86861bb48f9141707ef60c2488cfa93afb35c5a914f82dd27bb22ee030a50"}, {"id": "c3-e5a1f221a2cb", "kind": "text", "html": "\u003cp\u003eWMLE也在2.2中表现出相似的组合偏移，但它按加权方程交点求解。相近的偏移方向提示需要比较其交点与参数恢复，不能用MDM的阈值过程替代WMLE的机制证据。\u003c/p\u003e", "markdown": "WMLE也在2.2中表现出相似的组合偏移，但它按加权方程交点求解。相近的偏移方向提示需要比较其交点与参数恢复，不能用MDM的阈值过程替代WMLE的机制证据。", "hash": "610f741d21e2b76971db990d1a40e9e9616611325c2c6d7c69a1249b92736be0"}, {"id": "c3-75ff1231dde0", "kind": "text", "html": "\u003ch4\u003e回归匹配与非负约束怎样形成边界聚集\u003c/h4\u003e", "markdown": "#### 回归匹配与非负约束怎样形成边界聚集", "hash": "90c7ddcb9c5cb52390a0cbf5646315dd51881dd045a32e57afe0f6ef2048449e"}, {"id": "shape-lse-profile-family", "kind": "image", "src": "assets/R00_LSE_判据与参数条件.png", "alt": "不同形状条件下LSE的位置判据及其优选位置", "markdown": "![不同形状条件下LSE的位置判据及其优选位置](../../reviewbyhtml/方法对比-v1.0/assets/R00_LSE_判据与参数条件.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-9890b4c440a3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eResearch00报告1存档：η=1000、γ=500；两列为β=2、5，三行为n=7、15、30。每条曲线对应一组样本，橙叉为原返回位置，竖虚线为真位置。\u003c/em\u003e\u003c/p\u003e", "markdown": "*Research00报告1存档：η=1000、γ=500；两列为β=2、5，三行为n=7、15、30。每条曲线对应一组样本，橙叉为原返回位置，竖虚线为真位置。*", "hash": "b91b60a6ed8d4a83c80301666b2061a530cabde8e284064d3febae997aa828a6"}, {"id": "c3-b5a13d892583", "kind": "text", "html": "\u003cp\u003eLSE按线性匹配选择位置。β=5时，图中部分判据在较宽位置范围内变化较小，优选位置又分散在不同区域；候选间的评价差异与局部间距的变化共同参与定位。位置越向左，整体对数跨度越受压缩；在LSE的回归方向下，斜率减小会经取倒数恢复为较大形状。\u003c/p\u003e", "markdown": "LSE按线性匹配选择位置。β=5时，图中部分判据在较宽位置范围内变化较小，优选位置又分散在不同区域；候选间的评价差异与局部间距的变化共同参与定位。位置越向左，整体对数跨度越受压缩；在LSE的回归方向下，斜率减小会经取倒数恢复为较大形状。", "hash": "faa79a7ce64b2718f4a4835c5569299b6ed40eb959f9a65aaaf0f42756686f99"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "LSE左侧优选位置与零边界、内部位置的对照", "markdown": "![LSE左侧优选位置与零边界、内部位置的对照](../../reviewbyhtml/方法对比-v1.0/assets/R00_报告2_LSE零边界.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-6b11a37a94c1", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eResearch00报告2存档：W(2,100,500)、n=15第35组为正常参照，第36组为零边界样本；内部左偏样本为W(2,1000,3000)、n=7第1组。\u003c/em\u003e\u003c/p\u003e", "markdown": "*Research00报告2存档：W(2,100,500)、n=15第35组为正常参照，第36组为零边界样本；内部左偏样本为W(2,1000,3000)、n=7第1组。*", "hash": "e9471ac8219fdf55479c999c8d130a51b3f3efe5506c4c9c18874744ff1780af"}, {"id": "c3-a93b78168c1b", "kind": "text", "html": "\u003cp\u003e图中左移位置能改善异常样本的线性匹配。一个样本的优选位置落在γ=0，另一个仍保留内部最低点。非负约束决定了左侧优选是否表现为零边界聚集；回归恢复则决定形状与尺度随所选位置怎样变化。LRE采用相关性定位和另一回归方向，需要按它自己的斜率关系追踪同类位置响应。\u003c/p\u003e", "markdown": "图中左移位置能改善异常样本的线性匹配。一个样本的优选位置落在γ=0，另一个仍保留内部最低点。非负约束决定了左侧优选是否表现为零边界聚集；回归恢复则决定形状与尺度随所选位置怎样变化。LRE采用相关性定位和另一回归方向，需要按它自己的斜率关系追踪同类位置响应。", "hash": "01c34df933c794230ebfb599794029109f5d6804e208dc0aeacee9fdc525ac3b"}, {"id": "c3-64c354560e4b", "kind": "text", "html": "\u003cp\u003e本节区分了三种实际过程：最小观测直接映射位置，梯度阈值确定位置，回归匹配与约束共同确定位置。它们都作用于耦合的三参数，却可以选出不同方向的组合；较宽缓的判据只是其中部分样本的一种表现。上述存档图保留原条件与实现，用于解释计算路径，正式分布规律仍以第二章为依据。\u003c/p\u003e", "markdown": "本节区分了三种实际过程：最小观测直接映射位置，梯度阈值确定位置，回归匹配与约束共同确定位置。它们都作用于耦合的三参数，却可以选出不同方向的组合；较宽缓的判据只是其中部分样本的一种表现。上述存档图保留原条件与实现，用于解释计算路径，正式分布规律仍以第二章为依据。", "hash": "e8d6528419fd33f5500c774451e17a05f77169776be7b3afbf66aeec43070255"}]}], "content_hash": "14609fa58492c5d7ddb660f642e78428c737968c98d5edf6537786541e766ac1"}, {"id": "mechanism-anomalies", "title": "3.3　明显异常估计与方法失效的形成条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "mechanism-anomalies-current", "label": "当前正文", "blocks": [{"id": "c3-eedaad6cc143", "kind": "text", "html": "\u003cp\u003e规律性偏移描述重复抽样中的整体方向，明显异常则要进一步比较具体样本。相同n、β下，有些样本的判据优选仍接近真值，有些会选择远离真值的组合；能否有效返回又取决于各方法的接受条件。\u003c/p\u003e", "markdown": "规律性偏移描述重复抽样中的整体方向，明显异常则要进一步比较具体样本。相同n、β下，有些样本的判据优选仍接近真值，有些会选择远离真值的组合；能否有效返回又取决于各方法的接受条件。", "hash": "12a0b9a7f9494c3baf667b037613c6167a0eeb79c7aaa7c85327dae0cc5624d0"}, {"id": "c3-cf91fbf193e1", "kind": "text", "html": "\u003ch4\u003e同一方法为什么在部分样本上产生明显异常\u003c/h4\u003e", "markdown": "#### 同一方法为什么在部分样本上产生明显异常", "hash": "89dc46907d3a038ce402ace30a7e8f860e62b6d9852b07592da413fbdc879aa8"}, {"id": "c3-112c1a825dee", "kind": "text", "html": "\u003cp\u003e复查2.3中的LSE两例：β=5、n=7，第34组与第0组的最小观测分别为1229.88、1241.75，两者接近，但原估计分别接近真值与明显低估。沿冻结的White回归，在真位置和实际返回位置重新计算相同判据：\u003c/p\u003e", "markdown": "复查2.3中的LSE两例：β=5、n=7，第34组与第0组的最小观测分别为1229.88、1241.75，两者接近，但原估计分别接近真值与明显低估。沿冻结的White回归，在真位置和实际返回位置重新计算相同判据：", "hash": "b8000fc075aa727c5ea56aec629418d166ae88b11871724e73b46ab3bca100ce"}, {"id": "c3-a03e29a850c6", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e样本\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e比较位置γ\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e条件形状\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e条件尺度\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e相对回归残差1−R²\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e第34组：固定真位置\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e500.00\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e6.95\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1020.03\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.077565\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：实际返回位置\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e681.73\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e5.55\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e836.77\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.077351\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：固定真位置\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e500.00\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e6.49\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1020.53\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.104104\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：实际返回位置\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1205.95\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1.24\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e282.98\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.011729\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 样本 | 比较位置γ | 条件形状 | 条件尺度 | 相对回归残差1−R² |\n| --- | ---: | ---: | ---: | ---: |\n| 第34组：固定真位置 | 500.00 | 6.95 | 1020.03 | 0.077565 |\n| 第34组：实际返回位置 | 681.73 | 5.55 | 836.77 | 0.077351 |\n| 第0组：固定真位置 | 500.00 | 6.49 | 1020.53 | 0.104104 |\n| 第0组：实际返回位置 | 1205.95 | 1.24 | 282.98 | 0.011729 |", "hash": "581ab45e5923b47fb032a5b8828139aaa630c4a3f839ea571bbd04345b1dec2f"}, {"id": "c3-356461bcc5b5", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e每一位置下均重新回归恢复形状与尺度；“固定真位置”不等于把三个参数都设为真值。R²为上述对数回归的决定系数，相对回归残差越小，当前LSE的匹配评价越好。实际返回位置的参数与正式存档一致；这里只核对候选评价，不重新运行定位搜索。\u003c/em\u003e\u003c/p\u003e", "markdown": "*每一位置下均重新回归恢复形状与尺度；“固定真位置”不等于把三个参数都设为真值。R²为上述对数回归的决定系数，相对回归残差越小，当前LSE的匹配评价越好。实际返回位置的参数与正式存档一致；这里只核对候选评价，不重新运行定位搜索。*", "hash": "7f4487f317f3299c3811ac8cf3860c3c1d45890da1215f66e5cea405ae14b36d"}, {"id": "c3-14ff07917190", "kind": "text", "html": "\u003cp\u003e第0组在右侧位置取得明显更好的回归匹配，准则因此优选了形状很低、尺度很小、位置很高的组合。第34组的优选位置仍相对接近真位置，判据改善也很小。仅看最小观测留下的空白，不能区分这两种结果；需要进一步看整组间距与参考坐标的匹配，以及定位后参数怎样恢复。\u003c/p\u003e", "markdown": "第0组在右侧位置取得明显更好的回归匹配，准则因此优选了形状很低、尺度很小、位置很高的组合。第34组的优选位置仍相对接近真位置，判据改善也很小。仅看最小观测留下的空白，不能区分这两种结果；需要进一步看整组间距与参考坐标的匹配，以及定位后参数怎样恢复。", "hash": "58627a3ef770cb1276659324d1bb5273478363e3e94f87e91c875ff7b86075a1"}, {"id": "c3-e1eced36936f", "kind": "text", "html": "\u003cp\u003e这组对照说明，明显异常可以是方法判据明确优选的结果。参数补偿提供候选空间，当前样本的结构与选参规则决定最终落在哪个区域。\u003c/p\u003e", "markdown": "这组对照说明，明显异常可以是方法判据明确优选的结果。参数补偿提供候选空间，当前样本的结构与选参规则决定最终落在哪个区域。", "hash": "0f1fc0d68d7edc3db8667fe63fb5251790d2ce025d3fd47b98be3ade135bb22d"}, {"id": "c3-38b5cfd0df65", "kind": "text", "html": "\u003ch4\u003e宽缓剖面是另一种具体形成条件\u003c/h4\u003e", "markdown": "#### 宽缓剖面是另一种具体形成条件", "hash": "930b379fe4faa332cf41b2df1c8e72c3b7da58d2ab51887b8103fd4df58ee73c"}, {"id": "shape-mle-flat-profile", "kind": "image", "src": "assets/R00_异常剖面_MLE_high.png", "alt": "MLE正常与高估样本的似然剖面及条件形状", "markdown": "![MLE正常与高估样本的似然剖面及条件形状](../../reviewbyhtml/方法对比-v1.0/assets/R00_异常剖面_MLE_high.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "c3-fe5da4c3812c", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eResearch00报告2存档：W(2,100,500)、n=15，第35组为正常参照，第36组为高估样本。该图解释存档案例的候选比较，不作为本轮MLE失败率的证据。\u003c/em\u003e\u003c/p\u003e", "markdown": "*Research00报告2存档：W(2,100,500)、n=15，第35组为正常参照，第36组为高估样本。该图解释存档案例的候选比较，不作为本轮MLE失败率的证据。*", "hash": "5f1c8dfb1b7c8ea04e9c2f2421db432ef80ffbf6e9dc70e3d64af196578c4bba"}, {"id": "c3-55a5d63a9455", "kind": "text", "html": "\u003cp\u003e第36组在γ=0处的条件对数似然约为−72.215，高于真位置处的−72.899；选中左端位置后，形状约为23.54。γ从0移至约251时，条件形状已降至13.64，对数似然却只下降约0.012。这一实例中，偏离真值的组合获得较高似然，宽缓区又使差别较大的参数组合具有近似评价。它与前面的LSE明显改善匹配，是不同的候选选择情形。\u003c/p\u003e", "markdown": "第36组在γ=0处的条件对数似然约为−72.215，高于真位置处的−72.899；选中左端位置后，形状约为23.54。γ从0移至约251时，条件形状已降至13.64，对数似然却只下降约0.012。这一实例中，偏离真值的组合获得较高似然，宽缓区又使差别较大的参数组合具有近似评价。它与前面的LSE明显改善匹配，是不同的候选选择情形。", "hash": "9bd3dca415d7438f3f92ad8c869110e1cf50ecd76b068314f8e1214ad12022f9"}, {"id": "c3-1b8c792bc1ea", "kind": "text", "html": "\u003ch4\u003e有效返回的要求怎样产生失败记录\u003c/h4\u003e", "markdown": "#### 有效返回的要求怎样产生失败记录", "hash": "f571d1ef3a26e6dd806e92a8cde0a00cf227e56af8f3cfeb75f3040b9f431d82"}, {"id": "c3-47f6bde415cd", "kind": "text", "html": "\u003cp\u003e对正式336000条求解明细逐条核对，11433条失败分别落在三个环节：\u003c/p\u003e", "markdown": "对正式336000条求解明细逐条核对，11433条失败分别落在三个环节：", "hash": "c6082afc6e1edc54ad31734c6a418655ce69fdffef0a2670d0a8dd1681a847e4"}, {"id": "c3-3fd561a95961", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e失败次数\u003c/th\u003e\u003cth\u003e当前实现记录的失败环节\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e8790\u003c/td\u003e\u003ctd\u003e位置剖面搜索未找到可接受的有限局部极大值\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e503\u003c/td\u003e\u003ctd\u003e在既定参数约束与残差门槛内未找到可接受方程根\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMM\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e2140\u003c/td\u003e\u003ctd\u003e样本Weibull矩不满足显式反演的可采纳条件\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法 | 失败次数 | 当前实现记录的失败环节 |\n| --- | ---: | --- |\n| MLE | 8790 | 位置剖面搜索未找到可接受的有限局部极大值 |\n| WMLE | 503 | 在既定参数约束与残差门槛内未找到可接受方程根 |\n| MM | 2140 | 样本Weibull矩不满足显式反演的可采纳条件 |", "hash": "88931628a0abd789b163ff6f56efbc7c064bbfd449838c6168b4ffe0775390fe"}, {"id": "c3-cd9d9a6e46d5", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e40条件合计，每种方法48000次尝试；MDM、LSE、LRE和MMLE在本批全部有效。计数与原始失败状态逐条对应，见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/%E7%AC%AC%E4%B8%89%E7%AB%A0%E9%80%89%E5%8F%82%E4%B8%8E%E8%BF%94%E5%9B%9E%E7%8A%B6%E6%80%81%E6%A0%B8%E5%AF%B9.json\"\u003e核对记录\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*40条件合计，每种方法48000次尝试；MDM、LSE、LRE和MMLE在本批全部有效。计数与原始失败状态逐条对应，见[核对记录](第三章选参与返回状态核对.json)。*", "hash": "2b0bb568e5a0bf525497ad30ac0066742f7470cea8a7dd5c16697f2094dcc67d"}, {"id": "c3-fc3686b39d9f", "kind": "text", "html": "\u003cp\u003eMLE比较可接受的有限候选，并把支持边界极限单独记录。例如β=1.5、n=7第0组没有找到有限候选，记录的极限位置等于样本最小值719.93，位于当前开支持条件之外，因此没有把该极限点当作有效估计。WMLE则必须同时满足加权方程和残差要求；MM的失败来自另一种构造条件，例如β=1.5、n=7第27组的两组矩差约为111.14与129.20，未满足前者大于后者且均为正的反演条件。\u003c/p\u003e", "markdown": "MLE比较可接受的有限候选，并把支持边界极限单独记录。例如β=1.5、n=7第0组没有找到有限候选，记录的极限位置等于样本最小值719.93，位于当前开支持条件之外，因此没有把该极限点当作有效估计。WMLE则必须同时满足加权方程和残差要求；MM的失败来自另一种构造条件，例如β=1.5、n=7第27组的两组矩差约为111.14与129.20，未满足前者大于后者且均为正的反演条件。", "hash": "9d57e79eaca6a8fd283bf06487a3cbc8b4e0e4f922ee9026fdfdfa7b200653de"}, {"id": "c3-375309b3f6fb", "kind": "text", "html": "\u003cp\u003e这些记录把失败定位到了搜索接受、方程可解性与矩反演三个不同环节。“未找到”仍对应当前搜索和约束范围，需要与数学上的解不存在区分。失败样本更细的结构分型尚未完成，现有记录足以说明其返回条件与有效但明显偏离真值的估计不同。\u003c/p\u003e", "markdown": "这些记录把失败定位到了搜索接受、方程可解性与矩反演三个不同环节。“未找到”仍对应当前搜索和约束范围，需要与数学上的解不存在区分。失败样本更细的结构分型尚未完成，现有记录足以说明其返回条件与有效但明显偏离真值的估计不同。", "hash": "9224ebafbcffbdb0ae9e0d12bbac8daaa801ce6bfd38e8ca3fbec04b2b8092d5"}, {"id": "c3-66860ae858ca", "kind": "text", "html": "\u003cp\u003e因此，分析明显异常需要比较样本结构、候选评价与实际选点；分析失败还需要核对参数约束和返回条件。两者在第四章分别进入尾部误差、失败风险与实际使用的评价。\u003c/p\u003e", "markdown": "因此，分析明显异常需要比较样本结构、候选评价与实际选点；分析失败还需要核对参数约束和返回条件。两者在第四章分别进入尾部误差、失败风险与实际使用的评价。", "hash": "7f2512830659c4ca8c076512e5651c8d9240cf3bcd29b63879abfc871ec47f1b"}]}], "content_hash": "e525c892c7693e7ed119f100990f61e7a71047d3eec25b2542aaf2ef22acdbcb"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e前面的分析区分了重复波动、方向性偏移、明显异常和有效返回。评价方法时，需要继续考察这些表现对误差、风险和使用目标的不同影响，再讨论在已知条件或仅有样本时怎样选择方法。\u003c/p\u003e", "hash": "4f6a58bf2ff3699b62bd5d068160ebb26d50f28fddfffdd2a58683448f1938a0"}]}], "content_hash": "c5b826bb5d6d9e4c9111ba942f248fb43224652e9821a68f793f2ba4a770d1e8"}, {"id": "evaluation-risk", "title": "4.1　极端结果与失败风险", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}, {"id": "failure-risk-evaluation", "kind": "text", "html": "\u003cp\u003e2.3和3.3分别给出了有效返回情况及其发生环节。实际使用时，应同时评价成功结果的误差和全部尝试的失败风险；有回退策略时，还需要评价回退后的误差及最终返回情况。成功样本上的较低RMSE，只回答已返回结果的精度问题。\u003c/p\u003e", "hash": "33de792d12f8b62355b3d3fb94e1bf2698b782211225af56ce0f9ef51d3e3b9f"}]}], "content_hash": "9dcc2ce5207621d4475a13ca2fcc021ac47441c6058ac6fa65c02cb938d7015d"}, {"id": "evaluation-target", "title": "4.2　B10性能地图与样本特征预测", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e这里以B10，即10%失效分位寿命为使用目标，按B10的RMSE比较方法。性能地图给出各n、β条件下误差最低的方法；进一步由样本特征预测地图推荐，比较已知条件下的推荐与仅有样本时能够识别的推荐。\u003c/p\u003e", "hash": "d4d5174d8df0a0a202700b074340f8c81a8e75f0fb8073681f966a1aaf2ef3eb"}, {"id": "map-classification-image", "kind": "image", "src": "assets/43_B10地图分类对照.png", "alt": "原B10地图与样本特征分类器测试多数票对照", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e左图为原B10性能地图，右图为样本特征分类器在每格测试样本上的预测多数票，恢复35/40格（87.5%）；虚线框为不一致格。β仅用于汇总显示，不是网络输入。MDM指δ=0.1，LRE为Park实现。逐格数据来自分类报告的冻结结果表。\u003c/em\u003e\u003c/p\u003e", "hash": "d7a28de58f2bae8a91f8553664c2fba8aa079cf932de51e16f972bdac3992235"}, {"id": "life-insight", "kind": "text", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，体现了方法适用区域的条件性。图中AI预测恢复了多数区域，同时在若干LSE和MLE区域出现差异，下一节检验这种地图推荐的识别情况。\u003c/p\u003e", "hash": "b2adf29de65690177f22afd7991c590fc09c9b3a69bb1450a90b4b6a11b39c49"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e左图依据真实β与样本量定义条件，实际应用中β通常未知。右图根据一组样本的可观测特征作出预测，真实β只用于事后汇总成图。方法选择还需结合实际B10误差、波动与失败风险。\u003c/p\u003e", "hash": "630f17091a2f48b81e88c992e7ca27546f67ce34bd79efe6637af451885c4b0d"}]}], "content_hash": "4e2acda31e96a33168470b5a5aed5bd09fff52bb2c58094b9842516895101452"}, {"id": "evaluation-feature-map", "title": "4.3　从样本特征恢复性能地图的推荐", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-feature-map-current", "label": "当前内容", "blocks": [{"id": "map-question", "kind": "text", "html": "\u003cp\u003e前图右侧采用样本特征分类器预测既定B10地图的推荐。本节说明其训练与检验，考察样本自身的信息能在多大程度上恢复地图标签。\u003c/p\u003e", "hash": "6086e5638c482627cce36e0666c9e5ef2a6875249d870b68826f8f62f0d2071b"}, {"id": "map-design", "kind": "text", "html": "\u003cp\u003e复用48,000组样本与既有B10地图，以每格最低RMSE方法作为分类标签。输入为样本量、位置尺度、归一化分位数、形状统计与间距等30维特征，不输入真参数或七法估计值。按样本指纹划分训练、验证和测试，分别为28,807、9,551和9,642组；分类网络采用64×64两层结构，验证集用于早停。\u003c/p\u003e", "hash": "2cec55df4113bb0dcb279b15ede47ffa8a957efc256baecc4b579560a142b6d8"}, {"id": "map-matching-table", "kind": "text", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e策略\u003c/th\u003e\u003cth\u003e测试样本逐组一致率\u003c/th\u003e\u003cth\u003e40条件等权一致率\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e训练多数类\u003c/td\u003e\u003ctd\u003e44.70%\u003c/td\u003e\u003ctd\u003e45.00%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只按n查训练多数类\u003c/td\u003e\u003ctd\u003e46.53%\u003c/td\u003e\u003ctd\u003e47.50%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本特征分类网络\u003c/td\u003e\u003ctd\u003e73.15%（7,053/9,642）\u003c/td\u003e\u003ctd\u003e73.30%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "ef16cda2456281f2423778ea30e311e570479f5af0f9588038b8f1314a0fc669"}, {"id": "map-results", "kind": "text", "html": "\u003cp\u003e样本特征比只看n提供了额外的地图匹配信息，但五个不一致格中，四个LSE格均被判为WMLE，另有一个MLE格被判为WMLE。LSE的逐组召回率仅5.18%，训练集上也只有6.59%。其中三个LSE冠军相对WMLE的RMSE优势不足0.2%；类别稀少、窄区域的样本信息重叠及最大概率判决的取舍共同参与识别困难。\u003c/p\u003e", "hash": "0c9098b6b7baab38f50c6ae44757b8f84fe2a5b3280b9b47e47d560b0322ab56"}, {"id": "map-interpretation", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e地图标签匹配率与当前样本的真实最优命中率是两个评价对象。\u003c/strong\u003e原地图按整格平均误差定义冠军，并使用全1200组结果；本轮评价的是对这张既定地图的模仿。测试样本来自相同40个条件的留出部分，范围为η=1000、γ=500及既有β×n网格。\u003c/p\u003e", "hash": "477514e26d893c73dc6149ea88c01c6180185dd8566b8d9ea927a803154940c1"}, {"id": "map-ablation", "kind": "text", "html": "\u003cp\u003e匹配三个初始化重新训练后，完整特征的条件等权一致率均值为73.30%；删除位置尺度组降至72.25%，删除n降至73.02%。其他组未显示额外总体收益，但特征之间存在重叠信息，删除后不降不能解释为形状或间距无用。所有消融设置的LSE召回率仍不足7%。\u003c/p\u003e", "hash": "effc9a2265f5ce16c6f4aaa8041e35fa2582f713de02b35932e214dd7c2df90d"}, {"id": "map-source-links", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e详细方案、结果与核对：\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E5%9C%B0%E5%9B%BE%E5%88%86%E7%B1%BB%E5%8C%B9%E9%85%8D-v1.0.md\"\u003e地图分类匹配\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-LSE%E9%94%99%E5%88%86%E8%AF%8A%E6%96%AD-v1.0.md\"\u003eLSE错分诊断\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E5%88%86%E7%B1%BB%E5%99%A8%E7%89%B9%E5%BE%81%E6%B6%88%E8%9E%8D-v1.0.md\"\u003e分类器特征消融\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "hash": "b5280174e390e3dd0cf0cf48bbe1391946ac87c180db1f45d9ecab7884819668"}]}], "content_hash": "c66787efcbdf727d080b5129c9d1bad6c729361558331153f098c1ecfe8da9eb"}, {"id": "evaluation-feature-risk", "title": "4.4　以B10误差评价逐样本选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-feature-risk-current", "label": "当前内容", "blocks": [{"id": "risk-question", "kind": "text", "html": "\u003cp\u003e地图分类之外，还可以直接学习各方法的预计B10平方误差风险，再按预测风险从小到大选择方法。该路线采用相同样本特征，七法结果与真值只用于监督；先运行首选方法，失败后依排序回退。\u003c/p\u003e", "hash": "f49a3fd778e043a33a250e6076b7648a21d5d501a41aa53408934852d2dc9b91"}, {"id": "risk-main-table", "kind": "text", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e9,642组留出测试，40条件等权\u003c/th\u003e\u003cth\u003eB10 RMSE\u003c/th\u003e\u003cth\u003e相对固定方法改善\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e训练集选定固定MDM-0.1（含固定回退）\u003c/td\u003e\u003ctd\u003e106.85\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只按样本量选法\u003c/td\u003e\u003ctd\u003e106.73\u003c/td\u003e\u003ctd\u003e0.11%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e特征风险网络选法，含失败回退\u003c/td\u003e\u003ctd\u003e95.08\u003c/td\u003e\u003ctd\u003e11.01%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "dcc0832d2182b21a52243456317442af6deb6dade2a33c7a0de9969de3191a7c"}, {"id": "risk-gain", "kind": "text", "html": "\u003cp\u003e配对95%区间为[10.27%, 11.72%]。首次选中方法失败率3.35%，本批依序回退后最终失败率0%；有效极端值保留，失败不填零误差。在同一批7,317组七法共同有效测试样本上，网络RMSE为93.14，仅用训练部分重建的β×n地图推荐为103.22，前者低9.76%。\u003c/p\u003e", "hash": "85ad5459a96d9acea7ea79e3ea7a9eb676d18779b369c5f56c71e09433db6e20"}, {"id": "risk-distinction", "kind": "text", "html": "\u003cp\u003e这一模型直接优化误差风险，逐样本事后最优命中率为40.29%；将预测风险按条件取平均后，仅4/40格复现原地图冠军。\u003cstrong\u003e逐样本选法降低误差，并不要求它与地图分类器给出相同的条件推荐。\u003c/strong\u003e两条路线应分别按实际选法误差和地图标签匹配率评价。\u003c/p\u003e", "hash": "dc0efa04dc1b8427a69c25a8c133fc8cfb6a6035909fd9d8f8be6effa43a9078"}, {"id": "risk-feature-association", "kind": "text", "html": "\u003cp\u003e固定β×n后，样本特征仍能区分不同方法的误差表现。例如样本最小值从低四分位到高四分位时，MLE的实际B10 RMSE由80.52增至191.61，MDM由117.10增至163.76。这为样本特征包含选法信息提供了观察证据；风险预测消融衡量额外信息贡献，不能将其换算成造成估计误差的因果占比。\u003c/p\u003e", "hash": "50f5e680853b6366be4011fabcf3defe90d2f440a44af1cbb4f402c110d13159"}, {"id": "risk-tradeoffs", "kind": "text", "html": "\u003cp\u003e收益也伴随取舍：总体带符号Bias由10.91增至30.34，P95绝对误差由217.60降至196.81。少量独立新样本中的未训练β=2.25、n=10及未训练n=30、β=3分别改善6.97%和10.01%；但η=500、γ=250及γ=0、η=1000时，RMSE分别增加26.03%和35.35%。各新条件仅200组。\u003c/p\u003e", "hash": "bbbafef2bd65efbe5cc514506b83882fa25283d6a0fbc0543594876c0873c4e9"}, {"id": "risk-conclusion", "kind": "text", "html": "\u003cp\u003e当前结果说明：\u003cstrong\u003e在已考察范围内，样本特征可以辅助方法选择；选择目标、偏差方向、极端误差与适用范围仍需共同判断。\u003c/strong\u003e这是一项固定训练范围的研究原型，跨尺度、位置的推广仍待研究。配对区间固定已训练模型，不包含重新训练的全部不确定性。\u003c/p\u003e", "hash": "7844593ef3879dac7c6c215299b68c76ed9ee82ccf94e100a9606b1b8a1f2b8f"}, {"id": "risk-source-links", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e详细方案、结果与核对：\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E7%A0%94%E7%A9%B6%E6%96%B9%E6%A1%88-v1.0.md\"\u003e首轮方案\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E7%AE%80%E8%A6%81%E6%8A%A5%E5%91%8A-v1.0.md\"\u003e选法与新样本结果\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E6%80%A7%E8%83%BD%E5%9C%B0%E5%9B%BE%E5%AF%B9%E7%85%A7%E8%A1%A5%E5%85%85-v1.0.md\"\u003e性能地图对照\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E8%AF%AF%E5%B7%AE%E5%9B%A0%E7%B4%A0%E9%87%8F%E5%8C%96%E8%A1%A5%E5%85%85-v1.0.md\"\u003e误差因素量化\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "hash": "8a07ec893e2c4d69a94b4db898a7ac36c80ce2e1b6ca171f2708ace1a46cf234"}]}], "content_hash": "5c5920d13893d3f16ede38a05a457f8d558254725ab70ee30a3ba7aa0d437d73"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e样本特征已在本轮固定参数范围内提供了方法选择信息。后续需扩大尺度和位置条件，并在独立样本上检验规则的稳定性与风险；进一步考虑依据使用目标，优化方法内部的过程量与求解过程。\u003c/p\u003e", "hash": "6b7e83f408c88b1c554704d2afe109f05af441b2f5f381711d06a8b84da5c4fc"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "0c747394e361ecac4e868d65f40936452bee4d96207ad2e31a7407ea1b8dcbda"}], "last_applied_submission_id": "7b1e65c0-f358-44af-957a-09ef56017340", "last_rendered_submission_id": "9ad9ad56-d0ab-45ec-9b37-fb3e842c4397", "outline_confirmed": true, "review_complete": false, "review_runtime": "0.7.1", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parame document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return deleteNote(pending);if(structuredNote(pending)){storeNote(pending,comment);draft.submission_id=null;closeEditor(false);persist();renderComments();return true}const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;$('delete-note').onclick=()=>deleteNote(pending);
function editorKeydown(event){if(event.isComposing||event.keyCode===229)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!saveNote())$('editor-input').focus();updateOutlineStatus()}if(event.key==='Escape')closeEditor()}
$('editor-input').addEventListener('keydown',editorKeydown);
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function sidebarNote(anchor,comment){const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',comment));const tools=el('div','annotation-tools'),edit=el('button','quiet','修改'),remove=el('button','quiet','删除');edit.type=remove.type='button';edit.onclick=()=>editNote(anchor,card.getBoundingClientRect());remove.onclick=()=>deleteNote(anchor);quote.onclick=()=>{const target=anchor.block_id?blockNode(anchor.unit_id,anchor.option_id,anchor.block_id):unitNode({id:anchor.unit_id});target?.scrollIntoView({block:'center',behavior:'smooth'})};tools.append(edit,remove);card.append(tools);$('comments').append(card)}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>editNote({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>deleteNote({...anchor,unit_id:unit.id});tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
