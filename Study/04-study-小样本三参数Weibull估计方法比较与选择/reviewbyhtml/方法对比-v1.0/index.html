body\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c67f399b68fb5ad1d790c331137e39ce3a9c0b314e969380f7f330565547de96"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e固定β观察，样本量减少时，估计误差总体增大，但各方法的增幅不同。部分方法的误差上升较快，部分方法变化较缓，方法间的差距也随之改变。固定n观察，β增大时位置误差的增长较为一致，形状和尺度误差的变化则因方法而异。\u003c/p\u003e", "hash": "74469a7f9648b5678e1b50d6643b01fcb818eeaf3fbd5a7de8df24c9d046401b"}, {"id": "rmse-condition-directions", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e比较方向\u003c/th\u003e\u003cth\u003e观察到的变化\u003c/th\u003e\u003cth\u003e初步认识\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e固定β，减小n\u003c/td\u003e\u003ctd\u003eRMSE多数增大，各方法增幅不同\u003c/td\u003e\u003ctd\u003e样本减少通常降低估计精度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e固定n，增大β\u003c/td\u003e\u003ctd\u003e位置误差普遍增大，形状和尺度误差的变化存在方法差异\u003c/td\u003e\u003ctd\u003e形状条件对各参数的影响不同\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e交叉观察n与β\u003c/td\u003e\u003ctd\u003e同一方法在不同β下的误差增幅不同\u003c/td\u003e\u003ctd\u003e样本量的影响随形状条件改变\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "54fcacb84de4b52f960f3bdd59ba3a5eaf9589ca001ccc4f883f65dd1502effa"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_轨迹与50到7联合图.png", "alt": "各方法对的距离轨迹及n从50到7的距离变化联合图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：上两行分别为β=1.5和5下五档n的距离轨迹，每条线对应一对方法；下行为n=50到7的距离变化，覆盖八档β，红色表示扩大、蓝色表示缩小。三列依次为形状、尺度和位置参数。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e距离为两种方法标准化RMSE之差的绝对值。六法共15对，仍使用七法共同有效样本；形状RMSE除以真β，尺度与位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "591a33b92832df58969c2e4257a64b88ba27e36e54e5cff626f31038b4c4ae51"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003eβ=1.5时，七种方法的RMSE均随样本减少而上升；联合图中六种方法的两两差距也普遍拉开。此时，各方法的变化方向较为一致，区别主要表现为上升幅度不同。\u003c/p\u003e\u003cp\u003eβ=5时，RMSE仍多向上，但方法间距离的变化不再一致：一些方法对继续分离，另一些逐渐接近，部分距离曲线还出现转折。比较n=50与7，LSE、LRE与WMLE的尺度和位置RMSE更接近，而它们与K–R的差距增大。\u003c/p\u003e\u003cp\u003e形状条件改变后，样本减少对方法关系的影响，可从普遍拉开转为拉开与接近并存。误差上升的共同方向，并不意味着方法间的精度关系保持不变。\u003c/p\u003e", "hash": "27659e5d2d778ad2578fc3f43555e2811334708e070343e5ff2f6f0b8c01c0d8"}, {"id": "wmle-bias-sd-evidence", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003en\u003c/th\u003e\u003cth\u003e形状Bias\u003c/th\u003e\u003cth\u003e形状SD\u003c/th\u003e\u003cth\u003e形状RMSE\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e10\u003c/td\u003e\u003ctd\u003e-2.263\u003c/td\u003e\u003ctd\u003e0.982\u003c/td\u003e\u003ctd\u003e2.466\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e-2.614\u003c/td\u003e\u003ctd\u003e0.713\u003c/td\u003e\u003ctd\u003e2.710\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "82a1d78972b9e6c43540035d533a6e54fe8d219bfa79e588cf66a9293832234e"}, {"id": "wmle-bias-sd-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e表：WMLE，β=5；七法共同有效结果，Bias保留符号。自身有效结果也支持SD下降、负偏差加重和RMSE上升的方向。\u003c/em\u003e\u003c/p\u003e", "hash": "dee7e073e9dede1d3f597ad93e91c5dd234e5417a587b5e6205b24e56092b9e2"}, {"id": "wmle-bias-sd-interpretation", "kind": "text", "html": "\u003cp\u003e样本减少时，误差增大也不总表现为分布展宽。β=5的WMLE形状估计在n从10减至7时，SD下降，负偏差却加重，RMSE仍然上升。各方法不仅误差增幅不同，误差增长的表现也可能不同。\u003c/p\u003e", "hash": "84c2d90b9e02c75106d950e47521deec37970f8792c037ae63f49306ff1f2784"}]}], "selected_ids": [], "content_hash": "8dccfb3b10559115f3e400a8680ce994a4a16d677154f0b1937256f1ada05923"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计范围通常更宽，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和K–R则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e另外，LSE、LRE的位置估计进一步向γ=0聚集，这在n=50时已可见，n=7时边界结果更多。原尺度密度图也呈双峰外观；后续核对发现，剔除零位置结果后未保留两个明显峰，因此这里将边界聚集与非边界估计的偏移分别考察，不据原图认定存在“接近真值与偏移”的两个内部群体。\u003c/p\u003e", "hash": "0c634936b757e34fee87304ee237e7e7260bdccd1b977fbefd31441477dfdc6c"}]}], "selected_ids": [], "content_hash": "4a8d814c717f0a3f0492986c5df3c667827aa993399979063230346999fedf4f"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": "anomaly-phenomena", "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "modify", "selected": "synthesis-phenomena", "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": ["synthesis-phenomena"], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-opening", "kind": "text", "html": "\u003cp\u003e以下分别解释样本减少时的方法响应差异、较大β下的偏移与分布分化，以及明显异常估计的形成。\u003c/p\u003e", "hash": "ebe6539cb8f6c32e5c836951c4da6652ae6c9772693906a51d652ef829a31731"}]}], "content_hash": "57ce3566ac9fcf3097a4450dd0b6a19a7e5ff1c41c256e08b6c7d61fe45b9c03"}, {"id": "mechanism-high-beta", "title": "3.1　样本减少与方法响应的差异", "mode": "content", "state": "modify", "selected": "mechanism-minimum", "options": [{"id": "mechanism-minimum", "label": "当前内容", "blocks": [{"id": "same-sample-intro", "kind": "text", "html": "\u003cp\u003e先固定n=7，观察同一组样本经过不同方法后怎样得到不同参数。图中的点来自原始观测，各条曲线使用存档参数绘制。\u003c/p\u003e", "hash": "0bfbccc63b29042eac00be3dbac55110ee21c3bb89ac8fc0911bbde117450157"}, {"id": "same-sample-fits", "kind": "gallery", "aspect_ratio": 2.5, "images": [{"id": "near", "label": "样本1055：最小观测较低", "src": "assets/同样本拟合_n7_较近起点.png", "alt": "同一组七个观测的四方法拟合曲线及三参数估计"}, {"id": "far", "label": "样本474：最小观测较高", "src": "assets/同样本拟合_n7_较远起点.png", "alt": "另一组七个观测的四方法拟合曲线及三参数估计"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "same-sample-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eW(5,1000,500)，n=7。两例按样本最小值的25%与75%分位附近选取，未按方法精度筛选。黑点纵坐标为(i−0.5)/n，仅作展示；底部刻线为实际寿命观测，各法仍采用自身原判据。右图为参数估计与真值之比。\u003c/em\u003e\u003c/p\u003e", "hash": "6a6703be420e7ab19104abfc6f2d8660cc2a035f08f8bf0c2cabf242ad161684"}, {"id": "same-sample-reading", "kind": "text", "html": "\u003cp\u003e两例中，多条拟合曲线在观测范围内较接近，但对应的参数明显不同。第二组样本的观测集中在较窄区间，各方法的拟合曲线也比真实分布更集中；少量观测难以完整体现总体分布的宽度与起点。\u003c/p\u003e\u003cp\u003e同样的七个点并不唯一指定一组参数。K–R直接把最小观测作为位置；MDM按伪尺度梯度阈值定位；WMLE要求加权方程同时满足；LSE选择线性匹配较好的位置。因此，一种方法可能通过提高位置、降低尺度来适应这些点，另一种方法则选择更低位置和更大尺度，形状也随之调整。\u003c/p\u003e\u003cp\u003e样本减少使局部间距和有限覆盖更容易影响估计。各方法的定位依据、校准和约束不同，传递到参数的偏差与波动也不同。是否更适应小样本，要看这种响应在重复样本上的表现，不能由一组拟合曲线决定。\u003c/p\u003e", "hash": "bbb7f37d4ace5d0a8b209983eecc7c6c934c3ec3ba2bc59a44d05007a3631ccf"}, {"id": "n-rule-transfer", "kind": "text", "html": "\u003cp\u003e这种响应差异可以回到参数构造理解：直接以最小值定位时，下端空缺会直接转为位置高估；按固定梯度阈值定位时，样本间距会改变交点；按线性匹配定位时，同一间距变化则通过最佳拟合位置和回归斜率传递。相同的样本变化经过不同判据，可能更多表现为方向性偏移，也可能更多表现为重复波动。\u003c/p\u003e", "hash": "0b608af1a5493a7e7966a4c3468b683f3ec737fe73a758dc7fb6a4f1046ec961"}, {"id": "c-criterion-examples", "kind": "gallery", "aspect_ratio": 1, "images": [{"id": "c-mdm", "label": "MDM：阈值交点", "src": "assets/R00_MDM_梯度阈值与参数条件.png", "alt": "Research00中MDM阈值曲线随β和n变化的诊断"}, {"id": "c-lse", "label": "LSE：定位判据", "src": "assets/R00_LSE_判据与参数条件.png", "alt": "Research00中LSE位置判据随β和n变化的诊断"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-criterion-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e复用Research00报告1的MDM和LSE诊断：β=2、5，n=7、15、30，η=1000、γ=500。每条曲线对应一组历史样本，显示定位关系随样本条件的变化；不并入本轮1200次统计。\u003c/em\u003e\u003c/p\u003e", "hash": "66909fea6c32220b36d9867b26fa1751e17c2d46eeed0144c9af37153e2fd366"}, {"id": "n-criterion-interpretation", "kind": "text", "html": "\u003cp\u003eMDM通过同一阈值确定位置，曲线变化可以使交点产生有方向的移动；LSE在一段位置范围内的拟合质量可能十分接近，间距变化则容易改变所选位置。两种定位规则由此产生不同的偏差和波动变化。\u003c/p\u003e", "hash": "2179a82cc94cb2b79c5470597a6abfd5c11c9cc8fa504fa6ca98bc0bf174e3e6"}, {"id": "n-kr-exact", "kind": "text", "html": "\u003cp\u003e对直接以最小值定位的K–R，可以进一步得到精确的样本量关系：\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmsup\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmsqrt\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msqrt\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cp\u003e即使只看这一种方法，误差对n的响应也取决于β。不同方法采用不同统计量和定位判据，不能预期它们都按同一速度随样本减少而变差。\u003c/p\u003e", "hash": "a0f8d337f768da78d115bf0f454aba15630886d874396de7b41a9a1112ee51fc"}]}], "selected_ids": ["mechanism-minimum"], "content_hash": "8c914caa9368c5cac2af1bdd4d6750902c758d4552f832a8a60e2abccd1347a6"}, {"id": "mechanism-n", "title": "3.2　形状条件下的偏移与分布分化", "mode": "content", "state": "modify", "selected": "mechanism-n-current", "options": [{"id": "mechanism-n-current", "label": "当前内容", "blocks": [{"id": "high-beta-opening", "kind": "text", "html": "\u003ch4\u003e起点附近缺少观测\u003c/h4\u003e", "hash": "9117dead64280cee48a24c99f8768fe5701b8666596d6c5f5d224dd71e6d4b59"}, {"id": "origin-probability-figure", "kind": "image", "src": "assets/机制_近起点观测缺失概率.png", "alt": "固定相对距离0.5η，最小观测超过该距离的概率随β及n变化", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003eβ增大时，所有观测均落在γ+0.5η以外的概率上升；n越小，这种情况越常见。起点到最小观测之间缺少数据，位置参数需要由较远处的观测外推。\u003c/p\u003e\u003cp\u003e\u003cem\u003e曲线由独立完整样本的精确关系P[T₍₁₎ \u0026gt; γ+aη]=exp(−na\u003csup\u003eβ\u003c/sup\u003e)计算，取a=0.5；该距离用于展示，不是异常判定阈值。\u003c/em\u003e\u003c/p\u003e", "hash": "6f4545c325c61243d07dd671d4aa08a93d8d5c2f574fd17490e472aa2dae086c"}, {"id": "compatible-heading", "kind": "text", "html": "\u003ch4\u003e参数可以联动，使中部分布保持接近\u003c/h4\u003e", "hash": "9e0b13275c1266a8539693ff5619cd2ead0f930815fb45880c9b25932bd3cd3d"}, {"id": "compensation-controlled-figure", "kind": "image", "src": "assets/机制_参数补偿与分布相容.png", "alt": "固定γ+η及η/β的参数变化在β1.5与5条件下的分布对照", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "compatible-combinations-explanation", "kind": "text", "html": "\u003cp\u003e图中将位置分别向两侧移动，同时调整形状和尺度，保持γ+η和η/β不变。右图三条曲线在中部更接近：参数已有明显差别，但分布差别仍较小。这提供了一条产生联合偏移的可能路径；方法实际选中哪一组参数，还取决于其估计判据。\u003c/p\u003e\u003cp\u003e\u003cem\u003e这是受控参数对照，不是新增拟合结果。灰区为各基准分布的10%—90%分位区间；两图采用相同位置改变量。构造依据复用Research00报告1的参数相容解释。\u003c/em\u003e\u003c/p\u003e", "hash": "725c64d23a31ecfb76d841237e70aeabebb444105ac19150c19c6d7d8926e806"}, {"id": "local-combinations", "kind": "text", "html": "\u003cp\u003e在高β的分布中部，写成\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmi\u003eexp\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，其中\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmi\u003eE\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e、\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ex\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，一阶近似给出\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mfrac\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e", "hash": "db4ea1e71cd63a6e98c7a05259d1f61e2bdaf6ae418e83042d8028d585dc7f3f"}, {"id": "combination-meaning", "kind": "text", "html": "\u003cp\u003e一阶近似中，γ+η控制寿命水平，η/β控制离散程度，解释了图中参数补偿的方向。\u003c/p\u003e", "hash": "89e87a20aead920c5a701e87396dded52b0b51d8fcd65e801f3d39eab00225c7"}, {"id": "parameter-transfer-observation", "kind": "text", "html": "\u003ch4\u003e估计判据怎样选出偏移的参数\u003c/h4\u003e", "hash": "4a91bda0da91bd559755c605f268789f4345a5c15e30e809345b752aca9742a2"}, {"id": "mdm-parameter-transfer", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00：MDM的定位交点怎样传递为形状和尺度的偏移", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "mdm-parameter-transfer-explanation", "kind": "text", "html": "\u003cp\u003eResearch00的MDM示例给出了实际选择路径：固定真位置时，形状估计较接近真值；阈值交点选出较高位置后，形状和尺度随之降低。位置上移改变了观测到起点的距离比例，后续形状与尺度恢复也随之改变。这一图例把三个参数的偏移连接到同一个定位过程。\u003c/p\u003e", "hash": "a42c682e6361cd900c445b1e2b2316faaf67a2d84949562d584341aa18ce6ec6"}, {"id": "mdm-transfer-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e复用Research00报告1图5：β=2、5，n=7的第48组配对样本，MDM δ=0.10。蓝点为固定真位置的条件估计，橙叉为原返回结果。\u003c/em\u003e\u003c/p\u003e", "hash": "ec3f9d4212cf20f2e5ffd4e62abf985137c1ec61470ae282dd9aaa42c809768f"}, {"id": "boundary-origin", "kind": "text", "html": "\u003ch4\u003e估计判据怎样把结果推到边界\u003c/h4\u003e", "hash": "0a6a2dfb9536ee788e712d4f06719349a5eed1650b702cc187fb0521898c6da3"}, {"id": "boundary-profiles", "kind": "gallery", "aspect_ratio": 1.5, "images": [{"id": "n-50", "label": "β = 5，n = 50", "src": "assets/尺度双峰_边界与参数补偿_n50.png", "alt": "β=5、n=50，LSE与LRE的位置尺度配对及位置准则廓线"}, {"id": "n-7", "label": "β = 5，n = 7", "src": "assets/尺度双峰_边界与参数补偿_n7.png", "alt": "β=5、n=7，LSE与LRE的位置尺度配对及位置准则廓线"}], "markdown": "#### β = 5，n = 50\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n50.png)\n\n#### β = 5，n = 7\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n7.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "boundary-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。\u003c/em\u003e\u003c/p\u003e", "hash": "edceb5fee3de3d22242ad7b3fd546d21efec9c3c848d7331cf933dbd32aa0a1f"}, {"id": "boundary-verification", "kind": "text", "html": "\u003cp\u003e上排中，位置与尺度沿相反方向变化；下排的边界样本中，准则向低位置方向仍在改善，但非负约束将返回值截在γ=0。加密搜索仍得到零位置，向负位置延伸则继续改善。这些例子支持“判据倾向与参数约束共同形成边界解”的解释。\u003c/p\u003e", "hash": "36f404d51ed9652c601e05a4092619e8cd23229aabe7647d369fc419e9e38bef"}, {"id": "interior-mode-check", "kind": "text", "html": "\u003cp\u003e上述图解释了参数相容、方向性偏移和边界选择。现有非边界结果尚未验证出两个明显的估计群体，因此这里不将参数相容进一步解释为双峰的成因。\u003c/p\u003e", "hash": "52653e06795dc6944f41eb0da5926241759f6a52205bc2dd73906f1efd166d1d"}]}], "selected_ids": ["mechanism-n-current"], "content_hash": "21c725c223a4025cadfb14784b3d54d8913e034f0fb55560e74e30d2fa5f32b4"}, {"id": "mechanism-boundary", "title": "3.3　明显异常估计的形成", "mode": "content", "state": "open", "selected": "mechanism-boundary", "options": [{"id": "mechanism-boundary", "label": "当前内容", "blocks": [{"id": "anomaly-mechanism-opening", "kind": "text", "html": "\u003cp\u003e明显异常估计需要区分两种来源：样本经估计准则得到偏离真值的参数，以及计算过程没有正确求得该准则要求的解。两者都能表现为参数异常，但形成环节和改进方向不同。\u003c/p\u003e\u003ch4\u003e样本结构怎样形成异常参数\u003c/h4\u003e\u003cp\u003e下端观测成簇、最小值孤立，或远端存在单个观测，都会改变观测距离的相对关系。少数观测在小样本中占比更高，这些结构对定位和参数恢复的影响也更突出。\u003c/p\u003e", "hash": "75aa62c110a584a8a2e5e2676cb205313ed8950c8968bfc7a268b2eee0796c70"}, {"id": "anomaly-statistical-cases", "kind": "gallery", "aspect_ratio": 1.684, "images": [{"id": "lse-right", "label": "改善线性匹配，但形状明显低估", "src": "assets/R00_报告2_LSE_right.png", "alt": "Research00报告2：LSE正常与异常样本，所选位置与形状恢复的对照"}, {"id": "wmle-low", "label": "方程残差接近零，但参数明显偏离", "src": "assets/R00_报告2_WMLE_low.png", "alt": "Research00报告2：WMLE正常与异常样本的残差、共同交点和尺度恢复"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-statistical-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e复用Research00报告2图7、图12。LSE例为W(2,1000,500)、n=7的第18、19组；WMLE例为W(5,100,500)、n=7的第3、11组。图中保留原批次实现与参数范围，仅说明形成路径。\u003c/em\u003e\u003c/p\u003e", "hash": "d38d60a82693ee5ab191afa8bf31eb1482e8e38e27b87f69ed94d7ba14d7a4c8"}, {"id": "anomaly-statistical-explanation", "kind": "text", "html": "\u003cp\u003eLSE的异常样本有一个远端观测，点列在真位置下的线性匹配较差。将位置向最小观测移动，能改善匹配，但也拉开下端对数距离，使回归斜率增大。形状取斜率倒数后明显降低。异常参数由当前判据选出的较好拟合形成。\u003c/p\u003e\u003cp\u003eWMLE的例子中，异常样本的下端观测集中，两条加权方程的共同交点移向较高位置、较低形状。迭代残差已接近零，尺度恢复后仍明显偏低。方程得到满足，并不保证小样本估计接近真值。\u003c/p\u003e\u003cp\u003e两例说明，样本结构既能改变拟合判据，也能改变方程交点；随后经参数恢复，将局部间距差异转成较大的参数偏离。\u003c/p\u003e", "hash": "04e847bd8fd5e8a57eee20979bc2d529bd083102e9d05733b9a2d93fe17e147d"}, {"id": "anomaly-numerical-heading", "kind": "text", "html": "\u003ch4\u003e计算过程也可能制造异常\u003c/h4\u003e", "hash": "c9ecb417812966c37102dd2c3f59b89a89732abb2b810791b22667169de3eb9b"}, {"id": "anomaly-numerical-case", "kind": "image", "src": "assets/R00_报告2_MLE_stop.png", "alt": "Research00报告2：旧MLE的近零停点仍存在提高似然的方向", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-numerical-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e复用Research00报告2图17：W(2,1000,3000)、n=7的第37、38组，采用旧MLE求解程序。本轮Study04已更新求解器，此图不表示新版仍保留同一问题。\u003c/em\u003e\u003c/p\u003e", "hash": "acb9254c90ab1005bfa209326af9d8beb12090b059032dbb482aa03d6da114a6"}, {"id": "anomaly-numerical-explanation", "kind": "text", "html": "\u003cp\u003e旧MLE的异常例子停在接近零的位置，优化器报告收敛，但沿位置方向仍能提高似然。其他起点返回的候选又被接受条件剔除，最后留下这个近零停点。位置偏低压缩了对数距离的跨度，进一步得到偏大的形状。\u003c/p\u003e\u003cp\u003e这里应检查搜索、停止和候选接受过程。相比之下，前面的LSE判据与WMLE方程确实支持其异常参数，仅改进搜索未必能消除偏离。区分这两类来源，才能判断应改求解过程，还是研究方法对样本结构的敏感性。\u003c/p\u003e", "hash": "b4b62cf8d5647fbee68dbbf9da3de74b4b67174ad764075ff70a7119f0681c00"}]}], "selected_ids": ["mechanism-boundary"], "content_hash": "63e86017a45ff3335470277fc3693f29eadffd74a563da45315da822bf230084"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "e3fd2ef8f7aafb49100bbc3f051eb7df131fbef02e3c5c82591f1d6d092ce4ec"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "0babfbb7e3a1e221c4d06c779bdaa26f4138384557353592701cfac6d8e42071"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}], "last_applied_submission_id": "aa1d57c1-5dfb-4203-8f9d-25b4797f346a", "last_rendered_submission_id": "e00442e3-e72d-4003-9302-c68ca61e718f", "outline_confirmed": true, "review_complete": true, "review_runtime": "0.7.1", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parameters": ["beta", "eta", "gamma"], "subsets": ["own", "common"]}, "shape_winner_transition": {"beta": [4.5, 5], "n": [50, 20, 15, 10, 7], "winners": ["WMLE", "WMLE", "WMLE", "MDM-0.1", "MMLE(KR)"], "subsets": ["own", "common"]}, "gap_checked_regions": {"expanded_beta": [1.5, 2, 2.5, 3], "contracted_beta": [4.5, 5], "n": [50, 7], "parameters": ["beta", "eta", "gamma"]}}, "chapter3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "checked_subsets": ["own", "common"], "historical_scope": "Research00机制示例：β=2、5，n=7、15、30；不并入Study04统一1200次比较。", "r00_figure_sources": {"assets/R00_图3_参数组合与样本相容.png": "Research/00-方法对比/交付/结果/报告1/图2_样本与分布相容.png", "assets/R00_MDM_梯度阈值与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图3_MDM六格机制.png", "assets/R00_LSE_判据与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图4_LSE六格机制.png", "assets/R00_WMLE_联合方程与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图6_WMLE六格机制.png", "assets/R00_MDM_位置形状尺度传递.png": "Research/00-方法对比/交付/结果/报告1/图4_MDM参数传递.png", "assets/R00_报告2_LSE_right.png": "Research/00-方法对比/交付/结果/报告2/配对情形_LSE_right.png", "assets/R00_报告2_WMLE_low.png": "Research/00-方法对比/交付/结果/报告2/配对情形_WMLE_low.png", "assets/R00_报告2_MLE_stop.png": "Research/00-方法对比/交付/结果/报告2/配对情形_MLE_stop.png"}, "explanation_limit": "K–R的n响应来自最小值分布的精确关系；MDM为历史受控诊断与本轮统计的对应解释；边界混合分解为本轮逐次结果的精确分组，边界来源核对限于已有8个廓线案例。尚未逐一量化全部方法对RMSE距离变化的机制贡献。", "phenomenon_explanation_check": "结果呈现/分析数据/现象解释补图核对.json", "precision_relationship_options": {"status": "第26轮候选保留在Git；第29轮按用户指定的章节对应关系重组为正文，未执行候选C的配对删样或干预。", "analysis": "结果呈现/分析数据/精度关系解释候选核对.json", "scope": "四条件位置误差分层诊断复用于3.1；不是全部方法与参数的完整机制分解。", "new_estimates": false, "boundary": "A为误差组成解释；B为分层与重加权诊断；C的配对删样和干预尚未执行。", "previous_version": "Git ba6052f2保留第25轮原3.2。"}, "anomaly_reference_check": "结果呈现/分析数据/异常现象与素材复用核对.json", "anomaly_reference_scope": "280个方法条件的异常频率逐项与原始行对拍；2.3为Study04现象，3.3报告2图为历史机制示例，旧MLE停止问题不作为新版现状。", "interior_modes": "结果呈现/分析数据/同样本拟合与内部峰核对.json；三带宽四条件非边界尺度密度均单峰，未支持独立于边界的双峰。"}, "manuscript_version": "2.0", "archive_targets": {"output": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v2.0.md", "previous": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v1.2.md", "archive": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/其他/历史版本/报告下（方法对比）-v1.2.md", "sync_remote": true}, "accepted_revision": 32, "accepted_at": "2026-10-23T03:14:33.418174+00:00", "processing": false, "manuscript_date": "2026-10-23"}</script>

 if(pending)saveNote();const existing=draft.units[unit.dataset.unit].annotations.find(a=>a.option_id===block.dataset.option&&a.block_id===block.dataset.block&&a.block_hash===block.dataset.hash&&a.start===start&&a.end===end&&a.quote===source.slice(start,end));openEditor(existing?{...existing,unit_id:unit.dataset.unit}:{id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())
}
document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return deleteNote(pending);if(structuredNote(pending)){storeNote(pending,comment);draft.submission_id=null;closeEditor(false);persist();renderComments();return true}const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;$('delete-note').onclick=()=>deleteNote(pending);
function editorKeydown(event){if(event.isComposing||event.keyCode===229)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!saveNote())$('editor-input').focus();updateOutlineStatus()}if(event.key==='Escape')closeEditor()}
$('editor-input').addEventListener('keydown',editorKeydown);
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function sidebarNote(anchor,comment){const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',comment));const tools=el('div','annotation-tools'),edit=el('button','quiet','修改'),remove=el('button','quiet','删除');edit.type=remove.type='button';edit.onclick=()=>editNote(anchor,card.getBoundingClientRect());remove.onclick=()=>deleteNote(anchor);quote.onclick=()=>{const target=anchor.block_id?blockNode(anchor.unit_id,anchor.option_id,anchor.block_id):unitNode({id:anchor.unit_id});target?.scrollIntoView({block:'center',behavior:'smooth'})};tools.append(edit,remove);card.append(tools);$('comments').append(card)}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>editNote({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>deleteNote({...anchor,unit_id:unit.id});tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
