u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计结果通常更分散，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e随着β增大，LSE、LRE的位置估计还进一步向γ=0聚集；n=50时已可见，n=7时边界结果更多。\u003c/p\u003e", "hash": "0f90ce7cd26fca6ea3916268f94bd05d16da9de42a7c378933a4ef598d09c0e0"}]}], "selected_ids": [], "content_hash": "712deb08325fc44234cfe375e02b4c9097ea24154e952662c0aaef5ffd671c85"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": null, "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "selected_ids": [], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "open", "selected": null, "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": [], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-chapter-opening", "kind": "text", "html": "\u003cp\u003e样本量和形状条件通过改变观测覆盖及样本间距，影响参数组合的区分与各方法的选择。下面先看同一条删点路径，再结合判据剖面和参数恢复，解释偏移、边界聚集及明显异常怎样形成。\u003c/p\u003e", "hash": "be81bcd1e5a74523f94e69f5d5b3fe19b8cd1f4de04abcd4303ab39a2fef95d4"}]}], "content_hash": "9f7942f6b61bb1dc922681416883d50be0e781d3434224655bf2b0fd56a48337"}, {"id": "mechanism-high-beta", "title": "3.1　样本量减小时不同方法的误差增长机制", "mode": "content", "state": "modify", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "当前正文", "blocks": [{"id": "n61-576d37db172f", "kind": "text", "html": "\u003ca id=\"mechanism-current\"\u003e\u003c/a\u003e\u003cp\u003e2.1显示，样本量由大变小时，误差总体增大，但不同方法的增幅不同。本节解释这条传递链：n减小改变样本信息，信息变化进入各法的判据或定位依据，使估计出现更大的方向性偏移或样本间波动，进而推高RMSE。各法判据和定位规则不同，对这些变化的放大或抑制也不同。先以β=5分解增长并观察判据，再用β=3的MDM两偏移量对照核对稳定性。\u003c/p\u003e", "markdown": "2.1显示，样本量由大变小时，误差总体增大，但不同方法的增幅不同。本节解释这条传递链：n减小改变样本信息，信息变化进入各法的判据或定位依据，使估计出现更大的方向性偏移或样本间波动，进而推高RMSE。各法判据和定位规则不同，对这些变化的放大或抑制也不同。先以β=5分解增长并观察判据，再用β=3的MDM两偏移量对照核对稳定性。", "hash": "39876295ad58f007615e988e3479ad03988713de6678bbb352c7dcdd91432559"}, {"id": "n55-597332758fe9", "kind": "text", "html": "\u003ch4\u003e误差增长中，偏差和波动各贡献多少\u003c/h4\u003e", "markdown": "#### 误差增长中，偏差和波动各贡献多少", "hash": "6762aa9222010360f9e71c9dbdf5e71151599d269e4c407fe92d1c67871aed9d"}, {"id": "n56-d80e862505a8", "kind": "image", "src": "assets/31S_误差平方组成_β5.png", "alt": "固定β=5时六法的误差平方组成", "markdown": "![固定β=5时六法的误差平方组成](reviewbyhtml/方法对比-v1.0/assets/31S_误差平方组成_β5.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n56-39333cb5253b", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化。统计采用各n七法共同有效集合，与第二章相同。\u003c/em\u003e\u003c/p\u003e", "markdown": "*三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化。统计采用各n七法共同有效集合，与第二章相同。*", "hash": "99a9342d211aa50d97d0e040143be24d1fd88952d2282c9c107cd947a4fcb284"}, {"id": "n56-88448208d171", "kind": "text", "html": "\u003cp\u003e这张堆叠图将误差平方拆开：\u003c/p\u003e", "markdown": "这张堆叠图将误差平方拆开：", "hash": "d95a640e67b8a42a1bad32a5ddbc9f90b1c91392ef53c4f328c98c7caf4e3d16"}, {"id": "n55-1ef6b19655c2", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mfrac\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eSD\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\operatorname{RMSE}^2=\\operatorname{Bias}^2+V_R,\\qquad\nV_R=\\frac{R-1}{R}\\operatorname{SD}^2.\n$$", "hash": "30e1666b46b33b3b141ab897d605e6763a964af7b0085f97039f1a352eb00962"}, {"id": "n55-ffdffc2c221b", "kind": "text", "html": "\u003cp\u003e这里R为有效重复次数，SD采用样本标准差。比较n=50与n=7时，增长也能逐项相减：\u003c/p\u003e", "markdown": "这里R为有效重复次数，SD采用样本标准差。比较n=50与n=7时，增长也能逐项相减：", "hash": "d15d8b1af5d87a5be4cb40c9efd27756697504a4b5866d8188b4b5a9532011a2"}, {"id": "n55-093cad5a9e83", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\Delta\\operatorname{RMSE}^2=\\Delta\\operatorname{Bias}^2+\\Delta V_R.\n$$", "hash": "f76523fa011f7d995898b17fd26eba1b47cabb9878100d1222604492ce20464b"}, {"id": "n55-e857be63efc0", "kind": "text", "html": "\u003cp\u003eΔ取“n=7减n=50”。正项推动误差平方增长，负项抵消增长；RMSE增大并不要求Bias的绝对值与SD同时增大。\u003c/p\u003e", "markdown": "Δ取“n=7减n=50”。正项推动误差平方增长，负项抵消增长；RMSE增大并不要求Bias的绝对值与SD同时增大。", "hash": "3bbbc9feffa01b18b57655078bce36bd16f70af663e43be7b272ca413e350648"}, {"id": "n55-69ddaf3abee4", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法（β=5，形状估计）\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔRMSE²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔBias²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔ方差\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMDM(0.1)\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1357\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1461\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0103\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2315\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0005\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2320\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0000\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2228\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2399\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0171\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4687\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0160\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4527\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0267\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0216\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0051\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法（β=5，形状估计） | ΔRMSE² | ΔBias² | Δ方差 |\n|---|---:|---:|---:|\n| MDM(0.1) | +0.1357 | +0.1461 | -0.0103 |\n| LSE | +0.2315 | -0.0005 | +0.2320 |\n| LRE | +0.1958 | +0.0000 | +0.1958 |\n| WMLE | +0.2228 | +0.2399 | -0.0171 |\n| MLE | +0.4687 | +0.0160 | +0.4527 |\n| MMLE | +0.0267 | +0.0216 | +0.0051 |", "hash": "e996135ea7de57acc98b07d2276c21e43930384f99a35dd3c67942db6ba0f59d"}, {"id": "n55-e4c48b64f955", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e表中为标准化误差平方，形状除以真β=5后再平方。各n使用七法共同有效集合，n=50、20、15、10、7分别保留1182、1100、1025、880、644组，集合随n变化；数值是相应条件下有效结果的分解。尺度、位置及含MM的完整表见\u003ca href=\"#growth-supplement\"\u003e补充\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*表中为标准化误差平方，形状除以真β=5后再平方。各n使用七法共同有效集合，n=50、20、15、10、7分别保留1182、1100、1025、880、644组，集合随n变化；数值是相应条件下有效结果的分解。尺度、位置及含MM的完整表见[补充](结果呈现/比较探索/3.1误差增长分解.md)。*", "hash": "65994f20d534b0e9fe62440c99ac2bcf4a825c857ece62114fd961e2dcb1d810"}, {"id": "n55-4ba7d4578386", "kind": "text", "html": "\u003cp\u003e在这套比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差；MDM(0.1)和WMLE主要来自偏差平方增加，方差项反而下降。MMLE的形状误差增量较小，也主要由偏差平方组成。以MDM(0.1)为例，Bias由−1.46变为−2.41，SD由0.75降为0.55，RMSE仍由1.64增至2.47；LSE的Bias约由+0.24变为+0.21，SD由2.03增至3.15，RMSE由2.04增至3.16。\u003c/p\u003e", "markdown": "在这套比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差；MDM(0.1)和WMLE主要来自偏差平方增加，方差项反而下降。MMLE的形状误差增量较小，也主要由偏差平方组成。以MDM(0.1)为例，Bias由−1.46变为−2.41，SD由0.75降为0.55，RMSE仍由1.64增至2.47；LSE的Bias约由+0.24变为+0.21，SD由2.03增至3.15，RMSE由2.04增至3.16。", "hash": "bf6cf1a0a8663489a3f7ba07c0d99a918e49a2a75f15357983c70d2a3aa85f6b"}, {"id": "n55-9368fc85b7f1", "kind": "text", "html": "\u003cp\u003e这些分解先说明“增长在哪里”，接着才解释“为什么不同”。共同有效集合收缩也会影响条件SD，不能把上表直接当作全部1200次抽样的波动；后面的两δ对照使用每档完整1200组共同样本，单独核对规则改变后的分布。\u003c/p\u003e", "markdown": "这些分解先说明“增长在哪里”，接着才解释“为什么不同”。共同有效集合收缩也会影响条件SD，不能把上表直接当作全部1200次抽样的波动；后面的两δ对照使用每档完整1200组共同样本，单独核对规则改变后的分布。", "hash": "739290a3be97209deebc108292a338b24e7d33cde8f490ba950668e31606b76d"}, {"id": "n52-795b16c7a92b", "kind": "text", "html": "\u003ch4\u003e样本减少怎样放宽对参数组合的限制\u003c/h4\u003e", "markdown": "#### 样本减少怎样放宽对参数组合的限制", "hash": "040afffe1c9246ed310336107cecd74db9b61eacf8db41a5734795d0c02a1a71"}, {"id": "n-population-coverage", "kind": "image", "src": "assets/31H_n减小与下端覆盖.png", "alt": "固定形状时三档样本的观测、最小值、起点空白及最小值理论密度", "markdown": "![固定形状时三档样本的观测、最小值、起点空白及最小值理论密度](reviewbyhtml/方法对比-v1.0/assets/31H_n减小与下端覆盖.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-bd70076f73ef", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近。*", "hash": "8b2d25cb7c7f7c38476db9b2b5897e9128d11975af5431cd5cd65bd0e413b455"}, {"id": "n52-bdb18003e8e0", "kind": "text", "html": "\u003cp\u003e低寿命下端在总体中占比很小，抽取次数减少，更容易一个也没抽到。因此，n减小时，最小观测通常离真实起点更远，起点与最小观测之间的空白更大。以500—1000这段区间为例，整组没有观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。\u003c/p\u003e", "markdown": "低寿命下端在总体中占比很小，抽取次数减少，更容易一个也没抽到。因此，n减小时，最小观测通常离真实起点更远，起点与最小观测之间的空白更大。以500—1000这段区间为例，整组没有观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。", "hash": "63ba18c6bd02356c7b312fdc3b2e593f59ad6df113da2b269ecc6090f0b3338e"}, {"id": "n52-e27e83b1a1e2", "kind": "text", "html": "\u003cp\u003e这段空白首先放宽了候选起点的支持限制。对于以全部观测为支持检查对象的三参数Weibull候选，起点必须低于最小观测。当最小观测右移时，原来因起点过高而不可能解释全部数据的一些组合，便不再被这条支持条件直接排除。与此同时，较小n下没有抽到下端观测，也仍可容许候选分布在那里保留一定概率。方法需要区分的候选因而可能增多，参数仍需由全部观测及具体判据进一步确定。\u003c/p\u003e", "markdown": "这段空白首先放宽了候选起点的支持限制。对于以全部观测为支持检查对象的三参数Weibull候选，起点必须低于最小观测。当最小观测右移时，原来因起点过高而不可能解释全部数据的一些组合，便不再被这条支持条件直接排除。与此同时，较小n下没有抽到下端观测，也仍可容许候选分布在那里保留一定概率。方法需要区分的候选因而可能增多，参数仍需由全部观测及具体判据进一步确定。", "hash": "903281b6fbdb6d69a8f6f00d157b2aa82e5914fb37fdf7ffeb34bbf57d663216"}, {"id": "n58-562bb59f4744", "kind": "text", "html": "\u003cp\u003e起点的位置还会与形状、尺度相互补偿：位置改变后，另两参的调整可能让候选分布在观测集中的区间内仍然相近。因而，支持条件放宽只说明部分候选不再被直接排除，最终选中什么位置，还取决于具体方法怎样比较这些参数组合。下面沿四种定位规则追踪同一批样本的响应。\u003c/p\u003e", "markdown": "起点的位置还会与形状、尺度相互补偿：位置改变后，另两参的调整可能让候选分布在观测集中的区间内仍然相近。因而，支持条件放宽只说明部分候选不再被直接排除，最终选中什么位置，还取决于具体方法怎样比较这些参数组合。下面沿四种定位规则追踪同一批样本的响应。", "hash": "4f6878f5179a651f61a8edd64ca78c51176d159109c182e00ae32f80d4e19d68"}, {"id": "n55-98f690afafda", "kind": "text", "html": "\u003ch4\u003e用共同样本看四种规则怎样确定位置\u003c/h4\u003e", "markdown": "#### 用共同样本看四种规则怎样确定位置", "hash": "3d7bf065c2b42631ccce4af2e9ff97373224abf479b53992692ff008ac4a1589"}, {"id": "n55-a75b92ec2382", "kind": "text", "html": "\u003cp\u003e减点诊断固定使用MLE、MMLE、MDM(0)和MDM(0.1)。从1200份正式50点样本预先每10个编号取一份，共120条路径；按固定随机排列依次保留50、20、15、10、7点，四法在每档使用完全相同的观测。\u003c/p\u003e", "markdown": "减点诊断固定使用MLE、MMLE、MDM(0)和MDM(0.1)。从1200份正式50点样本预先每10个编号取一份，共120条路径；按固定随机排列依次保留50、20、15、10、7点，四法在每档使用完全相同的观测。", "hash": "41f499511b433ca081a085f93df17d3313b31b0f6f175e457a4c1aaa84757a54"}, {"id": "ten-gamma-paths-anchor", "kind": "text", "html": "\u003ca id=\"ten-gamma-paths\"\u003e\u003c/a\u003e", "hash": "083593d9f983ae4ba49bcf92af6f43ae05e93f971585b5dbc4a05eb3908e5d1a"}, {"id": "n57-e07ad89511cf", "kind": "image", "src": "assets/31T_十组叠加定位判据.svg", "alt": "每个n与方法坐标系内叠加十组样本的定位判据", "markdown": "![每个n与方法坐标系内叠加十组样本的定位判据](reviewbyhtml/方法对比-v1.0/assets/31T_十组叠加定位判据.svg)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n59-5b4d44ed143b", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e五行对应n=50、20、15、10、7，四列对应四种方法，每个剖面格子叠加十组样本。样本号、颜色和线型贯穿全图，横轴均为原始γ；MLE为相对每观测负对数似然，MDM为梯度\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。MMLE只标样本最小值；MLE失败的曲线不标返回点。十组为典型路径，选例及120条完整核对见\u003ca href=\"#population-supplement\"\u003e补充\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*五行对应n=50、20、15、10、7，四列对应四种方法，每个剖面格子叠加十组样本。样本号、颜色和线型贯穿全图，横轴均为原始γ；MLE为相对每观测负对数似然，MDM为梯度$g_n(\\gamma)$。MMLE只标样本最小值；MLE失败的曲线不标返回点。十组为典型路径，选例及120条完整核对见[补充](结果呈现/比较探索/3.1偏移量与廓线群体-结果.md)。*", "hash": "0bfc59ce6f467f1785c9fc34f118b0ceee2f49997e2247737b8f51e2197006c1"}, {"id": "n59-c1752d982aaa", "kind": "text", "html": "\u003cp\u003e沿行向下看，减点使同一样本的判据形状和定位结果改变：MLE低值区及最优位置发生移动，部分选点转向零边界；MMLE位置随最小观测右移；MDM的零梯度选点在平缓区或边界变化较大，而δ=0.1的交点落在梯度上升段。不同样本的响应方向并不一致，也没有各法都随n减小而变平的统一趋势，差别体现为各自规则对同一信息变化的不同响应。\u003c/p\u003e", "markdown": "沿行向下看，减点使同一样本的判据形状和定位结果改变：MLE低值区及最优位置发生移动，部分选点转向零边界；MMLE位置随最小观测右移；MDM的零梯度选点在平缓区或边界变化较大，而δ=0.1的交点落在梯度上升段。不同样本的响应方向并不一致，也没有各法都随n减小而变平的统一趋势，差别体现为各自规则对同一信息变化的不同响应。", "hash": "ffde0478c799d9ade9aa29a28e659d83e1759f6a6c1ec13d2b6bcd517ef61bde"}, {"id": "n59-cd8e0d8177c8", "kind": "text", "html": "\u003cp\u003e判据的变化通过“选点”进入误差：不同样本的最优点向同一侧移动，会加重方向性偏差；最优点在更大范围内散开，或在内部与边界之间转换，会增大重复估计的不稳定性。当判据在一段位置范围内差别很小时，样本的偶然变化就可能重新排列候选优劣，使选点产生较大移动。随后位置变化又通过参数耦合传入形状和尺度。第一幅堆叠图中的偏差项与方差项，正是这些响应在重复估计中的表现。\u003c/p\u003e", "markdown": "判据的变化通过“选点”进入误差：不同样本的最优点向同一侧移动，会加重方向性偏差；最优点在更大范围内散开，或在内部与边界之间转换，会增大重复估计的不稳定性。当判据在一段位置范围内差别很小时，样本的偶然变化就可能重新排列候选优劣，使选点产生较大移动。随后位置变化又通过参数耦合传入形状和尺度。第一幅堆叠图中的偏差项与方差项，正是这些响应在重复估计中的表现。", "hash": "155cb505a7fd0f4f965e7e7d70060466b65b55e0ad3928e084373b01f778475f"}, {"id": "n55-39618b93ac31", "kind": "text", "html": "\u003ch4\u003e不同构造怎样处理这些信息与参数耦合\u003c/h4\u003e", "markdown": "#### 不同构造怎样处理这些信息与参数耦合", "hash": "0441d503650fe8fccb569ca27918265147195bd465204675ea4a3d1e4aeb6110"}, {"id": "n55-0219aa33c985", "kind": "text", "html": "\u003cp\u003e相同观测进入不同方法，会成为不同的估计依据；位置变化又会改变全部观测到起点的距离，进而牵动形状和尺度。这就是从样本信息转向方法视角的连接：各法利用的信息、处理三参数耦合的步骤和选参规则不同。\u003c/p\u003e", "markdown": "相同观测进入不同方法，会成为不同的估计依据；位置变化又会改变全部观测到起点的距离，进而牵动形状和尺度。这就是从样本信息转向方法视角的连接：各法利用的信息、处理三参数耦合的步骤和选参规则不同。", "hash": "6a6c3ffc753035144a7cff55681f33002a64edd42cd78cdd986dd97ff804dcd2"}, {"id": "n52-22c438a8b71a", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e怎样利用样本信息\u003c/th\u003e\u003cth\u003e与样本量变化有关的响应环节\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e用各观测到候选起点的距离构造似然，联合确定三参数。\u003c/td\u003e\u003ctd\u003e对数距离和幂次距离共同影响候选组合的似然高低。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd\u003e将距离、对数距离、幂加权距离和倒数距离放入带有样本量校准权重的估计方程。\u003c/td\u003e\u003ctd\u003e样本统计关系与n相关权重共同改变形状、位置方程的交点。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e以最小观测确定位置，再对删除该点后的正距离估计形状、尺度。\u003c/td\u003e\u003ctd\u003e位置直接受单个极值影响，其误差随后进入其余观测到起点的距离。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd\u003e将排序观测的对数距离与按n确定的理论参考坐标回归，再以相对匹配定位。\u003c/td\u003e\u003ctd\u003e点列、参考坐标及回归斜率共同影响三参数恢复。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE\u003c/td\u003e\u003ctd\u003e用绘图位置形成概率图参考坐标，以相关性定位，再由另一方向的回归恢复参数。\u003c/td\u003e\u003ctd\u003e绘图位置、对数间距和回归方向决定其对点列变化的响应。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e每个位置下使各点反算的伪尺度尽量一致，再以最小标准差的梯度阈值定位。\u003c/td\u003e\u003ctd\u003e伪尺度离散程度、条件形状和梯度交点共同响应样本变化。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMM\u003c/td\u003e\u003ctd\u003e用排序间距的加权和计算Cran的样本Weibull矩，再由矩差关系反演参数。\u003c/td\u003e\u003ctd\u003e间距和n相关权重改变矩组合，非线性反演可能放大矩差的变化。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法 | 怎样利用样本信息 | 与样本量变化有关的响应环节 |\n|---|---|---|\n| MLE | 用各观测到候选起点的距离构造似然，联合确定三参数。 | 对数距离和幂次距离共同影响候选组合的似然高低。 |\n| WMLE | 将距离、对数距离、幂加权距离和倒数距离放入带有样本量校准权重的估计方程。 | 样本统计关系与n相关权重共同改变形状、位置方程的交点。 |\n| MMLE | 以最小观测确定位置，再对删除该点后的正距离估计形状、尺度。 | 位置直接受单个极值影响，其误差随后进入其余观测到起点的距离。 |\n| LSE | 将排序观测的对数距离与按n确定的理论参考坐标回归，再以相对匹配定位。 | 点列、参考坐标及回归斜率共同影响三参数恢复。 |\n| LRE | 用绘图位置形成概率图参考坐标，以相关性定位，再由另一方向的回归恢复参数。 | 绘图位置、对数间距和回归方向决定其对点列变化的响应。 |\n| MDM | 每个位置下使各点反算的伪尺度尽量一致，再以最小标准差的梯度阈值定位。 | 伪尺度离散程度、条件形状和梯度交点共同响应样本变化。 |\n| MM | 用排序间距的加权和计算Cran的样本Weibull矩，再由矩差关系反演参数。 | 间距和n相关权重改变矩组合，非线性反演可能放大矩差的变化。 |", "hash": "849e44bf89497e68c02762919d04933e4b32e2f89a5c171b34848859548f1168"}, {"id": "n59-239f59a936ad", "kind": "text", "html": "\u003cp\u003eMMLE的位置规则为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e：最小观测改变多少，位置就改变多少，位置定位不需要反解平坦准则，也不在多个候选最优点之间搜索。这使它避免了该环节的额外放大，但最小观测偏大仍会直接成为位置偏差。β=5的完整1200组结果中，n从50减到7，位置SD由95.9增至142.8，Bias则由+418.1增至+618.6；因此，它的位置RMSE增长更多体现为偏移加重。形状与尺度随后还受条件估计的影响。\u003c/p\u003e", "markdown": "MMLE的位置规则为$\\hat\\gamma=x_{(1)}$：最小观测改变多少，位置就改变多少，位置定位不需要反解平坦准则，也不在多个候选最优点之间搜索。这使它避免了该环节的额外放大，但最小观测偏大仍会直接成为位置偏差。β=5的完整1200组结果中，n从50减到7，位置SD由95.9增至142.8，Bias则由+418.1增至+618.6；因此，它的位置RMSE增长更多体现为偏移加重。形状与尺度随后还受条件估计的影响。", "hash": "9dce6c4f22b51f6e5e7ea08b86ecc095fc24c0309ab49f6aab9c030cb1a6a692"}, {"id": "n59-5959008ebf1a", "kind": "text", "html": "\u003ch4\u003eMDM用小偏移降低定位敏感性\u003c/h4\u003e", "markdown": "#### MDM用小偏移降低定位敏感性", "hash": "100fbbeeb55e8f1aa15c23d409a247e9cc8afacc20dc01ac9b3a7994124316aa"}, {"id": "n59-379314c93ad8", "kind": "text", "html": "\u003cp\u003eMDM以伪尺度离散程度的廓线梯度定位。零梯度附近较平缓时，样本的小变化也可能让定位点移动较远；引入δ=0.1，把定位目标移向梯度曲线较陡的上升段，部分避开平坦区，从而降低这种位置敏感性。上图两列MDM使用相同曲线，区别正是目标与选中位置。对内部交点，位置响应近似为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmsubsup\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e：同样的判据扰动，在斜率较小时会产生较大的位置移动。小偏移的作用在于减弱这一放大，而不是让样本量下降失去影响。选点改变也会带来偏差，性能需要同时看偏差和波动。\u003c/p\u003e", "markdown": "MDM以伪尺度离散程度的廓线梯度定位。零梯度附近较平缓时，样本的小变化也可能让定位点移动较远；引入δ=0.1，把定位目标移向梯度曲线较陡的上升段，部分避开平坦区，从而降低这种位置敏感性。上图两列MDM使用相同曲线，区别正是目标与选中位置。对内部交点，位置响应近似为$\\Delta\\hat\\gamma\\approx-\\Delta g_n(\\hat\\gamma)/g_n'(\\hat\\gamma)$：同样的判据扰动，在斜率较小时会产生较大的位置移动。小偏移的作用在于减弱这一放大，而不是让样本量下降失去影响。选点改变也会带来偏差，性能需要同时看偏差和波动。", "hash": "73d84a5b7959ffbca26734f0f9ed5a78d39b45b293e7c4e9702e3a73185c6f65"}, {"id": "n61-47c228c4e07c", "kind": "image", "src": "assets/31N_MDM两偏移量估计分布_beta3.png", "alt": "β=3时MDM两种偏移量的共同样本估计分布", "markdown": "![β=3时MDM两种偏移量的共同样本估计分布](reviewbyhtml/方法对比-v1.0/assets/31N_MDM两偏移量估计分布_beta3.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n61-15c858ba8789", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(3,1000,500)，上排n=50，下排n=7；每档两方案使用完全相同的1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。各列共用坐标与分箱，虚线为真值。判据图用β=5展示选参过程，本图用β=3核对重复分布，两个条件不混算。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(3,1000,500)，上排n=50，下排n=7；每档两方案使用完全相同的1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。各列共用坐标与分箱，虚线为真值。判据图用β=5展示选参过程，本图用β=3核对重复分布，两个条件不混算。*", "hash": "065f05b832f16735a8329c56317efbb4375daac75c6e2782f3ba999c11a2bf0e"}, {"id": "n61-67f4e4b3651a", "kind": "text", "html": "\u003cp\u003e在β=3、n=7的配对结果中，位置SD由δ=0时450.5变为δ=0.1时292.7，位置RMSE由461.5变为369.7。这让判据上避开平缓定位区的解释，与重复估计的分布变化对应起来；结论限于当前条件和固定实现。三参数Bias、SD、RMSE及样本来源见\u003ca href=\"#beta3-delta-supplement\"\u003eβ=3核对\u003c/a\u003e。\u003c/p\u003e", "markdown": "在β=3、n=7的配对结果中，位置SD由δ=0时450.5变为δ=0.1时292.7，位置RMSE由461.5变为369.7。这让判据上避开平缓定位区的解释，与重复估计的分布变化对应起来；结论限于当前条件和固定实现。三参数Bias、SD、RMSE及样本来源见[β=3核对](结果呈现/比较探索/3.1-MDM偏移量-beta3结果.md)。", "hash": "1f03aa549fb7927cf6ed1c88a84491279a0952655506ead4c7dbf8de4ffb4b53"}, {"id": "n59-78ab13667f42", "kind": "text", "html": "\u003cp\u003e本节得到的结论是：n减少后，变化的样本信息通过各法判据和定位规则，转化为不同程度的方向性偏移、选点分散或边界响应，最终形成不同的RMSE增幅。MLE、LSE、LRE在当前β=5比较中的形状误差增长主要来自方差，MDM(0.1)、WMLE主要来自偏差平方；MMLE的位置直接映射和MDM的正偏移定位体现了对特定放大环节的抑制。这些稳定作用允许波动较小，也仍可能伴随偏差增长。\u003c/p\u003e", "markdown": "本节得到的结论是：n减少后，变化的样本信息通过各法判据和定位规则，转化为不同程度的方向性偏移、选点分散或边界响应，最终形成不同的RMSE增幅。MLE、LSE、LRE在当前β=5比较中的形状误差增长主要来自方差，MDM(0.1)、WMLE主要来自偏差平方；MMLE的位置直接映射和MDM的正偏移定位体现了对特定放大环节的抑制。这些稳定作用允许波动较小，也仍可能伴随偏差增长。", "hash": "e3439129663deecb547eb4505e6fa59014995afdbb153439172c7d3d42faef9a"}, {"id": "n61-9246d58db50d", "kind": "text", "html": "\u003cp\u003e上述证据解释了典型传递过程，尚未将七法全部RMSE差距逐项分解为独立机制贡献。完整选例、内部与边界统计见\u003ca href=\"#population-supplement\"\u003e群体核对\u003c/a\u003e，β=3重复验证见\u003ca href=\"#beta3-delta-supplement\"\u003e配对核对\u003c/a\u003e。\u003c/p\u003e", "markdown": "上述证据解释了典型传递过程，尚未将七法全部RMSE差距逐项分解为独立机制贡献。完整选例、内部与边界统计见[群体核对](结果呈现/比较探索/3.1偏移量与廓线群体-结果.md)，β=3重复验证见[配对核对](结果呈现/比较探索/3.1-MDM偏移量-beta3结果.md)。", "hash": "69d0f4f80c2d48fb132cb37f34b96d44080fef2278cfdc61e86a1b7e57258ce8"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "2db140e3c0367df38044ce8eafc2338dcad89ef539e5c93c50c564b03b7dfef9"}, {"id": "mechanism-n-background", "title": "3.2　形状条件下的参数区分与估计偏移", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "shape-information-opening", "kind": "text", "html": "\u003ch4\u003e观测约束与参数相容\u003c/h4\u003e", "hash": "a3293b2174d5cd2fc54b297dbc0c88dacf422256597fcbaba0d80057a7b0752c"}, {"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：β=2与5、n=7/15/30时观测、最小观测及其与真实起点的距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003e相同n下，β=5时的最小观测比β=2时更远离真实起点；样本量减小时，这段距离进一步增大。观测集中于分布中部，起点附近缺少数据，位置参数需要从较远处外推。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图2：η=1000、γ=500，β=2、5，n=7、15、30。橙点为每组样本的最小观测，灰线为其到真实起点的距离；下排为最小观测的理论密度。\u003c/em\u003e\u003c/p\u003e", "hash": "a03c7b2d1e3ec5e05ea323044b412cc2034ddf5a62ffa9eef62ad7277416f3e2"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "Research00报告1：W(5,1000,500)与W(2,500,1000)在样本覆盖区间内接近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-compatible-reading", "kind": "text", "html": "\u003cp\u003e图中的两组参数虽然相差较大，在观测覆盖区间内的分布曲线仍较接近。位置、尺度和形状可以相互补偿，有限观测因而容许不同的参数组合。还需要沿各方法的判据，看它怎样区分这些组合并选出参数。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图3：β=5、n=7第31组样本；对照W(5,1000,500)与W(2,500,1000)。黑点累计概率由样本排序近似。\u003c/em\u003e\u003c/p\u003e", "hash": "c2b8071adf993df68dee96de63c402ac55090754078db34dd0321bb334e471d7"}, {"id": "shape-criterion-opening", "kind": "text", "html": "\u003ch4\u003e判据区分能力与优选位置\u003c/h4\u003e", "hash": "7234c2ec043641a64e9f6d397932e6e7fe5ea24cbec6ce809a085d46c974b739"}, {"id": "shape-lse-profile-family", "kind": "image", "src": "assets/R00_LSE_判据与参数条件.png", "alt": "报告1图6：β=2与5、n=7/15/30的LSE位置判据曲线，展示宽缓区与最低点分布", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-lse-profile-reading", "kind": "text", "html": "\u003cp\u003eLSE的图中，β=5时真位置附近多条曲线随候选位置变化较缓，最低点却分散在不同位置。观测较集中时，移动位置主要使对数点列近似整体平移或伸缩，线性匹配的评价改变较小；局部间距的波动便更容易改变优选位置。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图6：η=1000、γ=500；两列为β=2、5，三行为n=7、15、30。每条曲线对应一组样本，橙叉标记原返回位置，竖虚线标记真位置。\u003c/em\u003e\u003c/p\u003e", "hash": "c4a7783ab2612cc08d7e545678037d8090234ac13953834577a0b86e5cd0a38d"}, {"id": "shape-mle-flat-profile", "kind": "image", "src": "assets/R00_异常剖面_MLE_high.png", "alt": "报告2图15：正常与明显高估样本的MLE位置似然剖面、条件形状和样本距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "profile-flat-numbers", "kind": "text", "html": "\u003cp\u003e报告2的单样本把这种宽缓区显示得更直接：第36组的候选位置从0移至约251时，条件形状从23.54降至13.64，对数似然却只下降约0.012。\u003cmark\u003e参数组合已经明显改变，判据评价仍几乎相同；数据对这些组合的区分较弱。\u003c/mark\u003e图中的左端优选位置因此可以与很大的形状、尺度共同出现。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图15：W(2,100,500)、n=15，第35组为正常参照、第36组为高估样本。中列是在各候选位置重新优化得到的条件形状；数值由原图数据核对。\u003c/em\u003e\u003c/p\u003e", "hash": "de9ca258146f1e7af2be05bbe97afdfb023593c7686e393280519fae9f9e4d9a"}, {"id": "shape-selection-opening", "kind": "text", "html": "\u003ch4\u003e定位规则与参数传递\u003c/h4\u003e", "hash": "f74e0ebdf8e78ac1c6433da7228ed184af44260fbc6cdcc3adb9d6c6be26922c"}, {"id": "shape-a-opening", "kind": "text", "html": "\u003cp\u003eMDM按固定梯度阈值定位。高β时，各观测反算的伪尺度随位置变化更接近同步，标准差梯度较小，阈值交点向较高位置移动。位置提高后，小观测到起点的距离缩短比例更大，条件最优形状随之降低，再由伪尺度均值恢复出较小尺度。\u003c/p\u003e", "hash": "233f04f19088a201f5d2709f35427bada394582bb1ba89f329f5cc34feecc4d8"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00报告1：梯度阈值选中较高位置后，形状和尺度随之降低", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-mdm-reading", "kind": "text", "html": "\u003cp\u003e图中从梯度交点沿同一位置读取形状与尺度，位置偏高、形状和尺度偏低便连接为同一条计算路径。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图5：δ=0.1，β=2、5，n=7第48组配对样本。两列比较形状条件，三行依次为梯度、条件形状和伪尺度均值。\u003c/em\u003e\u003c/p\u003e", "hash": "ed088d8be93418dbc98599ece08a7df6d4494b7ec2b12a1a20231f1ad037e148"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "Research00报告2：LSE左移位置改善线性匹配，最佳位置可落在零边界或内部", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-boundary-reading", "kind": "text", "html": "\u003cp\u003eLSE的左侧优选位置则展示另一方向：左移位置压缩对数跨度，当这能改善线性匹配时，最低点会移向较低位置。橙色样本的最低点落在γ=0，紫色样本仍在内部；非负位置约束把一部分左侧偏移截在零点，形成边界聚集。对数跨度压缩又使回归斜率减小，取倒数后形状升高。报告2中的右侧样本沿相反方向传递：位置靠近最小观测，对数跨度拉大，形状和尺度降低。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图6：正常与零边界样本为W(2,100,500)、n=15第35、36组；内部左偏样本为W(2,1000,3000)、n=7第1组。右侧传递过程见报告2图7。\u003c/em\u003e\u003c/p\u003e", "hash": "7b79d04c1badb2927e58577da8daea083822b209ed40bf043aefb780cc96062b"}, {"id": "profile-method-comparison", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e选择或定位依据\u003c/th\u003e\u003cth\u003e参数怎样联动\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e最小观测直接定位，再拟合保留距离\u003c/td\u003e\u003ctd\u003e位置变化改变距离；保留距离集中或分散，使形状似然峰及恢复尺度改变。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e梯度阈值交点定位\u003c/td\u003e\u003ctd\u003e所选位置改变伪尺度标准差最低点及其均值，带动形状和尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE、LRE\u003c/td\u003e\u003ctd\u003e选择线性匹配或相关性最好的位置\u003c/td\u003e\u003ctd\u003e对数跨度进入回归斜率；LSE取斜率倒数，LRE直接取斜率，再恢复尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd\u003e两条加权方程的共同交点\u003c/td\u003e\u003ctd\u003e样本距离同时改变两条关系，交点给出位置与形状，尺度由加权关系恢复。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e比较不同参数组合的似然\u003c/td\u003e\u003ctd\u003e宽缓高似然区允许位置、形状和尺度相互补偿，优选组合可明显偏离真值。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "bf652402da62456a229e1654b2d7319a7eaf42636dc75a44e466f5fafffd6d08"}, {"id": "profile-summary-ending", "kind": "text", "html": "\u003cp\u003e\u003cmark\u003e观测约束、判据区分与参数恢复共同决定偏移：宽缓区使不同参数组合难以区分，极值或交点给出选择方向，参数恢复再把变化传到其余参数。\u003c/mark\u003e下端空缺、局部成簇或远端观测会进一步改变这些判据；同样的形成路径在部分样本上产生更大的偏移，表现为第二章的明显异常。\u003c/p\u003e\u003cp\u003e\u003cem\u003e本节复用Research00报告1、报告2的存档机制图，保留各图原条件和实现；不与Study04的1200次正式统计混合。六种方法的完整过程见报告1第2.1—2.6节与报告2第2.1节。\u003c/em\u003e\u003c/p\u003e", "hash": "a1588fee098a03484e3ae30ca95ba45a70f9ca2d6be876b9bd923b1527434af0"}]}], "content_hash": "6cf3d5696f3dba6f905e241c07dba30a920d13d1ad5435e2972daabf63344fea"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "60e3a18b546fd1677a2d2f935ab3875baef2da72bea8ce5f454e020b14b56217"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "1a161b266aac2eba5fcdeeb8bcd4972db1965ec18f91f900609e103c048f4784"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}, {"id": "mechanism-n-supplement", "title": "附：3.1补充核对图", "mode": "content", "state": "open", "selected": null, "options": [{"id": "n-supplement-content", "label": "补充核对", "blocks": [{"id": "n52-19b51b3430e6", "kind": "text", "html": "\u003ca id=\"n-supplement\"\u003e\u003c/a\u003e\u003cp\u003e本页补充\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E6%8A%A5%E5%91%8A%E4%B8%8B%EF%BC%88%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94%EF%BC%89-v2.3.md\"\u003e报告下v2.3第3.1节\u003c/a\u003e，沿同一条474号嵌套路径逐档浏览结果。正文用下端覆盖与候选组合引入耦合，从方法原理解释响应差别，以MDM说明选参和偏差—波动取舍；此处保留共同删点例证、样本、判据、条件恢复和逐档CDF供核对，不以单条路径说明总体RMSE成因。\u003c/p\u003e", "markdown": "本页补充[报告下v2.3第3.1节](../../报告下（方法对比）-v2.3.md)，沿同一条474号嵌套路径逐档浏览结果。正文用下端覆盖与候选组合引入耦合，从方法原理解释响应差别，以MDM说明选参和偏差—波动取舍；此处保留共同删点例证、样本、判据、条件恢复和逐档CDF供核对，不以单条路径说明总体RMSE成因。", "hash": "4cf0b9120c902d0c71f220b39f48bc65abf3b60153de8631638b06875b1242c7"}, {"id": "info31-796fe968bde1", "kind": "text", "html": "\u003cp\u003e五档CDF共用坐标，同一参数的误差也共用纵轴范围。上排每列只画一种方法及真实CDF；黑点寿命坐标是真实观测，纵坐标按各自n计算(i−0.5)/n，仅作展示。下排为估计值减真值，不是重复抽样的平均Bias。每档都是前一档子集；这里的n=7子集不等于正式n=7表中同编号样本。\u003c/p\u003e", "markdown": "五档CDF共用坐标，同一参数的误差也共用纵轴范围。上排每列只画一种方法及真实CDF；黑点寿命坐标是真实观测，纵坐标按各自n计算(i−0.5)/n，仅作展示。下排为估计值减真值，不是重复抽样的平均Bias。每档都是前一档子集；这里的n=7子集不等于正式n=7表中同编号样本。", "hash": "d05dc75ce5fea057c3d616e571cb8660136048c7d98425c134906e2bedf70799"}, {"id": "n52-5ece25d3f4a4", "kind": "text", "html": "\u003ch2\u003e同一共同输入下的误差响应\u003c/h2\u003e", "markdown": "## 同一共同输入下的误差响应", "hash": "1f178af503debd34c9cb1a167b55fa88c83dbd84d6fe331c8dc71f69f7e0890e"}, {"id": "info31-98d6083e6aa0", "kind": "image", "src": "assets/31E_单次误差响应_样本474.png", "alt": "同一474号嵌套删点路径上三种方法的五档三参数误差响应", "markdown": "![同一474号嵌套删点路径上三种方法的五档三参数误差响应](../../reviewbyhtml/方法对比-v1.0/assets/31E_单次误差响应_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-4ec0b7600c43", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(5,1000,500)，从同一份正式50点样本按既有随机排列保留50、20、15、10、7点；每一档三种方法使用相同观测。纵轴为本次估计减真值，虚线为零误差。这条路径用于观察上述构造怎样响应共同输入变化，不是重复抽样的Bias或RMSE。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(5,1000,500)，从同一份正式50点样本按既有随机排列保留50、20、15、10、7点；每一档三种方法使用相同观测。纵轴为本次估计减真值，虚线为零误差。这条路径用于观察上述构造怎样响应共同输入变化，不是重复抽样的Bias或RMSE。*", "hash": "b5d0ff28194f2f50e296581721be2341e96b1471ddd79a3b73018e082b6da054"}, {"id": "n52-e4cb386038b4", "kind": "text", "html": "\u003cp\u003e50→20点时最小观测仍为930.6，MMLE位置保持930.6；MDM位置从733.7变为683.7，LSE从662.5变为550.5。这个例子对应信息利用方式的差别：直接以极值定位的一步不变，依赖整组统计关系与n相关参考量的定位则可以改变。20→15点时最小值升至1222.3，三法的位置及后续恢复参数都发生明显变化。该例说明构造与参数传递的具体过程，不用于决定各机制对总体RMSE差距的贡献。\u003c/p\u003e", "markdown": "50→20点时最小观测仍为930.6，MMLE位置保持930.6；MDM位置从733.7变为683.7，LSE从662.5变为550.5。这个例子对应信息利用方式的差别：直接以极值定位的一步不变，依赖整组统计关系与n相关参考量的定位则可以改变。20→15点时最小值升至1222.3，三法的位置及后续恢复参数都发生明显变化。该例说明构造与参数传递的具体过程，不用于决定各机制对总体RMSE差距的贡献。", "hash": "c564beb56cb74e988ff5e442ab239c8fa2e8d45feb9ca3a2eaea37a073e47613"}, {"id": "info31-885f8e1ef627", "kind": "text", "html": "\u003ch2\u003e同一条路径实际保留了哪些点\u003c/h2\u003e", "markdown": "## 同一条路径实际保留了哪些点", "hash": "7d03c43ba45200a80c30aeca0c4f4e530a99a63a988771e31d271b5d6dae9d93"}, {"id": "info31-71a550d9522d", "kind": "image", "src": "assets/31C_样本信息变化_样本474.png", "alt": "474号嵌套路径的观测与下端空缺", "markdown": "![474号嵌套路径的观测与下端空缺](../../reviewbyhtml/方法对比-v1.0/assets/31C_样本信息变化_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-3bcf8635a29f", "kind": "text", "html": "\u003cp\u003e深色为当前观测，浅灰为原50点中已删观测，蓝点为当前最小值，橙段为最大相邻间隔。本图只追踪一条路径；正文3.1的31H另用正式各档样本展示最小值分布，3.2保留不同β的共同影响。\u003c/p\u003e", "markdown": "深色为当前观测，浅灰为原50点中已删观测，蓝点为当前最小值，橙段为最大相邻间隔。本图只追踪一条路径；正文3.1的31H另用正式各档样本展示最小值分布，3.2保留不同β的共同影响。", "hash": "341a4d1aacffa929d70110ea7b3ab8d47716d0ff93ab625665a1a808e3b1c13a"}, {"id": "info31-a6781a92e9c6", "kind": "text", "html": "\u003ch2\u003e同一观测怎样进入构造\u003c/h2\u003e", "markdown": "## 同一观测怎样进入构造", "hash": "4d0a30fd60b25d48436f84d7b324285fb01d1507954e51864c9afe5d0e96f005"}, {"id": "info31-2defee812a5d", "kind": "image", "src": "assets/31G_样本进入构造_样本474.png", "alt": "固定参数下MDM伪尺度和LSE参考坐标的变化", "markdown": "![固定参数下MDM伪尺度和LSE参考坐标的变化](../../reviewbyhtml/方法对比-v1.0/assets/31G_样本进入构造_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-41118cd7a057", "kind": "text", "html": "\u003cp\u003e暂固定MDM的β=5、γ=500及LSE的γ=500，黑箭头追踪50→20点时同一个930.6观测。其MDM绘图位置从0.01389变为0.03431，伪尺度从1011.5变为842.4；LSE的对数距离相同，横坐标从−4.4892变为−3.5729。这是输入变换诊断，不是实际定位判据。\u003c/p\u003e", "markdown": "暂固定MDM的β=5、γ=500及LSE的γ=500，黑箭头追踪50→20点时同一个930.6观测。其MDM绘图位置从0.01389变为0.03431，伪尺度从1011.5变为842.4；LSE的对数距离相同，横坐标从−4.4892变为−3.5729。这是输入变换诊断，不是实际定位判据。", "hash": "35bcd834ef2396f24343e09de024d8aca96493bdd4abb3588ae1e16d0227a750"}, {"id": "info31-dee3d2eec658", "kind": "text", "html": "\u003ch2\u003e三种构造的实际定位判据\u003c/h2\u003e", "markdown": "## 三种构造的实际定位判据", "hash": "d5e3804ecca1947bee1efd5c1f7c38eda2e936957e03659a69493a85c9a3aee2"}, {"id": "info31-71882e3c13c7", "kind": "image", "src": "assets/31J_三法定位判据_样本474.png", "alt": "同一删点路径中MMLE最小值定位、MDM梯度交点和LSE相对匹配最低点", "markdown": "![同一删点路径中MMLE最小值定位、MDM梯度交点和LSE相对匹配最低点](../../reviewbyhtml/方法对比-v1.0/assets/31J_三法定位判据_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-0f4872a001d5", "kind": "text", "html": "\u003cp\u003e本补充区31D集中展示“七点的偶然结构→LSE相对匹配→实际选参”。这里保留三法对照：MMLE位置等于最小观测；MDM先逐位置优化形状，再以最小伪尺度标准差的梯度达到0.1定位；LSE逐位置回归，以同一n下\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e最小定位。圆点为实际返回位置，虚线为真实位置500。不同n的判据高度不直接表示估计精度。\u003c/p\u003e", "markdown": "本补充区31D集中展示“七点的偶然结构→LSE相对匹配→实际选参”。这里保留三法对照：MMLE位置等于最小观测；MDM先逐位置优化形状，再以最小伪尺度标准差的梯度达到0.1定位；LSE逐位置回归，以同一n下$1-R^2$最小定位。圆点为实际返回位置，虚线为真实位置500。不同n的判据高度不直接表示估计精度。", "hash": "6e3af7da2c052cd104590409355ee41bfa937f01fd8757cf29265a0067bd406e"}, {"id": "n52-2860862f6662", "kind": "text", "html": "\u003cp\u003e本补充区31D的回归点列分别作中心化及标准差归一化，展示的是原判据所用的相对匹配。在同一7点上，位置500与1174.0的\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e分别为0.227536与0.106430。两位置的原始对数距离总变差不同，不能将这个改善说成原始残差平方和下降；参数仍由原始回归恢复。核验JSON保留原始残差平方和、总平方和及全部标准化坐标。\u003c/p\u003e", "markdown": "本补充区31D的回归点列分别作中心化及标准差归一化，展示的是原判据所用的相对匹配。在同一7点上，位置500与1174.0的$1-R^2$分别为0.227536与0.106430。两位置的原始对数距离总变差不同，不能将这个改善说成原始残差平方和下降；参数仍由原始回归恢复。核验JSON保留原始残差平方和、总平方和及全部标准化坐标。", "hash": "60e3bb5f58019a5ff8c52b4ac42f7757d42e602beb5c5bce07e7201f55bfd7a9"}, {"id": "info31-527bb3a6976f", "kind": "text", "html": "\u003ch2\u003e位置进入形状与尺度恢复的具体步骤\u003c/h2\u003e", "markdown": "## 位置进入形状与尺度恢复的具体步骤", "hash": "bbffc745729ec01266b39d6a09bdfda41f228abe42d6836f7d91e2760810029f"}, {"id": "n-parameter-recovery", "kind": "image", "src": "assets/31F_固定七点的位置条件对照_样本474.png", "alt": "固定同一七点下MDM谷底、LSE回归线及尺度恢复", "markdown": "![固定同一七点下MDM谷底、LSE回归线及尺度恢复](../../reviewbyhtml/方法对比-v1.0/assets/31F_固定七点的位置条件对照_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-dc6d810873e9", "kind": "text", "html": "\u003cp\u003e两种颜色始终使用同一组7点及n=7参考坐标，蓝色代入各法50点时的位置，橙色代入7点时的位置。MDM条件形状4.34→1.76、尺度799.6→363.2；LSE条件形状5.23→1.52、尺度871.0→332.9。蓝色不是原50点估计。本补充区31I用LSE的同两组条件参数展示最终PDF/CDF；本图展开恢复计算。\u003c/p\u003e", "markdown": "两种颜色始终使用同一组7点及n=7参考坐标，蓝色代入各法50点时的位置，橙色代入7点时的位置。MDM条件形状4.34→1.76、尺度799.6→363.2；LSE条件形状5.23→1.52、尺度871.0→332.9。蓝色不是原50点估计。本补充区31I用LSE的同两组条件参数展示最终PDF/CDF；本图展开恢复计算。", "hash": "654fc02b275bac1c1c327e5c451dec5d372ac8277c0f9e4e76bb51dba4df156c"}, {"id": "n52-d23e3fc6d6c4", "kind": "text", "html": "\u003ch2\u003e最小观测约束的是起点，也是候选分布的下端概率\u003c/h2\u003e", "markdown": "## 最小观测约束的是起点，也是候选分布的下端概率", "hash": "35bff610173b8e99714ee9ab2a114887799a8b4eeef692996f94f9b1e048a7f7"}, {"id": "info31-949acbaa14c8", "kind": "text", "html": "\u003cp\u003e记当前最小观测为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。从支持范围看，候选起点不能高于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，否则就有观测落在模型允许范围之外。但起点即使低于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，也还要解释另一件事：\u003cstrong\u003e模型认为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧应该有多少数据，而我们实际一个也没看到？\u003c/strong\u003e\u003c/p\u003e", "markdown": "记当前最小观测为$m$。从支持范围看，候选起点不能高于$m$，否则就有观测落在模型允许范围之外。但起点即使低于$m$，也还要解释另一件事：**模型认为$m$左侧应该有多少数据，而我们实际一个也没看到？**", "hash": "77f8d644f5aa3972f599a2a55bd1ae83146c3ef0ddd43a6304666b59213dde87"}, {"id": "info31-111087320b25", "kind": "text", "html": "\u003cp\u003e设候选参数为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，它在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧安排的概率是\u003c/p\u003e", "markdown": "设候选参数为$\\theta=(\\beta,\\eta,\\gamma)$，它在$m$左侧安排的概率是", "hash": "048f422865b1f2543d21ac730c8bb5feee5647201b45f16483f4f1c44fb4ae31"}, {"id": "info31-a78c28180f29", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsubsup\u003e\u003cmo\u003e∫\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003ed\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\nq=F_\\theta(m)=\\int_\\gamma^m f_\\theta(t)\\,\\mathrm{d}t.\n$$", "hash": "c6f9c85f2ac5baa3325ac591c7b3faa01ed1a4d4de1a4500e3d7d75bbf149e5a"}, {"id": "info31-e1e2f5ec7a9b", "kind": "text", "html": "\u003cp\u003e因此，\u003cstrong\u003ePDF在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧的面积，与CDF在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e处的高度，是同一份概率信息\u003c/strong\u003e。最小观测并不单独确定形状参数；它与样本量一起，对三个参数共同决定的下端概率提供信息。\u003c/p\u003e", "markdown": "因此，**PDF在$m$左侧的面积，与CDF在$m$处的高度，是同一份概率信息**。最小观测并不单独确定形状参数；它与样本量一起，对三个参数共同决定的下端概率提供信息。", "hash": "2212785fc42033c924af50578dc7da473d68269b5635f0c67a39fc30c1c762f4"}, {"id": "n-distribution-link", "kind": "image", "src": "assets/31I_最小观测与整条分布.png", "alt": "同一组七点上两种代入位置恢复出的PDF与CDF，以及固定蓝色候选分布的无下端观测概率", "markdown": "![同一组七点上两种代入位置恢复出的PDF与CDF，以及固定蓝色候选分布的无下端观测概率](../../reviewbyhtml/方法对比-v1.0/assets/31I_最小观测与整条分布.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-d5e1f0966382", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e前两图始终使用同一组7点及其LSE理论参考坐标，分别代入位置662.5、1174.0后恢复形状与尺度；两条曲线都是7点条件恢复，蓝线不是原50点拟合。底部刻线是这7个真实观测，竖线为最小值\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1226.9\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。蓝色PDF阴影面积等于蓝色CDF圆点的高度\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eq\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。右图固定蓝色候选参数和同一阈值\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，计算重新独立抽取n个观测时全部不小于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e的模型概率。\u003c/em\u003e\u003c/p\u003e", "markdown": "*前两图始终使用同一组7点及其LSE理论参考坐标，分别代入位置662.5、1174.0后恢复形状与尺度；两条曲线都是7点条件恢复，蓝线不是原50点拟合。底部刻线是这7个真实观测，竖线为最小值$m=1226.9$。蓝色PDF阴影面积等于蓝色CDF圆点的高度$q$。右图固定蓝色候选参数和同一阈值$m$，计算重新独立抽取n个观测时全部不小于$m$的模型概率。*", "hash": "8c0028a290dd84ed75abbbca418ef5e4af58654a00cdba4223c6d6799f4c4e82"}, {"id": "info31-c711d13be134", "kind": "text", "html": "\u003cp\u003e先只看蓝色候选分布。它在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧放了约9.83%的概率。若固定这个分布和阈值，重新独立抽取n个观测，全部避开这段区域的概率为\u003c/p\u003e", "markdown": "先只看蓝色候选分布。它在$m$左侧放了约9.83%的概率。若固定这个分布和阈值，重新独立抽取n个观测，全部避开这段区域的概率为", "hash": "84d48df8eec563f71b488728987c6b6b38c8fad691b457aaf71289a976a1324b"}, {"id": "info31-762ee72501f0", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e≥\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\nP_\\theta(X_{(1)}\\geq m)=[1-F_\\theta(m)]^n=(1-q)^n.\n$$", "hash": "b54a023154ac5bce688ccf00b1ad6580244fc9b75572dc1b16d53aa036254c1f"}, {"id": "info31-28fa84e2549a", "kind": "text", "html": "\u003cp\u003en=50时约为0.56%，n=7时约为48.4%。这说明，\u003cstrong\u003e小样本中没有看到下端观测，仍可能容许总体在那里放有相当概率\u003c/strong\u003e；样本CDF在最小值左侧为0，也不表示总体CDF在那里必须为0。上式用于说明空白区包含的抽样信息，具体选参仍要结合全部观测和各方法原有判据。\u003c/p\u003e", "markdown": "n=50时约为0.56%，n=7时约为48.4%。这说明，**小样本中没有看到下端观测，仍可能容许总体在那里放有相当概率**；样本CDF在最小值左侧为0，也不表示总体CDF在那里必须为0。上式用于说明空白区包含的抽样信息，具体选参仍要结合全部观测和各方法原有判据。", "hash": "4f4c5e8391b5125965358c6db7017e3db482c9ee951a54f2bc16d178da0ed0f6"}, {"id": "n52-6166bef4e650", "kind": "text", "html": "\u003ch2\u003e起点怎样牵动形状、尺度和整条曲线\u003c/h2\u003e", "markdown": "## 起点怎样牵动形状、尺度和整条曲线", "hash": "df7dc3b45b315d34b23568c73a837758e968a279e3bfb7681b5b8202f279a404"}, {"id": "info31-9ce9f7b386ce", "kind": "text", "html": "\u003cp\u003e单独改变位置参数、保持形状和尺度不变，只会平移分布。图中PDF外形之所以改变，是因为\u003cstrong\u003e方法在新的起点下，为匹配同一批观测，重新估计了形状和尺度\u003c/strong\u003e。\u003c/p\u003e", "markdown": "单独改变位置参数、保持形状和尺度不变，只会平移分布。图中PDF外形之所以改变，是因为**方法在新的起点下，为匹配同一批观测，重新估计了形状和尺度**。", "hash": "14a9fda66223173321794654de83e988dc1e6a635b354f5ac0849929dbd3ebfd"}, {"id": "info31-aa03d6558901", "kind": "text", "html": "\u003cp\u003e仍看图中的同一组7点，最小值为1226.9，最大值为1903.5：\u003c/p\u003e", "markdown": "仍看图中的同一组7点，最小值为1226.9，最大值为1903.5：", "hash": "595e771788892138b7d7131359d657f1d42584563dcbefc67104494e14d157cf"}, {"id": "info31-bd3b0fcfb97b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e代入位置\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e最小观测到起点的距离\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e最大观测到起点的距离\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e662.5\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e564.3\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1240.9\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1174.0\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e52.9\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e729.5\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 代入位置 | 最小观测到起点的距离 | 最大观测到起点的距离 |\n|---|---:|---:|\n| 662.5 | 564.3 | 1240.9 |\n| 1174.0 | 52.9 | 729.5 |", "hash": "f5251fb88de439359ed79c5ca6dcb99099d8d2614893ae761140ebbd23e57325"}, {"id": "info31-69ffac3a9c3d", "kind": "text", "html": "\u003cp\u003e起点右移后，下端距离缩短的比例更大，最大与最小距离之比从约2.2增至13.8。LSE对这些距离取对数，再与固定的理论参考坐标回归；对数距离跨度增大，使本例的回归线变陡。形状取斜率倒数，因此从5.23降到1.52；尺度由截距恢复，从871.0降到332.9。本例中，起点向右移，PDF峰位却向左移：另外两参的重新匹配改变了整条曲线的外形，CDF也随之改变。\u003c/p\u003e", "markdown": "起点右移后，下端距离缩短的比例更大，最大与最小距离之比从约2.2增至13.8。LSE对这些距离取对数，再与固定的理论参考坐标回归；对数距离跨度增大，使本例的回归线变陡。形状取斜率倒数，因此从5.23降到1.52；尺度由截距恢复，从871.0降到332.9。本例中，起点向右移，PDF峰位却向左移：另外两参的重新匹配改变了整条曲线的外形，CDF也随之改变。", "hash": "00ee7a88a4077d37a174792a6286c3342baf657e37fc8fd29cc9071911609110"}, {"id": "n52-767df2cb41b2", "kind": "text", "html": "\u003cp\u003e这里的传递是“改变起点后重新匹配数据”，并不是最小值单独决定形状。MDM也通过观测到起点的距离恢复伪尺度，位置改变后，其一致关系和恢复参数也会改变；\u003ca href=\"#n-supplement\"\u003e补充核对图\u003c/a\u003e保留两法的具体恢复过程。\u003c/p\u003e", "markdown": "这里的传递是“改变起点后重新匹配数据”，并不是最小值单独决定形状。MDM也通过观测到起点的距离恢复伪尺度，位置改变后，其一致关系和恢复参数也会改变；[补充核对图](3.1逐档拟合与误差.md)保留两法的具体恢复过程。", "hash": "03af76a636bfc3a5eaf6f8413350ee9200a4303e8539445018e5e895abe4b073"}, {"id": "n52-9dc85e9558b1", "kind": "text", "html": "\u003ch2\u003e样本中的偶然聚集与间隔怎样改变判据\u003c/h2\u003e", "markdown": "## 样本中的偶然聚集与间隔怎样改变判据", "hash": "adb191bf604629554f6b2eb6917154ed97e086b87b1cbdbd9b504706072a5787"}, {"id": "info31-0bb2b05f4229", "kind": "text", "html": "\u003cp\u003e约束变弱，还没有解释方法为什么选中了偏离真值的参数。\u003cstrong\u003e判据是用当前这一组点计算的；点数少时，几个点的偶然聚集或一个较大间隔就占据了点列的较大部分，判据更容易受这些结构影响\u003c/strong\u003e。这不是说每组小样本都更不规则，而是同一种构造在不同小样本上，可能因为点列关系不同而偏向不同参数。\u003c/p\u003e", "markdown": "约束变弱，还没有解释方法为什么选中了偏离真值的参数。**判据是用当前这一组点计算的；点数少时，几个点的偶然聚集或一个较大间隔就占据了点列的较大部分，判据更容易受这些结构影响**。这不是说每组小样本都更不规则，而是同一种构造在不同小样本上，可能因为点列关系不同而偏向不同参数。", "hash": "24ff23ee1d4d312e615d6cbb7753b0dc0c4a0e418f289845c163e7e1b134500d"}, {"id": "info31-c9acb1c52c86", "kind": "text", "html": "\u003cp\u003e看474号路径最终保留的7点，约为1226.9、1372.1、1374.8、1395.2、1409.3、1569.0、1903.5。其中\u003cstrong\u003e第2—5点共4点挤在37.3的范围内，末端两点却相隔334.5\u003c/strong\u003e。这些聚集和间隔是这次保留样本的结构，不是总体分布固定具有的特征。\u003c/p\u003e", "markdown": "看474号路径最终保留的7点，约为1226.9、1372.1、1374.8、1395.2、1409.3、1569.0、1903.5。其中**第2—5点共4点挤在37.3的范围内，末端两点却相隔334.5**。这些聚集和间隔是这次保留样本的结构，不是总体分布固定具有的特征。", "hash": "5a7405093da2fa4ff92126fedc3a3943812d5e9d7e3485fdd6c6600a892cc80f"}, {"id": "n-a-criteria", "kind": "image", "src": "assets/31D_定位判据响应_样本474.png", "alt": "七点的聚集与大间隔、同七点的LSE匹配对照及实际定位判据", "markdown": "![七点的聚集与大间隔、同七点的LSE匹配对照及实际定位判据](../../reviewbyhtml/方法对比-v1.0/assets/31D_定位判据响应_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-8dee90017105", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e从左到右读：(a)七个观测的实际寿命与次序，标出中间四点的跨度和末端间隔；(b)固定同一7点及其理论参考坐标，对比真实位置500与LSE所选位置1174.0。空心点对应500，实心点对应1174.0，同颜色、形状追踪同一组观测；两轴分别中心化并除以样本标准差，只为比较相对线性匹配。(c)同一删点路径n=50、20、7的实际LSE相对失配\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e；同一n下，其最低点与F比最大点等价。虚线为真实位置500。\u003c/em\u003e\u003c/p\u003e", "markdown": "*从左到右读：(a)七个观测的实际寿命与次序，标出中间四点的跨度和末端间隔；(b)固定同一7点及其理论参考坐标，对比真实位置500与LSE所选位置1174.0。空心点对应500，实心点对应1174.0，同颜色、形状追踪同一组观测；两轴分别中心化并除以样本标准差，只为比较相对线性匹配。(c)同一删点路径n=50、20、7的实际LSE相对失配$1-R^2$；同一n下，其最低点与F比最大点等价。虚线为真实位置500。*", "hash": "c398a09433de8439d1b84e27281676a425bc9d5668c2105896e63fcd6f584a0e"}, {"id": "info31-60a55716e3bf", "kind": "text", "html": "\u003cp\u003eLSE把每个观测到候选起点的距离取对数，与按次序确定的理论参考坐标配对。中间四个观测很近，但各自仍对应不同的参考坐标；末端大间隔又使最后一点的对数距离明显抬高。这组点列在真实位置下没有很好地排成直线。右移候选位置会更强地拉开下端的对数距离，改变整组点列的相对关系；在本例中，这使相对线性匹配更好。\u003c/p\u003e", "markdown": "LSE把每个观测到候选起点的距离取对数，与按次序确定的理论参考坐标配对。中间四个观测很近，但各自仍对应不同的参考坐标；末端大间隔又使最后一点的对数距离明显抬高。这组点列在真实位置下没有很好地排成直线。右移候选位置会更强地拉开下端的对数距离，改变整组点列的相对关系；在本例中，这使相对线性匹配更好。", "hash": "4873b1bb32b3a48fccc8a0602dde5d333fe0fead88c821ddae7b4010e20e2412"}, {"id": "info31-f086dda3760b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e同一7点上代入的位置\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e相对失配\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e由原始回归恢复的形状\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e恢复的尺度\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真实位置500\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.228\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e6.29\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1036.7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE选中位置1174.0\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.106\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1.52\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e332.9\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 同一7点上代入的位置 | 相对失配$1-R^2$ | 由原始回归恢复的形状 | 恢复的尺度 |\n|---|---:|---:|---:|\n| 真实位置500 | 0.228 | 6.29 | 1036.7 |\n| LSE选中位置1174.0 | 0.106 | 1.52 | 332.9 |", "hash": "50abcbc6d929dbba119b8c0f2a446fddb6c30221105fddcfb61eeb2d39853c88"}, {"id": "info31-130d0304174a", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e判据确实改善了，位置却离真值更远，形状和尺度也随之降低\u003c/strong\u003e。LSE寻找的是“让这组点列相对更接近直线的位置”；这组小样本的偶然结构，使该位置与真实起点分离。这里用的是原有相对匹配判据，不是原始残差平方和；形状仍取原始对数回归斜率的倒数，图中标准化斜率只用于显示。\u003c/p\u003e", "markdown": "**判据确实改善了，位置却离真值更远，形状和尺度也随之降低**。LSE寻找的是“让这组点列相对更接近直线的位置”；这组小样本的偶然结构，使该位置与真实起点分离。这里用的是原有相对匹配判据，不是原始残差平方和；形状仍取原始对数回归斜率的倒数，图中标准化斜率只用于显示。", "hash": "8b73ab74802ef926a9cdeaeefb1dabb6047231116bcfc8d372a928fcfd9584b8"}, {"id": "n52-e0d61d02a142", "kind": "text", "html": "\u003cp\u003e不同构造会以不同方式响应。MMLE直接以最小值定位，7点的最小值升到1226.9，便直接返回该位置。MDM把整组点反算为伪尺度，以它们的一致程度及其随位置的变化定位；同一7点的实际梯度在1143.8达到0.1，随后恢复出另一组形状、尺度。\u003ca href=\"#n-supplement\"\u003e三法定位对照\u003c/a\u003e保留完整曲线。\u003c/p\u003e", "markdown": "不同构造会以不同方式响应。MMLE直接以最小值定位，7点的最小值升到1226.9，便直接返回该位置。MDM把整组点反算为伪尺度，以它们的一致程度及其随位置的变化定位；同一7点的实际梯度在1143.8达到0.1，随后恢复出另一组形状、尺度。[三法定位对照](3.1逐档拟合与误差.md)保留完整曲线。", "hash": "21865271fc472c7329a2ba29aa5f92c55eed9e3253bf9a8b8dae7fba6ee77ddb"}, {"id": "info31-ba09e14bc71e", "kind": "text", "html": "\u003cp\u003e这些响应并非只由最小值决定。50→20点时最小值仍是930.6，MMLE位置不变，MDM却从733.7变到683.7，LSE从662.5变到550.5；此段反而更接近真值。删点同时改变了整组观测、间距和当前n的参考坐标，其影响可以向不同方向发生。\u003c/p\u003e", "markdown": "这些响应并非只由最小值决定。50→20点时最小值仍是930.6，MMLE位置不变，MDM却从733.7变到683.7，LSE从662.5变到550.5；此段反而更接近真值。删点同时改变了整组观测、间距和当前n的参考坐标，其影响可以向不同方向发生。", "hash": "1b3a1a6e90cd872ebede3d2a001db6bdb0b38a80d1aac436172a6448d1dcc0a3"}, {"id": "n52-bc111d994a35", "kind": "text", "html": "\u003cp\u003e本例展示这组七点的相对匹配怎样支持偏离真值的位置，不将其归因为最小值单独变大，也不据此解释总体RMSE的增幅。\u003c/p\u003e", "markdown": "本例展示这组七点的相对匹配怎样支持偏离真值的位置，不将其归因为最小值单独变大，也不据此解释总体RMSE的增幅。", "hash": "5f34ad3ccd6bdeb570a89df0b5d3ed2386500dec3f3fb75546547a7bb36c4657"}, {"id": "n-gallery-heading", "kind": "text", "html": "\u003ch3\u003e五档CDF拟合与单次误差\u003c/h3\u003e", "hash": "f95e685e9b36be6883139deb139da46e897fbf8ad981dccf2b0a38cc941319b6"}, {"id": "n-before-after", "kind": "gallery", "aspect_ratio": 1.6666666666666667, "images": [{"id": "n50", "label": "n = 50", "src": "assets/31_嵌套删点_样本474_n50.png", "alt": "同一嵌套删点路径n=50：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n20", "label": "n = 20", "src": "assets/31_嵌套删点_样本474_n20.png", "alt": "同一嵌套删点路径n=20：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n15", "label": "n = 15", "src": "assets/31_嵌套删点_样本474_n15.png", "alt": "同一嵌套删点路径n=15：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n10", "label": "n = 10", "src": "assets/31_嵌套删点_样本474_n10.png", "alt": "同一嵌套删点路径n=10：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n7", "label": "n = 7", "src": "assets/31_嵌套删点_样本474_n7.png", "alt": "同一嵌套删点路径n=7：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-before-after-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e同一路径的样本减少，在三种方法中引起不同的拟合与参数变化。按n=50→20→15→10→7切换；上排三列依次为MMLE、MDM、LSE，各列只画本法拟合CDF，并以灰色虚线对照真实CDF。黑点是本组寿命观测，纵坐标为按当前n计算的(i−0.5)/n，仅作概率图展示；底部短刻线保留实际寿命位置。下排三列依次为形状、尺度、位置的带符号误差（估计值减真值），零线表示无偏离；这是单一样本的误差，不是重复抽样的平均Bias。各档CDF共用坐标，同一参数各档也共用纵轴范围。\u003c/em\u003e\u003c/p\u003e", "hash": "87a73d87c9f67575c372985e97c6ebcd54d4425869e5125a2ee172089127dd43"}]}], "content_hash": "5fb7ad75e98add62126bc7722a016c36e49a086db37b75442eb6e9b489805a34"}, {"id": "mechanism-n-population", "title": "附：3.1群体结果与曲率核对", "mode": "content", "state": "open", "selected": null, "options": [{"id": "mechanism-n-population-content", "label": "补充核对", "blocks": [{"id": "n55-acf4d3317fe5", "kind": "text", "html": "\u003ca id=\"population-supplement\"\u003e\u003c/a\u003e\u003cp\u003e对应\u003ca href=\"#mechanism-current\"\u003e报告下v2.1\u003c/a\u003e。计算前固定的\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E5%81%8F%E7%A7%BB%E9%87%8F%E4%B8%8E%E5%BB%93%E7%BA%BF%E7%BE%A4%E4%BD%93%E9%AA%8C%E8%AF%81-%E6%96%B9%E6%A1%88.md\"\u003e方案\u003c/a\u003e及用户追加四法后的\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E5%87%8F%E7%82%B9%E5%9B%9B%E6%96%B9%E6%B3%95%E4%B8%8E%E4%BB%A3%E8%A1%A8%E4%BE%8B-%E8%A1%A5%E5%85%85%E7%BA%A6%E5%AE%9A.md\"\u003e补充约定\u003c/a\u003e保留实验身份。\u003c/p\u003e", "markdown": "对应[报告下v2.1](../../报告下（方法对比）-v2.3.md)。计算前固定的[方案](3.1偏移量与廓线群体验证-方案.md)及用户追加四法后的[补充约定](3.1减点四方法与代表例-补充约定.md)保留实验身份。", "hash": "80642db35f267da91faeb38fa0fad930f03d93e5063dd07af61752b8c58f9d7c"}, {"id": "n61-63ab7678a582", "kind": "text", "html": "\u003ch2\u003e正文使用β=3的重复分布\u003c/h2\u003e", "markdown": "## 正文使用β=3的重复分布", "hash": "1f8162d3f5bdbb1ac803961af5b070784699df4a475ae5e00115937d4adc07e9"}, {"id": "n61-6db32a23ea9f", "kind": "text", "html": "\u003cp\u003e第60轮反馈将正文MDM两δ分布改用β=3；\u003ca href=\"#beta3-delta-supplement\"\u003e当前配对核对\u003c/a\u003e另存n=50、7各1200组。此前\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1-MDM%E5%81%8F%E7%A7%BB%E9%87%8F-beta2%E7%BB%93%E6%9E%9C.md\"\u003eβ=2核对\u003c/a\u003e保留原身份。以下β=5五档n和120条嵌套结果保留原条件。判据图下仅保留变化描述，详细选例与统计在此核对。\u003c/p\u003e", "markdown": "第60轮反馈将正文MDM两δ分布改用β=3；[当前配对核对](3.1-MDM偏移量-beta3结果.md)另存n=50、7各1200组。此前[β=2核对](3.1-MDM偏移量-beta2结果.md)保留原身份。以下β=5五档n和120条嵌套结果保留原条件。判据图下仅保留变化描述，详细选例与统计在此核对。", "hash": "6973ec1d3ed10fc2bf10878a83cf6f2ad161359cc71cbe0ddc45c2a95d07f910"}, {"id": "n55-84862763995e", "kind": "text", "html": "\u003ch2\u003e两种集合及方法身份\u003c/h2\u003e", "markdown": "## 两种集合及方法身份", "hash": "d1ad029037cb99f0a37617a0e78a6081c8f59c41dfb80a54fd80d0aee3ae4497"}, {"id": "n55-c6f8e1dafb6e", "kind": "text", "html": "\u003cp\u003e正式对照：W(5,1000,500)，五档n各1200原样本，两δ同输入，共12000条，δ=0新增6000条、δ=0.1全部复用。两方案均全部有效，自身与两方案共同有效指标相同。\u003c/p\u003e", "markdown": "正式对照：W(5,1000,500)，五档n各1200原样本，两δ同输入，共12000条，δ=0新增6000条、δ=0.1全部复用。两方案均全部有效，自身与两方案共同有效指标相同。", "hash": "ca3b2ed5f5f141f107e5343cfe0de61856d6dd415dff71b26895d8b232ae9a5a"}, {"id": "n55-d0720087f088", "kind": "text", "html": "\u003cp\u003e嵌套诊断：预先固定120条n50路径，编号0、10、…、1190，固定随机排列后逐档保留50、20、15、10、7点，四法共2400条。n50四法复用，其他档另算1920条；两集合共7920次新增完整估计，不计入原40条件七法排名，不抽取新Weibull样本。\u003c/p\u003e", "markdown": "嵌套诊断：预先固定120条n50路径，编号0、10、…、1190，固定随机排列后逐档保留50、20、15、10、7点，四法共2400条。n50四法复用，其他档另算1920条；两集合共7920次新增完整估计，不计入原40条件七法排名，不抽取新Weibull样本。", "hash": "e007d229d8cf99f86cc86f25731d18274b7844d94d82da8cfc9a1947458c3f34"}, {"id": "n55-ab132c11042f", "kind": "text", "html": "\u003cp\u003eMLE是冻结的β≥1、γ≥0有限候选版本；MMLE以最小值定位、删除该点后估计；MDM两方案共用条件标准差及梯度。零位置截断和近端回退区别于真实内部根。判据图只展示γ怎样确定，Bias/SD由统计图展示。原正式估计及冻结源码不改。\u003c/p\u003e", "markdown": "MLE是冻结的β≥1、γ≥0有限候选版本；MMLE以最小值定位、删除该点后估计；MDM两方案共用条件标准差及梯度。零位置截断和近端回退区别于真实内部根。判据图只展示γ怎样确定，Bias/SD由统计图展示。原正式估计及冻结源码不改。", "hash": "24b385532e37939a87b27dda101e21109845c1a0aa45f1676d7391757bf118df"}, {"id": "n55-b3e3063dd932", "kind": "text", "html": "\u003ch2\u003e分行观察十组定位过程\u003c/h2\u003e", "markdown": "## 分行观察十组定位过程", "hash": "fb71a4540b50257920c00b2c36ce4b1074a1fbbb1e3ca71a29eef5f1eafd9f7b"}, {"id": "n57-7bf11a54793b", "kind": "text", "html": "\u003cp\u003e新布局以\u003ca href=\"#ten-gamma-paths\"\u003e十组定位判据\u003c/a\u003e为准：图按五行n、四列方法排列，每个剖面坐标系叠加十组样本曲线；n仍各占一行，MMLE列仅标最小值定位。选例覆盖六种端点分支，不按变平挑选；120条路径的统计口径不变。以下640、330叠线图保留为曲率选例的补充核对。\u003c/p\u003e", "markdown": "新布局以[十组定位判据](3.1十组定位判据.md)为准：图按五行n、四列方法排列，每个剖面坐标系叠加十组样本曲线；n仍各占一行，MMLE列仅标最小值定位。选例覆盖六种端点分支，不按变平挑选；120条路径的统计口径不变。以下640、330叠线图保留为曲率选例的补充核对。", "hash": "2347bb8f77be428cc2d5ac7e3f899a5747fe05bee22005b00dbd989c8dd26def"}, {"id": "n56-571b52ffb50b", "kind": "text", "html": "\u003ch2\u003e十组样本选例与失败档\u003c/h2\u003e", "markdown": "## 十组样本选例与失败档", "hash": "c13d6cbc8879b61de5975b4c79b32e49014b636942ded09396e846ee398d4059"}, {"id": "n56-35044853e5d2", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e图组\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e样本编号\u003c/th\u003e\u003cth\u003en=7时MLE / MDM(0)\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e该分支路径数/120\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e此中心最近路径数\u003c/th\u003e\u003cth\u003eMLE失败的n\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e670\u003c/td\u003e\u003ctd\u003e零边界 / 零边界\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e40\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e18\u003c/td\u003e\u003ctd\u003e无\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003
