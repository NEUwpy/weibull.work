 | -1.91 / 0.87 / 2.10 | -310.07 / 210.13 / 374.51 | 299.64 / 203.75 / 362.30 |\n| 15 | 0 | 0.60 / 2.68 / 2.75 | 105.18 / 464.38 / 475.96 | -110.29 / 446.12 / 459.37 |\n| 15 | 0.1 | -2.13 / 0.91 / 2.31 | -347.95 / 225.79 / 414.74 | 334.74 / 212.95 / 396.69 |\n| 10 | 0 | 0.52 / 2.98 / 3.02 | 89.55 / 492.54 / 500.41 | -97.54 / 473.53 / 483.28 |\n| 10 | 0.1 | -2.36 / 0.93 / 2.53 | -390.00 / 238.66 / 457.18 | 372.93 / 230.50 / 438.37 |\n| 7 | 0 | 0.53 / 3.48 / 3.52 | 66.97 / 527.44 / 531.45 | -79.04 / 503.51 / 509.47 |\n| 7 | 0.1 | -2.62 / 1.14 / 2.86 | -448.64 / 256.93 / 516.95 | 426.11 / 248.67 / 493.31 |", "hash": "6e75b54dae97db16038b62796c706a0969da2ac1247099b5d5997c88f06d7e1d"}, {"id": "n55-2d96252abe4e", "kind": "text", "html": "\u003ch2\u003e判据是否随减点普遍变平\u003c/h2\u003e", "markdown": "## 判据是否随减点普遍变平", "hash": "fb5af12dd394ff7b7791af0a3da378a59823aa5d0c9cea893474fd7dbefb55fb"}, {"id": "n55-d0ad731bfcb7", "kind": "text", "html": "\u003cp\u003e这要用预先固定的多条路径检验。对可靠内部解，用局部曲率比较定位附近的变化速度；零位置、失败、近端回退和形状边界另列。MLE同时报告总似然曲率及除以n的每观测曲率，以区分观测项减少的加和效应与每观测准则形状变化。\u003c/p\u003e", "markdown": "这要用预先固定的多条路径检验。对可靠内部解，用局部曲率比较定位附近的变化速度；零位置、失败、近端回退和形状边界另列。MLE同时报告总似然曲率及除以n的每观测曲率，以区分观测项减少的加和效应与每观测准则形状变化。", "hash": "b77179cfa6afb3d1cd57d75ce1e9960b9cf8eb0cc5ddefb22cbd40d95c3435a6"}, {"id": "n55-5e4a6e29185f", "kind": "image", "src": "assets/31P_群体曲率与边界比例.png", "alt": "120条嵌套路径的曲率变化及边界和失败比例", "markdown": "![120条嵌套路径的曲率变化及边界和失败比例](../../reviewbyhtml/方法对比-v1.0/assets/31P_群体曲率与边界比例.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n55-4cfaf3148461", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e左图每点为一条可靠配对路径的n=7曲率/n=50曲率，低于1表示该处更平；黑点和线为中位数及至少95%的区间。MLE两项和MDM(0)各为39/120条可靠内部配对，MDM(0.1)为120/120条。右图分母始终为120条路径，展示零位置与MLE失败；这些路径不混入内部曲率统计。κ的定义、两档差分及筛选记录见补充。\u003c/em\u003e\u003c/p\u003e", "markdown": "*左图每点为一条可靠配对路径的n=7曲率/n=50曲率，低于1表示该处更平；黑点和线为中位数及至少95%的区间。MLE两项和MDM(0)各为39/120条可靠内部配对，MDM(0.1)为120/120条。右图分母始终为120条路径，展示零位置与MLE失败；这些路径不混入内部曲率统计。κ的定义、两档差分及筛选记录见补充。*", "hash": "72f3e9b7dce7d7d91c56679f71b7a31cfccb0249e84455c82ae796e335f63095"}, {"id": "n55-a51f6f0eab53", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e判据\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e可靠配对/120\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e曲率比中位数\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e中位数区间\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMLE总似然\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e39\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.37\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.07—1.31\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE每观测似然\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e39\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e2.64\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.51—9.36\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM(0)\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e39\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e7.17\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.65—27.87\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM(0.1)\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e120\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1.22\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.85—1.57\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 判据 | 可靠配对/120 | 曲率比中位数 | 中位数区间 |\n|---|---:|---:|---:|\n| MLE总似然 | 39 | 0.37 | 0.07—1.31 |\n| MLE每观测似然 | 39 | 2.64 | 0.51—9.36 |\n| MDM(0) | 39 | 7.17 | 0.65—27.87 |\n| MDM(0.1) | 120 | 1.22 | 0.85—1.57 |", "hash": "0d36fd5bff8e8e6640aa055382a5bc8f7b1f0a74b8ffcd6c6ed447c605297b03"}, {"id": "n55-8634f11a1e08", "kind": "text", "html": "\u003cp\u003e这些结果没有支持“减点后各方法的判据普遍越来越平”的统一解释。MLE总似然的曲率中位数降低，但每观测结果不同；两种MDM都同时存在变平和变陡路径。n减少还改变了选参位置与分支：本诊断中，MDM(0)零位置由41/120增至64/120，MLE零位置由17/120增至41/120，并出现32/120次失败。因而，选参可能沿平缓区域移动，也可能转向新的内部区域或边界，不能只用一张变平的个例解释总体误差。\u003c/p\u003e", "markdown": "这些结果没有支持“减点后各方法的判据普遍越来越平”的统一解释。MLE总似然的曲率中位数降低，但每观测结果不同；两种MDM都同时存在变平和变陡路径。n减少还改变了选参位置与分支：本诊断中，MDM(0)零位置由41/120增至64/120，MLE零位置由17/120增至41/120，并出现32/120次失败。因而，选参可能沿平缓区域移动，也可能转向新的内部区域或边界，不能只用一张变平的个例解释总体误差。", "hash": "8a05831630c7a8dd09cdfb5c9984eb39e8029e7d60b3ea0223a454d9076361d9"}, {"id": "n55-dd4f4878e306", "kind": "text", "html": "\u003ch2\u003e曲率定义与有效范围\u003c/h2\u003e", "markdown": "## 曲率定义与有效范围", "hash": "529647cb49e703903bdfc7b9ca36b4ce253f1fc57325147b604bdf77db1113ff"}, {"id": "n55-d4e312315920", "kind": "text", "html": "\u003cp\u003eMDM用\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmsubsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmo mathvariant=\"normal\"\u003e′\u003c/mo\u003e\u003cmo mathvariant=\"normal\"\u003e′\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，MLE用\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"normal\"\u003eℓ\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmrow\u003e\u003cmo mathvariant=\"normal\"\u003e′\u003c/mo\u003e\u003cmo mathvariant=\"normal\"\u003e′\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，固定\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1000\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，另保存MLE的κ/n。不同准则的绝对数值不横向比较。\u003c/p\u003e", "markdown": "MDM用$\\kappa=\\eta_0S_n''(\\hat\\gamma)$，MLE用$\\kappa=\\eta_0^2[-\\ell_p''(\\hat\\gamma)]$，固定$\\eta_0=1000$，另保存MLE的κ/n。不同准则的绝对数值不横向比较。", "hash": "1d33fc671f3deffd721a461f8d2165d3363a6424cc1376231086ab17b503d015"}, {"id": "n55-9a6d2e9f7cf6", "kind": "text", "html": "\u003cp\u003e只对可靠内部解配对，失败、零位置、已知近端外推、形状活跃边界及无法可靠差分的位置另列。两档中心步长h和h/2检查收敛，正曲率、相对差异≤20%、梯度残差≤0.0001；h及支持距离规则见方案。MLE和MDM0各39/120对，MDM0.1为120/120对，不将缺失曲率填零。\u003c/p\u003e", "markdown": "只对可靠内部解配对，失败、零位置、已知近端外推、形状活跃边界及无法可靠差分的位置另列。两档中心步长h和h/2检查收敛，正曲率、相对差异≤20%、梯度残差≤0.0001；h及支持距离规则见方案。MLE和MDM0各39/120对，MDM0.1为120/120对，不将缺失曲率填零。", "hash": "2195209031cc5c947cb6c5b9e7bc80691b393d4b92df8e508e4ad7d98851eb58"}, {"id": "n55-dd0f26fd6e2d", "kind": "text", "html": "\u003cp\u003e中位数区间用整条路径为单位的二项顺序统计量，覆盖至少95%；降低比例用Wilson区间。区间属于这些可靠子群，不代表全部120条路径。\u003c/p\u003e", "markdown": "中位数区间用整条路径为单位的二项顺序统计量，覆盖至少95%；降低比例用Wilson区间。区间属于这些可靠子群，不代表全部120条路径。", "hash": "c91cc73002965aadae5ea9d3dee0c1bfd192a29baa48a491c626d9faed7d3c96"}, {"id": "n55-0b5eb756b931", "kind": "text", "html": "\u003ch2\u003e主例及代表范围\u003c/h2\u003e", "markdown": "## 主例及代表范围", "hash": "aa9869c72c497f2052ea3c01b2a565e3a9a5fa6a7a745cdea7f6924f7ae90a2a"}, {"id": "n55-b77ebfc3a73a", "kind": "text", "html": "\u003cp\u003e670号从50/7四法均有效的88/120条路径选出。24维向量为四法、两端n、三参数的标准化带符号误差，按中位数和MAD标准化，取平均绝对距离最小者。MAD为0依次退到IQR、标准差和1。没有按曲率方向或视觉好看筛选；端点综合中心不保证每项变化均为第50百分位。\u003c/p\u003e", "markdown": "670号从50/7四法均有效的88/120条路径选出。24维向量为四法、两端n、三参数的标准化带符号误差，按中位数和MAD标准化，取平均绝对距离最小者。MAD为0依次退到IQR、标准差和1。没有按曲率方向或视觉好看筛选；端点综合中心不保证每项变化均为第50百分位。", "hash": "5b50e6c6b17630bd90f716fb2df5eb5085a48437f06ca4099ac5b2003aaf306d"}, {"id": "n55-5837f418808a", "kind": "image", "src": "assets/31R_四方法参数响应_样本670.png", "alt": "670号五档共同输入的四法三参数响应", "markdown": "![670号五档共同输入的四法三参数响应](../../reviewbyhtml/方法对比-v1.0/assets/31R_四方法参数响应_样本670.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n55-237b7f026993", "kind": "text", "html": "\u003cp\u003e这是单条路径估计减真值，不是Bias或SD。中间档若失败应保留缺口；670号五档四法均成功。\u003c/p\u003e", "markdown": "这是单条路径估计减真值，不是Bias或SD。中间档若失败应保留缺口；670号五档四法均成功。", "hash": "f785fcad03c51255d90e143d6407ac9e1e0fafc60d83f0b82f998d3b3e5c14ba"}, {"id": "n55-38b2041f7882", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔβ分位\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔη分位\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔγ分位\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e75.6%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e85.8%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e17.6%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e55.1%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e61.9%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e55.1%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM-0\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e47.2%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e68.8%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e32.4%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM-0.1\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e40.3%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e59.7%\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e52.8%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法 | Δβ分位 | Δη分位 | Δγ分位 |\n|---|---:|---:|---:|\n| MLE | 75.6% | 85.8% | 17.6% |\n| MMLE | 55.1% | 61.9% | 55.1% |\n| MDM-0 | 47.2% | 68.8% | 32.4% |\n| MDM-0.1 | 40.3% | 59.7% | 52.8% |", "hash": "7798658b1c1b1a6f4b1f40ad7581b068a1c990578fd0083414563f8a36dde8a8"}, {"id": "n55-8303e4fc51de", "kind": "text", "html": "\u003cp\u003e上表在同一88条子群内计算。670号MDM0.1曲率比约在第42.1百分位；MLE和MDM0在n7为零位置，不能称为它们的内部几何中心例。\u003c/p\u003e", "markdown": "上表在同一88条子群内计算。670号MDM0.1曲率比约在第42.1百分位；MLE和MDM0在n7为零位置，不能称为它们的内部几何中心例。", "hash": "f6cfa153cef16662aa7e725ff07f4cc227ae91884d3852ae28c818e51c438239"}, {"id": "n55-b92f04fb3a55", "kind": "text", "html": "\u003ch2\u003e内部曲率子群的中心例与反方向例\u003c/h2\u003e", "markdown": "## 内部曲率子群的中心例与反方向例", "hash": "58deaa392f9ba2fbfa9d588127ddbf6b73a0fae5441bda2d3df810d077f52644"}, {"id": "n55-30a9595992fe", "kind": "image", "src": "assets/31Q_四方法判据_曲率中心_样本640.png", "alt": "MDM零偏移内部曲率子群的中心例640及四法定位", "markdown": "![MDM零偏移内部曲率子群的中心例640及四法定位](../../reviewbyhtml/方法对比-v1.0/assets/31Q_四方法判据_曲率中心_样本640.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n55-1a5c7f2707fa", "kind": "image", "src": "assets/31Q_四方法判据_反向变化_样本330.png", "alt": "反方向变化的330号路径及四法定位", "markdown": "![反方向变化的330号路径及四法定位](../../reviewbyhtml/方法对比-v1.0/assets/31Q_四方法判据_反向变化_样本330.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n55-01ad9f81a036", "kind": "text", "html": "\u003cp\u003eMDM0可靠内部子群39条，15条曲率降低、24条增大。640号为按预定曲率特征选出的子群中心例，330号为下降子群中心例。保留相反方向，不仅挑变平路径解释总体。\u003c/p\u003e", "markdown": "MDM0可靠内部子群39条，15条曲率降低、24条增大。640号为按预定曲 l": "\u003ca id=\"growth-supplement\"\u003e\u003c/a\u003e\u003cp\u003e对应\u003ca href=\"#mechanism-current\"\u003e报告下v2.1\u003c/a\u003e。数据读取正式40条件七法原结果，经共享指标函数汇总。每个条件采用七法共同有效样本，各n集合不相同；这不是同一固定队列的纵向方差变化。未调用估计器或新抽样。\u003c/p\u003e", "markdown": "对应[报告下v2.1](../../报告下（方法对比）-v2.3.md)。数据读取正式40条件七法原结果，经共享指标函数汇总。每个条件采用七法共同有效样本，各n集合不相同；这不是同一固定队列的纵向方差变化。未调用估计器或新抽样。", "hash": "50cac58eda53acd25a675cc336903502f863eb48d31045fe4e9380c79d1f8f50"}, {"id": "n55-6262324db3cf", "kind": "text", "html": "\u003cp\u003e每根柱高为标准化\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eR\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eM\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eS\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e；浅色斜线部分为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eB\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ei\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ea\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003es\u003c/mi\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，实色为经验方差\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eS\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eD\u003c/mi\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，SD采用ddof=1。增长分解为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eM\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eS\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eB\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ei\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ea\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003es\u003c/mi\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，Δ为n=7减n=50；负项抵消增长，不截成零。\u003c/p\u003e", "markdown": "每根柱高为标准化$\\mathrm{RMSE}^2$；浅色斜线部分为$\\mathrm{Bias}^2$，实色为经验方差$V_R=(R-1)\\mathrm{SD}^2/R$，SD采用ddof=1。增长分解为$\\Delta\\mathrm{MSE}=\\Delta\\mathrm{Bias}^2+\\Delta V_R$，Δ为n=7减n=50；负项抵消增长，不截成零。", "hash": "01dc7f9808370917fa489a230b27cd3e34ded96201f04dd8c9eec16e8006da09"}, {"id": "n55-0ccd2ff8d1b0", "kind": "text", "html": "\u003ch2\u003eβ=5的三参数增长分解\u003c/h2\u003e", "markdown": "## β=5的三参数增长分解", "hash": "d930be3ee330314362809cea95e4e22dc49f78a31312a22e108d8d9656c9282b"}, {"id": "n55-c4bf9165f39a", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u00 <script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};

let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;

function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}
function jumpToOutline(entry){entry.target.scrollIntoView({block:'start',behavior:'smooth'})}
function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit)){const headings=[...node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')],base=Math.min(...headings.map(h=>Number(h.tagName.slice(1))));for(const heading of headings){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+1+Number(heading.tagName.slice(1))-base)})}}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}
$('sidebar-toggle').onclick=toggleSidebar;
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;

function deliveryMessage(){
 if(!online)return '离线预览；反馈只能导出';
 const delivery=board.delivery;
 if(board.review_complete)return '当前版本已接受并存档';
 if(board.archive_pending)return '存档请求已应用，文件操作待完成';
 if(board.processing)return '反馈已应用，内容正在更新';
 if(board.submitted){
  if(delivery?.feedback_stage==='read_by_wait')return 'wait 已读取反馈，等待 Agent 处理';
  if(delivery?.wait_active)return '反馈已落盘，等待活动 wait 读取';
  return '反馈已落盘；当前没有活动 wait，请回到聊天恢复审阅';
 }

function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}

function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'||editor.kind==='section-note'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}if(structuredNote(editor)){const unit=board.units.find(u=>u.id===editor.unit_id),option=unit?.options.find(o=>o.id===editor.option_id),block=option?.blocks.find(b=>b.id===editor.block_id);if(editor.kind==='option-note'?option:block&&(editor.kind!=='image-note'||block.images?.some(i=>i.id===editor.image_id)))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}

  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
