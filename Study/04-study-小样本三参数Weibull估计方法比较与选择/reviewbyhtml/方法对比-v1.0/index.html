003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e本章回答：当n减小、β增大时，观察到了什么现象？先比较误差大小、方法间差距、估计分布与异常频率怎样改变，再归纳需要解释的现象。条件变化怎样通过样本信息和估计构造产生这些表现，接在第三章讨论。\u003c/p\u003e", "markdown": "本章回答：当n减小、β增大时，观察到了什么现象？先比较误差大小、方法间差距、估计分布与异常频率怎样改变，再归纳需要解释的现象。条件变化怎样通过样本信息和估计构造产生这些表现，接在第三章讨论。", "hash": "2379c11c7584594c653076956b7f182e3417745d2a1ff7a3f159212ea7f32b10"}]}], "content_hash": "308bdef1eba43bf04d4059ef217b771b306c25451c438239c523a09943b51637"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计范围通常更宽，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e另外，LSE、LRE的位置估计进一步向γ=0聚集，这在n=50时已可见，n=7时边界结果更多。原尺度密度图也呈双峰外观；后续核对发现，剔除零位置结果后未保留两个明显峰，因此这里将边界聚集与非边界估计的偏移分别考察，不据原图认定存在“接近真值与偏移”的两个内部群体。\u003c/p\u003e", "hash": "79ecffbe17ffbb7e91536c03d1aa8e5115e53b5cf836bca97564aa86cd6076bb"}]}], "selected_ids": [], "content_hash": "1236cb8daa3c16e8ccd51ed8e20a35ef49a76fe114169d04f4226b7b7d4c7d79"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": "anomaly-phenomena", "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "modify", "selected": "synthesis-phenomena", "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": ["synthesis-phenomena"], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-chapter-opening", "kind": "text", "html": "\u003cp\u003e第二章建立了性能变化的事实。本章进一步追踪：n减小、β增大怎样改变有限样本所提供的信息；不同方法怎样将这些信息转化为定位判据和参数估计；这些响应又怎样表现为误差、偏移或异常。\u003c/p\u003e", "markdown": "第二章建立了性能变化的事实。本章进一步追踪：n减小、β增大怎样改变有限样本所提供的信息；不同方法怎样将这些信息转化为定位判据和参数估计；这些响应又怎样表现为误差、偏移或异常。", "hash": "8f25ea3d38291f7b742986f42c67169da68e11a776a7bec1a21f27d373ec7d06"}, {"id": "info31-3f6f4f6f1e98", "kind": "text", "html": "\u003cp\u003e3.1固定β，沿同一组样本的删点过程回应2.1的样本量现象；3.2考察形状条件改变后的起点信息、方向性偏移和边界聚集，回应2.2；3.3追踪2.3的明显异常可能在哪个环节形成。典型案例用于解释形成过程，第二章的重复抽样结果用于判断现象在总体比较中有多普遍。\u003c/p\u003e", "markdown": "3.1固定β，沿同一组样本的删点过程回应2.1的样本量现象；3.2考察形状条件改变后的起点信息、方向性偏移和边界聚集，回应2.2；3.3追踪2.3的明显异常可能在哪个环节形成。典型案例用于解释形成过程，第二章的重复抽样结果用于判断现象在总体比较中有多普遍。", "hash": "d865a55b4ad342913d354df747eb8cd402243168b7700537841b87d37d4c1c0a"}]}], "content_hash": "9ed64486aa4a9f67eea529436ae552b6290fa3c186759b918b28ad420ec788b3"}, {"id": "mechanism-high-beta", "title": "3.1　样本量减小时的信息变化与方法响应", "mode": "content", "state": "modify", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "当前正文", "blocks": [{"id": "n-a-opening", "kind": "text", "html": "\u003cp\u003e2.1中，n减小时各方法的误差增幅不同。这里追问它怎样形成：样本减少后，下端覆盖、观测间距，以及有序观测与参考坐标的配对发生了什么变化？这些变化通过哪一步进入不同方法，最终怎样改变参数估计？固定总体为W(5,1000,500)，沿474号50点样本的既有随机删点顺序，依次保留20、15、10、7点，以MMLE、MDM和LSE追踪这一过程。\u003c/p\u003e", "markdown": "2.1中，n减小时各方法的误差增幅不同。这里追问它怎样形成：样本减少后，下端覆盖、观测间距，以及有序观测与参考坐标的配对发生了什么变化？这些变化通过哪一步进入不同方法，最终怎样改变参数估计？固定总体为W(5,1000,500)，沿474号50点样本的既有随机删点顺序，依次保留20、15、10、7点，以MMLE、MDM和LSE追踪这一过程。", "hash": "60cc088cc6f5dfcfe3bcd9b89945f4fa78e4fd5aaa315c547f87c5013de5c414"}, {"id": "info31-c260a7317e40", "kind": "text", "html": "\u003ch4\u003e先看样本信息改变了什么\u003c/h4\u003e", "markdown": "#### 先看样本信息改变了什么", "hash": "17985bd04caab35ad600cd961acfd36797d1c52e1374e7cf7e685b1258cc8490"}, {"id": "info31-71a550d9522d", "kind": "image", "src": "assets/31C_样本信息变化_样本474.png", "alt": "五档嵌套样本的寿命位置、最小值到真实起点的距离及最大相邻间隔", "markdown": "![五档嵌套样本的寿命位置、最小值到真实起点的距离及最大相邻间隔](reviewbyhtml/方法对比-v1.0/assets/31C_样本信息变化_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-a20e6a041882", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e左图各行共用寿命轴：深色刻线为当前保留观测，浅灰刻线为原50点中已删除的观测，蓝点为当前最小值，虚线为真实起点500，橙段标出当前最大相邻间隔。中、右图分别概括下端空缺和点列疏密。刻线不赋予概率密度高度。\u003c/em\u003e\u003c/p\u003e", "markdown": "*左图各行共用寿命轴：深色刻线为当前保留观测，浅灰刻线为原50点中已删除的观测，蓝点为当前最小值，虚线为真实起点500，橙段标出当前最大相邻间隔。中、右图分别概括下端空缺和点列疏密。刻线不赋予概率密度高度。*", "hash": "335bd26e4fdb75a143f110e09766704f03106fe05c9142cdbba02bd6ce9f4884"}, {"id": "info31-7b81fe0e3526", "kind": "text", "html": "\u003cp\u003e两个阶段值得分开看。\u003cstrong\u003e50→20点时，最小值保持930.6，但其他观测及其间距已经改变，最大相邻间隔从104.8增至191.6\u003c/strong\u003e。因此，保留极值并不等于保留了整个点列的信息。\u003cstrong\u003e20→7点时，下端观测丢失，最小值升至1226.9；最大间隔进一步增至334.5\u003c/strong\u003e。从15点开始，本路径已没有寿命低于1200的观测。\u003c/p\u003e", "markdown": "两个阶段值得分开看。**50→20点时，最小值保持930.6，但其他观测及其间距已经改变，最大相邻间隔从104.8增至191.6**。因此，保留极值并不等于保留了整个点列的信息。**20→7点时，下端观测丢失，最小值升至1226.9；最大间隔进一步增至334.5**。从15点开始，本路径已没有寿命低于1200的观测。", "hash": "32881777197dda72efbf364e0706042732a87da5bfb4137a6c9d4e62b49a8c46"}, {"id": "info31-86a8dcc3878a", "kind": "text", "html": "\u003cp\u003e样本量和名次变化还会改变方法使用的参考坐标。MDM重新计算每个有序观测的绘图位置；LSE重新计算对应样本量的理论顺序统计量参考坐标。后面的拟合变化需要结合这些输入一起理解，不能只看最小值或某一个间隔。\u003c/p\u003e", "markdown": "样本量和名次变化还会改变方法使用的参考坐标。MDM重新计算每个有序观测的绘图位置；LSE重新计算对应样本量的理论顺序统计量参考坐标。后面的拟合变化需要结合这些输入一起理解，不能只看最小值或某一个间隔。", "hash": "6f7d7a37fd07bcd3c75ef0048b20a63bca651c423692e6a297fac858ceb894e1"}, {"id": "info31-2defee812a5d", "kind": "image", "src": "assets/31G_样本进入构造_样本474.png", "alt": "同一观测在MDM伪尺度和LSE回归点列中的坐标随样本量改变", "markdown": "![同一观测在MDM伪尺度和LSE回归点列中的坐标随样本量改变](reviewbyhtml/方法对比-v1.0/assets/31G_样本进入构造_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-6c0c8d518c3c", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e为看清信息怎样进入构造，MDM暂固定β=5、γ=500，LSE暂固定γ=500；这一步展示输入变换，尚未选择位置。黑圈及箭头标出50→20点时同一个最小观测930.6。MDM虚线为尺度真值1000；各点的纵坐标为该观测反算的伪尺度。\u003c/em\u003e\u003c/p\u003e", "markdown": "*为看清信息怎样进入构造，MDM暂固定β=5、γ=500，LSE暂固定γ=500；这一步展示输入变换，尚未选择位置。黑圈及箭头标出50→20点时同一个最小观测930.6。MDM虚线为尺度真值1000；各点的纵坐标为该观测反算的伪尺度。*", "hash": "5210469630071ba8127100c65656d818da90228e600e7f943662f22ba64c3383"}, {"id": "info31-57a7d83bffe5", "kind": "text", "html": "\u003cp\u003e在MDM中，每个观测与其绘图位置配对，反算一个伪尺度，再用这些伪尺度的离散程度构造判据。删点后，即使930.6这个观测保留下来，它对应的绘图位置也从0.0139变成0.0343，反算的伪尺度随之改变；其他观测的删除和重排名次还会共同改变整组伪尺度。在LSE中，同一个930.6的对数距离不变，但横轴参考坐标改变；整个回归点列因此改变。\u003cstrong\u003e传入估计构造的信息既包括保留哪些数值，也包括它们在当前样本中与什么参考量配对。\u003c/strong\u003e\u003c/p\u003e", "markdown": "在MDM中，每个观测与其绘图位置配对，反算一个伪尺度，再用这些伪尺度的离散程度构造判据。删点后，即使930.6这个观测保留下来，它对应的绘图位置也从0.0139变成0.0343，反算的伪尺度随之改变；其他观测的删除和重排名次还会共同改变整组伪尺度。在LSE中，同一个930.6的对数距离不变，但横轴参考坐标改变；整个回归点列因此改变。**传入估计构造的信息既包括保留哪些数值，也包括它们在当前样本中与什么参考量配对。**", "hash": "db4f1d0dde33fe413c35f2f0b3fd6213eec3ec31efba53d04bc2b5ab0962cce0"}, {"id": "info31-28ac9fee19f8", "kind": "text", "html": "\u003ch4\u003e再看三种构造怎样处理这些变化\u003c/h4\u003e", "markdown": "#### 再看三种构造怎样处理这些变化", "hash": "6ad30d7599ce0c144aecfd05cea81722b7efe3c316e6f8522b3a8df06daf28ed"}, {"id": "n-why-intro", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e进入构造的样本信息\u003c/th\u003e\u003cth\u003e参数确定原则及变化入口\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e最小观测，以及其他观测到最小值的正距离\u003c/td\u003e\u003ctd\u003e直接以最小值定位置；剔除该最小观测，对余下正距离构造二参数似然并求极大值，恢复形状与尺度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e有序寿命与按当前n计算的绘图位置\u003c/td\u003e\u003ctd\u003e每个候选位置下，先找使伪尺度标准差最小的形状；再用最小标准差对位置的梯度达到0.1来定位；最后取伪尺度均值恢复尺度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd\u003e平移后的对数寿命与按当前n计算的White参考坐标\u003c/td\u003e\u003ctd\u003e每个候选位置下重新回归，选F比最大的位置；形状取回归斜率倒数，尺度取截距的指数\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法 | 进入构造的样本信息 | 参数确定原则及变化入口 |\n| --- | --- | --- |\n| MMLE | 最小观测，以及其他观测到最小值的正距离 | 直接以最小值定位置；剔除该最小观测，对余下正距离构造二参数似然并求极大值，恢复形状与尺度 |\n| MDM | 有序寿命与按当前n计算的绘图位置 | 每个候选位置下，先找使伪尺度标准差最小的形状；再用最小标准差对位置的梯度达到0.1来定位；最后取伪尺度均值恢复尺度 |\n| LSE | 平移后的对数寿命与按当前n计算的White参考坐标 | 每个候选位置下重新回归，选F比最大的位置；形状取回归斜率倒数，尺度取截距的指数 |", "hash": "d5ce05f607b3624461f4a1388d6b55e3245b4071b9af413b4456478cdca7711d"}, {"id": "n-a-criteria", "kind": "image", "src": "assets/31D_定位判据响应_样本474.png", "alt": "MMLE最小值定位、MDM实际梯度阈值和LSE实际匹配准则对三档样本的响应", "markdown": "![MMLE最小值定位、MDM实际梯度阈值和LSE实际匹配准则对三档样本的响应](reviewbyhtml/方法对比-v1.0/assets/31D_定位判据响应_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-eb9f0375e37b", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e蓝、绿、橙分别为n=50、20、7，圆点为该方法所选位置。MDM曲线在每个位置都先对形状优化，再对最小标准差求梯度；水平虚线为0.1。LSE画每个位置重新回归后的1−R²，同一n下其最低点与F比最大点等价。图中不同n的准则高度不用于比较估计精度。\u003c/em\u003e\u003c/p\u003e", "markdown": "*蓝、绿、橙分别为n=50、20、7，圆点为该方法所选位置。MDM曲线在每个位置都先对形状优化，再对最小标准差求梯度；水平虚线为0.1。LSE画每个位置重新回归后的1−R²，同一n下其最低点与F比最大点等价。图中不同n的准则高度不用于比较估计精度。*", "hash": "8dcf0b56062cb82d7b20685327ea3806923862a32ebb8ab36d7ab7d604f953be"}, {"id": "n-a-reading", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e50→20点提供了一个直接的构造对照\u003c/strong\u003e。最小值不变，MMLE的位置仍为930.6；MDM的位置却从733.7降至683.7，LSE从662.5降至550.5。后两种方法使用整个点列及其参考关系，因此，即使极值不变，也会重新定位。MMLE的形状和尺度仍需重估：参与似然的正距离从49个变成19个，位置固定并不表示另外两个参数固定。\u003c/p\u003e", "markdown": "**50→20点提供了一个直接的构造对照**。最小值不变，MMLE的位置仍为930.6；MDM的位置却从733.7降至683.7，LSE从662.5降至550.5。后两种方法使用整个点列及其参考关系，因此，即使极值不变，也会重新定位。MMLE的形状和尺度仍需重估：参与似然的正距离从49个变成19个，位置固定并不表示另外两个参数固定。", "hash": "1ec69cd1983d4d8802b0ba2edccd641a0615c06fc7b7d01ea65809ceb87eba78"}, {"id": "info31-997349ef8819", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e20→7点时，下端信息也改变了\u003c/strong\u003e。MMLE的位置直接跟随最小值升至1226.9；MDM的梯度交点移至1143.8，LSE的匹配最低点移至1174.0。同一批观测的减少，经过三种定位原则，产生了不同的参数响应。这里比较的是具体构造，不能把MMLE的最小值规则推广给所有似然方法。\u003c/p\u003e", "markdown": "**20→7点时，下端信息也改变了**。MMLE的位置直接跟随最小值升至1226.9；MDM的梯度交点移至1143.8，LSE的匹配最低点移至1174.0。同一批观测的减少，经过三种定位原则，产生了不同的参数响应。这里比较的是具体构造，不能把MMLE的最小值规则推广给所有似然方法。", "hash": "b1f84a6aa965d1a20979688e260cb4061226a15bdb868f23b302cca6cd29c949"}, {"id": "info31-9223b12a5030", "kind": "text", "html": "\u003ch4\u003e这些响应怎样表现为估计误差\u003c/h4\u003e", "markdown": "#### 这些响应怎样表现为估计误差", "hash": "2bbf40de17a8dacb18f7c8623201f491c685fee39496a6d3659efb02b1da256a"}, {"id": "info31-98d6083e6aa0", "kind": "image", "src": "assets/31E_单次误差响应_样本474.png", "alt": "五档样本下三种方法的形状、尺度及位置带符号误差轨迹", "markdown": "![五档样本下三种方法的形状、尺度及位置带符号误差轨迹](reviewbyhtml/方法对比-v1.0/assets/31E_单次误差响应_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-eba4ec3bb8b0", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e三列依次为形状、尺度、位置的“估计值减真值”；横轴按既有路径排列，连线连接已计算的离散状态。零线表示单次误差为0。这里没有重复抽样平均，不将单次误差称为Bias。\u003c/em\u003e\u003c/p\u003e", "markdown": "*三列依次为形状、尺度、位置的“估计值减真值”；横轴按既有路径排列，连线连接已计算的离散状态。零线表示单次误差为0。这里没有重复抽样平均，不将单次误差称为Bias。*", "hash": "721e0d9317673e2e7cc62acf124de451658ae3a8d95635d7e02db722f377362b"}, {"id": "n-before-after-reading", "kind": "text", "html": "\u003cp\u003e50→20点时，MDM的位置和尺度误差减小，形状误差略增；LSE的三个参数都更接近真值。20→7点的两个端点相比，三种方法的形状、尺度低估和位置高估均加重。但中间过程并非单向恶化，例如10→7点时MDM、LSE的误差又有小幅回落。\u003cstrong\u003e方法对样本信息变化作出响应，单条路径上的误差不必随n逐步增大。\u003c/strong\u003e\u003c/p\u003e", "markdown": "50→20点时，MDM的位置和尺度误差减小，形状误差略增；LSE的三个参数都更接近真值。20→7点的两个端点相比，三种方法的形状、尺度低估和位置高估均加重。但中间过程并非单向恶化，例如10→7点时MDM、LSE的误差又有小幅回落。**方法对样本信息变化作出响应，单条路径上的误差不必随n逐步增大。**", "hash": "7db7af5832f3447359ef9ca1c16d48681cd8a2d0f974af9aa1543b66a1e104a9"}, {"id": "info31-b4ad4e5d8651", "kind": "text", "html": "\u003ch4\u003e把位置对参数恢复的影响单独拿出来看\u003c/h4\u003e", "markdown": "#### 把位置对参数恢复的影响单独拿出来看", "hash": "2d4ca676c015ace0de73a7e3e4f6a81984dd21580091cc986474cd91a3e3be0b"}, {"id": "n-recovery-intro", "kind": "text", "html": "\u003cp\u003e实际删点同时改变了样本和所选位置。为单独检查位置的作用，下面固定最终保留的同一组7点，保持各法n=7的绘图位置或理论坐标不变，只将代入位置分别设为该法50点时和7点时的估计。\u003c/p\u003e", "markdown": "实际删点同时改变了样本和所选位置。为单独检查位置的作用，下面固定最终保留的同一组7点，保持各法n=7的绘图位置或理论坐标不变，只将代入位置分别设为该法50点时和7点时的估计。", "hash": "48ba4a3405f1fcf2b51a2219435c8403633003e34dd82ec4384234c6e861db70"}, {"id": "n-parameter-recovery", "kind": "image", "src": "assets/31F_固定七点的位置条件对照_样本474.png", "alt": "固定同一组七点和参考坐标、只改变代入位置时的MDM与LSE条件参数恢复", "markdown": "![固定同一组七点和参考坐标、只改变代入位置时的MDM与LSE条件参数恢复](reviewbyhtml/方法对比-v1.0/assets/31F_固定七点的位置条件对照_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-e25289b5a4b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两种颜色都使用同一7点样本。蓝色代入该法50点时的位置，橙色代入7点时的位置；蓝色曲线及参数不是50点样本的原估计。左图在给定位置下寻找MDM标准差谷底，纵轴聚焦0—300；中图在相同参考坐标上回归LSE对数距离；右图为各自恢复的尺度。\u003c/em\u003e\u003c/p\u003e", "markdown": "*两种颜色都使用同一7点样本。蓝色代入该法50点时的位置，橙色代入7点时的位置；蓝色曲线及参数不是50点样本的原估计。左图在给定位置下寻找MDM标准差谷底，纵轴聚焦0—300；中图在相同参考坐标上回归LSE对数距离；右图为各自恢复的尺度。*", "hash": "9953f9654b8f0656794564d8ebaef72b687e08c49dd417a0cdaba436bf6addae"}, {"id": "n-recovery-reading", "kind": "text", "html": "\u003cp\u003e对MDM，仅提高代入位置，条件恢复的形状便从4.34降至1.76，尺度从799.6降至363.2。对LSE，下端观测到起点的距离缩短比例更大，对数距离低端下降更多，回归线变陡；条件形状从5.23降至1.52，尺度从871.0降至332.9。这一对照支持本例中位置变化会向形状、尺度恢复传递；实际删点的总变化还包含观测集合及参考坐标改变的共同影响。\u003c/p\u003e", "markdown": "对MDM，仅提高代入位置，条件恢复的形状便从4.34降至1.76，尺度从799.6降至363.2。对LSE，下端观测到起点的距离缩短比例更大，对数距离低端下降更多，回归线变陡；条件形状从5.23降至1.52，尺度从871.0降至332.9。这一对照支持本例中位置变化会向形状、尺度恢复传递；实际删点的总变化还包含观测集合及参考坐标改变的共同影响。", "hash": "a0eec7790d3670e21ee2d39b468a37342620645b1812f31c691944556aaa3fc4"}, {"id": "info31-6df31aabe121", "kind": "text", "html": "\u003cp\u003e本节由同一条路径说明：样本信息改变后，极值定位、梯度阈值和回归匹配会产生不同响应，进而表现为不同的单次误差。第二章的重复抽样结果承担总体性能比较；这里不据单例分解全部方法的RMSE差距。形状条件对起点信息的影响接在3.2讨论，约束与求解问题在后续机制案例中展开。\u003c/p\u003e", "markdown": "本节由同一条路径说明：样本信息改变后，极值定位、梯度阈值和回归匹配会产生不同响应，进而表现为不同的单次误差。第二章的重复抽样结果承担总体性能比较；这里不据单例分解全部方法的RMSE差距。形状条件对起点信息的影响接在3.2讨论，约束与求解问题在后续机制案例中展开。", "hash": "46e944b9456ca21e8832980b0519045a24d5a326a2c227d497f048d9ee04ecf0"}, {"id": "n-a-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e样本和方法实现来源、15条路径估计、实际定位准则、固定7点条件对照及图像指纹见\u003ca href=\"file:///C:/Web/Weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E6%9C%BA%E5%88%B6%E9%93%BE%E6%A0%B8%E9%AA%8C.json\"\u003e3.1机制链核验\u003c/a\u003e。沿用既有删点规则；本机路径缓存缺失时仅恢复该路径15条诊断估计，n=50与正式存档逐项核对，不新增独立Monte Carlo，也不修改正式结果。\u003c/em\u003e\u003c/p\u003e", "markdown": "*样本和方法实现来源、15条路径估计、实际定位准则、固定7点条件对照及图像指纹见[3.1机制链核验](结果呈现/比较探索/3.1机制链核验.json)。沿用既有删点规则；本机路径缓存缺失时仅恢复该路径15条诊断估计，n=50与正式存档逐项核对，不新增独立Monte Carlo，也不修改正式结果。*", "hash": "3618aff9d03e25f2166dd6b2652f39dc709782bc6a252542af24524301a9cc01"}, {"id": "n-gallery-heading", "kind": "text", "html": "\u003ch4\u003e补充浏览：五档CDF拟合与误差\u003c/h4\u003e", "hash": "aa1a61097e8e3156521c9affd247a22b50ffb41c1a4611de18a534f1839d83b0"}, {"id": "n-before-after", "kind": "gallery", "aspect_ratio": 1.6666666666666667, "images": [{"id": "n50", "label": "n = 50", "src": "assets/31_嵌套删点_样本474_n50.png", "alt": "同一嵌套删点路径n=50：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n20", "label": "n = 20", "src": "assets/31_嵌套删点_样本474_n20.png", "alt": "同一嵌套删点路径n=20：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n15", "label": "n = 15", "src": "assets/31_嵌套删点_样本474_n15.png", "alt": "同一嵌套删点路径n=15：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n10", "label": "n = 10", "src": "assets/31_嵌套删点_样本474_n10.png", "alt": "同一嵌套删点路径n=10：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}, {"id": "n7", "label": "n = 7", "src": "assets/31_嵌套删点_样本474_n7.png", "alt": "同一嵌套删点路径n=7：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号误差"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-before-after-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e同一路径的样本减少，在三种方法中引起不同的拟合与参数变化。按n=50→20→15→10→7切换；上排三列依次为MMLE、MDM、LSE，各列只画本法拟合CDF，并以灰色虚线对照真实CDF。黑点是本组寿命观测，纵坐标为按当前n计算的(i−0.5)/n，仅作概率图展示；底部短刻线保留实际寿命位置。下排三列依次为形状、尺度、位置的带符号误差（估计值减真值），零线表示无偏离；这是单一样本的误差，不是重复抽样的平均Bias。各档CDF共用坐标，同一参数各档也共用纵轴范围。\u003c/em\u003e\u003c/p\u003e", "hash": "87a73d87c9f67575c372985e97c6ebcd54d4425869e5125a2ee172089127dd43"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "3a5e496cf709aa14d148080bd2022921de066b4ffe9e28a2d310bd3e64b4dd28"}, {"id": "mechanism-n-background", "title": "3.2　形状条件下的偏移与边界聚集", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：β=2与5、n=7/15/30时观测、最小观测及其与真实起点的距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003e相同n下，β=5时的最小观测比β=2时更远离真实起点；样本量减小时，这段距离进一步增大。下排最小观测的分布也显示，较大β下，即使增加样本，最小观测仍可能与起点保持较大距离。观测集中于分布中部，起点附近缺少数据，位置参数需要从较远处外推。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用Research00报告1图2：η=1000、γ=500，β=2、5，n=7、15、30。橙点为每组样本的最小观测，灰线为其到真实起点的距离；下排为最小观测的理论密度。历史样本仅用于解释，不并入本轮1200次统计。\u003c/em\u003e\u003c/p\u003e", "hash": "ab9280998b57d2e310a3a6d8186c6802fd518a75f1018f80016e90982f0438be"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "Research00报告1：W(5,1000,500)与W(2,500,1000)在样本覆盖区间内接近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-compatible-reading", "kind": "text", "html": "\u003cp\u003e最小观测远离起点时，有限样本主要覆盖分布中部。图中的两组参数虽然相差较大，在这些观测所在的区间内，分布曲线仍较接近。因此，样本可能容许不同的参数组合；还需要追踪方法判据为什么选中了其中某一组。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用Research00报告1图3：β=5、n=7第31组样本；黑点累计概率由样本排序近似。两条曲线用于说明参数相容，不代表该样本必然被估成其中某一组参数。\u003c/em\u003e\u003c/p\u003e", "hash": "f2b580f3edfedd4b68ec62958dbc2134d53283d5ebf5df381c9979a4857eeb6f"}, {"id": "shape-a-opening", "kind": "text", "html": "\u003ch4\u003e方向性偏移的形成\u003c/h4\u003e\u003cp\u003eMDM仍按同一个梯度阈值定位。高β时，各观测反算的伪尺度随位置变化更接近同步，标准差梯度较小，阈值交点可能出现在偏高位置。位置提高后，小观测到起点的距离缩短比例更大，需要更小的形状维持伪尺度的一致，再恢复出更小尺度。\u003c/p\u003e", "hash": "1efab47cdb8268d2243e772c8f6bd9a6335f5c03bd095020e56c8126d4d8e954"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00报告1：梯度阈值选中较高位置后，形状和尺度随之降低", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-mdm-reading", "kind": "text", "html": "\u003cp\u003e图中先看梯度交点，再沿同一位置看形状与尺度。这样，位置偏高、形状偏低、尺度偏低对应的是同一估计过程的传递，三个参数的偏差有共同来源。\u003c/p\u003e\u003cp\u003e\u003cem\u003eResearch00报告1图5，δ=0.1；β=2、5，n=7第48组配对样本。用于说明传递路径，不据单例认定全部方法或全部样本均如此。\u003c/em\u003e\u003c/p\u003e\u003ch4\u003e边界聚集的形成\u003c/h4\u003e", "hash": "0856234232a9a303aaf2bbbe57bfffbe02db8bec91d472d69c7266bee3f314c4"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "Research00报告2：LSE左移位置改善线性匹配，最佳位置可落在零边界或内部", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-boundary-reading", "kind": "text", "html": "\u003cp\u003eLSE移动位置是为了让对数距离与参考坐标更接近直线。左移位置会压缩下端对数间距；当这能改善点列匹配时，准则倾向于更低位置。图中橙色样本在允许范围内的最低点落到γ=0，紫色样本的最低点则留在内部。γ≥0的约束使不同样本都可能返回同一个零值，重复估计中便形成边界聚集。\u003c/p\u003e\u003cp\u003e选低位置也压缩了整体对数跨度，使LSE回归斜率减小，取倒数后形状升高。因此，边界位置和形状高估可以沿同一条恢复关系连接起来。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用报告2图6：正常与零边界样本为W(2,100,500)、n=15第35、36组；内部左偏为W(2,1000,3000)、n=7第1组。这里借用其机制图，不将这些历史条件并入本轮β=5统计。\u003c/em\u003e\u003c/p\u003e", "hash": "03c7d488d6d3176d7ca5d8a9e32426de386311f26780c19387f1ef379e2b8533"}]}], "content_hash": "01f22463683d3d14304ef8dbe408a256f329e7cb1b32d89297bd01218d5925ad"}, {"id": "mechanism-boundary", "title": "3.3　明显异常估计的形成", "mode": "content", "state": "modify", "selected": "mechanism-boundary", "options": [{"id": "mechanism-boundary", "label": "当前内容", "blocks": [{"id": "anomaly-opening", "kind": "text", "html": "\u003cp\u003e明显异常估计要追踪异常在哪个估计环节形成。Research00报告2区分了两种情况：当前方法的准则确实支持一组明显偏离真值的参数；或搜索、停止、候选接受没有正确落实预定规则。\u003c/p\u003e\u003ch4\u003e样本结构改变判据，异常参数仍可满足方法规则\u003c/h4\u003e", "hash": "3d380156aac209e9d99d1cf7cede068e50e9b5d4ed2bc616e27217a00cc83c6c"}, {"id": "anomaly-statistical", "kind": "gallery", "aspect_ratio": 1.68, "images": [{"id": "lse-right", "label": "LSE：改善线性匹配后，形状反而明显低估", "src": "assets/R00_报告2_LSE_right.png", "alt": "报告2图7：远端观测改变点列，位置右移改善匹配并使形状降低"}, {"id": "wmle-low", "label": "WMLE：两条方程均满足，参数仍明显偏离真值", "src": "assets/R00_报告2_WMLE_low.png", "alt": "报告2图12：样本距离改变共同交点，残差趋零但形状与尺度仍低估"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-lse-reading", "kind": "text", "html": "\u003cp\u003eLSE的异常样本中，前几个观测相对集中，另有一个较远观测。真位置下的点列与参考坐标匹配较差，右移位置能拉开下端对数间距，使点列更接近直线。准则因此选中靠近最小观测的位置，但随之增大的回归斜率取倒数后，形状明显降低，尺度也由缩小的距离恢复为较低值。\u003c/p\u003e\u003cp\u003eWMLE的异常样本改变了下端距离、对数距离和幂加权距离，两条方程的共同交点移向较高位置、较低形状。将返回参数代回，残差仍接近零。这里不是方程没有解对，而是这些样本统计量本身支持了偏离真值的参数。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用报告2图7、12。LSE为W(2,1000,500)、n=7第18、19组；WMLE为W(5,100,500)、n=7第3、11组。保留历史实现及参数条件，只解释形成路径。\u003c/em\u003e\u003c/p\u003e\u003ch4\u003e数值求解未落实规则，也能形成异常返回\u003c/h4\u003e", "hash": "f6b47d9098f83f9e460bbfb8f4b4215325d0ab5af620ca224be2beb61ec4c551"}, {"id": "anomaly-solver", "kind": "image", "src": "assets/R00_报告2_MLE_stop.png", "alt": "报告2图17：旧MLE近零停点仍存在提高似然的方向", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-solver-reading", "kind": "text", "html": "\u003cp\u003e旧MLE的第37组在近零位置停止，优化器标记收敛；其他起点的返回结果又因形状不满足接受条件被剔除，最终只剩这个候选。但图中向右仍可提高似然，说明搜索停止及候选接受没有实现预期的最优选择。近零位置进一步压缩对数跨度，形成较大的形状估计。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图17，W(2,1000,3000)、n=7第37、38组，采用旧MLE。Study04已更新求解器，此例用于区分计算来源，不认定新版仍有同一缺陷。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e前两例应研究估计准则对样本结构的响应；后一例应改进求解与候选检查。异常表现相近，形成环节不同，改进方向也不同。\u003c/p\u003e", "hash": "2970d3a7da3090180bc99663a9a2c94d3c842ff573dbe65940e03fb35141cbf8"}]}], "selected_ids": ["mechanism-boundary"], "content_hash": "512d4ac5b36d27378c5f782504a6468217c3ac96d8bb06b6e10e0ae66bb00282"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "60e3a18b546fd1677a2d2f935ab3875baef2da72bea8ce5f454e020b14b56217"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "1a161b266aac2eba5fcdeeb8bcd4972db1965ec18f91f900609e103c048f4784"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}], "last_applied_submission_id": "d80e7b7e-0943-4068-a2fc-7fedb3825370", "last_rendered_submission_id": "d80e7b7e-0943-4068-a2fc-7fedb3825370", "outline_confirmed": true, "review_complete": false, "review_runtime": "0.7.1", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parameters": ["beta", "eta", "gamma"], "subsets": ["own", "common"]}, "shape_winner_transition": {"beta": [4.5, 5], "n": [50, 20, 15, 10, 7], "winners": ["WMLE", "WMLE", "WMLE", "MDM-0.1", "MMLE"], "subsets": ["own", "common"]}, "gap_checked_regions": {"expanded_beta": [1.5, 2, 2.5, 3], "contracted_beta": [4.5, 5], "n": [50, 7], "parameters": ["beta", "eta", "gamma"]}}, "chapter3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "checked_subsets": ["own", "common"], "historical_scope": "Research00机制示例：β=2、5，n=7、15、30；不并入Study04统一1200次比较。", "r00_figure_sources": {"assets/R00_图3_参数组合与样本相容.png": "Research/00-方法对比/交付/结果/报告1/图2_样本与分布相容.png", "assets/R00_MDM_梯度阈值与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图3_MDM六格机制.png", "assets/R00_LSE_判据与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图4_LSE六格机制.png", "assets/R00_WMLE_联合方程与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图6_WMLE六格机制.png", "assets/R00_MDM_位置形状尺度传递.png": "Research/00-方法对比/交付/结果/报告1/图4_MDM参数传递.png", "assets/R00_报告2_LSE_right.png": "Research/00-方法对比/交付/结果/报告2/配对情形_LSE_right.png", "assets/R00_报告2_WMLE_low.png": "Research/00-方法对比/交付/结果/报告2/配对情形_WMLE_low.png", "assets/R00_报告2_MLE_stop.png": "Research/00-方法对比/交付/结果/报告2/配对情形_MLE_stop.png"}, "explanation_limit": "MMLE的n响应来自最小值分布的精确关系；MDM为历史受控诊断与本轮统计的对应解释；边界混合分解为本轮逐次结果的精确分组，边界来源核对限于已有8个廓线案例。尚未逐一量化全部方法对RMSE距离变化的机制贡献。", "phenomenon_explanation_check": "结果呈现/分析数据/现象解释补图核对.json", "precision_relationship_options": {"status": "第26轮候选保留在Git；第29轮按用户指定的章节对应关系重组为正文，未执行候选C的配对删样或干预。", "analysis": "结果呈现/分析数据/精度关系解释候选核对.json", "scope": "四条件位置误差分层诊断复用于3.1；不是全部方法与参数的完整机制分解。", "new_estimates": false, "boundary": "A为误差组成解释；B为分层与重加权诊断；C的配对删样和干预尚未执行。", "previous_version": "Git ba6052f2保留第25轮原3.2。"}, "anomaly_reference_check": "结果呈现/分析数据/异常现象与素材复用核对.json", "anomaly_reference_scope": "280个方法条件的异常频率逐项与原始行对拍；2.3为Study04现象，3.3报告2图为历史机制示例，旧MLE停止问题不作为新版现状。", "interior_modes": "结果呈现/分析数据/同样本拟合与内部峰核对.json；三带宽四条件非边界尺度密度均单峰，未支持独立于边界的双峰。", "mechanism_candidates_sources": {"R00_图3_参数组合与样本相容.png": {"source": "D:\\weibull\\Research\\00-方法对比\\交付\\结果\\报告1\\图2_样本与分布相容.png", "sha256": "00330cf4a364a4b87d3c3cb2476bdd7493aba7814a9d8412ad7411164c8eddde"}, "R00_报告2_LSE零边界.png": {"source": "D:\\weibull\\Research\\00-方法对比\\交付\\结果\\报告2\\配对情形_LSE_zero.png", "sha256": "c444a140da83bf9f994083998ac6a381203e4ca18710fa547aa0f8143efe99f2"}}, "fixed_position_control": "结果呈现/分析数据/第三章固定真位置对照.csv", "current_section31_evidence": "section_3_1_evidence; older diagnostic fields remain historical sources, not the current section3.1 analysis."}, "manuscript_version": "2.1", "archive_targets": {"output": "C:/Web/Weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v2.1.md", "previous": "C:/Web/Weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v2.0.md", "archive": "C:/Web/Weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/其他/历史版本/报告下（方法对比）-v2.0.md", "sync_remote": true}, "manuscript_date": "2026-10-24", "section_3_1_evidence": {"source": "结果呈现/比较探索/3.1机制链核验.json", "sha256": "830e799f45d90eaf1b8cb758f19f0471923f0f02226f908a62851aa9f4c9492a", "self_review": "结果呈现/比较探索/3.1讲述目标与自检.md", "scope": "One existing beta=5 nested path 474; 15 restored diagnostic estimates, fixed-seven conditional recovery; no independent Monte Carlo or population RMSE decomposition."}}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;
try{sidebarVisible=(localStorage.getItem(sidebarKey())??localStorage.getItem(`review-html:${board.id}:sidebar-pinned`))==='true'}catch{}
function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}
function jumpToOutline(entry){entry.target.scrollIntoView({block:'start',behavior:'smooth'})}
function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit))for(const heading of node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+Math.max(1,Number(heading.tagName.slice(1))-2))})}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}
$('sidebar-toggle').onclick=toggleSidebar;
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function deliveryMessage(){
 if(!online)return '离线预览；反馈只能导出';
 const delivery=board.delivery;
 if(board.review_complete)return '当前版本已接受并存档';
 if(board.archive_pending)return '存档请求已应用，文件操作待完成';
 if(board.processing)return '反馈已应用，内容正在更新';
 if(board.submitted){
  if(delivery?.feedback_stage==='read_by_wait')return 'wait 已读取反馈，等待 Agent 处理';
  if(delivery?.wait_active)return '反馈已落盘，等待活动 wait 读取';
  return '反馈已落盘；当前没有活动 wait，请回到聊天恢复审阅';
 }
 if(!delivery)return '等待进程状态尚未确认';
 return delivery.wait_active?'当前有活动 wait 正在等待反馈':'页面可用；当前没有活动 wait';
}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}

function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
