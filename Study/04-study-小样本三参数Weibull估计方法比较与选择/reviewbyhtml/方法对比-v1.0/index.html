td\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计结果通常更分散，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e随着β增大，LSE、LRE的位置估计还进一步向γ=0聚集；n=50时已可见，n=7时边界结果更多。\u003c/p\u003e", "hash": "0f90ce7cd26fca6ea3916268f94bd05d16da9de42a7c378933a4ef598d09c0e0"}]}], "selected_ids": [], "content_hash": "712deb08325fc44234cfe375e02b4c9097ea24154e952662c0aaef5ffd671c85"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": null, "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "selected_ids": [], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "open", "selected": null, "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": [], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "common-4da126bc6533", "kind": "text", "html": "\u003ch3\u003e共同解释基础\u003c/h3\u003e", "markdown": "### 共同解释基础", "hash": "a6c16428afa35f33dded733615ec8754d145c4d3e7ffbf1c02306c4e507c36d3"}, {"id": "common-01b752309b9f", "kind": "text", "html": "\u003cp\u003e在追踪各方法的响应前，先考察两个共同问题：样本量n和形状参数β怎样影响最小观测与真实起点之间的距离；有限观测为什么仍可能与差别较大的参数组合相容。\u003c/p\u003e", "markdown": "在追踪各方法的响应前，先考察两个共同问题：样本量n和形状参数β怎样影响最小观测与真实起点之间的距离；有限观测为什么仍可能与差别较大的参数组合相容。", "hash": "24f60a6fd76b171723e621cadef8378bd1b30a9afdd0edc00d3180af7b7a3784"}, {"id": "common-34099d9efeca", "kind": "text", "html": "\u003ch4\u003en、β与最小观测值\u003c/h4\u003e", "markdown": "#### n、β与最小观测值", "hash": "607b2413cf7308c29a750cc305ea5421e8d35a1e8dcf1c32e987280bfeca6552"}, {"id": "common-beef8a6c76ac", "kind": "text", "html": "\u003cp\u003e记一组样本的最小观测为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，真实起点为γ。两者之间的距离\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e反映起点附近没有被观测覆盖的范围。最小观测给出了数据的左端，真实起点则仍需由样本和估计规则推断。\u003c/p\u003e", "markdown": "记一组样本的最小观测为$x_{(1)}$，真实起点为γ。两者之间的距离$x_{(1)}-\\gamma$反映起点附近没有被观测覆盖的范围。最小观测给出了数据的左端，真实起点则仍需由样本和估计规则推断。", "hash": "0f1e1a8e9710c1f8eab9ebbcf6c0a2edf4cfdc71bf04daeb5fda07e67a70c4b8"}, {"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "固定尺度和位置时，n、β对最小观测及下端覆盖的影响", "markdown": "![固定尺度和位置时，n、β对最小观测及下端覆盖的影响](../../reviewbyhtml/方法对比-v1.0/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "common-9bb75137a978", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eη=1000、γ=500；两列为β=2与5，三行为n=7、15、30。蓝点为观测，橙点为每组最小观测，灰线连接真实起点与最小观测。下排为最小观测的理论密度。图复用Research00报告1的存档样本。\u003c/em\u003e\u003c/p\u003e", "markdown": "*η=1000、γ=500；两列为β=2与5，三行为n=7、15、30。蓝点为观测，橙点为每组最小观测，灰线连接真实起点与最小观测。下排为最小观测的理论密度。图复用Research00报告1的存档样本。*", "hash": "290de7dd68391ac9fdc825d328b64782e877768f4e4bbbce3e7596590c24e64e"}, {"id": "common-12f8c783f037", "kind": "text", "html": "\u003cp\u003e固定β时，n减小使抽到低寿命观测的机会减少，最小观测的分布向右移动，起点到最小观测之间更容易留下较大空白。固定n时，图中β=5的最小观测比β=2更远离真实起点；此时观测更集中于分布中部，起点附近的覆盖更少。\u003c/p\u003e", "markdown": "固定β时，n减小使抽到低寿命观测的机会减少，最小观测的分布向右移动，起点到最小观测之间更容易留下较大空白。固定n时，图中β=5的最小观测比β=2更远离真实起点；此时观测更集中于分布中部，起点附近的覆盖更少。", "hash": "52db62c9080fe7cd1dd1b2773670aaf098ad0a023f80ecc443c8d4265a374ec3"}, {"id": "common-f1cd790e1972", "kind": "text", "html": "\u003cp\u003e这一关系可由最小次序统计量直接说明。对独立同分布的三参数Weibull样本，起点之后长度为d的区间内没有观测的概率为：\u003c/p\u003e", "markdown": "这一关系可由最小次序统计量直接说明。对独立同分布的三参数Weibull样本，起点之后长度为d的区间内没有观测的概率为：", "hash": "523b60d052168550bd831a0e523a3b9923fbe9d70eaf12db62d88bf1bc944969"}, {"id": "common-6273fe10261b", "kind": "visual", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ePr\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eexp\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e[\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msup\u003e\u003cmo fence=\"true\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0.\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\Pr\\left(x_{(1)}\u003e\\gamma+d\\right)=[1-F(\\gamma+d)]^n=\\exp\\left[-n\\left(\\frac{d}{\\eta}\\right)^\\beta\\right],\\qquad d\u003e0.\n$$", "hash": "7af15ad2d62719ccdc6e801fded576e6c7853e8c513e2686164cef196dc705e4"}, {"id": "common-fdfa2c6bd286", "kind": "text", "html": "\u003cp\u003e固定d和β，n越小，这一概率越大；在起点附近\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e的区间内，β增大也会提高这一概率。例如，γ=500、η=1000时，n=7的样本完全没有观测落在500—1000内的理论概率，β=2时约为17%，β=5时约为80%。因此，n与β共同影响下端观测覆盖，进而影响位置参数可利用的信息。\u003c/p\u003e", "markdown": "固定d和β，n越小，这一概率越大；在起点附近$0\u003cd\u003c\\eta$的区间内，β增大也会提高这一概率。例如，γ=500、η=1000时，n=7的样本完全没有观测落在500—1000内的理论概率，β=2时约为17%，β=5时约为80%。因此，n与β共同影响下端观测覆盖，进而影响位置参数可利用的信息。", "hash": "b17b25935362560d123b287b87df9b4737f67dc1a6d568446a982f75f14be963"}, {"id": "common-037a3d6017ce", "kind": "text", "html": "\u003ch4\u003e有限观测下的参数区分困难\u003c/h4\u003e", "markdown": "#### 有限观测下的参数区分困难", "hash": "193e1cfd4ac21a3c122d6a4376d66cc388f02c19a5b8c5aa22b2d32b192de6c9"}, {"id": "common-cf62f12b60ea", "kind": "text", "html": "\u003cp\u003e下端空白使候选起点受到的直接限制变弱。对需要覆盖全部观测的候选分布，其起点不能高于最小观测；最小观测右移后，部分原先会被观测排除的较高起点便进入了候选范围。位置改变时，形状和尺度又可以共同调整，使候选分布在已有观测覆盖的区间内仍然接近。\u003c/p\u003e", "markdown": "下端空白使候选起点受到的直接限制变弱。对需要覆盖全部观测的候选分布，其起点不能高于最小观测；最小观测右移后，部分原先会被观测排除的较高起点便进入了候选范围。位置改变时，形状和尺度又可以共同调整，使候选分布在已有观测覆盖的区间内仍然接近。", "hash": "0e4b9dfd3d990a33a788d5d0540b3a0fd1c665bc8b4c0df308e79de7f5ba091d"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "不同参数组合在样本覆盖区间内具有接近的CDF", "markdown": "![不同参数组合在样本覆盖区间内具有接近的CDF](../../reviewbyhtml/方法对比-v1.0/assets/R00_图3_参数组合与样本相容.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "common-0c7f53a9553c", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eW(β,η,γ)分别为W(5,1000,500)与W(2,500,1000)。黑点为第一组分布下n=7第31组样本，累计概率由排序近似。图复用Research00报告1的存档示例。\u003c/em\u003e\u003c/p\u003e", "markdown": "*W(β,η,γ)分别为W(5,1000,500)与W(2,500,1000)。黑点为第一组分布下n=7第31组样本，累计概率由排序近似。图复用Research00报告1的存档示例。*", "hash": "1c128862081e0cd7ca7505ba70495c3cb7fc3408f8180b259bfbcf4b83d8f854"}, {"id": "common-83bbd86703ae", "kind": "text", "html": "\u003cp\u003e图中位置由500变为1000、尺度由1000变为500、形状由5变为2，三参数均明显改变，两条CDF在观测集中的区间内却仍较接近。两种分布具有不同的起点和下端形态，而这组样本缺少相应观测。因此，仅凭这些有限观测，难以清楚区分这两种参数解释。\u003c/p\u003e", "markdown": "图中位置由500变为1000、尺度由1000变为500、形状由5变为2，三参数均明显改变，两条CDF在观测集中的区间内却仍较接近。两种分布具有不同的起点和下端形态，而这组样本缺少相应观测。因此，仅凭这些有限观测，难以清楚区分这两种参数解释。", "hash": "8da79c123f7478ab95a8017f389d08160bf505ee212018ba0f9678e1c8232526"}, {"id": "common-36c0ad500aab", "kind": "text", "html": "\u003cp\u003e这建立了后续分析的共同基础：n、β改变观测覆盖，参数补偿使不同组合仍可能与数据相容；各方法再依据自身的判据、定位或参数恢复规则作出选择。3.1追踪样本量减少时的不同响应，3.2追踪形状条件下的参数偏移及其向边界和明显异常的发展。\u003c/p\u003e", "markdown": "这建立了后续分析的共同基础：n、β改变观测覆盖，参数补偿使不同组合仍可能与数据相容；各方法再依据自身的判据、定位或参数恢复规则作出选择。3.1追踪样本量减少时的不同响应，3.2追踪形状条件下的参数偏移及其向边界和明显异常的发展。", "hash": "f8cfaf340e753b2703fc59558d54a3414ee2a3931ac65c594d23c76bed22d8fb"}]}], "content_hash": "5c08ecb6729bd63393c5befa3765f01a019d1fa3c54c46446752f42137ef73cc"}, {"id": "mechanism-high-beta", "title": "3.1　样本量减小时不同方法的误差增长机制", "mode": "content", "state": "modify", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "当前正文", "blocks": [{"id": "n61-576d37db172f", "kind": "text", "html": "\u003ca id=\"mechanism-current\"\u003e\u003c/a\u003e\u003cp\u003e2.1显示，样本量由大变小时，误差总体增大，但不同方法的增幅不同。本节解释这条传递链：n减小改变样本信息，信息变化进入各法的判据或定位依据，使估计出现更大的方向性偏移或样本间波动，进而推高RMSE。各法判据和定位规则不同，对这些变化的放大或抑制也不同。先以β=5分解增长并观察判据，再用β=3的MDM两偏移量对照核对稳定性。\u003c/p\u003e", "markdown": "2.1显示，样本量由大变小时，误差总体增大，但不同方法的增幅不同。本节解释这条传递链：n减小改变样本信息，信息变化进入各法的判据或定位依据，使估计出现更大的方向性偏移或样本间波动，进而推高RMSE。各法判据和定位规则不同，对这些变化的放大或抑制也不同。先以β=5分解增长并观察判据，再用β=3的MDM两偏移量对照核对稳定性。", "hash": "39876295ad58f007615e988e3479ad03988713de6678bbb352c7dcdd91432559"}, {"id": "n55-597332758fe9", "kind": "text", "html": "\u003ch4\u003e误差增长中，偏差和波动各贡献多少\u003c/h4\u003e", "markdown": "#### 误差增长中，偏差和波动各贡献多少", "hash": "6762aa9222010360f9e71c9dbdf5e71151599d269e4c407fe92d1c67871aed9d"}, {"id": "n56-d80e862505a8", "kind": "image", "src": "assets/31S_误差平方组成_β5.png", "alt": "固定β=5时六法的误差平方组成", "markdown": "![固定β=5时六法的误差平方组成](reviewbyhtml/方法对比-v1.0/assets/31S_误差平方组成_β5.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n56-39333cb5253b", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化。统计采用各n七法共同有效集合，与第二章相同。\u003c/em\u003e\u003c/p\u003e", "markdown": "*三列分别对应β、η、γ；每档n按MDM(0.1)、LSE、LRE、WMLE、MLE、MMLE排列。浅色斜线为偏差平方，实色为经验方差，整根柱为标准化RMSE²。形状以真β=5、其余以1000标准化。统计采用各n七法共同有效集合，与第二章相同。*", "hash": "99a9342d211aa50d97d0e040143be24d1fd88952d2282c9c107cd947a4fcb284"}, {"id": "n56-88448208d171", "kind": "text", "html": "\u003cp\u003e这张堆叠图将误差平方拆开：\u003c/p\u003e", "markdown": "这张堆叠图将误差平方拆开：", "hash": "d95a640e67b8a42a1bad32a5ddbc9f90b1c91392ef53c4f328c98c7caf4e3d16"}, {"id": "n55-1ef6b19655c2", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mfrac\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eSD\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\operatorname{RMSE}^2=\\operatorname{Bias}^2+V_R,\\qquad\nV_R=\\frac{R-1}{R}\\operatorname{SD}^2.\n$$", "hash": "30e1666b46b33b3b141ab897d605e6763a964af7b0085f97039f1a352eb00962"}, {"id": "n55-ffdffc2c221b", "kind": "text", "html": "\u003cp\u003e这里R为有效重复次数，SD采用样本标准差。比较n=50与n=7时，增长也能逐项相减：\u003c/p\u003e", "markdown": "这里R为有效重复次数，SD采用样本标准差。比较n=50与n=7时，增长也能逐项相减：", "hash": "d15d8b1af5d87a5be4cb40c9efd27756697504a4b5866d8188b4b5a9532011a2"}, {"id": "n55-093cad5a9e83", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eRMSE\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eBias\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/msub\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\n\\Delta\\operatorname{RMSE}^2=\\Delta\\operatorname{Bias}^2+\\Delta V_R.\n$$", "hash": "f76523fa011f7d995898b17fd26eba1b47cabb9878100d1222604492ce20464b"}, {"id": "n55-e857be63efc0", "kind": "text", "html": "\u003cp\u003eΔ取“n=7减n=50”。正项推动误差平方增长，负项抵消增长；RMSE增大并不要求Bias的绝对值与SD同时增大。\u003c/p\u003e", "markdown": "Δ取“n=7减n=50”。正项推动误差平方增长，负项抵消增长；RMSE增大并不要求Bias的绝对值与SD同时增大。", "hash": "3bbbc9feffa01b18b57655078bce36bd16f70af663e43be7b272ca413e350648"}, {"id": "n55-69ddaf3abee4", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法（β=5，形状估计）\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔRMSE²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔBias²\u003c/th\u003e\u003cth style=\"text-align:right\"\u003eΔ方差\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMDM(0.1)\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1357\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1461\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0103\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2315\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0005\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2320\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0000\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.1958\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2228\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.2399\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e-0.0171\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4687\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0160\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.4527\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0267\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0216\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e+0.0051\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法（β=5，形状估计） | ΔRMSE² | ΔBias² | Δ方差 |\n|---|---:|---:|---:|\n| MDM(0.1) | +0.1357 | +0.1461 | -0.0103 |\n| LSE | +0.2315 | -0.0005 | +0.2320 |\n| LRE | +0.1958 | +0.0000 | +0.1958 |\n| WMLE | +0.2228 | +0.2399 | -0.0171 |\n| MLE | +0.4687 | +0.0160 | +0.4527 |\n| MMLE | +0.0267 | +0.0216 | +0.0051 |", "hash": "e996135ea7de57acc98b07d2276c21e43930384f99a35dd3c67942db6ba0f59d"}, {"id": "n55-e4c48b64f955", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e表中为标准化误差平方，形状除以真β=5后再平方。各n使用七法共同有效集合，n=50、20、15、10、7分别保留1182、1100、1025、880、644组，集合随n变化；数值是相应条件下有效结果的分解。尺度、位置及含MM的完整表见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E8%AF%AF%E5%B7%AE%E5%A2%9E%E9%95%BF%E5%88%86%E8%A7%A3.md\"\u003e补充\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*表中为标准化误差平方，形状除以真β=5后再平方。各n使用七法共同有效集合，n=50、20、15、10、7分别保留1182、1100、1025、880、644组，集合随n变化；数值是相应条件下有效结果的分解。尺度、位置及含MM的完整表见[补充](结果呈现/比较探索/3.1误差增长分解.md)。*", "hash": "1d7b9b00dcda2540560c36e65c12a7f7cc5222ef50bea2297689c3674b58d6ce"}, {"id": "n55-4ba7d4578386", "kind": "text", "html": "\u003cp\u003e在这套比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差；MDM(0.1)和WMLE主要来自偏差平方增加，方差项反而下降。MMLE的形状误差增量较小，也主要由偏差平方组成。以MDM(0.1)为例，Bias由−1.46变为−2.41，SD由0.75降为0.55，RMSE仍由1.64增至2.47；LSE的Bias约由+0.24变为+0.21，SD由2.03增至3.15，RMSE由2.04增至3.16。\u003c/p\u003e", "markdown": "在这套比较口径下，MLE、LSE和LRE的形状误差增长主要来自方差；MDM(0.1)和WMLE主要来自偏差平方增加，方差项反而下降。MMLE的形状误差增量较小，也主要由偏差平方组成。以MDM(0.1)为例，Bias由−1.46变为−2.41，SD由0.75降为0.55，RMSE仍由1.64增至2.47；LSE的Bias约由+0.24变为+0.21，SD由2.03增至3.15，RMSE由2.04增至3.16。", "hash": "bf6cf1a0a8663489a3f7ba07c0d99a918e49a2a75f15357983c70d2a3aa85f6b"}, {"id": "n55-9368fc85b7f1", "kind": "text", "html": "\u003cp\u003e这些分解先说明“增长在哪里”，接着才解释“为什么不同”。共同有效集合收缩也会影响条件SD，不能把上表直接当作全部1200次抽样的波动；后面的两δ对照使用每档完整1200组共同样本，单独核对规则改变后的分布。\u003c/p\u003e", "markdown": "这些分解先说明“增长在哪里”，接着才解释“为什么不同”。共同有效集合收缩也会影响条件SD，不能把上表直接当作全部1200次抽样的波动；后面的两δ对照使用每档完整1200组共同样本，单独核对规则改变后的分布。", "hash": "739290a3be97209deebc108292a338b24e7d33cde8f490ba950668e31606b76d"}, {"id": "n52-795b16c7a92b", "kind": "text", "html": "\u003ch4\u003e固定形状下的下端覆盖核对\u003c/h4\u003e", "markdown": "#### 固定形状下的下端覆盖核对", "hash": "5cf2c3b1a8f0814d8e54d3ac6d5e659c27ad9b1b30694222636d86f1aafb5256"}, {"id": "n-population-coverage", "kind": "image", "src": "assets/31H_n减小与下端覆盖.png", "alt": "固定形状时三档样本的观测、最小值、起点空白及最小值理论密度", "markdown": "![固定形状时三档样本的观测、最小值、起点空白及最小值理论密度](reviewbyhtml/方法对比-v1.0/assets/31H_n减小与下端覆盖.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n52-bd70076f73ef", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近。*", "hash": "8b2d25cb7c7f7c38476db9b2b5897e9128d11975af5431cd5cd65bd0e413b455"}, {"id": "n52-bdb18003e8e0", "kind": "text", "html": "\u003cp\u003e低寿命下端在总体中占比很小，抽取次数减少，更容易一个也没抽到。因此，n减小时，最小观测通常离真实起点更远，起点与最小观测之间的空白更大。以500—1000这段区间为例，整组没有观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。\u003c/p\u003e", "markdown": "低寿命下端在总体中占比很小，抽取次数减少，更容易一个也没抽到。因此，n减小时，最小观测通常离真实起点更远，起点与最小观测之间的空白更大。以500—1000这段区间为例，整组没有观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。", "hash": "63ba18c6bd02356c7b312fdc3b2e593f59ad6df113da2b269ecc6090f0b3338e"}, {"id": "n52-e27e83b1a1e2", "kind": "text", "html": "\u003cp\u003e这一正式样本核对与章首的最小观测关系一致：n减小时，下端空白更常见，候选起点及可相容参数组合受到的观测限制随之改变。下面沿四种定位规则，追踪同一批样本的信息变化怎样进入选参过程。\u003c/p\u003e", "markdown": "这一正式样本核对与章首的最小观测关系一致：n减小时，下端空白更常见，候选起点及可相容参数组合受到的观测限制随之改变。下面沿四种定位规则，追踪同一批样本的信息变化怎样进入选参过程。", "hash": "86c595654f5c6365f892b0bbd7cc9b5027d1e1f2e24c90994fec3aad29cc6ffb"}, {"id": "n55-98f690afafda", "kind": "text", "html": "\u003ch4\u003e用共同样本看四种规则怎样确定位置\u003c/h4\u003e", "markdown": "#### 用共同样本看四种规则怎样确定位置", "hash": "3d7bf065c2b42631ccce4af2e9ff97373224abf479b53992692ff008ac4a1589"}, {"id": "n55-a75b92ec2382", "kind": "text", "html": "\u003cp\u003e减点诊断固定使用MLE、MMLE、MDM(0)和MDM(0.1)。从1200份正式50点样本预先每10个编号取一份，共120条路径；按固定随机排列依次保留50、20、15、10、7点，四法在每档使用完全相同的观测。\u003c/p\u003e", "markdown": "减点诊断固定使用MLE、MMLE、MDM(0)和MDM(0.1)。从1200份正式50点样本预先每10个编号取一份，共120条路径；按固定随机排列依次保留50、20、15、10、7点，四法在每档使用完全相同的观测。", "hash": "41f499511b433ca081a085f93df17d3313b31b0f6f175e457a4c1aaa84757a54"}, {"id": "ten-gamma-paths-anchor", "kind": "text", "html": "\u003ca id=\"ten-gamma-paths\"\u003e\u003c/a\u003e", "hash": "083593d9f983ae4ba49bcf92af6f43ae05e93f971585b5dbc4a05eb3908e5d1a"}, {"id": "n57-e07ad89511cf", "kind": "image", "src": "assets/31T_十组叠加定位判据.svg", "alt": "每个n与方法坐标系内叠加十组样本的定位判据", "markdown": "![每个n与方法坐标系内叠加十组样本的定位判据](reviewbyhtml/方法对比-v1.0/assets/31T_十组叠加定位判据.svg)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n59-5b4d44ed143b", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e五行对应n=50、20、15、10、7，四列对应四种方法，每个剖面格子叠加十组样本。样本号、颜色和线型贯穿全图，横轴均为原始γ；MLE为相对每观测负对数似然，MDM为梯度\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。MMLE只标样本最小值；MLE失败的曲线不标返回点。十组为典型路径，选例及120条完整核对见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E5%81%8F%E7%A7%BB%E9%87%8F%E4%B8%8E%E5%BB%93%E7%BA%BF%E7%BE%A4%E4%BD%93-%E7%BB%93%E6%9E%9C.md\"\u003e补充\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*五行对应n=50、20、15、10、7，四列对应四种方法，每个剖面格子叠加十组样本。样本号、颜色和线型贯穿全图，横轴均为原始γ；MLE为相对每观测负对数似然，MDM为梯度$g_n(\\gamma)$。MMLE只标样本最小值；MLE失败的曲线不标返回点。十组为典型路径，选例及120条完整核对见[补充](结果呈现/比较探索/3.1偏移量与廓线群体-结果.md)。*", "hash": "68c5724c55f0d7ce9477f0b90c454e63735f7a33784b98ef01e7c641d2b26620"}, {"id": "n59-c1752d982aaa", "kind": "text", "html": "\u003cp\u003e沿行向下看，减点使同一样本的判据形状和定位结果改变：MLE低值区及最优位置发生移动，部分选点转向零边界；MMLE位置随最小观测右移；MDM的零梯度选点在平缓区或边界变化较大，而δ=0.1的交点落在梯度上升段。不同样本的响应方向并不一致，也没有各法都随n减小而变平的统一趋势，差别体现为各自规则对同一信息变化的不同响应。\u003c/p\u003e", "markdown": "沿行向下看，减点使同一样本的判据形状和定位结果改变：MLE低值区及最优位置发生移动，部分选点转向零边界；MMLE位置随最小观测右移；MDM的零梯度选点在平缓区或边界变化较大，而δ=0.1的交点落在梯度上升段。不同样本的响应方向并不一致，也没有各法都随n减小而变平的统一趋势，差别体现为各自规则对同一信息变化的不同响应。", "hash": "ffde0478c799d9ade9aa29a28e659d83e1759f6a6c1ec13d2b6bcd517ef61bde"}, {"id": "n59-cd8e0d8177c8", "kind": "text", "html": "\u003cp\u003e判据的变化通过“选点”进入误差：不同样本的最优点向同一侧移动，会加重方向性偏差；最优点在更大范围内散开，或在内部与边界之间转换，会增大重复估计的不稳定性。当判据在一段位置范围内差别很小时，样本的偶然变化就可能重新排列候选优劣，使选点产生较大移动。随后位置变化又通过参数耦合传入形状和尺度。第一幅堆叠图中的偏差项与方差项，正是这些响应在重复估计中的表现。\u003c/p\u003e", "markdown": "判据的变化通过“选点”进入误差：不同样本的最优点向同一侧移动，会加重方向性偏差；最优点在更大范围内散开，或在内部与边界之间转换，会增大重复估计的不稳定性。当判据在一段位置范围内差别很小时，样本的偶然变化就可能重新排列候选优劣，使选点产生较大移动。随后位置变化又通过参数耦合传入形状和尺度。第一幅堆叠图中的偏差项与方差项，正是这些响应在重复估计中的表现。", "hash": "155cb505a7fd0f4f965e7e7d70060466b65b55e0ad3928e084373b01f778475f"}, {"id": "n55-39618b93ac31", "kind": "text", "html": "\u003ch4\u003e不同构造怎样处理这些信息与参数耦合\u003c/h4\u003e", "markdown": "#### 不同构造怎样处理这些信息与参数耦合", "hash": "0441d503650fe8fccb569ca27918265147195bd465204675ea4a3d1e4aeb6110"}, {"id": "n55-0219aa33c985", "kind": "text", "html": "\u003cp\u003e相同观测进入不同方法，会成为不同的估计依据；位置变化又会改变全部观测到起点的距离，进而牵动形状和尺度。这就是从样本信息转向方法视角的连接：各法利用的信息、处理三参数耦合的步骤和选参规则不同。\u003c/p\u003e", "markdown": "相同观测进入不同方法，会成为不同的估计依据；位置变化又会改变全部观测到起点的距离，进而牵动形状和尺度。这就是从样本信息转向方法视角的连接：各法利用的信息、处理三参数耦合的步骤和选参规则不同。", "hash": "6a6c3ffc753035144a7cff55681f33002a64edd42cd78cdd986dd97ff804dcd2"}, {"id": "n52-22c438a8b71a", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e怎样利用样本信息\u003c/th\u003e\u003cth\u003e与样本量变化有关的响应环节\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e用各观测到候选起点的距离构造似然，联合确定三参数。\u003c/td\u003e\u003ctd\u003e对数距离和幂次距离共同影响候选组合的似然高低。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd\u003e将距离、对数距离、幂加权距离和倒数距离放入带有样本量校准权重的估计方程。\u003c/td\u003e\u003ctd\u003e样本统计关系与n相关权重共同改变形状、位置方程的交点。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e以最小观测确定位置，再对删除该点后的正距离估计形状、尺度。\u003c/td\u003e\u003ctd\u003e位置直接受单个极值影响，其误差随后进入其余观测到起点的距离。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE\u003c/td\u003e\u003ctd\u003e将排序观测的对数距离与按n确定的理论参考坐标回归，再以相对匹配定位。\u003c/td\u003e\u003ctd\u003e点列、参考坐标及回归斜率共同影响三参数恢复。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLRE\u003c/td\u003e\u003ctd\u003e用绘图位置形成概率图参考坐标，以相关性定位，再由另一方向的回归恢复参数。\u003c/td\u003e\u003ctd\u003e绘图位置、对数间距和回归方向决定其对点列变化的响应。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e每个位置下使各点反算的伪尺度尽量一致，再以最小标准差的梯度阈值定位。\u003c/td\u003e\u003ctd\u003e伪尺度离散程度、条件形状和梯度交点共同响应样本变化。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMM\u003c/td\u003e\u003ctd\u003e用排序间距的加权和计算Cran的样本Weibull矩，再由矩差关系反演参数。\u003c/td\u003e\u003ctd\u003e间距和n相关权重改变矩组合，非线性反演可能放大矩差的变化。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 方法 | 怎样利用样本信息 | 与样本量变化有关的响应环节 |\n|---|---|---|\n| MLE | 用各观测到候选起点的距离构造似然，联合确定三参数。 | 对数距离和幂次距离共同影响候选组合的似然高低。 |\n| WMLE | 将距离、对数距离、幂加权距离和倒数距离放入带有样本量校准权重的估计方程。 | 样本统计关系与n相关权重共同改变形状、位置方程的交点。 |\n| MMLE | 以最小观测确定位置，再对删除该点后的正距离估计形状、尺度。 | 位置直接受单个极值影响，其误差随后进入其余观测到起点的距离。 |\n| LSE | 将排序观测的对数距离与按n确定的理论参考坐标回归，再以相对匹配定位。 | 点列、参考坐标及回归斜率共同影响三参数恢复。 |\n| LRE | 用绘图位置形成概率图参考坐标，以相关性定位，再由另一方向的回归恢复参数。 | 绘图位置、对数间距和回归方向决定其对点列变化的响应。 |\n| MDM | 每个位置下使各点反算的伪尺度尽量一致，再以最小标准差的梯度阈值定位。 | 伪尺度离散程度、条件形状和梯度交点共同响应样本变化。 |\n| MM | 用排序间距的加权和计算Cran的样本Weibull矩，再由矩差关系反演参数。 | 间距和n相关权重改变矩组合，非线性反演可能放大矩差的变化。 |", "hash": "849e44bf89497e68c02762919d04933e4b32e2f89a5c171b34848859548f1168"}, {"id": "n59-239f59a936ad", "kind": "text", "html": "\u003cp\u003eMMLE的位置规则为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e：最小观测改变多少，位置就改变多少，位置定位不需要反解平坦准则，也不在多个候选最优点之间搜索。这使它避免了该环节的额外放大，但最小观测偏大仍会直接成为位置偏差。β=5的完整1200组结果中，n从50减到7，位置SD由95.9增至142.8，Bias则由+418.1增至+618.6；因此，它的位置RMSE增长更多体现为偏移加重。形状与尺度随后还受条件估计的影响。\u003c/p\u003e", "markdown": "MMLE的位置规则为$\\hat\\gamma=x_{(1)}$：最小观测改变多少，位置就改变多少，位置定位不需要反解平坦准则，也不在多个候选最优点之间搜索。这使它避免了该环节的额外放大，但最小观测偏大仍会直接成为位置偏差。β=5的完整1200组结果中，n从50减到7，位置SD由95.9增至142.8，Bias则由+418.1增至+618.6；因此，它的位置RMSE增长更多体现为偏移加重。形状与尺度随后还受条件估计的影响。", "hash": "9dce6c4f22b51f6e5e7ea08b86ecc095fc24c0309ab49f6aab9c030cb1a6a692"}, {"id": "n59-5959008ebf1a", "kind": "text", "html": "\u003ch4\u003eMDM用小偏移降低定位敏感性\u003c/h4\u003e", "markdown": "#### MDM用小偏移降低定位敏感性", "hash": "100fbbeeb55e8f1aa15c23d409a247e9cc8afacc20dc01ac9b3a7994124316aa"}, {"id": "n59-379314c93ad8", "kind": "text", "html": "\u003cp\u003eMDM以伪尺度离散程度的廓线梯度定位。零梯度附近较平缓时，样本的小变化也可能让定位点移动较远；引入δ=0.1，把定位目标移向梯度曲线较陡的上升段，部分避开平坦区，从而降低这种位置敏感性。上图两列MDM使用相同曲线，区别正是目标与选中位置。对内部交点，位置响应近似为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmsubsup\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e：同样的判据扰动，在斜率较小时会产生较大的位置移动。小偏移的作用在于减弱这一放大，而不是让样本量下降失去影响。选点改变也会带来偏差，性能需要同时看偏差和波动。\u003c/p\u003e", "markdown": "MDM以伪尺度离散程度的廓线梯度定位。零梯度附近较平缓时，样本的小变化也可能让定位点移动较远；引入δ=0.1，把定位目标移向梯度曲线较陡的上升段，部分避开平坦区，从而降低这种位置敏感性。上图两列MDM使用相同曲线，区别正是目标与选中位置。对内部交点，位置响应近似为$\\Delta\\hat\\gamma\\approx-\\Delta g_n(\\hat\\gamma)/g_n'(\\hat\\gamma)$：同样的判据扰动，在斜率较小时会产生较大的位置移动。小偏移的作用在于减弱这一放大，而不是让样本量下降失去影响。选点改变也会带来偏差，性能需要同时看偏差和波动。", "hash": "73d84a5b7959ffbca26734f0f9ed5a78d39b45b293e7c4e9702e3a73185c6f65"}, {"id": "n61-47c228c4e07c", "kind": "image", "src": "assets/31N_MDM两偏移量估计分布_beta3.png", "alt": "β=3时MDM两种偏移量的共同样本估计分布", "markdown": "![β=3时MDM两种偏移量的共同样本估计分布](reviewbyhtml/方法对比-v1.0/assets/31N_MDM两偏移量估计分布_beta3.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n61-15c858ba8789", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(3,1000,500)，上排n=50，下排n=7；每档两方案使用完全相同的1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。各列共用坐标与分箱，虚线为真值。判据图用β=5展示选参过程，本图用β=3核对重复分布，两个条件不混算。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(3,1000,500)，上排n=50，下排n=7；每档两方案使用完全相同的1200组原样本，均有效。δ=0补算，δ=0.1复用原估计，其他实现相同。各列共用坐标与分箱，虚线为真值。判据图用β=5展示选参过程，本图用β=3核对重复分布，两个条件不混算。*", "hash": "065f05b832f16735a8329c56317efbb4375daac75c6e2782f3ba999c11a2bf0e"}, {"id": "n61-67f4e4b3651a", "kind": "text", "html": "\u003cp\u003e在β=3、n=7的配对结果中，位置SD由δ=0时450.5变为δ=0.1时292.7，位置RMSE由461.5变为369.7。这让判据上避开平缓定位区的解释，与重复估计的分布变化对应起来；结论限于当前条件和固定实现。三参数Bias、SD、RMSE及样本来源见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1-MDM%E5%81%8F%E7%A7%BB%E9%87%8F-beta3%E7%BB%93%E6%9E%9C.md\"\u003eβ=3核对\u003c/a\u003e。\u003c/p\u003e", "markdown": "在β=3、n=7的配对结果中，位置SD由δ=0时450.5变为δ=0.1时292.7，位置RMSE由461.5变为369.7。这让判据上避开平缓定位区的解释，与重复估计的分布变化对应起来；结论限于当前条件和固定实现。三参数Bias、SD、RMSE及样本来源见[β=3核对](结果呈现/比较探索/3.1-MDM偏移量-beta3结果.md)。", "hash": "92e5169441bd1a0fb468cd02e917449900c787cafbb2670618b243291919a573"}, {"id": "n59-78ab13667f42", "kind": "text", "html": "\u003cp\u003e本节得到的结论是：n减少后，变化的样本信息通过各法判据和定位规则，转化为不同程度的方向性偏移、选点分散或边界响应，最终形成不同的RMSE增幅。MLE、LSE、LRE在当前β=5比较中的形状误差增长主要来自方差，MDM(0.1)、WMLE主要来自偏差平方；MMLE的位置直接映射和MDM的正偏移定位体现了对特定放大环节的抑制。这些稳定作用允许波动较小，也仍可能伴随偏差增长。\u003c/p\u003e", "markdown": "本节得到的结论是：n减少后，变化的样本信息通过各法判据和定位规则，转化为不同程度的方向性偏移、选点分散或边界响应，最终形成不同的RMSE增幅。MLE、LSE、LRE在当前β=5比较中的形状误差增长主要来自方差，MDM(0.1)、WMLE主要来自偏差平方；MMLE的位置直接映射和MDM的正偏移定位体现了对特定放大环节的抑制。这些稳定作用允许波动较小，也仍可能伴随偏差增长。", "hash": "e3439129663deecb547eb4505e6fa59014995afdbb153439172c7d3d42faef9a"}, {"id": "n61-9246d58db50d", "kind": "text", "html": "\u003cp\u003e上述证据解释了典型传递过程，尚未将七法全部RMSE差距逐项分解为独立机制贡献。完整选例、内部与边界统计见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E5%81%8F%E7%A7%BB%E9%87%8F%E4%B8%8E%E5%BB%93%E7%BA%BF%E7%BE%A4%E4%BD%93-%E7%BB%93%E6%9E%9C.md\"\u003e群体核对\u003c/a\u003e，β=3重复验证见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1-MDM%E5%81%8F%E7%A7%BB%E9%87%8F-beta3%E7%BB%93%E6%9E%9C.md\"\u003e配对核对\u003c/a\u003e。\u003c/p\u003e", "markdown": "上述证据解释了典型传递过程，尚未将七法全部RMSE差距逐项分解为独立机制贡献。完整选例、内部与边界统计见[群体核对](结果呈现/比较探索/3.1偏移量与廓线群体-结果.md)，β=3重复验证见[配对核对](结果呈现/比较探索/3.1-MDM偏移量-beta3结果.md)。", "hash": "226243b2f7b1f494e1fff39153f2706dd2f81e0fcf8596c8b9a3c3c56888632b"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "67ce8e4501fe32b1d41075cc973906f4fa4834c19fba2e31704f9ed2677eb9a7"}, {"id": "mechanism-n-background", "title": "3.2　形状条件下的参数区分与估计偏移", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "shape-information-opening", "kind": "text", "html": "\u003cp\u003e在上述共同基础上，本节沿判据区分、定位选择和参数恢复，追踪不同形状条件下的参数偏移，并结合代表样本解释边界聚集与明显异常。\u003c/p\u003e", "hash": "cacc3b317efe742738c5d650269223a853ef76152914718183bed2d087fd3c5e"}, {"id": "shape-criterion-opening", "kind": "text", "html": "\u003ch4\u003e判据区分能力与优选位置\u003c/h4\u003e", "hash": "7234c2ec043641a64e9f6d397932e6e7fe5ea24cbec6ce809a085d46c974b739"}, {"id": "shape-lse-profile-family", "kind": "image", "src": "assets/R00_LSE_判据与参数条件.png", "alt": "报告1图6：β=2与5、n=7/15/30的LSE位置判据曲线，展示宽缓区与最低点分布", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-lse-profile-reading", "kind": "text", "html": "\u003cp\u003eLSE的图中，β=5时真位置附近多条曲线随候选位置变化较缓，最低点却分散在不同位置。观测较集中时，移动位置主要使对数点列近似整体平移或伸缩，线性匹配的评价改变较小；局部间距的波动便更容易改变优选位置。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图6：η=1000、γ=500；两列为β=2、5，三行为n=7、15、30。每条曲线对应一组样本，橙叉标记原返回位置，竖虚线标记真位置。\u003c/em\u003e\u003c/p\u003e", "hash": "c4a7783ab2612cc08d7e545678037d8090234ac13953834577a0b86e5cd0a38d"}, {"id": "shape-mle-flat-profile", "kind": "image", "src": "assets/R00_异常剖面_MLE_high.png", "alt": "报告2图15：正常与明显高估样本的MLE位置似然剖面、条件形状和样本距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "profile-flat-numbers", "kind": "text", "html": "\u003cp\u003e报告2的单样本把这种宽缓区显示得更直接：第36组的候选位置从0移至约251时，条件形状从23.54降至13.64，对数似然却只下降约0.012。\u003cmark\u003e参数组合已经明显改变，判据评价仍几乎相同；数据对这些组合的区分较弱。\u003c/mark\u003e图中的左端优选位置因此可以与很大的形状、尺度共同出现。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图15：W(2,100,500)、n=15，第35组为正常参照、第36组为高估样本。中列是在各候选位置重新优化得到的条件形状；数值由原图数据核对。\u003c/em\u003e\u003c/p\u003e", "hash": "de9ca258146f1e7af2be05bbe97afdfb023593c7686e393280519fae9f9e4d9a"}, {"id": "shape-selection-opening", "kind": "text", "html": "\u003ch4\u003e定位规则与参数传递\u003c/h4\u003e", "hash": "f74e0ebdf8e78ac1c6433da7228ed184af44260fbc6cdcc3adb9d6c6be26922c"}, {"id": "shape-a-opening", "kind": "text", "html": "\u003cp\u003eMDM按固定梯度阈值定位。高β时，各观测反算的伪尺度随位置变化更接近同步，标准差梯度较小，阈值交点向较高位置移动。位置提高后，小观测到起点的距离缩短比例更大，条件最优形状随之降低，再由伪尺度均值恢复出较小尺度。\u003c/p\u003e", "hash": "233f04f19088a201f5d2709f35427bada394582bb1ba89f329f5cc34feecc4d8"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00报告1：梯度阈值选中较高位置后，形状和尺度随之降低", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-mdm-reading", "kind": "text", "html": "\u003cp\u003e图中从梯度交点沿同一位置读取形状与尺度，位置偏高、形状和尺度偏低便连接为同一条计算路径。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图5：δ=0.1，β=2、5，n=7第48组配对样本。两列比较形状条件，三行依次为梯度、条件形状和伪尺度均值。\u003c/em\u003e\u003c/p\u003e", "hash": "ed088d8be93418dbc98599ece08a7df6d4494b7ec2b12a1a20231f1ad037e148"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "Research00报告2：LSE左移位置改善线性匹配，最佳位置可落在零边界或内部", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-boundary-reading", "kind": "text", "html": "\u003cp\u003eLSE的左侧优选位置则展示另一方向：左移位置压缩对数跨度，当这能改善线性匹配时，最低点会移向较低位置。橙色样本的最低点落在γ=0，紫色样本仍在内部；非负位置约束把一部分左侧偏移截在零点，形成边界聚集。对数跨度压缩又使回归斜率减小，取倒数后形状升高。报告2中的右侧样本沿相反方向传递：位置靠近最小观测，对数跨度拉大，形状和尺度降低。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图6：正常与零边界样本为W(2,100,500)、n=15第35、36组；内部左偏样本为W(2,1000,3000)、n=7第1组。右侧传递过程见报告2图7。\u003c/em\u003e\u003c/p\u003e", "hash": "7b79d04c1badb2927e58577da8daea083822b209ed40bf043aefb780cc96062b"}, {"id": "profile-method-comparison", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e选择或定位依据\u003c/th\u003e\u003cth\u003e参数怎样联动\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e最小观测直接定位，再拟合保留距离\u003c/td\u003e\u003ctd\u003e位置变化改变距离；保留距离集中或分散，使形状似然峰及恢复尺度改变。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e梯度阈值交点定位\u003c/td\u003e\u003ctd\u003e所选位置改变伪尺度标准差最低点及其均值，带动形状和尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE、LRE\u003c/td\u003e\u003ctd\u003e选择线性匹配或相关性最好的位置\u003c/td\u003e\u003ctd\u003e对数跨度进入回归斜率；LSE取斜率倒数，LRE直接取斜率，再恢复尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd\u003e两条加权方程的共同交点\u003c/td\u003e\u003ctd\u003e样本距离同时改变两条关系，交点给出位置与形状，尺度由加权关系恢复。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e比较不同参数组合的似然\u003c/td\u003e\u003ctd\u003e宽缓高似然区允许位置、形状和尺度相互补偿，优选组合可明显偏离真值。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "bf652402da62456a229e1654b2d7319a7eaf42636dc75a44e466f5fafffd6d08"}, {"id": "profile-summary-ending", "kind": "text", "html": "\u003cp\u003e\u003cmark\u003e观测约束、判据区分与参数恢复共同决定偏移：宽缓区使不同参数组合难以区分，极值或交点给出选择方向，参数恢复再把变化传到其余参数。\u003c/mark\u003e下端空缺、局部成簇或远端观测会进一步改变这些判据；同样的形成路径在部分样本上产生更大的偏移，表现为第二章的明显异常。\u003c/p\u003e\u003cp\u003e\u003cem\u003e本节复用Research00报告1、报告2的存档机制图，保留各图原条件和实现；不与Study04的1200次正式统计混合。六种方法的完整过程见报告1第2.1—2.6节与报告2第2.1节。\u003c/em\u003e\u003c/p\u003e", "hash": "a1588fee098a03484e3ae30ca95ba45a70f9ca2d6be876b9bd923b1527434af0"}]}], "content_hash": "fb430513f3cfc467d73552c349a67368e3e9d804600b8ffe8826bb0bda37636d"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "60e3a18b546fd1677a2d2f935ab3875baef2da72bea8ce5f454e020b14b56217"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "1a161b266aac2eba5fcdeeb8bcd4972db1965ec18f91f900609e103c048f4784"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。下面从样本特征出发，分别检验地图推荐的可识别性与逐样本选法的误差表现。\u003c/p\u003e", "hash": "c12ce80da579ff6a8ecb546a4a3b0c6c7d1f031454abc4458868062cfa746f64"}]}], "content_hash": "4b3828631535a17e5c0ec592ee80b854b0c62f49db029f1f86307d8a670a64e2"}, {"id": "evaluation-feature-map", "title": "4.3　从样本特征恢复性能地图的推荐", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-feature-map-current", "label": "当前内容", "blocks": [{"id": "map-question", "kind": "text", "html": "\u003cp\u003e性能地图给出已知β与n时的条件推荐。实际只有一组样本时，可以检验：\u003cstrong\u003e由样本自身的可观测特征，能否识别地图推荐的方法？\u003c/strong\u003e\u003c/p\u003e", "hash": "322326a6c01e65d006717e3e94fa6a20b8f318a184ca2cd2c361e9c106e8cc0a"}, {"id": "map-design", "kind": "text", "html": "\u003cp\u003e复用48,000组样本与既有B10地图，以每格最低RMSE方法作为分类标签。输入为样本量、位置尺度、归一化分位数、形状统计与间距等30维特征，不输入真参数或七法估计值。按样本指纹划分训练、验证和测试，分别为28,807、9,551和9,642组；分类网络采用64×64两层结构，验证集用于早停。\u003c/p\u003e", "hash": "2cec55df4113bb0dcb279b15ede47ffa8a957efc256baecc4b579560a142b6d8"}, {"id": "map-matching-table", "kind": "text", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e策略\u003c/th\u003e\u003cth\u003e测试样本逐组一致率\u003c/th\u003e\u003cth\u003e40条件等权一致率\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e训练多数类\u003c/td\u003e\u003ctd\u003e44.70%\u003c/td\u003e\u003ctd\u003e45.00%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只按n查训练多数类\u003c/td\u003e\u003ctd\u003e46.53%\u003c/td\u003e\u003ctd\u003e47.50%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本特征分类网络\u003c/td\u003e\u003ctd\u003e73.15%（7,053/9,642）\u003c/td\u003e\u003ctd\u003e73.30%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "ef16cda2456281f2423778ea30e311e570479f5af0f9588038b8f1314a0fc669"}, {"id": "map-classification-image", "kind": "image", "src": "assets/43_B10地图分类对照.png", "alt": "原B10地图与样本特征分类器测试多数票对照", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：每格将该条件中测试样本的预测类别作多数投票，恢复35/40格（87.5%）；虚线框为不一致格。β仅用于汇总显示，不是网络输入。MDM指δ=0.1，LRE为Park实现。逐格数据来自分类报告中的冻结结果表。\u003c/em\u003e\u003c/p\u003e", "hash": "90891c90c22f3abe82a4cfb5fb6b95759df445ccb1a516e83b91244c14fb7521"}, {"id": "map-results", "kind": "text", "html": "\u003cp\u003e样本特征比只看n提供了额外的地图匹配信息，但五个不一致格中，四个LSE格均被判为WMLE，另有一个MLE格被判为WMLE。LSE的逐组召回率仅5.18%，训练集上也只有6.59%。其中三个LSE冠军相对WMLE的RMSE优势不足0.2%；类别稀少、窄区域的样本信息重叠及最大概率判决的取舍共同参与识别困难。\u003c/p\u003e", "hash": "0c9098b6b7baab38f50c6ae44757b8f84fe2a5b3280b9b47e47d560b0322ab56"}, {"id": "map-interpretation", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e地图标签匹配率与当前样本的真实最优命中率是两个评价对象。\u003c/strong\u003e原地图按整格平均误差定义冠军，并使用全1200组结果；本轮评价的是对这张既定地图的模仿。测试样本来自相同40个条件的留出部分，范围为η=1000、γ=500及既有β×n网格。\u003c/p\u003e", "hash": "477514e26d893c73dc6149ea88c01c6180185dd8566b8d9ea927a803154940c1"}, {"id": "map-ablation", "kind": "text", "html": "\u003cp\u003e匹配三个初始化重新训练后，完整特征的条件等权一致率均值为73.30%；删除位置尺度组降至72.25%，删除n降至73.02%。其他组未显示额外总体收益，但特征之间存在重叠信息，删除后不降不能解释为形状或间距无用。所有消融设置的LSE召回率仍不足7%。\u003c/p\u003e", "hash": "effc9a2265f5ce16c6f4aaa8041e35fa2582f713de02b35932e214dd7c2df90d"}, {"id": "map-source-links", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e详细方案、结果与核对：\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E5%9C%B0%E5%9B%BE%E5%88%86%E7%B1%BB%E5%8C%B9%E9%85%8D-v1.0.md\"\u003e地图分类匹配\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-LSE%E9%94%99%E5%88%86%E8%AF%8A%E6%96%AD-v1.0.md\"\u003eLSE错分诊断\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E5%88%86%E7%B1%BB%E5%99%A8%E7%89%B9%E5%BE%81%E6%B6%88%E8%9E%8D-v1.0.md\"\u003e分类器特征消融\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "hash": "b5280174e390e3dd0cf0cf48bbe1391946ac87c180db1f45d9ecab7884819668"}]}], "content_hash": "a8d81521e8b6bad45904017684e4884ca6a65f9d76a5aac9654a818cc0c86b4d"}, {"id": "evaluation-feature-risk", "title": "4.4　以B10误差评价逐样本选法", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-feature-risk-current", "label": "当前内容", "blocks": [{"id": "risk-question", "kind": "text", "html": "\u003cp\u003e地图分类之外，还可以直接学习各方法的预计B10平方误差风险，再按预测风险从小到大选择方法。该路线采用相同样本特征，七法结果与真值只用于监督；先运行首选方法，失败后依排序回退。\u003c/p\u003e", "hash": "f49a3fd778e043a33a250e6076b7648a21d5d501a41aa53408934852d2dc9b91"}, {"id": "risk-main-table", "kind": "text", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e9,642组留出测试，40条件等权\u003c/th\u003e\u003cth\u003eB10 RMSE\u003c/th\u003e\u003cth\u003e相对固定方法改善\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e训练集选定固定MDM-0.1（含固定回退）\u003c/td\u003e\u003ctd\u003e106.85\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只按样本量选法\u003c/td\u003e\u003ctd\u003e106.73\u003c/td\u003e\u003ctd\u003e0.11%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e特征风险网络选法，含失败回退\u003c/td\u003e\u003ctd\u003e95.08\u003c/td\u003e\u003ctd\u003e11.01%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "dcc0832d2182b21a52243456317442af6deb6dade2a33c7a0de9969de3191a7c"}, {"id": "risk-gain", "kind": "text", "html": "\u003cp\u003e配对95%区间为[10.27%, 11.72%]。首次选中方法失败率3.35%，本批依序回退后最终失败率0%；有效极端值保留，失败不填零误差。在同一批7,317组七法共同有效测试样本上，网络RMSE为93.14，仅用训练部分重建的β×n地图推荐为103.22，前者低9.76%。\u003c/p\u003e", "hash": "85ad5459a96d9acea7ea79e3ea7a9eb676d18779b369c5f56c71e09433db6e20"}, {"id": "risk-distinction", "kind": "text", "html": "\u003cp\u003e这一模型直接优化误差风险，逐样本事后最优命中率为40.29%；将预测风险按条件取平均后，仅4/40格复现原地图冠军。\u003cstrong\u003e逐样本选法降低误差，并不要求它与地图分类器给出相同的条件推荐。\u003c/strong\u003e两条路线应分别按实际选法误差和地图标签匹配率评价。\u003c/p\u003e", "hash": "dc0efa04dc1b8427a69c25a8c133fc8cfb6a6035909fd9d8f8be6effa43a9078"}, {"id": "risk-feature-association", "kind": "text", "html": "\u003cp\u003e固定β×n后，样本特征仍能区分不同方法的误差表现。例如样本最小值从低四分位到高四分位时，MLE的实际B10 RMSE由80.52增至191.61，MDM由117.10增至163.76。这为样本特征包含选法信息提供了观察证据；风险预测消融衡量额外信息贡献，不能将其换算成造成估计误差的因果占比。\u003c/p\u003e", "hash": "50f5e680853b6366be4011fabcf3defe90d2f440a44af1cbb4f402c110d13159"}, {"id": "risk-tradeoffs", "kind": "text", "html": "\u003cp\u003e收益也伴随取舍：总体带符号Bias由10.91增至30.34，P95绝对误差由217.60降至196.81。少量独立新样本中的未训练β=2.25、n=10及未训练n=30、β=3分别改善6.97%和10.01%；但η=500、γ=250及γ=0、η=1000时，RMSE分别增加26.03%和35.35%。各新条件仅200组。\u003c/p\u003e", "hash": "bbbafef2bd65efbe5cc514506b83882fa25283d6a0fbc0543594876c0873c4e9"}, {"id": "risk-conclusion", "kind": "text", "html": "\u003cp\u003e当前结果说明：\u003cstrong\u003e在已考察范围内，样本特征可以辅助方法选择；选择目标、偏差方向、极端误差与适用范围仍需共同判断。\u003c/strong\u003e这是一项固定训练范围的研究原型，跨尺度、位置的推广仍待研究。配对区间固定已训练模型，不包含重新训练的全部不确定性。\u003c/p\u003e", "hash": "7844593ef3879dac7c6c215299b68c76ed9ee82ccf94e100a9606b1b8a1f2b8f"}, {"id": "risk-source-links", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e详细方案、结果与核对：\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E7%A0%94%E7%A9%B6%E6%96%B9%E6%A1%88-v1.0.md\"\u003e首轮方案\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E7%AE%80%E8%A6%81%E6%8A%A5%E5%91%8A-v1.0.md\"\u003e选法与新样本结果\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E6%80%A7%E8%83%BD%E5%9C%B0%E5%9B%BE%E5%AF%B9%E7%85%A7%E8%A1%A5%E5%85%85-v1.0.md\"\u003e性能地图对照\u003c/a\u003e；\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/B10%E6%96%B9%E6%B3%95%E9%80%89%E6%8B%A9-%E8%AF%AF%E5%B7%AE%E5%9B%A0%E7%B4%A0%E9%87%8F%E5%8C%96%E8%A1%A5%E5%85%85-v1.0.md\"\u003e误差因素量化\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "hash": "8a07ec893e2c4d69a94b4db898a7ac36c80ce2e1b6ca171f2708ace1a46cf234"}]}], "content_hash": "5c5920d13893d3f16ede38a05a457f8d558254725ab70ee30a3ba7aa0d437d73"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e样本特征已在本轮固定参数范围内提供了方法选择信息。后续需扩大尺度和位置条件，并在独立样本上检验规则的稳定性与风险；进一步考虑依据使用目标，优化方法内部的过程量与求解过程。\u003c/p\u003e", "hash": "6b7e83f408c88b1c554704d2afe109f05af441b2f5f381711d06a8b84da5c4fc"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "0c747394e361ecac4e868d65f40936452bee4d96207ad2e31a7407ea1b8dcbda"}], "last_applied_submission_id": "49124931-c57a-416b-8d4f-a2f9a18beabc", "last_rendered_submission_id": "49124931-c57a-416b-8d4f-a2f9a18beabc", "outline_confirmed": true, "review_complete": false, "review_runtime": "0.7.1", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parameters": ["beta", "eta", "gamma"], "subsets": ["own", "common"]}, "shape_winner_transition": {"beta": [4.5, 5], "n": [50, 20, 15, 10, 7], "winners": ["WMLE", "WMLE", "WMLE", "MDM-0.1", "MMLE"], "subsets": ["own", "common"]}, "gap_checked_regions": {"expanded_beta": [1.5, 2, 2.5, 3], "contracted_beta": [4.5, 5], "n": [50, 7], "parameters": ["beta", "eta", "gamma"]}}, "chapter3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8 function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
