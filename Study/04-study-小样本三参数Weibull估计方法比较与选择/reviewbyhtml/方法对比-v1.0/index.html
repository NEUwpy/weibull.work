003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e本章回答：当n减小、β增大时，观察到了什么现象？先比较误差大小、方法间差距、估计分布与异常频率怎样改变，再归纳需要解释的现象。条件变化怎样通过样本信息和估计构造产生这些表现，接在第三章讨论。\u003c/p\u003e", "markdown": "本章回答：当n减小、β增大时，观察到了什么现象？先比较误差大小、方法间差距、估计分布与异常频率怎样改变，再归纳需要解释的现象。条件变化怎样通过样本信息和估计构造产生这些表现，接在第三章讨论。", "hash": "2379c11c7584594c653076956b7f182e3417745d2a1ff7a3f159212ea7f32b10"}]}], "content_hash": "308bdef1eba43bf04d4059ef217b771b306c25451c438239c523a09943b51637"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计范围通常更宽，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e另外，LSE、LRE的位置估计进一步向γ=0聚集，这在n=50时已可见，n=7时边界结果更多。原尺度密度图也呈双峰外观；后续核对发现，剔除零位置结果后未保留两个明显峰，因此这里将边界聚集与非边界估计的偏移分别考察，不据原图认定存在“接近真值与偏移”的两个内部群体。\u003c/p\u003e", "hash": "79ecffbe17ffbb7e91536c03d1aa8e5115e53b5cf836bca97564aa86cd6076bb"}]}], "selected_ids": [], "content_hash": "1236cb8daa3c16e8ccd51ed8e20a35ef49a76fe114169d04f4226b7b7d4c7d79"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": "anomaly-phenomena", "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "modify", "selected": "synthesis-phenomena", "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": ["synthesis-phenomena"], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-chapter-opening", "kind": "text", "html": "\u003cp\u003e第二章建立了性能变化的事实。本章进一步追踪：n减小、β增大怎样改变有限样本所提供的信息；不同方法怎样将这些信息转化为定位判据和参数估计；这些响应又怎样表现为误差、偏移或异常。\u003c/p\u003e", "markdown": "第二章建立了性能变化的事实。本章进一步追踪：n减小、β增大怎样改变有限样本所提供的信息；不同方法怎样将这些信息转化为定位判据和参数估计；这些响应又怎样表现为误差、偏移或异常。", "hash": "8f25ea3d38291f7b742986f42c67169da68e11a776a7bec1a21f27d373ec7d06"}, {"id": "info31-3f6f4f6f1e98", "kind": "text", "html": "\u003cp\u003e3.1固定β，沿同一组样本的删点过程回应2.1的样本量现象；3.2考察形状条件改变后的起点信息、方向性偏移和边界聚集，回应2.2；3.3追踪2.3的明显异常可能在哪个环节形成。典型案例用于解释形成过程，第二章的重复抽样结果用于判断现象在总体比较中有多普遍。\u003c/p\u003e", "markdown": "3.1固定β，沿同一组样本的删点过程回应2.1的样本量现象；3.2考察形状条件改变后的起点信息、方向性偏移和边界聚集，回应2.2；3.3追踪2.3的明显异常可能在哪个环节形成。典型案例用于解释形成过程，第二章的重复抽样结果用于判断现象在总体比较中有多普遍。", "hash": "d865a55b4ad342913d354df747eb8cd402243168b7700537841b87d37d4c1c0a"}]}], "content_hash": "9ed64486aa4a9f67eea529436ae552b6290fa3c186759b918b28ad420ec788b3"}, {"id": "mechanism-high-beta", "title": "3.1　样本量减小后的信息变化与方法响应", "mode": "content", "state": "modify", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "当前正文", "blocks": [{"id": "n-a-opening", "kind": "text", "html": "\u003cp\u003e2.1显示，n减小时各方法的误差增幅不同。这里追踪两件相连的事：一是下端覆盖不足怎样削弱对候选分布的约束；二是少数观测形成的偶然聚集和间隔怎样进入方法判据，使其选中不同参数。前者说明哪些参数更难排除，后者说明方法为什么选中了其中某一组。\u003c/p\u003e", "markdown": "2.1显示，n减小时各方法的误差增幅不同。这里追踪两件相连的事：一是下端覆盖不足怎样削弱对候选分布的约束；二是少数观测形成的偶然聚集和间隔怎样进入方法判据，使其选中不同参数。前者说明哪些参数更难排除，后者说明方法为什么选中了其中某一组。", "hash": "bd76868bfa7980247ee85f4f8c8f3b73ea2b06cde8633d0682b3434021f6fc67"}, {"id": "info31-d1abc8cd2875", "kind": "text", "html": "\u003ch4\u003en减小，下端更容易留空\u003c/h4\u003e", "markdown": "#### n减小，下端更容易留空", "hash": "92c415640f3872b7fd63202e301dac4d413f54509c04dfe9fba7dd14a084d66f"}, {"id": "n-population-coverage", "kind": "image", "src": "assets/31H_n减小与下端覆盖.png", "alt": "固定形状时三档样本的观测、最小值、起点空白及最小值理论密度", "markdown": "![固定形状时三档样本的观测、最小值、起点空白及最小值理论密度](reviewbyhtml/方法对比-v1.0/assets/31H_n减小与下端覆盖.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-4623beff34c1", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近；它与3.2采用同一画法，这里固定β、只改变n。\u003c/em\u003e\u003c/p\u003e", "markdown": "*固定W(5,1000,500)。前三列取正式n=50、20、7存档各自的前50组，按本列最小值排序；蓝点为观测，橙点为最小值，灰线连接真实起点500与最小值。右图为最小值的理论密度。前三列共用寿命轴，右图聚焦起点附近；它与3.2采用同一画法，这里固定β、只改变n。*", "hash": "b5dc225fa425b12384596b3f632f3266b0542307a530a789721b180bd4334cc9"}, {"id": "info31-e1fe938af3f8", "kind": "text", "html": "\u003cp\u003e低寿命下端在总体中占比很小，抽取次数减少，就更容易一个也没抽到。图中最小观测通常离500更远，灰线变长，右侧最小值分布向右移动、变宽。以500—1000这段区间为例，整组没有任何观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。总体起点始终是500，扩大的是起点与最小观测之间的空白。\u003c/p\u003e", "markdown": "低寿命下端在总体中占比很小，抽取次数减少，就更容易一个也没抽到。图中最小观测通常离500更远，灰线变长，右侧最小值分布向右移动、变宽。以500—1000这段区间为例，整组没有任何观测落入其中的理论概率，随n=50→20→7约为21%→54%→80%；本轮1200组的实际比例约为20%→55%→80%。总体起点始终是500，扩大的是起点与最小观测之间的空白。", "hash": "0baed7e66dd8f7fbe2c0f0a229f023606917171fe7020ba8b73ed4cc37c1b4dd"}, {"id": "info31-96e33a061a24", "kind": "text", "html": "\u003cp\u003e同时，每组点数更少，观测比例、间距及点列关系对总体的近似也更粗、更易波动。这两类变化会分别进入不同方法的估计构造。\u003c/p\u003e", "markdown": "同时，每组点数更少，观测比例、间距及点列关系对总体的近似也更粗、更易波动。这两类变化会分别进入不同方法的估计构造。", "hash": "d8c7ad886ca592339c266a352ab78497a78243bd8fed5aa90bf5415e8afdadcc"}, {"id": "info31-4b7aeec04871", "kind": "text", "html": "\u003ch4\u003e最小观测约束的是起点，也是候选分布的下端概率\u003c/h4\u003e", "markdown": "#### 最小观测约束的是起点，也是候选分布的下端概率", "hash": "b460822bedaf6a8cd2371ff3cffae1ec9cd2c20cf326bad6694c59019490a76c"}, {"id": "info31-949acbaa14c8", "kind": "text", "html": "\u003cp\u003e记当前最小观测为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。从支持范围看，候选起点不能高于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，否则就有观测落在模型允许范围之外。但起点即使低于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，也还要解释另一件事：\u003cstrong\u003e模型认为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧应该有多少数据，而我们实际一个也没看到？\u003c/strong\u003e\u003c/p\u003e", "markdown": "记当前最小观测为$m$。从支持范围看，候选起点不能高于$m$，否则就有观测落在模型允许范围之外。但起点即使低于$m$，也还要解释另一件事：**模型认为$m$左侧应该有多少数据，而我们实际一个也没看到？**", "hash": "77f8d644f5aa3972f599a2a55bd1ae83146c3ef0ddd43a6304666b59213dde87"}, {"id": "info31-111087320b25", "kind": "text", "html": "\u003cp\u003e设候选参数为\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，它在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧安排的概率是\u003c/p\u003e", "markdown": "设候选参数为$\\theta=(\\beta,\\eta,\\gamma)$，它在$m$左侧安排的概率是", "hash": "048f422865b1f2543d21ac730c8bb5feee5647201b45f16483f4f1c44fb4ae31"}, {"id": "info31-a78c28180f29", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsubsup\u003e\u003cmo\u003e∫\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003ed\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\nq=F_\\theta(m)=\\int_\\gamma^m f_\\theta(t)\\,\\mathrm{d}t.\n$$", "hash": "c6f9c85f2ac5baa3325ac591c7b3faa01ed1a4d4de1a4500e3d7d75bbf149e5a"}, {"id": "info31-e1e2f5ec7a9b", "kind": "text", "html": "\u003cp\u003e因此，\u003cstrong\u003ePDF在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧的面积，与CDF在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e处的高度，是同一份概率信息\u003c/strong\u003e。最小观测并不单独确定形状参数；它与样本量一起，对三个参数共同决定的下端概率提供信息。\u003c/p\u003e", "markdown": "因此，**PDF在$m$左侧的面积，与CDF在$m$处的高度，是同一份概率信息**。最小观测并不单独确定形状参数；它与样本量一起，对三个参数共同决定的下端概率提供信息。", "hash": "2212785fc42033c924af50578dc7da473d68269b5635f0c67a39fc30c1c762f4"}, {"id": "n-distribution-link", "kind": "image", "src": "assets/31I_最小观测与整条分布.png", "alt": "同一组七点上两种代入位置恢复出的PDF与CDF，以及固定蓝色候选分布的无下端观测概率", "markdown": "![同一组七点上两种代入位置恢复出的PDF与CDF，以及固定蓝色候选分布的无下端观测概率](reviewbyhtml/方法对比-v1.0/assets/31I_最小观测与整条分布.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-d5e1f0966382", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e前两图始终使用同一组7点及其LSE理论参考坐标，分别代入位置662.5、1174.0后恢复形状与尺度；两条曲线都是7点条件恢复，蓝线不是原50点拟合。底部刻线是这7个真实观测，竖线为最小值\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1226.9\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。蓝色PDF阴影面积等于蓝色CDF圆点的高度\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eq\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e。右图固定蓝色候选参数和同一阈值\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，计算重新独立抽取n个观测时全部不小于\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e的模型概率。\u003c/em\u003e\u003c/p\u003e", "markdown": "*前两图始终使用同一组7点及其LSE理论参考坐标，分别代入位置662.5、1174.0后恢复形状与尺度；两条曲线都是7点条件恢复，蓝线不是原50点拟合。底部刻线是这7个真实观测，竖线为最小值$m=1226.9$。蓝色PDF阴影面积等于蓝色CDF圆点的高度$q$。右图固定蓝色候选参数和同一阈值$m$，计算重新独立抽取n个观测时全部不小于$m$的模型概率。*", "hash": "8c0028a290dd84ed75abbbca418ef5e4af58654a00cdba4223c6d6799f4c4e82"}, {"id": "info31-c711d13be134", "kind": "text", "html": "\u003cp\u003e先只看蓝色候选分布。它在\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e左侧放了约9.83%的概率。若固定这个分布和阈值，重新独立抽取n个观测，全部避开这段区域的概率为\u003c/p\u003e", "markdown": "先只看蓝色候选分布。它在$m$左侧放了约9.83%的概率。若固定这个分布和阈值，重新独立抽取n个观测，全部避开这段区域的概率为", "hash": "84d48df8eec563f71b488728987c6b6b38c8fad691b457aaf71289a976a1324b"}, {"id": "info31-762ee72501f0", "kind": "text", "html": "\u003cp\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e≥\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/p\u003e", "markdown": "$$\nP_\\theta(X_{(1)}\\geq m)=[1-F_\\theta(m)]^n=(1-q)^n.\n$$", "hash": "b54a023154ac5bce688ccf00b1ad6580244fc9b75572dc1b16d53aa036254c1f"}, {"id": "info31-28fa84e2549a", "kind": "text", "html": "\u003cp\u003en=50时约为0.56%，n=7时约为48.4%。这说明，\u003cstrong\u003e小样本中没有看到下端观测，仍可能容许总体在那里放有相当概率\u003c/strong\u003e；样本CDF在最小值左侧为0，也不表示总体CDF在那里必须为0。上式用于说明空白区包含的抽样信息，具体选参仍要结合全部观测和各方法原有判据。\u003c/p\u003e", "markdown": "n=50时约为0.56%，n=7时约为48.4%。这说明，**小样本中没有看到下端观测，仍可能容许总体在那里放有相当概率**；样本CDF在最小值左侧为0，也不表示总体CDF在那里必须为0。上式用于说明空白区包含的抽样信息，具体选参仍要结合全部观测和各方法原有判据。", "hash": "4f4c5e8391b5125965358c6db7017e3db482c9ee951a54f2bc16d178da0ed0f6"}, {"id": "info31-ab9ad46ebc02", "kind": "text", "html": "\u003ch4\u003e起点怎样牵动形状、尺度和整条曲线\u003c/h4\u003e", "markdown": "#### 起点怎样牵动形状、尺度和整条曲线", "hash": "8f8e4cdeb408f0005ecdbbaefbaca69301f0877f6bb2bf5950d83f003a0ab0b2"}, {"id": "info31-9ce9f7b386ce", "kind": "text", "html": "\u003cp\u003e单独改变位置参数、保持形状和尺度不变，只会平移分布。图中PDF外形之所以改变，是因为\u003cstrong\u003e方法在新的起点下，为匹配同一批观测，重新估计了形状和尺度\u003c/strong\u003e。\u003c/p\u003e", "markdown": "单独改变位置参数、保持形状和尺度不变，只会平移分布。图中PDF外形之所以改变，是因为**方法在新的起点下，为匹配同一批观测，重新估计了形状和尺度**。", "hash": "14a9fda66223173321794654de83e988dc1e6a635b354f5ac0849929dbd3ebfd"}, {"id": "info31-aa03d6558901", "kind": "text", "html": "\u003cp\u003e仍看图中的同一组7点，最小值为1226.9，最大值为1903.5：\u003c/p\u003e", "markdown": "仍看图中的同一组7点，最小值为1226.9，最大值为1903.5：", "hash": "595e771788892138b7d7131359d657f1d42584563dcbefc67104494e14d157cf"}, {"id": "info31-bd3b0fcfb97b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e代入位置\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e最小观测到起点的距离\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e最大观测到起点的距离\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e662.5\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e564.3\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1240.9\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1174.0\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e52.9\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e729.5\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 代入位置 | 最小观测到起点的距离 | 最大观测到起点的距离 |\n|---|---:|---:|\n| 662.5 | 564.3 | 1240.9 |\n| 1174.0 | 52.9 | 729.5 |", "hash": "f5251fb88de439359ed79c5ca6dcb99099d8d2614893ae761140ebbd23e57325"}, {"id": "info31-69ffac3a9c3d", "kind": "text", "html": "\u003cp\u003e起点右移后，下端距离缩短的比例更大，最大与最小距离之比从约2.2增至13.8。LSE对这些距离取对数，再与固定的理论参考坐标回归；对数距离跨度增大，使本例的回归线变陡。形状取斜率倒数，因此从5.23降到1.52；尺度由截距恢复，从871.0降到332.9。本例中，起点向右移，PDF峰位却向左移：另外两参的重新匹配改变了整条曲线的外形，CDF也随之改变。\u003c/p\u003e", "markdown": "起点右移后，下端距离缩短的比例更大，最大与最小距离之比从约2.2增至13.8。LSE对这些距离取对数，再与固定的理论参考坐标回归；对数距离跨度增大，使本例的回归线变陡。形状取斜率倒数，因此从5.23降到1.52；尺度由截距恢复，从871.0降到332.9。本例中，起点向右移，PDF峰位却向左移：另外两参的重新匹配改变了整条曲线的外形，CDF也随之改变。", "hash": "00ee7a88a4077d37a174792a6286c3342baf657e37fc8fd29cc9071911609110"}, {"id": "info31-6e8daa43e7c8", "kind": "text", "html": "\u003cp\u003e这里的传递是“改变起点后重新匹配数据”，并不是最小值单独决定形状。MDM也通过观测到起点的距离恢复伪尺度，位置改变后，其一致关系和恢复参数也会改变；\u003ca href=\"#n-supplement\"\u003e补充核对图\u003c/a\u003e保留两法的具体恢复过程。\u003c/p\u003e", "markdown": "这里的传递是“改变起点后重新匹配数据”，并不是最小值单独决定形状。MDM也通过观测到起点的距离恢复伪尺度，位置改变后，其一致关系和恢复参数也会改变；[补充核对图](结果呈现/比较探索/3.1逐档拟合与误差.md)保留两法的具体恢复过程。", "hash": "03af76a636bfc3a5eaf6f8413350ee9200a4303e8539445018e5e895abe4b073"}, {"id": "info31-3ff08b4b51de", "kind": "text", "html": "\u003ch4\u003e样本中的偶然聚集与间隔怎样改变判据\u003c/h4\u003e", "markdown": "#### 样本中的偶然聚集与间隔怎样改变判据", "hash": "235758f7a2d83f0ffb06fe6821b2cde263659113db24d8ec6b83753ee4b524da"}, {"id": "info31-0bb2b05f4229", "kind": "text", "html": "\u003cp\u003e约束变弱，还没有解释方法为什么选中了偏离真值的参数。\u003cstrong\u003e判据是用当前这一组点计算的；点数少时，几个点的偶然聚集或一个较大间隔就占据了点列的较大部分，判据更容易受这些结构影响\u003c/strong\u003e。这不是说每组小样本都更不规则，而是同一种构造在不同小样本上，可能因为点列关系不同而偏向不同参数。\u003c/p\u003e", "markdown": "约束变弱，还没有解释方法为什么选中了偏离真值的参数。**判据是用当前这一组点计算的；点数少时，几个点的偶然聚集或一个较大间隔就占据了点列的较大部分，判据更容易受这些结构影响**。这不是说每组小样本都更不规则，而是同一种构造在不同小样本上，可能因为点列关系不同而偏向不同参数。", "hash": "24ff23ee1d4d312e615d6cbb7753b0dc0c4a0e418f289845c163e7e1b134500d"}, {"id": "info31-c9acb1c52c86", "kind": "text", "html": "\u003cp\u003e看474号路径最终保留的7点，约为1226.9、1372.1、1374.8、1395.2、1409.3、1569.0、1903.5。其中\u003cstrong\u003e第2—5点共4点挤在37.3的范围内，末端两点却相隔334.5\u003c/strong\u003e。这些聚集和间隔是这次保留样本的结构，不是总体分布固定具有的特征。\u003c/p\u003e", "markdown": "看474号路径最终保留的7点，约为1226.9、1372.1、1374.8、1395.2、1409.3、1569.0、1903.5。其中**第2—5点共4点挤在37.3的范围内，末端两点却相隔334.5**。这些聚集和间隔是这次保留样本的结构，不是总体分布固定具有的特征。", "hash": "5a7405093da2fa4ff92126fedc3a3943812d5e9d7e3485fdd6c6600a892cc80f"}, {"id": "n-a-criteria", "kind": "image", "src": "assets/31D_定位判据响应_样本474.png", "alt": "七点的聚集与大间隔、同七点的LSE匹配对照及实际定位判据", "markdown": "![七点的聚集与大间隔、同七点的LSE匹配对照及实际定位判据](reviewbyhtml/方法对比-v1.0/assets/31D_定位判据响应_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-8dee90017105", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e从左到右读：(a)七个观测的实际寿命与次序，标出中间四点的跨度和末端间隔；(b)固定同一7点及其理论参考坐标，对比真实位置500与LSE所选位置1174.0。空心点对应500，实心点对应1174.0，同颜色、形状追踪同一组观测；两轴分别中心化并除以样本标准差，只为比较相对线性匹配。(c)同一删点路径n=50、20、7的实际LSE相对失配\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e；同一n下，其最低点与F比最大点等价。虚线为真实位置500。\u003c/em\u003e\u003c/p\u003e", "markdown": "*从左到右读：(a)七个观测的实际寿命与次序，标出中间四点的跨度和末端间隔；(b)固定同一7点及其理论参考坐标，对比真实位置500与LSE所选位置1174.0。空心点对应500，实心点对应1174.0，同颜色、形状追踪同一组观测；两轴分别中心化并除以样本标准差，只为比较相对线性匹配。(c)同一删点路径n=50、20、7的实际LSE相对失配$1-R^2$；同一n下，其最低点与F比最大点等价。虚线为真实位置500。*", "hash": "c398a09433de8439d1b84e27281676a425bc9d5668c2105896e63fcd6f584a0e"}, {"id": "info31-60a55716e3bf", "kind": "text", "html": "\u003cp\u003eLSE把每个观测到候选起点的距离取对数，与按次序确定的理论参考坐标配对。中间四个观测很近，但各自仍对应不同的参考坐标；末端大间隔又使最后一点的对数距离明显抬高。这组点列在真实位置下没有很好地排成直线。右移候选位置会更强地拉开下端的对数距离，改变整组点列的相对关系；在本例中，这使相对线性匹配更好。\u003c/p\u003e", "markdown": "LSE把每个观测到候选起点的距离取对数，与按次序确定的理论参考坐标配对。中间四个观测很近，但各自仍对应不同的参考坐标；末端大间隔又使最后一点的对数距离明显抬高。这组点列在真实位置下没有很好地排成直线。右移候选位置会更强地拉开下端的对数距离，改变整组点列的相对关系；在本例中，这使相对线性匹配更好。", "hash": "4873b1bb32b3a48fccc8a0602dde5d333fe0fead88c821ddae7b4010e20e2412"}, {"id": "info31-f086dda3760b", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e同一7点上代入的位置\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e相对失配\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e由原始回归恢复的形状\u003c/th\u003e\u003cth style=\"text-align:right\"\u003e恢复的尺度\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真实位置500\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.228\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e6.29\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1036.7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE选中位置1174.0\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e0.106\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e1.52\u003c/td\u003e\u003ctd style=\"text-align:right\"\u003e332.9\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 同一7点上代入的位置 | 相对失配$1-R^2$ | 由原始回归恢复的形状 | 恢复的尺度 |\n|---|---:|---:|---:|\n| 真实位置500 | 0.228 | 6.29 | 1036.7 |\n| LSE选中位置1174.0 | 0.106 | 1.52 | 332.9 |", "hash": "50abcbc6d929dbba119b8c0f2a446fddb6c30221105fddcfb61eeb2d39853c88"}, {"id": "info31-130d0304174a", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e判据确实改善了，位置却离真值更远，形状和尺度也随之降低\u003c/strong\u003e。LSE寻找的是“让这组点列相对更接近直线的位置”；这组小样本的偶然结构，使该位置与真实起点分离。这里用的是原有相对匹配判据，不是原始残差平方和；形状仍取原始对数回归斜率的倒数，图中标准化斜率只用于显示。\u003c/p\u003e", "markdown": "**判据确实改善了，位置却离真值更远，形状和尺度也随之降低**。LSE寻找的是“让这组点列相对更接近直线的位置”；这组小样本的偶然结构，使该位置与真实起点分离。这里用的是原有相对匹配判据，不是原始残差平方和；形状仍取原始对数回归斜率的倒数，图中标准化斜率只用于显示。", "hash": "8b73ab74802ef926a9cdeaeefb1dabb6047231116bcfc8d372a928fcfd9584b8"}, {"id": "info31-390ab0085f37", "kind": "text", "html": "\u003cp\u003e不同构造会以不同方式响应。MMLE直接以最小值定位，7点的最小值升到1226.9，便直接返回该位置。MDM把整组点反算为伪尺度，以它们的一致程度及其随位置的变化定位；同一7点的实际梯度在1143.8达到0.1，随后恢复出另一组形状、尺度。\u003ca href=\"#n-supplement\"\u003e三法定位对照\u003c/a\u003e保留完整曲线。\u003c/p\u003e", "markdown": "不同构造会以不同方式响应。MMLE直接以最小值定位，7点的最小值升到1226.9，便直接返回该位置。MDM把整组点反算为伪尺度，以它们的一致程度及其随位置的变化定位；同一7点的实际梯度在1143.8达到0.1，随后恢复出另一组形状、尺度。[三法定位对照](结果呈现/比较探索/3.1逐档拟合与误差.md)保留完整曲线。", "hash": "21865271fc472c7329a2ba29aa5f92c55eed9e3253bf9a8b8dae7fba6ee77ddb"}, {"id": "info31-ba09e14bc71e", "kind": "text", "html": "\u003cp\u003e这些响应并非只由最小值决定。50→20点时最小值仍是930.6，MMLE位置不变，MDM却从733.7变到683.7，LSE从662.5变到550.5；此段反而更接近真值。删点同时改变了整组观测、间距和当前n的参考坐标，其影响可以向不同方向发生。\u003c/p\u003e", "markdown": "这些响应并非只由最小值决定。50→20点时最小值仍是930.6，MMLE位置不变，MDM却从733.7变到683.7，LSE从662.5变到550.5；此段反而更接近真值。删点同时改变了整组观测、间距和当前n的参考坐标，其影响可以向不同方向发生。", "hash": "1b3a1a6e90cd872ebede3d2a001db6bdb0b38a80d1aac436172a6448d1dcc0a3"}, {"id": "info31-9d5f83075ce3", "kind": "text", "html": "\u003cp\u003e因此，n减少后的两步传递是：\u003cstrong\u003e下端覆盖不足，使候选参数更难排除；少数点的偶然聚集与间隔进入判据，改变它偏好的参数组合，再经参数恢复形成误差\u003c/strong\u003e。本例具体展示LSE的这一过程，MMLE和MDM用于对照不同构造的响应；单条路径不保证误差随n单调变化，总体增幅仍由第二章的重复抽样比较判断。\u003c/p\u003e", "markdown": "因此，n减少后的两步传递是：**下端覆盖不足，使候选参数更难排除；少数点的偶然聚集与间隔进入判据，改变它偏好的参数组合，再经参数恢复形成误差**。本例具体展示LSE的这一过程，MMLE和MDM用于对照不同构造的响应；单条路径不保证误差随n单调变化，总体增幅仍由第二章的重复抽样比较判断。", "hash": "f3152f7ad6fe7ba39766dc78debaa21146dc7b17240d62b8a3e024817ee5ed7e"}, {"id": "info31-cfc68255cfec", "kind": "text", "html": "\u003cp\u003e\u003ca href=\"#n-supplement\"\u003e补充核对：逐档拟合、单次误差及构造输入\u003c/a\u003e。正文仍为三幅主图，具体恢复公式与逐档结果放在补充区。\u003c/p\u003e", "markdown": "[补充核对：逐档拟合、单次误差及构造输入](结果呈现/比较探索/3.1逐档拟合与误差.md)。正文仍为三幅主图，具体恢复公式与逐档结果放在补充区。", "hash": "58e0b0764bdc5eefb73bf5cc2c01a4da64a6c4a9d1813bdbab8a11995504e4e4"}, {"id": "info31-e5c9c64636c3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e来源与数值见\u003ca href=\"file:///C:/Web/Weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E7%BB%93%E6%9E%9C%E5%91%88%E7%8E%B0/%E6%AF%94%E8%BE%83%E6%8E%A2%E7%B4%A2/3.1%E6%9C%BA%E5%88%B6%E9%93%BE%E6%A0%B8%E9%AA%8C.json\"\u003e3.1机制链核验\u003c/a\u003e。无下端观测的事件概率是在固定候选参数、固定阈值下计算，不是原拟合的检验p值，也不替代最小值的完整密度或方法目标。分布关系见\u003ca href=\"https://www.itl.nist.gov/div898/handbook/eda/section3/eda3668.htm\"\u003eNIST Weibull定义\u003c/a\u003e，顺序统计量和经验分布性质见\u003ca href=\"https://www.cs.cmu.edu/afs/cs/academic/class/15750-s16/Handouts/orderstats.pdf\"\u003e顺序统计量讲义\u003c/a\u003e。未新增抽样或改写正式结果。\u003c/em\u003e\u003c/p\u003e", "markdown": "*来源与数值见[3.1机制链核验](结果呈现/比较探索/3.1机制链核验.json)。无下端观测的事件概率是在固定候选参数、固定阈值下计算，不是原拟合的检验p值，也不替代最小值的完整密度或方法目标。分布关系见[NIST Weibull定义](https://www.itl.nist.gov/div898/handbook/eda/section3/eda3668.htm)，顺序统计量和经验分布性质见[顺序统计量讲义](https://www.cs.cmu.edu/afs/cs/academic/class/15750-s16/Handouts/orderstats.pdf)。未新增抽样或改写正式结果。*", "hash": "82652b2a06fa180d9bd3dd4b991d33514902e46f7017dc743619450d5d970c7c"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "746179ae23ba9f938fd4703b1ef62d31523fae81d37d4423c3cf35891ecdb355"}, {"id": "mechanism-n-background", "title": "3.2　形状条件下的偏移与边界聚集", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：β=2与5、n=7/15/30时观测、最小观测及其与真实起点的距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003e相同n下，β=5时的最小观测比β=2时更远离真实起点；样本量减小时，这段距离进一步增大。下排最小观测的分布也显示，较大β下，即使增加样本，最小观测仍可能与起点保持较大距离。观测集中于分布中部，起点附近缺少数据，位置参数需要从较远处外推。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用Research00报告1图2：η=1000、γ=500，β=2、5，n=7、15、30。橙点为每组样本的最小观测，灰线为其到真实起点的距离；下排为最小观测的理论密度。历史样本仅用于解释，不并入本轮1200次统计。\u003c/em\u003e\u003c/p\u003e", "hash": "ab9280998b57d2e310a3a6d8186c6802fd518a75f1018f80016e90982f0438be"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "Research00报告1：W(5,1000,500)与W(2,500,1000)在样本覆盖区间内接近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-compatible-reading", "kind": "text", "html": "\u003cp\u003e最小观测远离起点时，有限样本主要覆盖分布中部。图中的两组参数虽然相差较大，在这些观测所在的区间内，分布曲线仍较接近。因此，样本可能容许不同的参数组合；还需要追踪方法判据为什么选中了其中某一组。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用Research00报告1图3：β=5、n=7第31组样本；黑点累计概率由样本排序近似。两条曲线用于说明参数相容，不代表该样本必然被估成其中某一组参数。\u003c/em\u003e\u003c/p\u003e", "hash": "f2b580f3edfedd4b68ec62958dbc2134d53283d5ebf5df381c9979a4857eeb6f"}, {"id": "shape-a-opening", "kind": "text", "html": "\u003ch4\u003e方向性偏移的形成\u003c/h4\u003e\u003cp\u003eMDM仍按同一个梯度阈值定位。高β时，各观测反算的伪尺度随位置变化更接近同步，标准差梯度较小，阈值交点可能出现在偏高位置。位置提高后，小观测到起点的距离缩短比例更大，需要更小的形状维持伪尺度的一致，再恢复出更小尺度。\u003c/p\u003e", "hash": "1efab47cdb8268d2243e772c8f6bd9a6335f5c03bd095020e56c8126d4d8e954"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00报告1：梯度阈值选中较高位置后，形状和尺度随之降低", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-mdm-reading", "kind": "text", "html": "\u003cp\u003e图中先看梯度交点，再沿同一位置看形状与尺度。这样，位置偏高、形状偏低、尺度偏低对应的是同一估计过程的传递，三个参数的偏差有共同来源。\u003c/p\u003e\u003cp\u003e\u003cem\u003eResearch00报告1图5，δ=0.1；β=2、5，n=7第48组配对样本。用于说明传递路径，不据单例认定全部方法或全部样本均如此。\u003c/em\u003e\u003c/p\u003e\u003ch4\u003e边界聚集的形成\u003c/h4\u003e", "hash": "0856234232a9a303aaf2bbbe57bfffbe02db8bec91d472d69c7266bee3f314c4"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "Research00报告2：LSE左移位置改善线性匹配，最佳位置可落在零边界或内部", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-boundary-reading", "kind": "text", "html": "\u003cp\u003eLSE移动位置是为了让对数距离与参考坐标更接近直线。左移位置会压缩下端对数间距；当这能改善点列匹配时，准则倾向于更低位置。图中橙色样本在允许范围内的最低点落到γ=0，紫色样本的最低点则留在内部。γ≥0的约束使不同样本都可能返回同一个零值，重复估计中便形成边界聚集。\u003c/p\u003e\u003cp\u003e选低位置也压缩了整体对数跨度，使LSE回归斜率减小，取倒数后形状升高。因此，边界位置和形状高估可以沿同一条恢复关系连接起来。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用报告2图6：正常与零边界样本为W(2,100,500)、n=15第35、36组；内部左偏为W(2,1000,3000)、n=7第1组。这里借用其机制图，不将这些历史条件并入本轮β=5统计。\u003c/em\u003e\u003c/p\u003e", "hash": "03c7d488d6d3176d7ca5d8a9e32426de386311f26780c19387f1ef379e2b8533"}]}], "content_hash": "01f22463683d3d14304ef8dbe408a256f329e7cb1b32d89297bd01218d5925ad"}, {"id": "mechanism-boundary", "title": "3.3　明显异常估计的形成", "mode": "content", "state": "modify", "selected": "mechanism-boundary", "options": [{"id": "mechanism-boundary", "label": "当前内容", "blocks": [{"id": "anomaly-opening", "kind": "text", "html": "\u003cp\u003e明显异常估计要追踪异常在哪个估计环节形成。Research00报告2区分了两种情况：当前方法的准则确实支持一组明显偏离真值的参数；或搜索、停止、候选接受没有正确落实预定规则。\u003c/p\u003e\u003ch4\u003e样本结构改变判据，异常参数仍可满足方法规则\u003c/h4\u003e", "hash": "3d380156aac209e9d99d1cf7cede068e50e9b5d4ed2bc616e27217a00cc83c6c"}, {"id": "anomaly-statistical", "kind": "gallery", "aspect_ratio": 1.68, "images": [{"id": "lse-right", "label": "LSE：改善线性匹配后，形状反而明显低估", "src": "assets/R00_报告2_LSE_right.png", "alt": "报告2图7：远端观测改变点列，位置右移改善匹配并使形状降低"}, {"id": "wmle-low", "label": "WMLE：两条方程均满足，参数仍明显偏离真值", "src": "assets/R00_报告2_WMLE_low.png", "alt": "报告2图12：样本距离改变共同交点，残差趋零但形状与尺度仍低估"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-lse-reading", "kind": "text", "html": "\u003cp\u003eLSE的异常样本中，前几个观测相对集中，另有一个较远观测。真位置下的点列与参考坐标匹配较差，右移位置能拉开下端对数间距，使点列更接近直线。准则因此选中靠近最小观测的位置，但随之增大的回归斜率取倒数后，形状明显降低，尺度也由缩小的距离恢复为较低值。\u003c/p\u003e\u003cp\u003eWMLE的异常样本改变了下端距离、对数距离和幂加权距离，两条方程的共同交点移向较高位置、较低形状。将返回参数代回，残差仍接近零。这里不是方程没有解对，而是这些样本统计量本身支持了偏离真值的参数。\u003c/p\u003e\u003cp\u003e\u003cem\u003e复用报告2图7、12。LSE为W(2,1000,500)、n=7第18、19组；WMLE为W(5,100,500)、n=7第3、11组。保留历史实现及参数条件，只解释形成路径。\u003c/em\u003e\u003c/p\u003e\u003ch4\u003e数值求解未落实规则，也能形成异常返回\u003c/h4\u003e", "hash": "f6b47d9098f83f9e460bbfb8f4b4215325d0ab5af620ca224be2beb61ec4c551"}, {"id": "anomaly-solver", "kind": "image", "src": "assets/R00_报告2_MLE_stop.png", "alt": "报告2图17：旧MLE近零停点仍存在提高似然的方向", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-solver-reading", "kind": "text", "html": "\u003cp\u003e旧MLE的第37组在近零位置停止，优化器标记收敛；其他起点的返回结果又因形状不满足接受条件被剔除，最终只剩这个候选。但图中向右仍可提高似然，说明搜索停止及候选接受没有实现预期的最优选择。近零位置进一步压缩对数跨度，形成较大的形状估计。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图17，W(2,1000,3000)、n=7第37、38组，采用旧MLE。Study04已更新求解器，此例用于区分计算来源，不认定新版仍有同一缺陷。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e前两例应研究估计准则对样本结构的响应；后一例应改进求解与候选检查。异常表现相近，形成环节不同，改进方向也不同。\u003c/p\u003e", "hash": "2970d3a7da3090180bc99663a9a2c94d3c842ff573dbe65940e03fb35141cbf8"}]}], "selected_ids": ["mechanism-boundary"], "content_hash": "512d4ac5b36d27378c5f782504a6468217c3ac96d8bb06b6e10e0ae66bb00282"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "60e3a18b546fd1677a2d2f935ab3875baef2da72bea8ce5f454e020b14b56217"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "1a161b266aac2eba5fcdeeb8bcd4972db1965ec18f91f900609e103c048f4784"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}, {"id": "mechanism-n-supplement", "title": "附：3.1补充核对图", "mode": "content", "state": "open", "selected": null, "options": [{"id": "n-supplement-content", "label": "补充核对", "blocks": [{"id": "info31-40e1d8973425", "kind": "text", "html": "\u003ca id=\"n-supplement\"\u003e\u003c/a\u003e\u003cp\u003e本页补充\u003ca href=\"file:///C:/Web/Weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E6%8A%A5%E5%91%8A%E4%B8%8B%EF%BC%88%E6%96%B9%E6%B3%95%E5%AF%B9%E6%AF%94%EF%BC%89-v2.1.md\"\u003e报告下v2.1第3.1节\u003c/a\u003e，沿同一条474号嵌套路径逐档浏览结果。正文先讲样本信息、估计构造和误差之间的联系；此处用于核对每一档的CDF拟合与三个参数的单次误差。\u003c/p\u003e", "markdown": "本页补充[报告下v2.1第3.1节](../../报告下（方法对比）-v2.1.md)，沿同一条474号嵌套路径逐档浏览结果。正文先讲样本信息、估计构造和误差之间的联系；此处用于核对每一档的CDF拟合与三个参数的单次误差。", "hash": "aa9b6faa4bef3aa4c9f819b93a3136d36a6e67a1d55f38fae90d8fe83e0d6e79"}, {"id": "info31-796fe968bde1", "kind": "text", "html": "\u003cp\u003e五档CDF共用坐标，同一参数的误差也共用纵轴范围。上排每列只画一种方法及真实CDF；黑点寿命坐标是真实观测，纵坐标按各自n计算(i−0.5)/n，仅作展示。下排为估计值减真值，不是重复抽样的平均Bias。每档都是前一档子集；这里的n=7子集不等于正式n=7表中同编号样本。\u003c/p\u003e", "markdown": "五档CDF共用坐标，同一参数的误差也共用纵轴范围。上排每列只画一种方法及真实CDF；黑点寿命坐标是真实观测，纵坐标按各自n计算(i−0.5)/n，仅作展示。下排为估计值减真值，不是重复抽样的平均Bias。每档都是前一档子集；这里的n=7子集不等于正式n=7表中同编号样本。", "hash": "d05dc75ce5fea057c3d616e571cb8660136048c7d98425c134906e2bedf70799"}, {"id": "info31-885f8e1ef627", "kind": "text", "html": "\u003ch2\u003e同一条路径实际保留了哪些点\u003c/h2\u003e", "markdown": "## 同一条路径实际保留了哪些点", "hash": "7d03c43ba45200a80c30aeca0c4f4e530a99a63a988771e31d271b5d6dae9d93"}, {"id": "info31-71a550d9522d", "kind": "image", "src": "assets/31C_样本信息变化_样本474.png", "alt": "474号嵌套路径的观测与下端空缺", "markdown": "![474号嵌套路径的观测与下端空缺](../../reviewbyhtml/方法对比-v1.0/assets/31C_样本信息变化_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-4ee7afb8fb3e", "kind": "text", "html": "\u003cp\u003e深色为当前观测，浅灰为原50点中已删观测，蓝点为当前最小值，橙段为最大相邻间隔。本图追踪一条路径；正文31H展示不同n下重复样本及最小值的总体分布，两者分工不同。\u003c/p\u003e", "markdown": "深色为当前观测，浅灰为原50点中已删观测，蓝点为当前最小值，橙段为最大相邻间隔。本图追踪一条路径；正文31H展示不同n下重复样本及最小值的总体分布，两者分工不同。", "hash": "be382df75a1a47018392d74d920158da5db64d69cc86c58a8c1d2aed72263ed6"}, {"id": "info31-a6781a92e9c6", "kind": "text", "html": "\u003ch2\u003e同一观测怎样进入构造\u003c/h2\u003e", "markdown": "## 同一观测怎样进入构造", "hash": "4d0a30fd60b25d48436f84d7b324285fb01d1507954e51864c9afe5d0e96f005"}, {"id": "info31-2defee812a5d", "kind": "image", "src": "assets/31G_样本进入构造_样本474.png", "alt": "固定参数下MDM伪尺度和LSE参考坐标的变化", "markdown": "![固定参数下MDM伪尺度和LSE参考坐标的变化](../../reviewbyhtml/方法对比-v1.0/assets/31G_样本进入构造_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-41118cd7a057", "kind": "text", "html": "\u003cp\u003e暂固定MDM的β=5、γ=500及LSE的γ=500，黑箭头追踪50→20点时同一个930.6观测。其MDM绘图位置从0.01389变为0.03431，伪尺度从1011.5变为842.4；LSE的对数距离相同，横坐标从−4.4892变为−3.5729。这是输入变换诊断，不是实际定位判据。\u003c/p\u003e", "markdown": "暂固定MDM的β=5、γ=500及LSE的γ=500，黑箭头追踪50→20点时同一个930.6观测。其MDM绘图位置从0.01389变为0.03431，伪尺度从1011.5变为842.4；LSE的对数距离相同，横坐标从−4.4892变为−3.5729。这是输入变换诊断，不是实际定位判据。", "hash": "35bcd834ef2396f24343e09de024d8aca96493bdd4abb3588ae1e16d0227a750"}, {"id": "info31-dee3d2eec658", "kind": "text", "html": "\u003ch2\u003e三种构造的实际定位判据\u003c/h2\u003e", "markdown": "## 三种构造的实际定位判据", "hash": "d5e3804ecca1947bee1efd5c1f7c38eda2e936957e03659a69493a85c9a3aee2"}, {"id": "info31-71882e3c13c7", "kind": "image", "src": "assets/31J_三法定位判据_样本474.png", "alt": "同一删点路径中MMLE最小值定位、MDM梯度交点和LSE相对匹配最低点", "markdown": "![同一删点路径中MMLE最小值定位、MDM梯度交点和LSE相对匹配最低点](../../reviewbyhtml/方法对比-v1.0/assets/31J_三法定位判据_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "info31-8269241c199d", "kind": "text", "html": "\u003cp\u003e正文31D集中展示“七点的偶然结构→LSE相对匹配→实际选参”。这里保留原三法对照：MMLE位置等于最小观测；MDM先逐位置优化形状，再以最小伪尺度标准差的梯度达到0.1定位；LSE逐位置回归，以同一n下\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e最小定位。圆点为实际返回位置，虚线为真实位置500。不同n的判据高度不直接表示估计精度。\u003c/p\u003e", "markdown": "正文31D集中展示“七点的偶然结构→LSE相对匹配→实际选参”。这里保留原三法对照：MMLE位置等于最小观测；MDM先逐位置优化形状，再以最小伪尺度标准差的梯度达到0.1定位；LSE逐位置回归，以同一n下$1-R^2$最小定位。圆点为实际返回位置，虚线为真实位置500。不同n的判据高度不直接表示估计精度。", "hash": "1ce8d95180412e5e8f10a36897ae331bf664d3cd866e51ff5577d950df4ef657"}, {"id": "info31-d04811243bda", "kind": "text", "html": "\u003cp\u003e正文31D的回归点列分别作中心化及标准差归一化，展示的是原判据所用的相对匹配。在同一7点上，位置500与1174.0的\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e分别为0.227536与0.106430。两位置的原始对数距离总变差不同，不能将这个改善说成原始残差平方和下降；参数仍由原始回归恢复。核验JSON保留原始残差平方和、总平方和及全部标准化坐标。\u003c/p\u003e", "markdown": "正文31D的回归点列分别作中心化及标准差归一化，展示的是原判据所用的相对匹配。在同一7点上，位置500与1174.0的$1-R^2$分别为0.227536与0.106430。两位置的原始对数距离总变差不同，不能将这个改善说成原始残差平方和下降；参数仍由原始回归恢复。核验JSON保留原始残差平方和、总平方和及全部标准化坐标。", "hash": "e7946a298400954ab6f5ba12aa73156a44624a34a113e2fa17a98677922d6557"}, {"id": "info31-527bb3a6976f", "kind": "text", "html": "\u003ch2\u003e位置进入形状与尺度恢复的具体步骤\u003c/h2\u003e", "markdown": "## 位置进入形状与尺度恢复的具体步骤", "hash": "bbffc745729ec01266b39d6a09bdfda41f228abe42d6836f7d91e2760810029f"}, {"id": "n-parameter-recovery", "kind": "image", "src": "assets/31F_固定七点的位置条件对照_样本474.png", "alt": "固定同一七点下MDM谷底、LSE回归线及尺度恢复", "markdown": "![固定同一七点下MDM谷底、LSE回归线及尺度恢复](../../reviewbyhtml/方法对比-v1.0/assets/31F_固定七点的位置条件对照_样本474.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, { function editorKeydown(event){if(event.isComposing||event.keyCode===229)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!saveNote())$('editor-input').focus();updateOutlineStatus()}if(event.key==='Escape')closeEditor()}

$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function sidebarNote(anchor,comment){const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',comment));const tools=el('div','annotation-tools'),edit=el('button','quiet','修改'),remove=el('button','quiet','删除');edit.type=remove.type='button';edit.onclick=()=>editNote(anchor,card.getBoundingClientRect());remove.onclick=()=>deleteNote(anchor);quote.onclick=()=>{const target=anchor.block_id?blockNode(anchor.unit_id,anchor.option_id,anchor.block_id):unitNode({id:anchor.unit_id});target?.scrollIntoView({block:'center',behavior:'smooth'})};tools.append(edit,remove);card.append(tools);$('comments').append(card)}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>editNote({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>deleteNote({...anchor,unit_id:unit.id});tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
