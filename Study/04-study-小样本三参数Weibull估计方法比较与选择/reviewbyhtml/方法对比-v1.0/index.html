3e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c67f399b68fb5ad1d790c331137e39ce3a9c0b314e969380f7f330565547de96"}, {"id": "chapter-2", "title": "2　代表方法的性能差异", "mode": "content", "state": "modify", "selected": "gap-overview", "options": [{"id": "gap-overview", "label": "A　各条件下的整体差距", "blocks": [{"id": "preview", "kind": "image", "src": "assets/修订_整体差距百分比.png", "alt": "主体差距：直接读多出百分之多少", "markdown": "![主体差距：直接读多出百分之多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_整体差距百分比.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "global-insight", "kind": "text", "markdown": "较大的相对差距主要出现在形状参数估计上，尺度与位置的相对差距通常较小。七种方法在三个参数上的表现并不一致。\n\n*相对差距缩小，不等于各方法的绝对误差减小。*", "html": "\u003cp\u003e较大的相对差距主要出现在形状参数估计上，尺度与位置的相对差距通常较小。七种方法在三个参数上的表现并不一致。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e相对差距缩小，不等于各方法的绝对误差减小。\u003c/em\u003e\u003c/p\u003e", "hash": "f97dbc6283610c161d79ab202290233a8ac65e3d43bffd33c0356fdf205dd786"}, {"id": "report-7dd6a876cc3f", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：每格为七法RMSE中位数高于该条件最小值的百分比；三列共用色标。*", "hash": "f4f1559a8ee0cead835ba0fd00467e4917e8caf8ba1340ba1ba5be63efb0ac32"}]}], "content_hash": "63013f5814d018b3aaceafda3d4dc0b5d7a19caa3bd1d0bec3a310f06e8fb134"}, {"id": "chapter-3", "title": "3　性能差异的条件变化规律", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少时，各方法的误差总体增大，但增幅与相互关系并不一致。沿n和β观察，可以进一步区分这些变化发生在哪些条件下，以及误差以什么方式增加。\u003c/p\u003e", "hash": "741b2058c95702011cbe67b9fcc9e14143fb8eefcb9a82114a655d7316d07c42"}]}], "content_hash": "f78c4185c85f09d377c0e8a7dccea797c97790892a6484a7cd103bf6cdda50e7"}, {"id": "law-rmse", "title": "3.1　样本量变化与方法差距", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-481785e3f263", "kind": "text", "markdown": "样本量减少时，主图六种方法的误差总体增大，但增幅并不相同。低β区域的形状误差差距更容易拉开；高β区域的尺度和位置误差也在增加，方法间的相对差距却未必同步扩大。\n\n样本量变化还会改变方法的相对表现。低β下的形状优势不能直接沿用到高β，同一β下的排序也可能随n改变。方法差距随条件重新形成，并非将原有差距按同一比例放大。\n\nMM在部分条件下的形状RMSE出现明显尖峰，其变化需要与极端输出的影响分开理解。", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px\"\u003e\u003cdiv style=\"padding-right:16px;border-right:1px solid #dce3dd\"\u003e\u003cp style=\"font-size:13px;color:#65736a\"\u003e\u003cstrong\u003e修改前\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e样本量减少时，主图六种方法的误差总体增大，但增幅并不相同。低β区域的形状误差差距更容易拉开；高β区域的尺度和位置误差也在增加，方法间的相对差距却未必同步扩大。\u003c/p\u003e\n\u003cp\u003e样本量变化还会改变方法的相对表现。低β下的形状优势不能直接沿用到高β，同一β下的排序也可能随n改变。方法差距随条件重新形成，并非将原有差距按同一比例放大。\u003c/p\u003e\n\u003cp\u003eMM在部分条件下的形状RMSE出现明显尖峰，其变化需要与极端输出的影响分开理解。\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"font-size:13px;color:#286442\"\u003e\u003cstrong\u003e修改后\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e随着样本量减小，各方法的估计误差总体增大，但\u003cmark\u003e误差增长的趋势并不一致\u003c/mark\u003e。在相同β下，\u003cmark\u003e不同方法的误差增幅不同\u003c/mark\u003e；β改变后，\u003cmark\u003e同一种方法随样本量减少而产生的误差增幅也会改变\u003c/mark\u003e。\u003c/p\u003e\u003cp\u003e方法之间的相对差距也随之变化：部分条件下差距扩大，另一些条件下差距缩小，最低RMSE对应的方法也可能改变。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e", "manuscript_html": "\u003cp\u003e随着样本量减小，各方法的估计误差总体增大，但误差增长的趋势并不一致。在相同β下，不同方法的误差增幅不同；β改变后，同一种方法随样本量减少而产生的误差增幅也会改变。\u003c/p\u003e\u003cp\u003e方法之间的相对差距也随之变化：部分条件下差距扩大，另一些条件下差距缩小，最低RMSE对应的方法也可能改变。\u003c/p\u003e", "before_html": "\u003cp\u003e样本量减少时，主图六种方法的误差总体增大，但增幅并不相同。低β区域的形状误差差距更容易拉开；高β区域的尺度和位置误差也在增加，方法间的相对差距却未必同步扩大。\u003c/p\u003e\n\u003cp\u003e样本量变化还会改变方法的相对表现。低β下的形状优势不能直接沿用到高β，同一β下的排序也可能随n改变。方法差距随条件重新形成，并非将原有差距按同一比例放大。\u003c/p\u003e\n\u003cp\u003eMM在部分条件下的形状RMSE出现明显尖峰，其变化需要与极端输出的影响分开理解。\u003c/p\u003e", "hash": "3849d7104d6139332e0c78edd5c930783c511698a5b7abe2a547e7f84b27e87d"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003csmall\u003e相对差距按第2章口径核对，扩大或缩小指n=50与7两个端点的比较，不表示中间n单调变化。\u003c/small\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "498e1411e580ff16dbd40e1642d458c57e0e0ff19c8e80d607dc8d34a24dc474"}]}], "content_hash": "8017b036555942bcfc27a0d8d7a7c38944c957df2478171a04899a40d688e9a2"}, {"id": "law-distribution", "title": "3.2　偏移、波动与分布分化", "mode": "content", "state": "modify", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-521def6b8c6a", "kind": "text", "markdown": "随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。估计结果的变化既体现在误差幅度上，也体现在分布形态上。\n\n与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。\n\nβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。均值没有呈现出两组估计结果的分化。", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px\"\u003e\u003cdiv style=\"padding-right:16px;border-right:1px solid #dce3dd\"\u003e\u003cp style=\"font-size:13px;color:#65736a\"\u003e\u003cstrong\u003e修改前\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。估计结果的变化既体现在误差幅度上，也体现在分布形态上。\u003c/p\u003e\n\u003cp\u003e与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。\u003c/p\u003e\n\u003cp\u003eβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。均值没有呈现出两组估计结果的分化。\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"font-size:13px;color:#286442\"\u003e\u003cstrong\u003e修改后\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e低β下，LSE、LRE随样本减少主要表现为形状估计变散；随β增大，尺度估计逐渐分成两组，n=7时分离更加明显。与此同时，MDM、WMLE和K–R表现出位置偏高、尺度偏低的组合，并伴有形状低估。\u003cmark\u003e进入高β区域后，方法之间的差异进一步表现为不同的失准方式。\u003c/mark\u003e\u003c/p\u003e\u003cp\u003e其中，β=5、n=50时，LSE、LRE的尺度估计均值仍接近真值，但两个峰已经分离。均值没有反映出两组结果的差别。\u003c/p\u003e\u003cp\u003eWMLE呈现另一种变化：β=5、n从10减到7时，形状估计的SD下降，负偏差加重，RMSE继续上升。误差增长并非都由结果变散引起，系统偏移也可能加重。分布分化与系统偏移，使精度下降具有不同的表现。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e", "manuscript_html": "\u003cp\u003e低β下，LSE、LRE随样本减少主要表现为形状估计变散；随β增大，尺度估计逐渐分成两组，n=7时分离更加明显。与此同时，MDM、WMLE和K–R表现出位置偏高、尺度偏低的组合，并伴有形状低估。进入高β区域后，方法之间的差异进一步表现为不同的失准方式。\u003c/p\u003e\u003cp\u003e其中，β=5、n=50时，LSE、LRE的尺度估计均值仍接近真值，但两个峰已经分离。均值没有反映出两组结果的差别。\u003c/p\u003e\u003cp\u003eWMLE呈现另一种变化：β=5、n从10减到7时，形状估计的SD下降，负偏差加重，RMSE继续上升。误差增长并非都由结果变散引起，系统偏移也可能加重。分布分化与系统偏移，使精度下降具有不同的表现。\u003c/p\u003e", "before_html": "\u003cp\u003e随β增大，LSE和LRE的尺度估计分布逐渐呈现双峰；n=7时，高β下两个峰的分离更明显。估计结果的变化既体现在误差幅度上，也体现在分布形态上。\u003c/p\u003e\n\u003cp\u003e与此同时，MDM、WMLE和K–R的位置估计逐渐向偏大方向移动，尺度估计向偏小方向移动；小样本下这种偏移更突出。\u003c/p\u003e\n\u003cp\u003eβ=5、n=50时，LSE和LRE的尺度估计均值仍接近真值，但两个峰已明显分离。均值没有呈现出两组估计结果的分化。\u003c/p\u003e", "hash": "fafa62c72d32a61e5af23f0ab59e81e1b7f30c314986f5624079187b8a5a07cf"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "wmle-bias-sd-evidence", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003en\u003c/th\u003e\u003cth\u003e形状Bias\u003c/th\u003e\u003cth\u003e形状SD\u003c/th\u003e\u003cth\u003e形状RMSE\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e10\u003c/td\u003e\u003ctd\u003e-2.263\u003c/td\u003e\u003ctd\u003e0.982\u003c/td\u003e\u003ctd\u003e2.466\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e-2.614\u003c/td\u003e\u003ctd\u003e0.713\u003c/td\u003e\u003ctd\u003e2.710\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "82a1d78972b9e6c43540035d533a6e54fe8d219bfa79e588cf66a9293832234e"}, {"id": "wmle-bias-sd-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e表：WMLE，β=5；七法共同有效结果，Bias保留符号。自身有效结果也支持SD下降、负偏差加重和RMSE上升的方向。\u003c/em\u003e\u003c/p\u003e", "hash": "dee7e073e9dede1d3f597ad93e91c5dd234e5417a587b5e6205b24e56092b9e2"}]}], "content_hash": "22f80328bf749d31e64f4c8acb70f06f22d6f18035faacb5de990c5604d9b654"}, {"id": "law-synthesis", "title": "3.3　主要性能规律", "mode": "content", "state": "modify", "selected": "synthesis-phenomena", "options": [{"id": "synthesis-phenomena", "label": "B　围绕误差增长的不同表现归纳", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px\"\u003e\u003cdiv style=\"padding-right:16px;border-right:1px solid #dce3dd\"\u003e\u003cp style=\"font-size:13px;color:#65736a\"\u003e\u003cstrong\u003e修改前\u003c/strong\u003e\u003c/p\u003e\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本减少时，方法间相对差距的变化方向取决于形状区域。\u003c/strong\u003e从n=50到7，β=1.5—3时，三个参数的整体相对差距均扩大；β=4.5、5时，三个参数的整体相对差距反而缩小。因此，样本减少对方法差距的影响具有条件性，扩大与收缩会出现在不同区域。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本量减少时，RMSE最低的方法可能发生变化。\u003c/strong\u003eβ=3、3.5时，MDM在五档n下的三参数RMSE均为最低。β=4.5、5时，形状RMSE最低的方法则随n减少，由WMLE转为MDM，再转为K–R。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e估计分布呈现波动扩大、结果分化和系统偏移。\u003c/strong\u003eLSE、LRE在低β下随样本减少表现为形状波动扩大，在高β下表现为尺度结果分化；MDM、WMLE和K–R在高β下呈现位置偏高、尺度偏低的组合。\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\u003c/div\u003e\u003cdiv\u003e\u003cp style=\"font-size:13px;color:#286442\"\u003e\u003cstrong\u003e修改后\u003c/strong\u003e\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e\u003cmark\u003e样本减少引起的方法关系变化，随形状条件而不同。\u003c/mark\u003e\u003c/strong\u003e本轮两个样本量端点的比较中，低β下整体相对差距扩大，高β下则缩小；部分条件下的最低RMSE方法也随样本量改变。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e\u003cmark\u003e高β下，不同方法呈现不同的失准表现。\u003c/mark\u003e\u003c/strong\u003e一些方法出现结果分化，另一些表现为系统偏移；均值接近真值或分布更集中，都可能掩盖估计结果的问题。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e此外，MM在部分条件下的形状RMSE由少数极端输出主导，其评价影响在后面的风险分析中展开。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e", "manuscript_html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本减少引起的方法关系变化，随形状条件而不同。\u003c/strong\u003e本轮两个样本量端点的比较中，低β下整体相对差距扩大，高β下则缩小；部分条件下的最低RMSE方法也随样本量改变。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e高β下，不同方法呈现不同的失准表现。\u003c/strong\u003e一些方法出现结果分化，另一些表现为系统偏移；均值接近真值或分布更集中，都可能掩盖估计结果的问题。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e此外，MM在部分条件下的形状RMSE由少数极端输出主导，其评价影响在后面的风险分析中展开。\u003c/p\u003e", "before_html": "\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本减少时，方法间相对差距的变化方向取决于形状区域。\u003c/strong\u003e从n=50到7，β=1.5—3时，三个参数的整体相对差距均扩大；β=4.5、5时，三个参数的整体相对差距反而缩小。因此，样本减少对方法差距的影响具有条件性，扩大与收缩会出现在不同区域。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本量减少时，RMSE最低的方法可能发生变化。\u003c/strong\u003eβ=3、3.5时，MDM在五档n下的三参数RMSE均为最低。β=4.5、5时，形状RMSE最低的方法则随n减少，由WMLE转为MDM，再转为K–R。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e估计分布呈现波动扩大、结果分化和系统偏移。\u003c/strong\u003eLSE、LRE在低β下随样本减少表现为形状波动扩大，在高β下表现为尺度结果分化；MDM、WMLE和K–R在高β下呈现位置偏高、尺度偏低的组合。\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e", "hash": "782e44f61f88564e605ea4c9760d41cf8f21e0f6a19952d44b13efd9710af9e2"}]}], "selection_mode": "multiple", "selected_ids": ["synthesis-phenomena"], "content_hash": "a78982e0e34c014bd9d32fb44d890097a9216ff620ba6fd465f65881983e62e7"}, {"id": "chapter-4", "title": "4　典型性能现象的机制解释", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-opening", "kind": "text", "html": "\u003cp\u003e前面的差异与各方法处理未知位置、恢复形状和尺度的方式有关。以下结合原样本诊断与具体构造，解释其中的代表性现象。\u003c/p\u003e", "hash": "138eeb6d968def9215bca8079d7101249e95d8e1d2270b07a1e592109f6013d7"}]}], "content_hash": "e053c892dd880c3f38ee786f3eb801e42e1051816b8119f0f9b5ec56549badab"}, {"id": "mechanism-n", "title": "4.1　位置估计参与形状波动的放大", "mode": "content", "state": "open", "selected": null, "options": [{"id": "mechanism-n-current", "label": "当前内容", "blocks": [{"id": "sample-effect-observation", "kind": "text", "markdown": "针对低β下LSE、LRE随样本减少而增大的形状波动，对原样本进行固定位置诊断：保留同一批观测、绘图分数和回归方向，仅将位置设为真实γ，比较形状估计的变化。", "html": "\u003cp\u003e针对低β下LSE、LRE随样本减少而增大的形状波动，对原样本进行固定位置诊断：保留同一批观测、绘图分数和回归方向，仅将位置设为真实γ，比较形状估计的变化。\u003c/p\u003e", "hash": "17749ff03a2e8727199bfa381a8064dde62e692c8284d7293cd62f75ce6c1999"}, {"id": "location-diagnostic", "kind": "image", "src": "assets/样本量变化_定位影响诊断_β1.5.png", "alt": "β=1.5时五档样本量下LSE与LRE的定位影响诊断", "markdown": "![五档n下的形状估计：原位置估计与固定真实位置诊断](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/样本量变化_定位影响诊断_β1.5.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "sample-effect-mechanism", "kind": "text", "markdown": "LSE和LRE都利用ln(t−γ)构造概率图。位置的改变对各观测的影响并不相同，靠近样本最小值的观测变化更大，因而会改变对数间距与回归斜率，进一步传递到形状估计。\n\n在同一批样本中固定真实位置后，形状估计分布有所收窄，样本量较小时差别更明显。固定位置后仍存在随n减小而增大的波动，说明原始抽样波动与位置估计带来的额外变化同时参与了误差增长。", "html": "\u003cp\u003eLSE和LRE都利用ln(t−γ)构造概率图。位置的改变对各观测的影响并不相同，靠近样本最小值的观测变化更大，因而会改变对数间距与回归斜率，进一步传递到形状估计。\u003c/p\u003e\n\u003cp\u003e在同一批样本中固定真实位置后，形状估计分布有所收窄，样本量较小时差别更明显。固定位置后仍存在随n减小而增大的波动，说明原始抽样波动与位置估计带来的额外变化同时参与了误差增长。\u003c/p\u003e", "hash": "85f1ab67e2daab88494d6b501b9a22bab7986203a8320916f4db047935c663a0"}, {"id": "sample-effect-caption", "kind": "text", "markdown": "*图注：β=1.5，η=1000，γ=500。蓝色为原方法，橙色仅将位置固定为真实γ，使用同一批1200组样本。点和线为中位数及四分位区间；密度宽度分别归一化。显示窗口为β̂/β∈[0,4]，全部有效值仍参与统计。固定真位置仅用于诊断定位影响。*", "html": "\u003cp\u003e\u003cem\u003e图注：β=1.5，η=1000，γ=500。蓝色为原方法，橙色仅将位置固定为真实γ，使用同一批1200组样本。点和线为中位数及四分位区间；密度宽度分别归一化。显示窗口为β̂/β∈[0,4]，全部有效值仍参与统计。固定真位置仅用于诊断定位影响。\u003c/em\u003e\u003c/p\u003e", "hash": "967722856d429b9cb7403caf5ed808dcc28cd068f30cd99ae9cf0b63af00eff0"}]}], "content_hash": "7a1d4714d5ada99825b9ce2bf84772ad3893062d05ecdb0331aa1a921e166342"}, {"id": "mechanism-high-beta", "title": "4.2　样本最小值与K–R的位置偏移", "mode": "content", "state": "modify", "selected": "mechanism-minimum", "options": [{"id": "mechanism-minimum", "label": "B　K–R：最小值定位带来的系统偏移", "blocks": [{"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "kr-minimum-theory", "kind": "text", "markdown": "K–R直接以样本最小值估计位置参数。样本最小值通常高于真实起点；在本轮β范围内，n减小或β增大，二者的期望距离增大，位置正偏差随之加重。本轮40个条件中，K–R的位置估计均等于样本最小值，经验偏差与最小值分布给出的理论趋势一致。", "html": "\u003cp\u003eK–R直接以样本最小值估计位置参数。样本最小值通常高于真实起点；在本轮β范围内，n减小或β增大，二者的期望距离增大，位置正偏差随之加重。本轮40个条件中，K–R的位置估计均等于样本最小值，经验偏差与最小值分布给出的理论趋势一致。\u003c/p\u003e", "hash": "357b3f3c4587192df34f942b06c91b6295f30b11cdae1aeb29c05f06eeabad45"}, {"id": "kr-theoretical-bias", "kind": "text", "html": "\u003cp\u003e位置偏差的理论期望为\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmi mathvariant=\"normal\"\u003eΓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmsup\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e", "hash": "4a1aaa13424988f8654f42747427f8dee862dee8e1b14d14864f85204e20841c"}, {"id": "kr-bias-interpretation", "kind": "text", "markdown": "这个定位规则直接将样本最小值与真实起点之间的距离带入位置估计。β较大时，最小值靠近真实起点的速度较慢，因此即使增加样本，位置正偏差仍可能较明显。位置偏高又会改变用于恢复形状和尺度的剩余距离。\n\nLSE、LRE的双峰与K–R的系统偏差具有不同的形成路径：前者涉及样本间的边界与内部选解，后者由最小值定位直接带入。它们共同表明，参数估计的偏移和分化需要结合具体的位置处理规则理解。", "html": "\u003cp\u003e这个定位规则直接将样本最小值与真实起点之间的距离带入位置估计。β较大时，最小值靠近真实起点的速度较慢，因此即使增加样本，位置正偏差仍可能较明显。位置偏高又会改变用于恢复形状和尺度的剩余距离。\u003c/p\u003e", "hash": "2c10f6506dbaa2533b78fa65dafac41a966efb54f666f6bac61131b5a2e85677"}, {"id": "kr-image-source", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e图为Research00的起点信息示意，参数条件与本轮统计分开；公式适用于独立完整Weibull样本，本轮40条件已核对定位规则及经验趋势。\u003c/small\u003e\u003c/p\u003e", "hash": "6523f5c09af2e73ac3332cbbd432d6567aaa4a5e502932cf952e9ec4dc6a7844"}]}], "content_hash": "5559141662f298c0f453137e176bfff28e61d6e08b18d2990f9f5a8b2df79d2c"}, {"id": "mechanism-boundary", "title": "4.3　LSE与LRE的边界选解及参数补偿", "mode": "content", "state": "converged", "selected": "mechanism-boundary", "options": [{"id": "mechanism-boundary", "label": "A　LSE与LRE：共同定位准则与边界选解", "blocks": [{"id": "boundary-objective", "kind": "text", "markdown": "LSE最大化F比，LRE最大化相关系数；两种定位准则在数学上均随概率图相关性增大而增大，因此都倾向选择使概率图接近线性的位置。对部分样本，非负位置范围内的最优解位于γ=0；其他样本选择内部位置，两类位置结果对应不同尺度区间。\n\n随β增大，零边界对应的高尺度结果更集中，内部解对应的尺度向低值移动，两组分离形成双峰。β较小时，两组分布仍有较多重叠，存在零边界结果也未必呈现双峰。", "html": "\u003cp\u003eLSE最大化F比，LRE最大化相关系数；两种定位准则在数学上均随概率图相关性增大而增大，因此都倾向选择使概率图接近线性的位置。对部分样本，非负位置范围内的最优解位于γ=0；其他样本选择内部位置，两类位置结果对应不同尺度区间。\u003c/p\u003e\n\u003cp\u003e随β增大，零边界对应的高尺度结果更集中，内部解对应的尺度向低值移动，两组分离形成双峰。β较小时，两组分布仍有较多重叠，存在零边界结果也未必呈现双峰。\u003c/p\u003e", "hash": "68c0a318964ad83fb66b6ecda0d103ce70e834edcc76cb7fa1dda2fa2826556b"}, {"id": "boundary-profiles", "kind": "gallery", "aspect_ratio": 1.5, "images": [{"id": "n-50", "label": "β = 5，n = 50", "src": "assets/尺度双峰_边界与参数补偿_n50.png", "alt": "β=5、n=50，LSE与LRE的位置尺度配对及位置准则廓线"}, {"id": "n-7", "label": "β = 5，n = 7", "src": "assets/尺度双峰_边界与参数补偿_n7.png", "alt": "β=5、n=7，LSE与LRE的位置尺度配对及位置准则廓线"}], "markdown": "#### β = 5，n = 50\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n50.png)\n\n#### β = 5，n = 7\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n7.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "boundary-caption", "kind": "text", "markdown": "*图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。*", "html": "\u003cp\u003e\u003cem\u003e图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。\u003c/em\u003e\u003c/p\u003e", "hash": "edceb5fee3de3d22242ad7b3fd546d21efec9c3c848d7331cf933dbd32aa0a1f"}, {"id": "boundary-verification", "kind": "text", "markdown": "在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。", "html": "\u003cp\u003e在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。\u003c/p\u003e", "hash": "6f43ffe6994120aaba14388bd7507fc803b9a7c8e8989c5ae8b7489f081bfe44"}, {"id": "local-combinations", "kind": "text", "markdown": "在分布中部作近似展开，高β时的寿命水平主要受γ+η控制，离散程度与η/β有关。不同的三参数组合可以保持相近的局部分布，位置、尺度与形状因而存在相互补偿。", "html": "\u003cp\u003e在分布中部作近似展开，高β时的寿命水平主要受γ+η控制，离散程度与η/β有关。不同的三参数组合可以保持相近的局部分布，位置、尺度与形状因而存在相互补偿。\u003c/p\u003e", "hash": "c79924bd6c8d5f98d69f2e372b1f291fa103b401874ef75756e5d4c25600c6dd"}, {"id": "compensated-life", "kind": "text", "markdown": "上排的估计点主要沿η+γ近似不变的方向分布。γ取零的一组对应较大的η，γ偏大的一组对应较小的η，两类解保持了相近的寿命水平。η+γ恰好是63.2%失效分位寿命；在图示β=5、n=50和7条件下，该组合量的误差小于两个参数各自的误差。这也解释了参数估计分化与部分寿命指标相对稳定可以同时出现。", "html": "\u003cp\u003e上排的估计点主要沿η+γ近似不变的方向分布。γ取零的一组对应较大的η，γ偏大的一组对应较小的η，两类解保持了相近的寿命水平。η+γ恰好是63.2%失效分位寿命；在图示β=5、n=50和7条件下，该组合量的误差小于两个参数各自的误差。这也解释了参数估计分化与部分寿命指标相对稳定可以同时出现。\u003c/p\u003e", "hash": "0952ca373d6810259c859db7b429302df413d2ae14d8eed88b16d5420df7a57b"}]}], "content_hash": "8798ca9596a4e666bb695f0c21d616d3b4c8770e5f33ec760ac9cf920f474d11"}, {"id": "chapter-5", "title": "5　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "5.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "markdown": "RMSE同时受到多数估计结果与少数极端值的影响。MM在部分条件下的形状RMSE尖峰由极少数极端输出主导，不能将其理解为每份样本都产生相同程度的误差。\n\n异常还可能具有明确方向。β=5、n=7时，MDM和WMLE所记录的形状异常均为低估，与前述系统偏移相联系。", "html": "\u003cp\u003eRMSE同时受到多数估计结果与少数极端值的影响。MM在部分条件下的形状RMSE尖峰由极少数极端输出主导，不能将其理解为每份样本都产生相同程度的误差。\u003c/p\u003e\n\u003cp\u003e异常还可能具有明确方向。β=5、n=7时，MDM和WMLE所记录的形状异常均为低估，与前述系统偏移相联系。\u003c/p\u003e", "hash": "84776269d6ee3d040c8a296ed40e1f91c938ede859dba363ca17e5d5c60c9101"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-insight", "kind": "text", "markdown": "不同方法的异常风险区域并不相同。MDM、LSE、LRE和WMLE在小n、高β条件下较为突出，MLE在低β、小n条件下也出现较高异常率。异常的发生频率与其对平方误差的影响，需要分别观察。", "html": "\u003cp\u003e不同方法的异常风险区域并不相同。MDM、LSE、LRE和WMLE在小n、高β条件下较为突出，MLE在低β、小n条件下也出现较高异常率。异常的发生频率与其对平方误差的影响，需要分别观察。\u003c/p\u003e", "hash": "1c907b573e22d23fd07f57ec1f01c6f8691ceaf36155aa81f7127472a46b8428"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "e3fd2ef8f7aafb49100bbc3f051eb7df131fbef02e3c5c82591f1d6d092ce4ec"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。*", "hash": "4a575a1f296bb18010f5b66810f9e25ffe1e2154df18b3c34a7ed1d43ee1c84f"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "d29603d3e45260375f94fea91e5c741a6fcfa6c8e481f87a5c66db8e7a50b9b9"}, {"id": "evaluation-target", "title": "5.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "6　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}], "last_applied_submission_id": "eecc001e-c0e3-4a42-ab70-ab8608f29984", "last_rendered_submission_id": "eecc001e-c0e3-4a42-ab70-ab8608f29984", "outline_confirmed": true, "review_complete": false, "review_runtime": "0.6.0", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parameters": ["beta", "eta", "gamma"], "subsets": ["own", "common"]}, "shape_winner_transition": {"beta": [4.5, 5], "n": [50, 20, 15, 10, 7], "winners": ["WMLE", "WMLE", "WMLE", "MDM-0.1", "MMLE(KR)"], "subsets": ["own", "common"]}, "gap_checked_regions": {"expanded_beta": [1.5, 2, 2.5, 3], "contracted_beta": [4.5, 5], "n": [50, 7], "parameters": ["beta", "eta", "gamma"]}}, "before_after_review": {"base_commit": "28494a2d", "base_revision": 9, "changed_units": ["law-rmse", "law-distribution", "law-synthesis"], "review_focus": "条件变化怎样重组方法关系；高β下不同失准表现"}, "chapter3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "checked_subsets": ["own", "common"]}, "manuscript_version": "1.1", "archive_targets": {"output": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v1.1.md", "previous": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v1.0.md", "archive": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/其他/历史版本/报告下（方法对比）-v1.0.md", "sync_remote": true}}</script>

function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return deleteNote(pending);if(structuredNote(pending)){storeNote(pending,comment);draft.submission_id=null;closeEditor(false);persist();renderComments();return true}const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;$('delete-note').onclick=()=>deleteNote(pending);
function editorKeydown(event){if(event.isComposing||event.keyCode===229)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!saveNote())$('editor-input').focus();updateOutlineStatus()}if(event.key==='Escape')closeEditor()}
$('editor-input').addEventListener('keydown',editorKeydown);
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function sidebarNote(anchor,comment){const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',comment));const tools=el('div','annotation-tools'),edit=el('button','quiet','修改'),remove=el('button','quiet','删除');edit.type=remove.type='button';edit.onclick=()=>editNote(anchor,card.getBoundingClientRect());remove.onclick=()=>deleteNote(anchor);quote.onclick=()=>{const target=anchor.block_id?blockNode(anchor.unit_id,anchor.option_id,anchor.block_id):unitNode({id:anchor.unit_id});target?.scrollIntoView({block:'center',behavior:'smooth'})};tools.append(edit,remove);card.append(tools);$('comments').append(card)}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>editNote({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>deleteNote({...anchor,unit_id:unit.id});tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive'){const targets=board.archive_targets;if(targets){const lines=[`保存新版：${targets.output}`];if(targets.previous)lines.push(`归档旧稿：${targets.previous} → ${targets.archive}`);lines.push(`更新引用，保留审阅记录，提交Git${targets.sync_remote?'并同步远端':''}。`);return lines.join('\n')}return board.archive_plan?.trim()||`《${board.title}》尚未填写成果保存路径及旧版去向。`}
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
