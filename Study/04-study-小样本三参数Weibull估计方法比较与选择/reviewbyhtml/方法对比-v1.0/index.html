body\u003e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "6d5350c93e333a9ba1297f335eb302486985a6a88291f5357eadc7e8ba0d5522"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c04af74e96d78be8fea913b5e346dda67640a886bcd904de59f8cc961ce976d7"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　样本量减小下的不同表现", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "n-comparison-purpose", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e展示目的：\u003c/strong\u003e按 β 分层，在固定形状条件下考察样本量减少带来的误差变化；再比较这一现象在不同形状条件下的共性与差异。\u003c/p\u003e", "hash": "3f65e4be87a8b9e5e93a4a6c0cb53c2a3dd022aba8616307a8c29ea61fad89a4"}, {"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e在本次考察范围内，样本量减少时估计误差总体增大，但增长幅度因方法而异。有的方法对样本量减少较敏感，误差上升较快；有的方法增幅相对较小。\u003c/p\u003e", "hash": "61c589cdf457575987704a041a68e0bd5c91a8e89fb52c17d1312d33fc7cbabb"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_按形状分层轨迹.png", "alt": "按形状条件分层的六法两两RMSE差距随样本量减少的变化，两行三列", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两行分别为β=1.5、5的固定形状条件，三列分别对应形状、尺度、位置参数。横轴按n=50→20→15→10→7排列；同一参数两行共用纵轴。图中展示MDM、LSE、LRE、WMLE、MLE、MMLE六法的全部15个方法对，MM在玫瑰图中另列。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e差距为两种方法标准化RMSE之差的绝对值，表示相隔多远；各法误差水平结合前面的玫瑰图观察。仍使用七法共同有效样本；形状RMSE除以真β，尺度和位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "0d73b47c73155de3ee941c0e19c61634c31bf27e6a4cce391d59629a6f449891"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003e不同方法的误差增长并不同步，方法间的精度差距也随样本量改变：一些方法对的差距扩大，另一些逐渐接近，部分还出现转折。误差总体增大，并不意味着方法间的差距始终扩大。\u003c/p\u003e\u003cp\u003e这种方法间的性能差异及其随样本量变化的关系，也会随形状条件改变。各方法对样本量减少的敏感程度需要在固定形状条件下比较，并结合不同分层考察其共性与差异。\u003c/p\u003e", "hash": "acde5d51a4d1cb251d2c9b51cdee0a5681a75377f03ed5b2a7680a0101ced569"}]}], "selected_ids": [], "content_hash": "3509d636bc729c7d219f5d20c3b2b1a2f1ec28a35c741df00219b09694e31e60"}, {"id": "law-distribution", "title": "2.2　形状参数增大时的估计分布变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003eβ=1.5时，两档n下多数方法的主体分布形态相近。n=7的估计结果通常更分散，LSE、LRE的位置估计还出现了零边界结果。\u003c/p\u003e\u003cp\u003e固定n，β从1.5增至5时，估计分布进一步变化。LSE、LRE的尺度和位置估计逐渐展宽，即使n=50，四分位区间也明显扩大。因此，分布展宽并不只出现在极小样本条件。\u003c/p\u003e\u003cp\u003eMDM、WMLE和MMLE则表现出有规律的参数偏移：形状估计的增幅落后于真β，低估加重；尺度估计向低值偏移，位置估计向高值偏移。两档n下均能观察到这一方向，n=7时偏移更明显。\u003c/p\u003e\u003cp\u003e随着β增大，LSE、LRE的位置估计还进一步向γ=0聚集；n=50时已可见，n=7时边界结果更多。\u003c/p\u003e", "hash": "0f90ce7cd26fca6ea3916268f94bd05d16da9de42a7c378933a4ef598d09c0e0"}]}], "selected_ids": [], "content_hash": "712deb08325fc44234cfe375e02b4c9097ea24154e952662c0aaef5ffd671c85"}, {"id": "law-anomalies", "title": "2.3　明显异常估计", "mode": "content", "state": "open", "selected": null, "options": [{"id": "anomaly-phenomena", "label": "当前内容", "blocks": [{"id": "anomaly-definition", "kind": "text", "html": "\u003cp\u003e估计分布中还存在明显偏离真值的结果。这里沿用Research00报告2的判据，将形状估计不超过真值的1/3，或达到真值的3倍，记为明显异常估计。\u003c/p\u003e", "hash": "f372b6a5c8cb851100d07140f84059003c7717e67ab60d544c3fa92341781c6b"}, {"id": "anomaly-current-example", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eβ=5、n=7，LSE\u003c/th\u003e\u003cth\u003e形状\u003c/th\u003e\u003cth\u003e尺度\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e真值\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e1000\u003c/td\u003e\u003ctd\u003e500\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第34组：接近真值的例子\u003c/td\u003e\u003ctd\u003e5.55\u003c/td\u003e\u003ctd\u003e836.77\u003c/td\u003e\u003ctd\u003e681.73\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第0组：明显低估的例子\u003c/td\u003e\u003ctd\u003e1.24\u003c/td\u003e\u003ctd\u003e282.98\u003c/td\u003e\u003ctd\u003e1205.95\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "31a87b871beeaf44c04d896b98837362c5c88db1aceb2c195e51c317aecf5602"}, {"id": "anomaly-example-observation", "kind": "text", "html": "\u003cp\u003e相同总体、相同样本量和相同方法，不同抽样仍可能得到相差很大的参数。异常例子中，形状和尺度明显偏低，位置则偏高；这种偏离已经超出估计结果在真值附近的小幅波动。\u003c/p\u003e\u003cp\u003e\u003cem\u003e两例来自本轮存档W(5,1000,500)、n=7，样本编号从0开始；仅用于展示，不代表其发生频率。\u003c/em\u003e\u003c/p\u003e", "hash": "620f59eeabff87bb2d1dc68f511b4cc2df411a41993242b5dc8e9d449c25e9bc"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-map-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：异常为β̂≤β/3或β̂≥3β；频率以各方法自身有效结果为分母，求解失败另行统计。\u003c/em\u003e\u003c/p\u003e", "hash": "0aca870dc3ca2fa57219d7b892c877dfc78d29902d2e135d0af43ccaa85fa667"}, {"id": "anomaly-n-observation", "kind": "text", "html": "\u003cp\u003e随着n减小，明显异常估计更常见。八档β下，七种方法在n=7时的异常频率都高于n=50。β=5时，异常频率在五档n上逐档上升。\u003c/p\u003e\u003cp\u003e异常增多的程度和方向存在方法差异：较大β、小n下，多种方法以形状低估为主；MLE在低β、小n下也有较高异常频率。它们不能由一种固定的异常模式概括。\u003c/p\u003e", "hash": "83dc6dbba57935dc99fef0b264e67cf62d4344e1b9ea7125c7a6438e28aa20d8"}]}], "selected_ids": [], "content_hash": "2b5755368d1a1980f086cd91a947af4a5042eda89039009c1b28ca16723f5fb8"}, {"id": "law-synthesis", "title": "2.4　主要现象", "mode": "content", "state": "open", "selected": null, "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，估计误差总体增大，但各方法的增幅不同。\u003c/strong\u003e固定β，部分方法对样本量减少更敏感，误差上升较快；部分方法增幅较小。因此，方法间的差距也随样本量改变，而非保持原有的精度关系。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e相同n下，β增大时，三个参数的估计呈现不同的偏移和分布变化。\u003c/strong\u003e部分方法的形状低估加重，并伴随尺度偏小、位置偏大；另一些方法的尺度和位置估计更分散，还出现边界聚集。β变化的影响不仅体现在误差大小，也体现在参数偏移的方向和估计分布的形态。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003en减小时，明显异常估计更常见。\u003c/strong\u003e这一变化在八档β、七种方法的n=50与7比较中均可见，但异常增多的程度及其偏移方向因方法和参数条件而异。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e", "hash": "5e18f4cdc8acf8ade4bd94d41173bb1c5d7e39ae27ebaabaa3fec93d0b43d3cb"}]}], "selection_mode": "single", "selected_ids": [], "content_hash": "d1daa03231d6a2cd8805ec7bfe9792e94c1e8d9aa6bcb641635c469ac450587e"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-chapter-opening", "kind": "text", "html": "\u003cp\u003e样本量和形状条件通过改变观测覆盖及样本间距，影响参数组合的区分与各方法的选择。下面先看同一条删点路径，再结合判据剖面和参数恢复，解释偏移、边界聚集及明显异常怎样形成。\u003c/p\u003e", "hash": "be81bcd1e5a74523f94e69f5d5b3fe19b8cd1f4de04abcd4303ab39a2fef95d4"}]}], "content_hash": "9f7942f6b61bb1dc922681416883d50be0e781d3434224655bf2b0fd56a48337"}, {"id": "mechanism-high-beta", "title": "3.1　样本减少与方法响应的差异", "mode": "content", "state": "modify", "selected": "n-criterion-paths", "options": [{"id": "n-criterion-paths", "label": "A｜直接看三种定位规则怎样响应删点", "blocks": [{"id": "n-a-opening", "kind": "text", "html": "\u003cp\u003e固定总体为W(5,1000,500)，沿用同一组50个观测的随机删点路径，依次保留20、15、10、7个观测。每一档都是前一档的子集；在每档样本上分别用MMLE、MDM和LSE估计，比较CDF拟合和三个参数偏离真值的程度，再沿定位判据与参数恢复过程解释端点变化。\u003c/p\u003e", "hash": "eb5a15e00ef8ff7e290894910e1bcbd5c68ef50370eb4117516f9d6b594bf486"}, {"id": "n-before-after", "kind": "gallery", "aspect_ratio": 1.6666666666666667, "images": [{"id": "n50", "label": "n = 50", "src": "assets/31_嵌套删点_样本474_n50.png", "alt": "同一嵌套删点路径n=50：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号偏差"}, {"id": "n20", "label": "n = 20", "src": "assets/31_嵌套删点_样本474_n20.png", "alt": "同一嵌套删点路径n=20：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号偏差"}, {"id": "n15", "label": "n = 15", "src": "assets/31_嵌套删点_样本474_n15.png", "alt": "同一嵌套删点路径n=15：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号偏差"}, {"id": "n10", "label": "n = 10", "src": "assets/31_嵌套删点_样本474_n10.png", "alt": "同一嵌套删点路径n=10：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号偏差"}, {"id": "n7", "label": "n = 7", "src": "assets/31_嵌套删点_样本474_n7.png", "alt": "同一嵌套删点路径n=7：上排MMLE、MDM、LSE各自的CDF，下排三参数的三法带符号偏差"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-before-after-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e同一路径的样本减少，在三种方法中引起不同的拟合与参数变化。按n=50→20→15→10→7切换；上排三列依次为MMLE、MDM、LSE，各列只画本法拟合CDF，并以灰色虚线对照真实CDF。黑点是本组寿命观测，纵坐标为按当前n计算的(i−0.5)/n，仅作概率图展示；底部短刻线保留实际寿命位置。下排三列依次为形状、尺度、位置的带符号偏差（估计值减真值），零线表示无偏离；这是单一样本的误差，不是重复抽样的平均Bias。各档CDF共用坐标，同一参数各档也共用纵轴范围。\u003c/em\u003e\u003c/p\u003e", "hash": "28bf77be57370d0e664c28eea8ff47e952c94ddf8dcf95ee331c13b154bb7c2d"}, {"id": "n-before-after-reading", "kind": "text", "html": "\u003cp\u003e这条删点路径的变化并非每一步都同向。从50点减到20点时，MDM的尺度、位置以及LSE的三个参数反而更接近真值；继续减少样本后，偏差又明显扩大。比较50点与7点两个端点，三法均表现为形状和尺度进一步偏低、位置进一步偏高，且参数移动幅度为LSE较大、MDM次之、MMLE较小。同一批观测的减少，经由不同估计规则产生了不同响应；单条路径不支持“每删一点误差必然增加”的判断。\u003c/p\u003e", "hash": "9aaec246bb3f7efc8d4572681bba350b26a635dd2dfb96a98d1f37d0b4851c10"}, {"id": "n-why-intro", "kind": "text", "html": "\u003cp\u003e三种方法采用不同的定位依据：MMLE直接取最小观测；MDM寻找伪尺度最小标准差的梯度达到固定阈值的位置；LSE寻找对数距离与参考坐标线性匹配最好的位置。下图分别标出最小值、阈值交点和匹配误差最低点。\u003c/p\u003e", "hash": "e7449f8c15e06448c4540d9ca67c69f4e69a4fe18a95bbba9bc494edf3012ff1"}, {"id": "n-a-criteria", "kind": "image", "src": "assets/31A_固定形状定位判据_样本474.png", "alt": "同一路径在n=50、20、7时，最小值、MDM梯度交点与LSE线性匹配最低点的变化", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-a-reading", "kind": "text", "html": "\u003cp\u003e删点后，最小观测增大，MMLE的位置估计直接随之右移。MDM的梯度曲线和LSE的匹配误差曲线也发生改变，两者选择的位置都向右移动，且超过MMLE的位置移动幅度。MDM、LSE使用整个观测点列构造判据，因此它们的定位变化还取决于删点后点列的间距与匹配关系。\u003c/p\u003e", "hash": "b3e73105d50063c124549ca471dbd6a858945434c3ade4f62ae0da61387b3258"}, {"id": "n-recovery-intro", "kind": "text", "html": "\u003cp\u003e位置确定后，还要看它如何进入形状和尺度的恢复。MDM在所选位置下寻找伪尺度标准差最小的形状，再取伪尺度均值恢复尺度；LSE在所选位置下回归对数距离，形状是斜率的倒数，尺度由截距指数恢复。\u003c/p\u003e", "hash": "292ec4818e1e64cfff2e9cb3d0d844a96ae5f9e460ecfe456c79d76278708efe"}, {"id": "n-parameter-recovery", "kind": "image", "src": "assets/31_参数恢复过程_样本474.png", "alt": "同一随机删点案例中MDM标准差最低点和LSE回归斜率的变化", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "n-recovery-reading", "kind": "text", "html": "\u003cp\u003e位置估计的右移进一步影响形状和尺度恢复。MDM的伪尺度标准差最低点向较低形状移动，随后由伪尺度均值恢复的尺度也降低。LSE中，较高的位置使下端观测到估计起点的距离缩短，对数距离的低端下降更多，回归线变陡；形状取斜率倒数，因而降低，截距降低则使恢复的尺度减小。\u003c/p\u003e\u003cp\u003e本例把误差增加落实到了具体计算过程：删点改变定位判据，位置变化再传递到形状和尺度恢复。不同方法对样本信息的使用方式不同，因此同一次样本减少引起的估计变化也不同。第二章的重复抽样结果给出整体表现，这里解释其中一条形成路径。\u003c/p\u003e\u003cp\u003e\u003cem\u003e蓝色为n=50，橙色为n=7；两图均在各方法实际选定的位置计算。MDM图聚焦标准差最低点区域；LSE图使用对应样本量的顺序统计量参考坐标。图中最低点、斜率和截距恢复的参数均已与前后估计核对。\u003c/em\u003e\u003c/p\u003e", "hash": "f5f13af4fb304217eaee9b8947cc4b792c7737a51e10a14977f9ca2086880dda"}, {"id": "n-a-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e沿用已计算的随机删点路径474，未预设保留最小观测。五档样本与估计均读取现有存档，不新增抽样或重跑估计。该例用于展示具体样本下的变化与计算步骤，不据此确定方法的总体精度排名；后两幅图继续解释n=50至7的端点变化，定位判据图保留n=20作中间参照。\u003c/em\u003e\u003c/p\u003e", "hash": "c183b8a4ce15ca0f9d19f115afd68d9bfb3e738a55127dc4c4028d71031c167b"}, {"id": "n-information-transition", "kind": "text", "html": "\u003cp\u003e样本减少也减少了区分参数组合的观测约束。当多组参数对保留观测的解释接近时，判据可能出现宽缓区域，所选参数便更易随样本间距变化而移动。下一节结合形状条件与判据剖面说明这一联系。\u003c/p\u003e", "hash": "ecad5949f5cbb5f91574a35b234870390619ad0a18a141a795fbd820b04723d1"}]}], "selected_ids": ["n-criterion-paths"], "content_hash": "d9d9b1f5919dcdd74f13cedeca098b5bda43d27f66b2453972149ffec732311f"}, {"id": "mechanism-n-background", "title": "3.2　形状条件下的参数区分与估计偏移", "mode": "content", "options": [{"id": "shape-common", "label": "共同内容", "blocks": [{"id": "shape-information-opening", "kind": "text", "html": "\u003ch4\u003e观测约束与参数相容\u003c/h4\u003e", "hash": "a3293b2174d5cd2fc54b297dbc0c88dacf422256597fcbaba0d80057a7b0752c"}, {"id": "origin-probability-figure", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：β=2与5、n=7/15/30时观测、最小观测及其与真实起点的距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003e相同n下，β=5时的最小观测比β=2时更远离真实起点；样本量减小时，这段距离进一步增大。观测集中于分布中部，起点附近缺少数据，位置参数需要从较远处外推。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图2：η=1000、γ=500，β=2、5，n=7、15、30。橙点为每组样本的最小观测，灰线为其到真实起点的距离；下排为最小观测的理论密度。\u003c/em\u003e\u003c/p\u003e", "hash": "a03c7b2d1e3ec5e05ea323044b412cc2034ddf5a62ffa9eef62ad7277416f3e2"}, {"id": "shape-compatible", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "Research00报告1：W(5,1000,500)与W(2,500,1000)在样本覆盖区间内接近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-compatible-reading", "kind": "text", "html": "\u003cp\u003e图中的两组参数虽然相差较大，在观测覆盖区间内的分布曲线仍较接近。位置、尺度和形状可以相互补偿，有限观测因而容许不同的参数组合。还需要沿各方法的判据，看它怎样区分这些组合并选出参数。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图3：β=5、n=7第31组样本；对照W(5,1000,500)与W(2,500,1000)。黑点累计概率由样本排序近似。\u003c/em\u003e\u003c/p\u003e", "hash": "c2b8071adf993df68dee96de63c402ac55090754078db34dd0321bb334e471d7"}, {"id": "shape-criterion-opening", "kind": "text", "html": "\u003ch4\u003e判据区分能力与优选位置\u003c/h4\u003e", "hash": "7234c2ec043641a64e9f6d397932e6e7fe5ea24cbec6ce809a085d46c974b739"}, {"id": "shape-lse-profile-family", "kind": "image", "src": "assets/R00_LSE_判据与参数条件.png", "alt": "报告1图6：β=2与5、n=7/15/30的LSE位置判据曲线，展示宽缓区与最低点分布", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-lse-profile-reading", "kind": "text", "html": "\u003cp\u003eLSE的图中，β=5时真位置附近多条曲线随候选位置变化较缓，最低点却分散在不同位置。观测较集中时，移动位置主要使对数点列近似整体平移或伸缩，线性匹配的评价改变较小；局部间距的波动便更容易改变优选位置。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图6：η=1000、γ=500；两列为β=2、5，三行为n=7、15、30。每条曲线对应一组样本，橙叉标记原返回位置，竖虚线标记真位置。\u003c/em\u003e\u003c/p\u003e", "hash": "c4a7783ab2612cc08d7e545678037d8090234ac13953834577a0b86e5cd0a38d"}, {"id": "shape-mle-flat-profile", "kind": "image", "src": "assets/R00_异常剖面_MLE_high.png", "alt": "报告2图15：正常与明显高估样本的MLE位置似然剖面、条件形状和样本距离", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "profile-flat-numbers", "kind": "text", "html": "\u003cp\u003e报告2的单样本把这种宽缓区显示得更直接：第36组的候选位置从0移至约251时，条件形状从23.54降至13.64，对数似然却只下降约0.012。\u003cmark\u003e参数组合已经明显改变，判据评价仍几乎相同；数据对这些组合的区分较弱。\u003c/mark\u003e图中的左端优选位置因此可以与很大的形状、尺度共同出现。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图15：W(2,100,500)、n=15，第35组为正常参照、第36组为高估样本。中列是在各候选位置重新优化得到的条件形状；数值由原图数据核对。\u003c/em\u003e\u003c/p\u003e", "hash": "de9ca258146f1e7af2be05bbe97afdfb023593c7686e393280519fae9f9e4d9a"}, {"id": "shape-selection-opening", "kind": "text", "html": "\u003ch4\u003e定位规则与参数传递\u003c/h4\u003e", "hash": "f74e0ebdf8e78ac1c6433da7228ed184af44260fbc6cdcc3adb9d6c6be26922c"}, {"id": "shape-a-opening", "kind": "text", "html": "\u003cp\u003eMDM按固定梯度阈值定位。高β时，各观测反算的伪尺度随位置变化更接近同步，标准差梯度较小，阈值交点向较高位置移动。位置提高后，小观测到起点的距离缩短比例更大，条件最优形状随之降低，再由伪尺度均值恢复出较小尺度。\u003c/p\u003e", "hash": "233f04f19088a201f5d2709f35427bada394582bb1ba89f329f5cc34feecc4d8"}, {"id": "shape-a-mdm", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00报告1：梯度阈值选中较高位置后，形状和尺度随之降低", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-mdm-reading", "kind": "text", "html": "\u003cp\u003e图中从梯度交点沿同一位置读取形状与尺度，位置偏高、形状和尺度偏低便连接为同一条计算路径。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告1图5：δ=0.1，β=2、5，n=7第48组配对样本。两列比较形状条件，三行依次为梯度、条件形状和伪尺度均值。\u003c/em\u003e\u003c/p\u003e", "hash": "ed088d8be93418dbc98599ece08a7df6d4494b7ec2b12a1a20231f1ad037e148"}, {"id": "shape-a-lse-zero", "kind": "image", "src": "assets/R00_报告2_LSE零边界.png", "alt": "Research00报告2：LSE左移位置改善线性匹配，最佳位置可落在零边界或内部", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "shape-a-boundary-reading", "kind": "text", "html": "\u003cp\u003eLSE的左侧优选位置则展示另一方向：左移位置压缩对数跨度，当这能改善线性匹配时，最低点会移向较低位置。橙色样本的最低点落在γ=0，紫色样本仍在内部；非负位置约束把一部分左侧偏移截在零点，形成边界聚集。对数跨度压缩又使回归斜率减小，取倒数后形状升高。报告2中的右侧样本沿相反方向传递：位置靠近最小观测，对数跨度拉大，形状和尺度降低。\u003c/p\u003e\u003cp\u003e\u003cem\u003e报告2图6：正常与零边界样本为W(2,100,500)、n=15第35、36组；内部左偏样本为W(2,1000,3000)、n=7第1组。右侧传递过程见报告2图7。\u003c/em\u003e\u003c/p\u003e", "hash": "7b79d04c1badb2927e58577da8daea083822b209ed40bf043aefb780cc96062b"}, {"id": "profile-method-comparison", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e选择或定位依据\u003c/th\u003e\u003cth\u003e参数怎样联动\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMMLE\u003c/td\u003e\u003ctd\u003e最小观测直接定位，再拟合保留距离\u003c/td\u003e\u003ctd\u003e位置变化改变距离；保留距离集中或分散，使形状似然峰及恢复尺度改变。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMDM\u003c/td\u003e\u003ctd\u003e梯度阈值交点定位\u003c/td\u003e\u003ctd\u003e所选位置改变伪尺度标准差最低点及其均值，带动形状和尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLSE、LRE\u003c/td\u003e\u003ctd\u003e选择线性匹配或相关性最好的位置\u003c/td\u003e\u003ctd\u003e对数跨度进入回归斜率；LSE取斜率倒数，LRE直接取斜率，再恢复尺度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWMLE\u003c/td\u003e\u003ctd\u003e两条加权方程的共同交点\u003c/td\u003e\u003ctd\u003e样本距离同时改变两条关系，交点给出位置与形状，尺度由加权关系恢复。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMLE\u003c/td\u003e\u003ctd\u003e比较不同参数组合的似然\u003c/td\u003e\u003ctd\u003e宽缓高似然区允许位置、形状和尺度相互补偿，优选组合可明显偏离真值。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "bf652402da62456a229e1654b2d7319a7eaf42636dc75a44e466f5fafffd6d08"}, {"id": "profile-summary-ending", "kind": "text", "html": "\u003cp\u003e\u003cmark\u003e观测约束、判据区分与参数恢复共同决定偏移：宽缓区使不同参数组合难以区分，极值或交点给出选择方向，参数恢复再把变化传到其余参数。\u003c/mark\u003e下端空缺、局部成簇或远端观测会进一步改变这些判据；同样的形成路径在部分样本上产生更大的偏移，表现为第二章的明显异常。\u003c/p\u003e\u003cp\u003e\u003cem\u003e本节复用Research00报告1、报告2的存档机制图，保留各图原条件和实现；不与Study04的1200次正式统计混合。六种方法的完整过程见报告1第2.1—2.6节与报告2第2.1节。\u003c/em\u003e\u003c/p\u003e", "hash": "a1588fee098a03484e3ae30ca95ba45a70f9ca2d6be876b9bd923b1527434af0"}]}], "content_hash": "6cf3d5696f3dba6f905e241c07dba30a920d13d1ad5435e2972daabf63344fea"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "html": "\u003cp\u003e异常发生的频率与其对总体误差的影响不同。RMSE对误差平方求平均，少数极端值可能主导结果。MM在部分条件下的形状RMSE尖峰由极少数极端输出造成，不能将其理解为多数样本都产生同样程度的误差。\u003c/p\u003e", "hash": "28964d96673ac0585d2554eea3ccd7fc96b076a455e27688e60fd595f291122b"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和MMLE的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "60e3a18b546fd1677a2d2f935ab3875baef2da72bea8ce5f454e020b14b56217"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：有效率的分母为全部1200次尝试，返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "hash": "be55b06082a2562e507bf531188001bc180eab2ddd533fbb60ea7c9a7878155b"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "1a161b266aac2eba5fcdeeb8bcd4972db1965ec18f91f900609e103c048f4784"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法  $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
</body>
