3e\u003ctr\u003e\u003ctd\u003e方法\u003c/td\u003e\u003ctd\u003eMDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数\u003c/td\u003e\u003ctd\u003eη=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e样本量\u003c/td\u003e\u003ctd\u003en=50、20、15、10、7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复抽样\u003c/td\u003e\u003ctd\u003e每个条件1200组；各方法使用相同样本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要观察\u003c/td\u003e\u003ctd\u003e参数RMSE、估计分布、明显异常与有效返回\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "markdown": "| 项目 | 本轮设置 |\r\n|---|---|\r\n| 方法 | MDM-0.1、LSE、LRE（Park）、WMLE、MLE、MMLE（K–R）、MM |\r\n| 参数 | η=1000、γ=500；β=1.5、2、2.5、3、3.5、4、4.5、5 |\r\n| 样本量 | n=50、20、15、10、7 |\r\n| 重复抽样 | 每个条件1200组；各方法使用相同样本 |\r\n| 主要观察 | 参数RMSE、估计分布、明显异常与有效返回 |", "hash": "8d8b00617894ebecb92357fb98a58d6dec1a1418662c12736123eedf07116385"}, {"id": "report-b109f0b05cd7", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见\u003ca href=\"file:///D:/weibull/Study/04-study-%E5%B0%8F%E6%A0%B7%E6%9C%AC%E4%B8%89%E5%8F%82%E6%95%B0Weibull%E4%BC%B0%E8%AE%A1%E6%96%B9%E6%B3%95%E6%AF%94%E8%BE%83%E4%B8%8E%E9%80%89%E6%8B%A9/%E5%AE%9E%E9%AA%8C%E8%AE%BE%E7%BD%AE.md\"\u003e实验设置\u003c/a\u003e。\u003c/em\u003e\u003c/p\u003e", "markdown": "*统计口径：精度图使用七法均有效的共同样本；分布图使用各法自身有效结果。形状RMSE除以真β，尺度和位置RMSE除以1000。方法与求解约定见[实验设置](实验设置.md)。*", "hash": "03bb60a6e5c0f664d3d4821c6043dc4bb97a3cc59d13656462ed6b4d5af912a8"}]}], "content_hash": "c67f399b68fb5ad1d790c331137e39ce3a9c0b314e969380f7f330565547de96"}, {"id": "chapter-3", "title": "2　估计性能的差异与变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-3-current", "label": "当前内容", "blocks": [{"id": "law-opening", "kind": "text", "html": "\u003cp\u003e样本量减少通常使估计误差增大，但性能变化并不限于误差数值。不同方法的响应方式，以及估计结果的分布结构，也会随样本量和形状条件改变。\u003c/p\u003e", "hash": "9e3c0c323879a592fdcc82ae3fd0c5d496a5a15f75c0b0880e54363912d2b827"}]}], "content_hash": "c2e4c1ea43429b02a8edc2622e73c20ab9462041116d4885a927dccd054bedc9"}, {"id": "law-rmse", "title": "2.1　误差水平与方法响应", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-rmse-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "n-50", "label": "n = 50", "src": "assets/RMSE玫瑰图_n50_八档β.png", "alt": "n=50，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-20", "label": "n = 20", "src": "assets/RMSE玫瑰图_n20_八档β.png", "alt": "n=20，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-15", "label": "n = 15", "src": "assets/RMSE玫瑰图_n15_八档β.png", "alt": "n=15，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-10", "label": "n = 10", "src": "assets/RMSE玫瑰图_n10_八档β.png", "alt": "n=10，β=1.5至5的八组RMSE玫瑰图与MM数值"}, {"id": "n-7", "label": "n = 7", "src": "assets/RMSE玫瑰图_n7_八档β.png", "alt": "n=7，β=1.5至5的八组RMSE玫瑰图与MM数值"}], "aspect_ratio": 1.411764705882353, "markdown": "#### n = 50\n\n![n=50，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n50_八档β.png)\n\n#### n = 20\n\n![n=20，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n20_八档β.png)\n\n#### n = 15\n\n![n=15，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n15_八档β.png)\n\n#### n = 10\n\n![n=10，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n10_八档β.png)\n\n#### n = 7\n\n![n=7，β=1.5至5的八组RMSE玫瑰图与MM数值](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/RMSE玫瑰图_n7_八档β.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-96bac28ad30a", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：五张图共用线性半径；扇区越长，标准化RMSE越大。MM的数值另列。*", "hash": "d48291d39ecdd862f0e6791f3382c040eab91d7c76999e13447997b5288118fc"}, {"id": "report-481785e3f263", "kind": "text", "html": "\u003cp\u003e固定β观察，样本量减少时，各方法的RMSE多数增大。固定n观察，β增大时位置误差的增长较为一致，形状和尺度误差的变化则因方法而异。同一方法在不同β下，误差随样本减少的增幅也不相同。\u003c/p\u003e", "hash": "1c7d329abee41e48c6deb23bef3c0bb943f58dc3a55a931e4f58bd5da784d237"}, {"id": "rmse-condition-directions", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e比较方向\u003c/th\u003e\u003cth\u003e观察到的变化\u003c/th\u003e\u003cth\u003e初步认识\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e固定β，减小n\u003c/td\u003e\u003ctd\u003eRMSE多数增大，各方法增幅不同\u003c/td\u003e\u003ctd\u003e样本减少通常降低估计精度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e固定n，增大β\u003c/td\u003e\u003ctd\u003e位置误差普遍增大，形状和尺度误差的变化存在方法差异\u003c/td\u003e\u003ctd\u003e形状条件对各参数的影响不同\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e交叉观察n与β\u003c/td\u003e\u003ctd\u003e同一方法在不同β下的误差增幅不同\u003c/td\u003e\u003ctd\u003e样本量的影响随形状条件改变\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "54fcacb84de4b52f960f3bdd59ba3a5eaf9589ca001ccc4f883f65dd1502effa"}, {"id": "distance-joint-image", "kind": "image", "src": "assets/方法差距变化_轨迹与50到7联合图.png", "alt": "各方法对的距离轨迹及n从50到7的距离变化联合图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "distance-joint-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：上两行分别为β=1.5和5下五档n的距离轨迹，每条线对应一对方法；下行为n=50到7的距离变化，覆盖八档β，红色表示扩大、蓝色表示缩小。三列依次为形状、尺度和位置参数。\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e距离为两种方法标准化RMSE之差的绝对值。六法共15对，仍使用七法共同有效样本；形状RMSE除以真β，尺度与位置RMSE除以真η。\u003c/em\u003e\u003c/p\u003e", "hash": "591a33b92832df58969c2e4257a64b88ba27e36e54e5cff626f31038b4c4ae51"}, {"id": "distance-joint-phenomena", "kind": "text", "html": "\u003cp\u003eβ=1.5时，七种方法的RMSE均随样本减少而上升；联合图中六种方法的两两差距也普遍拉开。此时，各方法的变化方向较为一致，区别主要表现为上升幅度不同。\u003c/p\u003e\u003cp\u003eβ=5时，RMSE仍多向上，但方法间距离的变化不再一致：一些方法对继续分离，另一些逐渐接近，部分距离曲线还出现转折。比较n=50与7，LSE、LRE与WMLE的尺度和位置RMSE更接近，而它们与K–R的差距增大。\u003c/p\u003e\u003cp\u003e形状条件改变后，样本减少对方法关系的影响，可从普遍拉开转为拉开与接近并存。误差上升的共同方向，并不意味着方法间的精度关系保持不变。\u003c/p\u003e", "hash": "27659e5d2d778ad2578fc3f43555e2811334708e070343e5ff2f6f0b8c01c0d8"}]}], "selected_ids": [], "content_hash": "6e8c08debae82b38d4427466e5e1b492f3509710cc6b4929da78780a65219b4a"}, {"id": "law-distribution", "title": "2.2　估计分布的结构变化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "law-distribution-current", "label": "当前内容", "blocks": [{"id": "preview", "kind": "gallery", "images": [{"id": "beta-1.5", "src": "assets/估计值分布_β1.5_两档n.png", "label": "β = 1.5", "alt": "β=1.5，n=50与7的七法三参数估计分布"}, {"id": "beta-2", "src": "assets/估计值分布_β2_两档n.png", "label": "β = 2", "alt": "β=2，n=50与7的七法三参数估计分布"}, {"id": "beta-2.5", "src": "assets/估计值分布_β2.5_两档n.png", "label": "β = 2.5", "alt": "β=2.5，n=50与7的七法三参数估计分布"}, {"id": "beta-3", "src": "assets/估计值分布_β3_两档n.png", "label": "β = 3", "alt": "β=3，n=50与7的七法三参数估计分布"}, {"id": "beta-3.5", "src": "assets/估计值分布_β3.5_两档n.png", "label": "β = 3.5", "alt": "β=3.5，n=50与7的七法三参数估计分布"}, {"id": "beta-4", "src": "assets/估计值分布_β4_两档n.png", "label": "β = 4", "alt": "β=4，n=50与7的七法三参数估计分布"}, {"id": "beta-4.5", "src": "assets/估计值分布_β4.5_两档n.png", "label": "β = 4.5", "alt": "β=4.5，n=50与7的七法三参数估计分布"}, {"id": "beta-5", "src": "assets/修订_估计值分布_两档n.png", "label": "β = 5", "alt": "β=5，n=50与7的七法三参数估计分布"}], "aspect_ratio": 2.0568181818181817, "markdown": "#### β = 1.5\n\n![β=1.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β1.5_两档n.png)\n\n#### β = 2\n\n![β=2，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2_两档n.png)\n\n#### β = 2.5\n\n![β=2.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β2.5_两档n.png)\n\n#### β = 3\n\n![β=3，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3_两档n.png)\n\n#### β = 3.5\n\n![β=3.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β3.5_两档n.png)\n\n#### β = 4\n\n![β=4，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4_两档n.png)\n\n#### β = 4.5\n\n![β=4.5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/估计值分布_β4.5_两档n.png)\n\n#### β = 5\n\n![β=5，n=50与7的七法三参数估计分布](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/修订_估计值分布_两档n.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "report-d970bfb3ef64", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：行对应n=50、7，列对应形状、尺度、位置。虚线为真值，红点为均值，横线为四分位区间。密度显示主体分布，统计量使用全部有效值。*", "hash": "fb3e99a188cd89b84bd03f99a7e3c83ab372c65588826e15681479ba302c26d1"}, {"id": "report-521def6b8c6a", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e分布展宽。\u003c/strong\u003eLSE、LRE的尺度和位置估计从n=50到n=7明显变得分散；即使n=50，β从1.5增至5时，两种参数的四分位区间也明显扩大。分布展宽并非只出现在极小样本条件。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e边界聚集。\u003c/strong\u003eLSE、LRE的位置估计在γ=0处出现集中。β=5时，这一现象在n=50下已经存在，n=7下边界结果的比例进一步增加。这些零值是原始结果中成功返回的位置估计。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e多峰结构。\u003c/strong\u003e较大β下，LSE、LRE的尺度估计逐渐分成两组，形成双峰。较小β下，即使已有零位置结果，尺度分布也未必出现双峰。边界聚集与分布多峰是两种不同现象。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e参数联合偏移。\u003c/strong\u003eβ=5的同次重复估计配对结果还显示，位置偏小伴随尺度偏大，位置偏大伴随尺度偏小。边际分布中的双峰反映结果分成不同群体，位置—尺度配对则反映两个参数的联合变化。\u003c/p\u003e", "hash": "2759aedacafe7c22a85b1591e327544211c8924457646be38a9725df63039c55"}, {"id": "wmle-bias-sd-evidence", "kind": "visual", "html": "\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003en\u003c/th\u003e\u003cth\u003e形状Bias\u003c/th\u003e\u003cth\u003e形状SD\u003c/th\u003e\u003cth\u003e形状RMSE\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e10\u003c/td\u003e\u003ctd\u003e-2.263\u003c/td\u003e\u003ctd\u003e0.982\u003c/td\u003e\u003ctd\u003e2.466\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e-2.614\u003c/td\u003e\u003ctd\u003e0.713\u003c/td\u003e\u003ctd\u003e2.710\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e", "hash": "82a1d78972b9e6c43540035d533a6e54fe8d219bfa79e588cf66a9293832234e"}, {"id": "wmle-bias-sd-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e表：WMLE，β=5；七法共同有效结果，Bias保留符号。自身有效结果也支持SD下降、负偏差加重和RMSE上升的方向。\u003c/em\u003e\u003c/p\u003e", "hash": "dee7e073e9dede1d3f597ad93e91c5dd234e5417a587b5e6205b24e56092b9e2"}, {"id": "wmle-bias-sd-interpretation", "kind": "text", "html": "\u003cp\u003eWMLE还表明，误差增大并不总伴随分布展宽：在这一条件下，样本减少时形状估计的SD下降，负偏差却加重，RMSE仍然上升。分布宽度、偏移和结构需要分别观察。\u003c/p\u003e", "hash": "60764946fd236934d5334fe764c8a4c702a4a7c073cbf810aed56e134b988677"}]}], "selected_ids": [], "content_hash": "4f0daef5b43e71ab8387d6f9ef4a5295ad95136ca3fb4d293a2e24fe2d0fd53e"}, {"id": "law-synthesis", "title": "2.3　主要性能规律", "mode": "content", "state": "modify", "selected": "synthesis-phenomena", "options": [{"id": "synthesis-phenomena", "label": "当前正文", "blocks": [{"id": "synthesis-phenomena-body", "kind": "text", "html": "\u003col\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e形状参数变化对各参数、各方法的影响不同。\u003c/strong\u003e固定n时，位置误差总体随β增大而上升，形状和尺度误差的变化则因方法而异。各方法的误差水平和相对表现随形状条件改变。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e样本减少对方法间差距的影响随形状条件改变。\u003c/strong\u003eβ=1.5时，误差上升伴随方法间差距普遍扩大；β=5时，差距扩大与缩小并存。样本减少不仅提高误差水平，也会改变方法间的精度关系，较大样本下的优劣关系不能直接沿用于小样本。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e估计分布出现结构变化。\u003c/strong\u003e随着样本量和形状条件变化，估计分布除离散程度改变外，还可能出现边界聚集、分布分化和参数联合偏移。LSE、LRE的部分结构变化在n=50下已经存在，并在部分小样本条件下更突出。\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003eMM的少数极端输出还会明显改变RMSE，其影响在后面的风险分析中展开。\u003c/p\u003e", "hash": "338887fd88c5cbbf3b8522e709f21353a563dcf64f40b87faa8eed6ddda980d7"}]}], "selection_mode": "single", "selected_ids": ["synthesis-phenomena"], "content_hash": "ec2b17a0a6fd365ba4b5013c6d827a9403c9174526cbe0b97a5581077ddcd48f"}, {"id": "chapter-4", "title": "3　性能变化的机制分析", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-4-current", "label": "当前内容", "blocks": [{"id": "mechanism-opening", "kind": "text", "html": "\u003cp\u003e第二章的变化可以进一步分解：高β时参数为何较难区分，样本减少为何改变方法间的精度关系，以及位置偏移为何伴随边界聚集和尺度双峰。以下从起点信息、估计规则和参数恢复关系解释其中的典型路径。\u003c/p\u003e", "hash": "2ae69fd7944bf3220a32772bfe8aa4991a6938a715de870eb297c546d6a28a76"}]}], "content_hash": "7741dc0b922aba0ba3c2d20d3486257ff1f62d7026ffa5ff66b54e9cb4b98af0"}, {"id": "mechanism-n", "title": "3.1　起点信息与参数组合的区分", "mode": "content", "state": "open", "selected": null, "options": [{"id": "mechanism-n-current", "label": "当前内容", "blocks": [{"id": "information-gap", "kind": "text", "html": "\u003cp\u003eβ较大时，寿命观测更集中于分布中部；样本量较少时，最小观测仍可能远离真实起点。最小观测与起点之间缺少数据，样本对位置参数的约束因而较弱。\u003c/p\u003e", "hash": "55fe9f47009c475f424637c9bb43e97db1fb9c4a85458c26690c3263b9143037"}, {"id": "background-sample-origin", "kind": "image", "src": "assets/R00_图2_样本与真实起点.png", "alt": "Research00报告1图2：样本与真实起点", "markdown": "![Research00报告1图2：样本与真实起点](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/R00_图2_样本与真实起点.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "minimum-gap-probability", "kind": "text", "html": "\u003cp\u003e对独立完整Weibull样本，最小值与起点之间留有距离的概率为\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ePr\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e{\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e}\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eexp\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmsup\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e1.\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e", "hash": "740214bf04427e30be336be4444ed540e52238802cda11071e5c1b0b17ec2553"}, {"id": "gap-interpretation", "kind": "text", "html": "\u003cp\u003e在给定相对距离a下，n减小或β增大，最小观测仍落在这段距离之外的概率增大。这解释了为什么在高β条件下，即使样本并非只有极少几个，仍可能缺少靠近起点的观测。\u003c/p\u003e", "hash": "7c1fa2bb70132173fd3841d16050b2c503f628127dd66fe325d0811793144cf3"}, {"id": "compatible-combinations", "kind": "image", "src": "assets/R00_图3_参数组合与样本相容.png", "alt": "Research00：参数不同的两条Weibull曲线在样本覆盖区间内仍较接近", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "compatible-combinations-explanation", "kind": "text", "html": "\u003cp\u003e位置未被充分约束时，形状和尺度可以随之调整，使不同参数组合在样本覆盖区间内保持相近的分布。图中两组参数差异明显，中部曲线却较为接近，有限观测较难充分区分它们。\u003c/p\u003e", "hash": "4905fd4d2ee2a2bf6ae187c08a84fd88ce65f5f70cf05f184af1c81c43ff0ced"}, {"id": "local-combinations", "kind": "text", "html": "\u003cp\u003e在高β的分布中部，写成\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmi\u003eexp\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，其中\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eln\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmi\u003eE\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e、\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ex\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e，一阶近似给出\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mfrac\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e", "hash": "db4ea1e71cd63a6e98c7a05259d1f61e2bdaf6ae418e83042d8028d585dc7f3f"}, {"id": "combination-meaning", "kind": "text", "html": "\u003cp\u003e这一局部近似中，γ+η控制寿命水平，η/β控制离散程度。三个参数分别变化，仍可能保留相近的两个组合量。样本可以较好约束观测区间内的寿命分布，却未必能同样准确地分别确定三个参数。\u003c/p\u003e", "hash": "1089a66102d0ada4aae70c7d32af507695064de4edb9263b634babcb21af4943"}, {"id": "origin-evidence-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两图复用Research00报告1的起点信息与参数相容示例；后图为W(5,1000,500)、n=7的历史样本，黑点概率由样本排序近似。最小值概率关系为独立完整样本的精确关系，中部展开为局部近似。\u003c/em\u003e\u003c/p\u003e", "hash": "d0b74291fdd456f10c0c11f3c062c8b5b727b13b25439bd66e5a27e2db5e348b"}]}], "content_hash": "afeb7ba45cf12c2d4d73b968a7a69a2cd075feb673bfc278a25de077a55fcb7c"}, {"id": "mechanism-high-beta", "title": "3.2　样本减少为何改变方法间的精度关系", "mode": "content", "state": "modify", "selected": "mechanism-minimum", "options": [{"id": "mechanism-minimum", "label": "当前正文", "blocks": [{"id": "sample-structure-response", "kind": "text", "html": "\u003cp\u003e样本减少会改变最小观测与起点之间的距离，也会加大样本间距的波动。不同估计规则把这些变化转化为不同程度的偏差与波动，因此误差不会按统一比例增加。\u003c/p\u003e", "hash": "06bdd125941ba7349c3003fbe9dfe0c2058bafd6326951a3a8ee258717d8db1d"}, {"id": "kr-minimum-theory", "kind": "text", "html": "\u003cp\u003eK–R以样本最小值估计位置。由3.1的最小值分布，其位置RMSE满足精确关系\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmi\u003eη\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsqrt\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΓ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msqrt\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmsup\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmrow\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cp\u003e同一β下，两档样本量之间的误差比为\u003c/p\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmfrac\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003c/mfrac\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e", "hash": "5a8107a1ae5a29708f2734e81a771631f6449492d97da9546321d43377d39cbc"}, {"id": "kr-n-response", "kind": "image", "src": "assets/最小值定位_n响应_理论与原结果.png", "alt": "K–R位置RMSE的理论变化与原1200次结果，β=1.5和5，n从50到7", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "kr-bias-interpretation", "kind": "text", "html": "\u003cp\u003e高β下的位置误差更大，但相同幅度的样本减少，误差的倍数增长反而较小。误差水平较高与对样本减少更敏感，是两个不同判断。图中原结果与理论曲线接近，说明这一路径可以由最小值定位规则直接解释。\u003c/p\u003e\u003cp\u003e\u003cem\u003e曲线为理论总体RMSE，点为K–R自身1200次有效结果；不按其他方法是否成功筛选。\u003c/em\u003e\u003c/p\u003e", "hash": "7a4f743f383afa1e2bcf45166d204c7cc278b076d96a9a67cc34ffd663a180ca"}, {"id": "criterion-responses-mdm", "kind": "image", "src": "assets/R00_MDM_梯度阈值与参数条件.png", "alt": "Research00：β=2和5、n=7、15、30下MDM梯度阈值交点", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "criterion-response-interpretation", "kind": "text", "html": "\u003cp\u003eMDM则不是直接采用最小值，而是寻找梯度达到固定阈值的位置。高β时，各伪尺度随位置变化接近同步，真位置附近的标准差梯度较小；阈值仍固定为0.10，交点因而偏向较高位置。Research00的对照显示，样本较少时这种右移更明显，增加样本后有所减轻。\u003c/p\u003e\u003cp\u003e这种变化会增加系统偏移，而不只是扩大随机波动。本轮β=5时，MDM随n从50减至7，位置正偏差与形状负偏差均加重。LSE、LRE在相同条件下则主要表现为位置估计波动扩大。两类方法的误差来源及其增幅不同，彼此距离因而可能接近，也可能拉开。\u003c/p\u003e\u003cp\u003eK–R给出了可直接量化的n响应，MDM的阈值诊断给出了方向性偏移随样本量变化的形成路径。这些解释对应第二章的方法响应分化；全部方法对的差距变化仍需结合各自的偏差、波动与选解规律分析。\u003c/p\u003e", "hash": "c1749117f987721fd382f3d8cf8ad3a3b3ccdba25bed4859dbb60535070daa67"}, {"id": "criterion-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003eMDM图复用Research00报告1，β=2、5，n=7、15、30，η=1000、γ=500，δ=0.10；本轮偏差与波动判断使用Study04各法自身有效结果。历史图不并入第2章的统一比较统计。\u003c/em\u003e\u003c/p\u003e", "hash": "a071f8da98c306c647d0d5b68a60e4994206e7eba31a0b855214773f5b3d4f52"}]}], "content_hash": "c0fb6b4ca7f63063fd1725f5cb59ba8a188883317084671434bb363d9d7a254d"}, {"id": "mechanism-boundary", "title": "3.3　偏移、边界聚集与双峰的形成", "mode": "content", "state": "converged", "selected": "mechanism-boundary", "options": [{"id": "mechanism-boundary", "label": "当前正文", "blocks": [{"id": "parameter-transfer-observation", "kind": "text", "html": "\u003ch4\u003e方向性偏移如何传递到三个参数\u003c/h4\u003e\u003cp\u003e第二章中，部分方法出现位置偏高、形状和尺度偏低的组合。位置上移使较小观测到起点的距离缩短比例更大，观测之间的距离比随之增大。MDM保持各观测反算尺度接近时，需要降低形状参数来适应这一变化，再从这组位置和形状恢复尺度。\u003c/p\u003e", "hash": "4de49e42d336f058d6c5d2c2fe042e66e158720d77c8e01b441f098a7c281eb3"}, {"id": "mdm-parameter-transfer", "kind": "image", "src": "assets/R00_MDM_位置形状尺度传递.png", "alt": "Research00：MDM的定位交点怎样传递为形状和尺度的偏移", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "mdm-parameter-transfer-explanation", "kind": "text", "html": "\u003cp\u003e图中的高β示例沿这一过程变化：固定真位置时，形状估计尚较接近真值；采用阈值选出的偏高位置后，形状和尺度一起降低。由此，三个参数的偏移可以追溯到同一定位过程，而不是三个彼此独立的误差。\u003c/p\u003e", "hash": "35c56a9c47a4969286a421825af02bf26a29cfdc876fffc6121ce434dfd5e5c2"}, {"id": "mdm-transfer-source", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e复用Research00报告1图5：β=2、5，n=7的第48组配对样本，MDM δ=0.10。蓝点为固定真位置的条件估计，橙叉为原返回结果。\u003c/em\u003e\u003c/p\u003e", "hash": "ec3f9d4212cf20f2e5ffd4e62abf985137c1ec61470ae282dd9aaa42c809768f"}, {"id": "boundary-objective", "kind": "text", "html": "\u003ch4\u003e边界聚集为何有时进一步形成双峰\u003c/h4\u003e\u003cp\u003eLSE、LRE的另一类变化，是位置估计集中到γ=0，同时尺度估计分成两组。先把原结果按位置是否为零分开：总尺度分布是边界组与内部组的加权混合。\u003c/p\u003e", "hash": "cf757edadc1c804e21ed145a35ecfd7c7a3039f419207e9d7f084d9f1acae9ef"}, {"id": "boundary-mixture", "kind": "gallery", "aspect_ratio": 1.5333333333333334, "images": [{"id": "lse", "label": "LSE", "src": "assets/尺度分布_边界内部混合_LSE.png", "alt": "LSE尺度密度按零位置边界与内部结果分组，行对应n=50和7，列对应β=1.5和5"}, {"id": "lre-park", "label": "LRE（Park）", "src": "assets/尺度分布_边界内部混合_LRE(Park).png", "alt": "Park LRE尺度密度按零位置边界与内部结果分组，行对应n=50和7，列对应β=1.5和5"}], "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "boundary-mixture-caption", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e两组使用相同绝对带宽，组密度乘以组占比后相加，恰好得到总密度。竖虚线为真实尺度；全部原有效值参与计算，各图共用显示范围。\u003c/em\u003e\u003c/p\u003e", "hash": "cd665c2bb0b2f31510f6e4eb9dbba2abd3315437cf033e4352a4083876e07155"}, {"id": "boundary-mixture-interpretation", "kind": "text", "html": "\u003cp\u003eβ=1.5、n=7时，已有一部分零位置结果，但两组尺度分布仍有较多重叠，总体没有形成清晰双峰。β=5时，边界组集中在较高尺度附近，内部组向较低尺度延伸，两组分离后形成双峰。n减小时，边界占比和内部组分布同时改变，进一步改变两峰的相对形态。\u003c/p\u003e\u003cp\u003e因此，出现边界解并不必然产生双峰。是否形成双峰，还取决于两组之间的距离、各组的分散程度和所占比例。\u003c/p\u003e", "hash": "8760af7221978843f13ca6ef75cab5ca3d6a8fcc6bdc4f8807470c61a68528ef"}, {"id": "boundary-origin", "kind": "text", "html": "\u003cp\u003e零位置群体的形成与约束下的判据选择有关。LSE、LRE通过移动位置改善概率图匹配：当样本的最佳匹配倾向于更低位置，而搜索范围要求γ≥0时，最优候选可能落到零边界。以下原样本廓线核对这一过程。\u003c/p\u003e", "hash": "6c2d69c9abf536bdecbe07a0e487f4a74731101794ac7db8d968de71d09f6206"}, {"id": "boundary-profiles", "kind": "gallery", "aspect_ratio": 1.5, "images": [{"id": "n-50", "label": "β = 5，n = 50", "src": "assets/尺度双峰_边界与参数补偿_n50.png", "alt": "β=5、n=50，LSE与LRE的位置尺度配对及位置准则廓线"}, {"id": "n-7", "label": "β = 5，n = 7", "src": "assets/尺度双峰_边界与参数补偿_n7.png", "alt": "β=5、n=7，LSE与LRE的位置尺度配对及位置准则廓线"}], "markdown": "#### β = 5，n = 50\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n50.png)\n\n#### β = 5，n = 7\n\n![LSE与LRE的位置尺度配对及位置准则廓线](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/尺度双峰_边界与参数补偿_n7.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "boundary-caption", "kind": "text", "markdown": "*图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。*", "html": "\u003cp\u003e\u003cem\u003e图注：上排为全部有效结果，橙色表示零位置边界；下排各选一组边界样本和内部样本，圆点为原估计。灰色区域为诊断用的负γ延伸，红虚线为真实γ。LSE用等价的ρ²展示定位准则。\u003c/em\u003e\u003c/p\u003e", "hash": "edceb5fee3de3d22242ad7b3fd546d21efec9c3c848d7331cf933dbd32aa0a1f"}, {"id": "boundary-verification", "kind": "text", "markdown": "在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。", "html": "\u003cp\u003e在核对的边界样本中，加密位置搜索仍返回γ=0；向负γ方向延伸，相关性还会提高。这些样本的边界选择与估计准则和非负约束有关。\u003c/p\u003e", "hash": "6f43ffe6994120aaba14388bd7507fc803b9a7c8e8989c5ae8b7489f081bfe44"}, {"id": "compensated-life", "kind": "text", "html": "\u003ch4\u003e位置与尺度为何呈相反方向变化\u003c/h4\u003e\u003cp\u003e两组结果的位置—尺度配对大体沿η+γ近似不变的方向分布。位置降低时，提高尺度仍可维持相近的寿命水平；这与3.1中高β下由组合量控制中部分布的近似关系相符。因此，零位置组对应较高尺度，较高位置的内部结果则对应较低尺度。\u003c/p\u003e\u003cp\u003eη+γ恰好对应63.2%失效分位寿命。本轮图示条件下，这个组合量的误差小于两个参数各自的误差，说明较大的单参数偏移可以伴随相对稳定的寿命组合量。\u003c/p\u003e", "hash": "1d448fafbfff83670501d2c82f39e5e923b0851c1c45d9099dd6fa9a568865c7"}, {"id": "mechanism-integration", "kind": "text", "html": "\u003cp\u003e由此可以区分两条形成路径：固定判据的定位偏移，可经参数恢复形成方向性的联合偏移；约束下的边界与内部选解，则可经位置—尺度联动形成不同估计群体。后者只有在群体充分分离时才表现为尺度双峰。\u003c/p\u003e", "hash": "b8a5027b6c59899b5f6069d0803a299df25d299ddda3a22035b111e3564a6c73"}, {"id": "statistical-numerical-distinction", "kind": "text", "html": "\u003cp\u003e这些边界案例加密搜索后仍保留原解，支持判据与约束参与其形成。若更完整的搜索反而找到更优的合格候选，则属于另一类数值求解问题，应与方法本身的偏移分别处理。\u003c/p\u003e", "hash": "f4c5375981df82c791a467c311b495527caac5641dcd1b52b804974694deee57"}]}], "content_hash": "2bd72760b9d8c612c89e090296040400818c08f58fbeaa427941ec97befc0035"}, {"id": "chapter-5", "title": "4　评价目标、估计风险与方法选择", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-5-current", "label": "当前内容", "blocks": [{"id": "evaluation-opening", "kind": "text", "html": "\u003cp\u003e这些差异也改变了方法的评价。误差来自整体偏移、重复波动还是少数极端结果，对使用判断的意义不同；参数误差与寿命指标误差也需要分别看。\u003c/p\u003e", "hash": "ac9b51267bc95456fd99ac81f16ddd433da5935a56fe1d0ffa18e31d994f57a6"}]}], "content_hash": "528334d5c4ce62acc90721eec8dc2522323e536add0edd4aefa78f9f8ae660dd"}, {"id": "evaluation-risk", "title": "4.1　极端结果与求解失败", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-risk-current", "label": "当前内容", "blocks": [{"id": "report-7dedb0c7b8f8", "kind": "text", "markdown": "RMSE同时受到多数估计结果与少数极端值的影响。MM在部分条件下的形状RMSE尖峰由极少数极端输出主导，不能将其理解为每份样本都产生相同程度的误差。\n\n异常还可能具有明确方向。β=5、n=7时，MDM和WMLE所记录的形状异常均为低估，与前述系统偏移相联系。", "html": "\u003cp\u003eRMSE同时受到多数估计结果与少数极端值的影响。MM在部分条件下的形状RMSE尖峰由极少数极端输出主导，不能将其理解为每份样本都产生相同程度的误差。\u003c/p\u003e\n\u003cp\u003e异常还可能具有明确方向。β=5、n=7时，MDM和WMLE所记录的形状异常均为低估，与前述系统偏移相联系。\u003c/p\u003e", "hash": "84776269d6ee3d040c8a296ed40e1f91c938ede859dba363ca17e5d5c60c9101"}, {"id": "risk-map", "kind": "image", "src": "assets/07_形状异常频率.png", "alt": "七法形状异常频率", "markdown": "![七法形状异常频率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/07_形状异常频率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "anomaly-insight", "kind": "text", "markdown": "不同方法的异常风险区域并不相同。MDM、LSE、LRE和WMLE在小n、高β条件下较为突出，MLE在低β、小n条件下也出现较高异常率。异常的发生频率与其对平方误差的影响，需要分别观察。", "html": "\u003cp\u003e不同方法的异常风险区域并不相同。MDM、LSE、LRE和WMLE在小n、高β条件下较为突出，MLE在低β、小n条件下也出现较高异常率。异常的发生频率与其对平方误差的影响，需要分别观察。\u003c/p\u003e", "hash": "1c907b573e22d23fd07f57ec1f01c6f8691ceaf36155aa81f7127472a46b8428"}, {"id": "return-map", "kind": "image", "src": "assets/06_有效率.png", "alt": "七法有效率", "markdown": "![七法有效率](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/06_有效率.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "return-insight", "kind": "text", "markdown": "本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。", "html": "\u003cp\u003e本轮中，MDM、LSE、LRE和K–R的全部尝试均返回有效估计。MLE的有效率随n减小而下降，低β时下降更明显；其误差统计对应的成功集合也随之改变。成功结果的精度与全部尝试的返回情况，共同影响实际使用时的判断。\u003c/p\u003e", "hash": "e3fd2ef8f7aafb49100bbc3f051eb7df131fbef02e3c5c82591f1d6d092ce4ec"}, {"id": "report-844fa01fd3b3", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：形状异常为β̂≤β/3或β̂≥3β，分母为有效结果数；有效率的分母为全部尝试。返回状态按本轮实现与求解约定统计。*", "hash": "4a575a1f296bb18010f5b66810f9e25ffe1e2154df18b3c34a7ed1d43ee1c84f"}, {"id": "extreme-case-short", "kind": "text", "html": "\u003cp\u003e\u003csmall\u003e极端记录示例：β=4.5、n=15的MM结果中，单条有效记录贡献了几乎全部形状平方误差，仍保留在原统计中。\u003c/small\u003e\u003c/p\u003e", "hash": "550ad5e0782bf0197b6f3e8a74496b2fcd0e2ca62d94e3d5eec161dc9f7b0d81"}]}], "content_hash": "d29603d3e45260375f94fea91e5c741a6fcfa6c8e481f87a5c66db8e7a50b9b9"}, {"id": "evaluation-target", "title": "4.2　评价目标与已知条件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "evaluation-target-current", "label": "当前内容", "blocks": [{"id": "report-141e74cc51cf", "kind": "text", "html": "\u003cp\u003e方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。\u003c/p\u003e", "markdown": "方法的评价取决于使用目标。参数估计与不同寿命指标下的方法排序可能不同。", "hash": "9d306cfd87370cd5438ffa52a0e90231d5dbd1fb70b9def4b91e335d32069105"}, {"id": "preview", "kind": "image", "src": "assets/v04_06_寿命目标及候选差距.png", "alt": "候选区域：同时看第二名差多少", "markdown": "![候选区域：同时看第二名差多少](D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/reviewbyhtml/方法对比/assets/v04_06_寿命目标及候选差距.png)", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "life-insight", "kind": "text", "markdown": "B10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\n\n部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。", "html": "\u003cp\u003eB10的最低RMSE方法随n和β变化，B1则在多数条件下由MDM取得最低RMSE。评价指标改变后，方法的相对表现也发生变化。\u003c/p\u003e\n\u003cp\u003e部分条件下，第一与第二方法的RMSE接近，单一名次不足以反映差异幅度。方法选择还应结合稳定性与异常风险。\u003c/p\u003e", "hash": "7563305f00001c00e22ffe98ce69a0ec0ab69c75d02bc4cf7215af587149ec56"}, {"id": "report-0b09dfed9e36", "kind": "text", "html": "\u003cp\u003e\u003cem\u003e图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。\u003c/em\u003e\u003c/p\u003e", "markdown": "*图注：格内为共同有效样本上RMSE最低的方法，下行为第二名高出的比例。B10、B1分别为10%、1%失效分位寿命。*", "hash": "7f591c41f622a446668f401efe2da615f8096ba65f539ed1fabb6b018c6f50d0"}, {"id": "report-4c485a61fc3c", "kind": "text", "html": "\u003cp\u003e模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。\u003c/p\u003e", "markdown": "模拟条件表以真实β为依据。实际使用时，β范围未知，需要在给定参考范围内综合评价；β范围可预估时，可以缩小候选区域。选择还取决于目标参数或寿命指标，以及对波动和异常风险的要求。利用未知样本进行方法选择的规则及其收益仍需验证。", "hash": "fd2fcbed1d9dc96d34d4c2aa6f4a7923798d10183195e743a6b6902d8bfd5f3c"}]}], "content_hash": "f7d7a137d804b3a65750a438e13345777a954339df6d8100dc9285ac77c3da78"}, {"id": "chapter-6", "title": "5　后续研究与平台", "mode": "content", "state": "open", "selected": null, "options": [{"id": "chapter-6-current", "label": "当前内容", "blocks": [{"id": "report-4e32b99204ac", "kind": "text", "html": "\u003cp\u003e相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。\u003c/p\u003e", "markdown": "相同n和总体参数下，具体样本仍存在差异。后续考虑利用人工智能方法，根据样本可观测特征与使用目标选择估计方法，并优化方法内部的过程量和求解过程。选择规则的收益需要在新样本上验证。", "hash": "06d7bcf997cfc700a55b7afa219d572dc06e32dcd408fe8afb03c4f97b73829a"}, {"id": "report-bee2a0cf0e07", "kind": "text", "html": "\u003cp\u003e我们也在\u003ca href=\"https://weibull.work\"\u003eweibull.work\u003c/a\u003e整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。\u003c/p\u003e", "markdown": "我们也在[weibull.work](https://weibull.work)整理方法实现与相关分析，目前已有部分方法可以在线调用。网站仍在建设，未来希望把样本分析、方法选择与求解优化结合起来，也欢迎大家试用并提出建议。", "hash": "514314fc072b5127df24407ae13002701c5cdf2c9acd0214a10519008222e314"}]}], "content_hash": "52597393bfc000e879231169a096fb6700168c024dbb278e7d82b9fcdff477ab"}], "last_applied_submission_id": "fb9e9f4e-76f8-49dc-acaf-976cf6ea273e", "last_rendered_submission_id": "fb9e9f4e-76f8-49dc-acaf-976cf6ea273e", "outline_confirmed": true, "review_complete": false, "review_runtime": "0.7.1", "section_3_3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "gap_metric": "median(RMSE)/min(RMSE)-1", "gap_subset": "common", "mdm_persistent_region": {"beta": [3, 3.5], "n": [50, 20, 15, 10, 7], "parameters": ["beta", "eta", "gamma"], "subsets": ["own", "common"]}, "shape_winner_transition": {"beta": [4.5, 5], "n": [50, 20, 15, 10, 7], "winners": ["WMLE", "WMLE", "WMLE", "MDM-0.1", "MMLE(KR)"], "subsets": ["own", "common"]}, "gap_checked_regions": {"expanded_beta": [1.5, 2, 2.5, 3], "contracted_beta": [4.5, 5], "n": [50, 7], "parameters": ["beta", "eta", "gamma"]}}, "chapter3_evidence": {"source": "结果呈现/分析数据/参数指标.csv", "sha256": "076fc9041bd86df9a43af27cc4f5b75d9381231a618079d8efa0cd6789c78d7b", "checked_subsets": ["own", "common"], "historical_scope": "Research00机制示例：β=2、5，n=7、15、30；不并入Study04统一1200次比较。", "r00_figure_sources": {"assets/R00_图3_参数组合与样本相容.png": "Research/00-方法对比/交付/结果/报告1/图2_样本与分布相容.png", "assets/R00_MDM_梯度阈值与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图3_MDM六格机制.png", "assets/R00_LSE_判据与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图4_LSE六格机制.png", "assets/R00_WMLE_联合方程与参数条件.png": "Research/00-方法对比/交付/结果/报告1/图6_WMLE六格机制.png", "assets/R00_MDM_位置形状尺度传递.png": "Research/00-方法对比/交付/结果/报告1/图4_MDM参数传递.png"}, "explanation_limit": "K–R的n响应来自最小值分布的精确关系；MDM为历史受控诊断与本轮统计的对应解释；边界混合分解为本轮逐次结果的精确分组，边界来源核对限于已有8个廓线案例。尚未逐一量化全部方法对RMSE距离变化的机制贡献。", "phenomenon_explanation_check": "结果呈现/分析数据/现象解释补图核对.json"}, "manuscript_version": "1.2", "archive_targets": {"output": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v1.3.md", "previous": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/报告下（方法对比）-v1.2.md", "archive": "D:/weibull/Study/04-study-小样本三参数Weibull估计方法比较与选择/其他/历史版本/报告下（方法对比）-v1.2.md", "sync_remote": true}, "processing": false, "accepted_revision": 19, "accepted_at": "2026-10-21T13:27:55.621265+00:00"}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;
try{sidebarVisible=(localStorage.getItem(sidebarKey())??localStorage.getItem(`review-html:${board.id}:sidebar-pinned`))==='true'}catch{}
function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}
function jumpToOutline(entry){entry.target.scrollIntoView({block:'start',behavior:'smooth'})}
function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit))for(const heading of node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+Math.max(1,Number(heading.tagName.slice(1))-2))})}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}
$('sidebar-toggle').onclick=toggleSidebar;
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function deliveryMessage(){
 if(!online)return '离线预览；反馈只能导出';
 const delivery=board.delivery;
 if(board.review_complete)return '当前版本已接受并存档';
 if(board.archive_pending)return '存档请求已应用，文件操作待完成';
 if(board.processing)return '反馈已应用，内容正在更新';
 if(board.submitted){
  if(delivery?.feedback_stage==='read_by_wait')return 'wait 已读取反馈，等待 Agent 处理';
  if(delivery?.wait_active)return '反馈已落盘，等待活动 wait 读取';
  return '反馈已落盘；当前没有活动 wait，请回到聊天恢复审阅';
 }
 if(!delivery)return '等待进程状态尚未确认';
 return delivery.wait_active?'当前有活动 wait 正在等待反馈':'页面可用；当前没有活动 wait';
}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250);updateOutlineStatus()}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'||editor.kind==='section-note'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}if(structuredNote(editor)){const unit=board.units.find(u=>u.id===editor.unit_id),option=unit?.options.find(o=>o.id===editor.option_id),block=option?.blocks.find(b=>b.id===editor.block_id);if(editor.kind==='option-note'?option:block&&(editor.kind!=='image-note'||block.images?.some(i=>i.id===editor.image_id)))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
const structuredNote=anchor=>['section-note','option-note','block-note','image-note'].includes(anchor.kind);
function noteValue(anchor){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note')return state.section_note||'';if(anchor.kind==='option-note')return state.notes[anchor.option_id]||'';const notes=anchor.kind==='image-note'?state.image_notes:state.block_notes;return notes?.find(n=>n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(anchor.kind!=='image-note'||n.image_id===anchor.image_id))?.comment||''}
function storeNote(anchor,comment){const state=draft.units[anchor.unit_id];if(anchor.kind==='section-note'){state.section_note=comment;return}if(anchor.kind==='option-note'){if(comment)state.notes[anchor.option_id]=comment;else delete state.notes[anchor.option_id];return}const key=anchor.kind==='image-note'?'image_notes':'block_notes';state[key]=(state[key]||[]).filter(n=>!(n.option_id===anchor.option_id&&n.block_id===anchor.block_id&&(key!=='image_notes'||n.image_id===anchor.image_id)));if(comment)state[key].push({option_id:anchor.option_id,block_id:anchor.block_id,...(key==='image_notes'?{image_id:anchor.image_id}:{}),comment})}
function storedNote(anchor){if(!anchor||anchor.kind==='divergence')return '';return structuredNote(anchor)?noteValue(anchor):draft.units[anchor.unit_id].annotations.find(n=>n.id===anchor.id)?.comment||''}
function sameNote(left,right){if(!left||!right||left.unit_id!==right.unit_id||left.kind!==right.kind)return false;if(!structuredNote(left))return left.id===right.id;return left.option_id===right.option_id&&left.block_id===right.block_id&&left.image_id===right.image_id}
function deleteNote(anchor){if(!anchor||anchor.kind==='divergence')return false;if(structuredNote(anchor))storeNote(anchor,'');else draft.units[anchor.unit_id].annotations=draft.units[anchor.unit_id].annotations.filter(n=>n.id!==anchor.id);if(sameNote(pending,anchor))closeEditor(false);draft.submission_id=null;persist();window.getSelection()?.removeAllRanges();renderComments();return true}
function editNote(anchor,rect){if(pending)saveNote();openEditor({...anchor,comment:storedNote(anchor)},rect)}
function noteIcon(anchorFor){const button=el('button','note-icon');button.type='button';button.title='添加、修改或删除备注';button.setAttribute('aria-label','添加、修改或删除备注');button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a7 7 0 0 1-7 7H7l-4 3V11a7 7 0 0 1 7-7h3a7 7 0 0 1 7 7Z"/><path d="M8 10h7M8 13h4"/></svg>';button.onclick=()=>{if(board.submitted||board.processing||board.review_complete)return;editNote(anchorFor(),button.getBoundingClientRect())};return button}
function blockNoteAnchor(unit,option,block){const base={unit_id:unit.id,option_id:option.id,block_id:block.id};if(block.kind==='gallery'){const slide=block.images[gallerySelection(unit,option,block)];return {...base,kind:'image-note',image_id:slide.id,quote:slide.label}}return {...base,kind:'block-note',quote:block.alt||(block.kind==='visual'?'表格或图表':'图片')}}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
}

 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
