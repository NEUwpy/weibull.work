<script id="initial-board" type="application/json">{"id": "study04-method-classification-v04-report", "title": "Study04 方法分类报告 v1.1 审阅", "document": true, "revision": 19, "require_confirmation": true, "archive_plan": "将本轮审定修改写回 Study04/报告上（方法分类）-v1.1.md，同步方法分类/机制图-v1.1/的draw.io图源、生成程序与SVG预览；沿用现有v1.0及v0.4归档，更新必要入口；保留原HTML任务、素材与全部审阅记录，核验正文、公式、图片和链接后提交到laptop分支。若确认文字指定新版本，再按该版本归档旧版并更新引用。", "units": [{"id": "opening", "title": "报告说明", "mode": "content", "state": "open", "selected": null, "options": [{"id": "opening-current", "label": "当前报告内容", "blocks": [{"id": "opening-text-0", "kind": "text", "html": "\u003ch1\nid=\"三参数weibull参数估计方法的分类与相互关系\"\u003e三参数Weibull参数估计方法的分类与相互关系\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e报告上（方法分类）v1.1｜更新：2026-10-21\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e魏鹏宇｜东北大学机械工程与自动化学院\u003c/p\u003e\n\u003cp\u003e分会场3：装备寿命与可靠性评估\u003c/p\u003e\n\u003cp\u003e各位老师、各位同学，大家好！我是东北大学机械工程与自动化学院的在读博士生魏鹏宇。今天汇报的题目是《小样本三参数Weibull参数估计方法的比较与选择》。\u003c/p\u003e\n\u003cp\u003e这次汇报分为两部分。第一部分梳理现有方法的估计原理，通过分类和方法间关系形成一张方法地图；第二部分在共同样本上比较代表方法，分析它们在小样本下的偏差、波动、异常输出和失败风险。\u003c/p\u003e\n", "hash": "a0a536f3f5df224a9f558286009b3fae2818166ea8e5cf481e0ff2adf9fb541f"}]}], "content_hash": "abfc75ba4db151073f2cccd5ca1bceb6bf48c91ec5e96198107f7fc659f1cfae"}, {"id": "section-1", "title": "1　先看现有方法：名称很多，层次混在一起", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-1-current", "label": "当前报告内容", "blocks": [{"id": "section-1-text-0", "kind": "text", "html": "\u003cp\u003e三参数Weibull分布包含形状参数β、尺度参数η和位置参数γ。位置参数决定分布的支撑边界，并与形状、尺度共同参与估计。围绕三个参数的确定，文献中陆续形成了多种方案：\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e代表文献（作者／年份）\u003c/th\u003e\n\u003cth\u003e方案或方法名\u003c/th\u003e\n\u003cth\u003e主要构造\u003c/th\u003e\n\u003cth\u003e构造特点\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSmith（1985）\u003c/td\u003e\n\u003ctd\u003e三参数MLE及最小值替代构造\u003c/td\u003e\n\u003ctd\u003e原始似然；另讨论位置取最小观测、删除该观测后的估计\u003c/td\u003e\n\u003ctd\u003e分析非正则似然与最小值替代构造\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCohen–Whitten（1982）\u003c/td\u003e\n\u003ctd\u003eMMLE-I—V、MME分支\u003c/td\u003e\n\u003ctd\u003e保留部分似然方程，用最小值、均值、方差或中位数关系替换位置或矩方程\u003c/td\u003e\n\u003ctd\u003e同一MMLE缩写下有多个具体版本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCheng–Amin（1983）；Ranneby（1984）\u003c/td\u003e\n\u003ctd\u003eMPS／最大概率间距\u003c/td\u003e\n\u003ctd\u003e用相邻CDF概率间距构造乘积或对数目标\u003c/td\u003e\n\u003ctd\u003e两条独立提出线索\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCheng–Iles（1987）\u003c/td\u003e\n\u003ctd\u003eCMLE／修正似然\u003c/td\u003e\n\u003ctd\u003e用最小观测附近的区间概率替换密度项\u003c/td\u003e\n\u003ctd\u003e位置边界处理改变了似然项\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWhite（1969）\u003c/td\u003e\n\u003ctd\u003e概率图回归\u003c/td\u003e\n\u003ctd\u003e用次序统计量期望构造分数，再回归对数寿命\u003c/td\u003e\n\u003ctd\u003e两参数概率图基础\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSoman–Misra（1992）\u003c/td\u003e\n\u003ctd\u003e三参数LSE／White扩展\u003c/td\u003e\n\u003ctd\u003e平移样本、White分数、回归和位置评分\u003c/td\u003e\n\u003ctd\u003e未知位置被接入概率图流程\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCran（1988）\u003c/td\u003e\n\u003ctd\u003eWeibull moments\u003c/td\u003e\n\u003ctd\u003e由生存函数幂次积分形成矩，再显式恢复三参数\u003c/td\u003e\n\u003ctd\u003e通过矩差显式恢复\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJacquelin（1993）→ Cousineau（2009）\u003c/td\u003e\n\u003ctd\u003eWMLE／加权MLE\u003c/td\u003e\n\u003ctd\u003e从二参数代数关系扩展到三参数，并把三个权重放进估计方程\u003c/td\u003e\n\u003ctd\u003e明确的扩展关系\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKundu–Raqab（2009）\u003c/td\u003e\n\u003ctd\u003eK–R MMLE\u003c/td\u003e\n\u003ctd\u003e以共同最小值定位并删除该观测，再估计其余参数\u003c/td\u003e\n\u003ctd\u003e最小值定位与删样本结合\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHosking（1990）；Elamir–Seheult（2003）\u003c/td\u003e\n\u003ctd\u003eL矩／截尾L矩\u003c/td\u003e\n\u003ctd\u003e以次序统计量线性组合匹配理论统计关系，截尾L矩减少端部影响\u003c/td\u003e\n\u003ctd\u003e统计关系路线的重要来源\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNagatsuka等（2013）\u003c/td\u003e\n\u003ctd\u003eLSPF\u003c/td\u003e\n\u003ctd\u003e用与位置、尺度无关的统计量估形状，再恢复其余参数\u003c/td\u003e\n\u003ctd\u003e位置尺度自由的联合构造\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNagatsuka–Balakrishnan（2015）\u003c/td\u003e\n\u003ctd\u003eLPF\u003c/td\u003e\n\u003ctd\u003e只消除位置、保留尺度信息，再进行参数恢复\u003c/td\u003e\n\u003ctd\u003e对LSPF的构造改进\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePark（2017；2018）\u003c/td\u003e\n\u003ctd\u003eProposed+Plot／Proposed+MLE2\u003c/td\u003e\n\u003ctd\u003e用概率图相关系数定位，再按回归或二参数MLE恢复\u003c/td\u003e\n\u003ctd\u003e2018补充条件下的存在性论证\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYang等（2023）\u003c/td\u003e\n\u003ctd\u003e最小二乘迭代\u003c/td\u003e\n\u003ctd\u003e概率图回归与最小次序统计量位置修正交替进行\u003c/td\u003e\n\u003ctd\u003e位置修正与回归组合\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e代表文献待补\u003c/td\u003e\n\u003ctd\u003eBayes、ANN／BPNN、MDM等\u003c/td\u003e\n\u003ctd\u003e分别使用先验与后验、训练映射或尺度伪估计差异\u003c/td\u003e\n\u003ctd\u003e对应后验推断、学习映射和尺度一致性判据\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这些名称分别强调估计准则、统计量、推断框架或改进步骤。例如，MLE强调似然，L矩强调统计量，Bayes强调后验推断，加权则描述对原有构造的调整。要把这些方法联系起来，需要回到它们怎样从样本得到参数。\u003c/p\u003e\n", "hash": "4c8b211ad8b7f4d61df61666d1e455af9082dd6a718faf31d0b7abdabadf7d68"}]}], "content_hash": "a2408a15f794780a8a43bf2395526c940bb2630b05d7083bb5244c586e48dc53"}, {"id": "section-2", "title": "2　归纳后的分类依据与分类结果", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-2-current", "label": "当前报告内容", "blocks": [{"id": "section-2-text-0", "kind": "text", "html": "\u003cp\u003e现有名称之所以显得杂，是因为它们分别强调了不同内容：有的强调观测密度，有的强调概率图或概率间距，有的强调矩和次序统计量，有的强调先验和后验，有的强调训练映射；加权、偏差修正、位置处理和数值搜索又会横跨这些内容。\u003c/p\u003e\n\u003cp\u003e因此，方法的主要归属按两个层面确定：\u003c/p\u003e\n\u003col type=\"1\"\u003e\n\u003cli\u003e\u003cstrong\u003e样本信息：\u003c/strong\u003e\n从样本中提取什么，是观测处的密度、经验分布、概率间距、矩、分位数、次序统计量、不变统计量，还是训练样本中的特征。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e参数确定原则：\u003c/strong\u003e\n怎样把这些信息变成三个参数，是最大化似然、最小化分布偏离、匹配概率结构、反演理论统计关系、更新后验，还是学习样本到参数的映射。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e加权、偏差修正、位置处理、边界约束、数值求解和跨路线组合描述实现与改进发生的环节。地图按估计依据确定每个方法的主要归属，再用关系线表示它借用的统计量、步骤及其与其他方法的联系。\u003c/p\u003e\n\u003cp\u003e据此可以归纳出五条路线：似然估计、分布匹配、统计关系反演、后验推断和学习映射。每条路线内部的方法差别，体现在具体方程、统计量和参数恢复步骤上。\u003c/p\u003e\n\u003cp\u003e这五条路线的分歧，发生在把样本转成参数的关键一步：\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e路线\u003c/th\u003e\n\u003cth\u003e从样本构造什么\u003c/th\u003e\n\u003cth\u003e据此怎样确定参数\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e观测处的密度及联合似然 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∏\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/td\u003e\n\u003ctd\u003e最大化联合似然，或求解、修正其得分方程\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003e经验分布、概率图坐标、CDF间距或各观测反推的尺度\u003c/td\u003e\n\u003ctd\u003e按分布差异、回归残差、间距评分或尺度一致性选择参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e统计关系反演\u003c/td\u003e\n\u003ctd\u003e矩、分位数、次序统计量等样本特征 \u003cspan\nclass=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/td\u003e\n\u003ctd\u003e将样本特征接到理论关系 \u003cspan\nclass=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，通过匹配、消元、反演或条件线性组合恢复参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e后验推断\u003c/td\u003e\n\u003ctd\u003e样本似然与先验形成的后验 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e∝\u003c/mo\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/td\u003e\n\u003ctd\u003e按后验均值、中位数或MAP等决策规则给出估计\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e学习映射\u003c/td\u003e\n\u003ctd\u003e多组训练样本的特征与对应参数\u003c/td\u003e\n\u003ctd\u003e从训练数据学习映射 \u003cspan\nclass=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，再将新样本特征输入映射得到参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e例如，同一组排序寿命可以进入似然，也可以转成概率图坐标或矩。路线的区别在于：似然方法评价候选参数下的样本密度，分布匹配评价样本与理论分布的一致程度，统计关系反演则从可计算的样本特征恢复参数。后验推断进一步引入先验与后验决策，学习映射则借助多组训练样本形成估计函数。\u003c/p\u003e\n\u003cp\u003eLSPF／LPF先构造不变统计量，再最大化其联合密度，因此同时联系统计量构造与似然准则；地图把它们放在统计量构造的主要位置，并将具体准则连回统计量似然。\u003c/p\u003e\n", "hash": "9a88dc985f186cbcba298fc0a5f24e54a868f125ae4b0e0272a84b921f571582"}, {"id": "section-2-image-1", "kind": "image", "src": "assets/06-完整机理地图-五簇分类与方法关系.svg", "alt": "图2　分类后：五簇工作地图与方法关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-2-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图2｜方法的估计依据与具体关系。\u003c/strong\u003e\n各区域入口给出统计对象和参数确定原则；区域内外的线连接具体方法，标明扩展、修正、数学联系或借用的参数步骤。金色节点对应本次比较的七种实现。\u003c/p\u003e\n", "hash": "639783556350a81052129916588e5ae6d3604c5dd9efcde3dd2f786fd4bd216b"}]}], "content_hash": "c4c3235623f3feb4956159d11199fc60390c125bbe4efb261f036702e82f5e78"}, {"id": "section-3", "title": "3　似然估计路线：从观测密度及其联合贡献出发", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-3-current", "label": "当前报告内容", "blocks": [{"id": "section-3-text-0", "kind": "text", "html": "\u003cp\u003e这条路线使用观测处的密度及其联合贡献，把候选参数放进模型后比较样本的似然。参数由最大化联合似然或求解由似然导出的得分关系确定。后续方法通过调整权重、替换位置方程、处理边界项或引入偏差修正，形成不同的估计方案。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e观测处的密度、联合密度、删失或支持边界信息\u003c/td\u003e\n\u003ctd\u003e最大化联合似然，或求解似然得分方程\u003c/td\u003e\n\u003ctd\u003e方程加权、位置关系替换、边界约束、Firth型修正、局部候选与数值搜索\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eMLE、WMLE、Cohen–Whitten MMLE、K–R\nMMLE、CMLE、DMMLE和罚似然的差别，集中在似然项、估计方程和位置处理上。PSO、模拟退火和差分进化用于搜索似然目标时，承担其中的数值求解环节。\u003c/p\u003e\n", "hash": "74a363bce7cb26b0f7f26aa36503a97da8d046bde70f2821628d95eded12b1c1"}, {"id": "section-3-flow-07-image", "kind": "image", "src": "assets/07-似然估计路线-信息处理流程.svg", "alt": "图3a　似然估计路线的信息处理流程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-3-flow-07-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图3a｜沿观测点的密度贡献理解似然估计。\u003c/strong\u003e\n同一组观测在不同候选密度曲线上得到不同高度，把全部观测的密度贡献相乘形成联合似然，再比较候选参数的整体贡献。步骤编号分别对应观测与位置处理、单点贡献、联合目标及参数求解，后续方法的差异可以落到相应环节。\u003c/p\u003e\n", "hash": "0a7f1d989a2ab89f3e7d110d18642ebd143131d2dd406a0fc9bfe30c2b01c1a0"}, {"id": "section-3-image-1", "kind": "image", "src": "assets/01-似然估计路线-机制图.svg", "alt": "图3b　似然估计路线机制图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-3-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图3b｜从密度贡献到求解方程及其改动位置。\u003c/strong\u003e\n上部展示各观测处的密度怎样相乘形成似然，再取对数、求导并由尺度方程消去η。下部在具体接口上展开：K–R平移和删除最小观测，DMMLE修正修改数据后的得分，WMLE给方程加权，Cohen–Whitten替换位置关系，CMLE替换最小值项，罚似然增加目标因子。\u003c/p\u003e\n", "hash": "d2a9e4ef4476ed65fc30d236eb928f2ed63352972e7f9280027323a8051faf48"}]}], "content_hash": "0c5ce591cbfa42210cb79177fd60125aa6ef7187844eb418e5b2615926dfb831"}, {"id": "section-4", "title": "4　分布匹配路线：比较理论分布和样本呈现的分布关系", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-4-current", "label": "当前报告内容", "blocks": [{"id": "section-4-text-0", "kind": "text", "html": "\u003cp\u003e这条路线把理论分布与样本的分布形态、概率图关系、概率间距或反推尺度放在一起比较，依据匹配程度确定参数。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e经验CDF、概率图分数、相邻概率间距、各观测反推的尺度伪估计\u003c/td\u003e\n\u003ctd\u003e最小化分布差异、残差或距离；最大化概率间距评分；或让尺度伪估计更一致\u003c/td\u003e\n\u003ctd\u003e分数选择、位置定位、回归方向、分组方式、梯度阈值和固定偏移\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e概率图、LSE／WLSE、最小距离估计、MPS／QMP和MDM属于这条路线。其中，概率图回归比较变换后的回归关系，最小距离估计比较分布差异，MPS／QMP利用概率间距评分，MDM比较各观测反推尺度的一致性。\u003c/p\u003e\n", "hash": "91f76d9e84e0e5fa6bc127d42527406cb1dbf7c39009b0abc544db2d63397d5a"}, {"id": "section-4-flow-08-image", "kind": "image", "src": "assets/08-分布匹配路线-信息处理流程.svg", "alt": "图4a　分布匹配路线的信息处理流程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-4-flow-08-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图4a｜以CDF差异展示分布匹配的基本过程。\u003c/strong\u003e\n从样本概率点看经验分布，将候选理论曲线叠加，逐点读出偏离，再合成整组差异并比较候选参数。概率图、MPS与MDM改变的是被比较的表示、评分或参数恢复步骤，具体关系在下方细图展开。\u003c/p\u003e\n", "hash": "9cd47fb00ec35b89b7f45fa87a40c00872d183c1e5097ee6bceceb5858f279bc"}, {"id": "section-4-image-1", "kind": "image", "src": "assets/02-分布匹配路线-机制图.svg", "alt": "图4b　分布匹配路线机制图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-4-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图4b｜同一分布关系形成不同的匹配过程。\u003c/strong\u003e\n概率图部分把White／Soman的水平残差与Park的竖直残差并置，展示分数选择、位置评分和回归方向怎样共同决定参数。MPS比较CDF纵轴上的相邻概率间距；MDM先在给定位置下选择使尺度差异最小的形状，再沿该条件最优值曲线按梯度定位，最后以伪尺度均值恢复尺度。\u003c/p\u003e\n", "hash": "360f1ec0c1009bddbd9b702504ef82832233c649ddcdf826d3feda87e541d8d9"}]}], "content_hash": "6dbc218abc9ce7fc87f0e313b1653e4880035b0446aad3ee4f379810bb2418f8"}, {"id": "section-5", "title": "5　统计关系反演路线：从理论统计关系恢复参数", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-5-current", "label": "当前报告内容", "blocks": [{"id": "section-5-text-0", "kind": "text", "html": "\u003cp\u003e这条路线先选取样本矩、分位数、次序统计量、不变统计量或其他可计算特征，再建立它们与总体参数之间的理论关系，最后用匹配、消元或反解恢复参数。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e样本矩、概率加权矩、L矩、分位数、次序统计量、不变统计量\u003c/td\u003e\n\u003ctd\u003e匹配理论统计关系，或反演矩、枢轴关系和条件线性关系\u003c/td\u003e\n\u003ctd\u003e权重和端部处理、位置与尺度消元、条件协方差选权、显式恢复和迭代代入\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eMM、PWM、L矩、TL矩、分位数和次序统计量方法属于这里。LSPF／LPF利用不变统计量及其联合密度和恢复方程确定参数；线性最小方差估计在给定参数或代入条件下，利用条件协方差确定组合权重。\u003c/p\u003e\n", "hash": "b50ac3fbecaf1bef76359a8e0dad792f0e62b2efda216d081ca76ca5813f2b10"}, {"id": "section-5-flow-09-image", "kind": "image", "src": "assets/09-统计关系反演路线-信息处理流程.svg", "alt": "图5a　统计关系反演路线的信息处理流程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-5-flow-09-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图5a｜以常规矩展示从分布特征到参数的反演。\u003c/strong\u003e\n用样本分布形态识别可计算特征，通过平移和尺度消元保留形状信息，再把样本特征接到理论关系上确定形状，随后恢复尺度和位置。Cran、W／V与条件选权在统计表示、确定准则或恢复环节形成不同构造。\u003c/p\u003e\n", "hash": "5e4b963ce74b3f55f7dbd9b8ac9043b2a5785400966dfe292cc3dc9a1b660419"}, {"id": "section-5-image-1", "kind": "image", "src": "assets/03-统计关系反演路线-机制图.svg", "alt": "图5b　统计关系反演路线机制图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-5-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图5b｜从理论关系中逐步消去、恢复未知参数。\u003c/strong\u003e\n常规矩法用偏度消去位置和尺度，再由方差、均值恢复；Cran改用生存曲线积分及矩差显式反解；PWM、L矩与TL矩改变统计量的样本权重。W统计量同时消去位置和尺度，V统计量只消去位置：LPF先联合估计尺度与形状，随后保留形状并按恢复方程重估其余参数。条件位置MVLUE则根据协方差选择线性组合权重。\u003c/p\u003e\n", "hash": "fba5ca9d640badbeca4cca0ace12171bc8e7015e370b271accc6a8c43e4abf1f"}]}], "content_hash": "a2b26a2a49bfe03095763ac1364c11020b10b3d59e180c70d7f7d344dee5f61e"}, {"id": "section-6", "title": "6　后验推断与学习映射", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-6-current", "label": "当前报告内容", "blocks": [{"id": "section-6-text-0", "kind": "text", "html": "\u003cp\u003e后验推断把样本似然和参数先验结合成后验分布，再按后验均值、中位数或MAP等规则给出估计。Gibbs、Laplace和MH用于计算或近似后验。\u003c/p\u003e\n\u003cp\u003e学习映射通过训练样本或模拟数据学习从样本特征到分布参数的估计函数，代表方法包括ANN和BPNN。特征表示决定输入哪些样本信息，损失函数引导参数映射的学习，训练域与校准共同影响外推表现。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e扩展范式\u003c/th\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e后验推断\u003c/td\u003e\n\u003ctd\u003e样本似然信息＋参数先验\u003c/td\u003e\n\u003ctd\u003e后验规则，如均值、中位数或MAP\u003c/td\u003e\n\u003ctd\u003e后验计算、抽样、近似和先验敏感性\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e学习映射\u003c/td\u003e\n\u003ctd\u003e训练样本、模拟样本和样本特征\u003c/td\u003e\n\u003ctd\u003e学习特征到三个参数的映射\u003c/td\u003e\n\u003ctd\u003e训练域、损失函数、校准和外推边界\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n", "hash": "056c3d13fe9598926a903da3c4d15560d884fa36dee9a4602b9aab33a49ffdf9"}, {"id": "section-6-flow-10-image", "kind": "image", "src": "assets/10-后验推断路线-信息处理流程.svg", "alt": "图6a　后验推断路线的信息处理流程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-flow-10-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图6a｜由支持曲线到后验，再按估计规则作判断。\u003c/strong\u003e\n似然和先验分别支持不同的候选区域，乘积归一化后形成后验。图中以平方损失为例，用后验平均损失的最低点说明为何选择后验均值；中位数与MAP使用各自的规则。\u003c/p\u003e\n", "hash": "4185ff6599c7a44ecd7b603c7d86ab0d24e0434b1e9ca8418ba8ab192d1d555c"}, {"id": "section-6-image-1", "kind": "image", "src": "assets/04-后验推断路线-机制图.svg", "alt": "图6b　后验推断路线机制图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-figure-6-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图6b｜联合后验、输出规则与计算过程。\u003c/strong\u003e\n似然、先验和支持域共同确定联合后验；后验均值、中位数及MAP选择不同的输出量。条件抽样通过β、η、γ的循环更新形成后验样本，Laplace则通过后验峰附近的二次近似计算积分，两种路径服务于所选后验量。\u003c/p\u003e\n", "hash": "687c2ef2b4c5aaacbaa3bc7d75909674865b5f71f53a1ffa5258b9066da73ba5"}, {"id": "section-6-flow-11-image", "kind": "image", "src": "assets/11-学习映射路线-信息处理流程.svg", "alt": "图7a　学习映射路线的信息处理流程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-flow-11-caption", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图7a｜用特征、映射和误差反馈理解学习估计。\u003c/strong\u003e\n统一表示的样本特征进入共享映射，参数预测与对应真值逐项比较，误差合成训练目标并反馈到权重更新。训练结束后固定映射，再用于新样本；步骤编号对应特征、映射和训练准则的不同改动。\u003c/p\u003e\n", "hash": "5f410f865cf5d00267264aab1bd945aa2c156b51c06b35f65fabe0ff2722e877"}, {"id": "section-6-image-2", "kind": "image", "src": "assets/05-学习映射路线-机制图.svg", "alt": "图7b　学习映射路线机制图", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-text-3", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图7b｜训练与使用分开看。\u003c/strong\u003e\n训练阶段比较多组样本的参数预测和真值，按损失更新网络权重；使用阶段保持映射固定，将新样本的同类特征转成三个参数。图下部标出直接预测参数、学习统计估计器的中间量以及搜索当前样本目标的不同作用位置。\u003c/p\u003e\n", "hash": "d0f4dcf7bc848538f38e165ffc608027ab5f806acb060823b4cf0dd4c55a36a1"}]}], "content_hash": "33c6f388f6a6c96958618fc6472151477f9720529419ff427207e63564b0ae67"}, {"id": "section-7", "title": "7　完整机理地图：分类与方法间关系同时保留", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-7-current", "label": "当前报告内容", "blocks": [{"id": "section-7-text-0", "kind": "text", "html": "\u003cp\u003e地图中的区域回答“方法依据什么估计”，方法节点之间的连线回答“前后两个构造改变了什么”。例如，Jacquelin二参数推导扩展为三参数WMLE，随后再引入形状偏差修正，构成一条连续改进链；K–R的数据修改构造与Firth得分修正共同进入DMMLE，构成两个来源汇合的组合。完整地图中的关系分为三种：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e沿袭或扩展：\u003c/strong\u003e\n原文明确沿用、扩展或修正前一构造时使用实线。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e数学联系或共享构造：\u003c/strong\u003e\n两种方法共享CDF、矩、似然或统计量时使用虚线。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e局部借用或组合：\u003c/strong\u003e\n一个方法只借用了另一条路线的位置处理、统计量或参数恢复步骤时使用点划线。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e沿着这些关系，可以看到Jacquelin二参数推导向Cousineau\nWMLE及后续形状修正的扩展；Smith删最小值构造在K–R中的场景适配；K–R与Firth型修正形成DMMLE；White向Soman三参数概率图的扩展；MPS与QMP在特定分组设置下的特例关系；PWM与L矩的数学联系；以及LSPF向LPF的构造改进。MLE与MAP通过似然模型相连，MAP进一步引入先验和后验决策；PSO、模拟退火等工具则连接到各自搜索的目标。\u003c/p\u003e\n", "hash": "e9852d9d6da92a6e17f9a8cb88e3467a3c779c292c5b6408bbd723130c657187"}, {"id": "section-7-image-1", "kind": "image", "src": "assets/06-完整机理地图-五簇分类与方法关系.svg", "alt": "图8　完整机理地图：五簇分类与方法关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-7-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图8｜完整机理地图。\u003c/strong\u003e\n沿Jacquelin→WMLE→形状修正、White→Soman、L矩→TL矩、LSPF→LPF等方法链，可以看到具体构造的延续；沿LSPF→Yang迭代、WMLE→MVLE-H扩展，以及Park定位→二参数MLE组合等连线，可以看到某个参数步骤怎样被另一方法借用。PWM与L矩、Cran矩与PWM、MPS与QMP的虚线记录数学联系，成立条件写在线旁。Soman与Park连线比较同分数、同位置时的回归方向关系，两文的实际分数选择各异。\u003c/p\u003e\n", "hash": "109b1637b3bc396c14fd666e82061adb078890776a655dcea16ed3755b2bf7cd"}]}], "content_hash": "ca858998e8bbda9b68dba1ccc68599ad07450f185623d9e03e07833c7253c5fb"}, {"id": "section-8", "title": "8　本轮七种实现落在哪些位置", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-8-current", "label": "当前报告内容", "blocks": [{"id": "section-8-text-0", "kind": "text", "html": "\u003cp\u003e本次统一比较选取七种实现，覆盖似然估计、分布匹配和统计关系反演三条路线。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e实现\u003c/th\u003e\n\u003cth\u003e五簇主要归属\u003c/th\u003e\n\u003cth\u003e具体构造定位\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMLE\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e原始观测密度联合似然；另记录局部候选、边界与失败\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWMLE\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e在估计方程中引入三个权重\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMMLE（K–R单样本形式）\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e以样本最小值定位并删除该观测后估计其余参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLSE（Soman主分支）\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003eWhite分数、位置评分和对数寿命对分数回归\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLRE（Park Proposed+Plot）\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003e相关系数定位、绘图概率分数和分数对对数寿命回归\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMDM-0.1\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003e条件尺度伪估计差异、梯度阈值定位和固定偏移\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMM（Cran式）\u003c/td\u003e\n\u003ctd\u003e统计关系反演\u003c/td\u003e\n\u003ctd\u003eWeibull矩及矩差显式恢复参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这三组实现形成构造对照：MLE、WMLE和K–R对应似然、方程加权与最小值定位；LSE、LRE和MDM对应分布关系匹配的不同分支；MM对应统计关系的显式恢复。\u003c/p\u003e\n", "hash": "e69892ca888db9ca080ee3aec138da1bbb6d6898ea4a208405a1f7bdbb2eedf8"}]}], "content_hash": "a572f319b966081988be6654ae71fa02eb127a10f74fc01275b0eb489db2617e"}, {"id": "section-9", "title": "9　转入统一性能比较", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-9-current", "label": "当前报告内容", "blocks": [{"id": "section-9-text-0", "kind": "text", "html": "\u003cp\u003e后续结果将回到这些具体构造：出现偏差时检查位置处理、统计量构造和参数恢复；出现波动或异常时检查信息保留和求解环节。\u003c/p\u003e\n\u003cp\u003e第二部分将在共同抽样条件下比较这七种实现，分析性能差异怎样随样本量与形状参数变化，并结合地图中的具体构造解释典型表现。\u003c/p\u003e\n\u003cp\u003e——转入\u003ca\nhref=\"assets/source-comparison-report.md\"\u003e报告下（方法对比）v0.4\u003c/a\u003e。\u003c/p\u003e\n", "hash": "a4fcb9b348e20d109f15f84fc5b044e696a0159689812147eb9445e58d59a322"}]}], "content_hash": "cfa47b65392588a71ad8f29a0bf784f2c68a1e20aaf94e0453acffed467f8434"}, {"id": "references", "title": "文献与源文件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "references-current", "label": "当前报告内容", "blocks": [{"id": "references-text-0", "kind": "text", "html": "\u003cul\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-method-workdraft.md\"\u003e方法分类工作稿\u003c/a\u003e：逐篇维护信息利用、参数原则、实现改进、关系证据和边界。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-yang-classification.md\"\u003eYang综述的八类分类\u003c/a\u003e：保留综述原始分类与名称辨析。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-research09-routes.md\"\u003eResearch09的四条路线\u003c/a\u003e：保留已有路线归纳及其局限。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/mechanism-map-index.md\"\u003e机制图-v1.1目录\u003c/a\u003e：五类机制图、完整机理地图、draw.io源文件和静态预览图；公式采用LaTeX标准排版，英文及数学变量使用Times New Roman，制图规则见该目录说明。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-experiment-settings.md\"\u003e实验设置\u003c/a\u003e：统一比较对象、计算版本和数据合同。\u003c/li\u003e\n\u003c/ul\u003e\n", "hash": "c7740784b5d3440a132b9d622e13ef7d87826291da6f4a427e0f8bea7b04bb7c"}]}], "content_hash": "96a06575aee0482cd1667d6c85ac65c49a978a70b5317ce8b292e596ce7a208f"}], "last_applied_submission_id": "a663986b-d6cd-42ad-8b42-d8142b43de4e", "review_complete": false, "last_rendered_submission_id": "a663986b-d6cd-42ad-8b42-d8142b43de4e"}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;
try{sidebarVisible=(localStorage.getItem(sidebarKey())??localStorage.getItem(`review-html:${board.id}:sidebar-pinned`))==='true'}catch{}
function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}
function toggleSidebar(){sidebarVisible=!sidebarVisible;try{localStorage.setItem(sidebarKey(),String(sidebarVisible))}catch{}syncSidebar()}
function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}

  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }const state=draft.units[unit.id];if(state.section_note)sidebarNote({kind:'section-note',unit_id:unit.id,quote:unit.title},state.section_note);for(const [option_id,comment] of Object.entries(state.notes||{})){if(comment)sidebarNote({kind:'option-note',unit_id:unit.id,option_id,quote:unit.options.find(o=>o.id===option_id)?.label||unit.title},comment)}for(const note of state.block_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id);if(block)sidebarNote({...note,kind:'block-note',unit_id:unit.id,quote:block.alt||(block.kind==='visual'?'表格或图表':unit.title)},note.comment)}for(const note of state.image_notes||[]){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),slide=block?.images?.find(i=>i.id===note.image_id);if(slide)sidebarNote({...note,kind:'image-note',unit_id:unit.id,quote:slide.label},note.comment)}}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id],ids=isContent(u)?[]:selectionIds(d);return {unit_id:u.id,selected_option_id:ids.length===1?ids[0]:null,selected_option_ids:ids,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,section_note:d.section_note||'',block_notes:d.block_notes||[],image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive')return board.archive_plan?.trim()||`《${board.title}》尚未填写具体落地安排。\n请先依据任务约定明确正式成果的目标路径、更新方式或版本、旧版去向及相关引用更新，再执行落地。\nHTML、素材及审阅记录随任务保留，不能代替正式成果的更新。`;
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_ids.length||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length||item.section_note||item.block_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_ids.length){lines.push(`选择：${item.selected_option_ids.map(id=>unit.options.find(o=>o.id===id).label).join('、')}`);for(const id of item.selected_option_ids){const option=unit.options.find(o=>o.id===id);lines.push(option.label,option.blocks.map(blockText).join('\n'))}}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  if(item.section_note)lines.push(`本节备注：${item.section_note}`);
  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if(pending.kind==='divergence'||$('editor-input').value.trim())saveNote();else closeEditor()}
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
