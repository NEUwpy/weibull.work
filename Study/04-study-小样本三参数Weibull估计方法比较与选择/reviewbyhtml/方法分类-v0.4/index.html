r(--line);padding:10px 6px;vertical-align:top}.block th{font-weight:600;color:var(--muted)}.choice-row{min-height:48px;border-top:1px solid #f0f2ef;display:flex;align-items:center;justify-content:center;position:relative}.dot{display:grid;place-items:center;width:48px;height:46px;cursor:pointer}.dot input{appearance:none;width:19px;height:19px;border:1.5px solid #a6b2a9;border-radius:50%;margin:0;cursor:pointer;display:grid;place-content:center}.dot input:checked{border-color:var(--accent)}.dot input:checked:after{content:"";width:9px;height:9px;background:var(--accent);border-radius:50%}.note{padding:0 16px 8px}.note summary{font-size:12px;color:var(--muted);list-style:none;text-align:right}.note summary::-webkit-details-marker{display:none}.note textarea{margin-top:8px}.note:has(textarea:not(:placeholder-shown)) summary{color:var(--accent)}textarea{width:100%;resize:vertical;min-height:86px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:#fff;color:var(--ink);line-height:1.6}.comment-rail{display:none;padding-top:32px}.has-comments .comment-rail{display:block}.annotation{background:#fff;border:1px solid var(--line);border-radius:9px;margin:0 0 12px;padding:13px 14px;font-size:13px}.quote{border-left:2px solid #b5caba;padding-left:9px;color:var(--muted);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:74px;overflow:auto}.annotation p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.annotation-tools{display:flex;justify-content:flex-end;gap:9px}.quiet{font-size:12px;color:var(--muted);padding:2px 0}.quiet:hover{color:var(--accent)}#editor{position:fixed;z-index:10;width:285px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px #243d2824;padding:15px;right:24px}#editor[hidden]{display:none}#editor textarea{margin-top:12px}.editor-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:9px}.save{color:var(--accent);font-weight:600}.history{margin:26px 0;color:var(--muted); <script id="initial-board" type="application/json">{"id": "study04-method-classification-v04-report", "title": "Study04 方法分类报告 v0.4 审阅", "document": true, "revision": 1, "require_confirmation": true, "archive_plan": "审阅确认后，将最终意见落实到 Study/04-study-小样本三参数Weibull估计方法比较与选择/报告上（方法分类）-v0.4.md；必要时同步 Study04/README.md 与 方法分类/README.md 的当前入口；旧版继续保留在 其他/历史版本/；保留本任务 HTML、素材和批注记录，并在核验链接后提交 Git。", "units": [{"id": "opening", "title": "报告说明", "mode": "content", "state": "open", "selected": null, "options": [{"id": "opening-current", "label": "当前报告内容", "blocks": [{"id": "opening-text", "kind": "text", "html": "\u003ch1\nid=\"三参数weibull参数估计方法的分类与相互关系\"\u003e三参数Weibull参数估计方法的分类与相互关系\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e报告上（方法分类）v0.4｜更新：2026-10-21\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e魏鹏宇｜东北大学机械工程与自动化学院\u003c/p\u003e\n\u003cp\u003e分会场3：装备寿命与可靠性评估\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e本版采用“三条经典统计路线＋两种扩展估计范式”的新工作骨架。旧版内容已归档；本版只保留新骨架、五类机制图和完整关系地图。机制图源文件全部使用\ndraw.io 格式。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e各位老师、各位同学，大家好！我是东北大学机械工程与自动化学院的在读博士生魏鹏宇。今天汇报的题目是《小样本三参数Weibull参数估计方法的比较与选择》。\u003c/p\u003e\n\u003cp\u003e这次汇报分为两部分。首先回答现有方法为什么不同、又为什么彼此有关：先按样本信息利用和参数确定原则组织方法地图，再梳理方法之间的沿袭、借用、组合和数学联系。然后把代表方法放到统一条件下比较，分析这些构造差异怎样表现为小样本下的偏差、波动和异常风险。\u003c/p\u003e\n", "hash": "e6e04f5daf603d26a7acd9aef6948fd3ae82d56c17704e5d6f185a2ba20c6823"}]}], "content_hash": "ad88957410b960cf6129ffdac38576c737520a08bb3c6c437f515341b3f90aef"}, {"id": "section-1", "title": "1　先把每个方法的三个问题分开", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-1-current", "label": "当前报告内容", "blocks": [{"id": "section-1-text", "kind": "text", "html": "\u003cp\u003e一个估计方法至少要回答三个问题：\u003c/p\u003e\n\u003col type=\"1\"\u003e\n\u003cli\u003e\u003cstrong\u003e利用样本中的什么信息？\u003c/strong\u003e\n例如观测密度、经验分布、概率间隔、矩、分位数、次序统计量、不变统计量或样本特征。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e通过什么原则把这些信息转化为三个参数的估计值？\u003c/strong\u003e\n例如最大化联合似然、匹配分布结构、最小化偏离、匹配理论统计关系、反演枢轴关系、更新后验或学习参数映射。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e实现与改进发生在哪里？\u003c/strong\u003e\n例如加权、偏差修正、位置处理、约束、数值优化、交替求解和混合估计。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e前两个问题决定方法在地图中的主要归属，第三个问题作为横向标签。一个方法可以和多个区域存在共享构造或组合关系，但要有一个主要入口；跨区域联系用关系线表达。\u003c/p\u003e\n", "hash": "dc7a322233d622d9b61729a0c26d63854c50b76196cc7ae6a1364822a2e6347a"}]}], "content_hash": "4459e37462433c4bf4898453b2ef82e8baae3a2c7ae395997886d0b7a6c2ca8a"}, {"id": "section-2", "title": "2　五簇工作骨架", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-2-current", "label": "当前报告内容", "blocks": [{"id": "section-2-text", "kind": "text", "html": "\u003cp\u003e当前报告用三条经典统计路线和两种扩展估计范式组织方法：\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003e三参数 Weibull 参数估计\n├─ 三条经典统计路线\n│  ├─ 似然估计\n│  ├─ 分布匹配\n│  └─ 统计关系反演\n├─ 两种扩展估计范式\n│  ├─ 后验推断\n│  └─ 学习映射\n└─ 横向关系：加权、偏差修正、位置处理、数值求解、组合与局部借用\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e这五簇是服务于短报告的方法地图，不宣称所有类别在统计学上完全平行，也不取代逐篇文献核对。\u003c/p\u003e\n\u003ch3 id=\"21-似然估计路线\"\u003e2.1 似然估计路线\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e一句话原理：\u003c/strong\u003e\n以样本在模型下的联合密度或由其得到的得分关系为依据，寻找能够解释观测数据的参数。\u003c/p\u003e\n\u003cp\u003e样本信息是观测处的密度及其联合贡献；参数原则是最大化似然，或在似然得分方程上做有明确来源的修正。MLE、WMLE、Cohen–Whitten\nMMLE、K–R\nMMLE、CMLE、DMMLE和罚似然都要按具体构造区分。PSO、模拟退火和差分进化若只是搜索同一似然目标，属于求解标签。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/01-似然估计路线-机制图.drawio\"\u003e机制图：似然估计路线\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"22-分布匹配路线\"\u003e2.2 分布匹配路线\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e一句话原理：\u003c/strong\u003e\n比较理论分布与样本呈现的分布形态、概率图关系或概率间隔，选择二者最一致的参数。\u003c/p\u003e\n\u003cp\u003e概率图、LSE／WLSE、最小距离估计、MPS／QMP和MDM放在这条路线下。概率间距是分布匹配中的分支；MDM比较各观测反推尺度的一致性，不能与普通概率图回归混为同一具体估计器。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/02-分布匹配路线-机制图.drawio\"\u003e机制图：分布匹配路线\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"23-统计关系反演路线\"\u003e2.3 统计关系反演路线\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e一句话原理：\u003c/strong\u003e\n建立样本矩、分位数、次序统计量或其他统计特征与总体参数之间的理论关系，再匹配或反解参数。\u003c/p\u003e\n\u003cp\u003eMM、PWM、L矩、TL矩、分位数和次序统计量方法属于这里。LSPF／LPF等不变统计量方法需按其实际统计量和后续似然或恢复方程说明。线性最小方差估计作为条件性估计量构造放在这条路线下，必须保留其已知参数或代入条件。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/03-统计关系反演路线-机制图.drawio\"\u003e机制图：统计关系反演路线\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"24-后验推断路线\"\u003e2.4 后验推断路线\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e一句话原理：\u003c/strong\u003e\n将样本信息与参数先验结合形成后验分布，再按后验规则给出估计。\u003c/p\u003e\n\u003cp\u003e后验均值、后验中位数和MAP是不同输出规则；Gibbs、Laplace、MH等首先是后验计算方式。后验路线可以共享似然模型，但不等同于MLE。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/04-后验推断路线-机制图.drawio\"\u003e机制图：后验推断路线\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"25-学习映射路线\"\u003e2.5 学习映射路线\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e一句话原理：\u003c/strong\u003e\n通过训练样本或模拟数据学习从样本特征到分布参数的估计函数。\u003c/p\u003e\n\u003cp\u003eANN、BPNN和直接学习参数映射属于这里。训练域、特征表示、损失函数、外推和校准都是方法边界的一部分。用于搜索既定统计目标的智能优化算法仍按其实际目标归属。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/05-学习映射路线-机制图.drawio\"\u003e机制图：学习映射路线\u003c/a\u003e\u003c/p\u003e\n", "hash": "79025e26db17f7be2e69f0a53582717b3f6f10e16294fafca5d19ddf59a55534"}]}], "content_hash": "f759a5070dbbc2edfde11c8a67b80af171b64c8112affc817a1fcfd4fb3fc6d5"}, {"id": "section-3", "title": "3　完整机理地图：分类与方法关系", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-3-current", "label": "当前报告内容", "blocks": [{"id": "section-3-text", "kind": "text", "html": "\u003cp\u003e完整地图把五个工作簇、代表方法、沿袭关系、数学联系、局部借用、组合节点和求解工具放在同一张图中。连线含义分开标注：实线表示作者明示或构造对照支持的沿袭／扩展；虚线表示数学联系或共享构造；点划线表示局部借用或组合。\u003c/p\u003e\n\u003cp\u003e\u003ca\nhref=\"assets/06-完整机理地图-五簇分类与方法关系.drawio\"\u003e完整机理地图：五簇分类与方法关系\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e图中需要重点讲清的关系包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eJacquelin二参数推导 → Cousineau WMLE → 形状偏差修正；\u003c/li\u003e\n\u003cli\u003eSmith删最小值构造 → K–R场景适配；K–R与Firth修正共同形成DMMLE；\u003c/li\u003e\n\u003cli\u003eWhite →\nSoman概率图分支；概率图评分与Park相关系数在特定条件下存在数学对应；\u003c/li\u003e\n\u003cli\u003eMPS与QMP在特定分组设置下的特例关系；\u003c/li\u003e\n\u003cli\u003ePWM与L矩的数学联系，以及TL矩对端部信息的处理；\u003c/li\u003e\n\u003cli\u003eLSPF → LPF的构造改进，以及位置修正被其他组合方法局部借用；\u003c/li\u003e\n\u003cli\u003eMLE与MAP共享似然模型，但后验还引入先验与后验决策规则；\u003c/li\u003e\n\u003cli\u003ePSO、模拟退火等连接到它们实际搜索的目标，不单独形成新的估计原理。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这些关系只在原文引用、公式、估计步骤或明确数学对照支持的范围内表达；同名、共同动机和相似算法名称不足以构成沿袭证据。\u003c/p\u003e\n", "hash": "d4373014aad542dd8461c25faeef24baaaebb0a30c04087d2484525c53ad797d"}]}], "content_hash": "b5c8ceef14361bcc881996e7d16d2f17ceeadda397c67a3ef395e4acc1fb0fef"}, {"id": "section-4", "title": "4　横向改进：方法为什么不断增加", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-4-current", "label": "当前报告内容", "blocks": [{"id": "section-4-text", "kind": "text", "html": "\u003cp\u003e五簇主干说明方法主要依据什么确定参数；横向标签说明研究者针对什么困难改动了哪个环节。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e改进位置\u003c/th\u003e\n\u003cth\u003e典型问题\u003c/th\u003e\n\u003cth\u003e可能的改动\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e位置与支持边界\u003c/td\u003e\n\u003ctd\u003e未知位置改变样本支持区间，似然可能出现非正则行为\u003c/td\u003e\n\u003ctd\u003e替换位置关系、最小值定位、删点、消元、边界约束\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e有限样本偏差\u003c/td\u003e\n\u003ctd\u003e形状或位置存在系统偏移\u003c/td\u003e\n\u003ctd\u003e方程加权、得分修正、估计后偏差修正\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e信息保留与加权\u003c/td\u003e\n\u003ctd\u003e端部观测、次序统计量或尺度信息使用不平衡\u003c/td\u003e\n\u003ctd\u003e改变权重、矩构造、统计量和回归方向\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数值求解\u003c/td\u003e\n\u003ctd\u003e非线性方程、局部极值或搜索范围导致返回不稳定\u003c/td\u003e\n\u003ctd\u003e条件求解、初值、位置搜索、全局优化、失败回退\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e跨路线组合\u003c/td\u003e\n\u003ctd\u003e单一构造不能同时处理所有参数\u003c/td\u003e\n\u003ctd\u003e先估形状再恢复位置尺度、似然与矩关系组合、后验或学习加入经典骨架\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这些改动不自动改变方法的主要归属。需要先判断它改变的是样本信息、参数确定原则，还是实现与求解过程。\u003c/p\u003e\n", "hash": "fab4137cb1604601d23252915a067b91fd83892c978698b1b576450b1d26f1bc"}]}], "content_hash": "df6e109c7280f1500522871a115ab195110ece1ee08b7c15b05e3320b47d8700"}, {"id": "section-5", "title": "5　本轮七种实现的主要归属", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-5-current", "label": "当前报告内容", "blocks": [{"id": "section-5-text", "kind": "text", "html": "\u003cp\u003e本轮统一比较的七种实现集中在三条经典统计路线，未覆盖后验推断和学习映射：\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e实现\u003c/th\u003e\n\u003cth\u003e五簇主要归属\u003c/th\u003e\n\u003cth\u003e具体构造定位\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMLE\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e原始观测密度联合似然；当前实现另记录局部候选、边界与失败。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWMLE\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e在估计方程中引入三个权重。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMMLE（K–R单样本形式）\u003c/td\u003e\n\u003ctd\u003e似然估计\u003c/td\u003e\n\u003ctd\u003e以样本最小值定位并删除该观测后估计其余参数。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLSE（Soman主分支）\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003eWhite分数、位置评分和对数寿命对分数回归。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLRE（Park Proposed+Plot）\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003e相关系数定位、绘图概率分数和分数对对数寿命回归。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMDM-0.1\u003c/td\u003e\n\u003ctd\u003e分布匹配\u003c/td\u003e\n\u003ctd\u003e条件尺度伪估计差异、梯度阈值定位和固定偏移。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMM（Cran式）\u003c/td\u003e\n\u003ctd\u003e统计关系反演\u003c/td\u003e\n\u003ctd\u003eWeibull矩及矩差显式恢复参数。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这七种实现是统一性能比较的代表样本，不代表五个工作簇都已完成同等规模的实验。性能排序由共同样本和评价口径决定，不能由分类图直接推出。\u003c/p\u003e\n", "hash": "0dc69c6f330492cc265d5beb14b82aeef183082de67a7e4bfa10cd3d548bd718"}]}], "content_hash": "0516b4bab68b9ceb728154ff63a96067a2db67226774276e27818d16aaf215a1"}, {"id": "section-6", "title": "6　转入统一性能比较", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-6-current", "label": "当前报告内容", "blocks": [{"id": "section-6-text", "kind": "text", "html": "\u003cp\u003e不同方法从样本中提取的信息不同，确定参数的原则不同，改进和求解环节也不同。因此，它们在小样本下可能表现出不同的偏差、波动、异常输出和失败风险。\u003c/p\u003e\n\u003cp\u003e第二部分将在固定的共同抽样条件下比较七种已核验实现，分析这些差异怎样随样本量与形状参数变化，并回到本地图中的具体构造解释典型表现。方法地图提供解释入口，统一实验负责检验性能。\u003c/p\u003e\n", "hash": "9b7c442ebf7ff3018b4922d785ad2da2e081c2fa1d684fb79e4f4ab5f3a3eebf"}]}], "content_hash": "89a9e65edfa5e2fb6d0f5eefb25fed875e9b1c88f510c290be9dc0b9c4b89af3"}, {"id": "references", "title": "文献与源文件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "references-current", "label": "当前报告内容", "blocks": [{"id": "references-text", "kind": "text", "html": "\u003cul\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-method-workdraft.md\"\u003e方法分类工作稿\u003c/a\u003e：逐篇维护信息利用、参数原则、实现改进、关系证据和边界。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-yang-classification.md\"\u003eYang综述的八类分类\u003c/a\u003e：保留综述原始分类与名称辨析。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-research09-routes.md\"\u003eResearch09的四条路线\u003c/a\u003e：保留已有路线归纳及其局限。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/mechanism-map-index.md\"\u003e机制图-v0.4目录\u003c/a\u003e：五类机制图、完整机理地图及生成源脚本。\u003c/li\u003e\n\u003cli\u003e\u003ca\nhref=\"assets/source-experiment-settings.md\"\u003e实验设置\u003c/a\u003e：统一比较对象、计算版本和数据合同。\u003c/li\u003e\n\u003c/ul\u003e\n", "hash": "43f77c13c8970e13ef312733399aedd4293a1615e7313d8dcf952172143815e1"}]}], "content_hash": "143a5e094fc4df3e26d8a0ab0b6b34e2e54b56cf9c378e08ab9dfa5b89765eb3"}]}</script>
<script>
'use strict';
let board=JSON.parse(document.getElementById('initial-board').textContent),draft,pending=null,signature='',busy=false,draftTimer=null,savingDraft=false,dirtyDraft=false,initializing=true;
const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const key=()=>`review-html:${board.id}:${board.revision}`;
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,action:'auto',notes:{},annotations:[]}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,action:'auto',notes:{},annotations:[]};draft.units[u.id].image_notes??=[];draft.units[u.id].gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}
function snapshotDraft(){return {board_id:board.id,board_revision:board.revision,updated_at:draft.updated_at||Date.now(),draft}}
async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250)}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
function gallerySelection(unit,option,block){const state=draft.units[unit.id],key=option.id+'/'+block.id,id=state.gallery_positions[key];return Math.max(0,block.images.findIndex(s=>s.id===id))}
function syncGallery(node,unit,option,block){
 const state=draft.units[unit.id],index=gallerySelection(unit,option,block),slide=block.images[index],img=node.querySelector('img');
 if(img.getAttribute('src')!==slide.src)img.src=slide.src;img.alt=slide.alt||slide.label;img.setAttribute('aria-label','放大查看：'+img.alt);
 node.querySelector('[data-position]').textContent=`${slide.label} · ${index+1} / ${block.images.length}`;
 node.querySelector('[data-direction="-1"]').disabled=index===0;node.querySelector('[data-direction="1"]').disabled=index===block.images.length-1;
 const textarea=node.querySelector('textarea');textarea.dataset.imageId=slide.id;textarea.value=state.image_notes.find(n=>n.option_id===option.id&&n.block_id===block.id&&n.image_id===slide.id)?.comment||'';textarea.setAttribute('aria-label',`${slide.label}图片备注内容`);
 node.querySelector('summary').textContent=textarea.value?'本图备注（已填写）':'本图备注'
}
function createGallery(unit,option,block){
 const node=el('div','gallery'),stage=el('div','gallery-stage'),img=el('img');node.tabIndex=0;node.setAttribute('aria-label','图片组');node.dataset.gallery=block.id;node.style.setProperty('--gallery-ratio',block.aspect_ratio||1.6);img.draggable=false;stage.append(img);node.append(stage);
 const nav=el('div','gallery-nav'),label=el('span','gallery-position');label.dataset.position='true';label.setAttribute('aria-live','polite');
 for(const direction of [-1,1]){const button=el('button','',direction<0?'←':'→');button.type='button';button.dataset.direction=direction;button.setAttribute('aria-label',direction<0?'上一张':'下一张');nav.append(button);if(direction<0)nav.append(label)}node.append(nav);
 const detail=el('details','note'),summary=el('summary','','本图备注'),textarea=el('textarea');textarea.placeholder='本图备注';textarea.dataset.galleryNote=block.id;textarea.dataset.optionId=option.id;detail.append(summary,textarea);node.append(detail);
 function move(direction){const index=gallerySelection(unit,option,block),next=Math.max(0,Math.min(block.images.length-1,index+direction));if(next===index)return;draft.units[unit.id].gallery_positions[option.id+'/'+block.id]=block.images[next].id;syncGallery(node,unit,option,block);detail.open=!!textarea.value;persist()}
 nav.addEventListener('click',event=>{const button=event.target.closest('[data-direction]');if(button)move(Number(button.dataset.direction))});
 node.addEventListener('keydown',event=>{if(event.target.closest('textarea,summary')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();move(event.key==='ArrowLeft'?-1:1)});
 syncGallery(node,unit,option,block);return node
}
function createUnit(unit){
 const content=isContent(unit),section=el('section',`unit ${content?'content-unit':''} ${unit.inline?'inline-choice':''}`);section.dataset.unit=unit.id;
 const head=el('div','unit-head');head.append(el('h2','',unit.title));
 const diverge=el('button','diverge');diverge.type='button';diverge.dataset.diverge='true';diverge.setAttribute('aria-label','继续发散');diverge.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7L5 7m7 7 7-7M5 12V7h5m4 0h5v5"/></svg>';head.append(diverge);section.append(head);
 if(unit.context){const context=el('div','choice-context');context.textContent=unit.context;section.append(context)}
 const grid=el('div',content?'document':'options');
 for(const option of unit.options){
  const card=el(content?'div':'article',content?'content-body':'option');card.dataset.option=option.id;if(!content)card.append(el('h3','',option.label));const preview=el('div',content?'document-preview':'preview');
  for(const block of option.blocks){const content=el('div','block');content.dataset.block=block.id;content.dataset.option=option.id;content.dataset.kind=block.kind;content.dataset.hash=block.hash||'';
   if(block.kind==='image'){const img=el('img');img.src=block.src;img.alt=block.alt||option.label;img.draggable=false;content.append(img)}else if(block.kind==='gallery'){content.append(createGallery(unit,option,block))}else{content.innerHTML=block.html}for(const img of content.querySelectorAll('img')){img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||option.label))}preview.append(content)
  }
  card.append(preview);if(!content){const row=el('div','choice-row'),label=el('label','dot'),radio=el('input');radio.type='radio';radio.name=`choice-${unit.id}`;radio.value=option.id;radio.setAttribute('aria-label',`选择${option.label}`);label.append(radio);row.append(label);card.append(row)}
  if(option.blocks.some(b=>b.kind!=='text')){const detail=el('details','note');const summary=el('summary','','备注');summary.setAttribute('aria-label',`${option.label}备注`);detail.append(summary);const textarea=el('textarea');textarea.placeholder='备注';textarea.setAttribute('aria-label',`${option.label}备注内容`);textarea.dataset.note=option.id;detail.append(textarea);card.append(detail)}grid.append(card)
 }
 section.append(grid);return section
}
function syncControls(unit,node){const state=draft.units[unit.id],button=node.querySelector('.diverge'),active=state.action==='extend';button.setAttribute('aria-pressed',String(active));button.title=active?'已标记继续发散，点击撤销':'继续发散';for(const radio of node.querySelectorAll('input[type=radio]')){radio.checked=radio.value===state.selected;radio.closest('.option').classList.toggle('chosen',radio.checked)}for(const note of node.querySelectorAll('[data-note]'))note.value=state.notes[note.dataset.note]||'';for(const option of unit.options)for(const block of option.blocks)if(block.kind==='gallery'){const gallery=blockNode(unit.id,option.id,block.id)?.querySelector('.gallery');if(gallery)syncGallery(gallery,unit,option,block)}}
function render(nextBoard){
 const newRound=nextBoard.id!==board.id||nextBoard.revision!==board.revision;board=nextBoard;
 if(!draft||newRound){if($('confirmation').open)$('confirmation').close();closeEditor(false);loadDraft()}
 $('title').textContent=board.title;document.title=board.title;$('round').textContent=`第 ${board.revision} 轮`;document.body.classList.toggle('document-board',!!board.document||board.units.some(isContent));
 const keep=new Set();
 for(const [index,unit] of board.units.entries()){keep.add(unit.id);let node=unitNode(unit);const unitSignature=JSON.stringify({id:unit.id,title:unit.title,mode:unit.mode,inline:unit.inline,context:unit.context,options:unit.options});if(!node||node.dataset.signature!==unitSignature){const replacement=createUnit(unit);replacement.dataset.signature=unitSignature;if(node)node.replaceWith(replacement);node=replacement}if($('units').children[index]!==node)$('units').insertBefore(node,$('units').children[index]||null);syncControls(unit,node);node.inert=false;for(const control of node.querySelectorAll('input,textarea,.diverge'))control.disabled=!!board.processing||!!board.submitted||!!board.review_complete}
 for(const node of [...$('units').children])if(!keep.has(node.dataset.unit))node.remove();
 $('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete||busy;$('submit').textContent=board.submitted&&!board.review_complete?'已提交':'提交';$('archive').hidden=board.allow_finish===false;$('archive').disabled=$('submit').disabled;$('archive').textContent=board.review_complete?'已落地存档':'落地存档';
 if(board.archive_pending)status('存档操作已送达，等待 Agent 执行');else if(board.processing)status('正在更新');else if(board.review_complete)status('当前版本已接受并存档');else if(board.submitted)status(draft.intent==='archive'?'已送达，正在存档':'已提交，正在等待 Agent 处理');else status('');renderComments();
 if((board.submitted||board.processing||board.review_complete)&&$('confirmation').open)$('confirmation').close();
 const stable={...board};delete stable.submitted;signature=JSON.stringify(stable)
 if(newRound){hydrateDraft().then(restoreEditor)}
}
$('units').addEventListener('change',event=>{const unit=event.target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(event.target.type==='radio'){state.selected=event.target.value;for(const card of unit.querySelectorAll('.option'))card.classList.toggle('chosen',card.dataset.option===state.selected)}draft.submission_id=null;persist()});
$('units').addEventListener('click',event=>{const button=event.target.closest('button[data-diverge]');if(!button||button.disabled)return;const node=button.closest('[data-unit]'),unit=board.units.find(u=>u.id===node.dataset.unit),state=draft.units[unit.id];if(pending){if(pending.kind!=='divergence'&&$('editor-input').value.trim())saveNote();else closeEditor()}if(state.action==='extend'){state.action='auto';draft.submission_id=null;syncControls(unit,node);persist();return}openEditor({kind:'divergence',unit_id:unit.id,quote:unit.title,comment:state.inspiration_draft??state.inspiration??''},button.getBoundingClientRect())});
$('units').addEventListener('input',event=>{const target=event.target,unit=target.closest('[data-unit]');if(!unit)return;const state=draft.units[unit.dataset.unit];if(target.dataset.note)state.notes[target.dataset.note]=target.value;else if(target.dataset.galleryNote){state.image_notes=state.image_notes.filter(n=>!(n.option_id===target.dataset.optionId&&n.block_id===target.dataset.galleryNote&&n.image_id===target.dataset.imageId));if(target.value.trim())state.image_notes.push({option_id:target.dataset.optionId,block_id:target.dataset.galleryNote,image_id:target.dataset.imageId,comment:target.value});target.closest('details').querySelector('summary').textContent=target.value?'本图备注（已填写）':'本图备注'}else return;draft.submission_id=null;persist()});
let imageSource=null,imageWidth=0;
function sizeImage(width){const img=$('image-large');if(!img.naturalWidth)return;imageWidth=Math.max(100,Math.min(img.naturalWidth*8,width));img.style.width=imageWidth+'px'}
function fitImage(){const img=$('image-large'),stage=$('image-stage'),style=getComputedStyle(stage),width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);if(img.naturalWidth&&img.naturalHeight)sizeImage(Math.min(img.naturalWidth,width,height*img.naturalWidth/img.naturalHeight))}
function openImage(img){imageBlankPressed=false;imageSource=img;$('image-large').alt=img.alt||'放大的图像';$('image-large').onload=fitImage;$('image-large').src=img.currentSrc||img.src;$('image-viewer').showModal();document.body.classList.add('image-open');$('image-stage').scrollTo(0,0);if($('image-large').complete)fitImage();$('image-plus').focus({preventScroll:true})}
function closeImage(){$('image-viewer').close()}
$('image-viewer').addEventListener('close',()=>{document.body.classList.remove('image-open');if(imageSource?.isConnected)imageSource.focus({preventScroll:true})});
$('image-minus').onclick=()=>sizeImage(imageWidth/1.3);$('image-plus').onclick=()=>sizeImage(imageWidth*1.3);
let imageBlankPressed=false;
$('image-viewer').addEventListener('pointerdown',event=>{imageBlankPressed=event.target===$('image-viewer')||event.target===$('image-stage')});
$('image-viewer').addEventListener('click',event=>{if(imageBlankPressed&&(event.target===$('image-viewer')||event.target===$('image-stage')))closeImage();imageBlankPressed=false});
$('units').addEventListener('click',event=>{if(event.target.matches('.block img'))openImage(event.target)});
$('units').addEventListener('keydown',event=>{if(event.target.matches('.block img')&&['Enter',' '].includes(event.key)){event.preventDefault();openImage(event.target)}});
function closeEditor(save=true){pending=null;$('editor').hidden=true;$('editor-input').value='';if(save)persist()}
function openEditor(anchor,rect){pending=anchor;const divergence=anchor.kind==='divergence';$('editor').setAttribute('aria-label',divergence?'发散启发':'添加批注');$('editor-quote').textContent=anchor.quote;$('editor-input').setAttribute('aria-label',divergence?'发散启发':'批注意见');$('editor-input').placeholder=divergence?'补充探索方向、例子或启发（可留空）':'批注';$('save-note').textContent=divergence?'发散':'保存';$('editor-input').value=anchor.comment||'';$('editor').hidden=false;$('editor').style.top=`${Math.max(12,Math.min(rect?rect.top:100,window.innerHeight-300))}px`;$('editor-input').focus();persist()}
function selectionNote(event){
 if(board.submitted||board.processing||board.review_complete||busy||event.target.closest('button,textarea,select,#editor,#comments,summary'))return;
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),first=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,last=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement,block=first.closest('[data-kind=text]');
 if(!block||last.closest('[data-kind=text]')!==block||!selection.toString().trim())return;
 const unit=block.closest('[data-unit]'),before=range.cloneRange();before.selectNodeContents(block);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length,end=start+range.toString().length,source=block.textContent;
 openEditor({id:uid(),unit_id:unit.dataset.unit,option_id:block.dataset.option,block_id:block.dataset.block,block_hash:block.dataset.hash,quote:source.slice(start,end),start,end,prefix:source.slice(Math.max(0,start-24),start),suffix:source.slice(end,end+24),comment:''},range.getBoundingClientRect())
}
document.addEventListener('mouseup',selectionNote);document.addEventListener('keyup',event=>{if(event.key==='Shift')selectionNote(event)});
function saveNote(){if(!pending)return true;const comment=$('editor-input').value.trim();if(pending.kind==='divergence'){const unit=board.units.find(u=>u.id===pending.unit_id),state=draft.units[unit.id];state.inspiration=comment;state.inspiration_draft=comment;state.action='extend';draft.submission_id=null;closeEditor(false);syncControls(unit,unitNode(unit));persist();return true}if(!comment)return false;const unitId=pending.unit_id,annotations=draft.units[unitId].annotations,{unit_id,...anchor}=pending;anchor.comment=comment;const index=annotations.findIndex(a=>a.id===anchor.id);if(index>=0)annotations[index]=anchor;else annotations.push(anchor);draft.submission_id=null;closeEditor(false);persist();window.getSelection()?.removeAllRanges();renderComments();return true}
$('save-note').onclick=()=>{if(!saveNote())$('editor-input').focus()};$('cancel-note').onclick=closeEditor;
$('editor-input').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveNote()}if(event.key==='Escape')closeEditor()});
$('editor-input').addEventListener('input',()=>{if(pending?.kind==='divergence')draft.units[pending.unit_id].inspiration_draft=$('editor-input').value;persist()});
function anchorRange(node,anchor){try{const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let offset=0,startNode=null,endNode=null,startOffset=0,endOffset=0;while(walker.nextNode()){const n=walker.currentNode,size=n.textContent.length;if(!startNode&&anchor.start<=offset+size){startNode=n;startOffset=anchor.start-offset}if(anchor.end<=offset+size){endNode=n;endOffset=anchor.end-offset;break}offset+=size}if(!startNode||!endNode)return null;const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,endOffset);return range.toString()===anchor.quote?range:null}catch{return null}}
function renderComments(){
 $('comments').replaceChildren();const ranges=[];
 for(const unit of board.units){for(const anchor of draft.units[unit.id].annotations){
  const card=el('div','annotation'),quote=el('div','quote',anchor.quote);card.append(quote,el('p','',anchor.comment));const tools=el('div','annotation-tools');
  const edit=el('button','quiet','修改');edit.type='button';edit.onclick=()=>openEditor({...anchor,unit_id:unit.id},card.getBoundingClientRect());const remove=el('button','quiet','删除');remove.type='button';remove.onclick=()=>{draft.units[unit.id].annotations=draft.units[unit.id].annotations.filter(a=>a.id!==anchor.id);persist();renderComments()};tools.append(edit,remove);card.append(tools);$('comments').append(card);
  const node=blockNode(unit.id,anchor.option_id,anchor.block_id);if(node&&node.dataset.hash===anchor.block_hash){const range=anchorRange(node,anchor);if(range)ranges.push(range);quote.onclick=()=>node.scrollIntoView({block:'center',behavior:'smooth'})}
 }}document.body.classList.toggle('has-comments',$('comments').children.length>0);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('review-notes',new Highlight(...ranges))
}
function decisions(){return board.units.map(u=>{const d=draft.units[u.id];return {unit_id:u.id,selected_option_id:isContent(u)?null:d.selected,next_action:d.action==='extend'?'extend':'auto',inspiration:d.action==='extend'?d.inspiration||'':'',notes:d.notes,annotations:d.annotations,image_notes:d.image_notes||[]}})}
function blockText(block){if(block.kind==='image')return `[图片：${block.alt||block.src}]`;if(block.kind==='gallery')return `[图组：${block.images.map(i=>i.label).join('、')}]`;const node=el('div');node.innerHTML=block.html;for(const n of node.querySelectorAll('p,li,h1,h2,h3,h4,br,tr'))n.append(document.createTextNode('\n'));return node.textContent.trim()}
function composePreview(intent){
 if(intent==='archive')return board.archive_plan?.trim()||`《${board.title}》尚未填写具体落地安排。\n请先依据任务约定明确正式成果的目标路径、更新方式或版本、旧版去向及相关引用更新，再执行落地。\nHTML、素材及审阅记录随任务保留，不能代替正式成果的更新。`;
 const lines=[`请根据以下意见继续处理《${board.title}》（第 ${board.revision} 轮）。`];
 for(const [index,item] of decisions().entries()){
  const unit=board.units[index],notes=Object.entries(item.notes).filter(([,v])=>v.trim()),hasChange=item.selected_option_id||item.next_action==='extend'||notes.length||item.annotations.length||item.image_notes.length;if(!hasChange)continue;
  lines.push('',`【${unit.title}】`);
  if(item.selected_option_id){const option=unit.options.find(o=>o.id===item.selected_option_id);lines.push(`选择：${option.label}`,option.blocks.map(blockText).join('\n'))}
  if(item.next_action==='extend'){lines.push('要求：继续发散。');if(item.inspiration)lines.push(`发散启发：${item.inspiration}`)}
  for(const [oid,note] of notes)lines.push(`关于“${unit.options.find(o=>o.id===oid)?.label||oid}”：${note}`);
  for(const note of item.annotations)lines.push(`原文：“${note.quote}”\n意见：${note.comment}`);
  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending){if(pending.kind==='divergence'||$('editor-input').value.trim())saveNote();else closeEditor()}
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
