<script id="initial-board" type="application/json">{"id": "study04-method-classification-v04-report", "title": "Study04 参数估计方法路线图 v2.0 审阅", "document": true, "revision": 24, "require_confirmation": true, "archive_plan": "将审定内容写回报告上（方法分类）-v2.0.md及机制图-v2.0图源与SVG；v1.1已完整归档到其他/历史版本/方法分类-v1.1，保留原HTML任务和历史；核验后在laptop分支保存并同步远端。", "units": [{"id": "opening", "title": "报告说明", "mode": "content", "state": "open", "selected": null, "options": [{"id": "opening-current", "label": "当前v2.0工作稿", "blocks": [{"id": "opening-text-0", "kind": "text", "html": "\u003ch1 id=\"三参数weibull参数估计方法的路线图\"\u003e三参数Weibull参数估计方法的路线图\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e报告上（方法路线图）v2.0｜更新：2026-10-22\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e魏鹏宇｜东北大学机械工程与自动化学院\u003c/p\u003e\n\u003cp\u003e分会场3：装备寿命与可靠性评估\u003c/p\u003e\n\u003cp\u003e各位老师、各位同学，大家好！我是东北大学机械工程与自动化学院的在读博士生魏鹏宇。今天汇报的题目是《小样本三参数Weibull参数估计方法的比较与选择》。\u003c/p\u003e\n\u003cp\u003e这次汇报分为两部分。第一部分梳理现有方法的估计原理，通过五条路线及方法间关系形成一张参数估计方法的路线图；第二部分在共同样本上比较代表方法，分析它们在小样本下的偏差、波动、异常输出和失败风险。\u003c/p\u003e\n", "hash": "3b57af8964976391b3b1062d052f0eb06a2671282d12337f2e404e3548e11f56"}]}], "content_hash": "868930f92c0b275c079bc120ecae160b108254a96549dcc5d228330fd29363f8"}, {"id": "section-1", "title": "1　先看现有方法：名称很多，层次混在一起", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-1-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-1-text-0", "kind": "text", "html": "\u003cp\u003e三参数Weibull分布包含形状参数β、尺度参数η和位置参数γ。位置参数决定分布的支撑边界，并与形状、尺度共同参与估计。围绕三个参数的确定，文献中陆续形成了多种方案：\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e代表文献（作者／年份）\u003c/th\u003e\n\u003cth\u003e方案或方法名\u003c/th\u003e\n\u003cth\u003e主要构造\u003c/th\u003e\n\u003cth\u003e构造特点\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSmith（1985）\u003c/td\u003e\n\u003ctd\u003e三参数MLE及最小值替代构造\u003c/td\u003e\n\u003ctd\u003e原始似然；另讨论位置取最小观测、删除该观测后的估计\u003c/td\u003e\n\u003ctd\u003e分析非正则似然与最小值替代构造\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCohen–Whitten（1982）\u003c/td\u003e\n\u003ctd\u003eMMLE-I—V、MME分支\u003c/td\u003e\n\u003ctd\u003e保留部分似然方程，用最小值、均值、方差或中位数关系替换位置或矩方程\u003c/td\u003e\n\u003ctd\u003e同一MMLE缩写下有多个具体版本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCheng–Amin（1983）；Ranneby（1984）\u003c/td\u003e\n\u003ctd\u003eMPS／最大概率间距\u003c/td\u003e\n\u003ctd\u003e用相邻CDF概率间距构造乘积或对数目标\u003c/td\u003e\n\u003ctd\u003e两条独立提出线索\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCheng–Iles（1987）\u003c/td\u003e\n\u003ctd\u003eCMLE／修正似然\u003c/td\u003e\n\u003ctd\u003e用最小观测附近的区间概率替换密度项\u003c/td\u003e\n\u003ctd\u003e位置边界处理改变了似然项\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWhite（1969）\u003c/td\u003e\n\u003ctd\u003e概率图回归\u003c/td\u003e\n\u003ctd\u003e用次序统计量期望构造分数，再回归对数寿命\u003c/td\u003e\n\u003ctd\u003e两参数概率图基础\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSoman–Misra（1992）\u003c/td\u003e\n\u003ctd\u003e三参数LSE／White扩展\u003c/td\u003e\n\u003ctd\u003e平移样本、White分数、回归和位置评分\u003c/td\u003e\n\u003ctd\u003e未知位置被接入概率图流程\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCran（1988）\u003c/td\u003e\n\u003ctd\u003eWeibull moments\u003c/td\u003e\n\u003ctd\u003e由生存函数幂次积分形成矩，再显式恢复三参数\u003c/td\u003e\n\u003ctd\u003e通过矩差显式恢复\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJacquelin（1993）→ Cousineau（2009）\u003c/td\u003e\n\u003ctd\u003eWMLE／加权MLE\u003c/td\u003e\n\u003ctd\u003e从二参数代数关系扩展到三参数，并把三个权重放进估计方程\u003c/td\u003e\n\u003ctd\u003e明确的扩展关系\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKundu–Raqab（2009）\u003c/td\u003e\n\u003ctd\u003eK–R MMLE\u003c/td\u003e\n\u003ctd\u003e以共同最小值定位并删除该观测，再估计其余参数\u003c/td\u003e\n\u003ctd\u003e最小值定位与删样本结合\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHosking（1990）；Elamir–Seheult（2003）\u003c/td\u003e\n\u003ctd\u003eL矩／截尾L矩\u003c/td\u003e\n\u003ctd\u003e以次序统计量线性组合匹配理论统计关系，截尾L矩减少端部影响\u003c/td\u003e\n\u003ctd\u003e统计关系路线的重要来源\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNagatsuka等（2013）\u003c/td\u003e\n\u003ctd\u003eLSPF\u003c/td\u003e\n\u003ctd\u003eW变换消除位置、尺度，由W联合密度估形状，再恢复其余参数\u003c/td\u003e\n\u003ctd\u003e不变统计量似然与参数恢复相接\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNagatsuka–Balakrishnan（2015）\u003c/td\u003e\n\u003ctd\u003eLPF\u003c/td\u003e\n\u003ctd\u003eV变换只消除位置，由V联合密度估形状与尺度，再按原文似然方程恢复\u003c/td\u003e\n\u003ctd\u003e对LSPF的构造改进\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePark（2017；2018）\u003c/td\u003e\n\u003ctd\u003eProposed+Plot／Proposed+MLE2\u003c/td\u003e\n\u003ctd\u003e用概率图相关系数定位，再按回归或二参数MLE恢复\u003c/td\u003e\n\u003ctd\u003e2018补充条件下的存在性论证\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYang等（2023）\u003c/td\u003e\n\u003ctd\u003e最小二乘迭代\u003c/td\u003e\n\u003ctd\u003e概率图回归与最小次序统计量位置修正交替进行\u003c/td\u003e\n\u003ctd\u003e位置修正与回归组合\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e代表文献待补\u003c/td\u003e\n\u003ctd\u003eBayes、ANN／BPNN、MDM等\u003c/td\u003e\n\u003ctd\u003e分别使用先验与后验、训练映射或尺度伪估计差异\u003c/td\u003e\n\u003ctd\u003e对应后验推断、学习映射和尺度一致性判据\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这些名称分别强调估计准则、统计量、推断框架或改进步骤。例如，MLE强调似然，L矩强调统计量，Bayes强调后验推断，加权则描述对原有构造的调整。要把这些方法联系起来，需要回到它们怎样从样本得到参数。\u003c/p\u003e\n", "hash": "580df7a27f07568af941d62815b1275823c5022954962dc72804df49833962f5"}]}], "content_hash": "9258a1370dd22cf0aad1a02fbdc1e4bdc4701f735d5f47eee26165d69f266e6b"}, {"id": "section-2", "title": "2　从估计机制建立五条路线", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-2-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-2-text-0", "kind": "text", "html": "\u003cp\u003e现有名称之所以显得杂，是因为它们分别强调了不同内容：有的强调观测密度，有的强调概率图或概率间距，有的强调矩和次序统计量，有的强调先验和后验，有的强调训练映射；加权、偏差修正、位置处理和数值搜索又会横跨这些内容。\u003c/p\u003e\n\u003cp\u003e理解一种方法，先连续回答两个问题：\u003c/p\u003e\n\u003col type=\"1\"\u003e\n\u003cli\u003e\u003cstrong\u003e样本信息：\u003c/strong\u003e 从样本中提取什么，是观测处的密度、经验分布、概率间距、矩、分位数、次序统计量、不变统计量，还是训练样本中的特征。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e参数确定原则：\u003c/strong\u003e 怎样把这些信息变成三个参数，是最大化似然、最小化分布偏离、匹配概率结构、反演理论统计关系、更新后验，还是学习样本到参数的映射。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e加权、偏差修正、位置处理、边界约束、数值求解和跨路线组合则说明变化发生在哪个环节。其中有些会改变统计构造，有些服务于既定准则的计算，需要按实际步骤区分。\u003c/p\u003e\n\u003cp\u003e据此，可以从似然构造与优化、分布关系匹配、统计特征关系匹配与反演、贝叶斯后验推断以及学习型参数映射五条路线理解现有方法。路线体现不同的参数确定机制；具体方法可以完整采用一种机制，也可以通过统计量构造、参数消除、分阶段估计或组合准则连接多条路线。我们建立的是参数估计方法的路线图，目的是揭示估计原理、构造特征及其相互联系，不要求每个方法只能归入一个类别，也不以选出唯一主要归属作为进入地图的条件。\u003c/p\u003e\n\u003cp\u003e五条路线各自回答：样本形成什么对象，哪一种机制据此确定参数？\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e路线\u003c/th\u003e\n\u003cth\u003e从样本构造什么\u003c/th\u003e\n\u003cth\u003e据此怎样确定参数\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e一：似然构造与优化\u003c/td\u003e\n\u003ctd\u003e样本或所选统计量在候选参数下的联合密度，形成似然函数\u003c/td\u003e\n\u003ctd\u003e最大化似然或相应的修正准则；方程修正按其实际构造说明\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e二：分布关系匹配\u003c/td\u003e\n\u003ctd\u003e经验分布、绘图概率、概率间距或其他分布表示\u003c/td\u003e\n\u003ctd\u003e依据指定的拟合准则，在表示、残差、概率结构或一致性关系上确定参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e三：统计特征关系匹配与反演\u003c/td\u003e\n\u003ctd\u003e矩、分位数、次序统计量等选定特征，以及它们与参数的理论关系\u003c/td\u003e\n\u003ctd\u003e通过匹配、消元、求解或反演识别参数，再恢复其余参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e四：贝叶斯后验推断\u003c/td\u003e\n\u003ctd\u003e样本似然与先验结合形成的参数后验分布\u003c/td\u003e\n\u003ctd\u003e依据后验分布及相应的决策规则给出估计\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e五：学习型参数映射\u003c/td\u003e\n\u003ctd\u003e多组具有已知参数标签的训练样本及其特征\u003c/td\u003e\n\u003ctd\u003e学习样本或特征到参数的映射，固定映射后用于新样本\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e例如，同一组排序寿命可以用于构造似然，也可以转成概率图坐标或矩。分布关系匹配围绕样本的分布表示及其拟合准则展开；统计特征关系匹配与反演围绕选定特征与理论参数关系展开。贝叶斯推断使用似然，但最终估计还取决于先验和后验决策；学习型映射也可使用矩特征，但参数映射来自多组带标签样本的训练。所用材料相同，并不意味着参数确定机制相同。\u003c/p\u003e\n\u003cp\u003eLSPF就是一个需要沿过程阅读的例子：先用W变换消除位置与尺度，再由内部W统计量的联合密度构造形状似然，最后依据位置修正和尺度恢复关系补齐参数。统计量构造、似然估计和统计关系恢复在同一方法中相接。后面先分别解释这些机制，再回到完整地图看它们如何连接。\u003c/p\u003e\n", "hash": "b548767aa9ec774cc65fc356f524589baa28fb8d9510f2f440258e246db48382"}, {"id": "section-2-image-1", "kind": "image", "src": "assets/v2.0-06-完整机理地图-估计路线与方法关系.svg", "alt": "图2　归纳后：五条估计路线与方法关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-2-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图2｜由估计机制组成路线骨架，再接入具体方法。\u003c/strong\u003e 每条路线先给出统计对象及确定参数的机制，具体方法连接到采用或改变的环节。方法内部的跨路线步骤与方法之间的沿袭、修正、数学联系及局部借用分别表达；同一方法可以连接多条路线。金色节点对应本次比较的七种实现。\u003c/p\u003e\n", "hash": "aaf56c55a834cbaf957e54c2f2b7e8d69e64910002b511127bd6ba4959a3e260"}]}], "content_hash": "fb874adb3065c508068b2c9f8a53349148425a5ddfa072f8dac39cbdee9fca9a"}, {"id": "section-3", "title": "3　路线一：似然构造与优化", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-3-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-3-text-0", "kind": "text", "html": "\u003cp\u003e这条路线的核心机制是：构建样本在候选参数下的似然函数，并通过最大化似然或相应的修正准则来估计参数。先固定已经观测到的样本，把分布密度看作待估参数的函数。对独立同分布完整样本 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmo\u003e…\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，每个观测对应一个参数函数 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e；所有观测共用同一组参数 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e。在同一个参数处将这些函数值相乘，就构成联合似然：\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmunderover\u003e\u003cmo\u003e∏\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/munderover\u003e\u003cmsub\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmunderover\u003e\u003cmo\u003e∏\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/munderover\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e这个乘积对整个参数域定义了一个函数。最大似然估计在该联合函数上寻找最大值。当给定参数域 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΘ\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e 内存在最大值时，\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eM\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eL\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eE\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmunder\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg max\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΘ\u003c/mi\u003e\u003c/mrow\u003e\u003c/munder\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e图3a把这一个构造过程连成图像：固定观测、形成各参数函数、在相同参数处相乘、在乘积函数上求最大值。前三步解释似然如何构造（L1），最后一步解释估计由什么准则确定（L2）。为便于绘制，图中固定η和γ，只展示β截面；完整三参数MLE仍在三维参数域中处理同一个联合似然。取对数、得分方程、剖面求解或数值优化是实现最大化的计算途径，得分为零还须区分极大值、其他驻点及边界情况。原始三参数似然可能无界，参数域、支持边界与有限解存在性仍须核验。\u003c/p\u003e\n\u003cp\u003e原始观测的密度乘积是这条路线的基本例子。若先变换为统计量，也可以由该统计量的联合密度构造似然；这时必须使用相应的分布，不能不加区分地把相关统计量的边缘密度相乘。LSPF的形状估计就是内部W统计量的联合似然最大化，统计量的选取没有取消其似然机制。\u003c/p\u003e\n", "hash": "e09a6438b02e3a59690fe9e5b1d17ccfb8528412a383d8a3f5b735bcc4841982"}, {"id": "section-3-unified-image", "kind": "image", "src": "assets/v2.0-07-似然估计路线-信息处理流程.svg", "alt": "图3a　似然构造与优化的连续机制", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-3-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图3a｜固定数据，把密度转为参数函数，再相乘并最大化。\u003c/strong\u003e 左侧三个观测固定在寿命轴上；中间三条曲线分别是这三个观测对应的参数函数，横轴均为同一β范围；右侧似然曲线由三个函数在同一β处的值逐点相乘得到。蓝灰竖线及连线追踪同一个β₀如何从三个因子构成一个联合似然值，橙色箭头表示在这个联合函数上求最大值。本图峰点是固定η₀=3、γ₀=2时的条件形状估计；完整三参数MLE仍需在三维参数域内求解。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e原始观测或选定统计量的联合密度，以及删失或支持边界信息\u003c/td\u003e\n\u003ctd\u003e最大化似然或修正准则；估计方程的求解与修正按具体构造解释\u003c/td\u003e\n\u003ctd\u003e似然项替换、方程加权、位置关系替换、边界约束、Firth型修正、局部候选与数值搜索\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e由这个机制再看具体方法，改动位置就清楚了：CMLE替换最小值附近的似然贡献；罚似然引入额外目标因子；K–R先以最小值定位并删除该观测；Cohen–Whitten的不同MMLE分支保留部分方程、以特定统计关系替换其他方程；WMLE对估计方程加权，DMMLE在修改数据后进一步修正得分。修改似然项或估计方程属于统计构造变化，WMLE等不能仅凭名称就认定等同于某个未说明的似然最大化。PSO、模拟退火和差分进化直接搜索既定似然目标时，则承担数值求解环节。\u003c/p\u003e\n", "hash": "97a3598a65238dce51bdc44ffcc3624f09e7a2c512fbed35827742eef5722950"}, {"id": "section-3-image-01", "kind": "image", "src": "assets/v2.0-01-似然估计路线-机制图.svg", "alt": "图3b　似然路线的具体构造及改动位置", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-3-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图3b｜从密度贡献到求解方程及其改动位置。\u003c/strong\u003e 上部展示各观测处的密度怎样相乘形成似然，再取对数、求导并由尺度方程消去η。下部在具体接口上展开：K–R平移和删除最小观测，DMMLE修正修改数据后的得分，WMLE给方程加权，Cohen–Whitten替换位置关系，CMLE替换最小值项，罚似然增加目标因子。\u003c/p\u003e\n", "hash": "01ce8594a74330bacd8600eddc0013c41b10d1286cdaaac483b2dd5d3c070c0b"}]}], "content_hash": "35f68b3beed207dac7d0c5d4327807ad59351a4871ccb893b9b01dbdfb10d3ae"}, {"id": "section-4", "title": "4　路线二：分布关系匹配", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-4-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-4-text-0", "kind": "text", "html": "\u003cp\u003e这条路线将样本转化为经验分布、绘图概率、概率间距或其他分布表示，再依据指定的拟合准则确定参数。它的机制包含相接的三个环节：构造用于比较的分布表示或概率结构（D1），指定残差、距离、间距或一致性准则（D2），再据此求得参数（D3）。需要同时交代比较对象和准则；“拟合得好”只有在这两者明确后才有具体含义。\u003c/p\u003e\n\u003cp\u003e以CDF拟合为例，将排序观测 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e 配以概率点 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，候选参数给出 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e。各点的偏离先形成整组目标，再通过最小化确定参数：\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eQ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eD\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eF\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmunderover\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/munderover\u003e\u003cmsub\u003e\u003cmi\u003ew\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsup\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e[\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo fence=\"true\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"/\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmunder\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg min\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΘ\u003c/mi\u003e\u003c/mrow\u003e\u003c/munder\u003e\u003cmsub\u003e\u003cmi\u003eQ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eD\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eF\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e图4a下部沿同一组概率点和候选曲线说明这个过程。CDF平方差是共同机制的一个例子，其他方法需要回到各自实际使用的表示和准则。\u003c/p\u003e\n", "hash": "2677879805dc6e4bd6b5278f77875a8f8ae8e58be95f2a13996861e8ef5cf752"}, {"id": "section-4-flow-08-image", "kind": "image", "src": "assets/v2.0-08-分布匹配路线-信息处理流程.svg", "alt": "图4a　分布关系匹配的共同机制及CDF例子", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-4-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图4a｜先明确表示与准则，再读参数怎样确定。\u003c/strong\u003e 上部以D1—D3概括共同机制；下部CDF例子将同一组样本概率点、候选曲线、逐点偏离和整组差异连起来。概率图改变比较坐标，MPS使用概率间距，MDM比较反推尺度；这些构造在对应机制环节展开，CDF平方差不替代它们各自的准则。\u003c/p\u003e\n\u003cp\u003e概率图把分布关系变换为近似直线，Soman与Park分别通过其位置选择、分数和回归方向恢复参数；MPS则令 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，补上 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e、\u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，最大化概率间距的乘积 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsubsup\u003e\u003cmo\u003e∏\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eu\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e。这些间距来自CDF概率轴，与LSPF／LPF的数据变换统计量联合似然不同。\u003c/p\u003e\n\u003cp\u003eMDM又改变了比较对象：由同一Weibull分布关系反推每个观测的尺度伪估计\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003elog\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003e/\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e再利用这些伪估计的一致性确定参数。本轮MDM先在给定位置下选择使尺度差异最小的形状，再以固定梯度偏移值\u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.1\u003c/mn\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e对条件最优值曲线定位，最后取伪尺度均值；不能把整个流程简写为同时最小化一个CDF平方差目标。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e经验CDF、概率图分数、相邻概率间距、各观测反推的尺度伪估计\u003c/td\u003e\n\u003ctd\u003e最小化分布差异、残差或距离；最大化概率间距评分；或让尺度伪估计更一致\u003c/td\u003e\n\u003ctd\u003e分数选择、位置定位、回归方向、分组方式、梯度阈值和固定偏移\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e因此，概率图、LSE／WLSE、最小距离估计、MPS／QMP和MDM可以通过这条机制链联系起来：它们分别改变了分布表示、确定准则或参数恢复环节。若某一方法再接入统计关系修正位置或条件似然恢复尺度，相应步骤继续连向其他路线。\u003c/p\u003e\n", "hash": "258fc57d8c058e1c102d626fc877d343b3513f4abdd88469822cb5d2a03bfcea"}, {"id": "section-4-image-1", "kind": "image", "src": "assets/v2.0-02-分布匹配路线-机制图.svg", "alt": "图4b　分布关系匹配的具体构造", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-4-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图4b｜同一分布关系形成不同的匹配过程。\u003c/strong\u003e 概率图部分把White／Soman的水平残差与Park的竖直残差并置，展示分数选择、位置评分和回归方向怎样共同决定参数。MPS比较CDF纵轴上的相邻概率间距；MDM先在给定位置下选择使尺度差异最小的形状，再沿该条件最优值曲线按梯度定位，最后以伪尺度均值恢复尺度。\u003c/p\u003e\n", "hash": "b6f1940b4578b1013ef80e5073fd17b8492b280e05d86c5a62611fb577deb75c"}]}], "content_hash": "a6e2873e256a518bda94b990c69aaac99c24b66820e9497fbc7e2cc87d18e5aa"}, {"id": "section-5", "title": "5　路线三：统计特征关系匹配与反演", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-5-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-5-text-0", "kind": "text", "html": "\u003cp\u003e这条路线提取样本的统计特征，利用它们与分布参数之间的理论关系，通过匹配、消元、求解或反演得到参数。核心在于选定特征怎样识别参数：先从样本得到特征（S1），写出相应的理论参数关系（S2），再通过该关系确定参数（S3）。这里关注若干选定特征及其理论关系；前一条路线则围绕样本的分布表示或概率结构指定拟合准则。\u003c/p\u003e\n\u003cp\u003e以常规矩法为例，样本均值、方差和偏度分别对应Weibull分布的理论矩。偏度中的位置与尺度被消去，留下关于形状的关系；解出形状后，再由方差和均值依次恢复尺度、位置。图5a下部追踪这组特征怎样接上理论曲线并得到参数。这是本例选择的识别次序，不要求所有统计关系方法都先消去位置和尺度、再估形状。\u003c/p\u003e\n", "hash": "865efd754aa00d5765f56f4df8f960b635bfc7e4e4925af04f51c46cb30f57b1"}, {"id": "section-5-flow-09-image", "kind": "image", "src": "assets/v2.0-09-统计关系反演路线-信息处理流程.svg", "alt": "图5a　统计特征关系匹配与反演的共同机制及矩法例子", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-5-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图5a｜选定特征，通过理论关系识别参数。\u003c/strong\u003e 上部S1—S3给出共同机制；下部常规矩例子将样本矩、形状理论关系和参数恢复连成一条过程。偏度消元、先形状后尺度位置是这个例子的具体实现。Cran、PWM／L矩和条件线性估计分别改变特征、理论关系或识别方式；统计量似然另接似然机制。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e样本矩、概率加权矩、L矩、分位数、次序统计量等选定特征\u003c/td\u003e\n\u003ctd\u003e匹配理论统计关系，或反演矩、枢轴关系和条件线性关系\u003c/td\u003e\n\u003ctd\u003e特征选择、权重和端部处理、位置与尺度消元、条件协方差选权、显式恢复和迭代代入\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e沿着这条机制看方法变化：Cran把常规幂矩改为生存函数幂次积分，用矩差及比值消元，再显式恢复参数；PWM、L矩和TL矩改变样本的秩权重与相应理论关系；分位数或枢轴方法选择其他特征及反演关系。条件位置MVLUE则由次序统计量的期望构造位置无偏估计，再利用理论协方差选择线性组合权重。其无偏、最小方差性质以形状、尺度已知并使用相应理论系数为条件，代入估计值后的三参数组合不能直接继承这些性质。\u003c/p\u003e\n\u003cp\u003e仅仅使用统计量，还不能说明采用了这条确定参数的机制。LSPF与早期W均值匹配方法使用相同形式的标准化统计量\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eW\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e却接入不同准则：均值匹配方法用理论 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eW\u003c/mi\u003e\u003cmo\u003eˉ\u003c/mo\u003e\u003c/mover\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e 与样本值相等确定形状；LSPF由内部W统计量的联合密度构造似然，按\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmi\u003eW\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmunder\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg max\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/munder\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003eW\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ew\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmo\u003e…\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ew\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e估计形状。LSPF随后用初始尺度代入最小值期望关系修正位置，再在该位置与形状下恢复尺度。因而，W消元是构造策略，形状估计体现L1／L2似然机制，位置恢复接入统计特征与参数的理论关系。LPF改用 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，只消去位置、保留尺度信息，由V联合密度联合估计形状与尺度，随后保留形状，按原文似然方程(9)、(10)重估位置与尺度；该恢复仍体现似然方程机制，不能只因使用统计量或分阶段处理就认定属于路线三。图5b将这些阶段分别连接；W／V的数据间距联合密度不能与MPS的CDF概率间距乘积混同。\u003c/p\u003e\n", "hash": "4362d64a8614d31b98770f8bbba63a1649eebca1706735179c8ce7250e562a55"}, {"id": "section-5-image-1", "kind": "image", "src": "assets/v2.0-03-统计关系反演路线-机制图.svg", "alt": "图5b　统计关系构造与W／V估计过程", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-5-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图5b｜由特征与理论关系展开方法，再读跨路线阶段。\u003c/strong\u003e 常规矩法用偏度消去位置和尺度，再由方差、均值恢复；Cran改用生存曲线积分及矩差显式反解；PWM、L矩与TL矩改变统计量的样本权重。W／V板块将构造策略、联合密度最大化及后续参数恢复分别标出：LSPF先由W估形状，再修正位置并恢复尺度；LPF先由V联合估计尺度与形状，随后保留形状并由原文似然方程重估其余参数。条件位置MVLUE根据理论期望及协方差构造、组合位置估计。\u003c/p\u003e\n", "hash": "6e11f1ff4adb46b4942bd6339bfea8a8b39d23d0e6bc5cea7990c64ba10d1436"}]}], "content_hash": "be2c9c1c9fc130515813d5654f0be2cb7cd822ccf6b45b2b4acb4ae8a9d6a8e1"}, {"id": "section-6", "title": "6　路线四、五：贝叶斯后验推断与学习型参数映射", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-6-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-6-text-0", "kind": "text", "html": "\u003cp\u003e贝叶斯后验推断将先验信息与样本似然结合，形成参数后验分布，再依据后验决策规则给出估计。对于给定数据，先以似然更新先验支持的参数区域；乘积经归一化得到联合后验（B1）：\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∫\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΘ\u003c/mi\u003e\u003c/msub\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eϑ\u003c/mi\u003e\u003cmo separator=\"true\"\u003e;\u003c/mo\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eϑ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003eϑ\u003c/mi\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e再根据损失函数选择后验决策（B2）：平方损失对应后验均值，绝对损失对应后验中位数，MAP取后验密度的峰。这里最终估计依据的是后验分布及相应规则，似然是其中的组成部分。图6a将同一候选参数轴上的先验、似然、后验与决策连起来；图6b再展开联合后验及计算路径。先验选择、支持域和决策规则改变了推断构造，Gibbs、MH及Laplace则分别服务于后验抽样或近似计算。后验可积性及所选输出量的存在性仍须按具体模型条件核验。\u003c/p\u003e\n", "hash": "f5b73702244106b1c0e39e923eabfc1a788deeea720e884fe2fbf1b80e268407"}, {"id": "section-6-flow-10-image", "kind": "image", "src": "assets/v2.0-10-后验推断路线-信息处理流程.svg", "alt": "图6a　贝叶斯后验构造与决策机制", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图6a｜由支持曲线到后验，再按估计规则作判断。\u003c/strong\u003e 似然和先验分别支持不同的候选区域，乘积归一化后形成后验。图中以平方损失为例，用后验平均损失的最低点说明为何选择后验均值；中位数与MAP使用各自的规则。\u003c/p\u003e\n", "hash": "4adbf68509f19fb10c0c261f3a3a473149e4d20220b8cebf632447a38bf951f6"}, {"id": "section-6-image-1", "kind": "image", "src": "assets/v2.0-04-后验推断路线-机制图.svg", "alt": "图6b　贝叶斯后验推断的构造及计算位置", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-text-2", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图6b｜联合后验、输出规则与计算过程。\u003c/strong\u003e 似然、先验和支持域共同确定联合后验；后验均值、中位数及MAP选择不同的输出量。条件抽样通过β、η、γ的循环更新形成后验样本，Laplace则通过后验峰附近的二次近似计算积分，两种路径服务于所选后验量。\u003c/p\u003e\n\u003cp\u003e学习型参数映射的核心机制发生在两个阶段。训练时，使用多组具有已知参数标签的样本 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e{\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmsubsup\u003e\u003cmo stretchy=\"false\"\u003e}\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，将样本或特征 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e 输入共享映射 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e，比较预测与标签并更新同一组权重（N1）：\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math display\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmunder\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg min\u003c/mi\u003e\u003cmo\u003e⁡\u003c/mo\u003e\u003c/mrow\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003c/munder\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/mfrac\u003e\u003cmunderover\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/munderover\u003e\u003cmi mathvariant=\"script\"\u003eL\u003c/mi\u003e\u003cmtext\u003e ⁣\u003c/mtext\u003e\u003cmrow\u003e\u003cmo fence=\"true\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo fence=\"true\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cmi mathvariant=\"normal\"\u003e.\u003c/mi\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e训练完成后固定映射，将新样本输入并输出估计 \u003cspan class=\"math inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cmover accent=\"true\"\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo stretchy=\"true\"\u003e^\u003c/mo\u003e\u003c/mover\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003en\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ee\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003ew\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c/span\u003e（N2）。图7a用多组样本、标签与共享权重的反馈表现训练，再接到新样本应用；图7b展开具体改动位置。ANN和BPNN可在特征、映射结构、损失或训练域上变化。即使用矩作输入，确定映射的机制仍是带标签训练；若网络只预测中间量，或PSO只搜索当前样本的目标，则需要连接到实际服务的估计环节，不能与直接参数映射合并。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003ccol style=\"width: 25%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e路线\u003c/th\u003e\n\u003cth\u003e样本信息\u003c/th\u003e\n\u003cth\u003e参数确定原则\u003c/th\u003e\n\u003cth\u003e实现与改进位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e贝叶斯后验推断\u003c/td\u003e\n\u003ctd\u003e样本似然信息＋参数先验\u003c/td\u003e\n\u003ctd\u003e后验规则，如均值、中位数或MAP\u003c/td\u003e\n\u003ctd\u003e先验、支持域、决策规则、后验抽样或近似\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e学习型参数映射\u003c/td\u003e\n\u003ctd\u003e多组带参数标签的训练样本及其特征\u003c/td\u003e\n\u003ctd\u003e训练映射，再对新样本输出三个参数\u003c/td\u003e\n\u003ctd\u003e特征、映射结构、训练域、损失、校准和外推边界\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n", "hash": "dedb2b1cd6e39ad85459a34e7d021ee883533bbf5379990dd291349153f21b33"}, {"id": "section-6-flow-11-image", "kind": "image", "src": "assets/v2.0-11-学习映射路线-信息处理流程.svg", "alt": "图7a　学习型参数映射的训练与应用机制", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-text-3", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图7a｜多组带标签样本训练，同一固定映射用于新样本。\u003c/strong\u003e 训练阶段（N1）中，多组样本的同类特征进入共享映射，参数预测与各自标签比较，整组误差反馈到同一组权重。应用阶段（N2）固定这些权重，将新样本转成三个参数估计；真实标签用于训练，应用时不需要提供新样本的真实参数。\u003c/p\u003e\n", "hash": "4d1c9418256ca2ffbe016510c78198790cb7358984371b73e877760095ee7fec"}, {"id": "section-6-image-2", "kind": "image", "src": "assets/v2.0-05-学习映射路线-机制图.svg", "alt": "图7b　学习型参数映射的具体改动及辅助作用", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-6-text-4", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图7b｜训练与使用分开看。\u003c/strong\u003e 训练阶段比较多组样本的参数预测和真值，按损失更新网络权重；使用阶段保持映射固定，将新样本的同类特征转成三个参数。图下部标出直接预测参数、学习统计估计器的中间量以及搜索当前样本目标的不同作用位置。\u003c/p\u003e\n", "hash": "42eacce91f090af90c9bea73578d111928d8a334e0bbe80262324b7aae3c492b"}]}], "content_hash": "46536b2d0054051c9e3cf3f37b038c6945916001a04e53bad9a86010abac4c03"}, {"id": "section-7", "title": "7　完整机理地图：方法怎样连接机制，方法之间怎样联系", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-7-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-7-text-0", "kind": "text", "html": "\u003cp\u003e分别理解五条路线后，再把具体方法接回地图。这里需要读两层联系。\u003c/p\u003e\n\u003cp\u003e第一层是\u003cstrong\u003e同一个方法内部的机制连接\u003c/strong\u003e。先识别它构造了什么、用什么确定哪个参数、其余参数怎样恢复，再按阶段连接路线节点。例如，LSPF依次经过W消元、W联合密度最大化、最小值期望位置修正及尺度恢复；SAM连接最小值期望关系、概率图回归和条件似然尺度更新；PM连接最小值中位数关系与给定位置的似然方程；Park Proposed+MLE2先用概率图相关性定位，再接平移样本的二参数MLE。它们可以跨路线展开，这些连接说明估计过程本身。\u003c/p\u003e\n\u003cp\u003e第二层是\u003cstrong\u003e不同方法之间有依据的关系\u003c/strong\u003e。例如，Jacquelin二参数推导扩展为三参数WMLE，随后再引入形状偏差修正，构成连续改进链；K–R的数据修改构造与Firth得分修正共同进入DMMLE，构成两个来源汇合的组合。方法之间的关系继续分为三种：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e沿袭或扩展：\u003c/strong\u003e 原文明确沿用、扩展或修正前一构造时使用实线。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e数学联系或共享构造：\u003c/strong\u003e 两种方法之间可核对的公式关系或共享构造使用虚线，并注明成立条件；同属一路线本身不构成历史沿袭证据。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e局部借用或组合：\u003c/strong\u003e 一个方法只借用了另一条路线的位置处理、统计量或参数恢复步骤时使用点划线。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e沿着这些关系，可以看到Jacquelin二参数推导向Cousineau WMLE及后续形状修正的扩展；Smith删最小值构造在K–R中的场景适配；K–R与Firth型修正形成DMMLE；White向Soman三参数概率图的扩展；MPS与QMP在特定分组设置下的特例关系；PWM与L矩的数学联系；以及LSPF向LPF的构造改进。MLE与MAP通过似然模型相连，MAP进一步引入先验和后验决策；PSO、模拟退火等工具则连接到各自搜索的目标。LSPF与早期W均值匹配方法共享标准化构造，但两者直接历史承接尚未确认；SAM与PM的相似框架，以及对LSPF／LPF的比较或实测数据引用，也不能直接画成父子沿袭。\u003c/p\u003e\n", "hash": "49071b1a4627d9760ed98b712dee497bd9aa7c6657b31c36cd242bf4c453f695"}, {"id": "section-7-image-1", "kind": "image", "src": "assets/v2.0-06-完整机理地图-估计路线与方法关系.svg", "alt": "图8　完整机理地图：估计路线与方法关系", "hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}, {"id": "section-7-text-1", "kind": "text", "html": "\u003cp\u003e\u003cstrong\u003e图8｜先沿机制读方法，再沿证据读方法关系。\u003c/strong\u003e 各路线的机制标识与前述原理图一致；跨路线过程线解释同一估计过程怎样接入不同机制。方法之间另用实线、虚线和点划线标注沿袭或扩展、数学联系及局部借用。沿Jacquelin→WMLE→形状修正、White→Soman、L矩→TL矩、LSPF→LPF等链，可见具体构造的延续；LSPF→Yang迭代、WMLE→MVLE-H扩展等记录局部步骤的借用。PWM与L矩、Cran矩与PWM、MPS与QMP的数学联系保留相应条件。Soman与Park的回归方向关系以同分数、同位置为前提，两文实际分数选择各异。\u003c/p\u003e\n", "hash": "6865863eb7ea82d81132a1ce41a7c6240642240c080eb24f19f0a9221ca457ed"}]}], "content_hash": "606ff2cbac07cabf520a081e4070f29cbbdfee745e85709bf551a75cd1d277cc"}, {"id": "section-8", "title": "8　本轮七种实现采用了哪些机制", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-8-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-8-text-0", "kind": "text", "html": "\u003cp\u003e本次统一比较选取七种实现，重点对照似然构造与优化、分布关系匹配、统计特征关系匹配与反演中的具体构造。它们在完整地图中标为金色，比较范围不限制整个路线图的文献范围。\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e实现\u003c/th\u003e\n\u003cth\u003e采用的路线机制\u003c/th\u003e\n\u003cth\u003e具体构造定位\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMLE\u003c/td\u003e\n\u003ctd\u003e似然构造与优化\u003c/td\u003e\n\u003ctd\u003e原始观测密度联合似然；另记录局部候选、边界与失败\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWMLE\u003c/td\u003e\n\u003ctd\u003e似然得分方程的修正\u003c/td\u003e\n\u003ctd\u003e在估计方程中引入三个权重\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMMLE（K–R单样本形式）\u003c/td\u003e\n\u003ctd\u003e最小值定位、删样本后的似然估计\u003c/td\u003e\n\u003ctd\u003e以样本最小值定位，删除该观测后进行二参数估计\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLSE（Soman主分支）\u003c/td\u003e\n\u003ctd\u003e分布关系匹配\u003c/td\u003e\n\u003ctd\u003eWhite分数、位置评分和对数寿命对分数回归\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLRE（Park Proposed+Plot）\u003c/td\u003e\n\u003ctd\u003e分布关系匹配\u003c/td\u003e\n\u003ctd\u003e相关系数定位、绘图概率分数和分数对对数寿命回归\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMDM-0.1\u003c/td\u003e\n\u003ctd\u003e分布关系匹配、分阶段参数确定\u003c/td\u003e\n\u003ctd\u003e条件尺度伪估计差异、固定梯度偏移值下的位置定位\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMM（Cran式）\u003c/td\u003e\n\u003ctd\u003e统计特征关系匹配与反演\u003c/td\u003e\n\u003ctd\u003eWeibull矩及矩差显式恢复参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这些实现形成构造对照：MLE、WMLE和K–R对应原始似然、方程加权与最小值定位后估计；LSE、LRE和MDM对应分布关系匹配的不同分支；Cran MM对应选定统计关系的显式恢复。这里按实际机制说明差别，不将七种实现分配到互斥格子，也不把同名的其他版本混入比较。\u003c/p\u003e\n", "hash": "369e623c6d1e632094a77a5977b4eb8924f2b74abd507cefaeb8f8693cdb25b0"}]}], "content_hash": "fac5bc891ccac3edd21b02ab33177e32ea44c881350baf2f99b7a8ec84375aac"}, {"id": "section-9", "title": "9　转入统一性能比较", "mode": "content", "state": "open", "selected": null, "options": [{"id": "section-9-current", "label": "当前v2.0工作稿", "blocks": [{"id": "section-9-text-0", "kind": "text", "html": "\u003cp\u003e后续结果将回到这些具体构造：出现偏差时检查位置处理、统计量构造和参数恢复；出现波动或异常时检查信息保留和求解环节。\u003c/p\u003e\n\u003cp\u003e第二部分将在共同抽样条件下比较这七种实现，分析性能差异怎样随样本量与形状参数变化，并结合地图中的具体构造解释典型表现。\u003c/p\u003e\n\u003cp\u003e——转入\u003ca href=\"assets/v2.0-source-comparison-report.md\"\u003e报告下（方法对比）v0.4\u003c/a\u003e。\u003c/p\u003e\n", "hash": "31f47975793a5cc91c9a7ff04b0f91f450b83cddd48b8f5865c3dc5d174bae56"}]}], "content_hash": "60af1b30c54b8821afb7c25f75c84dbbfd28c7ce1c5d1655a0b7bd2631b1489d"}, {"id": "references", "title": "文献与源文件", "mode": "content", "state": "open", "selected": null, "options": [{"id": "references-current", "label": "当前v2.0工作稿", "blocks": [{"id": "references-text-0", "kind": "text", "html": "\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-method-workdraft.md\"\u003e方法分类工作稿\u003c/a\u003e：逐篇维护信息利用、参数原则、实现改进、关系证据和边界。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-yang-classification.md\"\u003eYang综述的八类分类\u003c/a\u003e：保留综述原始分类与名称辨析。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-research09-routes.md\"\u003eResearch09的四条路线\u003c/a\u003e：保留已有路线归纳及其局限。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-机制图-v2.0-README.md\"\u003e机制图-v2.0目录\u003c/a\u003e：五条路线的原理图、方法细图、完整机理地图、draw.io源文件和静态预览图；图中公式采用LaTeX标准排版，英文及数学变量使用Times New Roman，制图规则见该目录说明。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-position-feedback.md\"\u003e2026-10-22路线图定位修正意见\u003c/a\u003e：保存本轮修改原话、原因与组织方向；v1.1正文及配图归档于\u003ca href=\"assets/v2.0-source-方法分类-v1.1-README.md\"\u003e历史版本\u003c/a\u003e。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"assets/v2.0-source-experiment-settings.md\"\u003e实验设置\u003c/a\u003e：统一比较对象、计算版本和数据合同。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003ca href=\"https://www.itl.nist.gov/div898/handbook/apr/section4/apr412.htm\"\u003eNIST：最大似然估计及完整／删失样本的似然构造\u003c/a\u003e：核对似然函数、最大化准则与求解步骤的区别。\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n", "hash": "a72f76b27d2dd8135fbb0390a63c924c598f79d9ab6433d4a8bfeec2d724a191"}]}], "content_hash": "3c1f42f73511cca4bb78283f1b5b8c1983435d031d4461aa0b537d0f678966e9"}], "last_applied_submission_id": "018eb7e6-8aa8-49b3-82ea-67fe7613200e", "review_complete": false, "last_rendered_submission_id": "018eb7e6-8aa8-49b3-82ea-67fe7613200e", "archive_targets": {"output": "C:\\Web\\Weibull\\Study\\04-study-小样本三参数Weibull估计方法比较与选择\\报告上（方法分类）-v2.0.md", "sync_remote": true}}</script>

'use strict';

const $=id=>document.getElementById(id),online=location.protocol==='http:'||location.protocol==='https:';
const actionLabels={auto:'默认处理',defer:'暂不处理',converge:'选定',extend:'继续发散',modify:'按意见修改'};
const isContent=unit=>(unit.mode||(unit.options.length===1?'content':'choices'))==='content';
const isMultiple=unit=>(unit.selection_mode||'multiple')==='multiple';
function selectionIds(value){return Array.isArray(value.selected_ids)?[...value.selected_ids]:value.selected?[value.selected]:[]}
function setSelection(unit,state,id,checked){const ids=isMultiple(unit)?new Set(selectionIds(state)):new Set();if(checked)ids.add(id);else ids.delete(id);state.selected_ids=unit.options.map(o=>o.id).filter(oid=>ids.has(oid));state.selected=state.selected_ids.length===1?state.selected_ids[0]:null}
let sidebarVisible=false,outlineEntries=[];
const sidebarKey=()=>`review-html:${board.id}:sidebar-visible`;

function syncSidebar(){const toggle=$('sidebar-toggle');document.body.classList.toggle('sidebar-visible',sidebarVisible);toggle.setAttribute('aria-expanded',String(sidebarVisible));toggle.setAttribute('aria-pressed',String(sidebarVisible));toggle.setAttribute('aria-label',sidebarVisible?'隐藏侧边栏':'显示侧边栏');toggle.title=sidebarVisible?'隐藏侧边栏':'显示侧边栏'}

function outlineLevel(unit){if(Number.isInteger(unit.outline_level))return Math.max(1,Math.min(6,unit.outline_level));const match=unit.title.match(/^\s*(\d+(?:\.\d+)*)(?=[\s、．]|$)/);return match?match[1].split('.').length:1}
function decisionBadge(unit,state={}){if(board.review_complete)return '';if(state.action==='extend')return '待发散';if(isContent(unit))return state.section_note||Object.values(state.notes||{}).some(Boolean)||state.annotations?.length||state.block_notes?.length||state.image_notes?.length?'有批注':'';const count=selectionIds(state).length;return count?`已选${count}`:'待选择'}
function updateOutlineStatus(){for(const entry of outlineEntries){const message=decisionBadge(entry.unit,draft.units[entry.unit.id]);entry.badge.textContent=message;entry.badge.classList.toggle('pending',message==='待选择'||message==='待发散')}}

function renderOutline(){outlineEntries=[];$('outline').replaceChildren();for(const unit of board.units){const node=unitNode(unit);if(!node)continue;const level=outlineLevel(unit),targets=[{target:node,title:unit.title,level}];if(isContent(unit))for(const heading of node.querySelectorAll('.block h2,.block h3,.block h4,.block h5,.block h6')){targets.push({target:heading,title:heading.textContent,level:Math.min(6,level+Math.max(1,Number(heading.tagName.slice(1))-2))})}for(const target of targets){const row=el('li'),button=el('button','outline-link'),label=el('span','outline-label',target.title),badge=el('span','outline-badge');button.type='button';button.style.setProperty('--depth',target.level-1);button.append(label,badge);const entry={unit,target:target.target,button,badge};if(target.target!==node)entry.badge=el('span');button.onclick=()=>jumpToOutline(entry);row.append(button);$('outline').append(row);outlineEntries.push(entry)}}updateOutlineStatus();syncSidebar()}

 const delivery=board.delivery;

 if(board.submitted){

 }

 return delivery.wait_active?'当前有活动 wait 正在等待反馈':'页面可用；当前没有活动 wait';

function freshDraft(){return {units:Object.fromEntries(board.units.map(u=>[u.id,{selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[],section_note:'',block_notes:[],image_notes:[],gallery_positions:{}}])),submission_id:null,intent:'submit'}}
function fillDraft(){draft.previews??={};for(const u of board.units){draft.units[u.id]??={selected:u.selected||null,selected_ids:selectionIds(u),action:'auto',notes:{},annotations:[]};const state=draft.units[u.id];state.selected_ids=selectionIds(state);state.selected=state.selected_ids.length===1?state.selected_ids[0]:null;state.section_note??='';state.block_notes??=[];state.image_notes??=[];state.gallery_positions??={}}}
function loadDraft(){try{draft=JSON.parse(localStorage.getItem(key()))||freshDraft()}catch{draft=freshDraft()}fillDraft()}

async function saveRemoteDraft(){if(!online||savingDraft||!dirtyDraft)return;savingDraft=true;dirtyDraft=false;const snapshot=JSON.stringify(snapshotDraft());try{const response=await fetch('api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw Error()}catch{dirtyDraft=true}finally{savingDraft=false;if(dirtyDraft)draftTimer=setTimeout(saveRemoteDraft,1500)}}
function persist(){if(initializing)return;draft.updated_at=Date.now();draft.scroll_y=scrollY;draft.unit_hashes=Object.fromEntries(board.units.map(u=>[u.id,u.content_hash]));if(pending)draft.editor={...pending,comment:$('editor-input').value};else delete draft.editor;try{localStorage.setItem(key(),JSON.stringify(draft))}catch{status('浏览器草稿保存失败，请及时提交',true)}dirtyDraft=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveRemoteDraft,250);updateOutlineStatus()}
function restoreEditor(){const editor=draft.editor;if(!editor||board.submitted||board.processing||board.review_complete)return;if(editor.kind==='divergence'||editor.kind==='section-note'){if(board.units.some(u=>u.id===editor.unit_id))openEditor(editor);return}if(structuredNote(editor)){const unit=board.units.find(u=>u.id===editor.unit_id),option=unit?.options.find(o=>o.id===editor.option_id),block=option?.blocks.find(b=>b.id===editor.block_id);if(editor.kind==='option-note'?option:block&&(editor.kind!=='image-note'||block.images?.some(i=>i.id===editor.image_id)))openEditor(editor);return}const node=blockNode(editor.unit_id,editor.option_id,editor.block_id);if(node&&node.dataset.hash===editor.block_hash&&anchorRange(node,editor))openEditor(editor)}
async function hydrateDraft(){if(!online)return;try{const response=await fetch('api/draft');if(!response.ok)return;const saved=await response.json();if(saved&&saved.board_id===board.id&&saved.board_revision===board.revision&&saved.updated_at>(draft.updated_at||0)){draft=saved.draft;draft.updated_at=saved.updated_at;fillDraft();localStorage.setItem(key(),JSON.stringify(draft));render(board)}}catch{}}

function unitNode(unit){return [...$('units').children].find(n=>n.dataset.unit===unit.id)}
function blockNode(unitId,optionId,blockId){const unit=unitNode({id:unitId});return unit&&[...unit.querySelectorAll('[data-block]')].find(n=>n.dataset.option===optionId&&n.dataset.block===blockId)}
const structuredNote=anchor=>['section-note','option-note','block-note','image-note'].includes(anchor.kind);

  for(const note of item.block_notes){const block=unit.options.find(o=>o.id===note.option_id)?.blocks.find(b=>b.id===note.block_id);lines.push(`图表“${block?.alt||note.block_id}”：${note.comment}`)}

  for(const note of item.image_notes){const option=unit.options.find(o=>o.id===note.option_id),block=option?.blocks.find(b=>b.id===note.block_id),image=block?.images?.find(i=>i.id===note.image_id);lines.push(`图片“${image?.label||note.image_id}”：${note.comment}`)}
 }
 if(lines.length===1)lines.push('\n当前没有新增选择或批注；可在此补充希望 Agent 接着处理的内容。');return lines.join('\n')
}
function preview(intent='submit'){
 if(board.submitted||board.processing||board.review_complete||busy)return;if(pending)saveNote();
 const generated=composePreview(intent),previous=draft.previews[intent],edited=previous&&previous.text!==previous.generated_text;
 if(!edited)draft.previews[intent]={text:generated,generated_text:generated};
 draft.intent=intent;draft.preview_open=intent;draft.submission_id=null;
 $('confirmation-title').textContent=intent==='archive'?'存档预览':'提交预览';$('confirmation-input').setAttribute('aria-label',intent==='archive'?'预计存档操作':'预计提交内容');$('confirmation-input').value=draft.previews[intent].text;
 $('confirmation-hint').textContent=edited&&previous.generated_text!==generated?'选择或批注已有变化，已保留你编辑过的文字。请核对后确认。':intent==='archive'?'先审阅和修改预计存档操作；确认后才交给 Agent 执行。':'以下是准备交给 Agent 的内容，可以直接修改。确认前不会发送。';
 $('confirmation-error').hidden=true;$('confirm-send').textContent=intent==='archive'?'确认存档':'确认提交';$('confirm-send').disabled=false;$('back-preview').disabled=false;
 if(!$('confirmation').open)$('confirmation').showModal();$('confirmation-input').focus();persist()
}
function backPreview(){if(busy)return;delete draft.preview_open;$('confirmation').close();persist()}
$('back-preview').onclick=backPreview;$('confirmation').addEventListener('cancel',event=>{event.preventDefault();backPreview()});
$('confirmation-input').addEventListener('input',()=>{draft.previews[draft.intent].text=$('confirmation-input').value;draft.submission_id=null;persist()});
async function submitConfirmed(){
 if(!$('confirmation').open||board.submitted||board.processing||board.review_complete||busy)return;
 const intent=draft.intent,confirmed=draft.previews[intent];confirmed.text=$('confirmation-input').value;
 if(!confirmed.text.trim()){$('confirmation-error').textContent='请填写要交给 Agent 的内容。';$('confirmation-error').hidden=false;return}
 const body={submission_id:draft.submission_id||(draft.submission_id=uid()),board_id:board.id,board_revision:board.revision,intent,confirmation:{confirmed:true,intent,text:confirmed.text,generated_text:confirmed.generated_text},units:decisions()};persist();
 if(!online){const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download='feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status('已导出；自动回传需通过本机审批地址打开',true);return}
 busy=true;$('submit').disabled=true;$('archive').disabled=true;$('confirm-send').disabled=true;$('back-preview').disabled=true;status(intent==='archive'?'正在提交存档请求':'正在提交');
 try{const response=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw Error(result.error||'提交失败');delete draft.preview_open;persist();$('confirmation').close();board.submitted=true;render(board);await loadHistory()}
 catch(error){$('confirmation-error').textContent=`${error.message}；草稿已保留`;$('confirmation-error').hidden=false;status(`${error.message}；草稿已保留`,true)}finally{busy=false;$('confirm-send').disabled=false;$('back-preview').disabled=false;$('submit').disabled=!!board.submitted||!!board.processing||!!board.review_complete;$('archive').disabled=$('submit').disabled}
}
$('submit').onclick=()=>preview('submit');
$('archive').onclick=()=>preview('archive');
$('confirm-send').onclick=submitConfirmed;
async function loadHistory(){if(!online)return;try{const response=await fetch('api/history');if(!response.ok)return;const entries=await response.json();$('history').hidden=!entries.length;$('history-items').replaceChildren();for(const entry of entries){const row=el('div','history-round');const stamp=new Date(entry.submitted_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});row.append(el('p','',`第 ${entry.board_revision} 轮 · ${stamp}${entry.intent==='archive'?' · 落地存档':''}`));if(entry.confirmation){const message=el('p','',entry.confirmation.text);message.style.whiteSpace='pre-wrap';row.append(message)}for(const unit of entry.units){if(unit.mode==='content'&&unit.next_action==='defer'&&!Object.keys(unit.notes).length&&!unit.annotations.length&&!unit.image_notes?.length&&!unit.section_note&&!unit.block_notes?.length)continue;row.append(el('p','',`${unit.unit_title}${unit.mode==='content'?'':` · ${unit.selected_labels?.join('、')||unit.selected_label||'未选'}`} · ${actionLabels[unit.next_action]}`));const notes=el('ul');if(unit.inspiration)notes.append(el('li','',`发散启发：${unit.inspiration}`));for(const note of Object.values(unit.notes))notes.append(el('li','',note));if(unit.section_note)notes.append(el('li','',`本节备注：${unit.section_note}`));for(const note of unit.block_notes||[])notes.append(el('li','',`${note.label||note.block_id}：${note.comment}`));for(const note of unit.annotations)notes.append(el('li','',`“${note.quote}”：${note.comment}`));for(const note of unit.image_notes||[])notes.append(el('li','',`${note.label}：${note.comment}`));if(notes.children.length)row.append(notes)}$('history-items').prepend(row)}}catch{}}
async function refresh(){if(!online||busy)return;try{const response=await fetch('api/board');if(!response.ok)throw Error();const next=await response.json(),stable={...next};delete stable.submitted;if(JSON.stringify(stable)!==signature||next.submitted!==board.submitted){render(next);await loadHistory()}}catch{if(!board.submitted)status('连接中断；草稿保留在本机',true)}}
function flushDraft(){if(online&&dirtyDraft){navigator.sendBeacon('api/draft',new Blob([JSON.stringify(snapshotDraft())],{type:'application/json'}))}}
addEventListener('pagehide',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft()});
async function initialize(){loadDraft();render(board);await refresh();await hydrateDraft();initializing=false;if(draft.scroll_y)scrollTo(0,draft.scroll_y);if(draft.preview_open)preview(draft.preview_open);else restoreEditor();loadHistory();if(online)setInterval(refresh,1600)}
initialize();
</script>
