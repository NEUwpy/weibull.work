="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="598.5,340.0 266.4,840.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><polyline points="1029.3,340.0 672.5,840.0" fill="none" stroke="#7F6B93" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-open-7F6B93)"/><rect x="40.0" y="24.0" width="1720.0" height="48.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="59.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32.0" fill="#263238" text-anchor="start" font-weight="700">机制图 02｜分布匹配路线</text><rect x="40.0" y="78.0" width="1720.0" height="32.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="100.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19.0" fill="#63758A" text-anchor="start">核心问题：理论分布能否再现样本呈现的分布结构？</text><rect x="40.0" y="112.0" width="1720.0" height="28.0" rx="0" fill="none" stroke="none" stroke-width="0"/><text x="40.0" y="132.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#63758A" text-anchor="start">蓝灰：共同信息与主流程　珊瑚：本路线的决定性原则　绿色：参数输出　紫灰：实现、改进与边界</text><rect x="40.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="50.0" y="236.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">① 样本 D</text><text x="50.0" y="262.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">排序寿命样本</text><text x="50.0" y="288.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#263238" text-anchor="start">完整样本或指定观测条件</text><rect x="475.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#F7F9FB" stroke="#63758A" stroke-width="1.6"/><text x="485.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">② 信息利用</text><text x="485.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">经验分布、绘图概率、CDF概率间隔、</text><text x="485.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">概率图坐标、密度或由观测反推的伪尺</text><text x="485.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">度。</text><rect x="910.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="920.0" y="224.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">③ 参数确定原则</text><text x="920.0" y="249.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">选择使理论分布与样本结构最一致的参</text><text x="920.0" y="274.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">数：最小化残差／距离、最大化概率间</text><text x="920.0" y="299.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#6F2F2B" text-anchor="start">距，或最小化伪尺度差异。</text><rect x="1345.0" y="170.0" width="360.0" height="170.0" rx="10" fill="#EEF8F2" stroke="#548A74" stroke-width="1.6"/><text x="1355.0" y="237.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">④ 三参数估计</text><text x="1355.0" y="262.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">β̂、η̂、γ̂</text><text x="1355.0" y="287.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#263238" text-anchor="start">以及拟合评分、间距评分或一致性曲线</text><rect x="70.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">概率图分支</text><text x="80.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">White／Soman／Park：分数、位置判据、回归方向和参数</text><text x="80.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">恢复共同决定估计器。</text><rect x="615.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">LSE／WLSE</text><text x="625.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">在经验分布或变换关系上最小化残差；权重属于实现与改进</text><text x="625.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">标签。</text><rect x="1160.0" y="445.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="1170.0" y="469.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">MPS／QMP</text><text x="1170.0" y="492.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">使用排序样本在理论CDF上的概率间距；MPS可作为特定QMP</text><text x="1170.0" y="514.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">设置的特例。</text><rect x="70.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="80.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">MDM</text><text x="80.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">比较每个观测反推的尺度伪估计是否一致；位置用条件差异</text><text x="80.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">曲线及梯度规则定位。</text><rect x="615.0" y="550.0" width="500.0" height="82.0" rx="10" fill="#FFF5F2" stroke="#B44948" stroke-width="1.6"/><text x="625.0" y="574.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">CDF／密度／最小距离</text><text x="625.0" y="597.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">直接把理论分布与经验对象比较；具体目标函数和支持条件</text><text x="625.0" y="619.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6F2F2B" text-anchor="start">需逐篇核对。</text><rect x="70.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">绘图概率</text><rect x="475.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">回归方向</text><rect x="880.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="890.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">概率间距</text><rect x="1285.0" y="785.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="1295.0" y="812.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">残差／距离</text><rect x="70.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="80.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">伪尺度一致性</text><rect x="475.0" y="840.0" width="365.0" height="42.0" rx="10" fill="#F4F0F8" stroke="#7F6B93" stroke-width="1.6"/><text x="485.0" y="867.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17.0" fill="#57436B" text-anchor="start">位置搜索</text><rect x="40.0" y="945.0" width="1665.0" height="90.0" rx="10" fill="#FFFBEA" stroke="#B18B2C" stroke-width="1.6"/><text x="50.0" y="985.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">解释边界</text><text x="50.0" y="1007.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18.0" fill="#6B5310" text-anchor="start">最大化概率间距与最大化密度似然的统计对象不同；共同使用概率量不自动表示沿袭。</text></svg>