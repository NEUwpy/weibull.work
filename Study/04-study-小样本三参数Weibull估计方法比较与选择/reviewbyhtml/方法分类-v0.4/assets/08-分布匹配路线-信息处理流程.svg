<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1370" viewBox="0 0 2000 1370" role="img" aria-label="08-分布匹配路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-2D6D91" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#2D6D91" stroke="#2D6D91" stroke-width="1.3"/></marker><marker id="arrow-open-2D6D91" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#2D6D91" stroke-width="1.3"/></marker></defs><polyline points="590.0,365.0 730.0,365.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1270.0,365.0 1410.0,365.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="590.0,735.0 730.0,735.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1270.0,735.0 1410.0,735.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="590.0,1105.0 730.0,1105.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1270.0,1105.0 1410.0,1105.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><rect x="45.0" y="20.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="64.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">分布匹配｜先构造可比较的分布量，再建立评分并选择参数</text><rect x="45.0" y="100.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="141.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">各行展开一种实际构造：比较对象、评分的来源和参数判定原则连续相接。</text><rect x="50.0" y="190.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="224.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">概率图：把Weibull分布关系变成直线</text><rect x="50.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="320.0" y="311.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">构造变换后的坐标</text><text x="320.0" y="342.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">uᵢ(γ)=ln(x₍ᵢ₎−γ)</text><text x="320.0" y="373.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Park：pᵢ→zᵢ=ln[−ln(1−pᵢ)]</text><text x="320.0" y="405.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">White：取标准对数Weibull</text><text x="320.0" y="436.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">次序统计量的期望</text><rect x="730.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="1000.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">由分布关系形成回归残差</text><text x="1000.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">z≈βu−β lnη</text><text x="1000.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">选u对z或z对u回归</text><text x="1000.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Q=Σ(观测坐标−拟合坐标)²</text><rect x="1410.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#2D6D91" stroke-width="1.8"/><text x="1680.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">依据拟合程度与位置评分确定</text><text x="1680.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">回归使Q最小</text><text x="1680.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Soman按F评分、Park按相关性定γ</text><text x="1680.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">再由斜率和截距反解β、η</text><rect x="50.0" y="560.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="594.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">CDF差异／MPS：把观测位置换成累积概率，再比较整组评分</text><rect x="50.0" y="630.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="320.0" y="696.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">在候选θ下计算观测的CDF值</text><text x="320.0" y="728.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Fᵢ=Fθ(x₍ᵢ₎)</text><text x="320.0" y="759.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">MPS另加F₀=0、Fₙ₊₁=1</text><text x="320.0" y="790.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">候选θ改变各概率区间的长度</text><rect x="730.0" y="630.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="1000.0" y="696.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">把概率偏离或间距合成目标</text><text x="1000.0" y="728.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">CDF差异：D(θ)=Σᵢwᵢ(Fᵢ−pᵢ)²</text><text x="1000.0" y="759.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">MPS间距：Dᵢ=Fᵢ−Fᵢ₋₁</text><text x="1000.0" y="790.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">间距评分：Q(θ)=Σᵢ₌₁ⁿ⁺¹ln Dᵢ</text><rect x="1410.0" y="630.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#2D6D91" stroke-width="1.8"/><text x="1680.0" y="696.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">按所选目标比较候选参数</text><text x="1680.0" y="728.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">差异准则：θ̂=argminθ D(θ)</text><text x="1680.0" y="759.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">间距准则：θ̂=argmaxθ Q(θ)</text><text x="1680.0" y="790.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">比较的是整组概率关系的总评分</text><rect x="50.0" y="930.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="964.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">MDM：同一分布模型应让各观测反推的尺度尽量一致</text><rect x="50.0" y="1000.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="320.0" y="1066.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">每个观测反推一个尺度</text><text x="320.0" y="1098.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">qᵢ=−ln(1−pᵢ)</text><text x="320.0" y="1129.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">ηᵢ(β,γ)=(x₍ᵢ₎−γ)/qᵢ^(1/β)</text><text x="320.0" y="1160.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">同一候选β、γ产生一组伪尺度</text><rect x="730.0" y="1000.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#2D6D91" stroke-width="1.8"/><text x="1000.0" y="1066.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">先形成条件最小离散曲线</text><text x="1000.0" y="1098.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">s(β,γ)=stdᵢ[ηᵢ(β,γ)]</text><text x="1000.0" y="1129.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">固定γ：β*(γ)=argminβ s(β,γ)</text><text x="1000.0" y="1160.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">s*(γ)=s[β*(γ),γ]</text><rect x="1410.0" y="1000.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#2D6D91" stroke-width="1.8"/><text x="1680.0" y="1066.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">再由梯度阈值和均值确定</text><text x="1680.0" y="1098.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">g(γ)=ds*(γ)/dγ，按g(γ)=δ定位</text><text x="1680.0" y="1129.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">约束γ≥0时：g(0)≥δ则γ̂=0</text><text x="1680.0" y="1160.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">β̂=β*(γ̂)，η̂=meanᵢηᵢ(β̂,γ̂)</text></svg>