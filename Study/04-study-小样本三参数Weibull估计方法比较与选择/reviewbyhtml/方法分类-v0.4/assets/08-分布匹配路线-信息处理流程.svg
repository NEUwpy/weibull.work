<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-label="08-分布匹配路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-2D6D91" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#2D6D91" stroke="#2D6D91" stroke-width="1.3"/></marker><marker id="arrow-open-2D6D91" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#2D6D91" stroke-width="1.3"/></marker></defs><polyline points="290.0,455.0 360.0,455.0" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="620.0,455.0 675.0,455.0 675.0,277.5 730.0,277.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1030.0,277.5 1110.0,277.5" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="620.0,455.0 675.0,455.0 675.0,477.5 730.0,477.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1030.0,477.5 1110.0,477.5" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="620.0,455.0 675.0,455.0 675.0,677.5 730.0,677.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1030.0,677.5 1110.0,677.5" fill="none" stroke="#2D6D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1440.0,277.5 1480.0,277.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1440.0,477.5 1480.0,477.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><polyline points="1440.0,677.5 1480.0,677.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#2D6D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2D6D91)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">分布匹配｜把样本写成分布关系，按对应的匹配规则求解</text><rect x="45.0" y="95.0" width="1710.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="131.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">不同分支选取不同的比较对象；比较对象决定参数评分和恢复过程。</text><rect x="50.0" y="380.0" width="240.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#2D6D91" stroke-width="1.8"/><text x="170.0" y="448.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">输入寿命样本 D</text><text x="170.0" y="479.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">提取所需观测</text><rect x="360.0" y="380.0" width="260.0" height="150.0" rx="10" fill="#F1F7FA" stroke="#2D6D91" stroke-width="1.8"/><text x="490.0" y="448.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">选取这类方法使用的</text><text x="490.0" y="479.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">样本表示与理论关系</text><rect x="730.0" y="200.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#2D6D91" stroke-width="1.8"/><text x="880.0" y="255.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">概率图表示</text><text x="880.0" y="285.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">绘图分数 zᵢ</text><text x="880.0" y="315.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">对数寿命 uᵢ(γ)</text><rect x="1110.0" y="200.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#2D6D91" stroke-width="1.8"/><text x="1275.0" y="255.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">回归与位置定位</text><text x="1275.0" y="285.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">按残差、相关性或位置评分</text><text x="1275.0" y="315.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">确定位置、斜率与截距</text><rect x="730.0" y="400.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#2D6D91" stroke-width="1.8"/><text x="880.0" y="455.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">CDF 表示</text><text x="880.0" y="485.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">经验概率与 Fθ(x₍ᵢ₎)</text><text x="880.0" y="515.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">或相邻 CDF 概率间距</text><rect x="1110.0" y="400.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#2D6D91" stroke-width="1.8"/><text x="1275.0" y="455.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">分布差异或间距评分</text><text x="1275.0" y="485.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">最小化相应分布差异</text><text x="1275.0" y="515.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">或最大化间距目标</text><rect x="730.0" y="600.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#2D6D91" stroke-width="1.8"/><text x="880.0" y="655.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">伪尺度表示</text><text x="880.0" y="685.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">各观测反推 ηᵢ(β,γ)</text><text x="880.0" y="715.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">计算这些尺度的离散程度</text><rect x="1110.0" y="600.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#2D6D91" stroke-width="1.8"/><text x="1275.0" y="640.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">MDM 分步确定参数</text><text x="1275.0" y="670.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">给定 γ，条件确定 β</text><text x="1275.0" y="700.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">按梯度阈值 δ 定位 γ</text><text x="1275.0" y="730.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">伪尺度均值恢复 η</text><rect x="1520.0" y="380.0" width="230.0" height="155.0" rx="10" fill="#EAF4EE" stroke="#2D6D91" stroke-width="1.8"/><text x="1635.0" y="450.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">按相应关系恢复</text><text x="1635.0" y="481.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">β̂、η̂、γ̂</text><rect x="55.0" y="795.0" width="1690.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="836.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">回归、分布距离、概率间距与伪尺度一致性，分别给出具体的匹配依据。</text></svg>