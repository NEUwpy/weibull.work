,825.0" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1190.0,910.0 1227.0,910.0" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1457.0,910.0 1494.0,910.0" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1609.0,995.0 1609.0,1040.0 1075.0,1040.0 1075.0,995.0" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1342.0,995.0 1342.0,1110.0" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1370.0,502.5 1770.0,502.0 1770.0,1300.0 1724.0,1300.0" fill="none" stroke="#367B98" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-block-367B98)"/><polyline points="75.0,1135.0 58.0,1135.0 58.0,1400.0 500.0,1400.0 500.0,1512.0 540.0,1512.5" fill="none" stroke="#785499" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1724.0,1160.0 1740.0,1160.0 1740.0,1512.0 1260.0,1512.5" fill="none" stroke="#2C7B61" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1342.0,1340.0 1342.0,1420.0 900.0,1420.0 900.0,1460.0" fill="none" stroke="#367B98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-367B98)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">后验推断｜联合后验怎样变成三个参数的估计</text><rect x="45.0" y="90.0" width="1710.0" height="45.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="120.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">先把样本贡献、参数先验与支持域组合，再选择所需后验量和计算路径。</text><rect x="60.0" y="170.0" width="480.0" height="145.0" rx="10" fill="#F7F1FB" stroke="#785499" stroke-width="1.8"/><text x="300.0" y="235.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">参数先验 π(β,η,γ)</text><text x="300.0" y="267.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">表达参数范围与已有信息</text><rect x="660.0" y="170.0" width="480.0" height="145.0" rx="10" fill="#FFF5F0" stroke="#A75043" stroke-width="1.8"/><text x="900.0" y="235.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">样本 D 的联合似然</text><text x="900.0" y="267.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26.0" fill="#243449" text-anchor="middle">L(β,η,γ|D)=∏ᵢ f(xᵢ|β,η,γ)</text><rect x="1260.0" y="170.0" width="480.0" height="145.0" rx="10" fill="#F3F6FA" stroke="#64748B" stroke-width="1.8"/><text x="1500.0" y="220.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">模型与先验的支持域相交</text><text x="1500.0" y="251.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">β&gt;0，η&gt;0，γ&lt;x₍₁₎</text><text x="1500.0" y="282.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">再结合位置参数的先验域</text><rect x="430.0" y="425.0" width="940.0" height="155.0" rx="10" fill="#F4EDF9" stroke="#785499" stroke-width="1.8"/><text x="900.0" y="477.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">三参数联合后验</text><text x="900.0" y="512.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">p(β,η,γ|D) = L(β,η,γ|D) π(β,η,γ) / Z</text><text x="900.0" y="547.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">Z 为允许参数域内 Lπ 的积分</text><rect x="70.0" y="700.0" width="775.0" height="60.0" rx="10" fill="#F8F5FC" stroke="#785499" stroke-width="1.8"/><text x="457.5" y="739.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">① 选取哪一个后验量作为估计</text><rect x="955.0" y="700.0" width="775.0" height="60.0" rx="10" fill="#F3F8FA" stroke="#2C7B61" stroke-width="1.8"/><text x="1342.5" y="739.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">② 怎样计算需要的后验量</text><rect x="75.0" y="825.0" width="230.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#785499" stroke-width="1.8"/><text x="190.0" y="892.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">后验均值</text><text x="190.0" y="923.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">θ̂ = E(θ|D)</text><text x="190.0" y="955.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">对应平方损失</text><rect x="340.0" y="825.0" width="230.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#785499" stroke-width="1.8"/><text x="455.0" y="892.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">逐参数后验中位数</text><text x="455.0" y="923.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">median(θₖ|D)</text><text x="455.0" y="955.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">对应绝对损失</text><rect x="605.0" y="825.0" width="230.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#785499" stroke-width="1.8"/><text x="720.0" y="893.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">MAP</text><text x="720.0" y="923.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">argmaxθ p(θ|D)</text><text x="720.0" y="953.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">取联合后验密度峰</text><rect x="75.0" y="1080.0" width="760.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#785499" stroke-width="1.8"/><text x="455.0" y="1128.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">先验与似然决定同一个联合后验</text><text x="455.0" y="1159.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">输出规则决定取其期望、中位数还是密度峰</text><rect x="75.0" y="1240.0" width="760.0" height="85.0" rx="10" fill="#F1E9F8" stroke="#785499" stroke-width="1.8"/><text x="455.0" y="1275.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">MAP 的目标为 log L + log π</text><text x="455.0" y="1305.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">先验改变不同候选参数的相对权重</text><rect x="960.0" y="825.0" width="230.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="1075.0" y="887.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">β 条件更新</text><text x="1075.0" y="918.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">从 p(β|η,γ,D)</text><text x="1075.0" y="950.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">抽取新的 β</text><rect x="1227.0" y="825.0" width="230.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="1342.0" y="888.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">η 条件更新</text><text x="1342.0" y="918.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">给定新 β、当前 γ</text><text x="1342.0" y="948.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">抽取新的 η</text><rect x="1494.0" y="825.0" width="230.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="1609.0" y="887.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">γ 条件更新</text><text x="1609.0" y="918.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">给定新 β、η</text><text x="1609.0" y="950.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">在允许域内抽取 γ</text><rect x="960.0" y="1110.0" width="764.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="1342.0" y="1153.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">由后验样本近似期望、中位数与区间</text><text x="1342.0" y="1183.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">Green 方案：Gibbs＋条件拒绝抽样；γ 更新也可构造 MH 核</text><rect x="960.0" y="1260.0" width="764.0" height="80.0" rx="10" fill="#EEF7FB" stroke="#367B98" stroke-width="1.8"/><text x="1342.0" y="1293.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">另一条计算路径：Laplace</text><text x="1342.0" y="1323.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">在后验峰附近作二次近似，再近似积分</text><rect x="540.0" y="1460.0" width="720.0" height="105.0" rx="10" fill="#F1E9F8" stroke="#785499" stroke-width="1.8"/><text x="900.0" y="1504.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="middle" font-weight="700">输出 θ̂=(β̂,η̂,γ̂)</text><text x="900.0" y="1540.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="middle" font-weight="700">由所选后验规则与相应计算共同确定</text><rect x="55.0" y="1590.0" width="1690.0" height="36.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="1615.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#243449" text-anchor="start">构造依据：方法工作稿 §5.3；Green 的条件抽样、后验均值决策与 Laplace 积分近似。</text><text x="307.0" y="416.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#785499" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">先验权重</text><text x="990.0" y="376.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#A75043" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">样本贡献</text><text x="1510.0" y="416.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">限定积分与抽样范围</text><text x="1340.0" y="1046.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#2C7B61" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">循环更新，形成联合后验样本</text><text x="410.0" y="1406.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#785499" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">所选规则</text><text x="1550.0" y="1518.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#2C7B61" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">计算后验量</text></svg>