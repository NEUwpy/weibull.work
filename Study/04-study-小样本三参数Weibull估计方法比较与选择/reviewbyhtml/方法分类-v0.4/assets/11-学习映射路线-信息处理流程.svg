<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1090" viewBox="0 0 1800 1090" role="img" aria-label="11-学习映射路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#347B68" stroke="#347B68" stroke-width="1.3"/></marker><marker id="arrow-open-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#347B68" stroke-width="1.3"/></marker><marker id="arrow-block-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#AE6C25" stroke="#AE6C25" stroke-width="1.3"/></marker><marker id="arrow-open-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#AE6C25" stroke-width="1.3"/></marker></defs><rect x="35.0" y="155.0" width="1730.0" height="445.0" rx="10" fill="#FCF6EE" stroke="#DFE6EB" stroke-width="1.8"/><rect x="35.0" y="700.0" width="1730.0" height="300.0" rx="10" fill="#F0F8F3" stroke="#DFE6EB" stroke-width="1.8"/><polyline points="355.0,347.5 425.0,347.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="675.0,347.5 745.0,347.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1025.0,347.5 1095.0,347.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1385.0,347.5 1455.0,347.5" fill="none" stroke="#AE6C25" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="205.0,410.0 205.0,465.0 1240.0,465.0 1240.0,410.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1595.0,285.0 1595.0,250.0 885.0,250.0 885.0,285.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1595.0,410.0 1595.0,480.0 1570.0,480.0 1570.0,505.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="355.0,877.5 445.0,877.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="745.0,877.5 835.0,877.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1190.0,877.5 1280.0,877.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1570.0,570.0 1570.0,655.0 1012.5,655.0 1012.5,825.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">学习映射｜先用多组样本训练，再对新样本执行固定映射</text><rect x="45.0" y="95.0" width="1710.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="131.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">训练时通过参数标签学习估计函数；使用时沿用相同特征表示与已训练权重。</text><rect x="60.0" y="170.0" width="1670.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="72.0" y="207.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">训练：样本和参数标签共同确定映射</text><rect x="55.0" y="285.0" width="300.0" height="125.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="205.0" y="325.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">多组训练样本 Dⱼ</text><text x="205.0" y="355.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">及对应参数 θⱼ</text><text x="205.0" y="385.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">来自模拟或标注</text><rect x="425.0" y="285.0" width="250.0" height="125.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="550.0" y="340.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">提取统一特征</text><text x="550.0" y="370.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">T(Dⱼ)</text><rect x="745.0" y="285.0" width="280.0" height="125.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="885.0" y="340.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">用当前映射预测</text><text x="885.0" y="370.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">θ̂ⱼ=hφ(T(Dⱼ))</text><rect x="1095.0" y="285.0" width="290.0" height="125.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="1240.0" y="340.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">预测与真值对照</text><text x="1240.0" y="370.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">计算参数预测损失 ℒ(φ)</text><rect x="1455.0" y="285.0" width="280.0" height="125.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="1595.0" y="340.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">按损失更新权重 φ</text><text x="1595.0" y="370.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">继续下一轮训练</text><rect x="1405.0" y="505.0" width="330.0" height="65.0" rx="10" fill="#FFF0DA" stroke="#AE6C25" stroke-width="1.8"/><text x="1570.0" y="546.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">训练结束，固定 φ*</text><rect x="60.0" y="715.0" width="1670.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="72.0" y="752.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">使用：当前新样本只经过一次固定映射</text><rect x="55.0" y="825.0" width="300.0" height="105.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="205.0" y="887.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">输入新样本 D</text><rect x="445.0" y="825.0" width="300.0" height="105.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="595.0" y="887.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">沿用同一特征 T(D)</text><rect x="835.0" y="825.0" width="355.0" height="105.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="1012.5" y="887.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">执行固定映射 hφ*</text><rect x="1280.0" y="825.0" width="455.0" height="105.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="1507.5" y="887.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">输出 β̂、η̂、γ̂</text><rect x="55.0" y="1020.0" width="1690.0" height="45.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="1051.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">这里的映射直接输出参数；学习中间权重或修正量时，再接入相应统计估计器。</text><text x="640.0" y="471.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">对应的参数标签 θⱼ</text><text x="1240.0" y="256.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">更新映射，再预测</text><text x="1260.0" y="661.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">带入已训练权重</text></svg>