<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-label="09-统计关系反演路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#347B68" stroke="#347B68" stroke-width="1.3"/></marker><marker id="arrow-open-347B68" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#347B68" stroke-width="1.3"/></marker></defs><polyline points="290.0,455.0 360.0,455.0" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="620.0,455.0 675.0,455.0 675.0,277.5 730.0,277.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1030.0,277.5 1110.0,277.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="620.0,455.0 675.0,455.0 675.0,477.5 730.0,477.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1030.0,477.5 1110.0,477.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="620.0,455.0 675.0,455.0 675.0,677.5 730.0,677.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1030.0,677.5 1110.0,677.5" fill="none" stroke="#347B68" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1440.0,277.5 1480.0,277.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1440.0,477.5 1480.0,477.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><polyline points="1440.0,677.5 1480.0,677.5 1480.0,457.5 1520.0,457.5" fill="none" stroke="#347B68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-347B68)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">统计关系反演｜提取统计量，再由参数关系逐步确定未知量</text><rect x="45.0" y="95.0" width="1710.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="131.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">先明确统计量保留哪些参数信息，再选择匹配、统计量似然或条件线性组合。</text><rect x="50.0" y="380.0" width="240.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="170.0" y="448.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">输入寿命样本 D</text><text x="170.0" y="479.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">提取所需观测</text><rect x="360.0" y="380.0" width="260.0" height="150.0" rx="10" fill="#F1F7FA" stroke="#347B68" stroke-width="1.8"/><text x="490.0" y="448.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">选取这类方法使用的</text><text x="490.0" y="479.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">样本表示与理论关系</text><rect x="730.0" y="200.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#347B68" stroke-width="1.8"/><text x="880.0" y="255.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">矩／分位数等统计量</text><text x="880.0" y="285.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">接入总体参数关系</text><text x="880.0" y="315.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">通过差值、比值等消元</text><rect x="1110.0" y="200.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="1275.0" y="255.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">反演统计关系</text><text x="1275.0" y="285.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">显式反解或解匹配方程</text><text x="1275.0" y="315.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">再用剩余关系恢复参数</text><rect x="730.0" y="400.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#347B68" stroke-width="1.8"/><text x="880.0" y="455.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">不变统计量 W／V</text><text x="880.0" y="485.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">W 消去位置与尺度</text><text x="880.0" y="515.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">V 只消去位置</text><rect x="1110.0" y="400.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="1275.0" y="455.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">最大化统计量联合密度</text><text x="1275.0" y="485.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">W 定 β；V 初始定 η、β</text><text x="1275.0" y="515.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">保留 β，再恢复其余参数</text><rect x="730.0" y="600.0" width="300.0" height="155.0" rx="10" fill="#F6F9FB" stroke="#347B68" stroke-width="1.8"/><text x="880.0" y="655.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">条件位置统计量</text><text x="880.0" y="685.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">给定 β、η 构造无偏量</text><text x="880.0" y="715.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">未知时用临时参数代入</text><rect x="1110.0" y="600.0" width="330.0" height="155.0" rx="10" fill="#FFFFFF" stroke="#347B68" stroke-width="1.8"/><text x="1275.0" y="655.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">按条件协方差选权</text><text x="1275.0" y="685.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">线性组合得到 γ̂</text><text x="1275.0" y="715.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">代入时与参数恢复迭代</text><rect x="1520.0" y="380.0" width="230.0" height="155.0" rx="10" fill="#EAF4EE" stroke="#347B68" stroke-width="1.8"/><text x="1635.0" y="435.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">结合已知、代入</text><text x="1635.0" y="466.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">及恢复的参数</text><text x="1635.0" y="497.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">组成三参数估计</text><rect x="55.0" y="795.0" width="1690.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="836.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">显式恢复直接给出结果；参数尚未知时，可把条件估计与其他参数的恢复步骤组合迭代。</text></svg>