<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1650" viewBox="0 0 1800 1650" role="img" aria-label="05-学习映射路线-机制图"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-2C7B61" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#2C7B61" stroke="#2C7B61" stroke-width="1.3"/></marker><marker id="arrow-open-2C7B61" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#2C7B61" stroke-width="1.3"/></marker><marker id="arrow-block-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#AE6C25" stroke="#AE6C25" stroke-width="1.3"/></marker><marker id="arrow-open-AE6C25" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#AE6C25" stroke-width="1.3"/></marker><marker id="arrow-block-C24F3E" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#C24F3E" stroke="#C24F3E" stroke-width="1.3"/></marker><marker id="arrow-open-C24F3E" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#C24F3E" stroke-width="1.3"/></marker></defs><rect x="40.0" y="165.0" width="1720.0" height="625.0" rx="10" fill="#FCF6EE" stroke="#DFE6EB" stroke-width="1.8"/><rect x="40.0" y="875.0" width="1720.0" height="395.0" rx="10" fill="#F0F8F3" stroke="#DFE6EB" stroke-width="1.8"/><polyline points="320.0,372.5 395.0,372.5" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="650.0,372.5 725.0,372.5" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="980.0,372.5 1055.0,372.5" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1310.0,372.5 1385.0,372.5" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="192.5,445.0 192.5,640.0 1055.0,640.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1527.5,445.0 1527.5,530.0 1362.5,530.0 1362.5,590.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="1055.0,640.0 1015.0,640.0 1015.0,505.0 1182.5,505.0 1182.5,445.0" fill="none" stroke="#C24F3E" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-block-C24F3E)"/><polyline points="1362.5,690.0 1362.5,735.0 1020.0,735.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><polyline points="400.0,1087.5 500.0,1087.5" fill="none" stroke="#2C7B61" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="830.0,1087.5 930.0,1087.5" fill="none" stroke="#2C7B61" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="1290.0,1087.5 1390.0,1087.5" fill="none" stroke="#2C7B61" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#arrow-block-2C7B61)"/><polyline points="702.5,765.0 702.5,830.0 1110.0,830.0 1110.0,1020.0" fill="none" stroke="#AE6C25" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-AE6C25)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">学习映射｜多组样本训练估计函数，新样本执行固定映射</text><rect x="45.0" y="90.0" width="1710.0" height="45.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="120.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">训练阶段学习网络权重 φ；使用阶段把新样本的相同特征直接映射为分布参数。</text><rect x="65.0" y="185.0" width="1630.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="225.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">训练阶段：同时看到样本与对应参数</text><rect x="65.0" y="300.0" width="255.0" height="145.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="192.5" y="350.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">参数标签 θⱼ</text><text x="192.5" y="380.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">βⱼ、ηⱼ、γⱼ</text><text x="192.5" y="410.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">与样本量 nⱼ</text><rect x="395.0" y="300.0" width="255.0" height="145.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="522.5" y="350.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">训练样本 Dⱼ</text><text x="522.5" y="380.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">来自模拟或标注</text><text x="522.5" y="410.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">每组对应一组参数</text><rect x="725.0" y="300.0" width="255.0" height="145.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="852.5" y="350.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">统一的特征 T(Dⱼ)</text><text x="852.5" y="380.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">如排序值、分位数</text><text x="852.5" y="410.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">或汇总统计量</text><rect x="1055.0" y="300.0" width="255.0" height="145.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="1182.5" y="350.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">参数映射 hφ</text><text x="1182.5" y="380.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">网络把特征组合</text><text x="1182.5" y="410.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">转换为参数预测</text><rect x="1385.0" y="300.0" width="285.0" height="145.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="1527.5" y="365.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">训练样本的预测</text><text x="1527.5" y="395.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="middle">θ̂ⱼ = hφ(T(Dⱼ))</text><rect x="1055.0" y="590.0" width="615.0" height="100.0" rx="10" fill="#FFF0DA" stroke="#AE6C25" stroke-width="1.8"/><text x="1362.5" y="632.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">逐样本对照预测与真值</text><text x="1362.5" y="666.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">ℒ(φ) = 平均ⱼ ℓ(θ̂ⱼ, θⱼ)</text><rect x="385.0" y="705.0" width="635.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AE6C25" stroke-width="1.8"/><text x="702.5" y="744.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">训练结束，固定映射 hφ*</text><rect x="65.0" y="895.0" width="1630.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="77.0" y="935.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">使用阶段：一组新样本走一次映射</text><rect x="70.0" y="1020.0" width="330.0" height="135.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="235.0" y="1080.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">新寿命样本 D</text><text x="235.0" y="1113.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">当前观测值</text><rect x="500.0" y="1020.0" width="330.0" height="135.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="665.0" y="1080.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">沿用相同特征定义</text><text x="665.0" y="1113.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">T(D)</text><rect x="930.0" y="1020.0" width="360.0" height="135.0" rx="10" fill="#FFFFFF" stroke="#2C7B61" stroke-width="1.8"/><text x="1110.0" y="1080.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">固定的估计函数</text><text x="1110.0" y="1113.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle" font-weight="700">hφ*(T(D))</text><rect x="1390.0" y="1020.0" width="310.0" height="135.0" rx="10" fill="#E7F3EB" stroke="#2C7B61" stroke-width="1.8"/><text x="1545.0" y="1079.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">输出三个参数</text><text x="1545.0" y="1114.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="middle" font-weight="700">β̂、η̂、γ̂</text><rect x="75.0" y="1195.0" width="1610.0" height="48.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="87.0" y="1227.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24.0" fill="#243449" text-anchor="start">训练域给出所学映射的参数范围；特征与损失决定映射怎样利用信息、重视哪种误差。</text><rect x="55.0" y="1345.0" width="1690.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="1382.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29.0" fill="#243449" text-anchor="start" font-weight="700">映射、辅助学习与数值搜索在估计中的作用位置</text><rect x="65.0" y="1440.0" width="490.0" height="120.0" rx="10" fill="#FCF6EE" stroke="#AE6C25" stroke-width="1.8"/><text x="310.0" y="1492.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">直接参数映射</text><text x="310.0" y="1526.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">T(D) → hφ → θ̂</text><rect x="655.0" y="1440.0" width="490.0" height="120.0" rx="10" fill="#F7F2FA" stroke="#785499" stroke-width="1.8"/><text x="900.0" y="1477.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">学习中间量</text><text x="900.0" y="1508.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">T(D) → 权重／修正量 → 统计估计器 → </text><text x="900.0" y="1540.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">θ̂</text><rect x="1245.0" y="1440.0" width="490.0" height="120.0" rx="10" fill="#F4F7FA" stroke="#64748B" stroke-width="1.8"/><text x="1490.0" y="1493.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">当前样本的数值求解</text><text x="1490.0" y="1524.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">固定 Q(θ;D) → PSO／SA 搜索 → θ̂</text><rect x="55.0" y="1590.0" width="1690.0" height="36.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="1615.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21.0" fill="#243449" text-anchor="start">构造依据：方法工作稿 §5.4 的直接ANN/BPNN、过程量学习与既定目标搜索的作用位置。</text><text x="640.0" y="646.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">对应的真参数标签</text><text x="1530.0" y="536.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">预测误差</text><text x="1135.0" y="511.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#C24F3E" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">按损失更新 φ</text><text x="1110.0" y="836.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20.0" fill="#AE6C25" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">携带训练得到的固定权重</text></svg>