<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="730" viewBox="0 0 1800 730" role="img" aria-label="10-后验推断路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-785499" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#785499" stroke="#785499" stroke-width="1.3"/></marker><marker id="arrow-open-785499" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#785499" stroke-width="1.3"/></marker></defs><polyline points="340.0,315.0 420.0,315.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="750.0,315.0 830.0,315.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1115.0,315.0 1195.0,315.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1480.0,315.0 1560.0,315.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="585.0,500.0 585.0,390.0" fill="none" stroke="#785499" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><rect x="45.0" y="20.0" width="1710.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="62.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">后验推断｜样本与先验形成后验，再按所选规则给出估计</text><rect x="45.0" y="95.0" width="1710.0" height="55.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="131.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">联合后验确定参数的不确定性；输出规则决定需要计算哪一个后验量。</text><rect x="55.0" y="240.0" width="285.0" height="150.0" rx="10" fill="#F8F3FB" stroke="#785499" stroke-width="1.8"/><text x="197.5" y="308.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">输入观测 D</text><text x="197.5" y="339.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">形成样本似然 L(θ|D)</text><rect x="420.0" y="240.0" width="330.0" height="150.0" rx="10" fill="#F8F3FB" stroke="#785499" stroke-width="1.8"/><text x="585.0" y="308.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">结合参数先验与支持域</text><text x="585.0" y="339.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">p(θ|D) ∝ L(θ|D)π(θ)</text><rect x="830.0" y="240.0" width="285.0" height="150.0" rx="10" fill="#F8F3FB" stroke="#785499" stroke-width="1.8"/><text x="972.5" y="292.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">选择后验输出规则</text><text x="972.5" y="323.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">均值／逐参数中位数</text><text x="972.5" y="355.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">或联合 MAP</text><rect x="1195.0" y="240.0" width="285.0" height="150.0" rx="10" fill="#F8F3FB" stroke="#785499" stroke-width="1.8"/><text x="1337.5" y="292.5" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">计算所选后验量</text><text x="1337.5" y="323.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">积分、抽样、近似</text><text x="1337.5" y="355.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">或密度峰优化</text><rect x="1560.0" y="240.0" width="190.0" height="150.0" rx="10" fill="#EEE2F6" stroke="#785499" stroke-width="1.8"/><text x="1655.0" y="308.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">得到参数估计</text><text x="1655.0" y="339.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle" font-weight="700">β̂、η̂、γ̂</text><rect x="435.0" y="500.0" width="300.0" height="105.0" rx="10" fill="#FFFFFF" stroke="#785499" stroke-width="1.8"/><text x="585.0" y="545.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">已有信息与参数范围</text><text x="585.0" y="576.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">先验 π(θ) 及允许域</text><rect x="55.0" y="650.0" width="1690.0" height="45.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="67.0" y="681.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">后验均值取期望；逐参数中位数取边缘分位数；MAP取联合后验密度的峰。</text></svg>