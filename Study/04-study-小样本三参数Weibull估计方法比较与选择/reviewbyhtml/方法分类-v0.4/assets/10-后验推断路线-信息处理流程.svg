<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1110" viewBox="0 0 2000 1110" role="img" aria-label="10-后验推断路线-信息处理流程"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow-block-785499" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="#785499" stroke="#785499" stroke-width="1.3"/></marker><marker id="arrow-open-785499" markerWidth="15" markerHeight="14" refX="14" refY="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L14 7 L1 13" fill="none" stroke="#785499" stroke-width="1.3"/></marker></defs><polyline points="590.0,365.0 730.0,365.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1270.0,365.0 1410.0,365.0" fill="none" stroke="#785499" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1680.0,470.0 1680.0,580.0 600.0,580.0 600.0,700.0" fill="none" stroke="#785499" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><polyline points="1680.0,470.0 1680.0,625.0 1560.0,625.0 1560.0,700.0" fill="none" stroke="#785499" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-block-785499)"/><rect x="45.0" y="20.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="64.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35.0" fill="#243449" text-anchor="start" font-weight="700">后验推断｜用先验重加权似然，再以损失或密度峰决定估计</text><rect x="45.0" y="100.0" width="1910.0" height="65.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="57.0" y="141.2" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">先构造完整的参数后验；所选后验规则随后决定需要计算的目标。</text><rect x="50.0" y="190.0" width="1900.0" height="50.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="224.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28.0" fill="#243449" text-anchor="start" font-weight="700">后验怎样由观测和已有信息形成？</text><rect x="50.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#785499" stroke-width="1.8"/><text x="320.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">计算候选参数的样本支持</text><text x="320.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">L(θ|D)=∏ᵢfθ(xᵢ)</text><text x="320.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">π(θ)描述已有参数信息</text><text x="320.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">同时限定模型与先验的允许域</text><rect x="730.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#F7F9FC" stroke="#785499" stroke-width="1.8"/><text x="1000.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">将样本贡献与先验权重相乘</text><text x="1000.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">q(θ)=L(θ|D)π(θ)</text><text x="1000.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">观测和先验共同改变</text><text x="1000.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">不同候选参数的相对权重</text><rect x="1410.0" y="260.0" width="540.0" height="210.0" rx="10" fill="#EDF5EF" stroke="#785499" stroke-width="1.8"/><text x="1680.0" y="326.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">积分归一化为参数后验</text><text x="1680.0" y="358.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">Z=∫q(θ)dθ</text><text x="1680.0" y="389.4" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">p(θ|D)=q(θ)/Z</text><text x="1680.0" y="420.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="middle">积分在允许参数域内进行</text><rect x="95.0" y="700.0" width="1010.0" height="225.0" rx="10" fill="#F6F0FB" stroke="#785499" stroke-width="1.8"/><text x="600.0" y="771.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">后验损失最小化</text><text x="600.0" y="805.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">R(a|D)=∫损失(a,θ)p(θ|D)dθ</text><text x="600.0" y="838.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">选择a使后验平均损失最小</text><text x="600.0" y="872.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">平方损失→后验均值；逐参数绝对损失→边缘中位数</text><rect x="1215.0" y="700.0" width="690.0" height="225.0" rx="10" fill="#F6F0FB" stroke="#785499" stroke-width="1.8"/><text x="1560.0" y="771.3" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">后验密度最大化（MAP）</text><text x="1560.0" y="805.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">θ̂MAP=argmaxθ p(θ|D)</text><text x="1560.0" y="838.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">=argmaxθ[lnL(θ|D)+lnπ(θ)]</text><text x="1560.0" y="872.6" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27.0" fill="#243449" text-anchor="middle">选联合后验密度最高的候选</text><rect x="50.0" y="1000.0" width="1900.0" height="60.0" rx="10" fill="none" stroke="none" stroke-width="1.8"/><text x="62.0" y="1038.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25.0" fill="#243449" text-anchor="start">积分、Gibbs／MH抽样、Laplace近似或优化，是计算相应后验量的路径；参数选择依据来自上述规则。</text></svg>